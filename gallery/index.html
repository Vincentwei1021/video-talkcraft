bg 之上）</p><ul><li><strong>块比字大一圈的量</strong>：<code>padding: 10px 22px 12px</code> @84px 字号 ≈ 上下 12%、左右 26% 字号。</li></ul><p>  下 padding 比上多 2px——中文字的视觉重心偏上，等 padding 会读作&quot;字贴着块的下沿&quot;</p><ul><li><strong>第二行 <code>margin-left: -22px</code>（= 块的左 padding）</strong>：落定后第二行的<strong>字</strong>与第一行的字左端对齐，</li></ul><p>  而不是块与字对齐。块比字宽，块对齐会让两行的字看起来错开一截</p><ul><li><strong>层级</strong>：舞台白底 → 第一行（黑字）→ 第二行外层（静态斜切）→ 色块 bg（z 底）→ 白字（z 上）</li><li><strong>强调色只上在块上</strong>：<code>#e0452c</code>（参考图红系）。第一行是黑 <code>#1d1d1f</code>，白字是块上的反白——</li></ul><p>  全卡只有一个彩色元素，就是那个块</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>slabDur</code></td><td>0.22s</td><td>色块撑开时长，本卡的能量旋钮；&lt;0.14s 块像闪出来的（少了&quot;撑&quot;这个动作），&gt;0.35s 观众等着块开完、口播已经念过重点词了</td></tr><tr><td><code>gap</code></td><td>0.07s</td><td>第一行落定 → 色块起撑的呼吸；0 则两拍粘成一拍（读作&quot;两行一起出现&quot;），&gt;0.2s 两行断成两个动效</td></tr><tr><td><code>punchScale</code></td><td>1.12</td><td>白字 punch 起始倍数；&lt;1.06 punch 读不出（字只是出现），&gt;1.25 字会在块外露头一帧（块是硬边，露头一眼就是错）</td></tr><tr><td><code>punchDur</code></td><td>0.167s（5 帧）</td><td>punch 时长，<code>power3.out</code>；&gt;0.3s 读作&quot;字慢慢长大&quot;，砸的劲全泄了</td></tr><tr><td><code>l1Scale</code></td><td>1.04</td><td>第一行起始倍数，<strong>必须小</strong>；&gt;1.08 第一行变成弹窗，抢第二行的重点位</td></tr><tr><td><code>l1Dur</code></td><td>0.18s</td><td>第一行硬现时长；&gt;0.3s 第一行成了主角，观众的注意力落在铺垫句上</td></tr><tr><td>斜切角</td><td>-2.5°（CSS 静态）</td><td>块的倾斜量；0 读作规整的排版色块（&quot;设计感&quot;没了但也成立），&gt;-6° 块开始撞第一行的下缘，且中文字被斜得难读</td></tr><tr><td>padding</td><td>10/22/12 px @84px</td><td>&quot;块比字大一圈&quot;的量；左右 &lt;14px 字贴块边（像被裁了），&gt;34px 块空得像一个色条</td></tr><tr><td><code>hold</code></td><td>1.6s</td><td>收尾定格——块 + 字的成品版式就是落点，按重点词字数给（每字约 0.4s，读完再留半拍）</td></tr></table><h3>已知坑</h3><ul><li>字和块同时出现（或字先在、块从底下长出来）——读作&quot;字被块追上&quot;，块降格成马克笔，本卡与 <code>highlighter-sweep</code> 无区别。</li><li>白字用淡入而不是硬切——块停和字出连成一段渐变，&quot;块先到、字后落&quot;这个断点消失，两拍变一拍。</li><li>斜切做成动画（落定后回正 / 落定后抖两下）——违反 design-language §4 的定格抖动禁项，而且回正会让观众以为块&quot;歪了又被修正&quot;，斜切从形状属性变成了错误状态。</li><li>色块用 <code>width: 0 → 100%</code> 而不是 <code>scaleX</code>——改 width 每帧触发重排，块内的字会跟着一帧一帧挤动，慢放下一眼假（<code>scaleX</code> 只走合成层）。</li><li>色块从左展开（<code>transform-origin: 0% 50%</code>）——那是 <code>alt-block-lines</code> 的&quot;刷出&quot;语言，配上&quot;块停字砸&quot;的时序会读作两张卡缝在一起：从左展开的块观众预期字跟着刷出来，结果字是砸出来的。</li><li>第二行按<strong>块</strong>与第一行左对齐（忘了 <code>margin-left</code> 抵掉块的 padding）——两行的字看起来错开 22px，标题的左基线塌了。</li><li>白字 <code>transform-origin</code> 取左端——1.12 倍的 punch 会往右长出块外一帧；取 <code>50% 50%</code> 才是&quot;在块里原地砸&quot;。</li><li>第一行给 y 位移——它立刻变成一个入场动效，与第二行的&quot;块 + 砸&quot;两个动效并列，一屏两个重点，散。</li><li>块的强调色同时用在第一行的字上（想&quot;呼应&quot;）——违反 design-language §1 的唯一强调色红线，且第一行一变色就与第二行争&quot;哪个是重点&quot;。</li><li><code>padding</code> 上下等值——中文字视觉重心偏上，等 padding 读作字贴着块的下沿；下 padding 要比上多 2~3px。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/slab-punch-title/index.html。<strong>换文案改两处 HTML 文本</strong>（<code>#spL1</code> 的铺垫词 2~4 字、</li></ul><p>  <code>#spL2</code> 的重点词 2~5 字）——块宽由字自动撑出，不用改任何常量。   换强调色改 <code>.sp-slab-bg</code> 的 <code>background</code> 一处（红 <code>#e0452c</code> / 紫 <code>#7A5AF8</code> / 青 <code>#0aa3a3</code> 任取其一）。   换字号改 <code>.sp-l1</code> 与 <code>.sp-l2-t</code> 的 <code>font-size</code>（两处必须同值），同时把 <code>.sp-slab</code> 的 padding   与 <code>.sp-l2</code> 的 <code>margin-left</code>（= 左 padding 的负值）按比例缩放。   能量只调 <code>slabDur</code>；<code>punchDur</code> 是手感常量（5 帧），换尺寸换语速都不要动。</p><ul><li>Remotion 移植：三拍串行，用一个 <code>frame</code> 时钟 + 三段 <code>interpolate</code> 就够，不用建时间线。</li></ul><p>  30fps 换算：<code>lead 12f</code>、<code>l1Dur 5.4f≈5f</code>、<code>gap 2f</code>、<code>slabDur 6.6f≈7f</code>、<code>punchDur 5f</code>。   <strong>块与字必须是两个 <code>&lt;div&gt;</code></strong>：块 <code>transform: scaleX(interpolate(f, [26,33], [0,1], {easing: Easing.out(Easing.cubic), extrapolateLeft:'clamp', extrapolateRight:'clamp'}))</code>；   字 <code>opacity: f &lt; 33 ? 0 : 1</code>（三元硬切，<strong>不要写成 interpolate</strong>——interpolate 出来的是淡入）+   <code>scale: interpolate(f, [33,38], [1.12,1], {...clamp})</code>。斜切写在最外层容器的静态 style 上，   不进任何 interpolate。</p><ul><li>剪辑软件对应物：剪映/CapCut——一个文本层（第一行）+ 一个色块贴纸（旋转 -2.5°）+ 一个文本层（重点词）。</li></ul><p>  色块用&quot;缩放&quot;关键帧 0% → 100%（<strong>锚点要设中心</strong>，剪映默认就是中心，这条恰好对）；   重点词的&quot;不透明度&quot;打两个<strong>同值不同帧</strong>的硬切键（0 → 0 → 100，中间两键只差 1 帧）再叠&quot;缩放&quot;112% → 100%。   剪映的入场预设里没有&quot;块撑开 + 字砸&quot;这个组合，必须手打关键帧。   AE——色块层 <code>Scale</code> 只改 X 通道（解锁等比）0 → 100，<code>Anchor Point</code> 在块中心；   文字层 <code>Opacity</code> 用 <code>Hold</code> 关键帧（右键 → Toggle Hold Keyframe）做硬切，   <code>Scale</code> 112 → 100 配 <code>Easy Ease Out</code> 再把手柄拉到底。</p><ul><li>与本库同类卡的分工：<code>keyword-pop-highlight</code> = 字幕句子里砸一个词（词在句中，色块跟着词跑）；</li></ul><p>  <code>highlighter-sweep</code> = 荧光笔扫过已经在屏上的字（字先在、色后到，低能量）；   <code>alt-block-lines</code> = 两行各坐一个块、块刷出字（对句关系，块从左展开）；   <code>speed-slab-title</code> = 块从画外冲入 + 速度线残影（同样是&quot;块 + 标题&quot;，但语义是速度不是重量）；   <strong>本卡 = 一句话里&quot;前半铺垫 / 后半结论&quot;的两行标题</strong>，块是结论的容器，punch 是结论的落地声。</p><h3>动效范围</h3><ul><li>属于本卡的：「块先到位、字后落」这条时序纪律（白字的起点 = 色块 tween 的结束帧，不许交叠）；色块 <code>scaleX 0→1</code> 从<strong>中心</strong>撑开这个方向；白字 opacity 的<strong>硬切</strong>（0 帧，不淡入）+ 同帧 <code>scale 1.12→1</code> 的 5 帧 punch；第一行 <code>scale 1.04→1</code> 无位移的&quot;硬现&quot;（1.04 这个&quot;读不出的厚度&quot;量级）；<code>gap 0.07s</code> 这个两行之间的呼吸；三拍串行、每拍只有一个主角这个结构；块的斜切是<strong>静态形状属性</strong>（GSAP 不碰）这条实现纪律；DOM 三层分工（静态斜切层 / padding 层 / bg 与字兄弟层）；<code>transform-origin</code> 的取法（第一行取左端护住左基线、白字取中心防露头、块取中心）。</li><li>不属于本卡的：demo 那句「找到 / 关键点」的具体文案、84px 字号与 700 字重、<code>#e0452c</code> 这个红（换成紫/青/橙同样成立，参考图本身也只是一个色系样本）、-2.5° 这个具体角度（-1.5°~-4° 都成立，0° 也成立只是少了手作感）、<code>padding: 10/22/12</code> 这组具体像素（比例是上下 12% / 左右 26% 字号）、块的 4px 圆角、右侧主持人（数字人）占位、以及&quot;标题落在左侧白区、左边距 72px&quot;这个落位（居中、下三分之一都成立）。</li><li>迁移接口：内容入口是两段纯文本（铺垫 2~4 字 / 重点 2~5 字），块宽自动贴合不需要量宽；能量只调 <code>slabDur</code>（0.14~0.35s），<code>punchDur</code> 与 <code>punchScale</code> 是手感常量不要动；换字号时 <code>font-size</code>（两处同值）、<code>.sp-slab</code> 的 padding、<code>.sp-l2</code> 的 <code>margin-left</code> 三者按同一比例缩放；换强调色只改 <code>.sp-slab-bg</code> 的 <code>background</code> 一处；<code>hold</code> 按重点词字数给（每字约 0.4s）；竖屏把字号收到 56~64px、两行的 <code>gap</code> 从 14px 收到 10px（本卡没有横向推挤，唯一约束是块的宽度不超过可用宽度的 88%——块是硬边，压到安全区外一眼就是错）。</li><li>底色要求：白底即可。深底也成立但要换实现——深底上第一行反白、白字块保持不变，此时&quot;白字在实色块上&quot;与&quot;白字在深底上&quot;的对比不够，块必须换成更亮的强调色（或给块加 1px 亮边）。<strong>渐变底与实拍花底不行</strong>：块是硬边矩形，底上的高频细节会让块边缘读作抠图毛边。</li></ul>","type-contrast-emphasis":"<h3>意图</h3><p>逐词弹跳字幕靠&quot;动得更大&quot;做重音，代价是整句都在跳、看久了廉价。字体对比走另一条路： <strong>重音靠字形气质的落差，不靠缩放弹跳</strong>——普通词是无衬线中字的&quot;叙述声&quot;，重音词切成 衬线斜体大字的&quot;引用声&quot;，两种声音一同屏，观众耳朵还没反应过来眼睛已经知道哪个词是重点。 命门：<strong>落差要够大</strong>（字号 1.5~2 倍 + 换字族，只放大不换族读作缩放素材、只换族不放大 远看分不出）、<strong>运动要够轻</strong>（0.15s 上滑淡入，加了回弹就退化成弹跳字幕，两种语言混用一眼假）、 <strong>一句只有一个重音</strong>（两个衬线大字互相打架，等于没有重音）。</p><h3>动效核心</h3><ul><li>整句按最终排版预占位：所有词先建 DOM、<code>opacity: 0</code> 占住位置，逐词追加时不回流</li><li><strong>所有词共一条基线</strong>（容器 <code>align-items: baseline</code>）：重音词的大字从共同基线往上长，</li></ul><p>  基线一动整句就散——这是本卡唯一的排版硬约束</p><ul><li>普通词：无衬线、字重 600、基准字号；入场 <code>opacity 0→1</code> + <code>scale 0.95→1</code>，0.1s <code>power2.out</code>，</li></ul><p>  <code>transform-origin: 50% 100%</code>（锚在基线，轻 pop 不推基线）。无回弹</p><ul><li>重音词 · 通道① 字形：切衬线族（Songti/STSong/Source Han Serif，西文 Georgia/Playfair）+</li></ul><p>  字号 ×1.5~2；中文没有真斜体，用 <code>skewX(-6~-10°)</code> 显式倾斜（各端一致，不靠合成斜体）</p><ul><li>重音词 · 通道② 色彩：字族不变，换全片唯一强调色 + 字重 800 + 字号 ×1.4~1.6</li><li>重音词入场：<code>y +14px→0</code> 从基线下方上滑回落，同帧 <code>scale 0.92→1</code> + 淡入，0.15s <code>power3.out</code>——</li></ul><p>  &quot;顶上来&quot;落定，不过冲</p><ul><li>两个通道是<strong>替代关系</strong>（同一个词二选一），不叠用：衬线斜体 + 强调色 + 放大三件套一起上读作贴纸花字</li><li>两种模式：<strong>追加式</strong>（已说的词保留，全句完成后定格，适合对照句式）/</li></ul><p>  <strong>接力式</strong>（只保留当前词，前词硬切消失，适合快节奏短句）</p><ul><li>层级：重音词可单独一行、压在素材或人物上——大字加白描边即可，其余词留在字幕行</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>--tc-base</code></td><td>30~34px（960 宽）</td><td>普通词基准字号，重音词字号由它派生；改这一个数就等比换尺寸</td></tr><tr><td><code>--tc-serif-scale</code></td><td>1.6</td><td>衬线重音词放大倍数；&lt;1.4 远看分不出层级、强调失效；&gt;2.1 一个词吃掉半行、整句读不成句</td></tr><tr><td><code>--tc-color-scale</code></td><td>1.5</td><td>换色重音词放大倍数；有颜色帮忙可比字形通道略收，1.3~1.6 都成立</td></tr><tr><td><code>obliqueDeg</code></td><td>−7°</td><td>中文斜体的显式倾斜角；0 则衬线大字读作&quot;标题&quot;而非&quot;重音&quot;，&lt;−12° 开始读作贴歪的贴纸</td></tr><tr><td><code>accentIn</code></td><td>0.15s</td><td>重音词入场；&gt;0.3s 读作 PPT 入场，&lt;0.08s 看不清是&quot;顶上来&quot;的</td></tr><tr><td><code>accentRise</code></td><td>14px（≈字号 30%）</td><td>上滑距离；0 则只剩淡入没有&quot;顶上来&quot;的劲，&gt;字号 60% 读作从下一行飞进来</td></tr><tr><td><code>wordIn</code></td><td>0.10s</td><td>普通词轻 pop；&gt;0.2s 跟不上语速，整句铺不完</td></tr><tr><td><code>wordFromScale</code></td><td>0.95</td><td>普通词起始倍数；&lt;0.85 或换成 <code>back.out</code> 立刻退化成弹跳字幕，本卡的克制感就没了</td></tr><tr><td><code>beat</code> 间距</td><td>0.2~0.7s 不等</td><td>词级语音时刻，抄 forced-alignment 直出；匀速排布立刻跑马灯</td></tr></table><h3>已知坑</h3><ul><li>只放大不换字族——纯缩放读作&quot;素材被拉大&quot;，不是重音；字体对比这张卡的本体就是<strong>换族</strong>。</li><li>只换字族不放大——白底小字上衬线/无衬线的差别远看几乎为零，静音刷视频抓不到重点。</li><li>重音词加 <code>back.out</code>/<code>elastic</code> 回弹——退化成 keyword-pop-highlight 的语言，气质对比与弹跳强调混用一眼假；本卡的重音必须&quot;稳稳顶上来&quot;。</li><li>中文重音词直接写 <code>font-style: italic</code>——多数中文字族没有斜体字形，浏览器合成斜体在各端形态不一致（甚至无效）；必须 <code>skewX</code> 显式倾斜。</li><li>各词没有共同基线（用 <code>align-items: center</code> 或让大字自己撑行高）——大字一来整行上下乱跳，观众读作排版 bug。</li><li>重音词左右不留外边距——倾斜后的衬线大字右上角外探，会压住相邻字；至少留 4px（或 0.15em）。</li><li>一句里两个以上重音词都上衬线大字——重音互相打架，等于没有重音（两个通道分给两个词也算两个重音）。</li><li>强调色不止一个——本卡的色彩通道必须复用全片唯一 accent，多一个颜色就成花字。</li></ul><h3>复用指引</h3><ul><li>与 keyword-pop-highlight 的分工：那张卡的重音要&quot;砸&quot;（scale 1.65 过冲 + 色块 + 整屏震动），本卡的重音要&quot;稳&quot;（字形气质落差 + 0.15s 轻上滑，不过冲）。同一句里<strong>只能选一张</strong>——回弹强调与气质对比同屏混用一眼假；同一片子里可按段落调性分用（高能段落走 keyword-pop-highlight，判断句/结论句走本卡）。见 references/cards/keyword-pop-highlight.md。</li><li>HTML/GSAP：demos/type-contrast-emphasis/index.html。换文案改 <code>CONFIG.words</code>（<code>w</code> 分词 + <code>beat</code> 词级语音时刻 + <code>emph: &quot;serif&quot; | &quot;color&quot;</code> 指定通道，不填即普通词）；换尺寸只改 CSS 变量 <code>--tc-base</code>；落差量级在 <code>--tc-serif-scale</code> / <code>--tc-color-scale</code>；强调色在 <code>.tc-word.emph-color</code> 的 <code>color</code>；手感在 <code>accentIn</code> / <code>accentRise</code> / <code>obliqueDeg</code>。核心可摘走部分 = <code>CONFIG</code> + <code>DemoShell.register</code> 回调内部。</li><li>Remotion 移植：普通词 <code>opacity: interpolate(frame, [b, b+3], [0, 1])</code> + <code>scale: interpolate(frame, [b, b+3], [0.95, 1])</code>（b = 该词语音帧，<code>extrapolate*: 'clamp'</code>，<code>transformOrigin: '50% 100%'</code>）；重音词同区间取 <code>[b, b+5]</code>，<code>y: interpolate(..., [14, 0], {easing: Easing.out(Easing.cubic)})</code> + <code>scale [0.92, 1]</code>，<code>transform</code> 里把 <code>skewX(-7deg)</code> 写成静态项（别让它参与插值）；字族/字号落差全在 style 常量里，不进插值；<code>beat</code> 由 whisper/forced-alignment 词级时间戳换算帧直接填入。接力式把前词 opacity 在 <code>bNext</code> 帧阶跃到 0。</li><li>剪辑软件对应物：剪映/CapCut——把重音词拆成独立文本轨，字体换成&quot;宋体/思源宋体&quot;并开倾斜、字号调到 1.5~2 倍，入场用&quot;渐显 + 向上滑入&quot;（关掉所有弹跳/花字预设）；AE——同一段文字用两个 Text Animator（一个 Range Selector 只作用普通词做 scale 0.95→1，一个只作用重音词做 Position + Scale），字族落差用 Source Text 关键帧或直接分层，倾斜用 Skew 属性；剪映的&quot;文字模板&quot;类预设一律不能用（自带弹跳与花字，破坏本卡的克制感）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：逐词追加的入场时序（词级语音时刻驱动，间距不均匀）；普通词轻 pop（opacity 0→1 + scale 0.95→1、0.1s、power2.out、origin 锚基线、<strong>无回弹</strong>）；重音词入场（y +14px→0 上滑回落 + scale 0.92→1 + 淡入、0.15s、power3.out、不过冲）；重音词的两个替代通道（① 换衬线族 + skewX 显式倾斜 + 字号 ×1.5~2；② 换唯一强调色 + 字号 ×1.4~1.6）与&quot;二选一不叠用&quot;的纪律；整句共一条基线且预占位不回流；一句只有一个重音；追加式 / 接力式两种保留模式。</li><li>不属于本卡的：主持人占位（数字人）、示例台词与分词、字幕落在右侧白区这个位置、<code>--tc-base</code> 32px 这个具体字号、宋体/PingFang 这两个具体字族（本卡要的是&quot;衬线 vs 无衬线&quot;的落差，不是某个字体）、<code>#0066cc</code> 这个具体强调色值、<code>#1d1d1f</code> 这个字色。</li><li>迁移接口：<code>beat</code> 换成目标音轨的词级时间戳；<code>--tc-base</code> 一个数等比换尺寸（<code>accentRise</code> 按字号 30% 同步缩放）；字族落差换成目标风格里的&quot;正文族 / 引用族&quot;一对（衬线↔无衬线、常规↔重型手写皆可，只要气质差异在缩略图尺寸下可辨）；色彩通道的 <code>color</code> 换成该项目的唯一 accent；深底或实拍花底把字色反过来（普通词白、重音词 accent）并给重音大字加 2~3px 描边保可读；<code>mode</code> 切 <code>&quot;relay&quot;</code> 走接力式（前词在下一词语音帧硬切消失）。</li><li>底色要求：白底即可（字形/字号落差与底色无关，是本卡最容易迁移的性质）。唯一硬要求是&quot;普通词与重音词的对比同时成立&quot;——花底上需给重音大字补描边，别让强调色掉进背景明度里。</li></ul>","alt-block-lines":"<h3>意图</h3><p>对句的难点是<strong>让两行读作一组而不是两条</strong>。最省事的做法是两行各自淡入、错峰一下—— 结果观众读到的是&quot;一行字，然后又一行字&quot;，两句之间的<strong>对照关系</strong>要靠文案自己去说。</p><p>这张卡把关系交给形式来说，两个手段： ① <strong>同结构反色</strong>——两行的块结构完全一样（一样的圆角、padding、字号、展开方式）， 只有明暗反过来（块1 实色 + 白字 / 块2 白底 + 黑字 + 1px 灰描边）。 &quot;同结构&quot;让它们是一组，&quot;反色&quot;让它们是一对。 ② <strong>块刷出字</strong>——文字不是自己淡入的，是被色块的右缘刷出来的。 两条轨同曲线、同时长、字滞后 2 帧，观众读作<strong>一个</strong>动作（一道色扫过，字跟着显形）， 而不是&quot;块展开 + 字淡入&quot;两个动作。</p><p>命门一条：<strong>文字必须被块&quot;刷&quot;出来（clip 跟随），不许块和字各自淡入</strong>。 块和字各自淡入的版本里，块在字的下面独立跑完，字在块上独立跑完—— 慢放下能看到&quot;字已经在了，块还没铺到那里&quot;，那一帧就是假的。 clip 跟随保证字的显形边缘<strong>永远落在块的右缘之后</strong>，物理上说得通。</p><h3>动效核心</h3><ul><li><strong>每行两条轨，是同一件事的两半</strong>：</li></ul><p>  - 轨① 色块：<code>scaleX 0 → 1</code>，<code>transform-origin: 0% 50%</code>（<strong>从左展开</strong>），<code>0.26s power3.out</code>   - 轨② 文字：<code>clip-path: inset(0 100% 0 0) → inset(0 0% 0 0)</code>（右侧的裁切量 100% → 0），     <strong>同曲线（<code>power3.out</code>）同时长（0.26s）</strong>，起点滞后 <code>0.067s</code>（2 帧 @30fps）   - 两条轨的曲线与时长必须完全一致：换了任一个，字的显形边缘就会与块的右缘&quot;错开又追回&quot;，     读作两个元素在赛跑</p><ul><li><strong>滞后 2 帧是这个卡的全部手感</strong>：0 帧则字的边缘与块的右缘完全重合（读作块本身带着字，</li></ul><p>  像一张色块 PNG 在展开）；&gt;5 帧则块已经铺完一截而字还没出来（读作&quot;块是块、字是字&quot;）。   2 帧刚好让字始终&quot;在块里面一点&quot;，物理上是&quot;油墨还没干&quot;的那点滞后</p><ul><li><strong>两行错峰 0.12s</strong>：小于 0.08s 两行读作一次展开（对句关系丢了）；</li></ul><p>  大于 0.25s 两行断成两个动效（&quot;一行字，然后又一行字&quot;，回到了要解决的问题）</p><ul><li><strong>同结构反色的实现纪律</strong>：两行共用 <code>.ab-row</code> 的全部结构（padding / 圆角 / origin / 时序），</li></ul><p>  只有两条 CSS 规则不同 —— <code>.ab-row.a</code> 的块是实色 + 白字，<code>.ab-row.b</code> 的块是白底 + 黑字 +   <code>box-shadow: inset 0 0 0 1px #d8d8d8</code>（<strong>用 inset shadow 而不是 border</strong>：   border 会改变元素盒模型尺寸，两行的块高就差 2px，&quot;同结构&quot;当场破掉）</p><ul><li><strong>块宽贴合各自文字</strong>：<code>.ab-row</code> 是 <code>inline-block</code>，宽度由文字撑出。</li></ul><p>  两行字数不同时块宽自然不同——这是参考图的构图特征（不是 bug），   两块等宽会读作&quot;表格的两个单元格&quot;</p><ul><li><strong>两块左对齐</strong>：<code>.ab-stack</code> 用 <code>align-items: flex-start</code>。左对齐是&quot;两句并列&quot;的骨架；</li></ul><p>  居中对齐会让两块成为一个居中的图形组（读作 logo 而不是对句）</p><ul><li><strong>DOM 三层</strong>：<code>.ab-row</code>（相对定位 + padding）→ <code>.ab-bg</code>（绝对定位铺满，唯一被 <code>scaleX</code> 的元素）</li></ul><p>  + <code>.ab-t</code>（相对定位压在 bg 之上，唯一被 <code>clip-path</code> 的元素）。   两个动画属性作用在两个不同元素上，互不干扰</p><ul><li><strong>层级</strong>：舞台白底 → 两行的 flex 列 → 每行：块 bg（z 底）→ 文字（z 上，被 clip）</li><li><strong>强调色只上在第一个块上</strong>：<code>#0aa3a3</code>（参考图青系）。第二个块是白底 + 灰描边 + 黑字——</li></ul><p>  全卡只有一个彩色元素</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>textLag</code></td><td>0.067s（2 帧）</td><td><strong>本卡命门</strong>，字相对块的滞后；0 则块与字边缘重合（读作一张色块 PNG 在展开），&gt;0.17s 块铺完一截字还没出（块和字变成两个物件）</td></tr><tr><td><code>dur</code></td><td>0.26s</td><td>单行展开时长（块与字共用），能量旋钮；&lt;0.16s 读作硬切揭示（&quot;刷&quot;这个动作没了），&gt;0.4s 观众等着一行开完、口播已经念到第二句</td></tr><tr><td>缓动</td><td><code>power3.out</code>（两轨同一条）</td><td>块与字<strong>必须同一条</strong>；块用 power3 字用 power2 立刻能看出两者边缘错开又追回，读作赛跑</td></tr><tr><td><code>rowStagger</code></td><td>0.12s</td><td>两行错峰；&lt;0.08s 两行读作一次展开（对句关系丢），&gt;0.25s 断成两个动效</td></tr><tr><td>两行 gap</td><td>16px（≈字号 24%）</td><td>两块之间的垂直间距；&lt;字号 12% 两块粘成一个色块组，&gt;字号 45% 读作两个独立标题</td></tr><tr><td>padding</td><td>11/24/13 px @66px</td><td>块比字大一圈的量；左右 &lt;14px 字贴块边（像被裁），&gt;34px 块空得像色条；下比上多 2px（中文视觉重心偏上）</td></tr><tr><td>描边（块2）</td><td><code>inset 0 0 0 1px #d8d8d8</code></td><td>白块的边界；<strong>必须用 inset shadow 不用 border</strong>（border 改盒模型，两行块高差 2px）；去掉则白块在白底上没有边界，第二行读作&quot;没有块&quot;</td></tr><tr><td><code>hold</code></td><td>1.8s</td><td>收尾定格——<strong>对句要停久</strong>，两行都读完才成&quot;对句&quot;；&lt;1.2s 观众只读了第一行</td></tr><tr><td>字数</td><td>每行 3~6 字</td><td>两行字数可以不等（块宽跟着不等，那是构图特征）；&gt;7 字块会长得压过安全区，且&quot;对句&quot;的对称感消失</td></tr></table><h3>已知坑</h3><ul><li>块和字各自淡入（省掉 clip 跟随）——慢放下能看到&quot;字已经在了，块还没铺到那里&quot;，一眼假；这是两个动效不是一个。</li><li>文字用 <code>opacity</code> 从左往右逐字淡入（想模拟&quot;刷&quot;）——逐字是离散的，块的右缘是连续的，两者永远对不上；<code>clip-path</code> 是唯一对得上的实现。</li><li>块与字用不同的缓动或不同的时长——字的显形边缘与块的右缘&quot;错开又追回&quot;，读作两个元素在赛跑。</li><li>滞后写成 0（字与块边缘完全重合）——读作一张带字的色块 PNG 在展开，&quot;刷出来&quot;这个动作消失。</li><li>块用 <code>width: 0 → 100%</code> 而不是 <code>scaleX</code>——改 width 每帧重排，块内的字会跟着一帧一帧挤动（而且 clip 的基准也在动，两者叠加后字会抽动）。</li><li>块从中心展开（<code>transform-origin: 50% 50%</code>）——那是 <code>slab-punch-title</code> 的语言，且从中心展开时&quot;右缘&quot;是往右跑的同时左缘往左跑，clip 跟随（只裁右侧）就对不上了。</li><li>第二行的白块用 <code>border: 1px</code> 而不是 <code>inset box-shadow</code>——border 参与盒模型，第二行的块比第一行高 2px、宽 2px，&quot;同结构反色&quot;当场破掉。</li><li>两块做成等宽（给固定 width 或 <code>align-items: stretch</code>）——读作表格的两个单元格，不是两句话。</li><li>两块居中对齐——成为一个居中的图形组（读作 logo），&quot;两句并列&quot;的骨架塌了。</li><li>两行都用实色块（只换色相，比如青块 + 橙块）——违反唯一强调色红线，而且两个实色块读作&quot;两个标签&quot;而不是一对；反色（实/虚）才是&quot;对&quot;。</li><li>第二行的黑字换成灰字（想做&quot;弱一点&quot;）——对句的两句是<strong>对等</strong>的，不是主次；灰字立刻读作&quot;注释&quot;。</li><li><code>rowStagger</code> 给到 0.3s 以上再配长 hold——两行之间空太久，观众读完第一行开始等，第二行来时已经不是&quot;对句&quot;而是&quot;补充&quot;。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/alt-block-lines/index.html。<strong>换文案改两处 HTML 文本</strong>（两个 <code>.ab-t</code> 各 3~6 字）——</li></ul><p>  块宽由字自动撑出，两行字数可以不等。   换强调色改一处：<code>.ab-row.a .ab-bg</code> 的 <code>background</code>（青 <code>#0aa3a3</code> / 紫 <code>#7A5AF8</code> / 红 <code>#e0452c</code> 任取）。   换字号改 <code>.ab-t</code> 的 <code>font-size</code>，同时按比例改 <code>.ab-row</code> 的 padding 与 <code>.ab-stack</code> 的 <code>gap</code>（约字号 24%）。   能量只调 <code>dur</code>；<code>textLag</code>（2 帧）与 <code>rowStagger</code>（0.12s）是手感常量，换尺寸换语速都不要动。   <strong>加第三行</strong>：直接在 <code>.ab-stack</code> 里再加一个 <code>.ab-row</code>（脚本按 <code>[data-bg]</code>/<code>[data-t]</code> 自动遍历，   错峰序列是运行时算的）——但三行以上就不是&quot;对句&quot;了，语义上该换 <code>line-by-line-slide</code>。</p><ul><li>Remotion 移植：<code>clip-path</code> 在 Remotion（Chromium）里完全可用——用模板字符串拼出</li></ul><p>  <code>clipPath = &quot;inset(0 &quot; + (100 - p * 100) + &quot;% 0 0)&quot;</code>，其中   <code>p = interpolate(f, [start + 2, start + 2 + 8], [0, 1], {easing: Easing.out(Easing.cubic), extrapolateLeft:'clamp', extrapolateRight:'clamp'})</code>。   30fps 换算：<code>lead 12f</code>、<code>dur 7.8f≈8f</code>、<code>rowStagger 3.6f≈4f</code>、<code>textLag 2f</code>。   <strong>块与字必须共用同一个 <code>easing</code> 常量</strong>（提成一个 <code>const EASE = Easing.out(Easing.cubic)</code> 传给两处），   这是&quot;同一件事&quot;的实现保证。块 <code>transform: scaleX(...)</code> + <code>transformOrigin: '0% 50%'</code>。   <code>extrapolateLeft: 'clamp'</code> 不能省——不 clamp 的话第二行在自己起点前会算出 <code>inset(0 130% 0 0)</code>，   Chrome 里负宽度的 clip 行为未定义。</p><ul><li>剪辑软件对应物：剪映/CapCut——每行做成&quot;色块贴纸 + 文本层&quot;两层，</li></ul><p>  色块打&quot;缩放&quot;X 通道 0 → 100（锚点设左边缘，剪映要在&quot;编辑-锚点&quot;里改）；   文字层套<strong>&quot;蒙版-线性&quot;</strong>（把蒙版旋转 90° 变成竖直边缘）并给蒙版位置打关键帧从右扫到左，   起点比色块晚 2 帧、时长与色块相同。第二行整组复制后错后 4 帧、把色块换成白色描边款。   <strong>剪映的&quot;擦除&quot;入场预设不要用</strong>——它是给整个层擦的，擦不出&quot;块在下、字在上、字跟着块的右缘&quot;这个关系。   AE——色块层 <code>Scale</code> X 通道 0 → 100（<code>Anchor Point</code> 移到左边缘）；   文字层加 <code>Linear Wipe</code>（<code>Wipe Angle</code> 270°、<code>Transition Completion</code> 100 → 0），   两层的关键帧用<strong>同一组 Easy Ease</strong> 且文字层整体后移 2 帧；两行做成两个预合成，第二个后移 4 帧。</p><ul><li>与本库同类卡的分工：<code>slab-punch-title</code> = 一行铺垫 + 一行重点，块<strong>从中心撑开</strong>且字<strong>砸</strong>出来（语义是结论的重量）；</li></ul><p>  <code>highlighter-sweep</code> = 荧光笔扫过<strong>已经在屏上</strong>的字（字先在、色后到，块在字下层且半透明）；   <code>line-by-line-slide</code> = 多行依次滑入（3 行以上的列表/段落，无块无反色）；   <code>type-contrast-emphasis</code> = 一句里靠字体气质砸重音（无块）；   <strong>本卡 = 两句对照关系的可视化</strong>，特征是&quot;同结构反色&quot;+&quot;块刷出字&quot;，   它不做强调（两句对等），做的是<strong>关系</strong>。</p><h3>动效范围</h3><ul><li>属于本卡的：文字必须被色块的右缘&quot;刷&quot;出来这条纪律——<code>clip-path: inset()</code> 与块的 <code>scaleX</code> <strong>同曲线、同时长、滞后 2 帧</strong>（<code>textLag 0.067s</code> 这个&quot;油墨没干&quot;的量级）；块 <code>transform-origin: 0% 50%</code> 从左展开这个方向；两行错峰 <code>0.12s</code>（&quot;一组&quot;与&quot;两条&quot;之间的窗口）；同结构反色表达对句关系（两行共用全部结构参数，只有明暗相反；白块用 <strong>inset shadow 而非 border</strong> 以保证盒模型一致）；块宽各自贴合文字（两行不等宽是构图特征）+ 两块左对齐；DOM 三层分工（padding 层 / 唯一被 scaleX 的 bg / 唯一被 clip 的字）；<code>hold 1.8s</code> 这个&quot;对句要停到两行都读完&quot;的时长纪律。</li><li>不属于本卡的：demo 那两句「先做减法 / 再做加法」的具体文案、66px 字号与 700 字重、<code>#0aa3a3</code> 这个青（同色系任取）、白块描边的 <code>#d8d8d8</code> 这个灰阶、<code>padding: 11/24/13</code> 这组像素与 4px 圆角、两行 16px 的 gap、右侧主持人（数字人）占位、以及&quot;两行落在左侧白区、左边距 82px、垂直居中&quot;这个落位（下三分之一、居中都成立）。</li><li>迁移接口：内容入口是两段纯文本（各 3~6 字，字数可不等），块宽自动贴合不需要量宽；能量只调 <code>dur</code>（0.16~0.4s）；<code>textLag</code>（2 帧）与 <code>rowStagger</code>（0.12s）是手感常量，换尺寸换语速都不要动；换字号时 <code>font-size</code>、<code>.ab-row</code> 的 padding、<code>.ab-stack</code> 的 <code>gap</code>（字号 24%）按同一比例缩放；换强调色只改 <code>.ab-row.a .ab-bg</code> 一处；<code>hold</code> 按两行总字数给（每字约 0.2s，且不少于 1.2s）；行数可扩到 3 行（脚本自动遍历）但语义上就不再是对句；竖屏把字号收到 48~56px（本卡没有横向推挤，唯一约束是较长那行的块不超过可用宽度的 88%）。</li><li>底色要求：白底即可——<strong>第二行的&quot;白底黑字&quot;块依赖白底才成立</strong>（它是&quot;底色本身&quot;充当块，靠 1px 灰描边划出边界）。换深底时这个反色对必须整体重做：块1 用强调色 + 白字不变，块2 改成&quot;深底同色 + 白字 + 1px 亮边&quot;（即在深底上做同样的实/虚对比）。<strong>渐变底与实拍花底不行</strong>：白块靠 1px 灰描边定边界，底上任何高频细节都会把这条线吃掉，第二行会读作&quot;没有块&quot;。</li></ul>","count-badge-title":"<h3>意图</h3><p>&quot;三个方法解决问题&quot;这句话里，真正的信息只有一个字：<strong>3</strong>。观众记不住&quot;方法&quot;两个字， 但会记住&quot;有三条，我得听完&quot;。可绝大多数标题动效把这七个字当成一块整体淡入—— 七个字一样重，那个&quot;3&quot;就白给了，观众听完只剩一句模糊的&quot;他讲了几个方法&quot;。</p><p>本卡做的事是把<strong>数字变成主语</strong>：它先到、单独到、比其余字大一倍多、落定时还单独换色。 其余的字不是&quot;和它一起出现&quot;，而是<strong>被它带出来的</strong>——「个方法」从数字右缘被推着揭示， 第二行才跟上。这条时序把一句话的语法关系直接翻译成了画面的先后关系。</p><p>它和本库现有两张重音卡分工清楚：<code>keyword-pop-highlight</code> 是<strong>句子里砸一个词</strong> （正文先在、关键词后炸、带色块底和震屏，能量高、服务字幕）； <code>type-contrast-emphasis</code> 是<strong>靠字体/字重的静态对比</strong>分出主次（没有时序，是版式）； 本卡是<strong>标题级的数字重音</strong>——它不在句子里，它就是这一屏；靠的是&quot;先后&quot;而不是&quot;砸&quot;。</p><p>命门两条：① <strong>数字必须先到且单独到</strong>。三段同时淡入就没有&quot;3 个&quot;这个重音， 读作一个普通两行标题（本卡等于不存在）。② <strong>换色发生在落定那一帧，不在飞行途中</strong>。 飞着变色读作&quot;一路在闪&quot;；到位才亮才是&quot;这个数就是它了&quot;的确认。</p><h3>动效核心</h3><ul><li><strong>三段严格分先后，每段一个单一动作</strong>：</li></ul><p>  - ① 数字：<code>scale 1.6 → 1</code> + <code>opacity 0 → 1</code>，<code>0.30s power3.out</code>。     <strong>只有 scale + opacity，不带任何位移</strong>——重音是&quot;压下来&quot;不是&quot;飞进来&quot;；     <code>transform-origin: 50% 72%</code>（重心偏下，缩到位时数字不往上飘）   - ② 落定换色：<code>color: ink → accent</code>，<code>0.14s power1.out</code>，起点 = 落定时刻 − <code>0.07s</code>     （提前半个时长起，让&quot;到位&quot;与&quot;变色&quot;在观感上是同一帧）   - ③ 量词：<code>clip-path: inset(0 100% 0 0) → inset(0 0% 0 0)</code> + <code>x −8 → 0</code>，     <code>0.22s power3.out</code>，两条<strong>同曲线同时长</strong> ⇒ 读作一件事（被拖出来），     而不是&quot;揭示&quot;和&quot;位移&quot;两个动效；起点 = 落定 + <code>0.02s</code>（几乎贴着，才读作&quot;被带出来&quot;）   - ④ 第二行：<code>opacity 0 → 1</code> + <code>y 6 → 0</code>，<code>0.28s power3.out</code>，错峰 <code>0.10s</code>。     普通淡入上浮——它是补足语义的，<strong>不许抢重音</strong>   - ⑤ 收尾 punch：<code>scale 1 → 1.06</code>（<code>0.04s</code>）→ <code>1</code>（<code>0.13s power3.out</code>），共 5 帧 @30fps，     落在第二行落定后 <code>0.35s</code>（对齐口播念到重音的那一下）</p><ul><li><strong>层级只有两级</strong>：数字 <code>138px / 700</code>，其余全部 <code>62px / 600</code>。</li></ul><p>  「个方法」与第二行<strong>同一字阶</strong>是刻意的——三级字号会把&quot;其余的字&quot;内部也分出主次，   重音就散了（design-language §2：一屏文字层级 ≤3 级，本卡只用 2 级）</p><ul><li><strong><code>align-items: baseline</code></strong>：数字与量词共基线。数字再大也不许把行推歪；</li></ul><p>  用 <code>center</code> 对齐会让量词浮在数字中腰，读作两个不相干的元素</p><ul><li><strong><code>font-variant-numeric: tabular-nums</code></strong>：数字不跳宽（换成两位数 <code>12</code> 时排版不塌）</li><li><strong>700 字重全片只给这一处</strong>（design-language §2：700 = 砸字档，留给极特殊时刻）</li><li><strong>强调色只上在数字上</strong>，量词与第二行保持墨色 <code>#1d1d1f</code></li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>numScale</code></td><td>1.6</td><td>数字入场起始缩放，本卡的能量旋钮；1.4~1.8 是&quot;压下来&quot;的档；&gt;2 读作糊到镜头上（喜剧向），&lt;1.25 缩到位的行程太短、看不出这是个重音</td></tr><tr><td><code>numIn</code></td><td>0.30s</td><td>数字入场耗时；&lt;0.2s 读作硬现（少了&quot;压下来&quot;的过程），&gt;0.45s 数字在半空停太久、口播已经念完&quot;三个方法&quot;了</td></tr><tr><td><code>hueDur</code></td><td>0.14s</td><td>落定换色耗时；<strong>起点必须是落定时刻 − hueDur/2</strong>。&gt;0.3s 读作慢慢染色（丢掉&quot;确认&quot;的干脆），0 则硬切换色（可用，但少一点亮起的质感）</td></tr><tr><td><code>restLag</code></td><td>0.02s</td><td>量词相对数字落定的滞后，<strong>本卡第一命门的下半句</strong>；接近 0 才读作被数字带出来；&gt;0.15s 变成&quot;数字先出、量词再出&quot;两个动效</td></tr><tr><td><code>restIn</code></td><td>0.22s</td><td>量词揭示耗时；必须与 <code>x</code> 补偿同时长同曲线。&gt;0.35s 读作字被慢慢刷出来（那是 <code>highlighter-sweep</code> 的语言）</td></tr><tr><td><code>restX</code></td><td>−8px</td><td>量词起始横向偏移；<strong>负值</strong>（从数字那侧被拖出来）；0 则只有 clip 揭示（缺一点&quot;被带&quot;的惯性），&lt;−20 读作从数字里飞出来</td></tr><tr><td><code>l2Lag</code></td><td>0.10s</td><td>第二行错峰，<strong>本卡第二命门的量</strong>；&gt;0.25s 读作两个独立动效（上下两行没关系了），0 则与量词同时出、抢掉&quot;被带出来&quot;那一拍</td></tr><tr><td><code>l2Rise</code></td><td>6px</td><td>第二行上浮量；&gt;16px 位移感盖过&quot;跟上&quot;这个语义（第二行不该有自己的方向）</td></tr><tr><td><code>punchGap</code></td><td>0.35s</td><td>第二行落定到数字补拍的间隔；实拍里按口播重音落点调（这是唯一需要跟音频对齐的参数）</td></tr><tr><td><code>punchScale</code></td><td>1.06</td><td>补拍幅度；1.04~1.08（design-language §4 punch token）；&gt;1.15 读作第二次入场，观众以为动效重播了</td></tr><tr><td>数字位数</td><td>1~2 位</td><td>3 位以上（&quot;100个方法&quot;）数字宽度会挤掉量词，<code>numScale</code> 要降到 1.35 并把字号收到 110px</td></tr></table><h3>已知坑</h3><ul><li>三段同时淡入——&quot;3 个&quot;这个重音消失，读作一个普通两行标题，本卡等于没做。</li><li>数字入场带位移（从下飞上来 / 从左推入）——重音变成入场，&quot;数字是主语&quot;这层语义被方向感盖掉；只许 scale + opacity。</li><li>飞行途中就在变色——读作&quot;一路在闪&quot;；到位才亮才是确认。换色起点必须贴着落定帧。</li><li>量词与数字同帧出现——它就不是&quot;被带出来&quot;的了，两者读作一起淡入的两块字。</li><li>量词的 clip 与 x 用两条不同曲线/时长——慢放下能看出字先被刷出来、再单独滑一下，割裂。</li><li>量词字号做成第三级（比第二行小一点）——一屏三级字阶，&quot;其余的字&quot;内部又分了主次，重音散掉。</li><li>数字与量词用 <code>align-items: center</code>——量词浮在数字中腰，读作两个不相干的元素；必须共 baseline。</li><li>数字不加 <code>tabular-nums</code>——换成两位数后排版跳宽，量词的落位跟着变。</li><li>收尾 punch 做到 1.2 倍——读作动效重播了一次，观众会以为漏看了什么；punch 是&quot;顿一下&quot;不是&quot;再来一次&quot;。</li><li>强调色顺手也给量词或第二行上一点——一屏只有一个&quot;看这里&quot;（design-language §1 红线），数字的重音立刻被稀释。</li><li>用 700 字重给整屏——700 是本卡给数字的专属重量，全屏 700 就没有轻重了。</li><li>换成&quot;三&quot;这个汉字数字——汉字数字宽高与其余汉字一样，<code>numScale</code> 撑再大也读作&quot;一个大字&quot;，丢掉&quot;数量&quot;这个语义；本卡要阿拉伯数字。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/count-badge-title/index.html。换文案改三处文本：<code>.cb-num</code>（1~2 位阿拉伯数字）、</li></ul><p>  <code>.cb-rest</code>（量词，2~4 字）、<code>.cb-l2</code>（第二行，3~6 字）。   换强调色只改 <code>CONFIG.accent</code> 一个值。能量只调 <code>numScale</code>；   节奏只调 <code>l2Lag</code> 与 <code>punchGap</code>（前者是结构、后者跟音频）。   换字号时数字与其余字的<strong>比例要保持约 2.2:1</strong>（138:62），单独放大数字会压掉行距。   落位改 <code>.cb-text</code> 的 <code>left/top</code>（demo 让开右侧 42% 的主持人列）。</p><ul><li>Remotion 移植要点：五段各一组 <code>interpolate</code>，共用绝对帧号（30fps：起手 12 帧、</li></ul><p>  数字入场 9 帧、量词 7 帧、第二行 8 帧、punch 5 帧）：   数字 <code>scale = interpolate(frame, [12, 21], [1.6, 1], {easing: Easing.out(Easing.cubic)})</code>；   换色用 <code>interpolateColors(frame, [19, 23], [ink, accent])</code>（<strong>帧区间要跨过落定帧 21</strong>，   这就是&quot;提前 hueDur/2 起&quot;）；   量词 <code>clipPath = \\</code>inset(0 ${interpolate(frame,[22,29],[100,0])}% 0 0)\\`<code>（模板字符串拼百分比，   Remotion 里 clip-path 不能用 spring 直接插值对象）；   punch 用两段拼：</code>frame &lt; 45 ? interpolate(frame,[44,45],[1,1.06]) : interpolate(frame,[45,49],[1.06,1],{easing:Easing.out(Easing.cubic)})<code>。   全部 </code>extrapolateLeft/Right: 'clamp'`。</p><ul><li>剪辑软件对应物：剪映/CapCut——<strong>三个独立文本层</strong>（数字 / 量词 / 第二行），</li></ul><p>  数字层套&quot;入场：放大&quot;（把&quot;动画时长&quot;拉到 0.3s）；换色剪映做不到&quot;落定那一帧换&quot;，   取舍做法是<strong>两个数字层叠着</strong>（墨色的那层在落定帧硬切消失、强调色那层同帧出现，   0 帧交接肉眼就是&quot;到位变色&quot;）；量词层套&quot;入场：向右擦除&quot; 0.22s 并把 In 点放在数字层结束处；   punch 用&quot;关键帧·缩放&quot; 100→106→100 三个点。   AE——一个文本层用 <code>Animator</code>（Scale + Opacity，Range Selector 全选）做数字入场，   颜色用 <code>Fill</code> 效果打两个关键帧（19f / 23f）；量词用 <code>Linear Wipe</code>（Transition Completion 100→0，   Wipe Angle 90°）+ <code>Position</code> 两键<strong>同一段时间、同一 Easy Ease</strong>；   punch 直接在 <code>Scale</code> 上打 100 / 106 / 100 三键（间距 1f / 4f）。</p><ul><li>与本库同类卡的分工：<code>keyword-pop-highlight</code> = <strong>句子里砸一个词</strong>（正文先在、关键词后炸、</li></ul><p>  色块底 + 震屏，高能量、服务字幕）；<code>type-contrast-emphasis</code> = <strong>静态的字体/字重对比</strong>   （没有时序，是版式手段）；<code>number-counter</code> = <strong>滚动计数</strong>（数字有过程感，讲&quot;涨到了多少&quot;）；   <strong>本卡 = 标题级的数字重音</strong>（数字是主语，靠&quot;先后&quot;而不是&quot;砸&quot;，讲&quot;有几条&quot;）。   要讲&quot;从 0 涨到 67%&quot;用 <code>number-counter</code>；要讲&quot;有三个方法&quot;用本卡——   前者的数字是结果，后者的数字是<strong>目录</strong>。</p><h3>动效范围</h3><ul><li>属于本卡的：三段严格分先后这条时序纪律（数字单独到 → 量词被带出 → 第二行跟上）；数字入场只用 <code>scale 1.6→1</code> + <code>opacity</code>、<strong>拒绝任何位移</strong>；换色起点 = 落定帧 − <code>hueDur/2</code> 这个&quot;到位才亮&quot;的对齐；量词的 <code>clip-path</code> 与 <code>x</code> 补偿同曲线同时长（读作一件事）且 <code>restLag ≈ 0</code>；第二行错峰 <code>0.10s</code> 的量级；收尾 5 帧 <code>1.06</code> punch 的幅度与&quot;落在第二行之后&quot;的位置；数字与其余字约 2.2:1 的字号比 + 只有两级字阶；<code>align-items: baseline</code> 共基线；<code>transform-origin: 50% 72%</code>；<code>tabular-nums</code>；强调色只上在数字上。</li><li>不属于本卡的：demo 那句「3 个方法 / 解决问题」的具体文案、<code>#7A5AF8</code> 这个具体强调色（参考图同色系任一个都成立）、138px/62px 这两个具体字号（比例才是本体）、700/600 这组字重的绝对值、标题落在左侧白区这个落位（居中、下三分之一都成立）、白底舞台、以及右侧那列数字人主持人占位。</li><li>迁移接口：内容入口 = <code>.cb-num</code>（1~2 位阿拉伯数字）/<code>.cb-rest</code>/<code>.cb-l2</code> 三处文本；配色入口 = <code>CONFIG.accent</code> 一个值；能量入口 = <code>numScale</code>；节奏入口 = <code>l2Lag</code>（结构）与 <code>punchGap</code>（跟音频重音）；换字号时保持数字:其余 ≈ 2.2:1，<code>l2Rise</code> 按第二行字号的 10% 给。竖屏：把「个方法」换到第二行、第二行下移成第三行（竖屏行宽放不下 <code>138px 数字 + 4 字</code>），三段时序完全不变。数字位数 ≥3 时 <code>numScale</code> 降到 1.35。</li><li>底色要求：白底即可。深底把量词与第二行反白、强调色换成 design-language 深底档（如紫 <code>#9B87FF</code>）即可，时序不动。唯一约束是<strong>数字落定时的换色必须在底上有足够反差</strong>——强调色与底色的对比低于 3:1 时&quot;亮起&quot;这一拍读不出来，换色就白做了（此时改为换字重或加 accent 下划线）。</li></ul>","line-by-line-slide":"<h3>意图</h3><p>&quot;三件事&quot;这类并列要点在口播里极常见，而它有一个专属的难题：<strong>整段是一个整体，但要一行一行讲</strong>。 把三行一起淡入观众读不出顺序；把三行做成三段各自入场的动画又割裂成三张卡。</p><p>这张卡的解法是<strong>一叠里的错峰</strong>：行间错峰 0.13s（4 帧）——大到能读出&quot;第一行、第二行、第三行&quot;的先后， 又小到三行的入场在时间上大幅交叠（第一行还在淡入，第三行已经起手了），所以观众收到的是 &quot;一叠东西滑进来，而且有顺序&quot;，不是三次独立的入场。</p><p>真正把这张卡与市面清单预设区分开的是<strong>出场</strong>： ① <strong>进从左、出向右</strong>——不是倒放。整叠是&quot;穿过画面&quot;而不是&quot;来了又退回去&quot;， 这让它天然可以接下一段内容（退回去的动作会读作&quot;这段作废了&quot;）； ② <strong>出场的横向位移比淡出迟 0.27s 起</strong>——前 0.27s 整叠只在原地变淡、不动， 然后才被&quot;抽走&quot;。这一下延迟是全卡最精致的地方：它让出场读作&quot;整叠先松开、再被带走&quot;， 而位移与淡出同起会读作&quot;被一把扫掉&quot;（粗暴，且会让观众觉得没读完）； ③ <strong>出场错峰只有入场的一半</strong>（0.067s vs 0.13s）——出场不需要再讲一遍顺序， 所以收得更齐、更快，整叠几乎是一起走的。</p><h3>动效核心</h3><ul><li><strong>入场：每行两条轨，位移先停</strong></li></ul><p>  - 位移轨：<code>translateX −distance → 0</code>（distance = 字号 78%，demo 60px ⇒ 47px），<code>enterTravel = 0.467s</code>   - 淡入轨：<code>opacity 0 → 1</code>，<code>enterDur = 0.90s</code>（= 位移的 2.1 倍，位移占 52%）   - 缓动都是 <code>cubic-bezier(0.22, 1, 0.36, 1)</code>（缓出：冲进来再长距离缓收）   - 行间错峰 <code>enterStagger = 0.133s</code>（源码 4 帧 @30fps）</p><ul><li><strong>出场：淡出立刻起、位移迟 0.27s 起、方向朝右</strong></li></ul><p>  - 淡出轨：<code>opacity 1 → 0</code>，<code>exitDur = 0.60s</code>，<strong>从出场时刻立刻开始</strong>   - 位移轨：<code>translateX 0 → +distance</code>，<strong>延迟 <code>exitDelay = 0.267s</code> 才起</strong>，时长 <code>0.60 − 0.267 = 0.333s</code>     （两轨同时收尾——源码把位移的输入区间写成 <code>[exitTravelFrom, exitDur]</code>，即同一条时钟上的后段）   - 缓动 <code>cubic-bezier(0.64, 0, 0.78, 0)</code>（<strong>缓入</strong>：先粘住再加速甩走，与入场的缓出方向相反）   - 行间错峰 <code>exitStagger = 0.067s</code>（源码 2 帧）= 入场错峰的<strong>一半</strong></p><ul><li><strong>透明度是两段相乘</strong>：源码写作 <code>opacity = enterP × (1 − exitP)</code>，横向位移是两段<strong>相加</strong> <code>x = xEnter + xExit</code>。</li></ul><p>  这个写法保证入场未完就进入出场时不会跳（demo 里用 GSAP 顺序 tween 实现，时序等价）</p><ul><li><strong>出场时刻的下界</strong>：源码 <code>exitStart = max(enterEnd, 总长 − exitDur − 错峰)</code>——</li></ul><p>  <strong>出场永远不早于入场结束</strong>。搬到 GSAP 里就是显式排在&quot;最后一行入场结束 + hold&quot;之后（等价）</p><ul><li><strong>左对齐是硬要求</strong>（源码 <code>textAlign: left</code>）：逐行滑入靠<strong>共享的左端</strong>才读作&quot;一叠&quot;，</li></ul><p>  居中对齐会让每行的左端各自不同、滑入的方向感散掉</p><ul><li><strong>每行是 <code>display: block</code> + <code>transform-origin: 0% 50%</code></strong>（左端为轴），只走横向位移，不做竖向</li><li><strong>行高改动</strong>：源码 <code>lineHeight: 1.1</code> 是拉丁字母值；中文字面高，1.1 会让行与行粘住，本库取 <strong>1.35</strong></li><li><strong>层级</strong>：舞台白底 → 左对齐文本块 → 行（唯一被 transform 的元素）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>lines</code> 行数</td><td>3~4</td><td>本卡的硬约束；1 行退化成普通滑入（换 <code>soft-blur-in</code>），2 行读不出&quot;一叠&quot;，≥5 行首行早已淡出、整叠的整体感消失且观众读不完</td></tr><tr><td><code>enterDur</code></td><td>0.90s</td><td>每行淡入时长；&lt;0.5s 三行入场挤成一团（错峰读不出顺序），&gt;1.3s 整叠上屏要 2s 以上、口播已经讲到第二点了</td></tr><tr><td><code>enterTravel</code></td><td>0.467s</td><td><strong>位移占 <code>enterDur</code> 的 52%，命门之一</strong>；= <code>enterDur</code>（同停）读作三块板子被推进来，&lt;30% 行到位太早、后半程只在原地变实</td></tr><tr><td><code>enterStagger</code></td><td>0.133s</td><td><strong>行间错峰，本卡的核心量级</strong>；&lt;0.07s 三行几乎同时（顺序读不出），&gt;0.25s 三行割裂成三次独立入场（&quot;一叠&quot;消失，且整段拖到 2s 以上）</td></tr><tr><td><code>distance</code></td><td>≈字号 78%（60px ⇒ 47px）</td><td>横向位移量，<strong>比例常量</strong>；&lt;字号 40% 读作原地淡入，&gt;字号 150% 行从画幅外飞进来、抢掉内容</td></tr><tr><td><code>exitDur</code></td><td>0.60s</td><td>出场时长 = 入场的 67%（出场一律比入场快，这是通则）；&gt;0.9s 整叠磨磨蹭蹭不肯走</td></tr><tr><td><code>exitDelay</code></td><td>0.267s</td><td><strong>淡出起 → 位移起的延迟，本卡最精致的一条</strong>；0（位移与淡出同起）读作&quot;被一把扫掉&quot;，观众觉得没读完；&gt;0.4s 位移只剩一瞬、读作硬切</td></tr><tr><td><code>exitStagger</code></td><td>0.067s</td><td>出场错峰 = 入场的<strong>一半</strong>；= <code>enterStagger</code> 出场也在讲一遍顺序（啰嗦），0 则整叠齐走（能用，但少了一点收束的层次）</td></tr><tr><td><code>hold</code></td><td>1.4s</td><td>整叠读完的停留；按总字数给（每字约 0.12s），3 行 × 8 字 ≈ 1.4s；&lt;0.8s 观众读不完第三行</td></tr><tr><td><code>lineHeight</code></td><td>1.35（中文）</td><td>源码 1.1 是拉丁值；中文 &lt;1.25 行与行粘住、滑入时相邻行的字会互相压</td></tr><tr><td><code>lead</code></td><td>0.3s</td><td>起手静置等口播开口</td></tr></table><h3>已知坑</h3><ul><li>出场做成入场的倒放（往左退回去）——读作&quot;这段作废了/我说错了&quot;，接不上下一段内容；出场必须朝<strong>同一方向穿出去</strong>（进左出右）。</li><li>出场的横向位移与淡出同时起——整叠读作&quot;被一把扫掉&quot;，观众会觉得自己还没读完；那 0.27s 的延迟是本卡的签名，别省。</li><li>出场错峰照抄入场错峰——出场又讲一遍顺序，啰嗦且拖长；出场错峰取入场的一半。</li><li>用居中对齐——每行左端各自不同，横向滑入的方向感散掉，&quot;一叠&quot;读成&quot;几行分别在动&quot;；必须左对齐。</li><li>中文照抄源码 <code>lineHeight: 1.1</code>——中文字面比拉丁字母高，1.1 会让相邻行粘住，滑入过程中上下行的字互相压。</li><li>行数放到 5 行以上——第一行的淡出已经开始、最后一行还在入场，&quot;一叠&quot;这个整体读不出来；同时观众读不完。</li><li>入场位移与淡入同停（<code>enterTravel = enterDur</code>）——三行读作三块半透明板子被推进来，与市面清单预设无差别。</li><li>出场缓动照抄入场的缓出——&quot;甩走&quot;变成&quot;缓缓飘走&quot;，收不干净；出场必须是缓入 <code>(0.64, 0, 0.78, 0)</code>（先粘住再加速）。</li><li><code>distance</code> 写成绝对像素值跟着复用——换字号后大字号下滑入幅度不够、小字号下行从画幅外飞进来；必须按字号 78% 等比。</li><li>每行不锁 <code>white-space: nowrap</code>（或容器太窄）——某一行自己折成两行，行数就变了，错峰序列与视觉上的行对不上。</li><li>出场排在入场结束之前（<code>hold</code> 给负或太小）——某行还在淡入就开始淡出，opacity 两段相乘会让那行整体偏暗、像是没入场成功。</li><li>重播不重建 DOM 只重置 transform——换文案后行数变了，旧的 span 还在，错峰序列与实际行数对不上。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/line-by-line-slide/index.html。<strong>换内容只改 <code>CONFIG.lines</code></strong> 这个字符串数组（3~4 行），</li></ul><p>  入场/出场的时刻表都是从行数算出来的。节奏只调 <code>enterStagger</code>（<code>enterTravel</code> 要跟着 <code>enterDur</code> 保持约 52%）；   停留时间调 <code>hold</code>（按总字数，每字约 0.12s）；换字号改 <code>.lbl-text</code> 的 <code>font-size</code>，   同时把 <code>CONFIG.distance</code> 改成新字号的 78%。整叠的落位改 <code>.lbl-block</code>   （demo 是 <code>inset: 0</code> + flex 整屏居中的<strong>纯文字卡</strong>，不放主持人；   <code>.lbl-text</code> 是 <code>inline-block</code> + <code>text-align: left</code>——收缩到最长行的宽度，   于是&quot;整叠视觉居中&quot;与&quot;行与行共享同一条左端&quot;同时成立。   <strong><code>text-align: left</code> 与 <code>inline-block</code> 都不要改</strong>：改成 <code>center</code> 每行左端各自不同，滑入方向感就散了）。   只要入场不要出场：把 <code>exitDur</code> 那两条 <code>tl.to</code> 删掉即可（<code>hold</code> 就成了定格）。   <code>cubicBezier()</code> 那个解算器是通用的，别的 demo 要 <code>cubic-bezier</code> 缓动可以直接抄走。</p><ul><li>Remotion 移植：源码 <code>registry/remocn/line-by-line-slide/index.tsx</code> 是逐帧查表写法，可以原样抄，</li></ul><p>  它比 GSAP 版更省事的地方是<strong>出场时刻由 <code>durationInFrames</code> 反推</strong>：   <code>exitStart = max(enterDur + (n−1)×enterStagger, durationInFrames − exitDur − (n−1)×exitStagger)</code>——   也就是&quot;总长给多少，整叠就在末尾自动退场&quot;，不用手填 hold。   <strong>帧↔秒换算（源码 30fps）</strong>：<code>enterDur 27</code> ⇒ 0.90s、<code>enterTravel 14</code> ⇒ 0.467s、<code>enterStagger 4</code> ⇒ 0.133s、   <code>exitDur 18</code> ⇒ 0.60s、<code>exitTravelFrom 8</code> ⇒ 0.267s、<code>exitStagger 2</code> ⇒ 0.067s。   照抄两个关键写法：<code>opacity = enterP * (1 - exitP)</code>（<strong>相乘</strong>，不是二选一）与 <code>x = xEnter + xExit</code>（<strong>相加</strong>）——   这两条保证入场未完就进出场时不跳；出场位移的输入区间是 <code>[exitTravelFrom, exitDur]</code>（同一条时钟的后段，不是新时钟）。   缓动 <code>Easing.bezier(0.22,1,0.36,1)</code>（入）/ <code>Easing.bezier(0.64,0,0.78,0)</code>（出），全部 <code>extrapolate: &quot;clamp&quot;</code>。   尺寸换算：源码 <code>fontSize 72</code> @1280 画幅；本库 demo 是<strong>纯文字整屏</strong>，960 舞台上三行中文取 60px、   <code>distance</code> 按字号 78% ⇒ 47、<code>lineHeight 1.1 ⇒ 1.35</code>（中文）。</p><ul><li>剪辑软件对应物：剪映/CapCut——<strong>每行一个独立文本层</strong>（不要用一个多行文本层，那样做不出错峰），</li></ul><p>  每层入场打两组键：位置（左 <code>distance</code> → 0，0.47s）+ 不透明度（0 → 100，0.90s），   层与层的起点各差 4 帧；出场每层打不透明度（100 → 0，0.60s）+ 位置（0 → 右 <code>distance</code>，<strong>从出场后第 8 帧才开始</strong>，0.33s），   层与层各差 2 帧。剪映的&quot;向右滑出&quot;预设做不出那 8 帧延迟，位置必须手打。   AE——三个文本层（或一个层配三个 <code>Text Animator</code> 按 <code>Range Selector</code> 分行），   入场/出场各两组 Position + Opacity 关键帧，曲线在 Graph Editor 里拉成对应 bezier；   出场位移的第一个关键帧<strong>打在淡出开始后 8 帧</strong>（这是全卡最容易漏的一步）；   别用 <code>CC Slide</code> 或转场类效果（它们裁切边缘，本卡的行是整体位移不裁切）。</p><ul><li>与本库同类卡的分工：<code>keyword-pop-highlight</code> = 砸一个重音；</li></ul><p>  <code>per-character-rise</code> / <code>soft-blur-in</code> = 都是<strong>单句</strong>入场（竖向顶起 / 对焦）；   <code>quote-card</code> = 整屏让位的多行金句大字卡（<strong>带底板、人物压暗、整卡退场</strong>，是一个&quot;卡&quot;）；   <strong>本卡 = 不带底板的多行要点</strong>（字直接落在现有画面上，人物照常出镜，讲完穿出去）。   与 <code>quote-card</code> 的分界很清楚：要不要让位。金句要仪式感 ⇒ <code>quote-card</code>；   要点是&quot;边讲边挂在旁边&quot; ⇒ 本卡。两张不在同一段里混用。</p><h3>动效范围</h3><ul><li>属于本卡的：入场&quot;位移 0.47s / 淡入 0.90s（位移占 52%）+ 行间错峰 0.133s&quot;这组时序；出场&quot;进从左、出向右&quot;这个<strong>穿过式</strong>方向（不是倒放）；出场横向位移比淡出<strong>迟 0.267s</strong> 才起这条延迟（本卡签名）；出场错峰恒为入场的<strong>一半</strong>；入场缓出 <code>(0.22,1,0.36,1)</code> 与出场缓入 <code>(0.64,0,0.78,0)</code> 这一对方向相反的曲线；横向位移量恒为<strong>字号的 78%</strong>；<code>opacity</code> 两段相乘 / 位移两段相加这个叠加写法；出场永不早于入场结束这条下界；<strong>左对齐</strong>（共享左端才成&quot;一叠&quot;）与&quot;行数 3~4&quot;这个上限。</li><li>不属于本卡的：demo 那三行「第一，把问题写下来 / 第二，只留一个变量 / 第三，跑最小实验」的具体文案与&quot;第 N，&quot;这种编号写法、60px 字号与 600 字重、<code>#171717</code> 这个墨色、<code>letter-spacing: -0.03em</code>、<code>lineHeight 1.35</code>（这是中文可读性的下限值，不是动效参数）、无衬线字族的选择、白底舞台、以及&quot;整叠居中落在舞台正中&quot;这个落位（画幅左侧、右侧、下半区都成立，<strong>只要保持行与行左对齐</strong>）。<strong>demo 是纯文字卡、不放主持人</strong>（2026-08-25 用户定版）——整屏交给这一叠要点，人物占位会把注意力从&quot;一行一行滑进来&quot;上分走；但应用侧要让人物照常出镜同样成立（整叠挂在人物旁的留白列），落位不属于本卡的动效本体——<strong>左对齐才是</strong>。</li><li>迁移接口：<code>CONFIG.lines</code> 是唯一的内容入口（3~4 行）；节奏调 <code>enterStagger</code>（<code>enterTravel</code> 跟着 <code>enterDur</code> 保持约 52%）；<code>hold</code> 按总字数给（每字约 0.12s）；<code>distance</code> 按字号 78% 等比缩放；<strong><code>exitDelay</code> / <code>exitStagger</code> 与两条缓动是手感常量，换尺寸换语速都不要动</strong>；只要入场不要出场就删掉出场那两条 tween（<code>hold</code> 变定格）；竖屏用 3 行并把字号收到 32~38px（每行 <code>nowrap</code> 后不超出可用宽度的 90%，中文一行别超 12 字）。</li><li>底色要求：白底或深底都成立（深底把字色反白即可）。唯一约束是<strong>底不能有纵向条纹或纵向渐变</strong>——行在底上横向滑动，带纵向纹理的底会与横向位移产生视差错觉。实拍花底上可用，但要给字加描边或半透明底板保证可读（本卡不自带背板——需要背板的场合用 <code>quote-card</code>）。</li></ul>","outline-box-title":"<h3>意图</h3><p>口播讲到&quot;核心观点&quot;时，观众需要一个<strong>明确的容器</strong>——不是强调某个词，而是宣布 &quot;接下来这几个字是本段的结论&quot;。描边框给的就是这个容器感。</p><p>本卡的全部气质取决于一件事：<strong>框是机器画的</strong>。 <code>hand-drawn-ellipse</code>（手绘圈）和本卡在视觉上都是&quot;一条线围住一个短语&quot;， 但语义相反——手绘圈是<strong>人在纸上圈重点</strong>（过头交叉、粗细变化、笔触）， 描边框是<strong>系统在界面里框选</strong>（近匀速、精确闭合、圆角统一、粗细恒定）。 两者混用（比如给描边框加过头的尾巴）会让整片的气质变得暧昧：既不像手作也不像界面。</p><p>第二层设计是<strong>框 → chip 的反色对句</strong>：前半句&quot;核心观点&quot;在<strong>空框</strong>里（轻、是容器）， 后半句&quot;在这里&quot;在<strong>实心 chip</strong> 上（重、是落点）。同一个强调色的两种用法把 &quot;观点 → 位置&quot;这个句子结构直接画了出来。</p><p>命门三条： ① <strong>框必须 <code>power2.inOut</code> 近匀速、精确闭合</strong>。用 <code>power3.out</code>（起手快尾段慢） 会读作&quot;手甩出来的一圈&quot;，语言就串味了。 ② <strong>框闭合了才放 chip</strong>。同时进读作两个色块一起飘进来，&quot;框选完成 → 给出位置&quot; 这个推进感丢掉。 ③ <strong>chevron 从 0.25 亮到 1，不是从 0 淡入</strong>。它们的语义是&quot;本来就在那儿的方向提示， 被依次点亮&quot;；从 0 出现读作三个装饰飘进来。</p><h3>动效核心</h3><ul><li><strong>结构</strong>（@960×540 舞台）：第一行 356×104 的容器，内含 56px/700 的墨字 +</li></ul><p>  一个同尺寸的 SVG 圆角矩形描边框（4px 描边，唯一强调色，圆角 14px）；   第二行 260×66 的实心 chip（<code>border-radius: 12</code>，小件圆角档）+ 40px/700 白字；   下方三枚 26×34 的 chevron（<code>&gt;</code> 折线，5px 描边 <code>round</code> 端头）</p><ul><li><strong>① 框选</strong>：SVG path 从<strong>上边中偏左</strong>（<code>M 34 2</code>）起，顺时针 H → 圆角 → V → 圆角 →</li></ul><p>  H → 圆角 → V → 圆角 → <code>Z</code> 精确闭合；<code>stroke-dasharray = len</code>、   <code>stroke-dashoffset len→0</code>，<code>0.42s power2.inOut</code>。   起点特意不在角上——从角起笔读作&quot;两条边同时长出来&quot;，从边中间起笔才读作&quot;一笔绕一圈&quot;</p><ul><li><strong>② chip 展开</strong>：<code>transform-origin: left center</code>，<code>scaleX 0→1</code>，<code>0.2s power3.out</code>，</li></ul><p>  起步 = 框闭合 + <code>0.04s</code>（几乎接上，不留空拍）；   chip 内白字 <code>opacity 0→1</code>（<code>0.16s</code>），滞后 chip <code>0.1s</code>——   chip 是独立的背景层（<code>.ob-chip-bg</code>），字不参与 scaleX（否则字会被横向拉扁）</p><ul><li><strong>③ chevron 点亮</strong>：<code>opacity 0.25→1</code> + <code>x +4→0</code>，各 <code>0.16s power2.out</code>，错峰 <code>0.08s</code>；</li></ul><p>  起步 = chip 落定 + <code>0.06s</code></p><ul><li><strong>④ hold 1.6s</strong>：全部静置。不做 line boil / 定格抖动（design-language §4）</li><li><strong>层级</strong>：白底 → 主持人（右侧列，演示语境）→ 文字 → 描边框 SVG / chip → chevron</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>boxDur</code></td><td>0.42s</td><td>框画一圈；&lt;0.25s 读作&quot;框闪出来&quot;（画的过程看不见，等于硬现），&gt;0.7s 观众看着线爬，口播已经念到下一句</td></tr><tr><td>框的缓动</td><td><code>power2.inOut</code></td><td><strong>本卡第一命门</strong>；换成 <code>power3.out</code> 立刻读作手甩的一圈（手绘语言），换成 <code>linear</code> 也可以（更机器），但 <code>back</code> / <code>elastic</code> 一律禁止</td></tr><tr><td>起笔点</td><td>上边中偏左（<code>M 34 2</code>）</td><td>从角起笔读作&quot;两条边长出来&quot;，从边中间起笔才是&quot;一笔绕一圈&quot;；起笔点越靠角，机器感越弱</td></tr><tr><td>描边宽</td><td>4px @540 舞台高</td><td>细于 2.5px 压缩后掉边；粗于 6px 框比字重，容器抢了内容</td></tr><tr><td>框圆角</td><td>14px</td><td>0（直角）读作表格单元格；&gt;24px 成了 pill（那是按钮语义，不是框选）</td></tr><tr><td><code>chipGap</code></td><td>0.04s</td><td><strong>框闭合到 chip 起步的间隔，本卡第二命门</strong>；0 也可（接得更紧），但<strong>不许为负</strong>（chip 在框闭合前出来就是两个动效撞车），&gt;0.3s 中间一个明显空拍</td></tr><tr><td><code>chipDur</code></td><td>0.2s</td><td>chip 展开；&lt;0.12s 读作硬现，&gt;0.35s 和框的 0.42s 一样长，两拍变成一拍</td></tr><tr><td><code>chipTxtLag</code></td><td>0.1s</td><td>chip 内字的滞后；0 = 字跟着 chip 一起被&quot;刷&quot;出来（层次塌成一件事），&gt;0.25s 读作 chip 空着等字</td></tr><tr><td><code>chevDim</code></td><td>0.25</td><td><strong>chevron 起始不透明度，本卡第三命门</strong>；0 读作三个装饰飘进来，&gt;0.45 点亮的对比不够（看不出&quot;依次&quot;）</td></tr><tr><td><code>chevStagger</code></td><td>0.08s</td><td>chevron 错峰；&lt;0.05s 三枚几乎同时（读作一个整体），&gt;0.15s 读作三个独立动效在排队</td></tr><tr><td><code>hold</code></td><td>1.6s</td><td>收尾停留，按框内 + chip 的总字数给（每字约 0.2s）</td></tr></table><h3>已知坑</h3><ul><li>框用 <code>power3.out</code> 或 <code>back.out</code> 画出——一眼读作手甩的一圈，&quot;机器框选&quot;这层语义全丢，和 <code>hand-drawn-ellipse</code> 撞语言。</li><li>框画过头（尾巴超出起点）——那是手绘圈的做法；描边框过头一点点就显得&quot;没对准&quot;，不是手作感。</li><li>从角落起笔——观众看到的是&quot;两条边同时长出来&quot;，读不出&quot;一笔绕一圈&quot;。</li><li>框和 chip 同时进——两个色块一起飘进来，&quot;框选完成 → 给出位置&quot;的推进感消失，整组读作一张 PNG。</li><li>chip 内的字跟着 chip 一起 <code>scaleX</code>——字被横向拉扁，慢放下非常明显；字必须是 chip 背景层之上的独立层。</li><li>chip 不加 <code>overflow: hidden</code>（或字不做独立层）——展开到一半时字已经露在 chip 之外，读作&quot;字先到、块后追&quot;。</li><li>chevron 从 <code>opacity 0</code> 淡入——读作三个装饰飘进来；它们的语义是&quot;本来在那儿被点亮&quot;。</li><li>chevron 错峰超 0.15s——读作三个独立动效在排队，&quot;扫过点亮&quot;这一件事被拆成三件。</li><li>框用一个颜色、chip 用另一个颜色——同屏第二个&quot;看这里&quot;色（design-language §1 红线）；框 / chip / chevron 必须共用唯一强调色，靠&quot;空框 vs 实心&quot;制造对比。</li><li>框的圆角和 chip 的圆角不一档——同屏混用两种圆角语法（design-language §6 Don't）；框 14 / chip 12 属于同一档（小件），差 2px 是尺寸差不是语法差。</li><li>hold 期给框加呼吸/漂移——机器画的框动起来就成了&quot;没对准&quot;。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/outline-box-title/index.html。换文案改 <code>.ob-row1 .txt</code> 与 <code>.ob-chip-txt</code>，</li></ul><p>  <strong>同时</strong>要改 <code>.ob-row1</code> / <code>#obBox</code> 的 <code>width</code> 与 <code>#obBoxPath</code> 的 <code>d</code>（框是写死尺寸的   path，不会跟着文字自适应——这是有意的：框的尺寸是排版决定，不该由文字宽度抖出来），   chip 宽度改 <code>.ob-row2</code> 的 <code>width</code>；改强调色只动 <code>:root --acc</code>（框 + chip + chevron 共用）；   节奏全在 <code>CONFIG</code>（<code>boxDur</code>/<code>chipGap</code>/<code>chipDur</code>/<code>chipTxtLag</code>/<code>chevDim</code>/<code>chevStagger</code>/<code>hold</code>）。   换框尺寸时 <code>d</code> 的写法：<code>M {r+20} 2 H {w-r} A {r} {r} 0 0 1 {w-2} {r+2} V {h-r} … Z</code>（<code>r</code> = 圆角）。</p><ul><li>Remotion 移植：<code>strokeDasharray={len}</code> + `strokeDashoffset={interpolate(f, [0, 13], [len, 0],</li></ul><p>  {easing: Easing.inOut(Easing.quad), extrapolateRight: &quot;clamp&quot;})}<code>——</code>len<code> 必须<strong>预先量好写成常量</strong>   （SSR 里没有 </code>getTotalLength()<code>；用浏览器量一次，或按周长公式 </code>2(w+h) - 8r + 2πr<code> 估）。   chip 用 </code>scaleX<code> + </code>transformOrigin: &quot;left center&quot;<code>；chip 内字单独一个 </code>interpolate<code> 的 opacity。   chevron 三枚用 </code>f - i*2<code> 局部时钟。帧换算 @30fps：</code>boxDur 0.42s ⇒ 13f<code>、</code>chipDur 0.2s ⇒ 6f<code>、   </code>chipTxtLag 0.1s ⇒ 3f<code>、</code>chevStagger 0.08s ⇒ 2~3f`。</p><ul><li>剪辑软件对应物：AE——Shape Layer 画圆角矩形（只描边不填充）+ <code>Trim Paths</code>，</li></ul><p>  <code>End</code> 从 0→100%，<strong><code>Offset</code> 设成让起点落在上边中间</strong>，缓动用 <code>Easy Ease</code> 两端   （F9 就很接近 <code>power2.inOut</code>）；chip 用 Shape Layer + <code>Scale</code> 的 X 分量 0→100%   并把锚点移到左边缘。剪映/CapCut——&quot;边框&quot;贴纸只能整体淡入/缩放，<strong>画不出&quot;沿路径画一圈&quot;</strong>，   折中方案是给边框贴纸做&quot;线性擦除&quot;两次（先横向再纵向）或直接接受&quot;整框淡入&quot;   （损失本卡的第一命门，此时它退化成普通的框标题）；chip 用色块 + &quot;向右展开&quot;入场。</p><ul><li>与本库同类卡的分工：<code>corner-bracket-frame</code> = 只画对角两个角（取景/引述，不闭合，能量更低）；</li></ul><p>  <code>hand-drawn-ellipse</code>（B 组）= 手绘椭圆圈重点（过头交叉、笔触，人在圈）；   <code>info-term-card</code> = 术语卡整块出现；<code>quote-card</code> = 引述整段；   <code>chapter-title-card</code> = 章节级的整屏标题；   <strong>本卡 = 机器画的&quot;框选一个短语&quot; + 反色 chip 给出落点</strong>（界面感、条款感的一档）。</p><h3>动效范围</h3><ul><li>属于本卡的：描边框沿路径 <code>dashoffset</code> 画出一圈、<code>power2.inOut</code> 近匀速、<strong>精确闭合不过头</strong>、起笔点在边中间不在角上，这四条合起来构成&quot;机器画的框选&quot;这个语言（本卡的核心资产）；框闭合<strong>之后</strong>（<code>chipGap ≥ 0</code>）chip 才 <code>scaleX 0→1</code> 展开（origin left）这个先后关系；chip 内字滞后 chip <code>0.1s</code> 淡入且<strong>不参与 scaleX</strong>；chevron 从 <code>0.25</code> 点亮到 <code>1</code> + <code>x+4→0</code>、错峰 <code>0.08s</code> 的&quot;依次扫过&quot;；&quot;空框（容器）+ 实心 chip（落点）&quot;用同一个强调色做反色对句这个层级关系；hold 期全部静置。</li><li>不属于本卡的：demo 那句「核心观点 / 在这里」的具体文案、56px 与 40px 的字号、紫色 <code>#7A5AF8</code> 这个具体取值、356×104 与 260×66 的框 / chip 绝对尺寸、chevron 的具体形状（<code>&gt;</code> 折线也可换成三角、箭头）与枚数（2~4 枚都成立）、右侧主持人（数字人）占位、整组落在左侧留白区这个构图。</li><li>迁移接口：强调色一个变量 <code>--acc</code>（框 + chip + chevron 共用，同屏不允许第二个）；框尺寸 = 文字宽 + 左右各 30px 气口，<code>#obBoxPath</code> 的 <code>d</code> 跟着重写（公式见「复用指引」），圆角取 12~16px、描边宽取舞台高的 0.7%；chip 宽 = 文字宽 + 左右各 26px；节奏在 <code>CONFIG</code>，能量档只调 <code>boxDur</code>（框画得越慢越&quot;郑重&quot;），<code>chipGap</code>/<code>chipTxtLag</code>/<code>chevDim</code> 是<strong>手感常量</strong>，换尺寸换语速都不要动；<code>hold</code> 按总字数给（每字约 0.2s）。竖屏把整组放在上三分之一、框宽取画幅 80%，chevron 可以减到两枚。</li><li>底色要求：白底即可。深底成立（框 / chip / chevron 换深底模式强调色 <code>#2997ff</code>，第一行字反白，chip 内字仍为白——此时 chip 与底的对比靠强调色本身的亮度）。唯一约束是<strong>底不能有高频细节</strong>：4px 的描边框在花底上会被吃掉，那种场合先垫一层浅底板，别靠加粗描边解决（加粗会让框比字重）。</li></ul>","per-character-rise":"<h3>意图</h3><p>&quot;字从下面升起来&quot;是最常见的字幕入场，也是最容易做塌的一个——市面预设九成是 &quot;整块上滑 + 淡入，一条 ease-out 到底&quot;，做出来的东西没有骨头：位移与淡入同一条曲线同时结束， 整句读作一块半透明的板子被推上来。</p><p>这张卡的差别只在两条参数，但它们决定了全部手感： ① <strong>位移与淡入用两条不同的缓动</strong>。位移走 <code>cubic-bezier(0.2, 0.8, 0.6, 0.85)</code>—— 起手冲一下、然后<strong>几乎匀速地滑到位</strong>（尾段不刻意缓收）；淡入走 <code>cubic-bezier(0.2, 0.8, 0.2, 1)</code>—— 起手同样快、但尾段拖得很长。所以字的&quot;到位&quot;是硬的（有落点），字的&quot;实起来&quot;是软的（有余韵）。 一条曲线做两件事就会两头都不像。 ② <strong>位移只占淡入时长的 48%</strong>（0.33s / 0.70s）。字在还只有一半透明度的时候就已经到位了， 剩下 0.37s 它在原地变实——这就是&quot;一股气顶上来&quot;这个感受的机制：<strong>力道在前、余韵在后</strong>。</p><p>第三条纪律是<strong>零模糊零缩放</strong>。加一点 blur 它就变成 <code>soft-blur-in</code>（能量档掉到低）， 加一点 scale 它就变成弹跳字幕（能量档跳到高）。逐字升起的力道全部来自纯位移，别的都是杂音。</p><h3>动效核心</h3><ul><li><strong>两条轨、两条缓动、时长比 48%</strong>：</li></ul><p>  - 位移轨：<code>translateY +rise → 0</code>（rise = 字号 44%，demo 72px ⇒ 32px），<code>travel = 0.333s</code>，缓动 <code>cubic-bezier(0.2, 0.8, 0.6, 0.85)</code>     （起手快 → 尾段近匀速，&quot;到位&quot;是硬的）   - 淡入轨：<code>opacity 0 → 1</code>，<code>dur = 0.70s</code>，缓动 <code>cubic-bezier(0.2, 0.8, 0.2, 1)</code>     （起手快 → 尾段长缓收，&quot;实起来&quot;是软的）   - 两轨同起，位移先停 —— <strong>&quot;力道在前、余韵在后&quot;的全部机制</strong></p><ul><li><strong>逐字错峰 0.033s（源码 1 帧 @30fps）</strong>：第 i 个字的起点 = <code>lead + i × 0.033</code>。</li></ul><p>  中文按码点切字（<code>Array.from</code>）即逐汉字；标点也算一个字，跟着升起是对的</p><ul><li><strong>起始下沉 ≈ 字号的 44%</strong>（源码 <code>distance 32</code> @72px；本库 demo 同为 72px ⇒ 32）。</li></ul><p>  这是比例常量不是绝对值——换字号必须等比改</p><ul><li><strong>零模糊零缩放</strong>：本卡唯一被动画的属性是 <code>translateY</code> 与 <code>opacity</code>。</li></ul><p>  加 blur ⇒ 退化成 <code>soft-blur-in</code>；加 scale ⇒ 退化成弹跳字幕</p><ul><li><strong>每个字是独立的 <code>inline-block</code></strong>：<code>transform-origin: 50% 55%</code>（重心略偏下，升起收尾时字不往上飘）、</li></ul><p>  <code>backface-visibility: hidden</code>（transform 合成层稳定）</p><ul><li><strong>整行 <code>letter-spacing: -0.05em</code></strong>（源码值）：略收紧，让升起后的整句读作&quot;一句话&quot;而不是&quot;一排字&quot;</li><li><strong><code>white-space: nowrap</code> 是硬要求</strong>：每个字都是独立 inline-block，不锁 nowrap 时浏览器会在任意两字之间换行</li><li><strong>层级</strong>：舞台白底 → 整行 flex 居中 → 单字（唯一被 transform 的元素）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>dur</code>（淡入）</td><td>0.70s</td><td>本卡的余韵长度；&lt;0.4s 字&quot;实&quot;得太快、力道读作硬切上滑，&gt;1.1s 字长时间半透明、整句显得犹豫</td></tr><tr><td><code>travel</code>（位移）</td><td>0.333s</td><td><strong>位移占 <code>dur</code> 的 48%，本卡第一命门</strong>；= <code>dur</code>（同停）读作一块板子被推上来（市面预设的通病），&lt;30% 则字到位太早、后半程只在原地变实、力道断掉</td></tr><tr><td>两条缓动</td><td>位移 <code>(0.2,0.8,0.6,0.85)</code> / 淡入 <code>(0.2,0.8,0.2,1)</code></td><td><strong>本卡第二命门，两条必须不同</strong>；共用一条（无论哪条）都会让&quot;到位&quot;和&quot;实起来&quot;变成一件事，骨头就没了</td></tr><tr><td><code>stagger</code></td><td>0.033s</td><td>逐字错峰；0 = 整块上滑（能用但少了那股气），&gt;0.1s 变成&quot;一个字一个字往上蹦&quot;（能量档跳一级、且中文长句会读作波浪）</td></tr><tr><td><code>rise</code></td><td>≈字号 44%（72px ⇒ 32px）</td><td>起始下沉量，<strong>比例常量</strong>；&lt;字号 20% 力道不够、读作轻微上浮，&gt;字号 70% 字从行外飞进来、抢掉整句的注意力</td></tr><tr><td><code>lead</code></td><td>0.3s</td><td>起手静置等口播开口；0 则字与画面同时出现，观众来不及把注意力挪过去</td></tr><tr><td><code>hold</code></td><td>1.2s</td><td>收尾定格——立住的整句是本卡的落点，按字数给（每字约 0.15s，读完再留半拍）</td></tr><tr><td>字数</td><td>6~10 字</td><td>更长的句子错峰累积会让整句读作波浪（16 字 ⇒ 首尾差 0.53s，中文字宽整齐、波浪感很明显），要拆句</td></tr><tr><td>blur / scale</td><td><strong>0（不设）</strong></td><td>本卡的硬约束；任何非零值都把它变成另一张卡（见&quot;意图&quot;第三条）</td></tr></table><h3>已知坑</h3><ul><li>位移与淡入共用一条缓动——整句立刻读作&quot;一块半透明板子被推上来&quot;，这是市面上所有上滑淡入预设的通病，也是本卡存在的唯一理由。</li><li>位移与淡入同时结束（<code>travel = dur</code>）——同上，&quot;力道在前、余韵在后&quot;整个消失。</li><li>顺手加一点 <code>blur</code>——它就变成 <code>soft-blur-in</code> 了（能量档从中掉到低），两张卡在库里就重复了。</li><li>顺手加一点 <code>scale</code>（哪怕 0.96）——立刻读作逐词弹跳字幕（Hormozi captions）那种入场，一眼廉价。</li><li><code>rise</code> 写成绝对像素值跟着复用——换字号后大字号下升起幅度不够、小字号下字从行外飞进来；必须按字号 44% 等比。</li><li>整行不锁 <code>white-space: nowrap</code>——每个字是独立 inline-block，浏览器会在任意两字之间换行，起手那一帧整句排版就是错的。</li><li>给整行（而不是单字）做位移——逐字错峰全部失效，退化成整块上滑（还不如直接写整块版，少一层 DOM）。</li><li>错峰放大到 0.1s 以上用在中文长句上——中文字宽整齐，均匀的大错峰会读作一道正弦波浪（英文长短词参差反而看不出），一眼廉价。</li><li>用在连续跟读的常规字幕上——每句都从下往上升，整片读作画面在往上抖；本卡是&quot;立一句&quot;，不是&quot;跟读一段&quot;。</li><li>重播不重建 DOM 只重置 transform——换文案后字数变了，旧的 span 还在，错峰序列与实际字数对不上。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/per-character-rise/index.html。<strong>换内容只改 <code>CONFIG.text</code></strong> 这一个字符串（6~10 字），</li></ul><p>  切字与错峰序列都是运行时算的。手感只调 <code>dur</code>（<code>travel</code> 要跟着保持约 48% 的比例）；   换字号改 <code>.pcr-text</code> 的 <code>font-size</code>，同时把 <code>CONFIG.rise</code> 改成新字号的 44%。   整句的落位改 <code>.pcr-line</code>（demo 是 <code>inset: 0</code> + flex 整屏居中的<strong>纯文字卡</strong>，不放主持人；   要让人物留在画面里就把 <code>.pcr-line</code> 收成一列白区，同时按新宽度把 <code>font-size</code> 收回去）。   <strong>两条缓动 <code>FADE_EASE</code> / <code>TRAVEL_EASE</code> 是手感常量，不要动、更不要合成一条。</strong>   <code>cubicBezier()</code> 那个解算器是通用的，别的 demo 要 <code>cubic-bezier</code> 缓动可以直接抄走。</p><ul><li>Remotion 移植：源码 <code>registry/remocn/per-character-rise/index.tsx</code> 是逐帧查表写法（不建时间线，每帧算每个字该在哪），</li></ul><p>  在 Remotion 里比搬 GSAP 时间线更直接，可以原样抄。<strong>帧↔秒换算（源码 30fps）</strong>：   <code>charDurationFrames 21</code> ⇒ <code>dur 0.70s</code>、<code>charTravelFrames 10</code> ⇒ <code>travel 0.333s</code>、<code>staggerFrames 1</code> ⇒ <code>stagger 0.033s</code>。   每字两个 <code>interpolate</code>，<strong>两条的 <code>easing</code> 必须分开传</strong>：   淡入 <code>Easing.bezier(0.2, 0.8, 0.2, 1)</code>、位移 <code>Easing.bezier(0.2, 0.8, 0.6, 0.85)</code>；   两条都要 <code>extrapolateLeft/Right: &quot;clamp&quot;</code>（不 clamp 的话 <code>local &lt; 0</code> 的字会算出负 opacity 并被提前渲染出来）。   <code>local = frame - i * staggerFrames</code> 是两条 interpolate 共用的局部时钟。   尺寸换算：源码 <code>fontSize 72</code> 是 1280×720 画幅的值；本库 demo 是<strong>纯文字整屏</strong>，960 舞台上直接用 72px，   所以 <code>distance 32</code> 与源码同值（比例照旧：distance = 字号 44%）。   <strong>不要</strong>顺手换成 <code>spring()</code>——spring 的过冲会带来回弹，本卡是零回弹的。</p><ul><li>剪辑软件对应物：剪映/CapCut——&quot;向上滑入&quot;/&quot;上移&quot;预设都是位移与淡入同停的整块版（正是本卡要避开的），</li></ul><p>  正确做法是一个文本层手打两组关键帧：位置（下方 <code>rise</code> = 字号 44% → 0，<strong>0.33s</strong>）+ 不透明度（0 → 100，<strong>0.70s</strong>），   两组曲线各自单独调（剪映的曲线编辑器能分属性调，一定要分开调，这是全部差别）；   逐字错峰做不出来（&quot;逐字显示&quot;是硬切），0.033s 肉眼几乎读不出，<strong>放弃错峰做整块版</strong>是合理取舍。   AE——一个文本层 + <code>Text Animator</code>：加 <code>Position</code>（Y +24 → 0）与 <code>Opacity</code> 两个属性，   但<strong>必须建两个 Animator</strong>（一个只带 Position、一个只带 Opacity），两个 <code>Range Selector</code> 的 Offset   用不同时长的关键帧（0.33s / 0.70s），曲线在 Graph Editor 里各自拉成对应的 bezier；   合在一个 Animator 里就只能共用一条曲线 —— 那就退化成市面预设了。</p><ul><li>与本库同类卡的分工：<code>keyword-pop-highlight</code> = 一句里砸一个重音；</li></ul><p>  <code>typewriter-reveal</code> = 逐字符敲出（有档案感的节拍）；<code>soft-blur-in</code> = 最低能量的整句对焦（无方向）；   <strong>本卡 = 有方向、有力道、零回弹的整句立起</strong>（竖向顶上来，是同类里唯一&quot;有劲但不跳&quot;的那档）。</p><h3>动效范围</h3><ul><li>属于本卡的：位移与淡入<strong>两条不同缓动</strong>（位移 <code>(0.2,0.8,0.6,0.85)</code> 近匀速到位 / 淡入 <code>(0.2,0.8,0.2,1)</code> 长尾缓收）这个组合；位移只占淡入时长 48% 这条时间纪律（力道在前、余韵在后）；起始下沉恒为<strong>字号的 44%</strong>这个比例；<code>stagger 0.033s</code>（源码 1 帧）这个&quot;小到几乎不是逐字&quot;的错峰量级；<strong>零模糊零缩放</strong>这条硬约束；<code>transform-origin: 50% 55%</code> 这个略偏下的重心；单字 <code>inline-block</code> + 整行 <code>nowrap</code> 这个实现纪律。</li><li>不属于本卡的：demo 那句「先想清楚，再动手」的具体文案、72px 字号与 600 字重、<code>#171717</code> 这个墨色、<code>letter-spacing: -0.05em</code>（拉丁字体的收紧值，中文可取 0 到 −0.05em 之间任意值）、无衬线字族的选择、白底舞台、以及&quot;整句落在舞台正中&quot;这个落位（画幅正中、下三分之一、字幕安全区都成立）。<strong>demo 是纯文字卡、不放主持人</strong>（2026-08-25 用户定版）——整屏交给这一句，人物占位会把注意力从&quot;一股气顶上来&quot;这个动作上分走；但应用侧要让人物照常出镜同样成立（句子落在人物旁的留白列或字幕安全区），落位不属于本卡的动效本体。</li><li>迁移接口：<code>CONFIG.text</code> 是唯一的内容入口（6~10 字）；手感只调 <code>dur</code>，<code>travel</code> 必须跟着保持约 48% 的比例；<code>rise</code> 按字号 44% 等比缩放；<strong>两条缓动与 <code>stagger</code> 是手感常量，换尺寸换语速都不要动</strong>（字数超过 10 时 <code>stagger</code> 减到 0.02s，或者直接拆句）；<code>hold</code> 按字数给（每字约 0.15s）；竖屏用 6~8 字并把字号收到 40~46px（本卡不改变排版宽度，唯一约束是整句 <code>nowrap</code> 后不超出可用宽度的 90%）。</li><li>底色要求：白底或深底都成立（深底把字色反白即可），本卡零模糊零缩放，对底色最不敏感。唯一约束是<strong>底不能有横向条纹或横向渐变</strong>——字在底上竖向升起，带横向纹理的底会与竖向位移产生视差错觉（字看起来在斜着走）。实拍花底上可用，但要给字加描边或半透明底板保证可读（本卡不自带任何背板）。</li></ul>","quote-bracket-pull":"<h3>意图</h3><p>本库已有 <code>quote-card</code>（金句大字卡），它的机制是<strong>让位仪式</strong>：底板盖住人物、字占全屏、 逐行砸出来、停 2~4s、整卡下滑退场。它很有力，但代价是<strong>人物消失了</strong>， 而且整屏被接管——所以它一条视频只能用一两次，用多了每次都像&quot;要开始念圣经了&quot;。</p><p>这张卡解决的是同一个需求的另一半：<strong>我想把一句话立成引文，但不想中断口播</strong>。 它的机制完全不同——不盖底板、不动人物，而是用<strong>两枚大引号夹住一片空白</strong>， 在画面里现场划出一个&quot;引文区&quot;。观众读到的不是&quot;画面停下来了&quot;，而是&quot;这句话被打上了引号&quot;。 这是排版的语言（引用），不是舞台的语言（让位）。</p><p>与 <code>quote-card</code> 的三条硬区别，复用时别混：① <strong>无底板、人物不退场</strong>；② <strong>引号是主动作</strong> （字是被夹出来的，不是自己砸出来的）；③ <strong>错峰更密</strong>（0.09s vs 0.15s）——本卡三行是<strong>一句话</strong>， <code>quote-card</code> 的行是<strong>逐句砸</strong>。</p><p>命门两条：① <strong>引号必须同帧同曲线</strong>。这是&quot;夹&quot;这个动作的全部——两枚哪怕错开 3 帧， 就读作&quot;两个符号各自飞进来&quot;，构图当场散架；② <strong>引号要立得住</strong>：尺寸压过正文两倍以上 （demo 是 108px vs 32px，3.4 倍）、<code>opacity</code> 到 0.85~0.9。太小或太淡它就退化成装饰角标， &quot;引用&quot;这层意思没有了。</p><h3>动效核心</h3><ul><li><strong>层级</strong>：白底 → 人物（左下角标，全程不动）→ 金句块（版心，<code>width: fit-content</code> 贴合最长行）</li></ul><p>  → 两枚大引号（绝对定位在金句块的左上 / 右下外侧）→ 荧光笔色块（在末行文字<strong>下层</strong>）</p><ul><li><strong>① 双引号推入（本卡的主动作）</strong>，两枚<strong>同帧同曲线</strong> <code>0.32s power3.out</code>：</li></ul><p>  - 左引号：<code>x −30 → 0</code>、<code>y −14 → 0</code>、<code>opacity 0 → 0.9</code>   - 右引号：<code>x +30 → 0</code>、<code>y +14 → 0</code>、<code>opacity 0 → 0.9</code>（位移<strong>反向对称</strong>，这是&quot;夹&quot;的几何）   - 尺寸 108px / 700 字重 / 衬线族（Georgia）——衬线的引号字形本身就有&quot;引文&quot;的文化编码</p><ul><li><strong>② 三行金句</strong>：在引号<strong>走过一半时</strong>起（<code>lead + markDur × 0.5</code>，不空等），</li></ul><p>  <code>opacity 0 → 1</code> + <code>y +6 → 0</code>，每行 <code>0.30s power2.out</code>，<strong>错峰 0.09s</strong>。   上浮只有 6px：一点重量而已，位移大了就抢过引号的&quot;夹&quot;</p><ul><li><strong>③ 荧光笔</strong>（末行到位 + 0.10s 呼吸后）：<code>scaleX 0 → 1</code>，<code>transform-origin: left center</code>，</li></ul><p>  <code>0.26s power2.inOut</code>。<code>#FFE949</code> @ <code>opacity 0.6</code> + <code>mix-blend-mode: multiply</code>   （design-language §1 的 marker token），不规则圆角 <code>9px 4px 8px 3px / 5px 9px 4px 8px</code> 模拟笔触。   <strong>色块在字下层</strong>（<code>z-index</code> 与 DOM 顺序双保险），不许盖字</p><ul><li><strong>④ hold 2.2s</strong>：金句要停。这是本卡最长的一段，比任何动作都长</li><li><strong>落位纪律</strong>：金句块用 <code>width: fit-content</code> 而不是固定宽——引号是绝对定位在<strong>块的边缘</strong>上的，</li></ul><p>  块宽固定时引号会被钉在版心角落，离句子太远，&quot;夹&quot;的关系就断了</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>引号字号</td><td>108px（正文的 3.4 倍）</td><td><strong>命门</strong>：引号的分量；&lt;正文 2 倍读作装饰角标（&quot;引用&quot;语义消失），&gt;正文 4.5 倍引号成了主角、句子变成配图</td></tr><tr><td><code>markOpacity</code></td><td>0.9</td><td>引号落定不透明度；&lt;0.8 读作水印（分量不够压不住构图），1.0 时引号与正文一样黑、读作&quot;句子里有两个大符号&quot;</td></tr><tr><td><code>markDx</code> / <code>markDy</code></td><td>30 / 14px</td><td>引号推入距离，<strong>两枚必须反向等值</strong>；0 只剩淡入（&quot;夹&quot;这个动作没有了），&gt;60px 读作两个符号从远处飞来（抢过整句）</td></tr><tr><td><code>markDur</code></td><td>0.32s</td><td>引号推入耗时，本卡的主动作时长；&lt;0.2s 读作硬现（夹的过程看不见），&gt;0.5s 观众等着两个符号就位、句子还没开始</td></tr><tr><td>引号错峰</td><td><strong>0 s（严格同帧）</strong></td><td><strong>第一命门，不是可调参数</strong>；错开 3 帧就读作&quot;两个符号各自入场&quot;，构图散架</td></tr><tr><td><code>lineStagger</code></td><td>0.09s</td><td>行错峰；本卡刻意比 <code>quote-card</code>（0.15s）更密——三行是<strong>一句话</strong>不是三句；&gt;0.15s 读作逐句砸（就该用 quote-card 了），&lt;0.05s 整块淡入（少了阅读推进）</td></tr><tr><td><code>lineRise</code></td><td>6px</td><td>行上浮位移；&gt;16px 行的入场分量超过引号，主次颠倒</td></tr><tr><td>起字时机</td><td>引号走完 50%</td><td>引号到位后再起字会读作两个断开的动效；0%（同时起）读作&quot;一整块淡入&quot;，夹的动作被埋掉</td></tr><tr><td><code>markerDur</code></td><td>0.26s</td><td>荧光笔扫过耗时；跟朗读语速走，&lt;0.15s 像 bug 闪一下，&gt;0.5s 拖过了口播的重音点</td></tr><tr><td>行数</td><td>2~4 行</td><td>3 行最舒服；&gt;4 行引号要拉得太开、&quot;夹&quot;的张力松掉（且金句超过 4 行就不是金句了）</td></tr><tr><td><code>hold</code></td><td>2.2s</td><td>收尾停留，<strong>本卡最重要的一段</strong>；&lt;1.5s 观众读完就切、金句没有余味；金句的价值全在这段静止里</td></tr></table><h3>已知坑</h3><ul><li>两枚引号错峰入场（做&quot;依次夹住&quot;）——<strong>本卡最致命的错法</strong>。&quot;夹&quot;是一个动作，</li></ul><p>  必须由两个同步的位移共同完成；错峰后读作两个独立符号飞入，构图散架。</p><ul><li>引号字号只比正文大一点（1.3~1.8 倍）——退化成&quot;句子里的标点&quot;，</li></ul><p>  观众根本不会把它读作&quot;引用&quot;这个动作。</p><ul><li>引号用 <code>opacity: 0.4</code> 求&quot;轻盈&quot;——变成水印，压不住构图；引号是<strong>符号不是装饰</strong>，</li></ul><p>  0.85~0.9 是它的下限。</p><ul><li>引号用无衬线族（跟正文同族）——无衬线的 <code>&quot;</code> 是两个小竖块，放大到 108px 只是两个方块；</li></ul><p>  衬线族的引号字形自带&quot;引文&quot;的文化编码，这是免费的语义。</p><ul><li>金句块用固定宽度——引号被钉在版心角落，离句子十几个字宽，&quot;夹住&quot;的关系断掉</li></ul><p>  （必须 <code>width: fit-content</code> 贴合最长行）。</p><ul><li>荧光笔不用 <code>multiply</code> 或色块盖在字上层——黄块把字压成灰，&quot;划重点&quot;变成&quot;涂掉&quot;。</li><li>荧光笔用规则圆角（或直角矩形）——读作文本选区/背景色，不是笔触。</li><li>一句里划两处以上荧光笔——行行有高亮等于没有高亮（同 <code>quote-card</code> 的坑）。</li><li>加了底板盖住人物——那就是 <code>quote-card</code> 了，本卡的全部价值在于&quot;不中断口播&quot;。</li><li>引号做入场后还继续动（漂移/呼吸）——引号是符号，落定后必须绝对静止</li></ul><p>  （design-language §4：画完/落定的元素保持干净静置）。</p><ul><li>hold 砍到 1s 以内——本卡的三个动作（夹 / 出字 / 划线）加起来才 1.06s，</li></ul><p>  hold 比它们的总和还长才对；砍掉 hold 等于砍掉金句本身。</p><h3>复用指引</h3><ul><li>HTML/GSAP：demos/quote-bracket-pull/index.html。<strong>换内容改 <code>.qb-line</code> 的三行文案</strong></li></ul><p>  （荧光笔的关键短语用 <code>.qb-mark-wrap</code> 包住即可，色块宽度自动贴合）；   行数增减直接加删 <code>.qb-line</code>（错峰是 <code>stagger</code> 算的，不用改 delay），   但引号的落位 <code>top/bottom</code> 要跟着微调（<code>.qb-mark.open</code> 的 <code>top</code>、<code>.close</code> 的 <code>bottom</code>）。   <strong>引号字号跟着正文字号等比</strong>（正文 32px ⇒ 引号 108px，即 3.4 倍）；换字号时两个都要改。   节奏只调 <code>markDur</code>（主动作）与 <code>hold</code>（余味），<code>lineStagger</code> 是手感常量。   不要碰&quot;两枚引号写在同一个 <code>tl.to([open, close], ...)</code> 里&quot;这件事——那一行就是第一命门的实现。</p><ul><li>Remotion 移植：两枚引号<strong>必须写在同一个 <code>interpolate</code> 局部时钟上</strong></li></ul><p>  （<code>const p = interpolate(frame, [0, 10], [0, 1], {easing: Easing.out(Easing.cubic), extrapolateRight: &quot;clamp&quot;})</code>，   然后左引号 <code>translate(${-30*(1-p)}px, ${-14*(1-p)}px)</code>、右引号乘 <code>+1</code>）——   共用一个 <code>p</code> 是&quot;同帧同曲线&quot;的结构保证，分成两个 Sequence 早晚会被人改出错峰。   三行各一个 <code>&lt;Sequence from={Math.round((5 + i*2.7) * 1)}&gt;</code>（@30fps：引号 10 帧，第 5 帧起字，行错峰 ≈2.7 帧，取整 3）；   荧光笔用 <code>scaleX</code> + <code>transformOrigin: &quot;left center&quot;</code>，<code>mixBlendMode: &quot;multiply&quot;</code> 在 Remotion 里正常工作。</p><ul><li>剪辑软件对应物：剪映/CapCut——两枚引号做成两个文本层，<strong>同时打关键帧</strong></li></ul><p>  （框选两层一起打，别一层一层做，手动做必然错峰）；三行文字三层&quot;位置 + 不透明度&quot;，   逐层往后拖 3 帧；荧光笔用一个黄色矩形贴纸 + 缩放（横向）关键帧 + 图层混合模式设&quot;正片叠底&quot;，   锚点拖到左端（默认中心锚点会让色块从中间往两头长，那是 <code>quote-hold-arrow</code> 的语言）。   AE——两枚引号父级绑到<strong>同一个 Null</strong>，只给 Null 打一组 <code>Position</code> 关键帧，   引号各自用 <code>Scale</code> 的 x 轴 ±100 做镜像（这样&quot;同帧&quot;是结构强制的，不靠手动对齐）；   荧光笔用 Shape Layer 矩形 + <code>Scale</code> x 关键帧 + 图层混合模式 <code>Multiply</code>。</p><ul><li>与本库同类卡的分工（<strong>必读，两张金句卡容易混</strong>）：</li></ul><p>  - <code>quote-card</code> = <strong>让位仪式</strong>（底板盖住人物、整屏接管、逐句砸、行错峰 0.15s、出场下滑）。     用在观点峰值、暴论、片尾收束；一条视频最多用一两次。   - <strong>本卡 = 排版式引用</strong>（不盖板、人物不退场、引号夹出引文区、行错峰 0.09s、无出场动作）。     用在引别人的话、念留言、把一句话立成引文；克制，同一条视频里可以用两三次。   - <code>quote-hold-arrow</code> = <strong>金句的第三种</strong>：三行里<strong>只有末行升级</strong>（先平淡后高亮 + 箭头），     重点是&quot;这一句里的这一行&quot;，不是整段引文。   - <code>tracking-in</code> = 单行大标题的一次性入场（一行字的标题动作）；     <code>highlighter-sweep</code> = 只做荧光笔那一下（在已有文档/长文上划重点，不带引号构图）。</p><h3>动效范围</h3><ul><li>属于本卡的：两枚大引号<strong>同帧同曲线</strong>从对角向内推入（<code>x ∓30 / y ∓14 → 0</code> + <code>opacity 0→0.9</code>，<code>0.32s power3.out</code>）这个&quot;夹&quot;的动作——<strong>同帧是本卡的结构，不是参数</strong>；引号尺寸必须压过正文两倍以上、<code>opacity</code> 落在 0.85~0.9 这条&quot;符号不是装饰&quot;的分量纪律；引号走完 50% 才起字这个交叠时机；三行 <code>opacity</code> + <code>y +6→0</code> 的 <code>0.09s</code> 密错峰（区别于 <code>quote-card</code> 的 0.15s 逐句砸）；末行荧光笔 <code>scaleX 0→1 origin left</code> 走 <code>0.26s</code>、色块在字下层用 <code>multiply</code>、不规则圆角模拟笔触；<code>hold 2.2s</code> 比全部动作总和还长这条比例；<strong>不盖底板、人物不退场</strong>这条构图前提。</li><li>不属于本卡的：demo 那三行具体金句与「主动去解决问题」这个关键短语、32px 正文 / 108px 引号的绝对值（比例才是本体）、Georgia 这个具体衬线族、<code>#1d1d1f</code> 墨色、金句块落在版心偏上、左下角标数字人占位、<code>#FFE949</code> 之外的任何配色、白底舞台。</li><li>迁移接口：内容入口是 <code>.qb-line</code> 的文案与行数（荧光笔用 <code>.qb-mark-wrap</code> 包关键短语）；<strong>引号与正文的字号比是 3.4:1</strong>，换字号时两者等比同改（引号落位 <code>top/bottom</code> 跟着字号线性缩放）；<code>markDx/markDy</code> 按舞台宽等比（960 ⇒ 1920 时翻倍），两者<strong>必须保持 30:14 的反向对称</strong>；<code>lineStagger 0.09s</code> 是手感常量（换语速也不动）；<code>hold</code> 按字数给（每字约 0.1s，下限 1.5s）；竖屏把行数收到 2~3 行、正文降到 28px（引号跟着到 95px），引号落位改成&quot;左上 / 右下贴块边缘&quot;不变。</li><li>底色要求：<strong>白底即可</strong>。深底也成立，换值：正文与引号反白到 <code>#f5f5f7</code>（引号 <code>opacity</code> 仍 0.9），荧光笔的 <code>mix-blend-mode</code> 必须从 <code>multiply</code> 换成 <code>screen</code>（深底上 multiply 会把黄块乘成黑，划线直接消失）。唯一约束是底不能有画面元素落在引号位（引号在金句块外侧 30~40px 处，那两块区域必须是净空）——引号压在人物或素材上时，观众读不出它是符号，会当成画面里的图形。</li></ul>","quote-card":"<h3>意图</h3><p>金句值得一个&quot;让位仪式&quot;——人先退场、字占全屏，观众才知道这句话是本条视频的钱。 命门：<strong>底板要实</strong>（透明度不够，文字和人物打架，仪式感归零）、<strong>逐行不逐字</strong>（行是节奏单位， 行内再加字级动画就花了）、<strong>关键词只挑 1~2 个</strong>（行行有高亮等于没有高亮）。</p><h3>动效核心</h3><ul><li>层级：人物层在底，<code>.quote-panel</code> 整屏底板（实底，demo 用灰阶 #1d1d1f）盖上</li><li>入场：底板 opacity 0→1，0.25s power2.out；同时人物被盖即&quot;压暗&quot;</li><li>正文：3~5 行大字，每行 y 30px→0 + opacity 0→1，0.4s power3.out，行间 stagger 120~180ms</li><li>关键词：行内 span 换高亮色（#ffd23e）且 font-size 1.2em——静态样式，不参与动画</li><li>出处小字延迟最后一行约 0.2s 淡入</li><li>出场：整卡 opacity→0 + y +40px，0.3s power2.in，直接回到人物</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>底板不透明度</td><td>1（实底）</td><td>&lt;0.9 人物透出来和文字打架；全实底才有&quot;让位&quot;感</td></tr><tr><td>行错峰</td><td>150ms</td><td>&gt;250ms 像逐条列表不像一句话；&lt;80ms 读作整段淡入</td></tr><tr><td>单行入场</td><td>0.4s</td><td>&gt;0.6s 拖沓；&lt;0.25s 行与行的先后关系看不出来</td></tr><tr><td>行数</td><td>3~5 行</td><td>超过 5 行就不是金句是段落，观众不读</td></tr><tr><td>hold</td><td>2~4s</td><td>跟着语速走：读完 +0.5s 就切，多留一秒都是空气</td></tr><tr><td>出场</td><td>0.3s 下滑</td><td>出场比入场轻；用弹跳出场会抢金句本身的余味</td></tr></table><h3>已知坑</h3><ul><li>行行都加弹跳/行内再加字级动画——重音互相打架，一眼廉价感。</li><li>金句超过 5 行——大字排不下就缩字号，缩了字号就不是大字报。</li><li>底板半透明看得见人物——文字浮在人脸上，读作弹幕不是金句卡。</li><li>出场用花哨转场——金句的余味在静，出场越轻越高级。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/quote-card/index.html，改 <code>.quote-line</code> 文案与 <code>.kw</code> 位置即可换句子；节奏全在 <code>CONFIG</code>（panelIn/lineStagger/hold）。罗翔变体：底板换纯黑、去掉 <code>.kw</code> 色彩、行入场只留 opacity。</li><li>Remotion 移植：每行一个 <code>&lt;Sequence from={i*5}&gt;</code> + <code>spring({damping:200})</code> 驱动 y/opacity；hold 用 Sequence duration 控制；出场 interpolate(frame, [out, out+9], [0, 40])。</li><li>剪辑软件对应物：剪映&quot;文字模板→大字报&quot;；CapCut &quot;quote card&quot;; AE 里是文本层 position/opacity 关键帧 + 纯色层做底板。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：底板 opacity 0→1 盖住人物层的<strong>遮蔽动作</strong>（0.25s、power2.out，必须是实底）；正文 3~5 行各 <code>y 30→0 + opacity 0→1</code>（0.4s、power3.out）、行间 stagger 120~180ms 的自上而下逐行错峰；出处小字延迟最后一行约 0.2s 淡入；hold 2~4s；整卡 <code>opacity→0 + y +40px</code> 下滑退场（0.3s、power2.in）。纪律部分同属本卡：<strong>逐行不逐字</strong>（行是节奏单位，行内关键词只做静态换色放大、不参与动画）。</li><li>不属于本卡的：主持人剪影占位、示例金句与出处文案、字号 42px / 字重 800 / 字距、底板与关键词的具体色值（黑底白字 / 白底黑字 / 罗翔式纯黑白都成立）。</li><li>迁移接口：<code>panelIn</code> 定盖板速度，<code>lineStagger</code>/<code>lineIn</code> 定逐行节奏，<code>hold</code> 跟语速走，<code>out</code>/<code>outDrop</code> 定退场；换风格只改底板 background + 行文字 color + <code>.kw</code> 高亮色三个值（反色变体：底板换 #ffffff、文字换 #1d1d1f）；换尺寸时字号与 <code>lineRise</code>/<code>outDrop</code> 按画幅短边等比缩放。</li><li>底色要求：<strong>需要与舞台底色有明度反差的实底板</strong>（例外）。理由：本卡的核心动作是&quot;底板盖住人物、字占全屏&quot;的让位仪式——底板若与舞台同为白，遮蔽动作在画面上不可见，动效等于没发生。demo 取最中性的灰阶深底 #1d1d1f（无色相、不引入品牌色）。复用者反过来配也成立（白底板 + 深色人物层），关键是<strong>反差本身</strong>，不是深浅方向。</li></ul>","soft-blur-in":"<h3>意图</h3><p>本库现有的字幕类都在&quot;打点&quot;：<code>keyword-pop-highlight</code> 砸重音、<code>typewriter-reveal</code> 一个字一个字敲。 它们都有明确的节拍， 所以都有一个共同代价——<strong>它们都在争注意力</strong>。段落里全是这种字，观众的眼睛一直被拽。</p><p>这张卡补的是<strong>最低能量档的字幕入场</strong>：字不是&quot;出现&quot;的，是<strong>被对焦出来</strong>的。 观众感知到的是&quot;画面本来就有这句话，只是刚刚看清&quot;，而不是&quot;一句话飞进来了&quot;。 所以它能用在字很多、字很频繁的地方——旁白句、结论句、切素材后的第一句—— 连着上五句也不会让人觉得画面在闹。</p><p>命门两条：① <strong>解糊与淡入走满 0.9s，位移只占前 33%（0.3s）</strong>。位移与解糊同停会读作 &quot;整块被推上来&quot;（一个有方向的入场），位移先停之后那 0.6s 只在解糊，才是&quot;对焦&quot;这个语义； ② <strong>逐字错峰只有 1 帧（0.033s）</strong>。这个值小到几乎不是&quot;逐字&quot;——9 个字的整句头尾只差 0.27s， 肉眼读作一整块，但仍留下一道极浅的左→右推进感。错峰放大到 0.1s 以上它立刻变成 另一张卡（&quot;逐字柔焦&quot;，能量档整个跳上去，也就不再是本卡了）。</p><h3>动效核心</h3><ul><li><strong>三条属性走同一条时间线，但位移比另两条早停</strong>：</li></ul><p>  - <code>opacity 0 → 1</code> 与 <code>filter: blur(字号 1/6) → 0</code>（demo 72px ⇒ 12px）：走满 <code>dur = 0.9s</code>   - <code>translateY +12px → 0</code>：只走 <code>travel = 0.3s</code>（= <code>dur</code> 的 33%）   - 三条同起，位移先停 —— <strong>柔性的全部来源</strong></p><ul><li><strong>逐字错峰 0.033s（源码 1 帧 @30fps）</strong>：第 i 个字的起点 = <code>lead + i × 0.033</code>。</li></ul><p>  中文按码点切字（<code>Array.from</code>）即逐汉字；标点也算一个字，跟着走是对的</p><ul><li><strong>缓动全卡一条 <code>cubic-bezier(0.22, 1, 0.36, 1)</code></strong>（easeOutQuint 家族）：起手极快、尾段很长的缓收。</li></ul><p>  位移与解糊同族缓动，两者的&quot;减速感&quot;才是一件事。GSAP core 不带 <code>CustomEase</code>，   demo 里用牛顿迭代解 <code>x(t)=p</code> 再取 <code>y(t)</code>（8 次迭代，误差 &lt;1e-5）</p><ul><li><strong>模糊量恒为字号的 1/6</strong>（源码 12px @72px 字号；本库 demo 同为 72px ⇒ 12px）。这是比例常量不是绝对值——</li></ul><p>  换字号必须等比改，否则大字号下&quot;糊得不够&quot;、小字号下&quot;字被糊没了&quot;</p><ul><li><strong>每个字是独立的 <code>inline-block</code></strong>：<code>transform-origin: 50% 55%</code>（重心略偏下，解糊收尾时字不往上飘）、</li></ul><p>  <code>backface-visibility: hidden</code>（filter + transform 同时跑时避免 Safari 的合成层抖动）</p><ul><li><strong>整行 <code>letter-spacing: -0.05em</code></strong>（源码值）：略收紧，柔焦解开后整句读作&quot;一整块&quot;而不是&quot;一排字&quot;</li><li><strong><code>white-space: nowrap</code> 是硬要求</strong>：每个字都是独立 inline-block，不锁 nowrap 时浏览器会在任意两字之间换行</li><li><strong>层级</strong>：舞台白底 → 整行 flex 居中 → 单字（唯一被 transform / filter 的元素）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>dur</code></td><td>0.9s</td><td>解糊 + 淡入总时长，本卡的能量旋钮；&lt;0.5s 读作普通淡入（柔焦这层语义丢掉），&gt;1.4s 观众等着字看清、口播已经讲下一句了</td></tr><tr><td><code>travel</code></td><td>0.3s</td><td><strong>位移占 <code>dur</code> 的前 33%，本卡第一命门</strong>；= <code>dur</code>（位移与解糊同停）立刻读作&quot;整块被推上来&quot;，不再是对焦；0 则完全没有重量、字浮在空中解糊</td></tr><tr><td><code>stagger</code></td><td>0.033s</td><td><strong>逐字错峰，本卡第二命门</strong>；0 = 纯整块（少一道推进感，可接受但更平），&gt;0.1s 变成&quot;逐字柔焦&quot;（另一张卡，能量档跳一整级）</td></tr><tr><td><code>blur</code></td><td>字号的 1/6（72px ⇒ 12px）</td><td>起始模糊量，<strong>比例常量</strong>；&lt;字号 1/12 读作轻微失焦、看不出&quot;对焦&quot;过程，&gt;字号 1/4 起手是一团雾、观众不知道要看什么</td></tr><tr><td><code>rise</code></td><td>16px（≈字号 22%，72px ⇒ 16px）</td><td>起始下沉量；0 少了那一点重量（可用但更飘），&gt;字号 40% 读作&quot;上滑淡入&quot;（方向感盖过柔焦）</td></tr><tr><td><code>lead</code></td><td>0.3s</td><td>起手静置等口播开口；0 则字与画面同时出现，观众来不及把注意力挪过去</td></tr><tr><td><code>hold</code></td><td>1.2s</td><td>收尾定格——清晰的整句是本卡的落点，按字数给（每字约 0.15s，读完再留半拍）</td></tr><tr><td>字数</td><td>6~12 字</td><td>更长的句子错峰累积会拉长首尾差（20 字 ⇒ 0.67s，整句读作&quot;扫过&quot;而不是&quot;一块&quot;），要么减 <code>stagger</code> 到 0.02s 要么拆句</td></tr></table><h3>已知坑</h3><ul><li>位移与解糊同时结束——整句读作&quot;被推上来&quot;，柔焦对焦这层语义直接消失；位移必须只占前 33%。</li><li>错峰放大到 0.1s 以上还叫它柔焦淡入——那已经是&quot;逐字柔焦&quot;，能量档从低跳到中，用在旁白句上会抢戏。</li><li><code>blur</code> 写成绝对像素值跟着复用——换字号后大字糊不够、小字糊没了；模糊量必须按字号 1/6 等比。</li><li>整行不锁 <code>white-space: nowrap</code>——每个字是独立 inline-block，浏览器会在任意两字之间换行，起手那一帧整句排版就是错的。</li><li>给整行（而不是单字）加 <code>filter: blur()</code>——整行成为一个合成层，逐字错峰全部失效，且中文行会被整体糊成一条灰带。</li><li>位移与解糊用两条不同的缓动——两者的&quot;减速感&quot;不再是一件事，慢放下能看出字先停住再单独解糊，割裂。</li><li>单字忘了 <code>backface-visibility: hidden</code>——filter 与 transform 同时跑，Safari 的合成层会在解糊末段抖一下。</li><li>用在需要重音的句子里——本卡全程没有任何一个字比别的字重，想砸重音请换 <code>keyword-pop-highlight</code> 或 <code>type-contrast-emphasis</code>。</li><li>深底上直接抄墨色 <code>#171717</code>——本卡在深底上只需把字色反白，但 blur 在深底上&quot;糊出来的光晕&quot;更明显，<code>blur</code> 要收到字号的 1/8。</li><li>重播不重建 DOM 只重置 transform——换文案后字数变了，旧的 span 还在，错峰序列与实际字数对不上。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/soft-blur-in/index.html。<strong>换内容只改 <code>CONFIG.text</code></strong> 这一个字符串（6~12 字），</li></ul><p>  切字与错峰序列都是运行时算的。能量只调 <code>dur</code>（<code>travel</code> 要跟着保持约 33% 的比例，两者的比例才是手感）；   换字号改 <code>.sb-text</code> 的 <code>font-size</code>，同时把 <code>CONFIG.blur</code> 改成新字号的 1/6、<code>CONFIG.rise</code> 改成新字号的 22%。   整句的落位改 <code>.sb-line</code>（demo 是 <code>inset: 0</code> + flex 整屏居中——<strong>纯文字卡</strong>，不放主持人；   要让人物留在画面里就把 <code>.sb-line</code> 收成一列白区，同时按新宽度把 <code>font-size</code> 收回去）。   <code>cubicBezier()</code> 那个解算器是通用的，别的 demo 要 <code>cubic-bezier</code> 缓动可以直接抄走。</p><ul><li>Remotion 移植：源码 <code>registry/remocn/soft-blur-in/index.tsx</code> 是逐帧查表写法（不建时间线，每帧算每个字该多糊），</li></ul><p>  在 Remotion 里比搬 GSAP 时间线更直接，可以原样抄。<strong>帧↔秒换算（源码 30fps）</strong>：   <code>charDurationFrames 27</code> ⇒ <code>dur 0.9s</code>、<code>charTravelFrames 9</code> ⇒ <code>travel 0.3s</code>、<code>staggerFrames 1</code> ⇒ <code>stagger 0.033s</code>。   每字三个 <code>interpolate</code>，全部传 <code>easing: Easing.bezier(0.22, 1, 0.36, 1)</code> +   <code>extrapolateLeft/Right: &quot;clamp&quot;</code>（<strong>clamp 不能省</strong>——不 clamp 的话 <code>local &lt; 0</code> 的字会算出负 opacity 与负 blur，   Chrome 里 <code>blur(-3px)</code> 直接不渲染，那个字会在起手前闪一下）：   <code>local = frame - i * staggerFrames</code> 是三条 interpolate 共用的局部时钟。   尺寸换算：源码 <code>fontSize 72</code> 是 1280×720 画幅的值；本库 demo 是<strong>纯文字整屏</strong>，960 舞台上直接用 72px，   所以 <code>blur 12</code>、<code>distance 16</code> 都与源码同值（比例照旧：blur = 字号 1/6、distance = 字号 22%）。</p><ul><li>剪辑软件对应物：剪映/CapCut——文本层套&quot;模糊入场&quot;或&quot;渐显&quot;预设<strong>都不对</strong>（前者没有位移、后者没有模糊），</li></ul><p>  正确做法是一个文本层 + &quot;高斯模糊&quot;效果打两个关键帧（9 → 0，0.9s）+ 不透明度两键（0 → 100，0.9s）+   位置两键（下方 12px → 0，<strong>只 0.3s</strong>）；逐字错峰在剪映里做不出来（&quot;逐字显示&quot;是硬切不是柔焦），   0.033s 的错峰肉眼几乎读不出，<strong>直接放弃错峰做整块版</strong>是合理取舍。   AE——一个文本层，<code>Fast Box Blur</code>（Blurriness 9 → 0）+ <code>Opacity</code> + <code>Position</code> 三组关键帧，   曲线在 Graph Editor 里手拉成 <code>(0.22,1,0.36,1)</code>（或用 <code>Easy Ease Out</code> 再把手柄拉到底，很接近）；   要错峰就上 <code>Text Animator</code>：Blur + Opacity + Position 三个属性，<code>Range Selector</code> 的 <code>Offset</code> 从 −100% 走到 0%，   <strong><code>Advanced → Ease High</code> 拉满</strong>（否则默认的线性范围选择器会让错峰读作一道明显的扫光）。</p><ul><li>与本库同类卡的分工：<code>keyword-pop-highlight</code> = 一句里砸一个重音；</li></ul><p>  <code>typewriter-reveal</code> = 逐字符敲出（有档案感的节拍）；<code>per-character-rise</code> = 逐字升起（有方向的入场）；   <strong>本卡 = 最低能量的整句入场</strong>（不打点、不给方向、不给重音，只把字对焦出来）。   本卡是唯一可以<strong>连着用五句都不闹</strong>的字幕卡，也因此它不能承担任何强调职责。</p><h3>动效范围</h3><ul><li>属于本卡的：<code>opacity 0→1</code> 与 <code>blur → 0</code> 走满 0.9s、<code>translateY</code> 只占前 0.3s（33%）这条时间纪律；起始模糊量恒为<strong>字号的 1/6</strong> 这个比例；<code>stagger 0.033s</code>（源码 1 帧）这个&quot;小到几乎不是逐字&quot;的错峰量级；位移与解糊共用一条 <code>cubic-bezier(0.22, 1, 0.36, 1)</code>；<code>transform-origin: 50% 55%</code> 这个略偏下的重心；起始下沉 ≈ 字号 22%；单字 <code>inline-block</code> + 整行 <code>nowrap</code>（拒绝把 filter 加在整行上）这个实现纪律。</li><li>不属于本卡的：demo 那句「答案往往没那么复杂」的具体文案、72px 字号与 600 字重、<code>#171717</code> 这个墨色、<code>letter-spacing: -0.05em</code>（拉丁字体的收紧值，中文可以取 0 到 −0.05em 之间任意值）、无衬线字族的选择、白底舞台、以及&quot;整句落在舞台正中&quot;这个落位（画幅正中、下三分之一、字幕安全区都成立）。<strong>demo 是纯文字卡、不放主持人</strong>（2026-08-25 用户定版）——因为本卡的动作是&quot;整句被对焦出来&quot;，人物占位会把注意力从这个极低能量的动作上分走；但应用侧要让人物留在画面里同样成立（句子落在人物旁的留白列或字幕安全区，只要那一带足够空），落位不属于本卡的动效本体。</li><li>迁移接口：<code>CONFIG.text</code> 是唯一的内容入口（6~12 字）；能量只调 <code>dur</code>，<code>travel</code> 必须跟着保持约 33% 的比例；<code>blur</code> 按字号 1/6、<code>rise</code> 按字号 22% 等比缩放；<code>stagger</code> 是<strong>手感常量，换尺寸换语速都不要动</strong>（字数超过 12 时才减到 0.02s）；<code>hold</code> 按字数给（每字约 0.15s）；竖屏用 6~9 字并把字号收到 40~46px（本卡没有横向推挤，唯一约束是整句 <code>nowrap</code> 后不超出可用宽度的 90%）。</li><li>底色要求：白底或深底都成立（深底把字色反白即可）。唯一约束是<strong>底不能有细密纹理或高频细节</strong>——字在解糊的 0.9s 里始终是&quot;半透明的糊块&quot;，底上的细节会透过来与糊块混在一起，观众读不出那是字。渐变底可以（低频），实拍花底不行（要么先压一层半透明底板，要么改用白字加深色描边/投影的高对比字幕）。</li></ul>","speed-slab-title":"<h3>意图</h3><p>&quot;块从旁边冲进来&quot;本身只是一个平移入场，它给的是<strong>方向</strong>不是<strong>速度</strong>——观众读到的是&quot;这个块从左边来&quot;。 让它读成速度需要一个物理线索：<strong>残影</strong>。三道平行短线在块停住的那一帧从块的左缘长出来， 再立刻消失——那是&quot;块刚才走得太快，空气里还留着痕&quot;这个视觉谎言。 这张卡的全部信息量都在那 0.4 秒的线上。</p><p>命门两条： ① <strong>速度线必须在 0.2s 内消失</strong>。残影的定义就是&quot;该消失的东西还在&quot;， 线留在屏上超过半秒它就变成了装饰性的三道杠——一个平面 logo 元素，而不是运动痕迹。 留下来的版本不是&quot;更好看的本卡&quot;，是另一张卡（装饰性斜块标题），能量档反而降了。 ② <strong>块内的字要慢半拍</strong>。字与块一起硬绑在一起进场，整体读作一张 PNG 在平移； 给字一个 40px 的反向补偿（块 <code>overflow: hidden</code> 把它裁掉一截）+ 比块长 0.06s 的追赶时长， 字就获得了自己的惯性——观众读到的是&quot;块带着字冲进来，字被甩在后面又追上&quot;。 这 40px 是本卡&quot;贵&quot;的来源，也是最容易被省掉的一步。</p><h3>动效核心</h3><ul><li><strong>四拍，其中拍③④ 是同一件事的两半</strong>：</li></ul><p>  - 拍① <code>t=0.40</code> 主标题：<code>scale 1.04 → 1</code> + <code>opacity 0 → 1</code>，<code>0.18s power3.out</code>，无位移，     <code>transform-origin: 0% 50%</code>（护住左基线）   - 拍② <code>t=0.66</code> 紫块：<code>x -580 → 0</code>，<code>0.28s</code> <strong><code>power4.out</code></strong> —— 全卡唯一用 power4 的地方，     它的&quot;起手极猛、尾段极长&quot;就是刹车感。     <strong>起点必须让块完全出画</strong>：判据 <code>|slabFrom| &gt; 块右缘距舞台左缘的距离 ÷ cos(斜切角)</code>     （本 demo 块右缘 x≈562、−3° ⇒ 阈值 563，取 −580 留 17px 余量）。     起始帧露出块的任何一部分都读作&quot;块本来就在那儿，只是滑了一下&quot;，&quot;从画外冲进来&quot;就没了   - 拍②b 同帧起 块内字：<code>x -40 → 0</code>，<code>0.34s power3.out</code> —— 比块<strong>长 0.06s</strong>、缓动<strong>低一阶</strong>，     两条都是&quot;字更慢&quot;的实现手段（只改时长不改缓动也成立，但慢感弱一半）   - 拍③ <code>t=0.94</code>（= 块停住那一帧）三道速度线：各自 <code>scaleX 0 → 1</code>（<code>transform-origin: 100% 50%</code>     ⇒ 从块左缘<strong>往左长</strong>），单道 <code>0.09s power3.out</code>，线间错峰 <code>0.067s</code>（2 帧 @30fps）   - 拍④ 每道线张开结束立即 <code>opacity 1 → 0</code>，<code>0.20s power2.in</code>（<strong>in</strong> 不是 out：先慢后快地抹掉，     像被空气吃掉；用 out 会读作&quot;刻意淡出的装饰&quot;）</p><ul><li><strong>速度线的长度必须不等</strong>：<code>42 / 30 / 22px</code>（≈ 0.55 / 0.39 / 0.29 × 字号）。</li></ul><p>  等长三道线是印刷符号（≡），不等长才是拖尾。落位比例 <code>0.24 / 0.50 / 0.76 × 块高</code>——   中间那道最长会读作箭头尾，所以最长的那道放最上面</p><ul><li><strong>速度线与块共享同一个静态斜切</strong>：三道线是 <code>.ss-row</code>（<code>rotate(-3deg)</code>）的子元素，</li></ul><p>  所以天然与块平行。分开各自 rotate 一定会对不齐，且改角度要改四处</p><ul><li><strong>两行之间的净空是硬约束</strong>：块斜切 −3° 后<strong>右上角是最高点</strong>，它正好落在主标题末字下方。</li></ul><p>  <code>.ss-row</code> 的 <code>margin-top: 36px</code> 让块的最高点离主标题<strong>字面底</strong>（不是行盒底）   还有 <strong>14px</strong> 净空（12~16px 是甜点区）。按 <code>margin-top</code> 直觉给 14px 的话   块的右上角会压进主标题末字 7px —— 行盒底与字面底差十几 px，必须按字面算</p><ul><li><strong>块的 <code>overflow: hidden</code> 是硬要求</strong>：字的 40px 反向补偿靠它裁切才看得出来。</li></ul><p>  不裁切的话字只是&quot;从块外面挪进来&quot;，读作两个物件各自平移</p><ul><li><strong><code>x</code> 的层级分离</strong>：块被 <code>x</code> 平移（<code>.ss-slab</code>），字<strong>在块的局部坐标里</strong>再被 <code>x</code> 平移（<code>.ss-slab-t</code>）——</li></ul><p>  两级 transform 叠加，字的实际位移 = 块的位移 + 自己的补偿。写成同一个元素做不出追赶</p><ul><li><strong>三道线是运行时按块高度生成的</strong>（<code>slab.offsetHeight</code>），换字号不用改落位常量</li><li><strong>层级</strong>：舞台白底 → 主标题 → 副题行（静态斜切）→ 速度线（块左侧，绝对定位 <code>right: 100%</code>）+ 紫块（内含被裁的字）</li><li><strong>强调色只上在块与线上</strong>：<code>#7A5AF8</code>（参考图紫系）。主标题黑 <code>#1d1d1f</code>，块内字反白</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>lineFade</code></td><td>0.20s</td><td><strong>本卡第一命门</strong>；&gt;0.5s 线成了装饰性三道杠（速度语义消失，卡降级），0 则线闪一帧看不见（残影要&quot;被看到正在消失&quot;）</td></tr><tr><td><code>lagPx</code></td><td>40px（≈0.53 字宽）</td><td><strong>本卡第二命门</strong>，字的反向补偿量；0 则块与字读作一张 PNG 平移，&gt;0.9 字宽字在块里露出空白一截（观众读作&quot;字没跟上是 bug&quot;）</td></tr><tr><td><code>lagDur</code></td><td>0.34s（= 块的 1.2 倍）</td><td>字追上块的时长；= <code>slabDur</code> 则字与块同停（追赶感消失），&gt;1.6 倍字在块停后还在爬，读作字幕加载慢</td></tr><tr><td><code>slabFrom</code></td><td>-580px</td><td>块的起点，<strong>必须完全在画外</strong>：`</td><td>slabFrom</td><td>&gt; 块右缘距舞台左缘 ÷ cos(斜切角)`（本卡 563，取 -580）。给小了起始帧就能看见块的一截（用户 2026-08-25 审片反馈的错法），&quot;从画外冲进来&quot;直接降级成&quot;原地滑一下&quot;</td></tr><tr><td><code>.ss-row</code> 的 <code>margin-top</code></td><td>36px（净空 14px）</td><td>两行的垂直间距；块斜切后<strong>右上角</strong>是最高点，它离主标题<strong>字面底</s
