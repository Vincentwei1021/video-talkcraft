<li><strong>换自己的手素材</strong>：绿幕拍/生图（笔尖要清晰可见且不被手指挡住）→ 按&quot;已知坑&quot;里的抠像与羽化流程出透明 PNG</li></ul><p>  → 量 <code>tipX/tipY</code> 与 <code>axisDeg</code> 填进 <code>ASSET</code> → 左手素材把 <code>tilt</code> 取负值（笔身朝左上、手在笔迹左上方）。</p><ul><li>Remotion：<code>template/components/pencil.tsx</code> 的 <code>PencilDraw</code>，传 <code>d</code>（SVG path）+ <code>at</code>（帧）+ <code>viewBox</code> 即用；多笔用多个实例按 at 错峰。</li><li>手绘 path 来源：Figma/Illustrator 画好导出 path，或让模型直接写简单几何的 d。</li><li>剪辑软件对应物：剪映&quot;手绘动画&quot;贴纸、AE 的 stroke 描边 + 关键帧笔 Null 绑定。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<code>strokeDashoffset</code> 从满到 0 的描画进度（起笔快收笔缓，<code>power2.inOut</code>，单笔 0.6~1.2s）；手握铅笔逐帧 <code>getPointAtLength</code> 骑在笔尖上、笔尖零偏移落在生长点，握笔角 +42° ± 转弯跟随（始终在 +37°~+47°）；多笔按笔画顺序串接（一笔画完再起下一笔）；画完铅笔沿笔身轴向抬离 26px 并淡出；末尾标签的 0.35s 跟进。画完的线保持干净静置——<strong>不做 line boil / 定格抖动</strong>是本卡定版的一部分。</li><li>不属于本卡的：纸色/底色（demo 已改纯白）、示例里画的那辆车与卡片框的具体 path 形状、标签文案、线宽与字号、素材里那只手的肤色/性别/持笔款式。手绘感来自笔迹形状（歪斜、弧度）本身，不来自任何纹理或抖动。</li><li>迁移接口：线色改 <code>CONFIG.stroke</code>（默认墨色 #1d1d1f）；笔画表改 <code>CONFIG.strokes</code> 的 <code>d</code> / <code>dur</code> / <code>width</code>（每条 = 一笔）；速写感调小 <code>dur</code>（24 帧起），马克笔感把 <code>width</code> 调到 8+ 并换色；笔的落点行为改 <code>CONFIG.pencil</code> 的 <code>scale</code> / <code>tilt</code> / <code>follow</code> / <code>lift</code>；换手素材改 <code>ASSET</code>（<code>href</code> / <code>w</code> / <code>h</code> / <code>tipX</code> / <code>tipY</code> / <code>axisDeg</code>，后三个必须在新图上重量）。素材是实拍照片，肤色与笔杆黄不做灰阶化——灰手灰笔读不出&quot;有人在画&quot;；用矢量笔时同理保留木色 #e8c39a、笔杆黄 #FFD400、金属箍灰与橡皮粉 #E79E96（靠这几截才读得出是铅笔而不是黄棒子）。</li><li>底色要求：白底即可。纸色（原 #f5f2ea）属于风格层，复用者想要纸面质感自己在底下铺一层，动效不依赖它。</li></ul>","terminal-typing-log":"<h3>意图</h3><p>讲&quot;我真的跑过这个东西&quot;时，静态终端截图的说服力接近零——观众看不出那是跑出来的还是拼出来的。 而&quot;文字慢慢出现&quot;的伪终端更糟：它读作网页加载动画，不是命令行。 本卡的价值在于三条<strong>手感纪律</strong>——真终端的输出不是匀速滴出的，是<strong>成簇蹦出</strong>的； 真终端的滚动<strong>不滑行</strong>，是整行整行地跳；真构建过程里那些 <code>...</code> 结尾的行<strong>会卡住</strong>，那个卡顿就是悬念。 把这三条同时做对，观众不用读懂日志内容也会相信&quot;这段是真跑出来的&quot;，然后把注意力交回给你的讲述。 命门：<strong>分块突进</strong>（逐字符匀速一眼是 CSS 教程）、<strong>滚动零插值</strong>（加 ease 立刻假）、 <strong>语义色只给一个</strong>（成功行绿色；日志、命令、报错都上色就变成彩虹终端，&quot;成功&quot;这一拍的重量没了）。</p><h3>动效核心</h3><ul><li><strong>窗体</strong>：深底终端窗 830×356（= 40 窗栏 + 22×2 留白 + 8 行 × 34 行高，可见 8 行是硬约束）+ 三交通灯（灰阶）+ 中间路径标题。等宽字体 21px，行高 <code>round(fontSize × 1.6) = 34px</code></li><li><strong>① 分块突进（本卡的第一手感）</strong>：先算线性揭示数 <code>linear = floor((t − start) × rate)</code>，</li></ul><p>  再上取整到分块粒度 —— <code>revealed = min(len, ceil(linear / chunk) * chunk)</code>。   日志 <code>chunk 4</code> @ 68 char/s（成簇蹦出）、命令 <code>chunk 1</code> @ 23 char/s（手在敲键盘，逐字符）。   两条速率差一个量级是&quot;人&quot;和&quot;机器&quot;的区别，拉平了就都变成机器</p><ul><li><strong>② 滚动零插值（第二手感）</strong>：<code>steps = 已开打的溢出行数</code>（下标 ≥ <code>visibleLines</code> 的行里 <code>t ≥ start</code> 的个数），</li></ul><p>  缓冲区 <code>translateY = −steps × lineHeight</code>。<strong>没有 tween、没有缓动</strong>——该行开打的那一帧整跳一个行高。   终端不会滑行，加 0.2s ease 立刻读作&quot;网页在滚&quot;</p><ul><li><strong>③ 省略号悬停（第三手感）</strong>：以 <code>...</code> 结尾的行打完后自动冻结 0.6s，</li></ul><p>  这 0.6s 里画面<strong>完全静止</strong>（光标也已撤掉），下一批日志才来。这是&quot;它在想/在装&quot;的唯一表达</p><ul><li><strong>光标</strong>：方块 11×21px（≈ 字号 × 0.55），2Hz 方波闪（<code>floor(t × 2) % 2</code>），</li></ul><p>  <strong>只在该行未打完时存在</strong>——打完即撤。所以冻结段是真静止，不是&quot;有个东西在闪&quot;</p><ul><li><strong>颜色分级</strong>：命令 <code>#f2f2f4</code> 白 / 日志 <code>#9b9ba3</code> 灰 / 提示符 <code>#6f6f78</code> / 成功 <code>#33d16b</code>（唯一语义色）。</li></ul><p>  报错场景把成功绿换成警示红，同样只给一行</p><ul><li><strong>行占位纪律</strong>：未到时刻的行用 <code>visibility: hidden</code> 而不是 <code>display: none</code>——<strong>占位但不显示</strong>，</li></ul><p>  整段布局零重排；跳的只有缓冲区那一个 transform</p><ul><li><strong>层级</strong>：舞台白底 → 终端窗（深底，唯一深色区域）→ 缓冲区（唯一被 transform 的元素）→ 行 → 光标</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>logChunk</code></td><td>4</td><td>日志分块粒度，本卡第一命门；2~4 都成立（4 最&quot;机器&quot;），=1 退化成逐字符即刻变教程代码，&gt;6 每簇太长读作&quot;整行硬切&quot;</td></tr><tr><td><code>logRate</code></td><td>68 char/s</td><td>日志线性底速（分块前）；&lt;40 观众开始读日志内容（跑偏），&gt;100 一行几乎瞬现、丢掉&quot;在跑&quot;的过程感</td></tr><tr><td><code>cmdRate</code> / <code>cmdChunk</code></td><td>23 char/s / 1</td><td>命令行速率与粒度；命令必须 <code>chunk 1</code>（手在敲不会 4 字齐蹦），速率要明显低于日志——两者一致就分不出&quot;人打的&quot;和&quot;机器吐的&quot;</td></tr><tr><td><code>lineDelay</code></td><td>0.27s</td><td>行间基础延迟；单行可用 <code>d</code> 覆写（真实日志段落长短不齐，全用同一个值一眼是假数据），全表 &lt;0.15s 糊成一片、&gt;0.5s 拖节奏</td></tr><tr><td><code>hover</code></td><td>0.60s</td><td><code>...</code> 结尾行的自动冻结；&lt;0.35s 看不出&quot;卡了一下&quot;，&gt;1.0s 观众以为播放器卡住</td></tr><tr><td><code>visibleLines</code></td><td>8</td><td>视口可见行数（窗高由它反推）；&lt;6 一直在跳、读作抖动，&gt;12 溢出发生得太晚、看不到滚动这一拍</td></tr><tr><td><code>lineHeight</code></td><td>34px（= 21 × 1.6）</td><td>行高＝滚动步长，两者必须严格相等；不等的话跳完会错半行，一眼是 bug</td></tr><tr><td><code>cursorHz</code></td><td>2</td><td>光标闪烁；行业默认，调快像故障、调慢像死机</td></tr><tr><td><code>leadIn</code></td><td>0.32s</td><td>起手静置（等口播开口）；0 则观众还没看到窗就已经在打字</td></tr><tr><td>成功行位置</td><td>末行</td><td>成功/失败必须是<strong>最后一行</strong>——中间给结论，后面的日志会把它冲掉</td></tr></table><h3>已知坑</h3><ul><li>逐字符匀速揭示（<code>chunk 1</code> 用于日志）——一眼是 <code>setInterval</code> 教程，真终端的 stdout 是缓冲区刷出来的、成簇。</li><li>滚动加了缓动（哪怕 0.15s ease）——终端不会滑行；平滑滚动立刻读作&quot;这是个网页&quot;。</li><li>命令行和日志同速——分不出&quot;人在敲&quot;与&quot;机器在吐&quot;，整段变成一台机器自言自语。</li><li>全表用同一个行间延迟——节奏机械等距，一眼是假数据；真实日志的段落长短不齐。</li><li>没有 <code>...</code> 悬停——整段变成匀速刷屏，&quot;它在装/在编译&quot;这层因果消失，只剩文字流。</li><li>悬停期间还有光标在闪——冻结的意义是<strong>画面完全静止</strong>，闪一下就把&quot;卡住了&quot;读成&quot;还在跑&quot;。</li><li>光标打完不撤（常驻在已完成行末）——每行结尾挂一个闪块，8 行同时闪成圣诞树。</li><li>语义色发给多个类型（日志蓝、警告黄、成功绿、报错红全上）——彩虹终端，&quot;成功&quot;那一拍没有重量；一段只给一个语义色。</li><li>结论行放在中间——后续日志会把它冲下去，观众记不住结果。</li><li>未到时刻的行用 <code>display: none</code>——行一出现就把整段布局重排一遍，与缓冲区的整跳叠加成&quot;抖两下&quot;。</li><li>只给 <code>.viewport</code> 加 <code>overflow: hidden</code> 就当裁切——那是<strong>边框框</strong>裁切，滚上去的行会露在内边距留白里显示半截；裁切层要单独一层、<code>inset</code> = 内边距（本 demo 踩过）。</li><li>每帧无条件写 <code>textContent</code>——11 行一起重排，慢放时能看到掉帧；只在揭示数真的变了才写 DOM。</li><li>用真实的长构建日志（几十行滚很久）——终端是<strong>证据</strong>不是内容，8~12 行足够；再多观众开始读日志、离开你的讲述。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/terminal-typing-log/index.html。<strong>换内容只改 <code>CONFIG.lines</code></strong>——每行 <code>{ k, t, d?, p? }</code>：</li></ul><p>  <code>k</code> 取 <code>cmd</code>（命令，逐字符）/ <code>log</code>（日志，分块）/ <code>ok</code>（成功，唯一语义色），   <code>d</code> 覆写行间延迟、<code>p</code> 覆写打完后的冻结（缺省时 <code>...</code> 结尾行自动 <code>hover</code>）。   节奏参数全在 <code>CONFIG</code>（<code>logChunk</code> / <code>logRate</code> / <code>cmdRate</code> / <code>lineDelay</code> / <code>hover</code> / <code>visibleLines</code>）。   改字号要同步改 <code>lineHeight</code>（= <code>round(fontSize × 1.6)</code>）与 <code>.ln</code> 的 <code>height</code>、<code>.term</code> 的高度三处——   滚动步长与行高不等会错半行。报错场景把 <code>.ln.ok</code> 的绿换成警示红即可，其余不动。</p><ul><li>Remotion 移植：<code>CONFIG.lines</code> 原样搬成 <code>LINES</code>，<code>buildSchedule()</code> 里的秒全部 × <code>fps</code> 变帧号（纯函数，可直接抄）。</li></ul><p>  揭示数用 <code>const linear = Math.floor(interpolate(frame, [start, start + dur], [0, len], {extrapolateLeft:'clamp', extrapolateRight:'clamp'})); const revealed = Math.min(len, Math.ceil(linear/chunk)*chunk)</code>；   滚动<strong>不要用 interpolate</strong> —— <code>let ty = 0; for (let i = VISIBLE; i &lt; N; i++) if (frame &gt;= starts[i]) ty -= LINE_H;</code>（这就是&quot;零插值&quot;在帧驱动下的等价写法，原版 terminal-simulator 也是这么写的）；   光标 <code>Math.floor((frame/fps)*2) % 2 === 0 &amp;&amp; revealed &lt; len</code>；每行包一个 <code>&lt;Sequence from={starts[i]} layout=&quot;none&quot;&gt;</code> 或直接按 frame 判断可见性。   <strong>不要用 <code>Math.random</code> 给速率加抖动</strong>——多趟渲染会闪烁；分块本身已经提供了不匀感。</p><ul><li>剪辑软件对应物：剪映/CapCut——每行一个文本层，用&quot;打字机&quot;入场预设但<strong>必须把它的速度调到能看出成簇</strong>（多数预设是逐字匀速），</li></ul><p>  <code>...</code> 悬停就是在那一行后面留 0.6s 空白不放任何层；滚动用整段位移的<strong>两个关键帧贴在同一帧</strong>（形成硬跳）或直接把整组文本层往上挪一个行高再切一次；   AE——文本层的 Source Text 用 <code>slider</code> 驱动的表达式取子串（<code>text.sourceText.substring(0, Math.ceil(n/4)*4)</code>，<code>ceil/4*4</code> 就是分块），   滚动用 Position 的 <strong>Hold 关键帧</strong>（右键 Toggle Hold Keyframe，这是&quot;零插值&quot;的原生实现，千万别用默认线性关键帧），光标用一个方块 Solid 配 <code>Math.floor(time*2)%2</code> 的 Opacity 表达式。   任何软件的&quot;终端/黑客打字预设&quot;一律不用——全是逐字匀速 + 常驻闪烁光标 + 平滑滚动，三条命门全踩。</p><h3>动效范围</h3><ul><li>属于本卡的：分块突进的揭示算法（<code>revealed = ceil(linear/chunk)*chunk</code>，日志 chunk 2~4 / 命令 chunk 1，两条速率差一个量级）；滚动零插值（溢出行开打那一帧整跳一个 <code>lineHeight</code>，无 tween 无缓动，步长严格等于行高）；<code>...</code> 结尾行打完自动冻结 0.6s 且冻结期画面完全静止；方块光标 2Hz 方波闪且只在当前行未打完时存在（打完即撤）；行间延迟可逐行覆写以造成不等距节奏；命令/日志/成功三级颜色分级里&quot;一段只给一个语义色且放在末行&quot;这条纪律；未到时刻的行 <code>visibility: hidden</code> 占位（布局零重排，只有缓冲区一个 transform 在动）；裁切层独立一层以内边距为界。</li><li>不属于本卡的：demo 那段 <code>pnpm install / pnpm build</code> 假日志的具体文案与数字（214.6 kB、6.42s 全是演示语境）、<code>~/projects/koubo-site</code> 这个路径标题、三交通灯与 12px 圆角这套 macOS 窗饰、<code>#17171a</code> / <code>#212126</code> 这组深底取值与 <code>#33d16b</code> 这个具体绿、21px 字号与 830×356 这个窗尺寸、角标主持人（数字人）、终端这个载体本身（同一套时序可以套在日志面板、CI 输出、聊天机器人的流式回答上）。</li><li>迁移接口：<code>CONFIG.lines</code> 是唯一的迁移入口——把日志换成目标项目的真实输出（保留&quot;命令 → 日志 → 结论&quot;的三段结构与不等距的 <code>d</code>），成功行永远放末位；语速变化时只改 <code>lineDelay</code> 与各行 <code>d</code>（<strong><code>logChunk</code> / <code>logRate</code> / <code>hover</code> / <code>cursorHz</code> 保持不变</strong>——这四个是手感常量，跟着语速缩放会让快语速下的分块糊成匀速）；尺寸按画幅等比缩放，但 <code>lineHeight = round(fontSize × 1.6)</code>、<code>窗高 = 窗栏 + 留白×2 + visibleLines × lineHeight</code> 两条等式必须同时成立；竖屏把 <code>visibleLines</code> 提到 10~12、窗宽收窄并把日志文案缩短（等宽字体不折行是硬约束，折行会让滚动步长失效）。</li><li>底色要求：<strong>终端窗内必须深底</strong>（这是本卡唯一允许的非白例外）——&quot;命令行&quot;这层语义靠深底成立，且成功行的绿只有在深底上才有足够对比；舞台本身仍是白底，深色只占那个窗口。浅底终端（Solarized Light 一类）也能跑同一套时序，但要把日志灰压到 <code>#6b6b73</code> 一级、成功绿换成 <code>#1a7f3c</code> 一级，否则灰日志在白底上糊成一片。</li></ul>","slow-pull-reveal":"<h3>意图</h3><p>缓推是&quot;往里走&quot;，缓拉是&quot;信息量揭示&quot;——它的价值不在动，而在<strong>终点比起点信息多</strong>： 观众先被按在一个细节上（这个数字很惊人），再被拉开看到它所处的全貌（原来整张表都是这样）。 这个顺序做不了反：先看全貌再推细节是 [slow-push-in](slow-push-in.md) 的活，语义是&quot;聚焦&quot;； 缓拉的语义是&quot;扩展&quot;。做对的命门： <strong>起手必须真的看不见全貌</strong>（1.2~1.35 且兴趣点顶到画心；起手 1.05 就等于全貌已在，拉了也没有揭示）、 <strong>终点必须回正到素材原样</strong>（scale 1、零偏移——拉过 1.0 会露出素材外的空白，整个真实感崩掉）、 <strong>匀速为主 + 收尾收住而不撞停</strong>（末速非零，hold 期接着走完最后一点）。</p><h3>动效核心</h3><ul><li>结构：静态素材满画幅铺在<strong>相机层</strong>里，相机层是全卡唯一被 transform 的元素；素材本身零动画</li><li>起手画幅：<code>transform-origin</code> 固定在<strong>画面中心</strong>（不是兴趣点——拉镜的终点是&quot;素材原样&quot;，origin 必须是画心才能零偏移收尾），</li></ul><p>  用 <code>scale = zoomFrom</code>（1.26）+ 位移 <code>x = −dx, y = −dy</code> 把兴趣点顶到画心，   其中 <code>dx/dy</code> = 兴趣点中心相对舞台中心的<strong>未缩放</strong>偏移（运行时读包围盒反推，换兴趣点只需挪 id）</p><ul><li>主拉：<code>scale zoomFrom → 1</code>，位移同步回零（两者必须同一条时间轴，否则会读成&quot;边缩边平移&quot;两个动作）</li><li>缓动：<strong>匀速</strong>或本库通用运镜 ease <code>p + (1−r)·p²·(1−p)</code>（<code>r = endRate ≈ 0.55</code>，比推镜更&quot;收住&quot;）。</li></ul><p>  末速非零是刚性要求——<code>power2.out</code> 末速为 0，会在到位那帧停死</p><ul><li>hold 期：主拉只走全程的 <code>k</code>，剩下的 <code>(1−k)</code> 留给 hold 期<strong>按主拉末速匀速走完</strong>，正好停在素材原样。</li></ul><p>  <code>k = 1 − (末速 × holdDur) / 总量</code>，两段速度连续，观众读不出段落切换</p><ul><li>时长与推进量的关系同缓推：<code>pullDur</code> 对齐本段口播；<code>zoomFrom</code> 是观感常量，换时长不改它</li><li>素材分辨率要求：原始分辨率 ≥ 画幅 × <code>zoomFrom</code>（1080p 画幅起手 1.26 需要 ≥2420px 宽），起手糊比不运镜更糟</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>zoomFrom</code></td><td>1.26（范围 1.2~1.35）</td><td>起手咬多紧。&lt;1.15 全貌已经基本可见，&quot;揭示&quot;归零；&gt;1.4 起手已经发虚，且拉的过程太长观众等不到</td></tr><tr><td><code>zoomTo</code></td><td>1.0（素材原样）</td><td><strong>不要改</strong>。拉过 1.0 会露出素材外的空白，一眼假；素材四周确实有留白余量时才可以给到 0.96</td></tr><tr><td><code>pullDur</code></td><td>实拍 8~15s / demo 4.4s</td><td>与本段口播等长。压到 2~3s 就成了&quot;拉镜头&quot;（一个事件，属 pullback-cool-transition 的语气），不是缓拉</td></tr><tr><td><code>endRate</code></td><td>0.55</td><td>末速占平均速的比。拉镜比推镜更该收住（0.5~0.65）；1 = 全程匀速也成立；&lt;0.35 读作撒手</td></tr><tr><td><code>holdDur</code></td><td>实拍 3~8s / demo 1.5s</td><td>hold 时长随讲述走；这段走完余下的 <code>(1−k)</code>，画面仍在动</td></tr><tr><td>兴趣点</td><td>页内任意元素（挂 id）</td><td>决定起手咬哪。选&quot;最能勾住人的那个数字/那一行&quot;；选在素材边角会让起手画幅露出素材外的空白</td></tr></table><h3>已知坑</h3><ul><li>拉到 <code>scale &lt; 1</code>——素材边缘外的舞台底色露出来，观众立刻知道这是&quot;一张贴上去的图在缩小&quot;，不是镜头在拉远。终点必须是素材原样满画幅。</li><li><code>transform-origin</code> 咬在兴趣点上（照搬缓推的做法）——那样收尾时素材不会回正到满画幅，必须再补一个位移，两个动作打架。拉镜的 origin 必须是画心，兴趣点靠<strong>位移</strong>顶到画心。</li><li>起手咬得太松（1.05~1.1）——观众一开始就看到了全貌，后面的&quot;拉远&quot;没有揭示任何新信息，白运镜。</li><li>用 <code>power2.out</code> 收尾——末速为零，到位那帧停死；缓拉的收尾要&quot;收住&quot;（减速）但不能&quot;停住&quot;。</li><li>缩放和位移放在两条时间轴/两段 tween 上——读作&quot;先缩一下再平移一下&quot;，不是一个连续的镜头。必须同一段。</li><li>起手位置让兴趣点贴着画幅边——兴趣点没顶到画心，起手构图就是歪的，观众第一眼在找&quot;我该看哪&quot;。</li><li>素材分辨率不够（1080p 画幅配 1600px 宽截图起手 1.26）——最糊的恰恰是最需要看清的起手那几秒。</li><li>当段口播讲的是&quot;聚焦某一点&quot;却用了缓拉——运镜方向和语义反了。往里聚焦用 [slow-push-in](slow-push-in.md)，往外扩展才用本卡。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/slow-pull-reveal/index.html</code>。换素材改 <code>.page</code> 内整块 DOM（或换成一张铺满 <code>.camera</code> 的 <code>&lt;img&gt;</code>）；换起手咬点把 <code>id=&quot;poi&quot;</code> 挂到任意元素上（偏移量运行时反推）；节奏全在顶部 <code>CONFIG</code>（<code>zoomFrom</code> / <code>zoomTo</code> / <code>pullDur</code> / <code>holdDur</code> / <code>endRate</code>）。核心可摘走：<code>CONFIG</code> + <code>camEase</code> + <code>DemoShell.register</code> 回调体三段。</li><li>Remotion 移植：<code>transformOrigin: 'center center'</code> 固定，三条 <code>interpolate</code> 同一时间轴——<code>const z = interpolate(frame, [0, pullEnd, holdEnd], [1.26, zMid, 1], {easing: Easing.bezier(0.33,0.33,0.5,0.85), extrapolateRight:'clamp'})</code>，<code>x</code> / <code>y</code> 从 <code>-dx/-dy</code> 插到 <code>0</code>（<code>dx/dy</code> 由兴趣点在素材内的百分比坐标 × 画幅算出，写死成常量即可）。要匀速就 <code>easing: Easing.linear</code>（<strong>别用默认 bezier，它是 ease-in</strong>）。<code>zMid</code> 与 <code>k</code> 按卡内公式算：<code>k = 1 − (总量/pullDur × endRate × holdDur) / 总量</code>。合成 <code>transform: scale(z) translate(${x}px, ${y}px)</code>。</li><li>剪辑软件对应物：这是 <strong>Ken Burns 的拉镜半边</strong>（推镜半边见 [slow-push-in](slow-push-in.md)）。剪映——图片打两个&quot;缩放&quot;关键帧（126% → 100%）+ 两个&quot;位置&quot;关键帧（偏移 → 0,0），<strong>两端关键帧都设成线性</strong>（默认的缓入缓出会让末速归零）；AE——Scale 126→100 + Position 关键帧，锚点保持素材中心，<code>Keyframe Interpolation → Linear</code>，或在速度图里把末端速度拉到非零；Premiere/CapCut 同理（PR 是 <code>Motion → Scale/Position</code> 线性关键帧）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：静态素材上的一条<strong>缓拉曲线</strong>——<code>scale zoomFrom(1.2~1.35)→1</code> 在 8~15s（demo 4.4s）里走完，位移<strong>同一时间轴</strong>从&quot;兴趣点顶到画心&quot;的偏移回到零，缓动为匀速或<strong>末速非零的极缓减速</strong>；<code>transform-origin</code> 固定画心（这是&quot;终点能零偏移回正到素材原样&quot;的技术前提）；起手偏移由兴趣点包围盒运行时反推；hold 期按主拉末速走完余下的 <code>(1−k)</code>、正好停在素材原样（速度连续、镜头永不静止）；&quot;终点必须是素材原样满画幅、不可拉过 1.0&quot;这条纪律；&quot;起点信息 &lt; 终点信息&quot;的语义方向。</li><li>不属于本卡的：demo 里的灰阶线框数据看板（顶栏/侧栏/KPI 卡/折线图/清单/底部小卡及其全部数值与排版）、起手咬在&quot;日活跃用户&quot;卡这一具体决定、素材的入场动画（属 media-pop-in）、页面上的标注与聚焦（属 focus-dim-spotlight / magnifier-detail）。</li><li>迁移接口：<code>zoomFrom</code> 定起手咬紧程度（按素材分辨率上限取值）；<code>pullDur</code> 对齐本段口播时长（换时长时 <code>zoomFrom</code> 不变）；<code>endRate</code> 定收尾收住的程度；起手咬点＝任意页内元素（挂 id，偏移运行时反推）；<code>k</code> 与 hold 段终点由末速自动推出，不要手填；换画幅时 <code>dx/dy</code> 由包围盒重新测量、自动跟随。</li><li>底色要求：白底即可——本卡零颜色、零装饰，只是一条 transform 曲线，任何素材（浅色看板、深色终端、照片、长表格）上都成立。唯一实质要求是<strong>素材要铺满画幅</strong>（有留白的素材拉到原样时会露白，那属于素材问题不是运镜问题）。</li></ul>","slow-push-in":"<h3>意图</h3><p>静态截图往屏上一贴，画面立刻&quot;死&quot;——观众的眼睛没有理由留在上面，注意力回落到听觉， 一两秒后就开始想划走。缓推是最便宜也最通用的解药：镜头以观众察觉不到的速度往兴趣点走， 画面每一帧都在变，&quot;还没看完&quot;的感觉被持续维持。做对的命门： <strong>必须匀速或极缓减速</strong>（<code>power2.out</code> 那种前快后慢会被读成&quot;冲一下&quot;，缓推的全部气质在&quot;察觉不到&quot;）、 <strong>推进量要小</strong>（1.08~1.15；超过 1.2 位图开始发虚，观众会注意到画质而不是内容）、 <strong>推到位不能停死</strong>（hold 期以主推末速继续走，这是本库&quot;相机永不静止&quot;信条最基础的一条）。</p><h3>动效核心</h3><ul><li>结构：静态素材（截图/图片/DOM 页面）满画幅铺在一个<strong>相机层</strong>里，相机层是全卡唯一被 transform 的元素；素材本身零动画</li><li><code>transform-origin</code> 咬在<strong>兴趣点中心</strong>（引文块/关键数字/按钮），运行时读该元素的包围盒反推坐标——换兴趣点只需把 id 挂到别的元素上</li></ul><p>  兴趣点在原地不动、其余内容绕着它长大，读作&quot;镜头正在往它走&quot;；origin 放画面中心则读作&quot;整体放大&quot;（更弱但更安全）</p><ul><li>主推：<code>scale zoomFrom → zoomTo</code>（1.0 → 1.10），时长 = 本段口播时长（实拍 8~15s）</li><li>缓动：<strong>匀速</strong>（<code>ease: none</code>）或<strong>极缓前载减速</strong>——本库通用运镜 ease：<code>p + (1−r)·p²·(1−p)</code>，</li></ul><p>  起速 = 平均速、末速 = <code>r ×</code> 平均速（<code>r = endRate ≈ 0.6</code>）。关键性质是<strong>末速非零</strong>：<code>power2.out</code> 末速为 0，镜头会停死</p><ul><li>焦点微移：主推同时叠 <code>x/y</code> 各 5~15px 的漂移，把兴趣点从&quot;死正中&quot;让到构图位（三分线附近）；方向与推进配合，不是随机抖</li><li>hold 期（讲述停在这一页的那几秒）：沿用主推末速<strong>匀速续推</strong>（<code>scale</code> 再走 3~5%、漂移同比延长）。</li></ul><p>  速度连续 ⇒ 观众读不出&quot;段落切换&quot;，只觉得镜头一直在走</p><ul><li>素材尺寸要求：位图素材的原始分辨率要 ≥ 画幅 × <code>zoomTo</code>（1080p 画幅推到 1.15 就需要 ≥2210px 宽的截图），否则推进即变糊</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>zoomTo</code></td><td>1.10（范围 1.08~1.15）</td><td>推进总量。&lt;1.06 观众读不出在动（等于没运镜）；&gt;1.20 位图发虚、且&quot;推&quot;变成&quot;放大&quot;，抢内容</td></tr><tr><td><code>pushDur</code></td><td>实拍 8~15s / demo 4.2s</td><td>与本段口播等长。同样的 <code>zoomTo</code> 压到 3s 就成了&quot;推镜头&quot;（一个事件），拉到 20s 观众彻底察觉不到</td></tr><tr><td><code>endRate</code></td><td>0.6</td><td>末速占平均速的比。1 = 全程匀速（最安全）；0.6 = 极缓&quot;到位&quot;感；&lt;0.35 像撒手不管，&gt;0 但太小则接不上 hold</td></tr><tr><td><code>driftX</code> / <code>driftY</code></td><td>-13 / -7 px</td><td>焦点微移量。0 = 纯放大（可用但更呆）；&gt;25px 观众会看出&quot;画面在平移&quot;，那是 sway-parallax 的活</td></tr><tr><td><code>holdDur</code></td><td>实拍 3~8s / demo 1.6s</td><td>hold 时长随讲述走；关键不是长短而是这段<strong>必须还在动</strong></td></tr><tr><td><code>transform-origin</code></td><td>兴趣点中心</td><td>咬兴趣点＝&quot;镜头往它走&quot;；放画面中心＝&quot;整体放大&quot;（弱一档但永远安全，不知道兴趣点在哪时用它）</td></tr></table><h3>已知坑</h3><ul><li>用 <code>power2.out</code> / <code>power3.out</code> 之类的标准缓出——末速为零，镜头在到位那一刻<strong>停死</strong>，画面立刻读作卡帧；且前段过快会被读成&quot;冲一下&quot;，缓推的&quot;察觉不到&quot;气质全丢。缓推只能匀速或极缓前载减速。</li><li>推进量给到 1.3 以上——位图糊掉，观众注意到的是画质而不是你在讲的内容；矢量/DOM 素材虽然不糊，但也会从&quot;推镜&quot;变成&quot;放大&quot;，两回事。</li><li>推完就停（hold 期零运动）——本卡最常见的错法。观众对&quot;完全静止&quot;极其敏感（motion_check 也会 FAIL）；hold 必须以末速续走。</li><li>起手就带位移和缩放两个大动作 + 还叠了个入场淡入——缓推是<strong>底噪</strong>不是入场动效。素材的入场交给 media-pop-in / motion-blur-slam-in，缓推从素材落位后才开始。</li><li><code>transform-origin</code> 每段重设一次（比如 hold 期换了个 origin）——origin 一变，画面会瞬间跳一下位置。一条曲线里 origin 必须恒定。</li><li>素材分辨率不够就硬推——1080p 画幅配 1280px 宽的截图，推到 1.15 已经在放大插值，边缘发毛比不运镜更糟。</li><li>同一段里既缓推又缓拉（推一半又拉回来）——观众读作&quot;手抖了&quot;或&quot;没想好&quot;。一段一个方向；要反向就换镜头。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/slow-push-in/index.html</code>。换素材改 <code>.page</code> 内的整块 DOM（或换成一张 <code>&lt;img&gt;</code> 铺满 <code>.camera</code>）；换兴趣点把 <code>id=&quot;poi&quot;</code> 挂到任意元素上（origin 坐标运行时反推）；节奏全在顶部 <code>CONFIG</code>（<code>zoomFrom</code> / <code>zoomTo</code> / <code>pushDur</code> / <code>holdDur</code> / <code>endRate</code> / <code>driftX</code> / <code>driftY</code>）。核心可摘走：<code>CONFIG</code> + <code>camEase</code> + <code>DemoShell.register</code> 回调体三段。</li><li>Remotion 移植：整段就是一个 <code>interpolate</code>——<code>const z = interpolate(frame, [0, pushEnd, holdEnd], [1, 1.10, holdZoom], {easing: Easing.bezier(0.33, 0.33, 0.5, 0.85), extrapolateRight: 'clamp'})</code>，<code>x</code> / <code>y</code> 同法各一条；套在 <code>transform: scale(z) translate(x, y)</code> 上，<code>transformOrigin</code> 用兴趣点的百分比坐标。<strong>要匀速就直接 <code>easing: Easing.linear</code></strong>（默认 <code>Easing.bezier(0.42,0,1,1)</code> 是 ease-in，会读成加速）；要极缓减速就用上面那条 bezier（末段仍有速度）。<code>holdZoom = zoomTo + (zoomTo−1)/pushDur × endRate × holdDur</code>，这样两段速度连续、无需拆 Sequence。图片素材记得 <code>&lt;Img src={staticFile(...)}/&gt;</code> 并保证原图 ≥ 画幅 × zoomTo。</li><li>剪辑软件对应物：剪映——图片素材打两个&quot;缩放&quot;关键帧（100% → 110%），<strong>必须把两个关键帧都设成线性</strong>（右键去掉默认的缓入缓出），位移关键帧同法；AE——Scale 两个关键帧 + 右键 <code>Keyframe Interpolation → Linear</code>，锚点（Anchor Point）拖到兴趣点上，或用 Transform 的 <code>Position</code> 配合；这就是各家素材站说的 <strong>Ken Burns</strong>（本卡是它的推镜半边，拉镜半边见 [slow-pull-reveal](slow-pull-reveal.md)）；CapCut/Premiere 同理（PR 用 <code>Motion → Scale</code> 线性关键帧 + <code>Anchor Point</code>）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：静态素材上的一条<strong>缓推曲线</strong>——<code>scale zoomFrom→zoomTo</code>（1.0→1.08~1.15）在 8~15s（demo 压缩到 4.2s）里走完，缓动为匀速或<strong>末速非零的极缓前载减速</strong>（<code>camEase(endRate)</code>，这是&quot;不能用 power2.out&quot;的技术答案）；<code>transform-origin</code> 咬在兴趣点中心并<strong>全程恒定</strong>；同时叠 5~15px 的焦点微移把兴趣点让向构图位；hold 期<strong>沿用主推末速匀速续推</strong>（速度连续、镜头永不静止）；&quot;相机层是唯一被 transform 的元素、素材本身零动画&quot;这一结构。</li><li>不属于本卡的：demo 里的灰阶线框文章页（导航条/标题/柱图/引文块/相关阅读栏及其全部文案与排版）、兴趣点选在引文块这一具体决定、<code>driftX/driftY</code> 的正负方向（随构图定）、素材的入场动画（属 media-pop-in / motion-blur-slam-in）、页面上的任何标注（属 highlighter-sweep / scribble-annotation / focus-dim-spotlight）。</li><li>迁移接口：<code>zoomTo</code> 定推进量（按素材分辨率上限取值，1.08~1.15）；<code>pushDur</code> 对齐本段口播时长（换时长时 <code>zoomTo</code> <strong>不变</strong>——推进量是观感常量，时长是节奏变量）；<code>endRate</code> 定&quot;匀速 or 极缓到位&quot;；<code>driftX/driftY</code> 按画幅宽等比缩放（本卡按 960 宽设计）；兴趣点＝任意页内元素（挂 id 即可，坐标运行时反推）；<code>holdZoom</code> 由末速自动推出，不要手填。</li><li>底色要求：白底即可——本卡零颜色、零装饰，只是一条 transform 曲线，任何底色/任何素材（浅色文档、深色 IDE 截图、照片）上都成立。</li></ul>","cursor-locked-zoom":"<h3>意图</h3><p>小屏念长命令是口播的一个真实死角：整条 60 字符的命令铺在竖屏里，字号只能给到勉强可辨， 观众读不清；放大到能读，一屏又装不下。本卡是这个死角的唯一解法——<strong>不要让观众读完整条，让他们跟着写的人往前走</strong>。 镜头 2.7x 怼上去锁死在光标上，字符从右侧被&quot;喂&quot;进来，光标恒在画面正中： 任何时刻画面里都只有当前正在打的那七八个字符，而它们大到不可能看不清。</p><p>这一拍与本库其他运镜卡的根本区别在<strong>镜头的驱动源</strong>：其他卡的镜头是独立的关键帧（时间 → 姿态）， 本卡的镜头<strong>没有自己的时间轴</strong>——它每帧由&quot;已揭示了多少个字符&quot;算出来。 所以打字快镜头就快、打字停镜头就停，两者不可能失步。移植时如果给镜头单独排一条位移 tween 去&quot;追&quot;打字，任何速率改动都会让它们错开，观感立刻塌成&quot;放大的终端在播打字动画&quot;。</p><p>第三条是收尾：<strong>跟拍必须以全景收尾</strong>。观众刚跟着走完一条命令，眼里只有片段， 需要一眼看到&quot;这条命令整体长什么样、在哪个上下文里&quot;。不收这一拍等于没讲完。</p><h3>动效核心</h3><ul><li>结构两层：<code>.camera</code>（铺满舞台的世界坐标层，<code>transform-origin: 0 0</code>，全卡唯一被 transform 的元素）→ 素材（终端窗）。素材在世界坐标里<strong>位置固定</strong>，动的只有相机</li><li><strong><code>transform-origin: 0 0</code> 是反解式子成立的前提</strong>。默认的 <code>center</code> 会让 <code>scale</code> 绕元素中心发生，那条式子整个不成立（移植时最容易漏的一行）</li><li><strong>核心反解（一行就是全部）</strong>：<code>tx = W/2 − zoom·cursorX</code>、<code>ty = H/2 − zoom·cursorY</code>、<code>scale = zoom</code>。含义是&quot;把锚点的缩放后位置搬到画面正中&quot;</li><li><strong>锚点由打字算出</strong>：<code>cursorX = 文本起点 + 已揭示字符数 × 字宽</code>，<code>字宽 = fontSize × 0.6</code>（Menlo / SFMono 等宽字体实测系数）。</li></ul><p>  <code>cursorY = 窗顶 + 窗栏高 + 内边距 + 行序 × 行高 + 行高/2</code>（行高 = <code>round(fontSize × 1.6)</code>）</p><ul><li><strong>等宽字体是硬前提</strong>：整套锚点靠&quot;字符数 × 字宽&quot;算，比例字体下每个字符宽度不同，反解会越打越偏</li><li><strong>边界钳制（白底舞台的必需补丁，原版没有）</strong>：把可视世界矩形关在素材四边之内——</li></ul><p>  <code>半宽 = W/(2·zoom)</code>，<code>cx = clamp(cursorX, 素材左 + 半宽, 素材右 − 半宽)</code>，纵向同理；素材比可视区还小时退化为居中。   纯反解在行首/行尾会把画幅推出素材外，原版是深色背景所以看不出，白底舞台上就是大片空舞台</p><ul><li><strong>收尾只需 tween <code>zoom</code> 一个值</strong>：<code>zoom</code> 变小 ⇒ 可视矩形变大 ⇒ 钳制范围收窄 ⇒ 中心被连续挤回素材正中；<code>zoom = 1</code> 时素材比画幅小、钳制退化为居中 ⇒ 恰好落在全景居中。不需要第二条位移 tween（这是钳制顺带给的便宜）</li><li>打字段缓动 <code>none</code>（线性）：人敲键盘是匀速的，加缓动会读作&quot;机器在渐快渐慢&quot;。速率 15 char/s（人在敲命令，比日志输出慢一个量级）</li><li>收尾缓动 <code>power2.inOut</code> 0.8s：<strong>两端都要收</strong>——这是&quot;结束&quot;（一个有始有终的事件），不是持续运镜</li><li>光标状态语言：竖条 2px × 24px，<strong>打字时实心不闪、停下后才 2Hz 闪</strong>。实心＝&quot;正在输出&quot;，闪烁＝&quot;在等下一步&quot;，这是终端唯一的状态语言；全程闪会读作&quot;卡住了&quot;</li><li>素材语境：终端窗深底（&quot;命令行&quot;这层语义靠深底成立）+ 三交通灯灰阶；上方留两行压暗的会话记录（<code>ls</code> + 输出），让被跟拍的那一行读作&quot;接着上文在敲&quot;而不是空屏起手</li><li><strong>窗宽必须让整条命令在 <code>zoom = 1</code> 时完整可读</strong>——收尾给的就是&quot;全貌&quot;，全貌里命令还被窗口裁掉半截，这一拍就白收了</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>zoom</code></td><td>2.65（范围 2.6~2.8）</td><td>跟拍焦距。&lt;2 起不到&quot;小屏也看得清&quot;的作用（那不如不跟拍）；&gt;3.2 字重被放大到发虚、且一屏只剩四五个字符，观众失去上下文</td></tr><tr><td><code>rate</code></td><td>15 char/s（范围 12~20）</td><td>打字速率。&gt;22 读作&quot;机器在贴&quot;不是&quot;人在敲&quot;；&lt;10 观众等得难受。<strong>命令必须比日志输出慢一个量级</strong>（日志是 60~70 char/s，见 [terminal-typing-log](terminal-typing-log.md)）</td></tr><tr><td><code>charW</code></td><td>0.6</td><td>等宽字宽系数。Menlo / SFMono / Consolas 实测都在 0.6；换字体必须实测（错 0.02 到行尾就偏出半个字符）</td></tr><tr><td><code>fontSize</code></td><td>20px</td><td>与 CSS 必须一致（字宽与行高都由它算）。这是 <code>zoom = 1</code> 时的字号，跟拍时的视觉字号 = 20 × 2.65 ≈ 53px</td></tr><tr><td><code>lineH</code></td><td>32px（= round(fontSize × 1.6)）</td><td>行高。多行跟拍时它就是纵向跟踪的步长</td></tr><tr><td><code>leadIn</code></td><td>0.45s</td><td>起手静置。镜头先锁在行首等口播开口；0 = 观众还没看清是个终端就开始打了</td></tr><tr><td><code>holdEnd</code></td><td>0.75s（实拍 0.6~0.9s）</td><td>打完停留。<strong>让人读完整条命令</strong>，此时光标开始闪；&lt;0.4s 观众来不及读最后一段</td></tr><tr><td><code>pullDur</code></td><td>0.80s</td><td>拉回全景。&lt;0.5s 读作&quot;弹回去&quot;；&gt;1.2s 观众以为还有下一处要看</td></tr><tr><td><code>cursorHz</code></td><td>2</td><td>停下后闪烁频率。这是终端的通用值，不建议改</td></tr><tr><td>命令长度</td><td>40~65 字符</td><td>&lt;30 字符不需要跟拍（一屏就能读清，直接给全景）；&gt;80 字符跟拍时间过长、观众会走神</td></tr></table><h3>已知坑</h3><ul><li><strong><code>transform-origin</code> 用了默认的 <code>center</code></strong>——反解公式失效，镜头位置全错（且错得&quot;看起来像个 bug 但说不清哪儿不对&quot;）。必须 <code>0 0</code>。</li><li><strong>给镜头单独排一条位移 tween 去&quot;追&quot;打字</strong>——两者会在任何速率改动后失步。镜头必须每帧由 <code>已揭示字符数</code> 现算，这是本卡的定义性特征。</li><li><strong>比例字体</strong>（默认无衬线）——&quot;字符数 × 字宽&quot;的反解越打越偏，行尾时光标已经跑出画面。等宽字体是硬约束。</li><li><strong>纯反解不加边界钳制</strong>——行首那几个字符和整条打完时，画幅会被推出素材之外。原版（remocn）是深色背景所以看不出；白底舞台上就是大片空白。这是移植到本库必须补的一段。</li><li>打字段加缓动（<code>power2</code> 之类）——读作&quot;机器在渐快渐慢&quot;，人敲键盘是匀速的。这一段的 ease 必须是 <code>none</code>。</li><li>光标全程闪烁——读作&quot;终端卡住了 / 在等输入&quot;，与&quot;正在输出&quot;的语义打架。<strong>打字时实心，停下才闪。</strong></li><li>不收全景就结束——观众眼里只有片段，不知道这条命令整体长什么样。跟拍必须以全貌收尾。</li><li>窗宽不足，<code>zoom = 1</code> 时命令仍被裁——收尾那一拍白收了。窗宽按&quot;最长那条命令 × 字宽 + 内边距 + 提示符&quot;反推。</li><li><code>zoom</code> 开到 3.5 以上——一屏只剩四五个字符，观众彻底失去上下文，跟拍变成&quot;在一堆字母里游泳&quot;。</li><li>用它跟拍短命令（<code>npm i</code>）——不需要。30 字符以内直接给全景 + 一次 [slow-push-in](slow-push-in.md) 就够，本卡的成本不划算。</li><li>一屏里同时跟拍<strong>两个</strong>移动目标（光标 + 进度条）——镜头只能锁一个。要讲两个就拆两拍。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/cursor-locked-zoom/index.html</code>。换命令改 <code>CONFIG.cmd</code>（同时按新长度检查窗宽）；速率与焦距在 <code>CONFIG.rate</code> / <code>CONFIG.zoom</code>；素材换成别的窗口时改 <code>CONFIG.winL/winT/winW/winH/pad/chromeH</code> 这组几何（它们既用来推锚点，也当相机的钳制边界）。核心可摘走：<code>CONFIG</code> + <code>apply()</code>（反解 + 钳制那七八行）。</li><li>换素材的最小流程：① 把素材在世界坐标里的四边填进 <code>winL/winT/winW/winH</code>；② 锚点公式换成&quot;素材里那个移动目标的中心坐标&quot;（不一定是字符光标——进度点、被填的表单字段、正在被高亮的行都行）；③ 其余不动。<strong>只要能写出&quot;目标中心的世界坐标&quot;这一个函数，本卡就能跟拍它。</strong></li><li><strong>多行代码跟拍</strong>（源头的 <code>glass-code-walk</code> 变体）：把 <code>cmdRow</code> 从整数换成浮点行号，<code>cursorY = 窗顶 + 窗栏 + 内边距 + linePosition × lineH + lineH/2</code>，<code>linePosition</code> 在相邻行之间插值（扫读第 3 行到第 4 行时它是 3.0 → 4.0）⇒ 镜头在行间平滑滑过而不是整跳。横向可以只锁 x 到行首（读代码是整行读，不是逐字读），或对整行取中点。</li><li>Remotion 移植（这就是源头）：<code>registry/remocn/terminal-cursor-zoom/index.tsx</code>（143 行，最短最干净）。它用 <code>interpolate(localFrame, [0, len/charsPerFrame], [0, len])</code> 出 <code>revealed</code>，然后同一条反解；<code>chunkSize</code> 参数做分块突进（本卡命令行用 1 = 逐字符，日志才用 4，见 [terminal-typing-log](terminal-typing-log.md)）。移植时补上边界钳制。</li><li>剪辑软件对应物：AE——把终端截图/录屏放进合成，加一个空对象（Null）当&quot;光标锚点&quot;、按打字节奏给它打位置关键帧，再把摄像机或图层的位置<strong>表达式</strong>绑到 <code>W/2 − zoom × null.position[0]</code>（表达式比手打关键帧准得多，也是唯一能保证不失步的做法）；缩放拉回用 <code>Scale</code> 的两个关键帧 + Easy Ease 双侧。剪映——只能手动逼近：把录屏放大后按打字节奏打一串&quot;位置&quot;关键帧（会失步，且长命令关键帧数量大），不推荐。Premiere——<code>Motion</code> 的 Position 关键帧同理，或用 After Effects 动态链接。<strong>真实制作里更常见的做法是直接录屏 + 后期跟拍</strong>，但录屏的打字速率不可控（人手不匀），本卡的价值恰恰是让速率与镜头都可编排。</li><li>音效：<code>typekey</code> 稀疏连发——<strong>不要逐字符给声</strong>（50 个字符 50 记声音会糊成一片噪音）。按&quot;词&quot;分组，每个词起头给 2~3 记，<code>vol</code> 0.24~0.30 之间轮换、<code>rate</code> 0.94~1.24 之间轮换（同一音色反复出现必须变调，否则读作机械循环）；拉回全景那一下一记 <code>whoosh</code>（<code>vol</code> 0.26、<code>rate</code> 0.92）。hold 段无声。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<strong>相机锁定移动目标跟拍</strong>这一整套——反解公式 <code>tx = W/2 − zoom·cursorX</code>（<code>transform-origin: 0 0</code> 为前提）、<strong>镜头由内容进度驱动而非独立关键帧</strong>这条定义性纪律、锚点由&quot;已揭示字符数 × 字宽（fontSize × 0.6）&quot;算出、等宽字体的硬约束、把可视矩形关在素材四边内的边界钳制（以及&quot;只 tween zoom 一个值、位移由钳制自动跟出&quot;这个便宜）、打字段 <code>ease: none</code> 的匀速纪律、2.6~2.8x 的焦距区间、&quot;打字时光标实心 / 停下才 2Hz 闪&quot;的状态语言、以及 0.8s <code>power2.inOut</code> 拉回 <code>zoom = 1</code> 收在全景居中的收尾一拍（含&quot;窗宽必须让全貌可读&quot;这条反推纪律）。</li><li>不属于本卡的：demo 里的终端窗视觉（深底 / 三交通灯 / 路径标题 / 上方两行会话记录）、那条 ffmpeg 命令本身及其内容、命令行这个题材（跟拍对象换成进度点、表单字段、被高亮的行都成立）、打字速率取 15 char/s 这个具体值、素材尺寸 760×384 这组具体几何、终端配色。</li><li>迁移接口：把素材四边填进 <code>winL/winT/winW/winH</code> 即完成钳制配置；把&quot;目标中心的世界坐标&quot;写成一个随进度求值的函数即完成跟拍配置（这两件事是本卡唯一需要适配的东西）；<code>zoom</code> 按&quot;跟拍时最小字号的视觉尺寸够不够读&quot;验收（不是按构图）——竖屏 1080 宽下 <code>fontSize × zoom ≥ 44px</code> 是安全线；<code>rate</code> 按口播语速给（他念一个参数你打一个参数，别让镜头跑在解说前面）；<code>charW</code> 换字体必须实测；窗宽按最长命令反推。</li><li>底色要求：舞台白底成立（demo 已验证），但<strong>素材本体需要深底</strong>——&quot;命令行&quot;这层语义靠深底成立。若跟拍对象不是终端（比如浅色表单界面），素材浅底同样成立，此时边界钳制更加不可省（浅素材与白底舞台之间没有明度差，露边会读作&quot;素材消失了&quot;）。</li><li>与本库其他运镜卡的边界：[slow-push-in](slow-push-in.md) / [slow-pull-reveal](slow-pull-reveal.md) 的目标是静止的，镜头走独立关键帧；[stage-keyframe-tour](stage-keyframe-tour.md) 是多关键帧停靠<strong>预设</strong>的兴趣点（位置在动画前就已知），本卡的目标位置<strong>只有运行时才知道</strong>（取决于打到第几个字符）——这是&quot;关键帧运镜&quot;与&quot;跟拍&quot;的分界。素材侧的边界：[terminal-typing-log](terminal-typing-log.md) 讲的是终端<strong>逐行推进 + 滚动</strong>（镜头不动、内容在动），本卡是单行长命令 + 镜头在动；两张卡可以接在一起用（先跟拍念完命令，拉回全景后切给逐行日志跑起来）。</li></ul>","orbit-drift":"<h3>意图</h3><p>本卡是&quot;镜头呼吸&quot;的高级版，专门解决一个具体问题：<strong>页面要在屏上待很久</strong>。 [slow-push-in](slow-push-in.md) 的推镜是单向的，推 30s 就推到糊了； [tilt-3d-page](tilt-3d-page.md) 的立面 hold 慢漂是单向的，漂久了会漂到边界。 环绕是唯一<strong>可以无限持续</strong>的运镜——轨迹闭合，永远回到原点，但每一帧都在动。 做对的命门：<strong>幅度必须小</strong>（rotY ≤7°、rotX ≤4°；大了就变成 3D 旋转秀，正文读不了）、 <strong>相位差必须是 90°</strong>（0 或 180° 会退化成一条斜线，读作&quot;摆动&quot;而不是&quot;环绕&quot;）、 <strong>长时段要让椭圆缓慢进动</strong>（两轴同周期时轨迹严格闭合，超过 2 圈观众会认出重复的轨道、读作机械转台）。</p><h3>动效核心</h3><ul><li>结构三层：<code>.world</code>（<code>perspective: 900px</code>——比 [tilt-3d-page](tilt-3d-page.md) 更近一点，环绕的位移差才读得出来）→ <code>.camera</code>（相机层，<code>preserve-3d</code>）→ <code>.shadow</code> 投影层 + <code>.page</code> 页面层</li><li>姿态 = 基准姿态 + 两条正弦：</li></ul><p>  - <code>rotateY = baseRotY + ampRotY · sin(2π·t/orbit)</code>   - <code>rotateX = baseRotX + ampRotX · sin(2π·(t/(orbit·ratio) + 0.25))</code> ← <strong>0.25 = 90° 相位差，是&quot;环绕&quot;的唯一来源</strong>   - <code>z = ampZ · sin(2π·(t/orbit + 0.6))</code>（前后微呼吸，相位与两轴都错开，读作第三层独立的&quot;活&quot;）</p><ul><li>为什么 90° 相位差 = 环绕：<code>sin</code> 走到极值时另一轴正好过零 ⇒ 两轴的合成轨迹是<strong>椭圆</strong>；</li></ul><p>  相位差为 0 时两轴同步到达极值 ⇒ 轨迹退化成一条<strong>斜线</strong>，那是&quot;摆动&quot;（来回晃），不是&quot;绕着走&quot;</p><ul><li>基准姿态（<code>baseRotY: -8°</code>、<code>baseRotX: 2.5°</code>）：环绕是绕着这个姿态漂，不是绕正视位。</li></ul><p>  <code>0/0</code> 也完全成立（正视位微漂，更隐形），给一点基准更像&quot;摆在空间里的一张页&quot;</p><ul><li>投影<strong>反向</strong>跟随：页面向左倾（<code>sin</code> 为负）时影子往右挪 <code>shadowShift</code>，浓度随 <code>z</code> 微变——光源不动、物体在绕，影子必须反着走</li><li>实现是<strong>单条 tween 驱动一个时间标量</strong> + <code>onUpdate</code> 里算三条正弦，整段一个连续曲线：没有段落、没有起止、没有 hold 之外的任何东西</li><li><strong>周期策略（本卡最关键的落地决定）</strong>：</li></ul><p>  - 短用（≤2 圈，或需要无缝循环如画廊小窗）：<strong>三轴同周期</strong>，轨迹严格闭合，每 <code>orbit</code> 秒严丝合缝回到起点，循环无跳帧（demo 用这个）   - 长用（&gt;2 圈，实拍讲述 30s+）：把 <code>periodXRatio</code> 设成 <strong>0.75~0.8</strong>（如 9s / 6.8s），两轴周期不可通约 ⇒ 椭圆缓慢<strong>进动</strong>，轨迹永不重复，观众认不出轨道</p><ul><li>文字可读性：环绕幅度小，正文全程可读；但如果配了 <code>baseRotY</code> 基准姿态，可读性按<strong>基准 + 幅度</strong>的最坏姿态验收（本卡最坏是 -14.2°，仍在 25° 安全区内）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>orbit</code></td><td>实拍 9~14s / demo 5.6s</td><td>环绕一圈的时长。&lt;5s 读作&quot;页面在晃&quot;（观众会晕）；&gt;16s 幅度感被稀释、接近静止；越长越&quot;高级&quot;</td></tr><tr><td><code>ampRotY</code></td><td>6.2°（范围 3~7）</td><td>横向环绕幅度。&lt;2° 读不出在动；&gt;8° 页面左右边缘透视差过大、远端文字变形，变成 3D 旋转秀</td></tr><tr><td><code>ampRotX</code></td><td>3.4°（约取 <code>ampRotY</code> 的一半）</td><td>纵向幅度。取一半让椭圆更宽更自然；两轴等幅会读作正圆环绕（更&quot;演示&quot;更不自然）</td></tr><tr><td><code>phaseX</code></td><td>0.25（= 90°）</td><td><strong>不要改</strong>。这是&quot;环绕&quot;与&quot;摆动&quot;的唯一分界；0 或 0.5 会退化成一条斜线</td></tr><tr><td><code>periodXRatio</code></td><td>1.0（短用）/ 0.75~0.8（长用）</td><td>两轴周期比。1.0 = 轨迹严格闭合、可无缝循环；0.75~0.8 = 椭圆缓慢进动、长时段不重复。<strong>这是短用/长用的开关</strong></td></tr><tr><td><code>baseRotY</code> / <code>baseRotX</code></td><td>-8° / 2.5°</td><td>基准姿态。<code>0/0</code> 也成立（正视位微漂，更隐形）；给基准后可读性按&quot;基准+幅度&quot;的最坏姿态验收</td></tr><tr><td><code>ampZ</code></td><td>22px</td><td>前后微呼吸。0 = 只转不进退（弱一档）；&gt;50px 明显读作在推拉，抢了环绕</td></tr><tr><td><code>perspective</code>（父容器）</td><td>900px（范围 800~1100）</td><td>环绕专用较近透视。&gt;1400px 环绕的位移差看不出来（等于白做）；&lt;600px 鱼眼变形</td></tr><tr><td><code>shadowShift</code></td><td>20px</td><td>投影反向跟随量。0 = 页面读作贴纸；&gt;45px 影子的动比页面还明显，本末倒置</td></tr></table><h3>已知坑</h3><ul><li>相位差给成 0（或 180°）——两轴同步到达极值，合成轨迹退化成一条<strong>斜线</strong>，读作&quot;页面在斜着来回摆&quot;。环绕的全部技术含量就在这个 90°。</li><li>幅度给到 10° 以上——不再是&quot;微漂&quot;，页面左右边缘透视差过大、远端文字变形，本卡的定位（隐形底噪）彻底改变，成了 [tilt-3d-page](tilt-3d-page.md) 的劣化版。</li><li>长时段（30s+）用两轴同周期——轨迹严格闭合、每圈完全重复，观众在第三圈就认出了轨道，读作电动转台在匀速转。长用必须让椭圆进动（<code>periodXRatio</code> 0.75~0.8）。</li><li>反过来：需要无缝循环的场合（画廊小窗、循环 loop 素材）用了不可通约周期——循环点会跳帧。短用要同周期。</li><li>环绕周期太短（&lt;5s 一圈）——读作页面在晃，观众会晕；这不是&quot;更明显&quot;，是做坏了。要更明显应该加幅度（在 7° 上限内），不是提速。</li><li><code>perspective</code> 给到 1400px 以上——透视太弱，±6° 的环绕几乎看不出位移，动效等于白做。环绕比立面卡更需要近透视。</li><li>投影不跟随或同向跟随——同向跟随尤其糟（影子和页面往同一边挪，物理上不可能），读作贴纸或穿模。必须反向。</li><li>忘了 <code>transform-style: preserve-3d</code>——<code>translateZ</code> 失效，投影拍平、<code>ampZ</code> 呼吸也没了。</li><li>用 <code>Math.random()</code> 加噪声让它&quot;更自然&quot;——本库不做定格抖动/沸腾（用户定版）；且 Remotion 里随机数会破坏 seek 一致性。自然感来自三条不同相位的正弦叠加，不是噪声。</li><li>拿本卡当入场——它没有入场也没有出场。素材的入场交给 media-pop-in，姿态的建立交给 [tilt-3d-page](tilt-3d-page.md)（可以先立面、再挂本卡当 hold 底噪，两卡串联是推荐组合）。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/orbit-drift/index.html</code>。换素材改 <code>.page</code> 内整块 DOM（或换成铺满的 <code>&lt;img&gt;</code>）；轨迹全在顶部 <code>CONFIG</code>（<code>orbit</code> / <code>baseRotY</code> / <code>baseRotX</code> / <code>ampRotY</code> / <code>ampRotX</code> / <code>phaseX</code> / <code>ampZ</code> / <code>phaseZ</code> / <code>shadowShift</code> / <code>cycles</code> / <code>periodXRatio</code>）；透视改 <code>.world</code> 的 <code>perspective</code>。核心可摘走：<code>CONFIG</code> + <code>apply()</code> 那七行三角函数 + 驱动它的单条 tween。<strong>长用改一个数</strong>：<code>periodXRatio: 0.78</code>。</li><li>Remotion 移植：本卡是<strong>最适合 Remotion 的一张</strong>——纯 <code>frame</code> 的函数，天然 seek-safe、零状态：<code>const t = frame / fps;</code> 然后 <code>const ry = baseRotY + ampRotY * Math.sin(2*Math.PI * t/orbit);</code>、<code>const rx = baseRotX + ampRotX * Math.sin(2*Math.PI * (t/(orbit*ratio) + 0.25));</code>、<code>const z = ampZ * Math.sin(2*Math.PI * (t/orbit + 0.6));</code>——<strong>不需要 interpolate</strong>。套在外层 <code>perspective: 900</code> + 相机层 <code>transformStyle: 'preserve-3d'</code> + <code>transform: \\</code>rotateY(${ry}deg) rotateX(${rx}deg) translateZ(${z}px)\\`<code>；投影层 </code>transform: \\<code>translateZ(-40px) translate(${-sy*20}px, ${sx*10}px)\\</code><code>。这套写法直接就是全局系统 G3 的 idle 微动的 3D 版（见 </code>template/motion-systems/`），可以整段并入 CameraRig 当 hold 期底噪。</li><li>剪辑软件对应物：AE——3D 图层的 <code>Y Rotation</code> / <code>X Rotation</code> 各挂表达式 <code>value + 6.2*Math.sin(time*2*Math.PI/9)</code> 和 <code>value + 3.4*Math.sin(time*2*Math.PI/6.8 + Math.PI/2)</code>（<strong>注意第二条里的 <code>+ Math.PI/2</code> 就是那个 90° 相位差</strong>），<code>Position</code> 的 Z 挂第三条；这是 AE 里做&quot;idle 呼吸&quot;的标准表达式写法，比打关键帧准确得多。剪映/CapCut——没有表达式，只能用&quot;3D 旋转&quot;打若干关键帧手动近似一个椭圆（4~6 个关键帧一圈，设成缓入缓出），或直接用&quot;轻微晃动&quot;类预设（幅度通常偏大，需调小）。Premiere——<code>Basic 3D</code> 的 <code>Swivel</code>/<code>Tilt</code> 打关键帧同法，或用表达式（PR 表达式能力弱于 AE）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<strong>两轴正弦相位错开 90° 合成的椭圆环绕轨迹</strong>（<code>rotateY</code> ±3~7° / <code>rotateX</code> ±2~4°，<code>phaseX = 0.25</code> 是&quot;环绕 vs 摆动&quot;的技术分界）；叠加的第三层前后微呼吸 <code>z</code>（相位与两轴都错开）；<strong>投影反向跟随</strong>（页面倾向一侧、影子挪向另一侧，浓度随 <code>z</code> 微变）；三层结构（父容器 <code>perspective</code> 800~1100px 的<strong>近透视</strong>要求 / 相机层 <code>preserve-3d</code> / 投影层 <code>translateZ</code>）；&quot;整段都是 hold、无入场无出场、可无限续&quot;这一定位；<strong>周期策略</strong>——短用/需无缝循环时三轴同周期（轨迹严格闭合），长用（&gt;2 圈）时 <code>periodXRatio</code> 0.75~0.8 让椭圆进动以免被认出轨道；&quot;自然感来自多相位正弦叠加、不靠随机噪声&quot;这条纪律（本库不做沸腾/定格抖动）。</li><li>不属于本卡的：demo 里的灰阶线框应用界面（侧栏 / 顶栏 / 卡片列表 / 详情面板及其全部文案与数值）、基准姿态 <code>-8°/2.5°</code> 这一具体取值（<code>0/0</code> 同样成立）、投影的模糊半径与浓度、素材入场动画、页面上叠加的字幕或图表。</li><li>迁移接口：<code>orbit</code> 定一圈时长（实拍 9~14s，越长越高级）；<code>ampRotY/ampRotX</code> 定幅度（上限 7°/4°，可读性按&quot;基准+幅度&quot;的最坏姿态验收）；<code>phaseX</code> <strong>锁死 0.25</strong>；<code>periodXRatio</code> 是短用/长用的唯一开关；<code>ampZ</code>/<code>shadowShift</code> 按画幅等比缩放（本卡按 960 宽 / 700px 页宽设计）；<code>perspective</code> 按画幅等比缩放但要保持&quot;较近&quot;。与 [tilt-3d-page](tilt-3d-page.md) 串联使用时：立面卡负责建立姿态，本卡的 <code>baseRotY/baseRotX</code> 接立面卡的终点姿态即可无缝交接。</li><li>底色要求：白底即可——本卡零颜色、零装饰，只是三条正弦驱动的 transform。深色素材同样成立，仅投影需换成亮边（同 [tilt-3d-page](tilt-3d-page.md)）。</li></ul>","pip-zoom-box":"<h3>意图</h3><p>&quot;看这里&quot;有两种做法，本库各有一张卡，<strong>区别在放大后那个局部住在哪里</strong>：</p><p><code>magnifier-detail</code> 是<strong>原地放大</strong>——镜片在出处附近弹出、本体压暗、连接线回指，语义是 &quot;我现在指给你看这一处&quot;。它是<strong>巡视</strong>的：镜片在 hold 期还轻微扫视，看完就该收， 一次只服务一句话，全景在它出现的那几秒是被压暗的配角。</p><p>本卡是<strong>框带内容飞到侧边定居</strong>——取景框在原位框住目标，然后<strong>连框带画面一起</strong>搬到画面外侧的 空位，从此以一块独立素材的身份长期挂在那里。全景<strong>不压暗、不让位</strong>，因为它还要继续讲。 语义是&quot;这一块我拿出来放在旁边了，接下来我一边讲全景一边你可以一直看它&quot;。 它是<strong>定居</strong>的：落位后完全静置，因为它已经不是一个动作，而是一块常驻素材。</p><p>所以选卡的判据只有一句：<strong>放大的这一块，是看一眼就撤（放大镜），还是要一直挂着（画中画）</strong>。</p><p>命门两条：① 框移动时<strong>内容必须跟着走</strong>。框的几何与框内画面的补偿必须由同一个进度单点写入—— 拆成两条 tween 一定会因缓动不同步而让内容从框里滑出去，那一眼读作&quot;一个空框飞过去了&quot;。 ② <strong>框先出现、停一拍、再飞</strong>。少了这 0.15s 的瞄准拍，读作框自己从右边飞过来抓了一把 ——&quot;框住这里&quot;这个动作就没有发生过。</p><h3>动效核心</h3><ul><li><strong>变换组三层，几何单点写入</strong>：</li></ul><p>  - <code>.pz-shell</code>（变换组）：<code>left/top/width/height</code> 四个值由 <code>setPip(t)</code> 写入   - <code>.pz-win</code>（取景窗）：唯一做 <code>overflow: hidden</code> 的元素   - <code>.pz-win &gt; 画面副本</code>：与底层全景<strong>同结构同像素</strong>的第二份 DOM（demo 里第二个     <code>.host-placeholder</code>，外壳会给每个都注入数字人视频）</p><ul><li><strong><code>setPip(t)</code> 是本卡的全部</strong>（t: 0 = 贴在脸上的 1:1 取景框，1 = 右侧定居的 zoom 倍画中画）：</li></ul><p>  - <code>zoom = lerp(1, 2.2, t)</code>、<code>w = lerp(boxW/zoom, boxW, t)</code>、<code>h</code> 同理   - 中心 <code>cx = lerp(faceX·SW, targetX, t)</code>、<code>cy = lerp(faceY·SH, targetY, t)</code>   - <strong>反向补偿</strong>：副本 <code>transformOrigin: 0 0</code>、<code>scale = zoom</code>、     <code>x = w/2 − zoom·faceX·SW</code>、<code>y = h/2 − zoom·faceY·SH</code>     ⇒ 脸部锚点恒落在框心，<strong>画面本身全程不变形</strong>   - <code>t=0</code> 时 <code>zoom=1</code> 且补偿正好抵消框位移 ⇒ 框内与框外像素严格连续（看不出有第二层）</p><ul><li><strong>时序四拍</strong>：</li></ul><p>  - ① 框浮现：整个变换组 <code>scale 0.9 → 1</code> + <code>opacity 0 → 1</code>，<code>0.20s power2.out</code>     （scale 作用在<strong>组</strong>上 = &quot;框与内容是一件事&quot;的第一次声明）   - ② 瞄准停 <code>0.15s</code>（本卡第二命门）   - ③ 平移放大：<code>t: 0 → 1</code>，<code>0.50s power2.inOut</code>——<strong>相机曲线唯一缓动</strong>（design-language §4），     起收都要缓；<code>power3.out</code> 会读作&quot;被甩过去&quot;   - ④ 箭头：落位 +0.05s 后箭杆 <code>dashoffset</code> 划出 <code>0.18s power2.out</code>，箭头头部在箭杆走完 70% 时     <code>0.1s</code> 补上（单向指示，箭尖离框留 ~18px 不戳到）</p><ul><li><strong>边饰交接（两层，几何都跟着 shell 走）</strong>：</li></ul><p>  - 起手：<code>box-shadow: 0 0 0 1.5px accent</code> 细取景描边（&quot;取景&quot;是机器动作，细线 + 强调色）   - 落位：<code>0 0 0 8px #fff</code>（白边卡）+ <code>0 12px 60px rgba(0,0,0,0.22)</code>（<strong>全系统唯一投影，     只给落在底上的证据素材</strong>，design-language §3）   - 细描边在飞行后 60% 处 <code>0.22s</code> 淡出、白边卡在落位前 0.06s <code>0.18s</code> 淡入 ⇒ 交接在落位那一帧完成。     <strong>两层都只有 box-shadow、不占布局</strong>，所以永不与框错位</p><ul><li><strong>圆角随尺寸走</strong>：<code>4px → 10px</code>（小框配小圆角；固定 10px 在起手的 127px 小框上会读作圆角贴纸）</li><li><strong>定居期完全静置</strong>：不扫视、不呼吸——它已经是一块素材，不是一个动作</li><li><strong>层级</strong>：底层全景（z1） → 箭头（z4） → 画中画变换组（z5）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>zoom</code></td><td>2.2</td><td>放大倍数，本卡的核心旋钮；&lt;1.8 观众看不出&quot;这是放大的&quot;（读作贴了张小图），&gt;3 素材分辨率兜不住（数字人 540p 在 3x 上已经能看到像素）。<strong>它同时决定起手取景框的大小</strong>（<code>boxW/zoom</code>）——调大 zoom，起手的框会自动变小、框得更准</td></tr><tr><td><code>boxW</code>/<code>boxH</code></td><td>280 / 280 px</td><td>定居后取景窗尺寸（不含白边）；等宽高 = 方框（参考图形制）。&gt;340 会挤到全景，&lt;200 放大了也看不清</td></tr><tr><td><code>targetX/Y</code></td><td>764 / 270</td><td>定居中心（舞台坐标）；必须落在<strong>全景的留白侧</strong>，压到人物身上就成遮挡而不是&quot;拿出来放旁边&quot;</td></tr><tr><td><code>faceX</code>/<code>faceY</code></td><td>0.275 / 0.315（比例）</td><td>取景锚点，<strong>换人物/换素材必须重校</strong>。校准法：把 <code>t</code> 锁在 0 看细框是否正好框住目标。写成比例而非像素，换画幅不用重校</td></tr><tr><td><code>flyDur</code></td><td>0.50s</td><td>平移放大耗时；&lt;0.32s 读作&quot;甩过去&quot;（丢掉&quot;搬&quot;的重量），&gt;0.8s 观众等着它落地、口播已经讲下一句了。缓动必须 <code>power2.inOut</code></td></tr><tr><td><code>aimHold</code></td><td>0.15s</td><td>浮现到起飞的瞄准停，<strong>本卡第二命门</strong>；0 读作框自己飞过来（&quot;框住这里&quot;没发生），&gt;0.4s 节奏断一拍</td></tr><tr><td><code>showDur</code></td><td>0.20s</td><td>取景框浮现耗时；&gt;0.35s 框自己变成一个动效（它只是个声明，要轻）</td></tr><tr><td><code>hold</code></td><td>1.80s</td><td>定居时长；实拍里 = 讲完这一段，可任意延长（本卡的价值就是能长期挂着）</td></tr><tr><td><code>radius0</code>/<code>radius1</code></td><td>4 / 10 px</td><td>圆角随框尺寸走；两者相等 = 小框上圆角过大读作贴纸</td></tr><tr><td><code>arrowDur</code></td><td>0.18s</td><td>箭杆划出；它是落位后的补充说明，&gt;0.3s 就抢了主体</td></tr></table><h3>已知坑</h3><ul><li>框和内容用两条 tween 各自动画——缓动一不同步内容就从框里滑出去，读作&quot;一个空框飞过去了&quot;（本卡最致命的错法）。几何必须单点写入。</li><li>只飞框、内容用固定的裁切图——起手那一帧框内与框外接不上（有一道明显的错位缝），观众立刻知道那是两层假的。</li><li>框一出现就飞——&quot;框住这里&quot;这个动作没有发生，读作右边飞过来一个框抓了一把。必须留瞄准拍。</li><li>用 <code>power3.out</code> 飞——起手猛、收得急，读作被甩过去；&quot;搬一块素材&quot;要 <code>power2.inOut</code>（起收都缓，相机曲线）。</li><li>落位后给画中画做扫视/呼吸——那是 <code>magnifier-detail</code> 的语言（巡视）；本卡是定居，微动会把&quot;常驻素材&quot;变回&quot;一个动作&quot;。</li><li>落位不换白边卡、全程只有细描边——少了&quot;这是一块摆上来的实物&quot;的实体感，读作一个 UI 浮层。</li><li>白边卡的投影自己调一个（比如 <code>0 4px 12px</code>）——全系统只有一个投影（<code>0 12px 60px rgba(0,0,0,0.22)</code>），换了就破了 design-language §3。</li><li>起手细描边不退场，白边卡叠在细描边上——两层边饰同时在，框读作&quot;描了两道边&quot;。必须交接。</li><li>圆角写成固定值——起手的框只有 <code>boxW/zoom</code> 那么大（本卡 127px），10px 圆角在它身上读作圆角贴纸。</li><li>底层全景跟着压暗——那是放大镜的语法（本体让位）；本卡全景还要继续讲，压暗等于告诉观众&quot;别看这边了&quot;。</li><li>换了人物素材不重校 <code>faceX/faceY</code>——起手的框框在耳朵上或框在空气里，第一拍就废了。</li><li>两层人物视频不对时——框内框外嘴形不一致，一眼看出是两层（demo 用 900ms 一次的 <code>currentTime</code> 对齐兜住；这是演示语境的工程细节，实拍里两层来自同一条素材没有这个问题）。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/pip-zoom-box/index.html。<strong>换素材只做两件事</strong>：把 <code>.pz-scene</code> 的内容换掉</li></ul><p>  （两份必须完全同结构——<code>.pz-win</code> 里那份是副本），然后重校 <code>CONFIG.faceX/faceY</code>   （校准法：临时把 <code>setPip(0)</code> 后的 <code>tl</code> 注释掉，看细框有没有正好框住目标）。   换落位改 <code>targetX/targetY</code>，换尺寸改 <code>boxW/boxH</code>（<code>zoom</code> 会自动决定起手框大小，不用另算）。   <code>setPip(t)</code> 那个函数是通用的——任何&quot;框带内容平移放大&quot;都可以直接抄走，   只要目标层是可被 <code>transform</code> 的 DOM（截图卡、图表、网页 iframe 皆可）。</p><ul><li>Remotion 移植要点：把 <code>setPip</code> 原样搬成每帧算的纯函数——</li></ul><p>  <code>const t = interpolate(frame, [flyStart, flyStart+15], [0,1], {easing: Easing.inOut(Easing.quad), extrapolateLeft:'clamp', extrapolateRight:'clamp'})</code>   （30fps：<code>flyDur 0.5s = 15 帧</code>），然后 <code>zoom/w/h/cx/cy</code> 全部由 <code>t</code> 现算。   框外层用 <code>&lt;div style={{position:'absolute', left, top, width, height, overflow:'hidden'}}&gt;</code>，   框内放<strong>同一个 <code>&lt;Scene/&gt;</code> 组件的第二个实例</strong>并套 <code>transform: scale(zoom) translate(...)</code>   （<code>transformOrigin: '0 0'</code> 必须写，否则补偿公式全错）。   实拍素材两层用同一个 <code>&lt;OffthreadVideo&gt;</code> 的同一 <code>startFrom</code> ⇒ 天然同步，不需要 demo 那个对齐兜底。   白边卡与投影用 <code>boxShadow</code> 字符串在落位帧切换（Remotion 里直接 <code>frame &gt;= landFrame ? cardShadow : hairline</code>   加一个 3 帧的 opacity 交叉更干净）。</p><ul><li>剪辑软件对应物：剪映/CapCut——<strong>复制一条相同的视频轨</strong>放在上层，给上层加&quot;蒙版·矩形&quot;</li></ul><p>  （方框），然后<strong>给上层的&quot;缩放/位置&quot;和蒙版的&quot;大小/位置&quot;打同一组关键帧</strong>（两组关键帧的时间和   曲线必须逐个对齐，这是全部工作量所在，剪映没有&quot;组&quot;的概念）；缓动选&quot;缓入缓出&quot;。   白边用蒙版的&quot;描边&quot;或叠一个白色方形色块。   AE——正确做法是<strong>预合成</strong>：把放大层与遮罩放进一个 comp，然后只对这个 comp 的   <code>Scale</code> + <code>Position</code> 打两个关键帧（这就是&quot;同一个变换组&quot;，AE 里天然支持，比剪映省一半事）；   框内内容的反向补偿用 comp 内层的 <code>Scale = 220%</code> 与 <code>Anchor Point</code> 定在脸上即可，不用表达式。   <code>Drop Shadow</code>（Distance 12 / Softness 60 / Opacity 22%）在落位帧开。</p><ul><li>与本库同类卡的分工：<code>magnifier-detail</code> = <strong>原地放大 + 看完就撤</strong>（圆镜、本体压暗、连接线回指、</li></ul><p>  hold 期扫视，服务一句话）；<code>cursor-locked-zoom</code> = <strong>相机跟着光标推近</strong>（整个画面在动，没有第二层）；   <code>focus-dim-spotlight</code> = <strong>不放大，只压暗周围</strong>（局部原尺寸、靠反差指路）；   <strong>本卡 = 框带内容飞到侧边定居</strong>（全景不让位、局部长期挂着、落位后静置）。</p><h3>动效范围</h3><ul><li>属于本卡的：<code>setPip(t)</code> 这个&quot;框的几何 + 框内画面的反向补偿由同一进度单点写入&quot;的工程纪律（本卡的本体）；<code>t=0</code> 时框内与框外像素严格连续这个约束；四拍时序「浮现 0.2s → 瞄准停 0.15s → 平移放大 0.5s <code>power2.inOut</code> → 箭头 0.18s」；scale 作用在整个变换组而非框或内容单独一方；两层边饰在落位那一帧交接（细取景描边淡出、白边卡 + 唯一投影淡入）；圆角随框尺寸从 4px 走到 10px；定居后完全静置（拒绝扫视/呼吸）；箭头在落位<strong>之后</strong>才划出且箭尖留白不戳到框。</li><li>不属于本卡的：demo 的数字人主持人这个具体被放大对象（换成截图卡、图表、网页都成立）、<code>#0066cc</code> 这个具体强调色、<code>faceX/faceY</code> 的具体数值（这是素材属性，换素材必重校）、<code>targetX/Y</code> 这个&quot;定居在右侧&quot;的具体落位（左侧、上方同样成立）、方框这个形制（圆形/竖长条也可以，只要框与内容同组）、白底舞台、以及 demo 里那段两层视频 <code>currentTime</code> 对齐的兜底代码（演示语境的工程细节，实拍两层同源时不需要）。</li><li>迁移接口：素材入口 = <code>.pz-scene</code> 的内容（两份必须同结构）+ 重校 <code>faceX/faceY</code>（比例值，换画幅不用改）；尺寸入口 = <code>zoom</code>（同时决定起手框大小）+ <code>boxW/boxH</code>；落位入口 = <code>targetX/targetY</code>；节奏入口 = <code>flyDur</code>（缓动锁死 <code>power2.inOut</code>）与 <code>aimHold</code>；<code>hold</code> 按口播实际长度给。换画幅：<code>faceX/faceY/targetX/targetY</code> 全是比例或按新舞台重算的坐标，<code>boxW/boxH</code> 按舞台短边等比缩（280/540 ≈ 52% 短边）；竖屏改成&quot;定居在下方&quot;（竖屏侧边没有 280px 的留白）。</li><li>底色要求：白底即可。唯一约束是<strong>落位区必须是纯净留白</strong>——白边卡 + 唯一投影是&quot;实物摆在底上&quot;的语义，底上有内容（文字、图形、人物）时投影会读作脏；同理深底上白边卡要改成深色边（<code>#2a2a2c</code>）并把投影换成 design-language 深底模式的辉光，否则白边在深底上比内容还抢眼。</li></ul>","stage-keyframe-tour":"<h3>意图</h3><p>长页有两种讲法：<strong>页面动</strong>（页面自己往上滚，相机不动 —— 那是 [evidence-scroll-tour](evidence-scroll-tour.md)）和<strong>相机动</strong>（页面躺着不动，相机在它上面飞）。 后者才是&quot;巡游&quot;：观众看到的不是一份在滚动的文档，而是<strong>一个躺在台上的实物，被人拿着镜头挨个指点</strong>。 差别在观感的主语——前者是&quot;网页在演示自己&quot;，后者是&quot;我在带你看&quot;。带着讲的段落必须用后者。</p><p>做对的命门只有一条，且移植时最容易漏：<strong>每一段的 zoom 必须绕当前兴趣点发生</strong>。 做法是把目标点算成像素、设为 <code>transform-origin</code>，再把该点平移到画面正中。 如果偷懒用固定原点（center）+ 位移去凑，缩放会绕 2200px 长页的几何中心放大， 镜头就会在 zoom 变化时<strong>同时甩出一段没人要的横向漂移</strong>——观感是&quot;镜头在找东西&quot;， 而不是&quot;镜头已经知道要看哪儿&quot;。这一条是本卡与&quot;把长图放大再平移&quot;的全部区别。</p><p>第二条纪律是<strong>hold 必须真的静止</strong>。巡游的信息量在 hold 里，不在移动里； 移动段只是&quot;我们去下一处&quot;的连接。段与段之间不留 hold，观众读不完任何一处。</p><h3>动效核心</h3><ul><li>结构三层：<code>.world</code>（<code>perspective: 900px</code> + <code>perspective-origin: 50% 42%</code>，装在<strong>父容器</strong>上）→ <code>.camera</code>（相机层，<code>preserve-3d</code>，全卡唯一被 transform 的元素）→ <code>.page</code>（长页本体，高度远超画幅）</li><li>舞台基础姿态：<code>rotateX(14°)</code> + <code>rotateY(−20°)</code> + <code>scale(0.86)</code>。<strong>俯角是必须的</strong>——长页只有带俯角才读作&quot;躺在台上&quot;，纯 <code>rotateY</code> 读作&quot;立着的墙&quot;（那是 [tilt-3d-page](tilt-3d-page.md) 的语义）</li><li>长页几何：宽 = 画面宽 × 84%，高按内容自然展开（demo 是 806×2200）。<code>top = (H − planeH)/2</code> 是负值，长页上下都出画——<strong>&quot;超出画幅&quot;是本卡的前提，不是副作用</strong></li><li>圆角 = 画面宽的 1.4%（960 画幅 → 13px），随画幅等比缩放</li><li>地面两层（都属于舞台，相机飞它们不动）：<strong>接触阴影</strong> = 68%×11% 的扁椭圆 + <code>blur(38px)</code>，是&quot;贴地&quot;唯一的证据；<strong>地面反光</strong> = <code>clip-path: polygon(7% 0, 93% 0, 78% 100%, 22% 100%)</code>（上宽下窄＝地面往远处收）+ <code>rotateX(58deg)</code> + <code>blur(26px)</code></li><li><strong>兴趣点寻址（核心手法）</strong>：兴趣点用归一化坐标 <code>(px, py)</code> 给（0~1，相对长页宽高），每帧算成像素 <code>ox = px·planeW</code> / <code>oy = py·planeH</code>，然后</li></ul><p>  <code>transform-origin: ox oy</code> + <code>x = W/2 − (left + ox)</code> + <code>y = H/2 − (top + oy)</code>。   这样 <code>scale</code> 与 <code>rotation</code> 都绕这个点发生，位移把它搬到画面正中</p><ul><li>关键帧路径：每个关键帧给 <code>{d, px, py, zoom, roll}</code>（d = 该段时长）。<strong>相邻两帧姿态相同即为 hold</strong>——不需要单独的 hold 机制，重复姿态就是停下来</li><li>段间缓动固定 <code>cubic-bezier(0.16, 1, 0.3, 1)</code>（Apple 那条）：起步快、末段长距离减速 ⇒ 读作&quot;相机已经知道目标在哪、过去了、稳稳停住&quot;。GSAP core 不带 CustomEase，demo 里用 22 次二分自解一条曲线（比拿 <code>expo.out</code> 近似更准）</li><li><code>roll</code>（机身倾角，±0.5~1°）：只给中段的兴趣点加，且<strong>每段方向不同</strong>。它的作用是让&quot;停靠&quot;看起来是手持找角度而不是机械滑轨对位</li><li>入场沉降 0.8s（<code>power2.out</code> ≈ spring damping 26 / stiffness 90）：<code>scale×0.94</code> / <code>rotateX +8°</code> / <code>rotateY −5°</code> / <code>y +64px</code> → 到位；地面两层同步淡入且位移按 0.28 / 0.35 的比例跟一点（近处的影子比远处的反光挪得多）</li><li>手持抖动（可选档）：三条不同频率正弦（0.19 / 0.13 / 0.047 rad·帧⁻¹）叠平滑噪声，幅度 x≈7px / y≈5px / roll≈0.28°，档位 0.08~0.2。<strong>demo 设 0</strong>——这是&quot;摄影师手持呼吸&quot;的低频运动，不是逐帧定格抖动；需要纪录片粗糙感时才开</li><li>离场：<code>zoom</code> 拉到 0.6 给全貌。<strong>长页巡游必须以全貌收尾</strong>——观众刚看了三处细节，需要一眼知道它们在整体里的位置</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>perspective</code>（父容器）</td><td>900px（范围 800~1100）</td><td>空间强度。长页纵深跨度大，比单屏页（[tilt-3d-page](tilt-3d-page.md) 用 1000）稍近一档才读得出&quot;躺着&quot;；&lt;600px 读作鱼眼变形</td></tr><tr><td><code>rotX</code></td><td>14°（范围 10~18°）</td><td>俯角。0 = 长页读作&quot;立着的墙&quot;，本卡语义崩塌；&gt;22° 页面纵向压缩过头，正文行距看起来在打架</td></tr><tr><td><code>rotY</code></td><td>−20°（范围 14~24°）</td><td>侧仰。&gt;30° 远端正文不可读（要读的页面绝对不能超）</td></tr><tr><td><code>scale</code></td><td>0.86</td><td>基础缩放，与每段 <code>zoom</code> 相乘。基础值定&quot;整体退多远&quot;，<code>zoom</code> 定&quot;这一处怼多近&quot;</td></tr><tr><td><code>zoom</code>（兴趣点）</td><td>1.3~1.5（全貌 0.6~0.7）</td><td>每处的焦距。&gt;1.8 时长页侧边会退进画幅露出舞台地面（除非 <code>px</code> 严格取 0.5）；&lt;1.2 读不出&quot;停下来看这一处&quot;</td></tr><tr><td><code>px</code> / <code>py</code></td><td>0.5 / 0.11~0.85</td><td>兴趣点归一化坐标。<strong><code>px</code> 越偏离 0.5、<code>zoom</code> 越大，越容易露出长页侧边之外的舞台</strong>；整幅宽的版块一律取 0.5，只有&quot;给全貌&quot;的姿态才故意露地面</td></tr><tr><td>段时长</td><td>1.05~1.3s</td><td>移动段。&lt;0.8s 读作&quot;甩过去&quot;（那是转场的语气）；&gt;1.8s 观众等着它到位</td></tr><tr><td>hold 时长</td><td>0.85~0.9s（实拍 0.8~1.2s）</td><td>停靠。<strong>这是信息真正被读到的地方</strong>；&lt;0.6s 白跑一趟；实拍按&quot;讲这一处需要多少字&quot;给</td></tr><tr><td><code>roll</code></td><td>±0.5~1°</td><td>机身倾角。0 = 机械滑轨；&gt;2° 观众会以为画面歪了（不是&quot;手持&quot;是&quot;没端平&quot;）</td></tr><tr><td>段间缓动</td><td><code>cubic-bezier(0.16,1,0.3,1)</code></td><td>固定值，不建议换。<code>power2.out</code> 尾巴太短、读作&quot;停得急&quot;；<code>sine.inOut</code> 起步太软、读作&quot;漂过去&quot;而非&quot;过去&quot;</td></tr><tr><td><code>entry</code></td><td>0.80s</td><td>入场沉降。这一段结束前不要开始巡游（demo 用 0.9s 的落点 hold 盖住它）</td></tr><tr><td><code>shake</code></td><td>demo 0；实拍 0.08~0.2</td><td>手持档。&gt;0.3 就不是呼吸而是抖了</td></tr></table><h3>已知坑</h3><ul><li><strong><code>willChange: transform</code> 加在相机层上</strong>——相机层持续分数缩放时，强制合成层会让长页那圈 1px 边框在锐利与模糊之间脉动（比不提层更难看）。正确做法：<code>will-change</code> 只加在<strong>文字容器</strong>上（demo 里是 <code>.sec</code>），让每段缩放内的字形栅格稳定；相机层不加，也不要逐字加。</li><li>用固定 <code>transform-origin</code>（center）+ 位移去凑兴趣点——zoom 变化时会甩出一段横向漂移，读作&quot;镜头在找东西&quot;。本卡的全部关键就是每帧把目标点设成原点。</li><li><code>zoom</code> 给大 + <code>px</code> 偏离 0.5——长页的侧边退进画幅，露出舞台地面，观众看到的是&quot;一张纸的边&quot;。整幅宽的版块 <code>px</code> 一律取 0.5；真要看左右侧的局部，得同时把 <code>zoom</code> 压回 1.2 以内。</li><li>段与段之间不留 hold（路径表里没有重复姿态）——变成一条从头滑到尾的连续运镜，那是 [long-take-world](long-take-world.md) 或 [slow-pull-reveal](slow-pull-reveal.md)，不是巡游。<strong>巡游的信息量在 hold 里。</strong></li><li>地面反光照搬原版参数——remocn 是深底舞台 + 亮紫反光，白底上直接照搬会读成&quot;页面两侧有两片脏灰楔形&quot;。白底必须把浓度压到 0.05 以下、宽度收窄、模糊加大。</li><li>不以全貌收尾——观众看完三处细节不知道它们在整体的什么位置，巡游读作三个不相干的特写。</li><li>兴趣点排序违反页面的物理顺序（比如 py 0.11 → 0.85 → 0.5）——镜头来回折返，观众会以为漏看了什么。<strong>兴趣点必须单调</strong>（自上而下或自下而上走一趟）。</li><li>忘了 <code>preserve-3d</code>，或把 <code>perspective</code> 写在被 transform 的元素自己身上——空间会散（与 [tilt-3d-page](tilt-3d-page.md) 同坑，细节见那张卡）。</li><li>长页没有真的超出画幅（内容只有一屏半）——那就不需要巡游，<code>tilt-3d-page</code> 加一次缓推已经够了。本卡的成本只在长页上才划算。</li><li>手持抖动开到 0.3 以上——从&quot;摄影师呼吸&quot;变成&quot;手在抖&quot;，且与本库&quot;不做沸腾/定格抖动&quot;的定版偏好冲突。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/stage-keyframe-tour/index.html</code>。换素材改 <code>.page</code> 内整块 DOM（或直接换成一张铺满的长截图 <code>&lt;img&gt;</code>），改 JS 里的 <code>planeH</code> 为素材真实高度；路径与节奏全在顶部 <code>CONFIG.moves</code>（每行一个关键帧 <code>{d, px, py, zoom, roll}</code>，相邻同姿态即 hold）；舞台姿态在 <code>CONFIG.rotX/rotY/scale</code>；手持档在 <code>CONFIG.shake</code>。核心可摘走：<code>CONFIG</code> + <code>bez()</code> + <code>DemoShell.register</code> 回调体里的 <code>apply()</code>，加上三层结构那几行 CSS。</li><li>换素材的最小流程：① 量出长截图的原始宽高，<code>planeH = 806 × (原高 / 原宽)</code>；② 兴趣点的 <code>py</code> 直接用&quot;该版块中心在长图里的像素 y ÷ 原高&quot;；③ <code>px</code> 取 0.5；④ 每段 <code>d</code> 按口播稿这句话的时长给，hold 段按&quot;读完这一处要几秒&quot;给。</li><li>Remotion 移植（这就是源头）：<code>registry/remocn/stage/index.tsx</code>。<code>resolveStagePose(frame, moves)</code> 做关键帧插值（每个 key 给 <code>{at, x, y, zoom, rotate, easing}</code>，默认 EXPO）、<code>getStagePlaneGeometry</code> 算平面几何与 <code>translateX/Y</code>、<code>getStageTransform</code> 拼字符串、<code>getStageShake</code> 出手持抖动（用 Remotion 的 <code>random(seed)</code> 而非 <code>Math.random</code>，保证逐帧确定）。它的 <code>at</code> 是绝对帧号，本卡 demo 的 <code>d</code> 是段时长——移植时累加即可。</li><li>竖向长距离巡游（一段就跨几千像素）：换用 remocn 的 smooth-descent 三段方案——起 30 帧 <code>in(cubic)</code> 加速、中段 <code>linear</code>、末 30 帧 <code>out(cubic)</code> 减速。它成立的算术是：30 帧三次方斜坡的位移正好等于匀速段同时长位移的 1/3，两端速度才接得上、无跳速。用单条 EXPO 走 2000px 会在中段快到糊。</li><li>剪辑软件对应物：AE——长图放进 3D 图层，加一台摄像机（Camera），给摄像机的 <code>Position</code> / <code>Zoom</code> 打关键帧，<strong>每个兴趣点打两个相同的关键帧构成 hold</strong>，关键帧插值用 <code>Easy Ease</code> 后进图表编辑器把手柄拉成&quot;起步快末段长减速&quot;；兴趣点绕点缩放靠调整图层的锚点（Anchor Point）或直接移动摄像机而非缩放图层。剪映——多段&quot;位置+缩放&quot;关键帧，缓动只有固定几档，hold 靠两个同值关键帧；透视舞台需要预先把长图做成带倾斜的图片（剪映的 3D 能力不足以实时给）。Premiere——<code>Motion</code> 的 Position/Scale 关键帧 + <code>Basic 3D</code>，同样用同值关键帧做 hold。<strong>这就是各家素材站说的 &quot;long page scroll showcase / website presentation&quot; 品类</strong>，但模板通常是&quot;页面滚动&quot;而非&quot;相机巡游&quot;，兴趣点寻址得自己搭。</li><li>音效：每段起步一记轻 <code>whoosh</code>（<code>vol</code> 0.20~0.24，<code>dur</code> 0.55~0.75，离场那记 <code>rate</code> 压到 0.86 = 更沉更长），入场配一记 <code>lowpad</code>。<strong>hold 段绝对不给声</strong>——静止是它的全部作用。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<strong>多关键帧兴趣点巡游</strong>这一整套——归一化兴趣点寻址（目标点设为 <code>transform-origin</code> 并平移到画面正中，使 zoom/roll 绕当前兴趣点发生）、&quot;相邻同姿态即 hold&quot;的路径表写法、段间固定 <code>cubic-bezier(0.16,1,0.3,1)</code>、每段不同方向的 ±0.5~1° <code>roll</code>、0.8s 沉降入场（<code>scale×0.94</code> / <code>rotateX+8°</code> / <code>rotateY−5°</code> / <code>y+64</code>）、以全貌收尾的纪律、兴趣点必须单调的排序纪律、&quot;hold 才是信息载体、移动段只是连接&quot;的时长分配、<code>will-change</code> 只提文字容器不提相机层这条踩坑纪律，以及超出画幅的长页 + 透视舞台（俯角 <code>rotateX</code> 是长页读作&quot;躺着&quot;的前提）+ 接触阴影 / 地面反光两层地面。</li><li>不属于本卡的：demo 里那张灰阶线框长落地页的全部内容（导航 / Hero / logo 墙 / 三栏特性 / 三个大数字 / 宽图表 / 三张价格卡 / 页脚及其文案排版）、兴趣点选&quot;主张 → 数据 → 价格&quot;这一具体编排、三个兴趣点这个具体数量（3~4 都成立，5 个以上观众记不住）、舞台姿态取 14°/−20° 这组具体值、手持抖动的具体档位（demo 为 0）、地面两层的具体浓度与模糊半径（随底色调）、长页上叠加的任何字幕或高亮标注。</li><li>迁移接口：<code>perspective</code> 定空间强度，换画幅时按画幅宽等比缩放（本卡按 960 宽 / 806px 页宽设计）；<code>planeH</code> 按素材真实宽高比反算；兴趣点 <code>py</code> = 版块中心在原图的像素 y ÷ 原图高，<code>px</code> 整幅宽版块取 0.5；每段 <code>zoom</code> 按&quot;这一处的最小字号在画面里够不够读&quot;验收（不是按构图好不好看）；段时长与 hold 时长按口播稿逐句给（移动段 = 过渡词，hold = 讲这一处的那句话）；<code>rotX</code>/<code>rotY</code> 按&quot;远端最小字号是否可读&quot;验收；地面两层的浓度按底色反向调整（白底压淡、深底改亮边）。</li><li>底色要求：白底成立（demo 已验证），但地面两层必须按白底重调（浓度压到 0.05 档、模糊加大）。深底舞台是原版语境，那时反光可以用亮色渐变、接触阴影加深，观感更&quot;影棚&quot;。</li><li>与本库其他运镜卡的边界：[slow-push-in](slow-push-in.md) / [slow-pull-reveal](slow-pull-reveal.md) 是平面单段推拉；[tilt-3d-page](tilt-3d-page.md) 是&quot;页面立起来成 3D 立面&quot;（单屏、无兴趣点）；[sway-parallax](sway-parallax.md) 横摇、[orbit-drift](orbit-drift.md) 环绕微漂，都是<strong>单段运动 + hold</strong>；[long-take-world](long-take-world.md) 是世界坐标 2D 相机（无透视平面、无兴趣点寻址）；[evidence-scroll-tour](evidence-scroll-tour.md) 是页面自己上滚、相机不动。<strong>本卡的差异化只有三样</strong>：多关键帧路径、超出画幅的长页、归一化兴趣点寻址。若素材只有一屏、或只需要一次推近，用上面那几张，别付这张的成本。</li></ul>","sway-parallax":"<h3>意图</h3><p>一张超宽的图强行缩进画幅里，等于把所有细节压成一排看不清的色块；切成三张分屏， 又打断了&quot;这是一条连续的线&quot;。摇移两件事同时解决：<strong>保住原始尺寸的清晰度</strong>， <strong>保住横向序列的连续感</strong>——观众亲眼看到第二步长在第一步右边。命门： <strong>速度有上限</strong>（观众要边扫读边听口播，超过 ~190px/s 的文字跟不上）、 <strong>rotateY 只做&quot;跟随&quot;</strong>（≤4°；大了就不是摇移而是 3D 旋转，属 [tilt-3d-page](tilt-3d-page.md)）、 <strong>两端不撞停</strong>（起手缓入、到位极缓收住但末速非零，hold 期继续漂）。</p><h3>动效核心</h3><ul><li>结构三层：<code>.world</code>（<code>perspective: 1200px</code>，摇移用<strong>大透视</strong>——值小了页面横向扫过时边缘会像鱼眼那样变形）→ <code>.camera</code>（相机层，<code>preserve-3d</code>，宽 1880px ≈ 画幅两倍）→ <code>.shadow</code> 投影层 + <code>.page</code> 页面层</li><li>页面必须<strong>真的比画幅宽</strong>（1.5~2 倍）。这是本卡成立的物理前提：不宽就没有可摇的东西</li><li>三段速度曲线：</li></ul><p>  1. <strong>起摇缓入</strong> <code>sine.in</code> 0.55s——<code>sine.in</code> 的平均速正好是末速的一半，所以缓入段走过的距离 = <code>panSpeed × accelDur / 2</code>，与匀速段速度<strong>严丝合缝地接上</strong>（不做这个换算，两段之间会有速度阶跃，读作&quot;顿了一下&quot;）   2. <strong>匀速摇移</strong>——<code>x</code> 从起手位走到终点位，速度恒定是&quot;镜头在平移&quot;的全部；末段用本库通用运镜 ease <code>p + (1−r)·p²·(1−p)</code>（<code>r = endRate ≈ 0.5</code>）极缓收住，末速非零   3. <strong>hold 期</strong>——沿用末速 <code>panSpeed × endRate</code> 匀速续漂，<code>rotateY</code> 极缓回一点点（相机永不静止）</p><ul><li><code>rotateY</code> 跟随：镜头往右摇（<code>x</code> 往负走）时页面右侧后仰 3~4°，与 <code>x</code> 同一时间轴。它的作用是让&quot;平移&quot;读作<strong>镜头在页面前走</strong>而不是<strong>图片在滑动</strong>；配合 <code>z</code> 方向轻微前移（14px）让透视位移更可读</li><li>行程 / 速度 / 时长三者只有两个自由度：<code>时长 = 行程 ÷ 速度</code>。实拍时<strong>先定速度</strong>（可读性上限），再由素材宽度算出时长，最后检查这个时长是否与本段口播匹配；不匹配就改素材宽度（裁掉一段）而不是提速</li><li>hold 期终点不能超出素材右端——<code>xTo + 末速 × holdDur</code> 必须仍在页面内，否则 hold 期会摇出画布露白</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>panSpeed</code></td><td>168px/s（960 宽画幅；上限约 190）</td><td>摇移速度。&gt;190px/s 观众正在扫读的文字被抽走、跟不上；&lt;90px/s 拖节奏、观众先于讲述读完整页</td></tr><tr><td><code>xFrom</code> / <code>xTo</code></td><td>40 / -770 px</td><td>起手与终点位置。起手让页面左端露在画幅内<strong>但留 40px 边距</strong>（贴死边会露出素材外的空白）；终点要给 hold 期留余量</td></tr><tr><td><code>swayDeg</code></td><td>3.2°（上限 4°）</td><td>rotateY 跟随幅度。0 = 纯平移（读作图片在滑，弱一档但安全）；&gt;6° 变成 3D 旋转卡，正文远端开始不可读</td></tr><tr><td><code>accelDur</code></td><td>0.55s</td><td>起摇缓入。0 会瞬间满速、读作跳变/seek；&gt;1.2s 观众等着它起步</td></tr><tr><td><code>endRate</code></td><td>0.5</td><td>末速占匀速的比。收住但不停死；1 = 一路匀速到底（也成立，更&quot;机器&quot;一点）</td></tr><tr><td><code>zLift</code></td><td>14px</td><td>摇移时页面整体前移量，让透视位移更可读。0 也成立；&gt;40px 页面会明显变大，读作在推近</td></tr><tr><td><code>perspective</code>（父容器）</td><td>1200px</td><td>摇移专用大透视。&lt;800px 页面横扫时边缘鱼眼变形；&gt;1600px 透视太弱、rotateY 跟随白做</td></tr><tr><td><code>holdDur</code></td><td>实拍 2~6s / demo 1.1s</td><td>到位停留；这段仍以末速漂，且<strong>终点不能超出素材右端</strong></td></tr></table><h3>已知坑</h3><ul><li>摇移速度超过 ~190px/s（按 960 宽画幅折算）——观众正在读页面上的文字，字被从视野里抽走，一句话没读完就过去了。这是本卡唯一的硬上限；要更快就说明这段不该摇移（该用硬切或 whip-pan）。</li><li>页面只比画幅宽一点（1.1~1.2 倍）——没有可摇的行程，摇了几十像素就到头，读作&quot;画面抖了一下&quot;。宽度不够就整页展示（配 [slow-push-in](slow-push-in.md)）更诚实。</li><li>起手/收尾撞停（没有缓入、或用 <code>power2.out</code> 末速归零）——瞬间满速读作程序 seek；末速归零则在到位那帧停死。两端都要连续。</li><li><code>rotateY</code> 给到 8° 以上——不再是&quot;镜头在页面前平移&quot;，而是页面在转，语义变成 [tilt-3d-page](tilt-3d-page.md)；且远端正文开始不可读。</li><li>缓入段的距离没按 <code>v × t / 2</code> 换算——匀速段与缓入段之间存在速度阶跃，观众读作&quot;起步顿了一下&quot;。这个换算是本卡时序的技术本体。</li><li>hold 期摇出素材右端——画幅露出舞台底色，一眼假。<code>xTo</code> 必须给 hold 期留余量。</li><li>摇移方向与阅读方向相反（从右往左扫一条从左到右的流程）——观众的眼睛和镜头对着干。中文/英文横排素材一律往右摇（页面往左走）。</li><li>摇移中途变速（一会儿快一会儿慢）或叠了手抖噪声——观众正在扫读，速度噪声直接造成晕动感。本库不做定格抖动。</li><li>纵向长页误用本卡——纵向滚是 [evidence-scroll-tour](evidence-scroll-tour.md)（它带&quot;讲到关键处减速停留&quot;的完整语法）；本卡的横向摇移是不同的信息结构。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/sway-parallax/index.html</code>。换素材改 <code>.page</code> 内整块 DOM（或换成一张超宽 <code>&lt;img&gt;</code>）并同步改 <code>.camera</code> 的 <code>width</code>；节奏与姿态全在顶部 <code>CONFIG</code>（<code>panSpeed</code> / <code>xFrom</code> / <code>xTo</code> / <code>swayDeg</code> / <code>accelDur</code> / <code>holdDur</code> / <code>endRate</code> / <code>zLift</code>）；透视值改 <code>.world</code> 的 <code>perspective</code>。<strong>改 <code>panSpeed</code> 或行程后不用手算时长</strong>——三段时长由 <code>dist</code>/<code>accelDist</code>/<code>mainDur</code> 运行时推出。核心可摘走：<code>CONFIG</code> + <code>camEase</code> + <code>DemoShell.register</code> 回调体。</li><li>Remotion 移植：<code>x</code> 是一条三段 <code>interpolate</code>——<code>interpolate(frame, [0, tAccel, tMain, tHold].map(s =&gt; s*fps), [xFrom, xFrom + dir*accelDist, xTo, xTo + dir*holdRate*holdDur])</code>，缓入段 <code>Easing.in(Easing.sin)</code>、主段 <code>Easing.bezier(0.33,0.33,0.5,0.85)</code>（末速非零）、hold 段 <code>Easing.linear</code>；分段 easing 在 Remotion 里要么拆成三个 <code>interpolate</code> 按 <code>frame</code> 区间选，要么用一个 <code>interpolate</code> 配多段 <code>easing</code>（v4 支持数组式 easing 需自行分段）。<code>rotateY</code> / <code>z</code> 各一条同法。外层 <code>perspective: 1200</code>，相机层 <code>transformStyle: 'preserve-3d'</code> + <code>transform: \\</code>translateX(${x}px) translateZ(${z}px) rotateY(${ry}deg)\\`<code>。<strong>纵向变体</strong>只需把 </code>x<code> 换成 </code>y<code>、</code>rotateY<code> 换成 </code>rotateX`，速度上限同样按可读性取。</li><li>剪辑软件对应物：这就是各家说的 <strong>pan / 横移镜头（whip pan 的慢速版）</strong>。剪映——超宽图片打两个&quot;位置&quot;关键帧（X 从 +40 到 -770），<strong>两端都设线性</strong>再单独给首尾各加一个缓动关键帧；&quot;3D 旋转&quot;的 Y 轴打 0→3° 跟随。AE——Position 的 X 打关键帧，速度图（Graph Editor）里把起点速度设 0、终点速度设为匀速的一半（这就是 <code>endRate</code>），3D 图层的 <code>Y Rotation</code> 跟 3°；或者反过来固定素材、给摄像机（Camera）的 Position 打关键帧（更接近&quot;镜头在走&quot;的物理）。Premiere——<code>Motion → Position</code> 线性关键帧 + <code>Basic 3D → Swivel</code> 微量跟随。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：一条<strong>横向摇移速度曲线</strong>——<code>sine.in</code> 缓入 0.55s（缓入距离按 <code>v×t/2</code> 换算与匀速段严丝合缝接上，这是本卡时序的技术本体）→ 匀速扫过（速度 ≤190px/s@960 宽，可读性上限）→ 末段极缓收住且<strong>末速非零</strong> → hold 期沿末速续漂；<code>rotateY</code> ≤4° 的<strong>跟随</strong>倾斜（与 <code>x</code> 同一时间轴，把&quot;图片在滑&quot;改写为&quot;镜头在页面前走&quot;）+ <code>z</code> 轻微前移；三层结构（父容器 <code>perspective</code> 800~1600px / 相机层 <code>preserve-3d</code> / 投影层）；&quot;页面必须比画幅宽 1.5~2 倍&quot;与&quot;摇移方向须顺阅读方向&quot;两条前提纪律；<code>时长 = 行程 ÷ 速度</code> 且<strong>先定速度再算时长</strong>的取值顺序。</li><li>不属于本卡的：demo 里的灰阶线框宽横幅长页（左端品牌区 / 中段四段流程卡与箭头 / 右端数据总结格及其全部文案与数值）、行程与页面宽度的具体数值、摇移选&quot;往右&quot;这一具体决定（随素材阅读方向定）、投影浓度取值、素材入场动画、页面上的标注。</li><li>迁移接口：<code>panSpeed</code> 是<strong>按画幅宽等比缩放</strong>的量（本卡按 960 宽设计 168px/s，1920 画幅折算约 336px/s——可读性上限随之等比放大）；<code>xFrom/xTo</code> 由素材宽度与画幅宽算出（起手留 40px 边距、终点给 hold 余量）；<code>swayDeg</code> 定跟随幅度上限 4°；<code>accelDur</code> 起摇缓入；<code>endRate</code> 定收尾；<code>perspective</code> 按画幅等比缩放。<strong>纵向变体</strong>（长截图上下摇）：<code>x→y</code>、<code>rotateY→rotateX</code>，其余参数与纪律不变。</li><li>底色要求：白底即可——本卡零颜色、零装饰，只是一条 transform 曲线。深色素材同样成立，仅投影需按 [tilt-3d-page](tilt-3d-page.md) 同法换成亮边。</li></ul>","tilt-3d-page":"<h3>意图</h3><p>正视的页面截图是&quot;信息&quot;，倾斜的页面是&quot;物件&quot;——同一张图，立起来之后观众的解读从&quot;我要读它&quot; 变成&quot;我在看一个东西&quot;。这个转换有两个用处：一是<strong>给页面加身份</strong>（作品/产品，值得被展示）， 二是<strong>给页面降权</strong>（它变成道具，前面就能压字幕、叠图表，而正视的页面压字会打架）。做对的命门： <strong>倾斜量必须留在可读区间</strong>（rotateY 12~25°；超过 30° 页面远端的正文就读不了了——如果本来就不需要读，那是另一种设计，见&quot;已知坑&quot;）、 <strong>透视值不能太小</strong>（900~1200px；给到 400px 会读作鱼眼变形，不是空间）、 <strong>投影必须跟着倾斜变</strong>（加深 + 往反侧挪；投影不动的话页面读作一张贴纸而不是浮在空间里的实体）、 <strong>立起后不静止</strong>（微透视慢漂，两轴极缓续走）。</p><h3>动效核心</h3><ul><li>结构三层：<code>.world</code>（<code>perspective: 1000px</code> + <code>perspective-origin</code>，装在<strong>父容器</strong>上）→ <code>.camera</code>（被 transform 的相机层，<code>transform-style: preserve-3d</code>）→ 内含 <code>.shadow</code> 投影层 + <code>.page</code> 页面层</li><li>投影层做法：与页面同尺寸的深色块 + <code>filter: blur(26px)</code> + <code>translateZ(-34px)</code> 沉在页面后方。</li></ul><p>  因为它和页面同处一个 <code>preserve-3d</code> 空间，倾斜时<strong>自动</strong>被透视压扁并与页面产生位移差 —— 这就是&quot;厚度感&quot;的来源；   另外再叠一层动效驱动的 <code>opacity</code> + <code>x/y</code> 偏移（光源不动、物体转了 ⇒ 影子必须挪）</p><ul><li>页面层加 <code>backface-visibility: hidden</code>，避免倾斜时边缘半透明发灰</li><li>起手：正视平面（<code>rotateY: 0</code>）静置 <code>startHold</code>（0.5~1s）——先让观众读清&quot;这是一张什么页&quot;，再把它变成物件</li><li>立起：<code>rotateY 0 → −19°</code>（负值＝右侧后仰，左近右远）+ <code>rotateX 0 → 4.5°</code>（一点俯角）+ <code>scale → 0.94</code>（轻微后退），</li></ul><p>  1.5s <code>power2.out</code>。<strong>这里允许用 power2.out</strong>——立起是一个&quot;摆放&quot;动作（有始有终的事件），不是持续运镜，收住是对的</p><ul><li>为什么要配 rotateX：纯 rotateY 读作&quot;门绕轴转&quot;；加一点 rotateX 才读作&quot;摆在展示墙上&quot;</li><li>为什么要 <code>scale 0.94</code>：倾斜后页面的投影对角线变长，不后退就会顶到画幅边</li><li>投影同步：<code>opacity 0.05 → 0.19</code>（正视时几乎贴在舞台上 → 立起后浮起来）+ <code>x/y</code> 往倾斜反侧偏移，与立起<strong>同一时长同一缓动</strong></li><li>hold 期（微透视慢漂）：<code>rotateY −19° → −22.5°</code>、<code>rotateX 4.5° → 3.2°</code>，<code>sine.inOut</code> 走 3~10s。</li></ul><p>  <strong>两轴不同步</strong>（一个继续转、一个往回收）是&quot;活的镜头&quot;与&quot;机械转台&quot;的分界；投影跟着再挪一点</p><ul><li>文字可读性检查：立起后页面<strong>远端</strong>（后仰那一侧）的正文缩小最多，验收时按远端最小字号看，不是按近端</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>perspective</code>（父容器）</td><td>1000px（范围 900~1200）</td><td>空间强度。&lt;600px 边缘拉伸像鱼眼、读作&quot;变形&quot;不是&quot;空间&quot;；&gt;1600px 透视太弱，倾斜后近似平面斜切（等于白做 3D）</td></tr><tr><td><code>rotYTo</code></td><td>-19°（范围 12~25°，取负＝右侧后仰）</td><td>立面强度。&lt;10° 观众读不出立起来了；&gt;30° 远端正文不可读（要读的页面绝对不能超）</td></tr><tr><td><code>rotXTo</code></td><td>4.5°</td><td>俯角。0 = 门轴转的观感；&gt;10° 页面上边缘压缩严重，像从桌上俯拍（那是 evidence-scroll-tour 的 2.5D 变体）</td></tr><tr><td><code>scaleTo</code></td><td>0.94</td><td>立起时的后退量。1.0 会让倾斜后的页面顶到画幅边；&lt;0.85 页面变小、展示感变弱</td></tr><tr><td><code>tiltDur</code></td><td>1.5s（范围 1.2~1.8s）</td><td>立起时长。&lt;0.8s 读作&quot;甩&quot;（那是转场的语气）；&gt;2.5s 拖节奏、观众等着它转完</td></tr><tr><td><code>startHold</code></td><td>0.5s（范围 0.5~1s）</td><td>正视静置。0 = 观众还没读清页面就被转走了；&gt;1.5s 就成了两个镜头</td></tr><tr><td><code>shadowTo</code></td><td>0.19</td><td>立面投影浓度。0.05 以下没有浮起感；&gt;0.3 白底上读作脏，深底上则整块糊</td></tr><tr><td>hold 两轴终点</td><td>rotY -22.5° / rotX 3.2°</td><td>慢漂目标。两轴<strong>必须不同步</strong>（一个进一个退）；同步会读作机械转台</td></tr></table><h3>已知坑</h3><ul><li>倾斜超过 30°——页面远端的正文彻底不可读。这时只有两条路：要么降回 25° 以内，要么承认&quot;这一段不需要读页面内容&quot;（纯道具用法），那就该把正文换成灰阶占位、别让观众徒劳地去读。</li><li><code>perspective</code> 给到 400~600px——页面边缘被强烈拉伸，读作鱼眼镜头/变形贴图，不是&quot;空间里的一张页&quot;。900~1200 是安全区。</li><li><code>perspective</code> 写在被 transform 的元素自己身上（而不是父容器）——CSS 里 <code>transform: perspective(...)</code> 与父容器 <code>perspective</code> 的透视中心不同，多元素场景下各转各的、空间会散。本卡固定写在 <code>.world</code> 父容器上。</li><li>投影不跟着倾斜变（固定的 <code>box-shadow</code>）——页面读作一张贴纸。投影必须①同处 <code>preserve-3d</code> 空间被透视压扁 ②浓度随倾斜加深 ③位置往倾斜反侧挪。</li><li>忘了 <code>transform-style: preserve-3d</code>——投影层和页面层被拍平到同一平面，<code>translateZ</code> 完全失效，厚度感归零（最容易犯且最难看出原因的一个）。</li><li>忘了 <code>backface-visibility: hidden</code>——倾斜时页面边缘发灰/透出底色。</li><li>立起后完全静止——本库通病。立面 hold 必须有微透视慢漂。</li><li>hold 期两轴同相位同速续转——读作电动转台在匀速转，机械感；两轴要不同步（一进一退）。</li><li>立起用 <code>linear</code> 或匀速——&quot;摆放&quot;是个事件，匀速会读作机械臂。这里恰恰<strong>要</strong>用 <code>power2.out</code> 收住（与 [slow-push-in](slow-push-in.md) 的纪律相反，因为语义不同：那是持续运镜，这是一次动作）。</li><li>倾斜后页面顶到画幅边（甚至被裁）——立起时忘了配 <code>scale</code> 后退。倾斜后包围盒会变大，验收要看四角。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/tilt-3d-page/index.html</code>。换素材改 <code>.page</code> 内整块 DOM（或换成铺满的 <code>&lt;img&gt;</code>）；姿态与节奏全在顶部 <code>CONFIG</code>（<code>rotYFrom</code> / <code>rotYTo</code> / <code>rotXTo</code> / <code>scaleTo</code> / <code>tiltDur</code> / <code>holdDur</code> / <code>holdRotY</code> / <code>holdRotX</code> / <code>startHold</code> / <code>shadowFrom</code> / <code>shadowTo</code>）；透视值改 <code>.world</code> 的 <code>perspective</code>，投影质感改 <code>.shadow</code> 的 <code>blur</code> 与 <code>translateZ</code>。核心可摘走：<code>CONFIG</code> + <code>DemoShell.register</code> 回调体 + 三层结构的那几行 CSS（<code>perspective</code> / <code>preserve-3d</code> / <code>.shadow</code>）。</li><li>Remotion 移植：外层 <code>&lt;div style={{perspective: 1000, perspectiveOrigin: '50% 46%'}}&gt;</code>，内层相机 <code>&lt;div style={{transformStyle: 'preserve-3d', transform: \\</code>rotateY(${ry}deg) rotateX(${rx}deg) scale(${s})\\<code>}}&gt;</code>；<code>ry</code> 用 <code>interpolate(frame, [t0, t1, t2], [0, -19, -22.5], {easing: Easing.out(Easing.quad), extrapolateRight: 'clamp'})</code>（立起段 <code>Easing.out(Easing.quad)</code>，hold 段换 <code>Easing.inOut(Easing.sin)</code> 需拆两个 interpolate 或用 <code>Easing.bezier</code>），<code>rx</code> / <code>s</code> 同法；投影是同尺寸的 <code>&lt;div style={{filter: 'blur(26px)', transform: 'translateZ(-34px)', opacity: op, ...}}/&gt;</code> 放在页面前面（DOM 顺序在下层）。注意 Remotion 的 <code>&lt;AbsoluteFill&gt;</code> 默认不带 <code>preserve-3d</code>，必须显式写。</li><li>剪辑软件对应物：AE——把截图放进 3D 图层（打开图层的 3D 开关），<code>Y Rotation</code> 打 0→-19° 关键帧，配一个摄像机（Camera）并设 Zoom 对应 perspective，投影用复制图层 + 压暗 + 快速模糊 + 稍微错位；或直接用 <code>CC Cylinder</code>/<code>Corner Pin</code> 的伪 3D 做法（不推荐，透视不真）。剪映——素材&quot;3D 旋转&quot;/&quot;倾斜&quot;关键帧（Y 轴），投影靠&quot;阴影&quot;参数（跟随变化有限，弱一档）。Premiere——<code>Basic 3D</code> 效果的 <code>Swivel</code> 参数 + <code>Distance to Image</code>。<strong>这就是各家素材站说的 &quot;3D mockup / device tilt&quot; 品类</strong>（Envato 上有大量现成 AE 模板）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<strong>平面→3D 立面的姿态转换</strong>这一完整动作——正视静置 0.5~1s → <code>rotateY 0→12~25°</code>（负值右侧后仰）+ <code>rotateX 0→~4.5°</code> + <code>scale→0.94</code> 后退，1.2~1.8s <code>power2.out</code> 收住（&quot;摆放&quot;是事件，允许末速归零，与持续运镜的纪律相反）；三层结构（父容器 <code>perspective 900~1200px</code> / 相机层 <code>preserve-3d</code> / 独立投影层 <code>translateZ(-34px)</code> + blur）；<strong>投影与倾斜同步联动</strong>——同处 3D 空间被透视压扁 + 浓度 0.05→0.19 加深 + 位置往倾斜反侧偏移；hold 期<strong>两轴不同步</strong>的微透视慢漂（一轴续转、一轴回收，<code>sine.inOut</code>）；&quot;倾斜量 ≤25° 以保正文可读&quot;与&quot;透视值 900~1200 以免读作变形&quot;这两条阈值纪律。</li><li>不属于本卡的：demo 里的灰阶线框产品落地页（导航/Hero 大标题/主图占位/三栏特性卡/价格条及其全部文案与排版）、倾斜方向选右侧后仰这一具体决定、投影的具体模糊半径与浓度取值（随底色调）、素材的入场动画、页面上叠加的任何字幕或图表。</li><li>迁移接口：<code>perspective</code>（父容器）定空间强度，换画幅时按画幅宽等比缩放（本卡按 960 宽 / 792px 页宽设计）；<code>rotYTo</code> / <code>rotXTo</code> 定立面姿态（<strong>按&quot;远端最小字号是否可读&quot;验收</strong>，不是按近端）；<code>scaleTo</code> 按倾斜量反推（倾斜越大退得越多，保证四角不出画）；<code>tiltDur</code> 1.2~1.8s 与讲述&quot;我们做了个东西&quot;这句话等长；hold 两轴终点只需保持&quot;不同步&quot;，具体值随意；投影 <code>blur</code>/<code>translateZ</code>/<code>opacity</code> 三者按画幅等比缩放，深底素材把浓度降一半。</li><li>底色要求：白底即可（demo 白底 + 灰阶投影已足够读出&quot;页面浮起来&quot;）。深色底同样成立，但投影要改用<strong>亮边</strong>（深底上的暗投影不可见）——即把 <code>.shadow</code> 换成浅色微光层，或给页面加一圈 1px 亮描边替代投影，这属于迁移时的底色适配。</li></ul>","black-slam-transition":"<h3>意图</h3><p>其余五式都在做&quot;动量交接&quot;，黑震切反过来——它是<strong>故意的断裂</strong>，用一次合法的硬切换取最大冲击。 关键不在&quot;硬切&quot;本身（那是 PPT 感的病根），而在硬切两侧的<strong>特权安排</strong>： 出场侧给一拍定格（全片唯一静止的时刻），入场侧给一拍震动 + 自带运动。 定格制造预备，震动兑现冲击；如果两边都平平地切，就退化成了它要避免的那个毛病。</p><p>做对的命门：① <strong>定格必须是全片唯一的</strong>——其余镜头的 hold 期相机永不静止，只有这里停一拍， 静止才成为信号而不是失误；② <strong>零交叠</strong>（<code>hardOut</code>，最后 1 帧直接消失，不淡出）——有交叠就不是&quot;震&quot;了； ③ <strong>入场满亮直切且开场自带运动</strong>——切进来那一帧就已经在 1.10 并且带震位，直切到静止画面会读作幻灯片跳页； ④ <strong>全片限一次</strong>——用第二次时，第一次的分量立刻蒸发。</p><h3>动效核心</h3><p>时间结构（<code>cut = at + 0.12</code>，参数全在 <code>CONFIG.slam</code>）：</p><table><tr><th>阶段</th><th>时刻</th><th>出场镜头</th><th>重音层</th><th>入场镜头</th></tr><tr><td>定格</td><td><code>at−0.34</code> → <code>at</code></td><td>相机<strong>完全静止</strong>（hold 只做前段慢推，末段留空）</td><td>—</td><td>停在 <code>scale 1.10</code>、<code>opacity 0</code></td></tr><tr><td>重音冲顶</td><td><code>at</code> → <code>cut</code></td><td>仍定格</td><td><code>opacity 0→0.34</code>，<code>power3.in</code></td><td>—</td></tr><tr><td>切点</td><td><code>cut</code></td><td><code>tl.set(opacity: 0)</code> —— hardOut，不淡出</td><td>峰值</td><td><code>tl.set(opacity: 1)</code> —— 满亮直切</td></tr><tr><td>震一拍</td><td><code>cut</code> → <code>cut+0.20</code></td><td>—</td><td>0.20s <code>power2.out</code> 回落</td><td><code>x: +9 → −4.95 → +2.52 → 0</code>（三段递减，每段 0.06/0.06/0.08s，<code>ease:none</code>）</td></tr><tr><td>后拉刹住</td><td><code>cut</code> → <code>cut+0.50</code></td><td>—</td><td>—</td><td><code>scale 1.10→1.0</code>，<code>power4.out</code></td></tr><tr><td>交班</td><td>—</td><td>—</td><td>—</td><td>hold 期慢漂（<code>drift 10px</code> + <code>push 0.03</code>）</td></tr></table><ul><li><strong><code>hardOut</code> 是本式的技术标记</strong>：GSAP 里用 <code>tl.set(out, {opacity: 0}, cut)</code>，</li></ul><p>  Remotion 里是 <code>&lt;ShotFade hardOut&gt;</code>（<code>opacity *= frame &gt;= total - 1 ? 0 : 1</code>）。   两侧都用 <code>set</code> 而不是 <code>to</code>——这一帧的瞬变就是&quot;震&quot;的来源。</p><ul><li><strong>三段递减震位，不是抖动</strong>：<code>+9 → −4.95 → +2.52 → 0</code>，幅度按 0.55 衰减，只在切点这一拍发生一次。</li></ul><p>  这与项目定版的&quot;不做定格抖动/line boil&quot;不冲突：抖动是持续的微振（读作廉价），   震位是<strong>边界上的单次冲击</strong>（读作物理）。用 <code>repeat</code> 做成持续抖动就踩了红线。</p><ul><li><strong><code>ease:none</code> 的三段位移</strong>：每段线性、段间硬转向，才有&quot;撞&quot;的棱角；用 <code>elastic</code>/<code>back</code> 会读作果冻。</li><li><strong>后拉用 <code>power4.out</code></strong>：极陡的减速——切进来那一帧速度最大，0.15s 内吃掉九成，剩下 0.35s 缓慢落定。</li></ul><p>  这条曲线让&quot;满亮直切&quot;不显得突然，因为观众看到的是&quot;冲进来然后被刹住&quot;。</p><ul><li><strong>重音峰值 0.34（白底压暗）</strong>：比过曝翻页高（0.10），因为它要承担整次冲击；</li></ul><p>  深底工程换回白色径向过曝时可到 0.55~0.7。极性规则与 [[overexpose-flip-transition]] 相同。</p><p>Remotion 对应写法（<code>template/motion-systems/transitions.tsx</code>）：</p><ul><li>出场 shot（末段<strong>不加相机键</strong> = 定格，配 hardOut）：<code>{ tail: 1, hardOut: true, path: [{t:0, scale:1.02}, {t:tFreeze, scale:1.06}] }</code>，外壳 <code>&lt;ShotFade lead={lead} tail={1} narrationFrames={n} hardOut&gt;</code></li><li>入场 shot（<code>lead: 0</code> 零交叠，<code>path</code> 自带起手运动）：<code>{ lead: 0, path: [{t:0, scale:1.10, x:9}, {t:0.2, x:0}, {t:0.5, scale:1.0}] }</code></li><li>它是六式里<strong>唯一没有 CamKey 生成器</strong>的一式——出场侧的动作是&quot;不加键&quot;，入场侧的起手运动按当场内容定（震位方向、后拉量都可调）。</li><li>闪光由场景自己画；有 <code>env.tsx</code> 时写进 <code>TRANSITION_FLASHES</code> 表统一管理。</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>定格时长 <code>freeze</code></td><td>0.34s（≈10 帧）</td><td>&lt;0.2s 观众来不及注意到&quot;停了&quot;，预备拍失效；&gt;0.6s 读作卡顿/掉帧</td></tr><tr><td>重音冲顶 <code>punch</code></td><td>0.12s（≈4 帧）</td><td>&gt;0.25s 观众提前预知要切，冲击被泄掉；&lt;0.06s 重音来不及被看见</td></tr><tr><td>重音峰值 <code>peak</code></td><td>白底 0.34 / 深底 0.55~0.7</td><td>比过曝翻页高——它承担整次冲击；白底 &lt;0.2 读作&quot;闪了一下没意义&quot;</td></tr><tr><td>重音回落 <code>fall</code></td><td>0.20s</td><td>比过曝翻页的 0.42s 短：这里要让新画面尽快亮出来</td></tr><tr><td>震位幅度 <code>shake</code></td><td>9px @960 宽</td><td>&lt;5px 看不见；&gt;16px 读作故障/穿帮；按屏宽比例缩放</td></tr><tr><td>震位段时长</td><td>0.06 / 0.06 / 0.08s</td><td>每段 ≥0.1s 就成了&quot;晃&quot;而不是&quot;震&quot;；段数 &gt;3 就成了抖动（踩红线）</td></tr><tr><td>入场起手景别 <code>kickScale</code></td><td>1.10</td><td>=1.0 是直切到静止画面 = 幻灯片跳页；&gt;1.25 后拉太长，冲击被拖散</td></tr><tr><td>后拉刹住 <code>kick</code></td><td>0.50s，<code>power4.out</code></td><td>换 <code>power2.out</code> 减速太软、失去&quot;被刹住&quot;感；&gt;0.8s 冲击拖尾过久</td></tr><tr><td>交叠</td><td><strong>0（hardOut）</strong></td><td>任何非零交叠都让本式退化成推穿的一个弱版本</td></tr></table><h3>已知坑</h3><ul><li>用了两次以上：第一次的分量当场蒸发。全片限一次，留给最大反转。</li><li>出场侧没有定格（照旧慢推）：硬切没有预备拍，读作剪辑失误而不是设计。</li><li>定格那一拍加了 idle 微动&quot;以免太死&quot;：那就不是定格了，本式的信号消失。</li><li>入场侧不带运动直切：静止画面瞬现 = PPT 跳页，把本卡最想避免的毛病请回来了。</li><li>把震位做成 <code>repeat</code> 持续抖动：踩项目红线（不做定格抖动），且读作廉价。震只发生一次。</li><li>用了交叠淡化（忘了 <code>hardOut</code>）：软化了边界，冲击全无。</li><li>白底工程照抄白色过曝重音：被底色吞掉（同 [[overexpose-flip-transition]] 的极性约束）。</li><li>定格 + 硬切放在一句话中间：本式必须压在句末/停顿处，否则语音连续而画面断裂，读作丢帧。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/black-slam-transition/index.html</code>。摘 <code>blackSlam(出场镜头, 入场镜头, 起始秒) → 结束秒</code></li></ul><p>  一个函数 + <code>CONFIG.slam</code> 一组参数 + <code>.flash</code> 那段 CSS。<strong>注意排片</strong>：出场镜头的 <code>hold()</code> 时长要写成   <code>hold - freeze</code>（末段留空 = 定格），这一句不能省，否则定格不存在。</p><ul><li>Remotion：出场 shot 末段不加 CamKey + <code>&lt;ShotFade hardOut&gt;</code> + <code>tail: 1</code>；入场 shot <code>lead: 0</code>，</li></ul><p>  <code>path</code> 首键自带 <code>scale 1.10</code> 与震位；闪光走 <code>TRANSITION_FLASHES</code> 表。</p><ul><li>家族关系：它是六式里唯一的硬切，其余五式都有交叠。想要冲击但不想断裂 → 用 [[overexpose-flip-transition]]；</li></ul><p>  想要&quot;零补间硬切当节拍器&quot;的连续版本 → 那是另一张卡 color-slam-beat-card（底色跳变节拍），不要与本式混用。</p><ul><li>剪辑软件对应物：剪映/PR 里就是不加转场的硬切 + 前一镜定格帧 + 后一镜&quot;缩放+位置&quot;两个关键帧；</li></ul><p>  AE 用 Exposure 冲顶 + 后镜 Scale/Position 关键帧（Easy Ease 改成 90% 出）——本卡把三件事绑成了一个时间形状。</p><h3>动效范围</h3><ul><li>属于本卡的：出场侧<strong>相机定格一拍</strong>（全片唯一静止的时刻，作为硬切的预备拍）+ 重音 0.12s <code>power3.in</code> 冲顶；</li></ul><p>  <strong>零交叠 hardOut</strong>（最后 1 帧 <code>opacity</code> 直接归零，用 <code>set</code> 不用 <code>to</code>）；入场侧满亮直切（同帧 <code>set opacity:1</code>）   且开场自带运动——切点一拍的三段递减震位（<code>+9 → −4.95 → +2.52 → 0</code>，每段 <code>ease:none</code>，只发生一次）   + <code>scale 1.10→1.0</code> 的 <code>power4.out</code> 后拉刹住；重音 0.20s <code>power2.out</code> 回落；hold 期相机永不静止的慢漂。</p><ul><li>不属于本卡的：两个镜头里的文字与配色（白/浅灰 tile + 灰字式名是&quot;认式子的标签&quot;，不是台词字幕）、</li></ul><p>  左上说明角标、<strong>重音是亮还是暗</strong>（随底色定）、震位往左还是往右、<code>.shot</code> 的 <code>inset:-14%</code> 具体数值。</p><ul><li>迁移接口：时序全在 <code>CONFIG.slam</code>（<code>freeze</code>/<code>punch</code>/<code>peak</code>/<code>fall</code>/<code>kick</code>/<code>kickScale</code>/<code>shake</code>）；</li></ul><p>  <strong>重音层极性随底色切换</strong>（白底暗压 0.34，深底白色径向过曝 0.55~0.7，包络不动）；   换尺寸时 <code>shake</code> 按屏宽比例缩放，<code>kickScale</code> 与画幅无关；   <strong>零交叠是本式的定义，不可参数化</strong>——一旦给了交叠就该改用别的式。</p><ul><li>底色要求：白底可跑，<strong>但重音层必须换极性</strong>（白色过曝在白底上被完全吞掉，改成压暗一拍）。</li></ul><p>  相机曲线与底色无关。这与 [[overexpose-flip-transition]] 共享同一条底色耦合约束。</p>","chapter-title-card":"<h3>意图</h3><p>长口播讲到第 4 分钟观众注意力必然涣散——章节卡是一次强制&quot;翻页&quot;，让观众喘口气并重置预期（&quot;哦，进入新话题了&quot;）。 命门：<strong>层次</strong>（编号先落位立骨架，章节名再进——同时出现层次就塌了）、 <strong>不呆滞</strong>（hold 期间整组带极缓漂移，完全静止 1 秒读作视频卡帧）、 <strong>快进快出</strong>（全程 ≤2.5s，转场比内容还长就是喧宾夺主）。</p><h3>动效核心</h3><ul><li>全屏色块 <code>.chapter-card</code>（品牌色/深色，flex 居中排编号+文字组）：<code>xPercent -100 → 0</code>，0.3s，<code>power4.inOut</code>，从左压入盖住口播画面</li><li>章节编号 <code>.chapter-num</code>（衬线体 Georgia/宋体，216px ≈ 屏高 40%）：色块盖屏后 opacity 0→1 + scale 1.3→1，0.4s，<code>power3.out</code></li><li>章节名 <code>.chapter-name</code>：外层 <code>overflow:hidden</code> 容器内做 <code>clip-path: inset(0 100% 0 0) → inset(0 0% 0 0)</code> 侧向遮罩揭示，0.35s，<code>power3.out</code>，起点比编号晚 0.18s</li><li>小字戳 <code>.chapter-sub</code>（英文章节号+日期，字距拉大）：比章节名再晚 0.1s，opacity 0→1 + x -14px→0，0.3s</li><li>hold：编号与文字组整体 x 0→10px 线性漂移贯穿停留期（1.7s），防卡帧感</li><li>出场：色块继续同方向 <code>xPercent 0 → 100</code>，0.3s，<code>power4.in</code>，露出底下口播画面（主持人+字幕区一直在色块下层没动过）</li><li>demo 连演两张卡（01 蓝 → 02 红），中间回到口播 0.7s，示意真实节奏</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>wipeIn</code></td><td>0.3s</td><td>&gt;0.5s 像幕布拉过没有&quot;压入&quot;劲；&lt;0.2s 观众没意识到发生了转场</td></tr><tr><td><code>numIn</code></td><td>0.4s</td><td>编号是骨架，太快（&lt;0.25s）立不住；太慢挤压后面节拍</td></tr><tr><td><code>nameIn</code></td><td>0.35s</td><td>遮罩揭示再慢就读作&quot;加载中&quot;；比编号晚 0.18s 起是层次的来源</td></tr><tr><td><code>subDelay</code></td><td>0.1s</td><td>小字与章节名的错峰；0 则三层同出层次塌掉</td></tr><tr><td><code>hold</code></td><td>1.2s</td><td>观众读完标题所需时间；&gt;2s 拖节奏，&lt;0.8s 长标题读不完</td></tr><tr><td><code>driftPx</code></td><td>10</td><td>hold 期防呆滞的漂移量；&gt;20px 读作运镜失误，0 则像卡帧</td></tr><tr><td><code>wipeOut</code></td><td>0.3s</td><td>出场比入场可略快；用 <code>power4.in</code> 加速离场才有&quot;翻过去&quot;感</td></tr><tr><td><code>gapBetween</code></td><td>0.7s</td><td>两章之间回口播的间隔，仅 demo 示范用；实际由口播内容决定</td></tr></table><h3>已知坑</h3><ul><li>编号和章节名同帧出现——没有先后就没有层次，读作一张静态 PPT 突然糊上来。</li><li>hold 期间所有元素完全静止——观众会怀疑视频卡了；极缓漂移是&quot;活着&quot;的最低成本证明。</li><li>全程超过 2.5s——转场比正文还隆重，观众等得不耐烦，一眼业余。</li><li>编号用细无衬线小字——章节感靠的就是超大衬线编号的&quot;书卷分量&quot;，缩小或换细体立刻廉价。</li><li>色块出场换方向（从右回弹）——观众预期&quot;翻页&quot;是单向的，来回晃读作撤销。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/chapter-title-card/index.html。换文案改 <code>.chapter-num</code> / <code>.chapter-name</code> / <code>.chapter-sub</code> 内文本；换色改 <code>.chapter-card.c1</code> / <code>.c2</code> 的 <code>background</code>；节奏全部在顶部 <code>CONFIG</code>（<code>wipeIn</code>/<code>numIn</code>/<code>nameIn</code>/<code>subDelay</code>/<code>hold</code>/<code>driftPx</code>/<code>wipeOut</code>/<code>gapBetween</code>）。加第三章 = 复制一段 <code>.chapter-card</code> DOM + 在 register 里多调一次 <code>chapterBeat(tl, cards[2], at)</code>。核心节拍函数 <code>chapterBeat</code> 可整段摘走。</li><li>Remotion 移植：每章一个 <code>&lt;Sequence&gt;</code>；色块用 <code>
