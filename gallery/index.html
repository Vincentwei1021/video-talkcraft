/ul>","news-card-desk":"<h3>意图</h3><p>口播里直接糊一张新闻截图 = 静态 PPT；把截图包成&quot;摆上桌&quot;的卡片并当着观众的面划出重点， 既给素材入场仪式感，又替观众完成&quot;该看哪一句&quot;的视线引导。命门三条： <strong>Ken Burns 必须极缓</strong>（8s 才推 4%，快了读作镜头晃）；<strong>红线要等朗读到关键词才扫</strong> （与卡片同时出现就不是&quot;划重点&quot;而是&quot;印刷体&quot;）；<strong>卡片必须轻微歪 1~2°</strong> （直挺挺立在正中读作软件弹窗，歪了才像&quot;摆上桌&quot;的实物）。</p><h3>动效核心</h3><ul><li>卡片结构：白底圆角（radius 8px）+ 描边 #e0e0e0 + 投影（白底桌面上 0 14px 30px rgba(0,0,0,.14) 足够分层；深底桌面需加深）+ 假新闻排版：报头/日期一行 + 粗底线、标题 h2、正文用灰条代替</li><li>卡 A 入场：opacity 0→1 + y 60px→0，0.4s，<code>power3.out</code>，带 rotate -1.5° 定歪</li><li>Ken Burns：卡内包一层 <code>.kb-inner</code>（transform-origin 50% 40%），落位后 scale 1→1.04，8s，<code>ease:none</code>——卡片&quot;活着&quot;但不晃</li><li>红线：标题关键词包 span，内嵌绝对定位红条（#d8383a，高 5px，贴字底），1.0s 时 scaleX 0→1，0.3s，<code>power2.out</code>，<code>transform-origin: left center</code>——从左往右&quot;划&quot;出来</li><li>卡 B 堆叠：1.9s 时从右侧 x 320px→0 + 淡入，0.4s，<code>power3.out</code>，rotate +2°（与卡 A 反向歪），DOM 顺序在后自然压在卡 A 之上，落位后同样开始自己的 Ken Burns</li><li>层级：卡片层之上留 <code>.caption-zone</code> 字幕区，口播台词与红线时刻呼应（&quot;重点是这一万亿&quot;）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>slideIn</td><td>0.4s</td><td>&gt;0.6s 上桌拖沓像浮现；&lt;0.25s 读作弹窗</td></tr><tr><td>slideY</td><td>60px</td><td>越大&quot;从桌外拿进来&quot;感越强；&gt;120px 滑程抢戏</td></tr><tr><td>tiltA / tiltB</td><td>-1.5° / 2°</td><td>归零立刻假（软件弹窗感）；&gt;4° 读作东倒西歪</td></tr><tr><td>redlineAt</td><td>1.0s</td><td>必须对齐朗读到关键词的时刻；提前=印刷体，滞后=划错重点</td></tr><tr><td>redline</td><td>0.3s</td><td>&gt;0.5s 像慢镜头描字；&lt;0.15s 看不出&quot;划&quot;的动作</td></tr><tr><td>cardBAt</td><td>1.9s</td><td>跟着口播列举节奏走；太近两卡打架，太远堆叠感断掉</td></tr><tr><td>kenburns</td><td>1.04</td><td>&gt;1.08 开始读作 zoom 镜头；1.0 卡片死板</td></tr><tr><td>kbDur</td><td>8s</td><td>越长越沉稳；&lt;4s 就像手持晃动</td></tr></table><h3>已知坑</h3><ul><li>Ken Burns 推快了（&lt;4s 或倍数 &gt;1.08）——观众读到的是&quot;镜头在晃&quot;而不是&quot;素材活着&quot;。</li><li>红线和朗读不同步——红线先于人声划出等于剧透，一眼看穿是预渲染动画。</li><li>卡片直挺挺立在画面正中——零旋转 + 居中 = 软件 alert 弹窗，歪 1~2° 才是&quot;摆上桌&quot;。</li><li>两张卡不重叠、各占一边——没有压叠就没有&quot;桌面越摆越满&quot;的列举感，成了并排 PPT。</li><li>红线用 width 动画而不是 scaleX——width 回流抖动且不吃 GPU，扫动不顺滑。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/news-card-desk/index.html。换文案改两张卡里的 <code>.paper</code>（报头）、<code>.date</code>、<code>h2</code> 标题即可；要划的关键句包在 <code>&lt;span class=&quot;kw&quot;&gt;…&lt;span class=&quot;redline&quot;&gt;&lt;/span&gt;&lt;/span&gt;</code> 里；红线颜色改 <code>.redline</code> 的 <code>background: #d8383a</code>，卡底色改 <code>.news-card</code> 的 <code>background</code>。节奏全部在顶部 <code>CONFIG</code>：<code>redlineAt</code> 对齐你的语音重音，<code>cardBAt</code> 对齐第二条素材的口播时刻，<code>tiltA/tiltB</code> 控制歪度。核心动画即 <code>DemoShell.register</code> 内那一段 timeline，连同 CONFIG 复制可直接摘走。</li><li>（实测变体）译文条覆盖：外文截图不用红线划重点，而是在关键句上直接叠一条白底黑字的译文横条（宽度对齐该句，压在原文之上）——观众省掉&quot;读外文再理解&quot;的一步；适合引用英文报道/推文的段落，与红线通道二选一。见小Lin说·韩股崩盘。</li><li>Remotion 移植：卡片入场用 <code>spring({frame, config:{damping:200}})</code> 驱动 y/opacity；Ken Burns 用 <code>interpolate(frame, [inFrame, inFrame+8*fps], [1, 1.04])</code> 慢推（clamp）；红线单独包 <code>&lt;Sequence from={redlineAt*fps}&gt;</code>，内部 <code>interpolate(frame, [0, 0.3*fps], [0, 1])</code> 驱动 scaleX；第二张卡再包一个 <code>&lt;Sequence from={cardBAt*fps}&gt;</code> 重复同一入场组件。</li><li>剪辑软件对应物：剪映——素材加&quot;白色边框&quot;贴纸打底 + 入场动画&quot;向上滑动&quot;，红线用&quot;画笔/线条贴纸&quot;的擦除入场，缓推用&quot;缩放&quot;关键帧拉满全程；AE——卡片做预合成，Position/Opacity 关键帧 + Scale 100→104 线性，红线是 Shape Layer + Trim Paths；CapCut——&quot;Photo frame&quot; 模板 + &quot;wipe right&quot; 的线条 element，zoom 用 keyframe 手动拉。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：卡片&quot;摆上桌&quot;入场——opacity 0→1 + y 60px→0（0.4s、power3.out）并带 1~2° 定歪（零旋转即读作软件弹窗）；落位即起的极缓 Ken Burns（内层 <code>.kb-inner</code>、scale 1→1.04、8s、ease none，origin 50% 40%）；划重点的下划线 scaleX 0→1（0.3s、power2.out、origin left center）且必须等朗读到关键词才扫（早于人声＝剧透）；第二张卡延迟入场从侧向滑入 + 反向歪度、DOM 顺序在后自然压叠，落位后各自跑自己的 Ken Burns；卡片必须离开背景一层（投影/描边）这条约束。</li><li>不属于本卡的：假新闻的排版（报头、日期、灰条正文）、标题与字幕文案、卡片圆角与字号、下划线的具体色值、桌面底色。</li><li>迁移接口：<code>redlineAt</code> 对齐你的语音重音、<code>cardBAt</code> 对齐第二条素材的口播时刻（两者是唯一需要跟音频对齐的参数）；<code>slideIn</code> / <code>slideY</code> 调上桌行程；<code>tiltA</code> / <code>tiltB</code> 控歪度（保持一正一负）；<code>kenburns</code> / <code>kbDur</code> 控&quot;活着但不晃&quot;（&gt;1.08 或 &lt;4s 就读作镜头晃）；<code>cardBFrom</code> 换第二张卡的进场方向；划重点色换 <code>.redline</code> 的 <code>background</code> 一处。</li><li>底色要求：白底即可。卡片本身也是白底，靠 #e0e0e0 描边 + 一层 14% 黑投影与舞台分层——这两者不能同时去掉。深底桌面时把卡片保持白、投影加深即可，时序不变。</li></ul>","ui-flow-theater":"<h3>意图</h3><p>口播讲&quot;这个产品怎么用&quot;时有三条常见路：录屏（光标 12px 看不见、节奏由手速决定、要脱敏就废了）、 截图硬切（丢掉&quot;这一步导致了那一步&quot;的因果）、逐个控件做动效（每个控件各自一条时间线， 排到第三个就对不上拍了）。界面流程剧场是第四条：<strong>把整套界面当一个演员，给它一份剧本</strong>。 剧本就是一张 <code>STEPS</code> 表，一行一拍；光标读它决定什么时候走到哪、什么时候按下， 控件读<strong>同一张表的同一个 <code>at</code></strong> 决定什么时候换态。观众看到的是&quot;手点下去 → 这个控件当场变了 → 手走到下一个&quot;，因果链一节不断，而制作者只维护一张表。 命门：<strong>时间只从一处进入</strong>（<code>at</code> 是唯一的时间源，光标与控件都是它的函数，对齐靠共享常量不靠两处手数）、 <strong>坐标是命名常量</strong>（控件落点运行时反算成 <code>POS.xxx</code>，光标路点只引用名字，换布局不用改数字）、 <strong>一个控件一种响应</strong>（每个控件一个响应函数，函数内部没有时间参数）。 这三条不是代码风格，是这张卡能排到 4 拍以上还不散架的全部原因。</p><h3>动效核心</h3><ul><li><strong>STEPS 时刻表（本卡的骨架）</strong>：<code>[{ at, target, act, move, until }]</code>——</li></ul><p>  <code>at</code> 是这一拍<strong>按下</strong>的时刻，<code>target</code> 指向 <code>POS</code> 里的命名坐标与 <code>RESPOND</code> 里的响应函数，   <code>act</code> 是 <code>click</code> / <code>drag</code>，<code>until</code> 只有拖拽拍才有（松手时刻）。   demo 四拍：2.10 开关 → 3.10 分段 → 4.05~4.95 滑杆 → 5.90 保存。<strong>约 1s/拍</strong>（一拍一个口播短句）</p><ul><li><strong>命名坐标常量（必抄）</strong>：控件落点在建时间线前用 <code>P(el, fx, fy)</code> 运行时反算一次，存成</li></ul><p>  <code>POS = { sw, seg, sld, sldEnd, save }</code>；光标路点、涟漪圆心、拖拽终点全部引用这些名字。   <strong>源码里绝不出现第二遍坐标数字</strong>——remocn 那边是 <code>SWITCH_CX = RIGHT_X + SWITCH_W/2</code> 这种手算常量，   HTML 侧用 <code>getBoundingClientRect</code> 反算更稳（换画幅/换布局/改字号都不用改任何数字）</p><ul><li><strong>入场（先给全景，再动手）</strong>：整卡 <code>blur 9→0</code> + 淡入 0.6s <code>power2.out</code>，随后卡内区块</li></ul><p>  <strong>每 0.2s 错峰一个</strong>、各自 <code>blur 5→0</code> + <code>y 8→0</code> 0.53s。区块 = 标题 / 开关行 / 分段行 / 滑杆行 / 按钮行。   全部区块落定之后光标才起步——<strong>在界面还在入场时就动手，观众会以为是两段动画叠在一起</strong></p><ul><li><strong>光标走位</strong>：与 <code>cursor-actor-demo◆</code> 同一套移动语言——x <code>power2.inOut</code> + y <code>sine.inOut</code></li></ul><p>  分开插值合成弧线，跨区域 0.62s / 相邻控件 0.40s；到位后停 <code>hoverHold</code> 0.2s 才按下。   <strong>移动的结束时刻由 <code>at</code> 反推</strong>（<code>start = at - hoverHold - dur</code>）——所以改一拍的 <code>at</code>，   移动、悬停、按压、换态四件事整体跟着挪，不用逐个改</p><ul><li><strong>按压</strong>：光标 <code>scale 1→0.9→1</code> 各 0.09s（锚 <code>transform-origin: 0% 0%</code> 在箭头尖）+</li></ul><p>  从箭头尖扩散的涟漪（<code>scale 0.3→1.6</code> / <code>opacity 1→0</code>，0.35s）。   <strong>换态发生在按下中点</strong>（<code>at + press*0.55</code>），不等抬手</p><ul><li><strong>拖拽拍的特殊纪律</strong>：<code>hold()</code> 只下压不回弹（按住不放），松手时才回弹；</li></ul><p>  <strong>被拖控件的值必须与光标 x 用同一个缓动</strong>（都是 <code>power2.inOut</code>）——   两边缓动不同，拖到中段箭头尖就飘出手柄外，&quot;抓住了&quot;当场破产</p><ul><li><strong>四种控件响应（一个控件一种，别混）</strong>：</li></ul><p>  ① 开关：滑块 <code>x 0→20px</code> 0.27s <code>power2.out</code> + 轨道转深 + 滑块转白   ② 分段选择：指示器 <code>x</code> 滑一格（<code>x = 指示器自身宽度</code>，<strong>只动 x 不动宽度</strong>）+ 两个标签同拍换色   ③ 滑杆：按下先给手柄 <code>scale 1.12</code> + 描边加深，值在拖拽段里跟手——      填充宽度 / 手柄位置 / 百分比读数<strong>共用同一个代理值</strong>（<code>onUpdate</code> 里一起写）   ④ 按钮：按压微缩 → 底色转语义色 + <strong>label 与勾交叉淡化</strong>（label 留在正常流撑住宽度、      勾绝对定位覆盖，两者只驱动 opacity）——按钮框绝不跳</p><ul><li><strong>换态时长全库统一 0.27s <code>power2.out</code></strong>（press 态只给一半）——四个控件同一个数，</li></ul><p>  界面才读作&quot;一套&quot;；每个控件各调一个时长，会读成四个独立小动画拼在一起</p><ul><li><strong>成功 toast 收尾</strong>：最后一次按下后 0.33s 起，<code>y 16→0</code> + <code>scale 0.97→1</code> + 淡入 0.47s <code>power3.out</code></li></ul><p>  （<code>transform-origin: bottom center</code>），停 1.8s 后 0.47s 退。<strong>它是全卡唯一的语义色</strong>（和保存按钮那一拍共用）</p><ul><li><strong>层级</strong>：底 UI &lt; 控件状态层 &lt; toast（z 20）&lt; 涟漪（z 29）&lt; 光标（z 30）。光标永远在最顶</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>STEPS[].at</code></td><td>2.10 / 3.10 / 4.05 / 5.90</td><td>每拍按下的时刻，全卡唯一的时间源；一拍一个口播短句，间隔 &lt;0.6s 退化成加速录屏、&gt;1.5s 画面在等语音</td></tr><tr><td><code>cardIn</code> / <code>cardBlur</code></td><td>0.60s / 9px</td><td>整卡揭示；<code>cardBlur</code> &gt;14px 揭示瞬间像隔了层毛玻璃，&lt;5px 看不出&quot;揭示&quot;（读作普通淡入）</td></tr><tr><td><code>blkStep</code></td><td>0.20s</td><td>区块错峰步长；0 则五个区块同帧砸上来（一眼是贴图），&gt;0.35s 观众等着面板长完</td></tr><tr><td><code>blkIn</code> / <code>blkBlur</code> / <code>blkLift</code></td><td>0.53s / 5px / 8px</td><td>单区块揭示；<code>blkLift</code> &gt;16px 每行都在飞、抢掉后面的操作戏</td></tr><tr><td><code>moveLong</code> / <code>moveShort</code></td><td>0.62s / 0.40s</td><td>跨区域 / 相邻控件移动；&lt;0.25s 读作瞬移，&gt;0.9s 口播已经说到下一句</td></tr><tr><td><code>hoverHold</code></td><td>0.20s</td><td>到位到按下的微停顿；0 则读作程序自动点击，&gt;0.5s 像光标卡住</td></tr><tr><td><code>press</code> / <code>pressScale</code></td><td>0.09s / 0.9</td><td>按压时长（抬手同值）/ 微缩倍数；<code>pressScale</code> &lt;0.8 像箭头被吸进屏幕</td></tr><tr><td><code>ripple</code> / <code>rippleFrom</code> / <code>rippleTo</code></td><td>0.35s / 0.3 / 1.6</td><td>涟漪扩散；<code>rippleTo</code> &gt;2 圆环比控件还大、抢戏</td></tr><tr><td><code>swap</code></td><td>0.27s</td><td><strong>所有控件的换态时长</strong>（唯一一个数）；&lt;0.15s 看不清状态变了，&gt;0.45s 控件变成主角</td></tr><tr><td><code>dragEase</code></td><td><code>power2.inOut</code></td><td>拖拽段缓动，<strong>必须与光标 x 的缓动一致</strong>；不一致时手柄会脱离箭头尖</td></tr><tr><td>拖拽段长（<code>until - at</code>）</td><td>0.90s</td><td>拖行程耗时；&lt;0.4s 看不出&quot;被拖过去&quot;（读作换图），&gt;1.4s 观众等不动</td></tr><tr><td><code>sldFrom</code> / <code>sldTo</code></td><td>28% / 76%</td><td>滑杆起止值；行程 &lt;25% 看不出被拖动，起点 0 或终点 100 显得像&quot;拉满/清零&quot;另一件事</td></tr><tr><td><code>toastIn</code> / <code>toastHold</code> / <code>toastOut</code></td><td>0.47s / 1.8s / 0.47s</td><td>toast 三段；<code>toastHold</code> &lt;1s 观众读不完，&gt;3s 画面停死</td></tr><tr><td><code>toastLift</code></td><td>16px</td><td>toast 滑入位移；&gt;28px 像从屏外飞进来（抢掉刚才那一记点击的收尾）</td></tr></table><h3>已知坑</h3><ul><li>光标一条时间线、控件各一条时间线，靠手数时间对齐——排到第三拍必然错开，且改任何一拍要改两处。</li></ul><p>  本卡的全部架构价值就在&quot;共享同一批 <code>at</code>&quot;这一条；两套时间源是这类卡最常见的死法。</p><ul><li>控件坐标在光标路点里手写一遍、在 CSS 里再写一遍——改布局漏改一处，光标就点在空气上。必须运行时反算成命名常量。</li><li>界面还在入场（区块在错峰揭示）时光标就开始走——两段动画叠在一起，观众不知道该看入场还是看操作。</li><li>四个控件各用一个换态时长——读成四个独立小动画拼盘，界面不像&quot;一套&quot;。全卡一个 <code>swap</code>。</li><li>拖拽时手柄与光标缓动不同（一个 <code>power1</code>、一个 <code>power2</code>）——拖到中段箭头尖飘在手柄外，&quot;抓住了&quot;当场破产。</li><li>拖拽的按压做成&quot;下压又回弹&quot;——那是点击不是按住；按住不放必须只下压、到松手才回弹。</li><li>滑杆拖完才刷新百分比读数——观众读作&quot;贴了张图然后换了个数&quot;；填充 / 手柄 / 读数必须共用一个代理值。</li><li>分段选择的指示器用改宽度或改 <code>left</code> 实现——每帧重排会带着标签抖；只动 <code>transform: x</code>。</li><li>按钮成功态换文案不做交叉淡化（直接换 innerText）——按钮宽度当场跳一下，最该稳的收尾拍在抖。</li></ul><p>  必须 label 留在正常流撑宽度、勾绝对定位覆盖，两者只驱动 opacity。</p><ul><li>语义色上到多个控件（开关也红、分段也红、按钮也红）——一屏三个重点等于没有重点。</li></ul><p>  全卡只有&quot;保存成功&quot;那一拍有色（按钮底 + toast 图标）。</p><ul><li>toast 紧贴最后一次点击同帧滑入——读作&quot;点击自带一个弹窗特效&quot;；隔 0.3s 左右才有&quot;系统回应你&quot;的因果。</li><li>给假 UI 加拟真质感（渐变按钮/内阴影/玻璃/多层投影）——界面变成主角，抢掉讲述；灰阶线框足够。</li><li>一拍里点两个控件（顺手把两个开关都点了）——观众来不及看清哪个变了；一拍一个控件。</li><li>光标被 toast 盖住——层级破产（toast z 20 必须低于涟漪 29 与光标 30）。</li><li>忘了把控件状态纳入重播复位段——重播第一帧开关还是开着的、滑杆还在 76%、按钮还是成功态。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：STEPS 时刻表这套架构纪律（<code>at</code> 是唯一时间源、光标与控件读同一个数、移动起点由 <code>at</code> 反推、一个控件一个无时间参数的响应函数）；控件坐标运行时反算成命名常量这条做法；入场的两级揭示（整卡 blur 0.6s → 区块每 0.2s 错峰 0.53s blur-in，全部落定后光标才起步）；光标走位语言（x/y 分缓动成弧线、跨区 0.62s / 相邻 0.40s、到位悬停 0.2s、按压 0.09s 锚在箭头尖 + 涟漪 0.35s、换态发生在按下中点不等抬手）；拖拽拍的纪律（只下压不回弹到松手才回弹、被拖控件与光标共用同一缓动同一时长）；四种控件响应语言（开关滑块+轨道转深 / 分段指示器只动 x + 标签同拍换色 / 滑杆填充与手柄与读数共用一个代理值 / 按钮 label↔勾交叉淡化不跳框）及&quot;全卡共用一个 0.27s 换态时长&quot;；成功 toast 三段（滑入 0.47s + 停 1.8s + 退 0.47s，最后一次按下后 0.33s 起）；语义色只上收尾那一拍；五层层级（底 UI &lt; 控件状态 &lt; toast &lt; 涟漪 &lt; 光标）。</li><li>不属于本卡的：demo 里那套&quot;输出设置&quot;假面板的结构与文案（标题/三行设置项/取消与保存按钮/toast 文案全是演示语境）、灰阶线框这套取值（<code>#e0e0e0</code> 卡边框 / <code>#c8c8cd</code> 控件描边 / <code>#1d1d1f</code> 开关轨与指示器 / <code>#ececef</code> 滑杆轨都是占位）、<code>#d8383a</code> 这个具体语义色、控件的具体尺寸（开关 46×26 / 分段 220×34 / 滑杆轨 168 / 按钮 36 高）、&quot;开关+分段+滑杆+按钮&quot;这个具体控件组合（换成表单填写、多步骤向导、下拉筛选、聊天输入同样成立）、角标主持人（本卡未用）、深墨箭头这个具体光标造型（与 cursor-actor-demo 同款，形状属于那张卡）。</li><li><strong>与 <code>cursor-actor-demo◆</code> 的边界（重要）</strong>：那张卡是<strong>光标单动作语法</strong>——一枚光标怎么移动、怎么悬停、怎么按压、怎么拖，一个动作对一个口播词，讲的是&quot;光标这个演员本身怎么演&quot;；它的 demo 里控件响应只是用来证明&quot;点了有反应&quot;。本卡是<strong>整套界面按脚本联动的架构</strong>——光标降级成时刻表的一个消费者，真正的内容是&quot;一张表同时驱动光标与全部控件&quot;这套时序架构（<code>at</code> 共享、坐标命名常量、响应函数化）。选卡判断：只演一两个动作（&quot;你就点这里&quot;）用 cursor-actor-demo；要演一条完整流程（三拍以上、多个控件、有收尾回执）用本卡。两张卡的光标实现是同一份代码，<strong>升级光标造型时两边同步改</strong>。</li><li>迁移接口：<code>STEPS</code> 表是唯一的迁移入口——<code>at</code> 全量换成实际语音的词级时间戳，<code>target</code> 换成目标 UI 的控件名；新增控件 = 往 <code>POS</code> 加一个反算坐标 + 往 <code>RESPOND</code> 加一个响应函数（函数内部不碰时间）；尺寸按画幅等比缩放（光标约画幅短边 6~8%，控件尺寸跟着 UI 截图走）；语义色换成目标产品自己的 primary/success token（按钮底 + toast 图标两处同改）；语速变化时整表 <code>at</code> 重排，<strong>各动作时长（<code>moveLong</code>/<code>hoverHold</code>/<code>press</code>/<code>swap</code>/<code>toastIn</code>）保持不变</strong>——这些是手感常量，跟着语速缩放会让快语速下的操作糊成一团。</li><li>底色要求：白底即可（浅色设置面板是最常见情形）。深色 UI 同样成立，硬要求两条：<strong>光标与底的对比必须保住</strong>（深墨实心 + 白描边在两种底上都成立，深底把 <code>drop-shadow</code> 调淡）、<strong>控件的开/关两态对比必须保住</strong>（开关轨由&quot;白→深&quot;改为&quot;深→高亮&quot;，滑杆填充改为提亮，分段指示器改为亮块 + 深字）。toast 由白卡改为比背景略亮的深卡 + 保留同一个语义色图标。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/ui-flow-theater/index.html。<strong>换流程只改 <code>STEPS</code></strong>（一行一拍：<code>at</code> 时间戳 + <code>target</code> 控件名 + <code>act</code> 动作 + 拖拽拍的 <code>until</code>）；换界面改 <code>#stage</code> 里的 <code>.panel</code> 结构，然后同步改两处、只有两处——<code>POS</code> 里那几行 <code>P(el, fx, fy)</code> 反算，和 <code>RESPOND</code> 里对应的响应函数（响应函数签名是 <code>(t, step)</code>，<code>t</code> 就是&quot;该变了&quot;的时刻，函数内部不允许出现别的时间数字）；节奏参数全在 <code>CONFIG</code>。可整段摘走的核心是四块：<code>CONFIG</code> + <code>moveTo/press/hold</code> 三个光标原语 + <code>POS</code> 反算 + <code>RESPOND</code> 表，最后那个 <code>STEPS.forEach</code> 走表循环是把它们缝起来的全部代码（不到 20 行）。注意 <code>.blk</code> 用的是 <code>filter: blur()</code> 揭示，<strong>入场结束后 GSAP 会把 <code>filter</code> 留成 <code>blur(0px)</code></strong>——后面若要给区块加 <code>will-change</code>，只加在有文字的容器上（加在整卡层会让 1px 边框在锐利/模糊间脉动）。</li><li>Remotion 移植：remocn 源码就是这张卡的原型，直接读 <code>registry/remocn-ui/settings-toggle-flow/index.tsx</code>（本卡的主要来源）、<code>checkout-flow/index.tsx</code>（同架构的支付流程）、<code>ai-prompt-flow/index.tsx</code>（同架构的 AI 生成流程），架构说明在 <code>content/docs/ui/concepts.mdx</code> 与 <code>registry/remocn-ui/STYLE-GUIDE.md</code>。它那套的等价关系：<code>STEPS</code> → 每个控件一个 <code>use&lt;Name&gt;Transition([{at, state, duration}])</code> hook，光标 → <code>useCursorPath([{at, x, y, duration, click, press, easing}])</code>，<strong>两边的 <code>at</code> 写同一个常量表达式</strong>（源码里 <code>{at: 24 + DEMO}</code> 同时出现在 <code>useCursorPath</code> 和 <code>useSwitchTransition</code>，<code>DEMO</code> 是整体偏移量——这就是&quot;共享 at&quot;在帧驱动下的写法）；坐标 → 顶部一批命名常量（<code>SWITCH_CX = RIGHT_X + SWITCH_W / 2</code>）；控件本体 → 纯函数 <code>(state, theme) =&gt; view</code>，<strong>绝不读帧</strong>，帧只在调用方的 hook 里读一次。本库的秒 → 帧换算：×30（<code>swap</code> 0.27s = 8 帧、<code>hoverHold</code> 0.2s = 6 帧、<code>toastIn</code> 0.47s = 14 帧、整卡揭示 0.6s = 18 帧、区块错峰 0.2s = 6 帧）。若不用 remocn 那套 hook，自己写就是 <code>interpolate(frame, [at*fps, (at+swap)*fps], [from, to], {easing: Easing.out(Easing.quad), extrapolateLeft: 'clamp', extrapolateRight: 'clamp'})</code>，光标 x/y 两轴分别用 <code>Easing.inOut(Easing.quad)</code> 与 <code>Easing.inOut(Easing.sin)</code>。</li><li>剪辑软件对应物：剪映/CapCut——把界面拆成&quot;底图 + 每个控件两张状态图（关/开）&quot;，底图一轨常驻，每个控件两轨叠放并在该拍的按下帧硬切（下层关、上层开，用关键帧把上层不透明度 0→100 在两帧内切完，别用长淡入），光标是一张放大的 PNG 单独一轨打位置关键帧并把两端设&quot;缓入/缓出&quot;，滑杆填充用色块 + 蒙版位置关键帧、手柄单独一层同区间同缓动（两层必须选同一种缓动），toast 用一张卡片 PNG 做位置+不透明度关键帧；AE——每个控件一个预合成、状态切换用 Time Remap 或两层 Opacity 在同一帧对切，光标 Position 关键帧 + 空间插值改&quot;贝塞尔&quot;手动拉弧线，<strong>所有关键帧的时间码从一张 marker 表来</strong>（在时间轴上先按语音打好 marker，再把每个图层的关键帧吸附到 marker 上——这就是&quot;共享 at&quot;在 AE 里的等价物）；任何软件里的&quot;UI 演示模板/鼠标点击特效预设&quot;一律不用（节奏不受控、自带发光涟漪与拟真质感）。</li></ul>","chat-gpt":"<h3>意图</h3><p><strong>AI 产品界面自演比对话截图值钱</strong>：截图是&quot;事后的证据&quot;，自演是&quot;正在发生&quot;——观众看着提示词一个字一个字打进去、 按钮变形、回答流式吐出来，那句&quot;我是这么问的、它是这么答的&quot;就成了现在进行时。 本卡演的是 ChatGPT 的首屏语法：<strong>单行药丸</strong>（一次一句话，不是一段长提示词）、<strong>建议 chips 摆在输入条下面</strong> （首屏在教你能问什么）、<strong>问候语占据画面正中</strong>（首屏是空的，对话开始才让位）、morph 是<strong>圆 → 圆</strong> （形态不变，只换图标与底色）、点睛色在<strong>语音</strong>端而不是发送端。这五条是这个产品的取向，不是随便定的样式。 <strong>产品皮 = 内容本身（2026-08-25 用户定版）</strong>：本卡涉及真实产品界面，所以<strong>完全还原 ChatGPT 的样式</strong>， 不做中性化——<code>#0D0D0D</code> 墨字、<code>#E3E3E3</code> 药丸描边、<code>#F4F4F4</code> 用户气泡、<code>#2F6FED</code> 语音键、<code>#9B9B9B</code> 占位灰、 助手位那朵 OpenAI 结，全部照抄源码 <code>THEMES.light</code> + <code>accentColor</code>。理由：观众要一眼认出&quot;这是 ChatGPT&quot;—— 灰阶化之后它退成&quot;某个聊天框&quot;，上面那五条产品取向全部读不出来，这张卡就只剩一个通用打字机了。 可编辑的是<strong>内容</strong>（问候语/提示词/回答/chips 文案），外观不动。</p><p>命门：<strong>三段错峰的位移视差</strong>（源码给标题 ×0.4、药丸 ×0.6 两个不同乘数——同一个弹入里三层不齐步， 拉平了就是&quot;整块一起飘上来&quot;的模板感）、<strong>chips 随 morph 退场而不是随发送退场</strong>（&quot;手一落键，建议就不需要了&quot; 是这个产品的因果，等发送才退就慢了半拍）、<strong>chips 一去不回</strong>（退场跟不回退的 morph 正向进度， 否则发送键回退语音态时 chips 会跟着回来，读作&quot;首屏又回来了&quot;）。</p><h3>动效核心</h3><ul><li><strong>三段错峰淡入（本卡的入场骨架）</strong>：问候标题 <code>[0.13, 0.67]</code> → 药丸 <code>[0.33, 0.87]</code> → chips <code>[0.53, 1.07]</code></li></ul><p>  （源码 <code>fadeUpAt[4,20] / [10,26] / [16,32]</code>），各带 9px 上移。<strong>错峰顺序 = 阅读顺序</strong>（先看标题、再看输入框、最后看建议）</p><ul><li><strong>位移视差（最易漏掉的一处）</strong>：同一个 <code>spring(damping 14 / stiffness 110 / mass 0.7)</code> 的 21px 位移，</li></ul><p>  标题乘 <strong>0.4</strong>、药丸与 chips 乘 <strong>0.6</strong>——远的元素动得少。源码这两个乘数的差就是全部视差来源，   拉平成同一个值立刻退化成&quot;整块一起飘上来&quot;</p><ul><li><strong>1.40s 起打</strong>（源码 <code>TYPING_START_FRAME 42</code>）：静置留给口播开口</li><li><strong>逐字揭示，不分块</strong>：中文 8.5 字/s（源码 <code>TYPING_CPS 22</code> 是英文字符速率）。</li></ul><p>  药丸是<strong>单行 <code>nowrap</code></strong>——提示词长度有硬上限（这也是这个产品的语法：一次一句话）</p><ul><li><strong>输入光标两态</strong>：有字时跟在文本尾（插入点），空态时在占位文案前；打字中实心不闪，</li></ul><p>  未开打 / 打完待发才 1Hz 闪（源码 <code>Caret blink={!tw.typing}</code>）</p><ul><li><strong>morph（圆 → 圆）</strong>：同一个 33px 方框里两个<strong>都是圆</strong>的图层交叉，与打字<strong>同帧</strong>开始、0.40s 完成——</li></ul><p>  语音圆（点睛色底 + 白波形）<code>opacity 1 → 0</code> + <code>scale 1 → 0.9</code>，发送圆（墨底 + 白箭头）   <code>opacity 0 → 1</code> + <code>scale 0.8 → 1</code> 带 <code>back.out(1.7)</code>。   <strong>形态不变，只换图标与底色</strong>——morph 有两种形态路线（圆 → 圆、圆 → 方角），这个产品走的是圆 → 圆</p><ul><li><strong>点睛色在语音端</strong>：源码把 accent（<code>#2F6FED</code>）给了 morph 的<strong>起</strong>端（语音键），发送键是墨色 <code>#0D0D0D</code>。</li></ul><p>  accent 给起端还是终端是产品的取向差（有的产品反过来把亮色留给发送键）——<strong>这个产品在语音端</strong>，别顺手改</p><ul><li><strong>chips 随 morph 退场</strong>：<code>opacity ×= (1 − morph)</code>、下移 6px × morph——源码独有的一拍，</li></ul><p>  因果是「开始输入了，建议就不需要了」。退场跟的是<strong>不回退</strong>的 morph 正向进度：   发送键可以在发出后退回语音态（输入框空了），但 chips 一旦进了对话就不该回来</p><ul><li><strong>发送键按压</strong>：<code>sendAt</code> 为中心 ±0.11s 的时间窗内 <code>scale 1 → 0.86 → 1</code></li><li><strong>问候语退场 0.30s</strong>：发送那一帧起淡出，与用户消息块弹入<strong>交叉</strong>（首屏让位给对话）。</li></ul><p>  两者位置错开一档（会话区在问候语上方），交叉期不会读作两层内容打架；   但<strong>打字期间问候必须还在</strong>——那是「首屏还没提交」的唯一证据</p><ul><li><strong>用户消息块弹入 0.42s</strong>：发送同帧占位，<code>y 10 → 0</code> + <code>scale .95 → 1</code> + 淡入，浅灰圆角块靠右</li><li><strong>思考标识 0.52s</strong>：助手位的几何<strong>圆</strong>以 1.2Hz 呼吸（只改亮度，不做位移不做抖动），流式一开始即撤</li><li><strong>流式回答分块吐</strong>：<code>revealed = min(len, ceil(linear / 2) × 2)</code> @22 字/s，尾巴挂块光标、吐完即撤，</li></ul><p>  <strong>回答无气泡</strong>（纯文本 + 左侧 OpenAI 结标识）</p><ul><li><strong>层级</strong>：白底舞台 → 问候标题（与会话区共用同一条基线带，一淡出一淡入，零布局动画）→ 会话区 → 药丸（阴影浮起）→ chips</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>greetPar</code> / <code>pillPar</code></td><td>0.4 / 0.6</td><td>位移视差的两个乘数，本卡入场的命门；两者相等（无论取什么值）立刻退化成&quot;整块一起飘上来&quot;的模板感；差值 &gt;0.4 则标题几乎不动、读作两组元素不属于同一次入场</td></tr><tr><td>三段错峰间距</td><td>0.20s</td><td>标题 → 药丸 → chips 的起点间距；&lt;0.1s 三段糊成一段（错峰白做），&gt;0.4s 观众等最后一段等得住急</td></tr><tr><td><code>cps</code></td><td>8.5 字/s（中文）</td><td>打字速率，≈3.5 帧/字；&lt;6 观众开始读输入框，&gt;12 读作机器代打。英文提到 18~22</td></tr><tr><td><code>typeStart</code></td><td>1.40s</td><td>起打前静置（源码第 42 帧）；要 ≥ chips 淡入结束（1.07s），否则首屏还没摆好就已经在打字</td></tr><tr><td><code>morphDur</code></td><td>0.40s</td><td>语音圆 → 发送圆；&lt;0.2s 读作硬切换图标，&gt;0.7s 观众盯着按钮不听你讲</td></tr><tr><td>morph 起点</td><td><strong>= 打字起点</strong></td><td>等打完才 morph 就退化成「打字机」加「按钮换图标」两件不相干的事；同帧起才是&quot;界面在实时响应输入&quot;</td></tr><tr><td><code>chipsOutY</code></td><td>6px</td><td>chips 退场下移量；=0 则只是淡出（少了&quot;让位&quot;的方向感），&gt;14px 读作被踢下去</td></tr><tr><td>chips 退场触发</td><td><strong>morph 正向进度</strong></td><td>跟 <code>sendAt</code> 就慢半拍（打字期间建议还赖在那儿）；跟<strong>会回退</strong>的 morph 值则 chips 会在发送后回来，读作&quot;首屏又回来了&quot;</td></tr><tr><td><code>greetOut</code></td><td>0.30s</td><td>问候语退场；触发必须是 <code>sendAt</code> 而不是打字起点——打字期间问候还在，那是&quot;首屏还没提交&quot;的证据</td></tr><tr><td><code>sendGap</code></td><td>0.33s</td><td>打完到按下发送的停顿；=0 读作自动脚本，&gt;0.6s 观众以为卡住</td></tr><tr><td><code>thinkDur</code></td><td>0.52s</td><td>首 token 之前的思考；&lt;0.3s 看不出&quot;它在想&quot;，&gt;1.2s 观众开始等 AI</td></tr><tr><td><code>streamRate</code> / <code>streamChunk</code></td><td>22 字/s / 2</td><td>流式速率与分块；<code>chunk=1</code> 退化成逐字匀速（打字机不是流式），<code>chunk&gt;4</code> 读作整句硬切</td></tr><tr><td>提示词长度</td><td>10~14 字</td><td>单行药丸的硬上限（616px @14.5px 不折行）；超了就不适合这个形态（这个产品的语法就是一次一句话），该换宽卡 composer 类的界面去演</td></tr><tr><td>回答长度</td><td>28~36 字</td><td>单行不折行的上限；折两行以上观众切换到&quot;读回答&quot;模式</td></tr></table><h3>已知坑</h3><ul><li>三层位移用同一个乘数（视差拉平）——入场退化成&quot;整块一起飘上来&quot;，本卡入场编排的全部价值消失。</li><li>三段错峰改成同时淡入——错峰白做；顺序必须是阅读顺序（标题 → 输入框 → 建议）。</li><li>chips 等到发送才退——慢半拍，打字期间建议还赖在下面；因果是&quot;手一落键就不需要了&quot;。</li><li>chips 退场跟着<strong>会回退</strong>的 morph 值——发送键退回语音态时 chips 跟着回来，读作&quot;首屏又回来了&quot;；必须跟不回退的正向进度。</li><li>问候语在打字期间就退——丢掉&quot;首屏还没提交&quot;这层状态；它必须活到发送那一帧。</li><li>问候语与用户消息在同一位置硬切——两层内容在同一帧打架；两者位置错开一档、淡入淡出交叉才干净。</li><li>morph 等打完才开始——退化成「打字机」加「按钮换图标」两件不相干的事。</li><li>morph 做成圆 → 方——那是宽卡 composer 类产品的形态；这个产品是圆 → 圆（只换图标与底色），改了就不是它了。</li><li>点睛色给发送端——同上，这个产品的 accent 在<strong>语音</strong>端；两张卡的这个方向差是做对比视频时的内容。</li><li>回答套气泡——退回成普通聊天卡，AI 产品的界面语法全丢。</li><li>回答逐字匀速吐——那是打字机的手感；流式是 token 成簇到达，<code>chunk 2</code> 是下限。</li><li>思考标识做成三点跳——那是 IM 的&quot;对方正在输入&quot;；AI 的思考是单点呼吸。</li><li><strong>把 ChatGPT 的皮灰阶化</strong>（2026-08-25 用户定版否掉的做法）——灰阶化之后它退成&quot;某个聊天框&quot;，</li></ul><p>  单行药丸/chips/问候语/圆→圆 morph/点睛色在语音端这五条产品取向全部读不出来，只剩一个通用打字机。照抄源码取值。</p><ul><li>助手位用几何圆占位——ChatGPT 的助手消息前面是那朵结，换成裸圆就读不出是哪个产品了（回答本身无气泡，标识是唯一的产品线索）。</li><li>提示词超出单行——药丸 <code>nowrap</code> 会把它挤出去（或折行破坏药丸形态）；长提示词该换宽卡形态。</li><li>建议 chips 摆四枚以上——首屏变成菜单，观众开始读 chips；三枚是这个形态的容量。</li><li>一段演两问两答——观众切换到&quot;读对话&quot;模式；一问一答是自演的容量上限。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/chat-gpt/index.html。<strong>换内容只改 <code>CONFIG.prompt</code> / <code>CONFIG.reply</code> / <code>CONFIG.placeholder</code></strong>——</li></ul><p>  时刻表 <code>buildSchedule()</code> 按字数自动重算。节奏参数全在 <code>CONFIG</code>   （<code>greetPar</code> / <code>pillPar</code> / 三段 <code>*Fade</code> 窗 / <code>cps</code> / <code>morphDur</code> / <code>chipsOutY</code> / <code>greetOut</code> / <code>thinkDur</code> / <code>streamRate</code> / <code>streamChunk</code>）；   问候语改 <code>.greet</code> 的文案，三枚 chips 改 <code>.chips</code> 里的 <code>&lt;span&gt;</code>（图标是内联 SVG，换意图就换 path）；   <strong>配色不要改</strong>——它是 ChatGPT 的皮，属于内容（要改就是在做另一个产品的卡）；   真要换成<strong>别的</strong>产品皮时改两个 morph 图层的 <code>border-radius</code> 与底色 + 药丸圆角 + 助手位标识，<strong>时刻表与所有时长一律不动</strong>。</p><ul><li>Remotion 移植（这就是源头）：<code>registry/remocn/chat-gpt/index.tsx</code>（520 行）。可直接抄的纯函数——</li></ul><p>  <code>morphProgressAt(frame, {fps, speed})</code>（<code>spring({damping:14, stiffness:200, mass:0.6})</code> 后 clamp，   这个函数在 remocn 的几个 AI 产品组件里是共用的）、<code>introBounceIn</code>、<code>fadeUpAt</code>；   打字用 <code>useTypewriter(prompt, {cps, speed, startFrame})</code>（<code>registry/remocn-ui/core/timeline.ts</code>），   光标用 <code>registry/remocn-ui/caret</code> 的 <code>&lt;Caret blink={!tw.typing} blinkPerSecond={1} /&gt;</code>。   视差在源码里是 <code>intro.translateY * 0.4</code>（标题）与 <code>* 0.6</code>（药丸/chips）两处乘法——<strong>照抄这两个乘数</strong>；   chips 退场是 <code>chipsFade.opacity * (1 - morph)</code> 与 <code>chipsFade.translateY + 8 * morph</code>。   秒 ↔ 帧换算（30fps）：<code>fadeUpAt[4,20]/[10,26]/[16,32]</code> = [0.13,0.67]/[0.33,0.87]/[0.53,1.07]s、   <code>TYPING_START_FRAME 42</code> = 1.40s、morph 0.40s ≈ 12 帧、chips 下移 8px ≈ 6px（本卡等比 0.75）。   源码<strong>止于发送键就位</strong>（<code>durationInFrames 150</code> = 5s 定格）；发送 / 问候退场 / 用户消息 / 思考 / 流式五拍是本卡补的。   流式用 <code>Math.ceil(Math.floor((frame - streamStart)/fps × rate)/2)*2</code> 取子串（<strong>不要用 <code>Math.random</code></strong>，多趟渲染会闪）。   <strong>remocn 源码里另有 <code>claude-chat</code> / <code>opencode</code> / <code>v0</code> 三个组件共享同一套 morph 机制</strong>（同机制的不同产品皮）——   要做别的 AI 产品自演卡时先去读那几个，皮照抄、时序沿用本卡这套即可。</p><ul><li>剪辑软件对应物：剪映/CapCut——三段错峰就是三个图层各自的入场预设（&quot;向上滑入 + 淡入&quot;）<strong>错开 0.2s 起始</strong>，</li></ul><p>  视差靠给标题层的位移量调小（比如药丸走 14px、标题只走 9px）；   morph 是两个圆形按钮图层的交叉（Opacity 100→0 + Scale 100→90 / Opacity 0→100 + Scale 80→100 带弹性），   关键帧<strong>必须与打字第一帧对齐</strong>；chips 整组打一个组，Opacity 与 Position 的关键帧起点也钉在打字第一帧；   问候语的淡出关键帧钉在发送那一帧。AE——一个 Slider 当时钟，   <code>fadeUpAt</code> 三段各写 <code>linear(s, a, b, 0, 1)</code>，视差就是同一个 <code>y</code> 表达式乘不同系数，   回答的 Source Text 用 <code>text.sourceText.substring(0, Math.ceil(n/2)*2)</code>，   思考标识 <code>0.35 + 0.65*(Math.sin(time*2*Math.PI*1.2)+1)/2</code> 的 Opacity 表达式。   任何软件的&quot;AI 聊天模板&quot;要先检查三件事：三层有没有视差、morph 是否与打字同帧、chips 是不是跟着发送才退——市面模板三条基本全踩。</p><h3>动效范围</h3><ul><li>属于本卡的：三段错峰淡入按阅读顺序排（标题 → 输入条 → 建议，间距 0.20s，各带 9px 上移且淡入窗独立于位移）；<strong>位移视差</strong>（同一个 spring 位移乘 0.4 / 0.6 两个不同系数）；输入框逐字符揭示与光标&quot;跟文本尾 / 空态在占位前&quot;两态位置、&quot;打字中实心 / 停手 1Hz 闪&quot;两态闪烁；<strong>morph 与打字同帧起</strong>这条纪律，圆 → <strong>圆</strong>的形态（只换图标与底色）与两图层交叉方向（退的缩、进的涨带回弹）；点睛色在 morph <strong>起</strong>端这个方向；chips 随 morph <strong>正向</strong>进度淡出下移（不回退）；问候语在<strong>发送</strong>那一帧起淡出并与用户消息弹入交叉；发送键 ±0.11s 时间窗按压；用户消息块与发送同帧占位并弹入；思考标识单点呼吸（1.2Hz，只改亮度）与流式一开始即撤；流式回答的分块揭示 + 尾巴块光标 + 吐完即撤；<strong>回答无气泡</strong>这条结构纪律；&quot;一问一答 + 三枚 chips&quot;这两个容量上限。</li><li>不属于本卡的：demo 那句「帮我查这条数据的原始出处」与那条回答的具体文案、「今天想聊点什么？」这句问候、三枚 chips 的具体标签与图标（生成图片/写作润色/联网查证）、14.5px 字号这组等比换算、角标主持人（数字人）。</li></ul><p>  <strong>注意与其他卡不同：ChatGPT 的皮（<code>#0D0D0D</code> / <code>#E3E3E3</code> / <code>#F4F4F4</code> / <code>#2F6FED</code> / <code>#9B9B9B</code> 这套取值、616×48 药丸 + 24px 圆角这组源码几何、OpenAI 结、<code>+</code> 与麦克风两个图标）属于&quot;内容本身&quot;而不是&quot;可换的风格&quot;</strong>——见下面的底色要求。同一套时序当然可以套在别的&quot;单行药丸 + 建议 chips&quot;AI 产品首屏上，但那时皮要换成那个产品的皮（换了就不叫 chat-gpt 了）。</p><ul><li>迁移接口：<code>CONFIG.prompt</code> / <code>CONFIG.reply</code> 是唯一的迁移入口——换成真实问过的那一问一答（提示词 10~14 字受单行约束、回答 28~36 字），时刻表自动重算；语速变化时改 <code>sendGap</code> 与 <code>thinkDur</code>（<strong><code>cps</code> / <code>morphDur</code> / <code>streamRate</code> / <code>streamChunk</code> / 两个视差乘数保持不变</strong>——它们是手感常量）；换语言改 <code>cps</code>（中文 8.5 字/s、英文 18~22 字符/s）并重算单行容量；尺寸按画幅等比缩放，三段错峰的间距与视差乘数<strong>不随尺寸变</strong>；竖屏把药丸放到画幅宽度的 90%、chips 减到两枚并排（三枚会挤到折行，折行的 chips 排立刻读作乱）、<code>streamRate</code> 降到 18；换成<strong>别的</strong>产品皮时（那就是另一张卡了）只改两个 morph 图层的圆角/底色 + 药丸圆角 + 助手位标识，<strong>时序一律不动</strong>。</li><li>底色要求：<strong>产品皮 = 内容本身，2026-08-25 用户定版：完全还原产品样式</strong>。本卡涉及真实产品界面（ChatGPT 浅色皮），</li></ul><p>  所以取值锁在源码 <code>THEMES.light</code>（页 <code>#FFFFFF</code> / 输入条 <code>#FFFFFF</code> + <code>#E3E3E3</code> 描边 / 主文 <code>#0D0D0D</code> /   占位 <code>#9B9B9B</code> / chips <code>#E3E3E3</code> 描边 + <code>#5D5D5D</code> 字 / 发送 <code>#0D0D0D</code> 底白箭头 / accent <code>#2F6FED</code>），   <strong>不受&quot;白舞台中性化&quot;约束</strong>——把它灰阶化会让它退成&quot;某个聊天框&quot;，五条产品取向全部读不出来。   这个产品的浅色皮正好就是纯白，所以与白舞台天然一致（舞台底 = 产品底，不需要额外容器）。   深色皮也在源码里（页 <code>#212121</code> / 输入条 <code>#303030</code> / 主文 <code>#ECECEC</code> / chips 描边 <code>#454545</code>），   需要深色 ChatGPT 时整套换过去，<strong>唯一要跟着翻的是发送圆</strong>（浅皮墨底白箭头 → 深皮白底墨箭头，源码 <code>sendBg/sendArrow</code> 就是这么翻的）。</p><ul><li>与相邻卡的分工：<strong>vs [chat-message-flow](chat-message-flow.md)（通用聊天自演）</strong>——那张演*人和人*（两侧气泡、三点跳、反应表情，一段 2~4 条往复），本卡演*人和 AI 产品*（首屏三件套、morph、无气泡回答、流式吐字，一问一答）。<strong>vs [claude-code](claude-code.md)（同批姊妹卡）</strong>——那张是终端里的编码智能体（深底窗、工具调用循环、diff）；讲&quot;AI 帮我写代码&quot;用那张。<strong>vs [terminal-typing-log](terminal-typing-log.md)（通用终端）</strong>——那张是 stdout 流水且载体是终端；本卡的流式虽同样分块突进，但结构是「一问一答」，载体是产品界面。</li></ul><p>  <strong>要演别的聊天型 AI 产品</strong>（宽卡 composer 形态、morph 走圆 → 方角、accent 在发送端、无 chips、无首屏问候）时：   本卡的时序骨架照搬即可，皮去 remocn 源码的 <code>claude-chat</code> / <code>opencode</code> / <code>v0</code> 里抄。   本库目前只保留 ChatGPT 这一张聊天型产品卡（同批的 claude-chat 卡已于 2026-08-25 撤掉）。</p>","claude-code":"<h3>意图</h3><p><code>terminal-typing-log</code> 已经解决了「通用终端当证据」——命令 → 日志 → 结论的 stdout 流水。 但 coding agent 的终端<strong>不是流水</strong>：它是<strong>因果链</strong>。每一步都得看清「它调了什么工具、参数是什么、 返回了什么、于是改了哪一行」——这条链是 AI 编程内容的全部信息量所在。 观众要判断的不是「它跑没跑」（那是构建日志的事），而是「它到底干了什么、干得对不对」。 所以本卡的结构与那张根本不同：<strong>工具调用行带状态点且在出结果前一直呼吸</strong>（&quot;它在干活&quot;这一拍）、 <strong>结果行带折角缩进</strong>（视觉上挂在调用行下面，因果关系靠缩进表达）、<strong>diff 两行几乎连着出</strong> （同一次编辑的两半，中间不该有间隙）、<strong><code>+</code> 行是唯一语义色</strong>（&quot;文件真的被改了&quot;这一拍的重量全在这抹绿上）。 再加上源码那套首屏——欢迎框 + What's new + 提示行<strong>按阅读顺序三段错峰</strong>，&quot;这是一个刚启动的智能体&quot;就立住了。 <strong>产品皮 = 内容本身（2026-08-25 用户定版）</strong>：本卡涉及真实产品界面，所以<strong>完全还原 Claude Code 的样式</strong>， 不做中性化——陶土橙 <code>#D97757</code>（虚线框 + 骑边标题 + What's new 小标 + 吉祥物）、深底 <code>#1B1A18</code> / 窗饰条 <code>#3A3633</code>、 主文 <code>#E8E5DD</code> / 次文 <code>#8A857C</code> / 更暗 <code>#6B6660</code>、macOS 三灯真色、源码那枚像素兽，全部照抄源码 <code>THEMES.dark</code> + <code>accentColor</code>。 理由：这张卡要当&quot;我真的让它干过这个&quot;的证据，观众得一眼认出是哪个工具——灰阶化之后它是&quot;某个终端&quot;， 证据的指向性就没了。可编辑的是<strong>内容</strong>（命令/日志/身份栏文案），外观不动。</p><p>命门：<strong>三段错峰顺序 = 阅读顺序</strong>（乱序或同时淡入就丢掉&quot;界面在铺开&quot;）、<strong>行间延迟不等距</strong> （工具调用前等得久=它在想调什么，diff 两行几乎连着=同一次编辑；全表等距一眼是假数据）、 <strong>语义色只给 <code>+</code> 行</strong>（del 行用灰不用红——两色对上就变成彩虹 diff，&quot;改了什么&quot;反而看不清）。</p><h3>动效核心</h3><ul><li><strong>窗体弹入 0.62s</strong>：<code>y 21 → 0</code> + <code>scale .97 → 1</code>（源码 <code>spring(damping 14 / stiffness 110 / mass 0.7)</code>，</li></ul><p>  略欠阻尼 → 等价 <code>back.out(1.05)</code> 的微过冲）。深底窗 <code>#1B1A18</code> + macOS 三灯真色（源码 <code>#FF5F57 / #FEBC2E / #28C840</code>）</p><ul><li><strong>三段错峰淡入（本卡的入场骨架）</strong>：欢迎框 <code>[0.20, 0.73]</code> → What's new 栏 <code>[0.40, 1.00]</code> →</li></ul><p>  提示行 <code>[0.60, 1.20]</code>（源码 <code>fadeUpAt[6,22] / [12,30] / [18,36]</code>），各带 9px 上移。   <strong>顺序 = 阅读顺序</strong>：先看框、再看右栏、最后落到提示行——落点正是接下来要打字的地方</p><ul><li><strong>欢迎框的骑边标题</strong>：虚线框 + 标题片<strong>骑在上边框上</strong>，标题片用窗体底色盖掉那一段虚线——</li></ul><p>  所以标题看着是&quot;嵌&quot;在边框里的（源码这处细节，成本极低但少了它框子就很业余）</p><ul><li><strong>1.60s 起打</strong>（源码 <code>TYPING_START_FRAME 48</code>，比两张聊天卡晚 6 帧——首屏内容更多，多留一拍）</li><li><strong>命令逐字符揭示</strong>：<code>chunk 1</code> @11 字/s（中英混排；源码 <code>TYPING_CPS 18</code> 是纯 ASCII 速率）。</li></ul><p>  <strong>人在敲键盘不会 3 个字一起蹦</strong>——这与下面日志的分块正好是一组对比（见下条）</p><ul><li><strong>方块光标三态</strong>：打字中<strong>实心不闪</strong>、未开打 / 打完待回车 <strong>2Hz 闪</strong>（终端行业默认，比聊天卡的 1Hz 快一档）、</li></ul><p>  <strong>提交后即撤</strong>（交给日志行的光标）</p><ul><li><strong>提交后整行退成灰</strong>：<code>&gt; 命令</code> 从亮字变灰字——&quot;这句已经交出去了&quot;，与下面正在生成的日志分出层次。</li></ul><p>  少了这一步，命令行和日志行同亮，观众读不出哪个是输入哪个是输出</p><ul><li><strong>工作日志分块突进</strong>：<code>revealed = min(len, ceil(linear / 3) × 3)</code> @54 char/s——<strong>3 字一簇蹦出</strong>（机器在吐）。</li></ul><p>  与上面命令行的 <code>chunk 1</code> @11 字/s 差一个量级，这就是&quot;人打的&quot;和&quot;机器吐的&quot;的区别</p><ul><li><strong>行间延迟不等距</strong>：工具调用前 0.42 / 0.28s（它在想调什么），结果行前 0.50 / 0.32s（等返回），</li></ul><p>  <strong>diff 两行只隔 0.14s</strong>（同一次编辑的两半，几乎连着出），结论前 0.44s 再顿一下。   全表等距一眼是假数据</p><ul><li><strong>工具调用行的状态点</strong>：出结果之前以 1.1Hz <strong>呼吸</strong>（<code>opacity 0.35 → 1</code>，正弦），出结果即<strong>定亮</strong>。</li></ul><p>  &quot;它在干活&quot; vs &quot;这一步完事了&quot;——<strong>只改亮度，不做位移不做抖动</strong></p><ul><li><strong>行光标</strong>：只在该行未打完时存在（打完即撤），2Hz 方波闪。所以行间停顿段画面<strong>真静止</strong>，不是&quot;有个东西在闪&quot;</li><li><strong>四级颜色分级</strong>：工具调用行亮（<code>#E8E5DD</code>）/ 结果行暗（<code>#8A857C</code>）/ diff <code>-</code> 行灰（<code>#6B6660</code>）/</li></ul><p>  diff <code>+</code> 行绿（<code>#33d16b</code>，<strong>diff 里唯一的语义色</strong>，与 <code>terminal-typing-log</code> 同一支绿）。结论行的 <code>✓</code> 也用这抹绿。   陶土橙不参与这套分级——它是<strong>产品的身份色</strong>（框/标题/小标/吉祥物/状态点），跟&quot;改了什么&quot;这条信息无关，两者不冲突</p><ul><li><strong>行占位纪律</strong>：未到时刻的行 <code>visibility: hidden</code> 而不是 <code>display: none</code>——占位但不显示，整段布局零重排</li><li><strong>层级</strong>：白底舞台 → 深底终端窗（唯一深色区域）→ 欢迎框（虚线 + 骑边标题）→ 提示行 → 工作日志</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>三段错峰间距</td><td>0.20s</td><td>欢迎框 → 右栏 → 提示行的起点间距；&lt;0.1s 三段糊成一段（错峰白做），&gt;0.4s 首屏铺得太慢、打字迟迟不开始</td></tr><tr><td>错峰顺序</td><td><strong>阅读顺序</strong></td><td>框 → 右栏 → 提示行。乱序（比如提示行先出）就丢掉&quot;界面在铺开&quot;的因果，读作三块各自独立淡入</td></tr><tr><td><code>typeStart</code></td><td>1.60s</td><td>起打前静置（源码第 48 帧）；必须 ≥ 提示行淡入结束（1.20s），否则行还没显形就在打字</td></tr><tr><td><code>cps</code></td><td>11 字/s（中英混排）</td><td>命令打字速率；&lt;8 观众开始读命令而不是听你讲，&gt;16 读作机器代打。纯 ASCII 命令可提到 18</td></tr><tr><td><code>logRate</code> / <code>logChunk</code></td><td>54 char/s / 3</td><td>日志揭示速率与分块粒度，本卡第二命门；<code>chunk=1</code> 退化成逐字符（那是人在敲，不是机器在吐），<code>chunk&gt;5</code> 每簇太长读作整行硬切；速率必须<strong>明显高于</strong> <code>cps</code>，两者拉平就分不出&quot;人打的&quot;和&quot;机器吐的&quot;</td></tr><tr><td><code>submitGap</code></td><td>0.36s</td><td>打完到按回车的停顿（手指抬起再敲那一下）；=0 读作自动脚本，&gt;0.7s 观众以为卡住</td></tr><tr><td>行间延迟 <code>d</code></td><td>0.14~0.50s</td><td><strong>必须不等距</strong>：工具调用前久（它在想）、diff 两行几乎连着（同一次编辑）、结论前再顿一下；全表同值一眼是假数据</td></tr><tr><td><code>dotHz</code></td><td>1.1</td><td>工具调用状态点的呼吸频率；&gt;1.6 读作焦虑闪烁、&lt;0.7 看不出在动。只改亮度，加位移就撞库内&quot;不做微抖&quot;的偏好</td></tr><tr><td><code>cursorHz</code></td><td>2</td><td>方块光标闪烁；终端行业默认，比聊天卡的 1Hz 快一档（这一档差就是&quot;终端&quot;和&quot;输入框&quot;的手感差）</td></tr><tr><td>日志行数</td><td>6~8 行</td><td>一条因果链的容量；&lt;5 行链条不完整（看不出&quot;调用 → 结果 → 改动 → 结论&quot;），&gt;10 行观众开始读日志、离开你的讲述</td></tr><tr><td>语义色位置</td><td><strong>只给 <code>+</code> 行与 <code>✓</code></strong></td><td>del 行用灰不用红；两色都上就变成彩虹 diff，&quot;改了什么&quot;反而看不清</td></tr></table><h3>已知坑</h3><ul><li>三段同时淡入或乱序——丢掉&quot;界面在铺开&quot;的阅读引导；顺序必须是框 → 右栏 → 提示行。</li><li>命令行和日志同速同粒度——分不出&quot;人在敲&quot;与&quot;机器在吐&quot;，整段变成一台机器自言自语。</li><li>日志逐字符匀速（<code>chunk 1</code>）——一眼是 <code>setInterval</code> 教程；机器输出是成簇蹦出的。</li><li>行间延迟全表等距——节奏机械，一眼是假数据；真实智能体每一步耗时长短不齐（尤其 diff 两行必须几乎连着）。</li><li>工具调用行没有状态点，或状态点全程定亮——丢掉&quot;它在干活&quot;这一拍，工作日志退化成静态文本逐行出现。</li><li>状态点加抖动/旋转/位移——撞库内偏好（手作感靠形状不靠微抖）；只改亮度就够。</li><li>diff 的 <code>-</code> 行上红色——彩虹 diff，&quot;改了什么&quot;反而看不清；<code>-</code> 用灰，语义色只给 <code>+</code>。</li><li>语义色发给多个类型（工具调用蓝、结果黄、<code>+</code> 绿、<code>-</code> 红全上）——&quot;文件真的被改了&quot;这一拍没有重量。</li><li>提交后命令行不退灰——命令行与日志同亮，观众读不出哪个是输入哪个是输出。</li><li>提交后提示行光标不撤——终端里同时两个光标在闪，一眼是 bug。</li><li>行光标打完不撤（常驻已完成行末）——七行同时闪成圣诞树；且行间停顿段画面不再静止。</li><li>未到时刻的行用 <code>display: none</code>——行一出现就把整段重排一遍，读作&quot;每出一行抖一下&quot;；用 <code>visibility: hidden</code> 占位。</li><li>结果行不缩进不带折角——因果关系断了，读作两条并列的日志；缩进 + <code>⎿</code> 才表示&quot;这是上面那次调用的返回&quot;。</li><li>结论行放在中间——后续日志会把它冲下去，观众记不住结果；结论永远末行。</li><li><strong>把 Claude Code 的皮灰阶化</strong>（2026-08-25 用户定版否掉的做法）——灰阶终端是&quot;某个终端&quot;，</li></ul><p>  &quot;我真的让这个工具干过这个&quot;的指向性就没了。照抄陶土橙 <code>#D97757</code> 与那组深底取值。</p><ul><li>吉祥物换成方块几何占位——像素兽是这个工具首屏最强的识别物，换掉之后首屏就认不出了；用源码 <code>Mascot</code> 那条 path。</li><li>命令写成 <code>lorem</code> 或假路径——观众读得出假，&quot;我真的让它干过这个&quot;的说服力归零；写真实感的文件路径与任务。</li><li>日志写十几行完整 agent trace——终端是<strong>证据</strong>不是内容；6~8 行的一条链足够，再多观众开始读日志。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/claude-code/index.html。<strong>换内容只改 <code>CONFIG.prompt</code> 与 <code>CONFIG.lines</code></strong>——</li></ul><p>  每行 <code>{ k, t, d }</code>：<code>k</code> 取 <code>tool</code>（工具调用，带状态点）/ <code>res</code>（结果，带 <code>⎿</code> 折角缩进）/   <code>del</code>（diff 删除，灰）/ <code>add</code>（diff 新增，唯一语义色）/ <code>ok</code>（结论，带 <code>✓</code>），<code>d</code> 是行间延迟。   时刻表 <code>buildSchedule()</code> 按字数自动重算（<strong>不要手补时间</strong>）。   节奏参数全在 <code>CONFIG</code>（<code>cps</code> / <code>logRate</code> / <code>logChunk</code> / <code>submitGap</code> / <code>dotHz</code> / <code>cursorHz</code>）；   身份栏文案改 <code>.colL</code>（欢迎语 / 模型 / cwd），What's new 改 <code>.colR</code> 的 <code>&lt;li&gt;</code>；   语义色改 <code>.lg.add</code> 与 <code>.lg.ok b</code> 两处的 <code>color</code>（报错场景把这抹绿换成警示红，同样只给一行）；   <strong>陶土橙与那组深底不要改</strong>——它们是 Claude Code 的皮，属于内容（要改就是在做另一个工具的卡）；   改字号要同步改 <code>.lg</code> 的 <code>height</code>（行高）与窗高——本卡日志不滚动，但行高不齐会让停顿段看着&quot;漏了一行&quot;。</p><ul><li>Remotion 移植（这就是源头）：<code>registry/remocn/claude-code/index.tsx</code>（445 行）。可直接抄的纯函数——</li></ul><p>  <code>introBounceIn(frame, fps)</code> 出 <code>{translateY, scale}</code>、<code>fadeUpAt(frame, [a,b])</code> 出 <code>{opacity, translateY}</code>；   打字用 <code>useTypewriter(prompt, {cps: 18, speed, startFrame: 48})</code>（<code>registry/remocn-ui/core/timeline.ts</code>），   光标用 <code>registry/remocn-ui/caret</code> 的 <code>&lt;Caret width={11} height={22} blink={!tw.typing} /&gt;</code>。   源码导出 <code>WHATS_NEW: string[]</code>（右栏列表）、<code>TYPING_START_FRAME 48</code>、<code>TYPING_CPS 18</code>、<code>THEMES.dark/light</code>。   秒 ↔ 帧换算（30fps）：<code>fadeUpAt[6,22]/[12,30]/[18,36]</code> = [0.20,0.73]/[0.40,1.00]/[0.60,1.20]s、   <code>TYPING_START_FRAME 48</code> = 1.60s、<code>submitGap</code> 0.36s ≈ 11 帧。   源码<strong>止于命令打完</strong>（<code>durationInFrames 160</code> = 5.33s 定格，它只演到人按回车之前）——   回车 / 工具调用 / 结果 / diff / 结论这条因果链是本卡补的。日志部分的帧驱动写法与   [terminal-typing-log](terminal-typing-log.md) 完全一致：   <code>const linear = Math.floor(interpolate(frame, [start, start+dur], [0, len], {extrapolateLeft:'clamp', extrapolateRight:'clamp'})); const revealed = Math.min(len, Math.ceil(linear/3)*3)</code>；   状态点 <code>0.35 + 0.65*(Math.sin(2*Math.PI*((frame-start)/fps)*1.1)+1)/2</code>；   行光标 <code>Math.floor((frame/fps)*2) % 2 === 0 &amp;&amp; revealed &lt; len</code>。   <strong>不要用 <code>Math.random</code> 给速率加抖动</strong>——多趟渲染会闪；分块本身已提供不匀感。   姊妹组件 <code>opencode</code>（同架构的另一个 TUI 皮）可对照读。</p><ul><li>剪辑软件对应物：剪映/CapCut——终端窗是一张静态深底图，三段错峰是三个图层各自&quot;向上滑入 + 淡入&quot;<strong>错开 0.2s 起始</strong>；</li></ul><p>  命令行用一个文本层套&quot;打字机&quot;入场（速度调到 3 帧/字），提交后<strong>换成一个灰色文本层硬切</strong>（这就是&quot;退灰&quot;）；   日志每行一个文本层，打字机预设的速度要调到能看出成簇（多数预设做不到，可退而把每行切成 2~3 段硬切）；   行间延迟就是各层起始时间<strong>故意不等距</strong>；状态点用一个小圆图层配&quot;呼吸&quot;循环预设（<strong>只改不透明度</strong>，   凡是带缩放/位移的预设一律不用）。AE——一个 Slider 当时钟，   日志的 Source Text 用 <code>text.sourceText.substring(0, Math.ceil(n/3)*3)</code>（<code>ceil/3*3</code> 就是分块），   状态点 Opacity 用 <code>0.35 + 0.65*(Math.sin(time*2*Math.PI*1.1)+1)/2</code>，   光标用方块 Solid 配 <code>Math.floor(time*2)%2</code> 的 Opacity 表达式。   任何软件的&quot;终端/黑客打字预设&quot;一律不用——全是逐字匀速 + 常驻闪烁光标，两条命门全踩。</p><h3>动效范围</h3><ul><li>属于本卡的：三段错峰淡入按<strong>阅读顺序</strong>排（欢迎框 → 右栏 → 提示行，间距 0.20s，各带 9px 上移且淡入窗独立于窗体位移）；欢迎框的骑边标题（标题片用窗体底色盖掉一段虚线）；命令行逐字符揭示（<code>chunk 1</code>，人在敲）与日志分块突进（<code>ceil(linear/3)*3</code>，机器在吐）<strong>两条速率差一个量级</strong>这条纪律；方块光标三态（打字中实心 / 待回车 2Hz 闪 / 提交后即撤）；提交后命令行退成灰这一层次切分；「工具调用 → 结果 → diff → 结论」这条因果链的结构（结果行缩进带折角挂在调用行下）；<strong>行间延迟不等距</strong>（调用前久、diff 两行几乎连着、结论前再顿）；工具调用状态点在出结果前 1.1Hz 呼吸、出结果即定亮（只改亮度）；行光标只在该行未打完时存在（打完即撤，停顿段画面真静止）；四级颜色分级里&quot;<strong>语义色只给 diff <code>+</code> 行与 <code>✓</code></strong>、del 行用灰&quot;这条纪律；未到时刻的行 <code>visibility: hidden</code> 占位（布局零重排）；&quot;6~8 行一条链&quot;这个容量上限。</li><li>不属于本卡的：demo 那句「改 src/theme.ts，加一个深色模式开关」与七行日志的具体文案（142 行、8 行、<code>useColorScheme()</code> 全是演示语境）、「欢迎回来，阿维！」「~/code/koubo-site」这两处可换的身份文案、What's new 那三条、800×456 这个窗尺寸与 12.5~14px 字号这组等比换算、角标主持人（数字人）。</li></ul><p>  <strong>注意与其他卡不同：Claude Code 的皮（陶土橙 <code>#D97757</code>、<code>#1B1A18</code> / <code>#3A3633</code> 这组深底、<code>#E8E5DD</code> / <code>#8A857C</code> / <code>#6B6660</code> 三级字色、macOS 三灯真色与 12px 圆角、像素兽吉祥物、「Claude Code v2.0.0」这个骑边标题）属于&quot;内容本身&quot;而不是&quot;可换的风格&quot;</strong>——见下面的底色要求。同一套结构当然可以套在别的 coding agent TUI 上，但那时皮要换成那个工具的皮（换了就不叫 claude-code 了）。</p><ul><li>迁移接口：<code>CONFIG.prompt</code> 与 <code>CONFIG.lines</code> 是唯一的迁移入口——把命令与日志换成你真实跑过的那一次（保留「调用 → 结果 → diff → 结论」四段结构与<strong>不等距</strong>的 <code>d</code>，结论永远末行，<code>add</code> 行只有一条）；语速变化时只改 <code>submitGap</code> 与各行 <code>d</code>（<strong><code>cps</code> / <code>logRate</code> / <code>logChunk</code> / <code>dotHz</code> / <code>cursorHz</code> 保持不变</strong>——这五个是手感常量，跟着语速缩放会让快语速下的分块糊成匀速）；尺寸按画幅等比缩放，<code>.lg</code> 行高与窗高要一起改；竖屏把窗宽收到画幅宽度的 94%、把 What's new 栏整列去掉（双栏在竖屏里挤成两条窄柱）、日志文案缩短到不折行（等宽字体折行会破坏行高等距）；报错场景把 <code>add</code> 的绿换成警示红、<code>ok</code> 行换成 <code>✗ + 报错摘要</code>，<strong>时序一律不动</strong>。</li><li>底色要求：<strong>产品皮 = 内容本身，2026-08-25 用户定版：完全还原产品样式</strong>。本卡涉及真实产品界面（Claude Code 终端），</li></ul><p>  所以取值锁在源码 <code>THEMES.dark</code>（窗体 <code>#1B1A18</code> / 窗饰条 <code>#3A3633</code> / 主文 <code>#E8E5DD</code> / 次文 <code>#8A857C</code> /   更暗 <code>#6B6660</code> / 框线与标题 = accent <code>#D97757</code>），<strong>不受&quot;白舞台中性化&quot;约束</strong>。   这一条与 [terminal-typing-log](terminal-typing-log.md) 的深底例外叠加成立：&quot;命令行&quot;这层语义本来就靠深底，   且 diff <code>+</code> 行的绿只有在深底上才有足够对比。舞台本身仍是白底，深色只占那个窗口。   源码另有 <code>THEMES.light</code>（页 <code>#E8E5DD</code> / 窗饰条 <code>#D8D3CA</code> / 窗体 <code>#FBFAF7</code> / 主文 <code>#1F1E1D</code> / 次文 <code>#73726C</code>，   <strong>accent 不变</strong>——陶土橙是身份色，跨主题不动），需要浅色 Claude Code 时整套换过去，此时 <code>+</code> 行的绿要换成 <code>#1a7f3c</code> 一级，否则在浅底上糊掉。</p><ul><li>与相邻卡的分工：<strong>vs [terminal-typing-log](terminal-typing-log.md)（通用终端，最需要对照读）</strong>——那张是 <strong>stdout 流水</strong>（命令 → 日志 → 结论，<code>...</code> 结尾行悬停 0.6s、写满 8 行后缓冲区整跳一个行高），演的是&quot;我跑了一遍、它装上了/构建成功了&quot;；本卡是<strong>因果链</strong>（工具调用 → 结果 → diff → 结论，状态点呼吸、结果行缩进挂靠），演的是&quot;AI 到底干了什么、改了哪一行&quot;。讲构建/部署/安装用那张；讲 AI 编程用本张。两张共享分块突进与行占位这两条手感纪律，但本卡不做滚动（一条链放得下）、那张不做状态点。<strong>vs [chat-gpt](chat-gpt.md)（同批姊妹卡）</strong>——那张是<strong>聊天型</strong> AI 产品（药丸输入条 + morph + 无气泡流式回答），本卡是<strong>终端型</strong>编码智能体（深底窗 + 工具调用循环 + diff）；讲&quot;我和 AI 聊天/提示词技巧&quot;用那张，讲&quot;AI 帮我写代码&quot;用本张。两张一起上就是&quot;聊天型 + 终端型&quot;的完整 AI 产品证据链。<strong>vs [ui-flow-theater](ui-flow-theater.md)（界面剧场子类的母卡）</strong>——那张演的是<strong>人操作界面</strong>（光标走位 + 控件状态机），本卡演的是<strong>界面自己在生成内容</strong>（没有光标、没有点击，全部动作来自智能体）。</li></ul>","glass-code-walk":"<h3>意图</h3><p>口播讲代码有两个死角：贴一整屏代码，观众眼睛不知道该落在哪儿，你念到第 5 行时他还在读第 1 行； 只贴关键那两行，观众看不出它们在什么结构里。本卡是这个死角的解法——<strong>代码整块都在，但同一时刻只有一行是亮的</strong>。 观众的视线被那条高亮带牵着走，节奏由你定；周围的行压暗但没消失，结构感一直在。</p><p>命门有三条。<strong>第一条是浮点行号</strong>：<code>linePosition</code> 是浮点数，相机与高亮带都由它现算， 所以走读第 2 行到第 4 行时它连续走过 2.0 → 4.0，带子在行间<strong>滑过去</strong>。 一格一格跳的高亮是&quot;程序在切 class&quot;，滑过去的才是&quot;眼睛在移动&quot;。 <strong>第二条是停顿式而不是匀速</strong>：每行停 <code>dwell</code> 再滑 <code>stepDur</code> 到下一行。匀速滑动的传送带读作&quot;代码在自动播放&quot;， 观众会等它播完而不是听你讲；停顿式才是&quot;我念完这句了，看下一句&quot;。 <strong>第三条是收全景</strong>：观众跟着走完 8 句，眼里只有片段，需要一眼看到整段代码长什么样。 拉回 <code>zoom = 1</code> 同时解除压暗——从&quot;读这一行&quot;回到&quot;读整体结构&quot;，不收这一拍等于没讲完。</p><p>玻璃块本身是<strong>手段不是目的</strong>：半透明深底让语法色成立（浅玻璃上 token 色一律糊成粉笔字）， backdrop blur 把背后的东西揉开、块内块外能看出同一片背景的两种状态——这是&quot;玻璃&quot;读得出来的唯一证据。</p><p><strong>源码原始视觉（2026-08-25 用户定版：放弃改编，按 remocn 源码原样实现）</strong>：玻璃块的全部视觉取值 1:1 照抄 <code>glass-code-block</code>——<code>rgba(10,10,10,0.6)</code> 玻璃底 + <code>blur(16px)</code>、1px 渐变描边、 <code>0 50px 120px rgba(0,0,0,.55)</code> 投影、40px chrome + macOS 三灯真色（<code>opacity .6</code>）+ <code>#a1a1aa</code> 标题、 28px 行号槽 <code>#3f3f46</code>、五个 token 色（<code>#e4e4e7</code> / <code>#52525b</code> / <code>#86efac</code> / <code>#c4b5fd</code> / <code>#fcd34d</code>）。 舞台底也按源码的 <code>previewBackdrop</code>（一张暖褐→墨绿的暗调照片 <code>/bg.jpg</code>）复刻——demo 禁外网资源， 所以用 CSS 渐变还原那张图的色调分布。这也解决了改编版要靠&quot;三团灰阶软斑&quot;硬凑玻璃背景的问题： <strong>源码本来就是深色照片背景，玻璃有真东西可糊。</strong></p><h3>动效核心</h3><ul><li>结构两层：<code>.camera</code>（铺满舞台的世界坐标层，<code>transform-origin: 0 0</code>，全卡唯一被 transform 的元素）→ 玻璃块（世界坐标里位置固定）。动的只有相机 + 高亮带 + 各行的 opacity</li><li><strong><code>transform-origin: 0 0</code> 是反解式子成立的前提</strong>。默认 <code>center</code> 会让 <code>scale</code> 绕元素中心发生，整条式子失效</li><li><strong>核心反解</strong>：<code>tx = W/2 − zoom·cx</code>、<code>ty = H/2 − zoom·cy</code>、<code>scale = zoom</code>。含义是&quot;把锚点的缩放后位置搬到画面正中&quot;</li><li><strong>锚点纵向由浮点行号插值算出</strong>：<code>linePosition</code> 在相邻行之间连续（<code>lo = floor(p)</code>、<code>hi = lo+1</code>、按 <code>p − lo</code> 线性混合两行的行心 y）。</li></ul><p>  行心从 DOM 现量（<code>rowTop[i] + rowH[i]/2</code>）——换字号/换行数/空行半高都自动跟上，不用手填坐标</p><ul><li><strong>横向恒取块心，不跟字符</strong>：读代码是<strong>整行读</strong>。这是与 [cursor-locked-zoom](cursor-locked-zoom.md) 的第一个分界（那张锁 x 到字符光标）</li><li><strong>高亮带与相机同源</strong>：带子的 <code>top</code>/<code>height</code> 也由同一个 <code>linePosition</code> 插值出来（<code>trackedRow()</code> 一次返回 y / top / h 三个值）。</li></ul><p>  同源 ⇒ 只有一条时间轴在推进，两者不可能失步。给带子单独排一条 tween 去&quot;追&quot;相机，任何时长改动都会错开</p><ul><li><strong>压暗是连续量不是二值</strong>：<code>near = max(0, 1 − |i − linePosition|)</code>，离当前行越远越暗。</li></ul><p>  带子滑到两行之间时上下两行<strong>同时半亮</strong>，这一拍读作&quot;正在挪&quot;；二值切换（只有整数行才亮）会让&quot;滑动&quot;退化成&quot;闪&quot;</p><ul><li><strong>走读只停在有内容的行上</strong>：空行是排版不是一句话，<code>stops</code> 数组把空行过滤掉。但插值仍然经过空行（<code>linePosition</code> 是连续的），所以跨过空行时带子平滑掠过它</li><li><strong>停顿式节奏</strong>：<code>dwell 0.32s</code> 停 + <code>stepDur 0.26s</code> 滑（<code>power2.inOut</code>——两端都收，一次&quot;跳行&quot;是有始有终的事件）</li><li><strong>边界钳制（白底舞台的必需补丁，源码没有）</strong>：<code>半宽 = W/(2·zoom)</code>，<code>cx = clamp(cx, 块左 + 半宽, 块右 − 半宽)</code>，纵向同理；素材比可视区小时退化为居中。</li></ul><p>  <strong>块宽必须大于走读焦距下的可视宽</strong>（960 / 1.68 ≈ 571px，所以 demo 取 600px）——否则横向钳制退化为居中、画幅两侧露出白舞台细边</p><ul><li><strong>收尾只 tween <code>zoom</code> 与 <code>dimAmt</code> 两个值</strong>：<code>zoom</code> 变小 ⇒ 可视矩形变大 ⇒ 钳制范围收窄 ⇒ 中心被连续挤回块正中；<code>zoom = 1</code> 时块比画幅小、钳制退化为居中 ⇒ 恰好落在全景居中。位移不用第二条 tween</li><li>入场两拍：块 <code>y 16→0</code> + <code>scale 0.965→1</code>（<code>back.out(1.3)</code> 微过冲）、淡入是<strong>独立时间窗</strong>（位移先动、透明度后跟，remocn 全系入场的写法）；随后逐行 <code>y 6→0</code> + 淡入、行距 0.08s（源码 <code>staggerFrames 10</code> 帧 ≈ 0.33s，本卡收紧到 0.08s——10 行铺完只花 1.0s，不占口播时间）</li><li><strong>行必须是 block 不是 flex</strong>：flex 容器会丢掉纯空白的匿名子项 ⇒ token 之间的空格与行首缩进全部消失（<code>export function</code> 挤成 <code>exportfunction</code>）。这是实测踩到的坑</li><li>语法色只给四个锚点（关键字紫 <code>#c4b5fd</code> / 字符串绿 <code>#86efac</code> / 数字黄 <code>#fcd34d</code> / 注释灰 <code>#52525b</code>，普通码 <code>#e4e4e7</code>），极简正则分词，不是真高亮器（不属于本卡动效，但取值锁在源码 <code>TOKEN_COLORS</code>）</li><li><strong>字号由块宽反推，不是审美选择</strong>：块宽 600 是 <code>zoom 1.68</code> 下的下限（960/1.68 ≈ 571 + 余量），可用文本宽 = 600 − 2×24 padding − 28 行号槽 = 524px；等宽字符宽 ≈ 0.6em ⇒ 最长行 49 字符时 <code>fs ≤ 17.8</code>，取 <strong>17px</strong>（行高 26 = round(17×1.55)、空行 14 = 17×0.8）。源码是 880 宽 @18px，本卡块窄了 280px，<strong>字号必须跟着收，否则行尾溢出块外</strong>（实测踩到：18px 时 import 那行的右引号被切在块外）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>zoom</code></td><td>1.68（范围 1.5~1.8）</td><td>走读焦距。<strong>整行必须完整在画幅内</strong>——这是&quot;走读&quot;与 deep-zoom 的硬分界；&gt;2 行尾被裁，观众读半句；&lt;1.4 放大等于没放，压暗一个人在干活</td></tr><tr><td><code>dwell</code></td><td>0.32s</td><td>每行停留（读这一行的时间）。按口播语速给——他念完一句你才滑走；&lt;0.2s 观众来不及看清就被拖走，&gt;0.6s 带子像卡在那儿</td></tr><tr><td><code>stepDur</code></td><td>0.26s</td><td>行间滑动。&lt;0.15s 读作跳格（浮点插值白做了），&gt;0.45s 每次跳行都要等，8 句累计多出 1.5s</td></tr><tr><td><code>dimFloor</code></td><td>0.30</td><td>非当前行的压暗底。0 = 只剩一行可见（结构感全丢，那不如只贴那一行）；&gt;0.55 看不出在走读</td></tr><tr><td>行数</td><td>6~10 行</td><td>&lt;5 行不需要走读（一屏读得清，直接给全景 + 一次 [slow-push-in](slow-push-in.md)）；&gt;12 行走读时长超过 8s，观众走神</td></tr><tr><td>行宽 vs 字号</td><td>见上</td><td><strong>改块宽/焦距/行宽任一项都要按 <code>可用文本宽 ÷ (最长行字符数 × 0.6)</code> 复算字号</strong>——这是本卡唯一的硬耦合</td></tr><tr><td>行宽</td><td>≤ 49 字符</td><td>600px 块 @17px 等宽的上限（见上面的反推式）；折行会让行高不齐、行心插值跳一下</td></tr><tr><td><code>pushDur</code></td><td>0.55s</td><td>全景 → 走读焦距的推近（同时压暗、带子显形）。&lt;0.3s 读作硬切，&gt;0.9s 观众等它推完</td></tr><tr><td><code>holdEnd</code></td><td>0.30s</td><td>最后一行读完的停留。给&quot;这句念完了&quot;一个句读；0 = 读完立刻被拉走</td></tr><tr><td><code>pullDur</code></td><td>0.85s</td><td>拉回全景。&lt;0.5s 读作&quot;弹回去&quot;；&gt;1.2s 观众以为还有下一处要看</td></tr><tr><td><code>lineIn</code></td><td>0.08s</td><td>逐行入场间隔。&gt;0.15s 铺完 10 行要 1.5s，口播白等；0 = 整块一起亮，&quot;逐行落位&quot;这拍没了</td></tr><tr><td>块 backdrop blur</td><td>16px（源码值）</td><td>玻璃的 backdrop blur。&lt;8px 玻璃读作&quot;半透明色块&quot;；&gt;26px 背后的背景糊成均匀灰，玻璃感反而消失</td></tr></table><h3>已知坑</h3><ul><li><strong>字号与块宽的可算式</strong>（2026-08-27 实战补）：卡里那条&quot;字号与块宽是硬耦合&quot;给个式子——</li></ul><p>  <code>字号 ≤ (块宽 − 左右 padding) ÷ zoom ÷ (最长行字符数 × 0.6)</code>，且<strong>中文字符按 1.0 而不是 0.6 计</strong>   （带中文注释的行往往就是最长行）。实测 900px 块 / zoom 1.6 / 21px 会把 44 字符的 import 行切在块外。</p><ul><li><strong>高亮带用整数行号切 class</strong>——一格一格跳，读作&quot;程序在切样式&quot;不是&quot;眼睛在移动&quot;。浮点行号 + 插值是本卡的定义性特征。</li><li><strong>给高亮带单独排 tween 去追相机</strong>——两者会在任何时长改动后失步。带子与相机必须由同一个 <code>linePosition</code> 现算。</li><li><strong>压暗做成二值</strong>（只有当前整数行亮）——滑动那 0.26s 里画面在&quot;闪&quot;而不是在&quot;挪&quot;；压暗必须是 <code>1 − |i − linePosition|</code> 的连续量。</li><li><strong>匀速滑过所有行</strong>（没有 dwell）——读作&quot;代码在自动播放&quot;，观众等它播完而不听你讲。停顿式才是&quot;我念完这句了&quot;。</li><li><strong><code>transform-origin</code> 用了默认 <code>center</code></strong>——反解公式失效，镜头位置全错（且错得&quot;像 bug 但说不清哪儿不对&quot;）。必须 <code>0 0</code>。</li><li><strong>纯反解不加边界钳制</strong>——首行/末行时画幅被推出块外，白底舞台上就是大片空白。源码是深色背景所以看不出，这是移植必补的一段。</li><li><strong>块宽小于走读焦距下的可视宽</strong>（960/zoom）——横向钳制退化为居中，画幅两侧常年露白边，读作&quot;素材消失了&quot;。按 <code>960/zoom + 余量</code> 反推块宽。</li><li><strong>行用 <code>display: flex</code></strong>——flex 丢掉纯空白匿名子项，token 间空格与行首缩进全部消失（<code>export function</code> → <code>exportfunction</code>）。行必须是 block + <code>white-space: pre</code>。</li><li><strong>浅玻璃（半透明白）装代码</strong>——语法色在浅底上一律糊成粉笔字，四个锚点色全废。玻璃块内部必须深底。</li><li><strong>玻璃背后什么都没有</strong>（纯白舞台）——backdrop blur 没东西可糊，&quot;玻璃&quot;退化成&quot;半透明灰块&quot;。块背后必须有可糊的深色背景（源码用照片，本卡用等价的 CSS 渐变）。</li><li><strong>块宽收窄了但字号照抄源码的 18px</strong>——最长那行的行尾被切在块外（本卡实测踩到）。字号与块宽是硬耦合，按反推式复算。</li><li><strong>走读停在空行上</strong>——空行是排版不是一句话，停在那儿观众不知道在看什么。<code>stops</code> 要过滤空行（但插值仍连续经过它）。</li><li><strong>不收全景就结束</strong>——观众眼里只有片段，不知道这段代码整体长什么样。走读必须以全貌收尾，且<strong>同时解除压暗</strong>（只拉焦距不解压暗，全景还是暗的，等于没给全貌）。</li><li><strong>拿它读 30 行代码</strong>——走读时长直接爆到 20s。&gt;12 行要么裁到关键段，要么换 [evidence-scroll-tour](evidence-scroll-tour.md) 滚动浏览。</li><li>代码写 lorem 或伪代码——观众一眼看出是假的，&quot;这是真代码&quot;的说服力归零；写真实感短代码（能编译的那种）。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/glass-code-walk/index.html</code>。<strong>换代码只改 <code>CONFIG.code</code></strong>——分词、建行、行心、<code>stops</code>（空行过滤）、走读句数全部自动跟着走，不用手补任何坐标或时刻。</li></ul><p>  节奏在 <code>CONFIG.dwell</code> / <code>stepDur</code> / <code>pushDur</code> / <code>pullDur</code>；焦距 <code>CONFIG.zoom</code>（改了要按 <code>960/zoom</code> 复查块宽）；压暗深度 <code>CONFIG.dimFloor</code>；块几何 <code>blkL/blkT/blkW/blkH</code>（既推行心，也当相机钳制边界，CSS 的 <code>.ring</code> 要同步改）。   核心可摘走：<code>CONFIG</code> + <code>trackedRow()</code> + <code>apply()</code>（反解 + 钳制 + 带子 + 压暗，共二十来行）。</p><ul><li>换素材的最小流程：① 把素材四边填进 <code>blkL/blkT/blkW/blkH</code>；② 把&quot;当前项的 top / height / 行心 y&quot;写成一个按浮点序号求值的函数（不一定是代码行——列表项、表格行、清单条目都行）；③ 其余不动。<strong>只要能写出&quot;第 p 项的世界坐标&quot;这一个函数，本卡就能走读它。</strong></li><li>Remotion 移植（这就是源头）：<code>registry/remocn/glass-code-walk/index.tsx</code>（130 行）+ <code>registry/remocn/glass-code-block/index.tsx</code>（分词器 + 玻璃块视觉 + 逐行 <code>Sequence</code>）。</li></ul><p>  <strong>视觉是 1:1 照抄的</strong>（2026-08-25 用户定版：用源码原始视觉），连示例代码都是源码的 <code>DEFAULT_CODE</code>；   移植回 Remotion 时视觉部分直接用 <code>&lt;GlassCodeBlock&gt;</code>，只把走读那段换掉。   源码的 <code>linePosition = interpolate(frame, [0, scanEnd], [0, lineCount − 1])</code> 是<strong>匀速扫过所有行</strong>（含空行），   本卡改成&quot;停顿式 + 只停有内容的行&quot;——这是移植时最值得改的一处（匀速扫读的手感是机器在扫，不是人在读）。   秒 ↔ 帧换算（30fps）：源码 <code>staggerFrames 10</code> = 0.33s/行（本卡收到 0.08s）、<code>PULL_BACK_FRAMES 24</code> = 0.80s（本卡 0.85s）、<code>durationInFrames 150</code> = 5.0s、默认 <code>zoom 2.6</code> 是 deep-zoom 档（本卡走读档取 1.68）。   源码的 <code>ANCHOR_SCREEN_X 110</code> 把锚点钉在<strong>画面左侧 110px</strong> 而不是正中（配 deep-zoom 用），本卡走读档改成&quot;横向恒取块心&quot;。   源码用 <code>lineHeightOf(line)</code>（空行 <code>fontSize×0.8</code>、正常 <code>fontSize×1.55</code>）算行心，本卡等价地从 DOM 现量。   相机层用 <code>translate</code> + <code>scale</code> + <code>transformOrigin: &quot;0 0&quot;</code>（源码写法一致），移植时补上边界钳制。</p><ul><li>剪辑软件对应物：AE——代码块做成一张图/预合成，加一个空对象（Null）当&quot;当前行锚点&quot;、按念稿节奏给它打<strong>位置关键帧</strong>（每行一个，Easy Ease 双侧），摄像机或图层位置绑表达式 <code>W/2 − zoom × null.position[1]</code>；高亮带是一个矩形形状图层、位置绑同一个 Null（这样它和镜头天然同源）；压暗用一个反向遮罩的黑色调整层，不透明度跟着 Null 走。</li></ul><p>  剪映——只能手动逼近：代码块放大后按念稿节奏打一串&quot;位置&quot;关键帧 + 一个白色半透明色块当高亮带跟着打同样的关键帧（两串关键帧必须逐帧对齐，否则带子与镜头错开），压暗只能整体降亮度做不到逐行；<strong>行数多时不推荐</strong>。   Premiere——<code>Motion</code> 的 Position/Scale 关键帧同理，高亮带用一个 Graphic 图层。任何软件里&quot;高亮带与镜头必须同源&quot;这条都要靠<strong>同一个锚点驱动两者</strong>来保证。</p><ul><li>音效：逐行走读每次跳行给一记 <code>tick</code>（<code>vol</code> 0.30，<code>rate</code> 在 0.96~1.14 之间轮换——同一音色反复出现必须变调，否则读作机械循环）；块弹入一记 <code>whoosh</code>（<code>vol</code> 0.34、<code>rate</code> 1.05）；推近那一下一记 <code>lowpad</code>（<code>vol</code> 0.22、<code>dur</code> 0.6、<code>rate</code> 0.9）压住焦距变化；拉回全景一记 <code>whoosh</code>（<code>vol</code> 0.30、<code>dur</code> 0.8、<code>rate</code> 0.86，降调 = 收）。<strong>dwell 段无声</strong>——停顿是给口播的，不是给音效的。</li></ul><p>  cue 时刻由行数决定：<code>pushAt = leadIn + (行数−1)×lineIn + 0.26 + 0.10</code>，第 k 次跳行 = <code>pushAt + pushDur + dwell + (k−1)×(dwell + stepDur)</code>，拉回 = 最后一跳 + <code>stepDur + holdEnd</code>。<strong>改行数必须重算这串</strong>（10 行时是 1.40 / 2.27 起每 0.58 一跳 / 6.89 拉回）。</p><h3>动效范围</h3><ul><li>属于本卡的：<strong>浮点行号 <code>linePosition</code> 同时驱动相机与高亮带</strong>这条定义性纪律（同源 ⇒ 不可能失步）、行间线性插值（<code>lo</code>/<code>hi</code>/<code>p − lo</code> 混合行心）带来的&quot;滑过去而不是跳格&quot;、<strong>停顿式节奏</strong>（<code>dwell</code> 停 + <code>stepDur 0.26s</code> <code>power2.inOut</code> 滑，不是匀速传送带）、<strong>横向恒取块心不跟字符</strong>（读代码是整行读）这条取舍、压暗的<strong>连续量</strong>写法（<code>1 − |i − linePosition|</code>，带子在两行之间时上下同时半亮）、走读只停有内容的行而插值仍连续经过空行、反解公式 <code>tx = W/2 − zoom·cx</code>（<code>transform-origin: 0 0</code> 为前提）、把可视矩形关在块四边内的边界钳制（以及&quot;只 tween zoom 与 dimAmt、位移由钳制自动跟出&quot;这个便宜）、1.5~1.8x 的走读焦距区间与&quot;整行必须完整在画幅内&quot;这条验收标准、<strong>拉回 zoom=1 同时解除压暗</strong>的收尾一拍、块入场的&quot;位移先动 + 淡入独立窗&quot;错位、逐行落位的 0.08s 错峰、&quot;字号由块宽反推&quot;这条硬耦合（改块宽/焦距/行宽都要复算字号，否则行尾溢出块外）。</li><li>不属于本卡的：demo 那段示例代码的内容（= 源码 <code>DEFAULT_CODE</code>）、<code>scene.tsx</code> 这个文件名、600×440 这组几何与 17px 字号（但两者之间的<strong>耦合关系</strong>属于本卡）、高亮带的圆角与左侧 3px 亮条这个画法、&quot;代码&quot;这个题材本身（列表项、表格行、清单条目走读都成立）。</li></ul><p>  <strong>注意：玻璃块的视觉与 token 配色不是&quot;我们的设计&quot;而是 remocn 源码原样</strong>（<code>rgba(10,10,10,0.6)</code> + <code>blur(16px)</code>、1px 渐变描边、<code>0 50px 120px</code> 投影、40px chrome + macOS 三灯真色、<code>#a1a1aa</code> 标题、28px 行号槽 <code>#3f3f46</code>、五个 <code>TOKEN_COLORS</code>、暗调照片背景）——2026-08-25 用户定版要求按源码原始视觉走，所以复用时<strong>照抄这一整套</strong>，不要再各自改编（改编版曾把玻璃改成 <code>rgba(22,22,28,.74)</code> + 18px blur + 灰阶三灯 + 自选四色 + 三团灰阶软斑，已废弃）。</p><ul><li>迁移接口：<code>CONFIG.code</code> 是唯一的迁移入口——换成你真实要念的那 6~10 行，分词/建行/行心/空行过滤/走读句数全部自动重算（但<strong>行数变了要重算 sfx cue 的 t 串</strong>，公式见复用指引；<strong>最长行变长了要按反推式复算字号</strong>）；<code>dwell</code> 按口播语速给（他念完一句你才滑走，别让带子跑在解说前面）；<code>zoom</code> 按&quot;走读时行尾有没有被裁&quot;验收（不是按构图）——<strong>整行完整在画幅内是硬标准</strong>，改了 <code>zoom</code> 必须按 <code>960/zoom + 余量</code> 复查块宽、再按块宽复算字号；<code>dimFloor</code> 按&quot;周围行还读不读得出结构&quot;给；换素材只需重写&quot;第 p 项的世界坐标&quot;这一个函数；竖屏把块宽放到画幅宽度的 92%、行宽压到 28 字符以内、<code>zoom</code> 降到 1.4（竖屏字大，1.68 会裁行尾）。</li><li>底色要求：<strong>源码原始视觉 = 内容本身，2026-08-25 用户定版：按 remocn 源码原样实现</strong>。</li></ul><p>  舞台底是<strong>暗调背景</strong>（源码 <code>previewBackdrop</code> 是一张暖褐→墨绿的照片 <code>/bg.jpg</code>；demo 禁外网资源，用等价的 CSS 渐变复刻其色调分布），   <strong>不受&quot;白舞台中性化&quot;约束</strong>。两条理由都是硬的：① 玻璃块内部必须深底，语法色靠深底成立（浅玻璃上四个锚点色一律糊成粉笔字）；   ② <strong>块背后必须有可糊的东西</strong>——纯白背景下 backdrop blur 没有素材可揉，&quot;玻璃&quot;退化成&quot;半透明灰块&quot;，这张卡的招牌材质就没了。   落到实拍/深色画面上时舞台底可直接换成那段素材（比 CSS 渐变更好——真实素材被玻璃揉开时块内块外的对照更明显）；   换浅色背景则本卡不成立，要改用不带玻璃的代码块（高亮带走读那套机制本身与材质无关，可以单独搬）。</p><ul><li>与相邻卡的分工：<strong>vs [cursor-locked-zoom](cursor-locked-zoom.md)（同源机制的另一档）</strong>——两张共享同一条反解公式与&quot;镜头由内容进度驱动&quot;的纪律，但档位不同：那张是 2.6~2.8x <strong>deep-zoom 跟光标</strong>（锁 x 到字符、一屏只剩七八个字符、目标在<strong>逐字符</strong>移动），本卡是 1.5~1.8x <strong>逐行高亮走读</strong>（锁 x 到块心、整行完整可读、目标在<strong>逐行</strong>移动）+ 玻璃块 + 压暗。<strong>浅走读用这张、深怼镜头用那张</strong>：念一条长命令（横向长、单行）用那张，读一段多行代码（纵向长、每行一句话）用本张。<strong>vs [terminal-typing-log](terminal-typing-log.md)</strong>——那张是内容在动（逐行打出 + 滚动）、镜头不动；本卡是内容静止（一次铺完）、镜头与高亮在动。<strong>vs [evidence-scroll-tour](evidence-scroll-tour.md)</strong>——那张是长素材滚动浏览（量大、不逐句念），本卡是短素材逐句走读（量小、每行都念）。<strong>vs [focus-dim-spotlight](focus-dim-spotlight.md)</strong>——那张压暗聚焦但<strong>不动镜头也不换焦点</strong>（一次锁定一处），本卡的焦点在连续移动；只强调一处用那张。</li></ul>","gooey-morph":"<h3>意图</h3><p>2026-08-26 用户定版：这张卡原来叫<strong>粘液融字</strong>——四个色块飞入排成一条，然后走 goo 三段管线 （高斯糊 → alpha 阈值收紧 → 湍流位移）融化成四个字。现在<strong>只保留前半部分</strong>： 方块本身就是要展示的内容（图），拼完就是落点，不再融化成任何东西。</p><p>去掉后半段是对的，理由与机制有关：goo 管线的用途是&quot;色块换形成字&quot;， 它必须先把画面糊成一团 alpha 场才能重新收紧出硬边。而图是要看清内容的东西—— 把图糊掉再收紧，观众只会觉得这一拍渲染坏了。<strong>留下来的 L 形入场才是这张卡真正值钱的部分。</strong></p><p>于是它从&quot;字幕花字&quot;挪进了<strong>素材呈现</strong>类，和 <code>media-pop-in</code> / <code>motion-blur-slam-in</code> 排在一起。 三者的分工：<code>media-pop-in</code> 是<strong>歪着叠</strong>（三张各自带旋转、层层压住，读作&quot;一沓照片拍上桌&quot;）、 <code>motion-blur-slam-in</code> 是<strong>同向怼</strong>（带方向模糊高速甩入急停，读作&quot;怼到你脸前&quot;）、 本卡是<strong>并列拼</strong>（几张严丝合缝地拼成一条，读作&quot;这是一组，它们并列&quot;）。 要&quot;一组并列的证据&quot;就用本卡，要&quot;堆&quot;或&quot;砸&quot;用那两张。</p><p>命门两条： ① <strong>L 形路径</strong>——x 走前半程、y 走后半程，两轴分开。两轴同时走就是斜线飞入（普通 fly-in）， 拐点那一下&quot;到了自己的列、然后落进行位&quot;才是俄罗斯方块的手感； ② <strong>起飞时刻不按左右顺序</strong>（0 / 0.13 / 0.27 / 0.43s，第 2 张最先到、第 4 张最后到）—— 按顺序依次到位读作程序在循环刷 DOM，错开才读作&quot;各自从画外来&quot;。</p><h3>动效核心</h3><ul><li><strong>落位是算出来的，不是写死的</strong>：一条横排、整体居中于图区。</li></ul><p>  <code>整条宽 = count×picW + (count−1)×gap</code>，左端 = <code>(图区宽 − 整条宽)/2</code>，逐个累加。   <strong><code>count</code> 是唯一的&quot;几张图&quot;入口</strong>——单张宽以 <code>picW</code> 为上限，整条装不下时按图区可用宽自动等比收窄   （<code>picW = min(picW, ⌊(图区宽 − 2×sideMargin − gap×(count−1)) / count⌋)</code>，高按 <code>picAspect</code> 跟着收）。   所以 3 张到 6 张只改这一个数字，不会有任何一张被图区的 <code>overflow</code> 切掉</p><ul><li><strong>L 形路径</strong>：单张行程 1.0s，<code>k = ease(局部进度)</code>，然后</li></ul><p>  <code>kx = min(1, k×2)</code>（前半程走完 x）、<code>ky = max(0, k×2 − 1)</code>（后半程走完 y）。   于是同一条缓动同时描述两段，拐点自动落在 k=0.5</p><ul><li><strong>入场一律从图区右外侧来</strong>（<code>entryFrom</code> 的 x 全为正）：图区左边紧挨着数字人，</li></ul><p>  从左飞入会横穿人物身上、而且被 <code>overflow: hidden</code> 切掉半张。竖向偏移一半从上一半从下（±150 以上），   四张不同轨才不像同一个队列在排队</p><ul><li><strong>缓动 <code>cubic-bezier(0.88,0.14,0.12,0.86)</code></strong>（沿用源码 travelEase）：<strong>极陡的中段</strong>——</li></ul><p>  起手慢、中间猛、收尾稳。这是&quot;方块被吸到位&quot;的手感；匀速读作程序在拖元素，<code>power2.out</code> 读作滑行</p><ul><li><strong>一张图 = 白边 + 投影</strong>：与 <code>media-pop-in</code> 同一套&quot;实体素材&quot;物质约定（白边 4px + 柔投影）。</li></ul><p>  demo 里的灰阶假图（日 + 远近两座山的极简剪影）是占位，接应用时整块换成 <code>&lt;img&gt;</code></p><ul><li><strong>实现是逐帧求值</strong>：一条线性虚拟时钟 tween + <code>frameAt(t)</code>（位置是 t 的纯函数），</li></ul><p>  与 Remotion 的 <code>useCurrentFrame</code> 同构 —— seek / 慢放 / 重播全部一致</p><ul><li><strong>层级</strong>：白底舞台 → 人物列（47%）→ 图区（右 53%，<code>overflow: hidden</code>）→ 各张图（唯一被 transform 的元素）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>count</code></td><td>4（3~6）</td><td><strong>唯一的张数入口</strong>，宽度自动适配；3 张下&quot;拼成一条&quot;的并列感最强，6 张单张只剩 70px 宽、内容开始看不清，&gt;6 张请改成两行网格（那不是这张卡）</td></tr><tr><td><code>gap</code></td><td>5px</td><td>张间缝；<strong>小缝才读作&quot;拼成一条&quot;</strong>，&gt;20px 就是几张各自摆着（要那个效果用 media-pop-in）</td></tr><tr><td><code>travel</code></td><td>1.0s</td><td>单张行程；&lt;0.5s 读作弹窗，&gt;1.6s 观众等着方块走完</td></tr><tr><td><code>entryAt</code> 错峰</td><td>0 / 0.13 / 0.27 / 0.43s</td><td>各张起飞时刻，<strong>故意不按左右顺序</strong>；全部同时 = 一次整体平移，按顺序 = 程序循环感</td></tr><tr><td><code>entryFrom</code></td><td>x 300~500（<strong>必须为正</strong>）/ y ±175~195</td><td>起手位相对落位的偏移；x 给负值会让图横穿人物并被切掉；\\</td><td>y\\</td><td>&lt;100 看不出&quot;落进行位&quot;这一下</td></tr><tr><td><code>picW</code> / <code>picAspect</code></td><td>106px / 0.755</td><td>单张宽的上限与高宽比；4:3 略扁读作照片，1:1 读作色块（那就回到原来的&quot;色块&quot;语义了）</td></tr><tr><td><code>sideMargin</code></td><td>34px</td><td>整条两侧至少留的余白，同时是自动收窄的依据；调到 0 则末张紧贴图区边缘、读作没排版</td></tr><tr><td><code>hold</code></td><td>1.4s</td><td>收尾定格——拼好的一条就是本卡的落点，&lt;0.8s 观众来不及看完几张图</td></tr></table><h3>已知坑</h3><ul><li>两轴同时走（x/y 一条 tween）——变成斜线飞入，就是最普通的 fly-in，L 形拐点那一下的&quot;方块感&quot;全部消失。</li><li>各张按左到右依次起飞——读作程序在循环刷 DOM。错峰顺序必须打乱。</li><li><code>entryFrom</code> 给负 x 让图从左侧飞入——图会横穿数字人身上，而且被图区 <code>overflow</code> 切掉半张。一律从右外侧进场。</li><li>张间缝按&quot;看起来舒服&quot;给 20~40px——&quot;拼成一条&quot;的并列语义没了，变成几张各自摆着。缝要 ≤8px。</li><li>改 <code>count</code> 却手动写死 <code>picW</code>——整条撑破图区，末张被 <code>overflow</code> 无声切掉（本 demo 踩过：count=6 时两端各切掉半张）。宽度交给自动适配。</li><li>缓动用匀速或 <code>power2.out</code>——匀速读作程序在拖元素，<code>power2.out</code> 读作滑行；要的是陡中段的&quot;被吸到位&quot;。</li><li>给图加旋转让它&quot;活泼一点&quot;——那是 <code>media-pop-in</code> 的语义（歪着叠）。本卡的全部意义是<strong>并列整齐</strong>，一歪就没有&quot;这是一组&quot;了。</li><li>拿它当转场用（上一镜的图拼成下一镜）——本卡作用在一个镜头内部，是素材入场；跨镜头换形态用 <code>particle-weld-transition</code>。</li><li>一片里反复用——并列拼是&quot;摆证据&quot;的动作，同一段口播里出现两次，观众会以为前面那组还在。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/gooey-morph/index.html。<strong>换张数只改 <code>CONFIG.count</code></strong>（宽度自动适配）；</li></ul><p>  换内容把 <code>.gm-pic</code> 内部那三个灰阶 div 整块换成 <code>&lt;img&gt;</code>（白边与投影留着——那是&quot;实体素材&quot;的语义）。   节奏只动 <code>travel</code> 与 <code>entryAt</code>。<code>cubicBezier()</code> 是通用缓动解算器，可直接抄走。   结构是&quot;一条线性虚拟时钟 tween + <code>frameAt(t)</code> 逐帧求值&quot;，所以 seek / 慢放 / 重播一致。</p><ul><li>Remotion 移植：位置是纯函数，原样搬——</li></ul><p>  <code>const k = Easing.bezier(0.88,0.14,0.12,0.86)(clamp((frame - startF)/travelF))</code>，   再 <code>kx = min(1, k*2)</code>、<code>ky = max(0, k*2-1)</code>，<code>x = lerp(fromX, restX, kx)</code>、<code>y = lerp(fromY, restY, ky)</code>。   秒↔帧（30fps）：错峰 0/0.13/0.27/0.43s = 0/4/8/13 帧、行程 1.0s = 30 帧。   源码 <code>registry/remocn/gooey-morph/index.tsx</code> 的 <code>barRestPositions</code> / <code>barStartPositions</code> /   <code>barEntryFrames</code> 三个 props 与本卡一一对应，<strong>但它后半段的 goo 滤镜链本卡已不用</strong>（连同 <code>morphStartFrame</code> 等参数一起去掉）。</p><ul><li>剪辑软件对应物：剪映/CapCut——每张图两段位置关键帧（先横后竖），缓动手动拉成陡中段；</li></ul><p>  AE——位置属性打三个键（起手 / 拐点 / 落位），把拐点键的 x 设成落位 x、y 还是起手 y，就是 L 形；   几张图错开起始帧即可。这张卡在剪辑软件里最好做，因为它没有滤镜、只有位移。</p><ul><li>与本类同伴的分工见「意图」段：<code>media-pop-in</code> 歪着叠 / <code>motion-blur-slam-in</code> 同向怼 / 本卡并列拼。</li></ul><p>  三者<strong>不在同一段口播里混用</strong>（三套素材入场逻辑打架）。</p><h3>动效范围</h3><ul><li>属于本卡的：L 形路径（x 走前半程、y 走后半程，拐点在缓动进度 0.5）这条机制；起飞时刻故意不按左右顺序的错峰（0/0.13/0.27/0.43s）；<code>cubic-bezier(0.88,0.14,0.12,0.86)</code> 的陡中段；落位按张数自动算成&quot;一条横排、整体居中、张间缝 ≤8px&quot;（含装不下时按图区等比收窄单张宽）这条排版纪律；入场一律从图区外侧（远离人物那一侧）进场；白边 + 投影的&quot;实体素材&quot;物质约定；拼完即落点、不做任何后续形变这条时间纪律。</li><li>不属于本卡的：demo 里的灰阶假图内容（日 + 两座山的剪影）、<code>count = 4</code> 这个具体张数、单张 106×80 这个尺寸、主持人占位与&quot;人物左 47% / 图区右 53%&quot;的布局、图区的具体余白值。</li><li>迁移接口：<code>count</code> 是唯一的张数入口（3~6，宽度自动适配）；换素材替换 <code>.gm-pic</code> 内部内容；<code>entryFrom</code> 的 x 符号由&quot;人物在哪一侧&quot;决定（人物在左 ⇒ x 为正从右进；人物在右 ⇒ x 为负从左进）；<code>travel</code> / <code>entryAt</code> 按口播语速缩放；<code>picW</code> 按输出宽度等比缩放，<code>gap</code> <strong>不要</strong>跟着放大（缝一放大就散成几张各自摆着）。</li><li>底色要求：白底即可。深底把 <code>.gm-pic</code> 的白边换成深色描边（或直接去掉边、只留投影）；本卡没有任何滤镜，不依赖底色的色彩空间。</li></ul>","logo-enter":"<h3>意图</h3><p>收尾是全片最容易做俗的一拍：logo 旋转飞入、光晕扫过、粒子炸开——观众看过一万次， 且它们都在抢戏（片尾的职责是&quot;落幕&quot;，不是&quot;再来一个高潮&quot;）。</p><p>remocn 的 <code>logo-enter</code> 给出的做法很克制：一个 spring 同时驱动三件事 （<code>opacity 0→1</code> / <code>scale 0.5→1</code> / <code>y 22px→0</code>），damping 13 / stiffness 130 / mass 0.8， 约 0.60s 落定、过冲仅 4%。没有旋转、没有发光、没有第二个方向的运动。 本卡把它的骨架（spring 手感 + 0.233s 拍距）搬过来，把源码的&quot;一串同级圆牌错峰弹入&quot; 换成口播片的标准收尾编排：<strong>圆牌 → 字标 → 描环合拢</strong>三拍。</p><p>命门三条： ① <strong>只有第一拍有过冲</strong>——圆牌是唯一带弹性的元素（<code>back.out(1.1)</code> ≈ spring 的 4% 过冲）。 字标和描环都是纯缓出。给字也加弹跳，两个弹性元素互相抢，收尾就变成了开场； ② <strong>拍距 0.233s（源码 stagger 7 帧）</strong>——三拍不能同时发生（读作一张贴图淡入）， 也不能拉到 0.5s 以上（读作三件无关的事依次发生）。0.2~0.25s 是&quot;一件事的三个部分&quot;的距离； ③ <strong>落定即终帧，不加 idle 微动</strong>——收尾画面就该停住。这里是全库少数明确<strong>不要</strong>呼吸/漂移的地方 （hold 期微动是防止画面死掉，但片尾的&quot;死&quot;正是它要的效果）。</p><p>白底适配的一处改动：源码圆牌是 <code>border: 5px solid #fff</code> + <code>boxShadow 0 20px 48px rgba(0,0,0,0.5)</code> （深底上靠亮度分层）。白底上白环会消失、那层重投影会糊成一团脏斑， 改成浅灰环 <code>#ececef</code> + 轻投影 <code>0 10px 26px rgba(0,0,0,0.10)</code>。</p><h3>动效核心</h3><ul><li><strong>第①拍 · 圆牌弹入</strong>（<code>lead = 0.35s</code> 起）：三件事同一条曲线——</li></ul><p>  <code>opacity 0→1</code>、<code>scale 0.5→1</code>、<code>y 22px→0</code>，0.60s，<code>back.out(1.1)</code>。   三个属性共用一条曲线是源码的写法（同一个 spring 值驱动三者），   分开给不同缓动会让&quot;弹到位&quot;散成三件事   - <strong>spring → GSAP 换算</strong>：源码 <code>spring({damping:13, stiffness:130, mass:0.8})</code> @30fps     ≈ 18 帧（0.60s）落定、峰值过冲约 +4%。GSAP core 无 spring，<code>back.out(1.1)</code> 的过冲量与之对齐。     <code>back.out(1.7)</code>（本库 <code>media-pop-in</code> 用的值）过冲 ~10%，在收尾场景读作综艺感</p><ul><li><strong>第②拍 · 字标推出</strong>（<code>lead + 0.233s</code>）：品牌名 <code>opacity 0→1</code> + <code>x −20px→0</code>，0.45s，<code>power3.out</code>；</li></ul><p>  副行再错峰一拍（<code>lead + 0.466s</code>）同样参数。   横向位移方向是&quot;从圆牌一侧推出&quot;（圆牌在左则字向右推），读作字是被圆牌带出来的   - 两档字重（品牌名 800 / 副行 500）+ 副行大字距——这是版式，不是动效，但错峰的<strong>顺序</strong>是动效：     重的先来、轻的后到</p><ul><li><strong>第③拍 · 描环合拢</strong>（<code>lead + 0.233s</code>，与字标同时起）：一圈 2px 细线沿圆牌外缘</li></ul><p>  <code>stroke-dashoffset</code> 从全长走到 0，0.70s，<code>power2.inOut</code>（起笔快、合拢那一下停住；   匀速读作 loading 圈）。起笔在 12 点（<code>rotate(-90deg)</code>）   - <strong><code>dasharray</code> 取周长 + 3px</strong>：恰等于周长时首尾在起笔点留一道亚像素白缝，1080p 下一眼可见   - 描环与字标<strong>同时起、更慢收</strong>（0.70s vs 0.45s）——它是把三拍&quot;收口&quot;的那条线，     最后落定的应该是它</p><ul><li><strong>层级</strong>：白底 → 圆牌（底色 + 灰环 + 轻投影）→ logo 图形（占圆牌 52%，源码比例）→ 描环（绝对定位盖在圆牌上）→ 字标（同级，flex 右侧）</li><li><strong>不做的事</strong>：不旋转、不发光、不加粒子、不给 logo 单独的入场（logo 跟着圆牌一起弹，</li></ul><p>  它不是独立的主体）、落定后不呼吸</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>lead</code></td><td>0.35s</td><td>起手静置，等口播说到&quot;我是…&quot;；0 则像自动播放的片头，&gt;1s 观众以为卡了</td></tr><tr><td><code>badgeDur</code></td><td>0.60s</td><td>圆牌弹入（= spring 落定时长）；&lt;0.35s 读作弹窗，&gt;0.9s 弹性感被拉散成缓慢放大</td></tr><tr><td><code>badgeFrom</code></td><td>0.5</td><td>起始缩放（源码值）；0.8 以上行程太短看不出弹，&lt;0.3 读作从远处飞来（那是开场不是收尾）</td></tr><tr><td><code>badgeRise</code></td><td>22px</td><td>起始下沉（源码值）；0 = 纯缩放（少一层&quot;落定&quot;），&gt;50px 读作从画外飞入</td></tr><tr><td><code>badgeEase</code></td><td><code>back.out(1.1)</code></td><td>过冲 ~4%，对齐源码 spring(13/130/0.8)；<code>back.out(1.7)</code> 过冲 10% 读作综艺感，<code>power3.out</code> 无过冲则收尾&quot;软&quot;</td></tr><tr><td><code>stagger</code></td><td>0.233s</td><td>拍距（源码 7 帧）；0 = 三拍同时发生（读作一张贴图淡入），&gt;0.5s 读作三件无关的事</td></tr><tr><td><code>wordDur</code></td><td>0.45s</td><td>字标推出；比圆牌快是对的（跟随者不该比主体慢）</td></tr><tr><td><code>wordShift</code></td><td>20px</td><td>字标横向推出距离；0 = 纯淡入（丢掉&quot;被带出来&quot;的关系），&gt;50px 读作字从画外滑进来、与圆牌无关</td></tr><tr><td><code>ringDur</code></td><td>0.70s</td><td>描环合拢；必须<strong>比字标慢</strong>（它是收口的那条线，最后落定）；&lt;0.4s 读作 loading 转圈</td></tr><tr><td><code>hold</code></td><td>1.30s</td><td>收尾定格；片尾可拉到 2~3s（配片尾音乐尾巴），<strong>期间不加任何微动</strong></td></tr></table><h3>已知坑</h3><ul><li>给字标也加 <code>back.out</code> 弹跳——两个弹性元素互相抢，收尾变成开场；过冲只给圆牌一个。</li><li>三拍同时发生（<code>stagger</code> 给 0）——读作一张做好的 logo 图片淡入，编排白做。</li><li>描环用匀速（<code>ease:none</code>）——读作 loading 进度圈，观众以为在等加载；合拢那一下必须减速停住。</li><li>描环比字标先落定——收口的线先没了，最后落定的是字，三拍的收束感散掉。</li><li><code>dasharray</code> 恰等于周长——首尾在起笔点留一道亚像素白缝，1080p 下一眼可见（本 demo 踩过）；给周长 + 3px。</li><li>白底上照搬源码的白环 + <code>rgba(0,0,0,0.5)</code> 重投影——环消失、投影糊成脏斑；改浅灰环 + 轻投影。</li><li>给 logo 单独加入场（logo 自己再缩放/描线一次）——它不是独立主体，跟着圆牌一起弹；单独动会读作两个 logo。</li><li>落定后加呼吸/漂移微动——片尾的&quot;停住&quot;是它的效果，加了就成了&quot;还没结束&quot;。这是全库少数不要 idle 的地方。</li><li>加旋转/发光/粒子——三样都是收尾最俗的做法，且都在抢戏（片尾的职责是落幕）。</li><li>logo 图形填满圆牌——源码的 52% 是留白比例，填满后圆牌读作一个按钮而不是徽标底座。</li><li>一片里用 3 次以上——它是身份标识，开头一次、结尾一次足够；中间反复出现读作水印。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/logo-enter/index.html。<strong>替换成自己的 logo</strong>：把 <code>.badge</code> 里那段</li></ul><p>  <code>&lt;svg viewBox=&quot;0 0 100 100&quot;&gt;…&lt;/svg&gt;</code> 整段换掉（demo 里是灰阶几何占位标：三角 + 挖圆）。   换品牌文案改 <code>.brand</code> / <code>.tag</code> 两行；节奏全在顶部 <code>CONFIG</code>。   三拍各自独立——不要描环就删第③拍（<code>ring</code> 那一段），不要副行就删 <code>tag</code> 那一 tween。</p><ul><li>Remotion 移植：源码 <code>registry/remocn/logo-enter/index.tsx</code>。它的核心可直接用——</li></ul><p>  <code>spring({fps, frame: frame*speed − i*stagger, config:{damping:13, stiffness:130, mass:0.8}})</code>   一个值驱动 <code>opacity: s</code> / <code>scale: interpolate(s,[0,1],[0.5,1])</code> / <code>offset: interpolate(s,[0,1],[22,0])</code>。   秒↔帧（30fps）：静置 0.35s = 10.5 帧、圆牌 0.60s = 18 帧（spring 自然落定，不用给 duration）、   拍距 0.233s = 7 帧、字标 0.45s = 13.5 帧、描环 0.70s = 21 帧。   <strong>本库化要改三处</strong>：环色 <code>#fff → #ececef</code>、投影 <code>rgba(0,0,0,0.5) → rgba(0,0,0,0.10)</code>、   源码的 <code>logos[]</code> 多牌重叠（<code>overlap 38</code>）不用——本卡是单牌 + 字标。   描环在 Remotion 侧用 <code>strokeDasharray={len} strokeDashoffset={interpolate(frame,[a,b],[len,0])}</code>。</p><ul><li>剪辑软件对应物：剪映/CapCut——logo 素材用&quot;弹入&quot;入场动画（缩放 + 位移，把回弹调到最弱一档），</li></ul><p>  字标另起一层用&quot;向右滑入&quot;，描环用圆形贴纸的&quot;描边生长&quot;或直接用一段圆环 MG 素材；   AE——logo 层 Scale/Position/Opacity 三条键都挂同一个 <code>Overshoot</code> 表达式   （或 RubberHose/Motion 插件的 spring），描环用 Shape Layer + <code>Trim Paths</code> 的 End 关键帧，   拍距按 7 帧摆。<strong>别用</strong> CC Light Sweep / Shine 那类扫光（本库 design-defaults 禁 glow）。</p><ul><li>与本类其余卡的分工：<code>media-pop-in</code> / <code>motion-blur-slam-in</code> 是<strong>证据素材</strong>的入场（要歪、要叠、要密，</li></ul><p>  强调&quot;啪啪啪甩上来&quot;）；本卡是<strong>身份标识</strong>的入场（要正、要单、要停住，强调&quot;这是谁&quot;）。   两者的过冲量差一倍不是巧合——甩证据要 10%，立品牌只要 4%。</p><h3>动效范围</h3><ul><li>属于本卡的：一个 spring 值同时驱动 <code>opacity/scale/y</code> 三属性这条写法（及其 <code>back.out(1.1)</code> ≈ 4% 过冲的换算）；<code>0.5 → 1</code> 缩放 + <code>22px → 0</code> 下沉的行程量；0.233s 拍距的三拍编排（圆牌 → 字标 → 描环）与&quot;重的先来轻的后到&quot;的顺序；<strong>过冲只给第一拍</strong>这条纪律；字标从圆牌一侧横推 20px 表达&quot;被带出来&quot;的关系；描环 <code>dashoffset</code> 全长→0、<code>power2.inOut</code>、且比字标更慢收（最后落定的是它）；<code>dasharray</code> = 周长 + 3px 的接缝处理；logo 占圆牌 52% 的留白比例；<strong>落定即终帧、不加 idle 微动</strong>这条取舍；白底上环色与投影的改法。</li><li>不属于本卡的：demo 的灰阶几何占位标（<strong>应用时替换成自己的 logo</strong>）、示例品牌名「知远研究所」与副行文案、圆牌尺寸 118px 与字号 46/17px、圆牌底色 <code>#f5f5f7</code> 与环色 <code>#ececef</code> 的具体取值、logo 在左字标在右这个左右关系（镜像也成立）、<code>gap: 26px</code> 的间距。</li><li>迁移接口：logo 换 <code>.badge</code> 内的 SVG（或换成 <code>&lt;img&gt;</code>，保持 52% 占比）；圆牌尺寸改 <code>.badge</code> 的 <code>width/height</code>（描环 <code>.ring</code> 要同步 +10px 并重算 <code>viewBox</code>）；<code>badgeRise</code> / <code>wordShift</code> 是<strong>手感常量，换画幅不要等比放大</strong>（它们是&quot;落定&quot;的量级，不是相机的量级）；<code>stagger</code> / <code>badgeEase</code> / 三拍顺序不要改（那是本卡的全部）；片尾想拉长只改 <code>hold</code>。竖屏把 lockup 改成上下排（<code>flex-direction: column</code>），字标的推出方向同步改成纵向。</li><li>底色要求：白底/浅底即可（圆牌靠浅灰环 + 轻投影分层，描环与字标是深色）。深底改回源码做法——环色换白、投影加重到 <code>rgba(0,0,0,0.5)</code>、描环与字标换浅色；三拍的时序参数全部不变。</li></ul>","motion-blur-slam-in":"<h3>意图</h3><p><strong>2026-08-26 用户定版：本卡是配合数字人的一卡</strong>（原来的 demo 是左右分屏的 &quot;对照组普通淡入 vs 本卡甩入&quot;教学版）。这张卡的用法本来就是口播念到爆点时把素材怼上来， 观众看的是&quot;人在说 + 素材砸到他旁边&quot;；分屏对照是讲课用的，不是它在片子里的样子。 对照组那半屏也正好是人物要站的位置——于是人物占左 46%，素材从右侧净白区的外侧甩进来。</p><p>同样是&quot;把素材压上来&quot;，弹跳入场（media-pop-in）是&quot;啪&quot;地拍上桌，带着手作与俏皮； 甩入急停是&quot;咣&quot;地怼到你脸前，带着速度与压迫。口播念到爆点、要观众瞬间闭嘴看图时用它。 命门三条：<strong>模糊必须有方向</strong>（各向同性的 <code>blur()</code> 读作失焦，不是速度）、 <strong>模糊量跟着速度走且停住那一帧必须归零</strong>（停住还糊 = 渲染没算完的 bug 感）、 <strong>停要真急停</strong>（power4/expo.out 的强减速；power2.out 读作&quot;滑进来&quot;，气质立刻软掉）。</p><h3>动效核心</h3><ul><li>元素：素材卡（截图/数据卡），一层轻投影把它与白底分开（投影让拖影更可读，但投影本身不是本卡动效）</li><li><strong>飞入方向要背着人物</strong>：人物在左 ⇒ 素材从右外侧进场。朝着人物飞会横穿人物身上，</li></ul><p>  而且素材区的 <code>overflow: hidden</code> 会把越界那半张切掉</p><ul><li>位移：沿单一直线从舞台外飞入，行程 ≥ 半屏（560px 级），0.2s，<code>power4.out</code>——快起 + 强减速 = 撞停手感</li><li>方向模糊：SVG <code>feGaussianBlur stdDeviation=&quot;σ 0&quot;</code>（只糊横向 = 有方向），σ 由<strong>速度</strong>驱动：</li></ul><p>  <code>σ = blurMax * (1 - p)^0.75</code>（p 为位移的<strong>已缓动</strong>进度，指数 0.75 是 power4.out 的速度衰减律）——   一条 tween 同时驱动位移与模糊，天然对齐，不会出现&quot;停住还糊&quot;</p><ul><li>落位过冲：飞入终点先多冲 2~3px（沿运动方向），再 0.1s <code>power2.out</code> 回正——一帧级的&quot;顶到底&quot;回弹，不是 back.out 大弹跳</li><li>多卡连发：同方向、间隔 0.3~0.5s，后来者层级更高压前者一角（20~30%）；方向一律统一，才读作&quot;一沓一沓怼上来&quot;</li><li>层级：底 UI/人物 &lt; 先到的卡 &lt; 后到的卡；模糊滤镜只挂在卡本体上，不要连着背景一起糊</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>fromX</code></td><td>560px（≥ 半屏）</td><td>屏外起始距离 = 速度累积；&lt;200px 像&quot;挪了一下&quot;，模糊无处发生；过大则前几帧完全在屏外，观感等于凭空出现</td></tr><tr><td><code>slam</code></td><td>0.2s</td><td>0.15~0.25 是&quot;甩&quot;的窗口；&gt;0.35s 变成平移滑入，凌厉感消失；&lt;0.12s 观众只看到结果，看不到过程</td></tr><tr><td><code>slamEase</code></td><td><code>power4.out</code></td><td>急停的命；<code>expo.out</code> 更狠，<code>power2.out</code> 读作滑入，<code>linear</code> 读作程序在拖动元素</td></tr><tr><td><code>blurMax</code></td><td>18（240~300px 宽的卡）</td><td>起点横向 σ，视觉拖影约 2~3σ；&gt;25 糊成一团云雾看不出是什么素材，&lt;8 等于没做模糊</td></tr><tr><td><code>blurFalloff</code></td><td>0.75</td><td>模糊随速度衰减的指数；调小（0.4）模糊拖得更久更狠但容易&quot;停住还糊&quot;，调大（1.5）模糊几乎只闪一帧</td></tr><tr><td><code>overshoot</code></td><td>3px</td><td>到位过冲；0 则收尾发死，&gt;8px 变成回弹入场（那是 media-pop-in 的气质）</td></tr><tr><td><code>settle</code></td><td>0.1s</td><td>过冲回正耗时；&gt;0.2s 回正被看成第二段运动，&quot;一帧顶到底&quot;的脆感就没了</td></tr><tr><td><code>burst</code></td><td>0.4s</td><td>多卡连发间隔；&lt;0.2s 观众数不清几张，&gt;0.6s 断成两个独立事件</td></tr></table><h3>已知坑</h3><ul><li>用 <code>filter: blur(Npx)</code> 整体糊——各向同性模糊一眼读作失焦/景深，完全读不出运动方向，白做。</li><li>模糊没在停住那一帧归零（或干脆全程挂着 σ&gt;0）——静止画面还带拖影，观众读作渲染没算完的脏帧。</li><li>缓动用 <code>power2.out</code> 或匀速——变成&quot;素材平移滑入&quot;，跟廉价模板转场同类；急停必须是 power4/expo 级强减速。</li><li>过冲给到 8px 以上或用 <code>back.out(1.7)</code>——气质切回弹跳入场，这张卡与 media-pop-in 就没有区别了。</li><li>多卡各飞各的方向（一张从左、一张从上）——读作&quot;随便加了几个入场特效&quot;；同方向连发才有&quot;一沓怼上来&quot;的势。</li><li>模糊连着背景/人物一起糊——变成整屏运动模糊转场，素材本身失去主角地位。</li><li>飞入距离只有一两百 px——没有速度累积，模糊没地方发生，最后只是个位移淡入。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/motion-blur-slam-in/index.html。方向模糊 = <code>&lt;defs&gt;</code> 里每张卡一个 <code>feGaussianBlur stdDeviation=&quot;σ 0&quot;</code> 滤镜（卡上 <code>data-mb=&quot;mbA&quot;</code> 指过去），<code>setSigma()</code> 负责写 σ 并在 σ→0 时把 <code>filter</code> 摘成 <code>none</code>；节奏与手感全在顶部 <code>CONFIG</code>（<code>fromX</code>/<code>slam</code>/<code>slamEase</code>/<code>blurMax</code>/<code>blurFalloff</code>/<code>overshoot</code>/<code>settle</code>/<code>burst</code>）。换素材把 <code>.shot</code> 内部整块换成 <code>&lt;img&gt;</code> 即可；换方向把 <code>fromX</code> 换成 y 通道并把 σ 写成 <code>&quot;0 σ&quot;</code>（竖向甩入）。</li><li>Remotion 移植：<code>const p = interpolate(frame, [f0, f0 + slamF], [0, 1], {easing: Easing.out(Easing.poly(4)), extrapolateRight: 'clamp'})</code>，位移 <code>translateX(${fromX * (1 - p) - overshoot * p}px)</code>，模糊 <code>σ = blurMax * Math.pow(1 - p, 0.75)</code> 写进同一 composition 里的 <code>&lt;svg&gt;&lt;filter&gt;</code> 的 <code>stdDeviation={</code>${σ} 0<code>}</code>（或用 <code>filter: url(#mb)</code> 的 style）；过冲回正另起一段 <code>interpolate(frame, [f0+slamF, f0+slamF+settleF], [-overshoot, 0], {easing: Easing.out(Easing.quad)})</code>。多卡就是 <code>f0 = start + i * burstF</code>。σ 到 0 时把 style.filter 置空，避免整帧走一遍无用滤镜。</li><li>剪辑软件对应物：剪映——&quot;入场动画→甩入/向左滑动&quot;缩到 6~7 帧，再叠&quot;运动模糊/拖影&quot;特效（或复制两层降透明度做残影）；AE——位置关键帧 + Easy Ease 后拉曲线成急停，开图层 Motion Blur（或 ReelSmart/CC Force Motion Blur / Directional Blur 关键帧）；CapCut——&quot;Slide in&quot; + Motion Blur 效果，快门角度调大。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：卡片沿单一直线从屏外飞入（行程 ≥ 半屏、0.15~0.25s、power4.out 强减速急停）；<strong>方向性</strong>模糊 σ 由位移的已缓动进度驱动 <code>σ = blurMax * (1 - p)^0.75</code> 并在停住那一帧归零；落位 2~3px 同向过冲 + 0.1s power2.out 回正；多卡同方向连发 0.3~0.5s 间隔与&quot;后来者压前者一角&quot;的层级堆叠。</li><li>不属于本卡的：demo 里的灰阶假截图内容与排版、卡片的具体落位坐标与尺寸、投影与描边样式（投影只是让拖影更可读的演示选择）、主持人数字人占位与&quot;人物左 46% / 素材区右 54%&quot;这个布局比例（<strong>但&quot;配合数字人&quot;这条语境属于本卡</strong>——见「意图」段）。</li><li>迁移接口：<code>fromX</code> 按输出宽度等比缩放（保持&quot;≥ 半屏&quot;，且方向要背着人物那一侧），<code>blurMax</code> 按卡片宽度等比缩放（240~300px 卡用 18，翻倍尺寸就翻倍 σ）；换飞入方向 = 换位移通道 + 把 σ 写到对应轴（<code>&quot;0 σ&quot;</code> 为竖向）；<code>slam</code>/<code>burst</code> 按口播语速缩放，缩放时 <code>slam</code> 与 <code>settle</code> 要同比例，否则脆感会变；配色/字体/投影全部可换，动效不依赖任何颜色。</li><li>底色要求：白底即可。唯一约束是滤镜要设 <code>color-interpolation-filters=&quot;sRGB&quot;</code>，否则默认 linearRGB 会让模糊边缘在白底上出现发灰的脏边；深底同样成立（深底上拖影更明显，可把 <code>blurMax</code> 下调 20%）。</li></ul>","pencil-sketch-draw":"<h3>意图</h3><p>截图和图表是&quot;给你看结论&quot;，手绘是&quot;带你走过程&quot;——观众会跟着笔尖预测下一笔，注意力被押着走。 做对的命门：① 笔尖必须真的骑在路径上（不是线自己长出来）；② 描画速度要有起收笔的快慢，匀速像 loading。 本库定版：<strong>不做 line boil / 定格抖动</strong>（用户偏好，见 design-language.md §4 运动 token 附注）。 手绘感由笔迹形状本身（歪斜、弧度）与铅笔跟随表达；画面的&quot;活&quot;交给全局系统（相机漂/环境呼吸），不靠线抖。</p><h3>动效核心</h3><p>SVG path + <code>pathLength=100</code> + <code>strokeDashoffset</code> 从 100 减到 0 做描画；同帧用 <code>@remotion/paths</code> 的 <code>getPointAtLength(d, len*p)</code> 取路径上的点，把铅笔组 translate 到该点，<code>rotate(握笔角)</code> 给倾角。 笔具用<strong>手握铅笔实拍素材（绿幕抠像透明 PNG，笔尖锚定局部原点）</strong>——一只右手握黄色六棱铅笔的照片， 比矢量笔多给&quot;有人在画&quot;的临场感（手指关节、指甲、皮肤纹理是矢量补不出来的）。 关键是把照片对齐到与矢量笔相同的坐标契约：<strong>石墨尖 = 局部原点 (0,0)，笔身朝 −Y 生长</strong>。 三层嵌套完成对齐：外层 <code>&lt;g&gt;</code> 由 <code>placePencil</code> 写 translate+rotate+scale ／ 内层 <code>&lt;g&gt;</code> 固定 <code>rotate(−axisDeg)</code> 把素材里斜着的笔轴掰正到 −Y ／ <code>&lt;image&gt;</code> 用 <code>x=−tipX, y=−tipY</code> 把笔尖像素挪到原点。 于是 translate 到生长点即等于笔尖零偏移落点，倾角完全交给外层 rotate，改缩放/改倾角都不会让笔尖脱离笔迹。 笔身角 = 固定握笔角 <strong>+42°</strong>（实拍是右手、笔身朝右上，手落在笔迹右上方，符合右手书写遮挡关系） + <code>follow</code> × 行进切线的竖直分量（转弯轻微跟随，合成角始终落在 +37°~+47°）。 画完（p≥1）后铅笔<strong>沿笔身轴向</strong>抬离 26px 并淡出（不是平移，才像被&quot;提起来&quot;）；<code>keepPencil</code> 可让笔留在纸上。 （<code>template/components/pencil.tsx</code> 里仍保留纯矢量铅笔：同一套原点契约，需要无实拍依赖/可换色时用它。）</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>dur</td><td>24 帧</td><td>调小=速写感；&gt;40 帧观众等得着急</td></tr><tr><td>width</td><td>5px</td><td>铅笔线 4~6；马克笔感调到 8+ 并换色</td></tr><tr><td>pencilScale</td><td>0.5（实拍 640px 高素材）</td><td>手+笔占屏高 55~65% 最稳；&lt;0.4 手小得没有临场感，&gt;0.6 手会盖住已画的线</td></tr><tr><td>tilt（握笔角）</td><td>+42°（实拍右手）</td><td>出 +37°~+47° 就不像手写：太竖像戳、太平像涂。矢量笔（左手向）取 −40°</td></tr><tr><td>follow（转弯跟随）</td><td>5°</td><td>0=笔身死板不跟手；&gt;12° 笔跟着笔画整圈转，像风向标</td></tr><tr><td>抬笔距离</td><td>26px</td><td>想要&quot;写完搁笔&quot;的仪式感可加大 + 减速</td></tr></table><h3>已知坑</h3><ul><li>线自己长、笔悬空不动——立刻穿帮，笔尖必须逐帧取 <code>getPointAtLength</code>。</li><li><strong>笔尖不在原点</strong>：把笔画成&quot;笔杆 rect + 旋转&quot;再靠 translate 猜偏移，一改缩放/倾角笔尖就飘离笔迹。</li></ul><p>  正解是让石墨尖坐在局部 (0,0)、笔身朝 −Y，其余零件全部由这根轴推导。</p><ul><li><strong>实拍素材的锚定要量不要猜</strong>：<code>tipX/tipY</code>（笔尖像素坐标）与 <code>axisDeg</code>（笔轴与竖直向上的夹角）</li></ul><p>  必须从<strong>最终那张 PNG</strong>上量——裁边和缩放都会改坐标，先定稿素材再量，量完别再动图。   笔尖：取左下角深色石墨像素簇里沿轴向投影最远的点（不是 bbox 角点，木锥面会把角点带偏）。   轴角：对黄笔杆像素做 PCA 取主轴，方向调成指向橡皮头，再算与 −Y 的夹角（顺时针为正）。   校验：在图上画出 tip 圆圈 + 从 tip 沿 axisDeg 的射线，射线要贴着笔杆中线走，否则动画里笔会&quot;斜着蹭纸&quot;。</p><ul><li><strong>抠像不要全局 despill</strong>：黄笔杆 = R+G，<code>despill=type=green</code> 会把黄铅笔洗成红铅笔（mix 0.05 就变色）。</li></ul><p>  正解：<code>colorkey</code> 之后 matte 内收 1px（<code>MinFilter(3)</code>）去掉最外圈绿边，再<strong>只对半透明边缘像素</strong>   压绿（G 不许超过 max(R,B)）——肤色和笔杆都不受影响。绿值先用 PIL 采角落像素定（本素材 0x09EE20）。</p><ul><li><strong>照片被画幅切断的小臂要羽化</strong>：原照右/下边缘把手臂切平，直接贴到白底上读成&quot;断臂&quot;。</li></ul><p>  沿这两条边做 alpha smoothstep 渐隐（约 150/110px），让小臂溶出画面。</p><ul><li>铅笔画成&quot;黄方块 + 小三角&quot;——读不出是铅笔。至少要有金属箍与橡皮头（辨识度靠这两截），</li></ul><p>  笔杆给 2~3 个色面才有六棱的立体感，木锥面的棱线要和笔杆棱线对齐，否则像两截拼起来的。（矢量笔适用）</p><ul><li>画完的线是静态元素：所在镜头的运动量由相机曲线/idle/环境层保底（motion_check 口径），不要用线抖去凑。</li><li>路径太复杂一笔画完——真人不会一笔画完一辆车，按&quot;笔画&quot;拆成多个 path 串接（起笔快收笔缓）。</li></ul><h3>复用指引</h3><ul><li><strong>笔具二选一</strong>：要临场感 → 手握铅笔实拍素材（<code>demos/pencil-sketch-draw/hand-pencil.png</code>，绿幕抠像透明 PNG，</li></ul><p>  817×640，<code>tip=(1,552)</code>、<code>axisDeg=44.24</code>）；要能换色/无素材依赖 → 纯矢量笔（<code>pencil.tsx</code>）。   两者共用同一个坐标契约（笔尖 = 局部原点、笔身朝 −Y），换笔只改 <code>makePencil()</code>，<code>placePencil</code> 一行不动。</p><ul>
