code>histColor</code> + 主推演语义色 <code>hotColor</code> + 对比线色 <code>altColor</code>（色带用 <code>hotColor</code> 的 7% 透明版）；节奏按语速整体乘同一系数缩放 <code>segments[].dur / segGap / altGap / alt.dur</code>；线宽、<code>chipDx/chipDy</code>、涟漪半径随输出分辨率等比缩放。</li><li>底色要求：白底即可。深底把历史灰改为浅灰阶、标签底色反相、色带换成 <code>rgba(白, .06)</code> 即可，时序与生长逻辑完全不变。</li></ul>","metric-with-sparkline":"<h3>意图</h3><p>口播报一个百分比时，观众要的其实是两件事：<strong>这个数是多少</strong>，和<strong>它是怎么走到这里的</strong>。 只给数字（<code>number-counter</code> / <code>number-slab-pop</code>）观众信了但不知道趋势；只给折线 （<code>line-chart-story-draw</code> / <code>chart-grow</code>）观众看到趋势但抓不到那个可以复述的数。 这张卡把两者压成<strong>一个动效</strong>：数字和曲线同一刻起跑，观众的眼睛在两者之间来回一次， 就同时拿到了&quot;多少&quot;和&quot;往哪走&quot;。</p><p>命门两条： ① <strong>滚动结束前不许出现单位和箭头</strong>。数字还在跳的时候屏上就写着「%↑」，等于结论比计算先到—— 观众读作&quot;这个数是摆上来的，滚动只是装饰&quot;。单位与箭头是<strong>结论签名</strong>，必须押在数字定住那一帧。 ② <strong>折线与计数同刻起跑，不是先后</strong>。两者错开哪怕 0.2s，读作&quot;先讲数字，再补个图&quot;—— 两个动效。同刻起跑才是一件事：<code>lineDur (0.6s) &lt; countDur (0.9s)</code>，曲线先到位、 数字最后落定，视线自然从曲线收回到数字上，落点就是那个要被复述的数。</p><p>与 <code>number-counter</code> 的分工：那张卡的主体是<strong>滚动这件事本身</strong>（odometer 滚轮 + 千分位大数， &quot;烧了多少钱&quot;的量级感）；这张卡的滚动只是把注意力钉住 0.9s 的手段，主体是 <strong>数字 + 趋势的合成语义</strong>。</p><h3>动效核心</h3><ul><li><strong>层级</strong>（自下而上）：白舞台 → 小标签（灰 <code>#8a8a8a</code> / letter-spacing 3px）→</li></ul><p>  大数字行（<code>display: flex; align-items: baseline</code>，整行 <code>white-space: nowrap</code> +   <code>font-variant-numeric: tabular-nums</code>）→ 小折线 SVG（含一条静态灰基线）→ x 轴周次标签。   主持人占位在右侧 34%，指标块左对齐在 96px 安全边内。</p><ul><li><strong>① 标签</strong>：<code>opacity 0→1</code>，0.16s <code>power2.out</code>，<code>t = 0.30</code>（起手静置）。</li><li><strong>② 计数</strong>：<code>t = 0.50</code> 起，<code>{v:0} → {v:67}</code>，0.9s <code>power2.out</code>，</li></ul><p>  <code>onUpdate</code> 里 <code>Math.round</code> 写进 textContent。<strong><code>tabular-nums</code> 是硬要求</strong>——   比例数字下 67 比 26 窄，整行会在滚动中左右呼吸。</p><ul><li><strong>④ 折线</strong>：<code>t = 0.50</code>（与②同值，这是命门）起，<code>stroke-dashoffset dashL → 0</code>，</li></ul><p>  0.6s <code>power1.inOut</code>。<code>dashL = Math.ceil(L) + 2</code>（整数长度：GSAP 会把 dashoffset 取整而   dasharray 保留小数，两者差出的亚像素会在起笔处漏出一小截笔画）。</p><ul><li><strong>数据点跟线端</strong>：四个点 <code>scale 0→1</code>，0.18s <code>back.out(2)</code>，<strong>触发时刻由线长比例反推</strong>：</li></ul><p>  第 i 点的累积弧长比例 <code>r = cum[i]/total</code>，再过一遍 <code>power1.inOut</code> 的<strong>反函数</strong>   （<code>r&lt;0.5 ? √(r/2) : 1-√((1-r)/2)</code>）换成时间比例，<code>at = 0.50 + 0.6 × invEase(r)</code>。   直接按时间均分四份是错的——<code>inOut</code> 中段快两端慢，均分下点会在中段落在线端后面、两端跑到线端前面。</p><ul><li><strong>③ 结论签名</strong>：<code>landAt = 0.50 + 0.9 = 1.40</code>。同一刻两件事：</li></ul><p>  单位「%」<code>opacity 0→1</code> 0.2s <code>power2.out</code>；上箭头 <code>y +12→0</code> + <code>scale 0.8→1</code> +   <code>opacity 0→1</code>，0.2s <code>power3.out</code>，<code>transform-origin: 50% 100%</code>（从下弹入，箭头的   重心在尾部）。箭头是 SVG path 不是字符「↑」——字体箭头的度量各系统不同，基线永远对不齐。</p><ul><li><strong>⑤ hold 1.8s</strong>：整块指标静置（不做任何微动——数据是结论，结论不该抖）。</li><li><strong>唯一语义色 <code>#2fb344</code>（positive）</strong>：只上在数字、单位、箭头、折线、数据点描边上。</li></ul><p>  标签走灰、基线走 hairline、x 轴标签走灰。</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>countDur</code></td><td>0.9s</td><td>本卡的能量旋钮；&lt;0.5s 读作硬切（滚动这层过程感丢掉），&gt;1.4s 口播已经讲下一句了、观众在等一个数</td></tr><tr><td><code>lineDur</code></td><td>0.6s</td><td><strong>必须 &lt; <code>countDur</code></strong>（约 2/3）；= <code>countDur</code> 时曲线和数字同时落定，两个落点抢一拍；&gt; <code>countDur</code> 则数字先定住、曲线还在爬，结论签名被曲线的动作盖掉</td></tr><tr><td><code>countAt</code></td><td>0.5s</td><td><strong>与折线起点同值，本卡第一命门</strong>；两者差 &gt;0.15s 就读作&quot;先数字后补图&quot;</td></tr><tr><td><code>countEase</code></td><td><code>power2.out</code></td><td>计数的&quot;先快后慢&quot;；<code>none</code> 读作机器读数（没有&quot;算出来&quot;的手感），<code>power4.out</code> 前 1/4 就冲到 90%、后面 0.7s 在磨最后两个数，读作卡住</td></tr><tr><td><code>lineEase</code></td><td><code>power1.inOut</code></td><td>曲线的匀速感；用 <code>out</code> 曲线起笔就冲出去、尾段爬不动，读作&quot;线被甩出来&quot;而不是&quot;走出来&quot;</td></tr><tr><td><code>unitIn</code> / <code>arrowIn</code></td><td>0.2s</td><td>结论签名的落定时长；&gt;0.35s 结论来得太软，抵不住前面 0.9s 的动作</td></tr><tr><td><code>arrowRise</code></td><td>12px</td><td>箭头弹入位移；0 读作单位的一部分（少了&quot;涨&quot;这个方向），&gt;24px 箭头自己成了一个动效抢戏</td></tr><tr><td><code>dotPop</code></td><td>0.18s</td><td>数据点弹出；&gt;0.3s 点比线还显眼，读作&quot;四个点连起来&quot;而不是&quot;一条线上有四个刻度&quot;</td></tr><tr><td>数据点数</td><td>3~5</td><td>6 个以上点密到看不出&quot;依次&quot;，此时删掉点只留线（趋势不需要刻度）</td></tr><tr><td><code>hold</code></td><td>1.8s</td><td>收尾定格；数字 + 曲线两层信息要各读一遍，&lt;1.2s 观众只来得及读数字</td></tr></table><h3>已知坑</h3><ul><li>单位「%」参与滚动（写在 textContent 里跟着变）——数字还在跳单位就在那，结论比计算先到，一眼假。</li><li>箭头和数字同时入场——&quot;涨&quot;这个判断在数还没算完时就下了，读作数据是编的。</li><li>折线比计数早起或晚起——两个动效，观众的眼睛要看两次，&quot;一个数 + 它的趋势&quot;这层合成语义直接散掉。</li><li>不写 <code>font-variant-numeric: tabular-nums</code>——比例数字下每帧字宽都不同，整行左右呼吸，慢放一眼看出。</li><li>大数字行不写 <code>white-space: nowrap</code>——单位淡入那一帧行宽变了，箭头被挤到下一行，起手排版就是错的。</li><li>数据点按时间均分触发——<code>power1.inOut</code> 中段快两端慢，点会脱离线端（中段落后、两端超前），</li></ul><p>  读作&quot;点和线是两个动画&quot;。必须用缓动反函数从弧长比例换算时间。</p><ul><li><code>dasharray</code> / <code>dashoffset</code> 用小数长度——GSAP 取整后两者差出亚像素，起笔处漏出一小截笔画。</li><li>用字符「↑」当箭头——字体的箭头字形基线和度量各系统不同，和数字对不齐，且字重跟不上 600。</li><li>hold 期给数字加呼吸/漂移——数据是结论，结论抖起来读作&quot;还没定&quot;（design-language §4 的手作感通道不适用于数字）。</li><li>语义色上到标签和 x 轴标签上——<code>design-language.md</code> §1 红线：positive/negative 只进图表和涨跌标注，</li></ul><p>  版式件（标签/刻度）一律灰阶。</p><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/metric-with-sparkline/index.html</code>。<strong>换数据改两处</strong>：<code>CONFIG.target</code>（计数终值）</li></ul><p>  和 <code>CONFIG.pts</code>（折线点位，SVG 局部坐标 <code>viewBox 0 0 400 96</code>，y 越小越高）；换文案改 HTML 里的   <code>.label</code> 与 <code>.xlabels</code>。换涨跌方向：<code>CONFIG.color</code> 换 <code>#d70015</code>（negative）、   箭头 SVG 的 path 上下镜像（<code>viewBox</code> 内把 <code>M10 2 … Z</code> 的 y 翻过来）、<code>arrowRise</code> 改成负值   （跌要从上往下落）。<code>invPower1InOut</code> 那个反函数只对 <code>power1.inOut</code> 成立——   换 <code>lineEase</code> 必须同步换反函数，或退回&quot;点按弧长比例 × 线性时间&quot;（此时 <code>lineEase</code> 也得用 <code>none</code>）。</p><ul><li>Remotion 移植：不建时间线，逐帧查表更直接。<code>frame</code> → 秒后：</li></ul><p>  计数 <code>interpolate(t, [0.5, 1.4], [0, 67], {easing: Easing.out(Easing.quad), extrapolateLeft:'clamp', extrapolateRight:'clamp'})</code>   再 <code>Math.round</code>；折线用 <code>&lt;path strokeDasharray={L} strokeDashoffset={L * (1 - p)} /&gt;</code>，   <code>p = interpolate(t, [0.5, 1.1], [0, 1], {easing: Easing.inOut(Easing.ease), …clamp})</code>；   数据点的触发时刻在<strong>编译期算好</strong>（弧长比例过反函数），别在渲染里算。   <code>clamp</code> 不能省——不 clamp 的话 t&lt;0.5 时 dashoffset 会算出 &gt; L 的值（无害）但计数会出负数。</p><ul><li>剪辑软件对应物：剪映/CapCut——数字用&quot;数字滚动&quot;预设或直接打字帧（剪映没有真滚动计数，</li></ul><p>  常见做法是把 0→67 拆成 8~10 个关键文本帧，<strong>必须选等宽数字字体</strong>否则跳宽），   折线用&quot;线条生长&quot;或给一条形状层加&quot;描边&quot;效果打 dashoffset 两键；单位和箭头是<strong>独立两层</strong>，   入点押在数字最后一帧（这一步不能省，省了就是本卡最大的坑）。   AE——数字层用 Slider Control + <code>Math.round(effect(&quot;量&quot;)(&quot;滑块&quot;))</code> 表达式，滑块打两键 0→67；   折线用 Shape Layer + <code>Trim Paths</code> 的 <code>End</code> 0→100%；数据点四个层，入点按 Trim Paths 到该点的   <strong>实际进度</strong>手对（AE 里可以直接拖着看，比算反函数快）。</p><ul><li>与本库同类卡的分工：<code>number-counter</code> = 滚动本身是主体（odometer 滚轮 + 大额千分位，量级感）；</li></ul><p>  <code>number-slab-pop</code> = 一次弹出的结论（无过程）；<code>chart-grow</code> = 多项对比的柱状生长；   <code>line-chart-story-draw</code> = 一条线讲一个故事（分段推演 + 标注）；   <strong>本卡 = 一个数 + 它的趋势压成一拍</strong>（两层信息、一个动效、一个落点）。</p><h3>动效范围</h3><ul><li>属于本卡的：「计数与折线同刻起跑、<code>lineDur ≈ 2/3 countDur</code>」这条时间纪律；「单位与箭头押在计数结束那一帧」这条结论签名纪律；数据点触发时刻由<strong>弧长比例过缓动反函数</strong>换算（而不是时间均分）这个实现要求；箭头 <code>y+12 → 0</code> + <code>scale 0.8→1</code>、<code>transform-origin: 50% 100%</code> 的从下弹入；<code>tabular-nums</code> + 整行 <code>nowrap</code> 这个排版纪律；折线 <code>dasharray</code> 取整数长度这个避漏笔的细节；hold 期完全静置（数字不做微动）。</li><li>不属于本卡的：「本周剪辑效率 / 67% / 周一~周四」这套具体文案与数据、<code>#2fb344</code> 这个绿（换 accent 或 negative 红都成立）、86px/34px 的字号、折线 400×96 的画布尺寸与 3px 笔宽、数据点的白心圆样式、右侧主持人（数字人）占位、以及&quot;指标块左对齐在 96px&quot;这个落位（居中、右对齐、下三分之一都成立）。</li><li>迁移接口：<code>CONFIG.target</code> + <code>CONFIG.pts</code> 是唯一的内容入口；能量只调 <code>countDur</code>，<code>lineDur</code> 必须跟着保持约 2/3 的比例；<code>arrowRise</code> 按字号的 14% 等比缩放；换 <code>lineEase</code> 必须同步换数据点的缓动反函数；换涨跌方向要同改 <code>color</code>、箭头 path 朝向、<code>arrowRise</code> 正负三处；竖屏把折线宽度收到舞台宽的 80%、字号降到 64px 并把数据点减到 3 个（横向空间少，4 点以上密到读不出&quot;依次&quot;）。</li><li>底色要求：白底即可。深底成立（数字与折线反白或换 <code>#30d158</code>，基线换 <code>rgba(255,255,255,0.14)</code>），唯一约束是<strong>底不能有网格或纹理</strong>——折线只有 3px 宽，底上的高频细节会和它抢，观众读不出那是一条趋势线。</li></ul>","number-counter":"<h3>意图</h3><p>数字直接贴上屏，观众只是&quot;看到&quot;；从 0 滚上去，观众会跟着&quot;数&quot;，量级感是滚出来的。 命门：<strong>先快后慢</strong>（easeOut 让最后几位清晰可读，线性滚动没有落定感）、 <strong>落定要弹一拍</strong>（scale 1→1.08→1，告诉观众&quot;就是这个数&quot;）、 <strong>别滚太久</strong>（&gt;2s 观众已经听完这句话了，动效还没完就是抢戏）。</p><h3>动效核心</h3><ul><li>模式 a（tween 版）：数值对象 0→目标，1~1.5s <code>power3.out</code>，<code>onUpdate</code> 里实时 <code>toLocaleString</code> 千分位格式化；落定帧 scale 1→1.08（0.09s）→1（0.18s <code>back.out(3)</code>，origin 设在数字左下角避免整行漂移）；单位/涨跌箭头随后 0.25s 淡入 + 上移 6px</li><li>模式 b（odometer 版）：每位数字一个竖向滚轮（0-9 重复 2~3 圈的长条，容器 overflow hidden），reel 的 y 按&quot;步数 × 行高&quot;（demo 行高 64px）滚动到目标位；高位时长短、低位每位多 0.15~0.25s——高位先停低位后收敛，低位要多滚整圈数（必须是 10 的整倍数，否则落错数字）</li><li>排版：大字（占屏宽 1/3 以上）+ <code>font-variant-numeric: tabular-nums</code>（等宽数字防抖列）；旁配小字标签说明数字是什么。底色深浅都成立，只需数字与底有足够对比</li><li>层级：标签先在（或同时淡入）→ 数字滚 → 单位/箭头最后</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>计数时长</td><td>1.3s</td><td>调短到 0.8s 干脆利落适合快剪；&gt;2s 观众等得不耐烦</td></tr><tr><td>缓动</td><td>power3.out</td><td>换 power1.out 尾段还在跳数字，读不清；expo.out 尾段太黏</td></tr><tr><td>落定弹幅</td><td>1.08</td><td>&gt;1.15 像重音强调抢了数字本身的戏；不弹则&quot;到了没有&quot;说不清</td></tr><tr><td>单位淡入延迟</td><td>落定后立即</td><td>和数字同时出会分散视线；晚超过 0.5s 像漏做了</td></tr><tr><td>odometer 高低位时差</td><td>0.22s/位</td><td>调大滚轮感更强更&quot;机械&quot;；为 0 全部同时停 = 普通数字翻页</td></tr><tr><td>低位额外圈数</td><td>2 圈</td><td>越多越有&quot;老虎机&quot;感；0 圈低位几乎不动，滚轮白做</td></tr></table><h3>已知坑</h3><ul><li>线性滚动——匀速到达没有&quot;落定&quot;的呼吸，观众不知道数字停没停。</li><li>小数/低位一起乱滚——量级读不出来；要么只滚整数，要么 odometer 让高位先停锚定量级。</li><li>数字不等宽——列宽随数字抖动，整行文字跟着跳（必须 tabular-nums 或等宽字体）。</li><li>滚动中就把单位、箭头全堆上——信息一次全到，滚动的悬念白费；单位是&quot;落定&quot;的奖励。</li><li>目标值太小还硬滚（如 0→7）——两位数以内直接弹出即可，滚动反而做作。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/number-counter/index.html。模式 a 改 <code>CONFIG.target/countDur</code>，模式 b 改 <code>CONFIG.odoTarget</code>（字符串保位数）；<code>buildOdometer()</code> 自动按位生成滚轮，含千分位逗号。</li><li>Remotion 移植：模式 a <code>Math.floor(interpolate(frame, [0, dur], [0, target], {easing: Easing.out(Easing.cubic)}))</code> 再 toLocaleString；模式 b 每位一个 <code>&lt;div&gt;</code> 用 spring 驱动 translateY，delay 按位序递增。</li><li>（实测变体）记账卡跳变：分步账目推演时不滚动——账目行的数字<strong>瞬时跳变</strong>到新值，旁边一个&quot;+20&quot;角标小弹出，同帧该行整体轻高亮；因为观众要读的是&quot;这一步加了多少&quot;，滚动会把差值糊掉。适合逐笔算账、成本拆解类段落。见小Lin说·韩股崩盘。</li><li>剪辑软件对应物：剪映&quot;文字模板→数据/计数&quot;类；AE 用 Slider Control + <code>Math.floor</code> 表达式（经典做法）；CapCut &quot;Number counter&quot; 贴纸。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：模式 a——数值 0→目标的 tween（1~1.5s、power3.out、onUpdate 里实时千分位格式化）、落定瞬间 scale 1→1.08→1 弹一拍（0.09s 上 + 0.18s back.out(3) 回、origin 数字左下）、涨跌/单位随后 0.25s 淡入 + 上移 6px；模式 b——每位滚轮 translateY 按&quot;步数 × 行高&quot;滚到目标位（power3.out）、高位时长短低位每位多 0.22s（高位先停低位后收敛）、低位额外整圈数必须是 10 的整倍数。层级顺序（标签先在 → 数字滚 → 单位/箭头最后）也属于本卡。</li><li>不属于本卡的：主持人占位与分栏线、示例数值与标签文案、字号字重与 <code>tabular-nums</code> 之外的排版、滚轮窗口的圆角/描边样式、涨跌色的具体色值。</li><li>迁移接口：<code>target</code> / <code>odoTarget</code> 换数值；<code>countDur</code>、<code>odoBase</code>、<code>odoStagger</code> 按语速缩放（口播一句话内滚完为准）；<code>landScale</code> 调落定力度；<code>spins</code> 调滚轮机械感；<code>digitH</code> 必须与滚轮 DOM 的行高一致（改字号时同步改）；数字色用文字主色、涨跌色用一个语义色 token。</li><li>底色要求：白底即可（数字用 #1d1d1f）。深底只需把数字与滚轮窗口反色，计数与滚轮的时序、缓动完全不变。</li></ul>","number-slab-pop":"<h3>意图</h3><p>一个数字在口播里有两种职能：<strong>过程</strong>和<strong>结论</strong>。</p><p><code>number-counter</code> 做的是过程——滚轮转、千分位跳、观众盯着它爬，那 1.3 秒的&quot;算&quot;本身是内容 （&quot;钱是一点点烧掉的&quot;）。<code>metric-with-sparkline</code> 也是过程（0→67 的 0.9s 滚动 + 同刻画出的趋势线）。 过程感的代价是<strong>观众必须等</strong>：数字在动，结论还没成立。</p><p>这张卡是<strong>结论感</strong>：数字不给过程，一次弹出就到位。用在口播已经把话说完、 现在需要一个&quot;钉&quot;把这句话钉在屏上的时候——观众不需要看它怎么来的，只需要它<strong>立住</strong>。 这也是它能做封面数、钩子数的原因：0.3 秒内屏上就有一个可复述的东西。</p><p>命门两条： ① <strong>块和数字不能同时进</strong>。同时进就是一整块 PNG 飞进来——观众读作&quot;贴了一张图&quot;， 数字失去主语地位。<strong>块先落定（0.24s），块稳住的那一帧数字才开始弹</strong>。 这 0.24s 的空块在屏上是有意义的：它是&quot;位置已经占好了，内容马上到&quot;的预告。 ② <strong>小数延后单独淡入</strong>。「23」先立住，「.6」是精度补充——这个先后关系传达的是 &quot;这个数大概是 23，准确说是 23.6&quot;，符合人报数字的自然顺序。整个「23.6」一起弹出没错， 但少了这层&quot;整数是主干、小数是细节&quot;的层级，读作一个更长的数字串。</p><h3>动效核心</h3><ul><li><strong>层级</strong>（自下而上）：白舞台 → 实色块（<code>display: inline-block</code>，圆角 28px = design-language</li></ul><p>  §3 的卡片档，padding 26/40/30）→ 数字行（<code>display:flex; align-items:baseline</code>，   <code>white-space: nowrap</code> + <code>font-variant-numeric: tabular-nums</code>，白字 600）→   说明行（块外、下方 22px，灰 20px）。主持人占位在右侧 34%，色块块左对齐在 108px。   <strong>块宽由数字撑出来</strong>（<code>inline-block</code> + padding），不写死宽度——换数字位数自动跟着变。</p><ul><li><strong>① 块先落</strong>：<code>t = 0.30</code> 起，<code>opacity 0→1</code> + <code>y −20→0</code> + <code>scale 0.94→1</code>，</li></ul><p>  0.24s <code>power3.out</code>，<code>transform-origin: 50% 50%</code>。   从<strong>上方</strong>落（不是下方升起）——&quot;落&quot;有重量，&quot;升&quot;有轻盈感，结论数字要重量。</p><ul><li><strong>② 数字弹出</strong>：<code>numAt = 0.30 + 0.24 = 0.54</code>（= 块落定的那一帧），</li></ul><p>  整行 <code>opacity 0→1</code> + <code>scale 0.72→1</code>，0.28s <code>back.out(1.7)</code>，   <code>transform-origin: 50% 60%</code>（重心略偏下：弹出时字不往上飘）。   <strong><code>back.out</code> 在本库是受限使用的缓动</strong>（design-language §4：夸张弹跳才用）——   这里是它成立的场合之一：一次弹出的&quot;结论落地&quot;就是要那一点过冲，   回弹量 1.7 比 <code>bar-chart-growth</code> 的 chip（1.4，落章）更弹一点，但离漫画弹跳（≥2.2）还有距离。</p><ul><li><strong>②b 小数 + 单位延后</strong>：<code>numAt + 0.20</code>（≈6 帧 @30fps）起，<code>opacity 0→1</code> 0.18s <code>power2.out</code>。</li></ul><p>  <strong>它们从一开始就占位</strong>（只动 <code>opacity</code>，不动 <code>display</code>）——否则淡入那一帧整行宽度变了，   整数被推着挪一下（本卡最隐蔽的坑）。</p><ul><li><strong>③ 说明行</strong>：<code>capAt = numAt + 0.20 + 0.18 = 0.92</code>，<code>opacity 0→1</code> + <code>y +6→0</code>，</li></ul><p>  0.24s <code>power2.out</code>。它在<strong>块外</strong>——说明是注解，不是块的内容。</p><ul><li><strong>④ hold 1.8s</strong>：全静置。</li><li><strong>唯一语义色 <code>#0066cc</code>（accent 蓝）</strong>：只上在色块上，块内字反白，说明行走灰。</li><li><strong><code>tabular-nums</code> 是硬要求</strong>：本卡虽然不滚动，但一旦复用者把它接到&quot;数字会换&quot;的场景</li></ul><p>  （比如同一个组件报不同的数），比例数字下块宽会跳。</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>slabDur</code></td><td>0.24s</td><td>块落定时长；&lt;0.15s 块&quot;闪&quot;出来（&quot;位置占好了&quot;的预告读不到），&gt;0.4s 观众盯着一个空色块等内容</td></tr><tr><td><code>slabDrop</code></td><td>20px</td><td>块的下落位移；0 则块只是淡入（没有重量），&gt;40px 读作块从画外掉进来（转场语感，抢了数字的戏）</td></tr><tr><td><code>slabScale</code></td><td>0.94</td><td>块的起始缩放；1.0（无缩放）也成立但少一点&quot;落到位&quot;的手感，&lt;0.85 块自己成了一个弹出动效</td></tr><tr><td><code>numScale</code></td><td>0.72</td><td><strong>数字起始缩放，本卡的能量旋钮</strong>；0.9 读作轻微放大（结论不够&quot;砸&quot;），&lt;0.5 数字从一个点炸开、读作特效不是数据</td></tr><tr><td><code>numDur</code></td><td>0.28s</td><td>数字弹出时长；&lt;0.2s 配 <code>back.out(1.7)</code> 过冲太急读作抖了一下，&gt;0.4s 弹性变软、结论感松掉</td></tr><tr><td><code>back.out(1.7)</code></td><td>1.7</td><td>回弹量；1.0（= 无过冲）读作普通放大淡入（结论落地的&quot;钉&quot;感丢掉），&gt;2.2 读作漫画弹跳（数据卡不该有的语言）</td></tr><tr><td><code>decLag</code></td><td>0.20s</td><td><strong>小数延后，本卡第二命门</strong>；0 则整串一起弹（少了&quot;整数主干 / 小数细节&quot;的层级），&gt;0.4s 小数来得太晚、读作后面又补了个数</td></tr><tr><td><code>capRise</code></td><td>6px</td><td>说明行上浮；0 可用（更安静），&gt;16px 说明行自己成了一个入场动效，和数字抢</td></tr><tr><td><code>hold</code></td><td>1.8s</td><td>收尾定格；一个结论数字要停住让人复述，&lt;1.0s 观众来不及记</td></tr><tr><td>整数字号</td><td>96px</td><td>相对舞台高（540）的 18%——<strong>这个比例是本卡的骨架</strong>；&lt;12% 数字撑不起&quot;结论&quot;，&gt;25% 块的 padding 挤不出来、数字贴边</td></tr></table><h3>已知坑</h3><ul><li>块和数字同时入场——一整块 PNG 飞进来，数字失去主语地位；块必须先落定，这是本卡一号命门。</li><li>块从<strong>下方</strong>升起——&quot;升&quot;是轻盈的（<code>media-pop-in</code> 的语言），结论数字要&quot;落&quot;的重量。</li><li>小数和单位用 <code>display: none → block</code> 切换（而不是 <code>opacity</code>）——淡入那一帧整行宽度变了，</li></ul><p>  整数被推着横向挪一下，慢放一眼看出。它们必须从头占位。</p><ul><li>块写死宽度——换成位数不同的数字（<code>8.2%</code> / <code>128.6%</code>）后必然出现左右留白不对称或数字撞边。</li></ul><p>  块宽必须由数字撑出来（<code>inline-block</code> + padding）。</p><ul><li>数字 <code>transform-origin</code> 用默认的 <code>50% 50%</code>——弹出末段字会往上飘一点点（因为视觉重心比几何中心低），</li></ul><p>  取 <code>50% 60%</code> 才稳。</p><ul><li>说明行放在块内——那就成了块的一部分（读作&quot;色块里有两行内容&quot;），本卡的说明是<strong>块外的注解</strong>。</li><li>回弹量拉到 2.2 以上还叫它数据卡——那是漫画弹入的语言，</li></ul><p>  数据一弹三抖读作&quot;这数在开玩笑&quot;。</p><ul><li>不写 <code>tabular-nums</code>——本卡不滚动所以单次播放看不出，但复用到&quot;同一组件报不同数&quot;的场景时块宽会跳。</li><li>给数字做滚动计数——那就变回 <code>number-counter</code> / <code>metric-with-sparkline</code> 了，</li></ul><p>  本卡的全部价值在于<strong>没有过程</strong>。要过程请直接用那两张。</p><ul><li>hold 期给块或数字加漂移/呼吸——结论是&quot;钉住&quot;的，动起来读作&quot;还没定&quot;。</li><li>语义色除了块之外还上到说明行——<code>design-language.md</code> §1：一屏只有一个强调色的载体，</li></ul><p>  说明行是 dim 实色（<code>#8a8a8a</code>，且<strong>不许再叠 opacity</strong>，§1 浅底红线）。</p><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/number-slab-pop/index.html</code>。<strong>换数字改 HTML 里三个 span</strong>：</li></ul><p>  <code>.int</code>（整数）/ <code>.dec</code>（小数，含小数点）/ <code>.pct</code>（单位）；没有小数就删掉 <code>.dec</code> span   并把 <code>decLag</code> 用于单位（时序不用改）；换文案改 <code>.slab-cap</code>。   换色改 <code>.slab</code> 的 <code>background</code>（块内字保持白）；块宽自适应，不用动。   <strong>整数字号是骨架</strong>：改 <code>.num-row .int</code> 的 <code>font-size</code> 时 <code>.dec</code> 要同步（两者必须同号，   差一号读作两个数字），<code>.pct</code> 取整数的 55%。   想要更&quot;砸&quot;：只调 <code>numScale</code>（0.72 → 0.6），不要动 <code>back.out</code> 的回弹量（那会改变语言类别）。</p><ul><li>Remotion 移植：三层各自逐帧算，不建时间线：</li></ul><p>  块 <code>opacity/y/scale</code> 三条 <code>interpolate(t, [0.30, 0.54], …, {easing: Easing.out(Easing.cubic), extrapolateLeft:'clamp', extrapolateRight:'clamp'})</code>；   数字的 <code>back.out(1.7)</code> 在 Remotion 里用 <code>spring({frame: frame - 0.54*fps, fps, config: {damping: 12, stiffness: 200, mass: 0.6}})</code>   近似（或用 <code>Easing.out(Easing.back(1.7))</code>，后者与 GSAP 的 <code>back.out(1.7)</code> 数学上等价，更省事）；   小数与单位是同一条 <code>interpolate(t, [0.74, 0.92], [0, 1])</code> 的 opacity，   <strong>两个 span 从第 0 帧就渲染</strong>（只是 opacity 0）——不要条件渲染，否则会出现宽度跳变。   <code>clamp</code> 不能省：不 clamp 时 <code>t &lt; 0.30</code> 的块会算出负 opacity 与 &gt; 1 的 scale。</p><ul><li>剪辑软件对应物：剪映/CapCut——<strong>两个独立层</strong>：色块（形状/背景层）打&quot;位置 + 缩放 + 不透明度&quot;</li></ul><p>  两键（0.24s），数字（文本层）入点押在色块最后一帧、用&quot;弹性弹出&quot;或&quot;放大入场&quot;预设   （剪映的&quot;弹性&quot;就是 back 家族，回弹量不可调，接受即可）；小数如果要单独延后，   <strong>把「.6」拆成第三个文本层</strong>手动对位（剪映没有&quot;文本内部分段动画&quot;）——   这一步在剪映里成本不低，只做整数 + 单位两层是合理取舍（丢掉本卡的第二命门，保住第一命门）。   AE——块层 <code>Position</code> + <code>Scale</code> + <code>Opacity</code> 三组两键；数字层 <code>Scale</code> 两键 +   <code>Easy Ease</code> 后把手柄拉出过冲，或直接上 <code>Overshoot</code> 类脚本；   小数做成独立文本层，入点 +6 帧。<code>Anchor Point</code> 记得移到 <code>50% 60%</code>。</p><ul><li>与本库同类卡的分工：<code>number-counter</code> = 滚动计数的<strong>过程感</strong>（odometer 滚轮 + 千分位大额，</li></ul><p>  &quot;一点点烧掉&quot;）；<code>metric-with-sparkline</code> = 一个数 + 它的趋势（也是过程感，0.9s 滚动 + 同刻折线）；   <code>count-badge-title</code> = 数字当标题的重音（&quot;3 个方法&quot;里的 3，数字是句子成分）；   <code>behind-text-title</code> / <code>slab-punch-title</code> = 色块 + 文字的标题类（主体是字不是数）；   <strong>本卡 = 一次弹出的结论数字</strong>（无过程、块先字后、整数主干 + 小数细节）。   同屏出现过一次本卡后，全片其余数字建议走过程感的那两张——<strong>结论感用多了就不是结论了</strong>。</p><h3>动效范围</h3><ul><li>属于本卡的：「块先落定、块稳住那一帧数字才弹」这条两拍纪律（含中间那 0.24s 空块作为&quot;位置预告&quot;）；块从<strong>上方</strong>落（<code>y −20 → 0</code> + <code>scale 0.94</code>）这个&quot;重量&quot;选择；数字 <code>scale 0.72→1</code> + <code>back.out(1.7)</code> 的一次弹出、<code>transform-origin: 50% 60%</code> 的略偏下重心；小数与单位<strong>延后 6 帧单独淡入</strong>且<strong>从头占位只动 opacity</strong>（拒绝 display 切换）这个层级与实现纪律；说明行在<strong>块外</strong>、最后淡入上浮 6px；块宽由数字撑出（不写死）；<code>tabular-nums</code>；hold 期完全静置。</li><li>不属于本卡的：「23.6% / 较去年增长」这套具体文案与数值、<code>#0066cc</code> 这个蓝（换任何一个 accent 都成立）、96px/52px/20px 的字号、28px 圆角与 26/40/30 的 padding、右侧主持人（数字人）占位、以及&quot;色块左对齐在 108px、垂直居中&quot;这个落位（居中、右对齐、封面正中都成立）。</li><li>迁移接口：HTML 里 <code>.int</code> / <code>.dec</code> / <code>.pct</code> 三个 span 是唯一的内容入口；整数字号按舞台高的 18% 取（<code>.dec</code> 同号、<code>.pct</code> 取 55%），<code>slabDrop</code> 按整数字号的 20% 缩放，<code>capRise</code> 按说明行字号的 30% 取；能量只调 <code>numScale</code>（不动 <code>back</code> 的回弹量——那会改变动效的语言类别）；无小数时把 <code>decLag</code> 转用于单位、时序不动；竖屏整数字号取舞台宽的 22%（竖屏可用宽度是瓶颈，不是高度）。</li><li>底色要求：白底即可。深底成立且更常见（块换 <code>#2997ff</code> 一类的深底 accent，说明行换 <code>#a1a1a6</code>；块内字保持白）。唯一约束是<strong>块与底必须有明确明度差</strong>——本卡的第一拍是&quot;一个空块落下来&quot;，块看不清这一拍就没了；浅底上不要用比 <code>#f5f5f7</code> 更浅的块色，深底上不要用比 <code>#2a2a2c</code> 更深的块色。</li></ul>","info-term-card":"<h3>意图</h3><p>口播抛出专业名词时，观众要么懂要么走——这张卡让不懂的人 3 秒内跟上，又不打断懂的人的收看节奏。 命门：<strong>悬</strong>（落位后必须持续正弦浮动 + 大投影，静止的卡读作贴图水印）、 <strong>让位</strong>（从人物对侧滑入，永远不压人脸）、<strong>短</strong>（释义两行封顶，念完就收，赖着不走变成遮挡物）。</p><h3>动效核心</h3><ul><li>卡片结构：浅底卡（demo 为白底 + #e0e0e0 描边）+ 投影（白底上 0 10px 24px rgba(0,0,0,.10) 足够分层；深底需加深）+ 左侧 46px 圆形图标 + 词条名 20px 粗体（缩写小字跟在后面）+ 14px 两行释义</li><li>入场：x 从屏外 480px → -12px（过冲），0.35s <code>power3.out</code>；再 x → 0，0.16s <code>power2.out</code> 回稳——过冲约卡宽 3%，给&quot;弹&quot;感</li><li>悬浮：y 0 → +6px，半周期 1.4s，<code>sine.inOut</code> + yoyo 往返（demo repeat 3 即 2 个完整周期）</li><li>图标微转：rotate 0 → 8°，与浮动同节奏同缓动（<code>&quot;&lt;&quot;</code> 对齐），让卡&quot;活着&quot;</li><li>出场：x → 480px 原路滑出，0.25s <code>power2.in</code>，起始时刻 = 入场 0.35 + 回稳 0.16 + 停留 3.2</li><li>层级：卡在人物层之上、字幕层之下；主持人靠左时卡定位在 right:56px / top:34%</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>slideIn</td><td>0.35s</td><td>&gt;0.5s 拖沓像 PPT 飞入；&lt;0.25s 观众来不及注意到卡出现</td></tr><tr><td>overshootPx</td><td>12</td><td>设 0 就没有&quot;弹&quot;感、读作平移贴图；&gt;30 像撞墙回弹，太闹</td></tr><tr><td>floatPx</td><td>6</td><td>&gt;10 像漂走/信号不良；&lt;3 看不出在浮，等于静止</td></tr><tr><td>floatPeriod</td><td>2.8s</td><td>&lt;1.5s 变成上下抖动很躁；&gt;4s 一屏内看不完一个来回</td></tr><tr><td>holdBeforeOut</td><td>3.2s</td><td>对齐口播念完释义的时长；太短观众没读完，太长变遮挡物</td></tr><tr><td>slideOut</td><td>0.25s</td><td>出场要比入场干脆；&gt;0.4s 恋恋不舍拖节奏</td></tr><tr><td>iconTilt</td><td>8°</td><td>&gt;15° 图标像坏了在晃；0 则卡少一层&quot;活&quot;的细节</td></tr></table><h3>已知坑</h3><ul><li>浮动幅度开大（&gt;10px）——卡像被风吹走而不是悬浮，一眼假。</li><li>卡从人物同侧滑入或定位压住人脸——信息层抢了人物层，构图立刻业余。</li><li>释义写三行以上——观众在停留时间内读不完，等于没解释。</li><li>去掉投影——卡贴死在背景上，没有&quot;悬&quot;在画面上方的空间感，读作静态水印。</li><li>落位后完全静止——与截图素材无区分，&quot;悬浮卡&quot;变&quot;贴纸&quot;。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/info-term-card/index.html。换文案改 <code>.term-card</code> 内三处：<code>.icon</code> 里的符号（¥/％/AI 单字都行）、<code>.term</code> 词条名与 <code>&lt;small&gt;</code> 缩写、<code>.desc</code> 释义（两行内）；换色改 <code>.term-card</code> 的 <code>background</code> 渐变与 <code>.icon</code> 的渐变；时长手感全在顶部 <code>CONFIG</code>（slideIn / overshootPx / floatPx / floatPeriod / holdBeforeOut / slideOut / iconTilt）。若主持人在右侧：去掉 <code>.host-left</code>、卡改 <code>left</code> 定位、把 <code>gsap.set</code> 与出场的 x=480 改成 -480。</li><li>Remotion 移植：入场用 <code>spring({frame, fps, config:{damping:14, stiffness:120}})</code> 插值 x: 480→0（spring 自带过冲，替代两段 tween）；悬浮用 <code>Math.sin((frame/fps) * 2*Math.PI / floatPeriod) * floatPx</code> 直接写进 translateY，帧驱动天然可 seek；出场 <code>interpolate(frame, [outStart, outStart+0.25*fps], [0, 480], {easing: Easing.in(Easing.quad)})</code>。</li><li>（实测变体）手持词牌：卡不从屏外滑入，而是固定叠在人物胸前手的位置（略带一点手的倾角），人物说话时手偶尔越过卡边缘，产生&quot;举着牌子在讲&quot;的错觉——比屏外滑入更有人味，也天然解决&quot;卡不压人脸&quot;的构图问题；代价是卡的位置被人物姿态锁定，只能用在手位稳定的机位。见小Lin说·韩股崩盘。</li><li>剪辑软件对应物：剪映＝贴纸/文字模板搜&quot;名词解释/科普弹窗&quot;，入场动画&quot;右滑&quot;+循环动画&quot;轻微浮动&quot;；AE＝position 关键帧入场 + <code>y</code> 加表达式 <code>value + [0, Math.sin(time*2*Math.PI/2.8)*6]</code>；FCPX 有同款付费预设（Callout/Lower Third Info 类）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：卡片从人物对侧屏外 x 位移入场（0.35s、power3.out）+ 约卡宽 3% 的过冲、再 0.16s power2.out 回稳的两段式落位；落位后 y ±6px 正弦浮动（半周期 1.4s、sine.inOut、yoyo 往返）——&quot;悬&quot;这层语义靠它和投影共同成立；图标 rotate 0→8° 与浮动同节奏同缓动对齐（<code>&quot;&lt;&quot;</code>）；停留 3.2s 后原路 x 滑出（0.25s、power2.in，出场比入场干脆）；&quot;必须带一层投影&quot;这条约束（无投影即读作贴纸水印）。</li><li>不属于本卡的：卡片的圆角/边框/背景、图标的形状与符号、词条与释义文案、字号行高、主持人占位、字幕行。</li><li>迁移接口：<code>offX</code> 换入场方向（人物在右侧改成 -480，出场自动同向）；<code>slideIn</code> / <code>slideOut</code> / <code>holdBeforeOut</code> 按念完释义的时长缩放；<code>overshootPx</code> 取卡宽 3% 左右（换卡宽要同比改）；<code>floatPx</code> / <code>floatPeriod</code> 控悬浮幅度与周期；<code>iconTilt</code> 控图标&quot;活&quot;的细节；换风格只改卡片 <code>background</code>、<code>border</code> 与投影强度，投影可弱但不能没有。</li><li>底色要求：白底即可（卡片白底 + #e0e0e0 边 + 一层 10% 黑投影就能与舞台分层）。深底把卡片改浅色块、投影换成更暗更散的一层即可，浮动与入出场时序不变。</li></ul>","map-route-pin":"<h3>意图</h3><p>口播讲空间叙事（迁移、行程、供应链、事件链）时，光靠嘴说观众记不住地理关系—— 路线按叙事顺序逐段&quot;长&quot;出来，把时间顺序翻译成空间顺序，观众跟着线头走。 命门：<strong>弧线 + 缓动</strong>（匀速直线立刻读作 PPT 连接线）、<strong>钉要砸下来</strong>（加速下落 + 落地压扁回弹才有&quot;到达&quot;的重量，淡入的钉是贴纸）、<strong>一次只长一条线</strong>（叙事顺序就是 路线生长顺序，齐长全丢）。</p><h3>动效核心</h3><ul><li>底图：内联 SVG 抽象地图——陆地一层极浅填充（demo #f5f5f7）+ 灰阶描边海岸线/岛屿 + 极淡经纬网，不要真实地图数据；关键是陆海可区分，路线才读得出走向</li><li>起点钉先亮：t≈0.15s 起点图钉先落且用区分色（黄），先回答&quot;从哪儿出发&quot;</li><li>路线生长：贝塞尔虚线（Q 控制点向外弓），mask 里放同形实线路径，<code>strokeDashoffset: L→0</code></li></ul><p>  1.1s <code>power1.inOut</code> 揭开虚线；mask 路径用 butt 线帽（offset=L 时 round 帽会在起点漏出一个点）</p><ul><li>线头跟随物：小机头图形（demo 用灰阶 SVG，不用彩色 emoji）以 <code>getPointAtLength(progress*L)</code> 贴线头走，取前方 2px 的点算切线角旋转对齐航向</li><li>图钉落下：y -60px→0，0.25s <code>power2.in</code> 加速砸下；落地一帧 squash（scaleY 0.7 + scaleX 1.3，0.06s）</li></ul><p>  再 <code>back.out(3)</code> 回弹 0.28s；<code>transform-origin: 50% 100%</code>（钉尖为轴，不然压扁会离地）</p><ul><li>落地反馈：地面尘圈 scale 0.2→1.6 淡出 0.45s；地名标签 x -14→0 + 淡入 0.2s 从钉侧滑出</li><li>第三地延迟接入：上一钉落定后停 0.4s 再长第二段，字幕中对应城市名同步点亮</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>routeGrow</td><td>1.1s</td><td>调大 &gt;1.5s 观众在等地图、拖节奏；调小 &lt;0.8s 看不清走向，读作瞬移</td></tr><tr><td>routeEase</td><td>power1.inOut</td><td>换成 none（匀速）立刻变 PPT 连接线；缓动太重（power3）线头像卡顿</td></tr><tr><td>pinDropFrom</td><td>60px</td><td>调大砸感更重，&gt;100px 读作&quot;天外飞钉&quot;；调小落差不足，像原地冒出来</td></tr><tr><td>pinDrop</td><td>0.25s</td><td>调大变慢动作、重量感消失；调小 &lt;0.15s 看不到下落只剩闪现</td></tr><tr><td>squashX / squashY</td><td>1.3 / 0.7</td><td>调大更卡通、偏整活调性；归 1.0 落地轻飘飘，&quot;钉住&quot;感减半</td></tr><tr><td>labelSlide</td><td>0.2s</td><td>调大标签像迟到的补充说明；调小与落钉同帧，抢走砸落的视觉重音</td></tr><tr><td>legPause</td><td>0.4s</td><td>调大停顿明显，适合分句讲解一地一句；调小两段连成一笔，&quot;再到&quot;的层次消失</td></tr><tr><td>planeAngle</td><td>32°</td><td>机头没贴切线就调它；差 90° 是侧着飞的飞机，一眼假</td></tr></table><h3>已知坑</h3><ul><li>路线画成匀速直线——没有弧度没有缓动，读作 PPT 连接线而不是旅程。</li><li>图钉淡入或匀速降落、无 squash——轻飘飘没有到达感，像贴了张贴纸。</li><li>多条路线同时长出——先后关系全丢，观众不知道该看哪条线。</li><li>用真实地图截图当底——细节噪声抢戏还有版权风险；抽象海岸线反而更有&quot;解说感&quot;。</li><li>起点没有先亮的标记——观众不知道从哪儿出发，路线长到一半才反应过来方向。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/map-route-pin/index.html。换城市：改三个 <code>.pin-anchor</code> 的 left/top 和标签文案，</li></ul><p>  同步改两条 <code>route</code>/<code>reveal</code> mask 的 path <code>d</code>（起终点对准城市坐标、Q 控制点向外弓）；   节奏与砸感全在顶部 <code>CONFIG</code>；起点钉颜色在 <code>.pin-anchor.start .pin-head</code>。</p><ul><li>Remotion 移植：路线用 <code>@remotion/paths</code> 的 <code>evolvePath(progress, d)</code> 拿 strokeDasharray/offset，</li></ul><p>  progress 用 <code>interpolate(frame, [0, dur], [0, 1], {easing})</code>；图钉 y 用   <code>spring({frame, config:{damping:10, stiffness:180}})</code>，squash 把同一 spring 的过冲映射到   scaleX/scaleY 反向；飞机取点同款 <code>path.getPointAtLength(progress * L)</code>。</p><ul><li>剪辑软件对应物：AE 是&quot;修剪路径（Trim Paths）&quot;+ 图钉 Scale 关键帧加 Overshoot 表达式；</li></ul><p>  剪映&quot;贴纸→地图/图钉&quot; + 手动 K 位置关键帧；CapCut 模板市场搜 &quot;travel map&quot; 可整体替代。</p><h3>动效范围</h3><ul><li>属于本卡的：起点钉先落（t≈0.15s，用区分色回答&quot;从哪出发&quot;）；路线沿贝塞尔弧逐段生长——mask 内实线路径 strokeDashoffset L→0（1.1s、power1.inOut，mask 必须 butt 线帽）逐步揭开虚线；线头跟随物用 <code>getPointAtLength</code> 贴线头走并取前方 2px 算切线角旋转；图钉 y −60px→0 加速砸下（0.25s、power2.in）→ 一帧 squash（scaleX 1.3 / scaleY 0.7、0.06s、origin 50% 100% 钉尖为轴）→ back.out(3) 回弹 0.28s；地面尘圈 scale 0.2→1.6 淡出 0.45s；地名标签 x −14→0 + 淡入 0.2s 从钉侧滑出；第二段路线延迟 0.4s 接入的叙事停顿；字幕中对应城市名随落钉同帧点亮 + 1.12 弹一拍。</li><li>不属于本卡的：地图底的形状/海岸线/经纬网密度（抽象线框只是占位，换成任何底图都成立）、图钉与标签的造型和配色、城市名与字幕文案、主播小窗、线头跟随物的具体图形（灰阶机头可换成任意小图标）。</li><li>迁移接口：换城市改三个 <code>.pin-anchor</code> 的 left/top + 标签文案，同步改 <code>route-*</code> 与 <code>reveal-*</code> mask 的 path <code>d</code>（起终点对准坐标、Q 控制点向外弓）；<code>routeGrow</code> / <code>legPause</code> 按解说语速缩放；<code>pinDropFrom</code> / <code>pinDrop</code> / <code>squashX,squashY</code> / <code>rebound</code> 调砸落重量；<code>planeAngle</code> 按跟随物图形朝向补正（本 demo 机头朝右故为 0）；配色两个 token——途经点/路线语义色 + 起点区分色，字幕高亮色跟路线色走。</li><li>底色要求：<strong>允许最小例外</strong>——陆地用极浅灰 #f5f5f7、海域留白（#ffffff），因为&quot;路线跨陆/跨海&quot;是本卡地理语义的载体，纯白无区分时路线读不出走向。除这一层浅灰外全部灰阶描边（#d2d2d7 海岸线、#ececef 经纬网），无渐变无质感。换成真实底图或深色地图时，只需保证图钉色/路线色与底图的对比度，动效时序不变。</li></ul>","numbered-step-stack":"<h3>意图</h3><p>口播里最常见的一种句子是&quot;我给你四条&quot;。它的动效需求非常朴素：<strong>四条要看得清、要感觉是一组、 要让人有截图的冲动</strong>。听起来简单，但绝大多数做法会踩两个坑之一——要么四条一起淡入 （读作一张静态图，观众不知道该从哪读起），要么四条各自花式弹跳（读作四个动效， 观众开始数动画而不是读内容）。</p><p>这张卡走的是中间那条线：<strong>逐条进、但错峰密到读作一串</strong>（0.11s × 4 = 0.44s 走完全部）， 然后<strong>用一次极轻的整组上浮把四条收束成一件事</strong>。观众的体验是&quot;啪啪啪啪，四条给完了&quot;—— 逐条给了阅读顺序，整组收束给了&quot;这是一组、清单完整&quot;的确认。</p><p>它与 <code>step-timeline-vertical</code> 是一对孪生卡，区别只有一条但很硬：<strong>这张没有线</strong>。 没有线就没有因果，四条是并列的、顺序可换的；有线就有依赖，顺序不能颠倒。 选错卡的代价是观众理解错了内容的结构，比动效丑更严重。</p><p>命门两条：① <strong>错峰必须严格均匀（0.11s × 4）</strong>。不均匀（0.1 / 0.16 / 0.09）读作卡顿或掉帧， 是本卡唯一会让人觉得&quot;这视频做得糙&quot;的地方；② <strong>编号块的 punch 是&quot;落地确认&quot;不是弹跳</strong>—— 4 帧、<code>power2.out</code>、从 1.12 收到 1，<strong>没有回弹</strong>。用 <code>back.out</code> 会读作四个小球在蹦。</p><h3>动效核心</h3><ul><li><strong>层级</strong>：白底 → 人物层（左列）→ 四枚横条（右侧，垂直居中，<code>gap 14px</code>）；</li></ul><p>  每枚横条 = 编号方块（左，实色强调色）+ 文字（右）+ 1px hairline 边框（<code>#e0e0e0</code>，<strong>不用投影</strong>）</p><ul><li><strong>① 横条堆入</strong>：每枚 <code>x +40 → 0</code> + <code>opacity 0 → 1</code>，<code>0.24s power3.out</code>，<strong>错峰严格 0.11s</strong></li><li><strong>② 编号块 punch</strong>：在该枚横条<strong>落定的同一帧</strong>触发（<code>at + barIn</code>），</li></ul><p>  <code>scale 1.12 → 1</code>，<code>0.133s</code>（4 帧 @30fps），<code>power2.out</code>，<strong>无回弹</strong>。   只作用在编号块上——横条整体不参与，punch 是&quot;这一条落地了&quot;的局部确认</p><ul><li><strong>③ 整组收束</strong>（末枚 punch 完 + 0.08s 呼吸后）：<strong>整个 <code>.stack</code> 容器</strong> <code>y 0 → −4px</code>，</li></ul><p>  <code>0.20s power2.out</code>。位移必须极小（4px @540h ≈ 0.7%）——它不是&quot;整组飞起来&quot;，   是一次几乎读不出的&quot;合上&quot;，宣告清单完整</p><ul><li><strong>④ hold 1.8s</strong>：四条要读完（每条约 0.45s）</li><li><strong>总时长账</strong>：<code>0.4</code>（lead）+ <code>3×0.11</code>（错峰）+ <code>0.24</code>（末枚入场）+ <code>0.133</code>（punch）</li></ul><p>  + <code>0.08</code>（呼吸）+ <code>0.20</code>（收束）+ <code>1.8</code>（hold）= 约 3.18s</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>barStagger</code></td><td>0.11s</td><td><strong>命门</strong>：错峰量，且必须<strong>四枚等值</strong>；&gt;0.2s 读作四个独立动效（观众数动画），&lt;0.06s 读作整块淡入（丢掉阅读顺序），任何不均匀都读作卡顿</td></tr><tr><td><code>barIn</code></td><td>0.24s</td><td>单枚入场耗时；&gt;0.4s 四枚加起来太久、口播已经念到第三条了；&lt;0.15s 位移看不见、退化成淡入</td></tr><tr><td><code>barShift</code></td><td>40px</td><td>从右侧进入的位移（约横条宽的 8%）；0 只剩淡入（没有&quot;堆进来&quot;的动作），&gt;90px 读作横向飞入（四枚飞入 = 花屏）</td></tr><tr><td><code>punchScale</code></td><td>1.12</td><td>编号块 punch 起始倍数；&lt;1.06 看不出&quot;落地&quot;，&gt;1.25 读作编号块单独在弹（抢过横条本身的入场）</td></tr><tr><td><code>punchDur</code></td><td>0.133s（4 帧）</td><td>punch 时长，<strong>必须短</strong>；&gt;0.3s 读作编号块在做自己的入场动画，与横条脱钩</td></tr><tr><td>punch 缓动</td><td><code>power2.out</code></td><td><strong>不许用 <code>back</code></strong>；带回弹立刻读作四个小球在蹦（本卡的能量档整个跳上去，也就不再是&quot;清单&quot;了）</td></tr><tr><td><code>settleLift</code></td><td>4px</td><td>整组收束位移；0 少了&quot;这是一组&quot;的收口（可用但更散），&gt;12px 读作整组飞起来（末枚刚落地又整体动，观众读作两个动效）</td></tr><tr><td><code>settleGap</code></td><td>0.08s</td><td>末枚 punch → 整组收束 的呼吸；0 收束混在 punch 里读不出来，&gt;0.3s 两拍断开（观众以为结束了又动一下）</td></tr><tr><td>条数</td><td>3~5 条</td><td>4 是最舒服的；&gt;5 条行高压缩、错峰累积到 0.66s 以上（首尾差太大，读作&quot;扫过&quot;不是&quot;一串&quot;），要么减 <code>barStagger</code> 到 0.08s 要么拆两屏</td></tr><tr><td><code>hold</code></td><td>1.8s</td><td>收尾停留；按条数给（每条约 0.45s）。这是给&quot;截图&quot;留的时间，宁长勿短</td></tr></table><h3>已知坑</h3><ul><li>错峰不均匀（手写 delay 时最容易犯）——四枚间隔 0.1 / 0.16 / 0.09 读作掉帧，</li></ul><p>  是本卡唯一会让整条视频显得&quot;糙&quot;的错法。必须由 <code>i * barStagger</code> 算出来。</p><ul><li>编号块 punch 用 <code>back.out</code>——四个小球在蹦，清单的冷静感全丢（这是本卡与</li></ul><p>  贴纸涂鸦类花字卡的分界线）。</p><ul><li>punch 作用在整枚横条上——横条刚落定又整体缩放一下，读作&quot;没停稳&quot;（像回弹过冲）。</li></ul><p>  punch 必须只在编号块这个局部。</p><ul><li>整组收束的位移给到 12px 以上——末枚刚落地整组又走一段，观众读作&quot;第五个动效&quot;，</li></ul><p>  收束的意思是&quot;合上&quot;不是&quot;再来一下&quot;。</p><ul><li>横条加投影做层级——design-language §3：投影只给证据素材（截图/照片）。</li></ul><p>  清单条用 1px hairline + 底色差立层级就够，加投影一眼是 PPT 模板。</p><ul><li>四枚横条都上强调色底 + 白字——四条一样重就没有层级，整屏读作一块色板；</li></ul><p>  强调色只上在编号块上（占比小、位置固定，读作&quot;序号&quot;而不是&quot;高亮&quot;）。</p><ul><li>给某一条单独高亮——那是 <code>chapter-progress-list</code> 的语言（&quot;当前&quot;）。清单里四条等重，</li></ul><p>  想强调其中一条说明你要的是另一张卡。</p><ul><li>用它来讲有依赖的流程——观众会以为顺序可换。有依赖必须有线（<code>step-timeline-vertical</code>）。</li><li>横条宽度按各自文字贴合（宽度不齐）——清单的&quot;是一组&quot;靠<strong>等宽 + 等高 + 等间距</strong>表达，</li></ul><p>  宽度不齐读作四个独立卡片。</p><ul><li>重播不重置编号块的 <code>scale</code>——<code>fromTo</code> 写法能自愈，但若改成 <code>to</code> 写法，</li></ul><p>  上一轮的 1.0 会让第二遍 punch 无事发生（四枚安静落地，&quot;确认感&quot;消失）。</p><h3>复用指引</h3><ul><li>HTML/GSAP：demos/numbered-step-stack/index.html。<strong>换内容改 <code>.step-txt</code> 文案 + <code>.step-no</code> 编号</strong>；</li></ul><p>  加/减条数直接复制或删掉整个 <code>.step-bar</code>（时序是 <code>i * CONFIG.barStagger</code> 算的，<strong>不用改任何 delay</strong>），   条数变了只需把 <code>hold</code> 按&quot;每条 0.45s&quot;重算。   换强调色只改 <code>.step-no</code> 的 <code>background</code> 一处。换尺寸时 <code>barShift</code> / <code>settleLift</code> 按舞台宽等比。   能量只调 <code>barStagger</code>（0.08 更急 / 0.14 更稳），<strong>别动 punch 的缓动</strong>。</p><ul><li>Remotion 移植：四枚各一个 <code>&lt;Sequence from={Math.round(i * 0.11 * fps)} durationInFrames={rest}&gt;</code>，</li></ul><p>  条内 <code>interpolate(frame, [0, 7], [40, 0], {easing: Easing.out(Easing.cubic), extrapolateRight: &quot;clamp&quot;})</code>   驱动 <code>translateX</code>，同一个局部时钟驱动 <code>opacity</code>。   编号块 punch 在 <code>frame &gt;= 7</code> 之后再走 4 帧：   <code>interpolate(frame, [7, 11], [1.12, 1], {easing: Easing.out(Easing.quad), extrapolateLeft: &quot;clamp&quot;, extrapolateRight: &quot;clamp&quot;})</code>   （<strong>两头 clamp 都不能省</strong>——不 clamp 时 <code>frame &lt; 7</code> 的帧会算出 &gt;1.12 的 scale，编号块开场就是放大的）。   整组收束放在外层容器上，<code>from = 3*11 + 7 + 4 + 2</code> 帧起走 6 帧到 <code>−4px</code>。   <strong>别用 <code>spring()</code> 做 punch</strong>——spring 自带回弹，会踩上面那条坑。</p><ul><li>剪辑软件对应物：剪映/CapCut——四条各做成一个&quot;文本 + 色块&quot;组合，</li></ul><p>  用&quot;位置 + 不透明度&quot;关键帧从右进入，<strong>逐条往后拖 3 帧（0.1s，剪映最小单位就是帧，正好均匀）</strong>；   编号块的 punch 用&quot;缩放&quot;两个关键帧（112% → 100%，4 帧）并把缓动设成&quot;缓出&quot;（<strong>不要选&quot;回弹&quot;</strong>）；   整组收束在剪映里要把四条打成一个组合再打位置关键帧（没有组合功能就手动四条一起选中拖）。   AE——四层横条 + 一个 Null 做父级：横条各自 <code>Position</code> + <code>Opacity</code> 关键帧，   用 <code>Sequence Layers</code>（Keyframe Assistant）自动等间距排开（这正好保证错峰均匀）；   编号块单独一层 <code>Scale</code> 两键 + <code>Easy Ease Out</code>；整组收束打在 Null 的 <code>Position</code> 上。</p><ul><li>与本库同类卡的分工：<strong>本卡 = 清单堆叠</strong>（无线、并列、顺序可换、答&quot;要做哪几件&quot;）；</li></ul><p>  <code>step-timeline-vertical</code> = 时间轴推进（有线、有因果、顺序不能颠倒、可标&quot;当前在第几步&quot;）；   <code>chapter-progress-list</code> = 章节坐标（深底转场，答&quot;讲到哪了&quot;，唯一高亮）；   <code>line-by-line-slide</code> = 逐行推句子（是字幕/段落，不是带编号的清单件）。   一句话选卡：<strong>顺序无关 → 本卡；顺序不能颠倒 → step-timeline-vertical；讲到哪了 → chapter-progress-list。</strong></p><h3>动效范围</h3><ul><li>属于本卡的：四枚横条 <code>x +40 → 0</code> + <code>opacity</code> 的堆入（每枚 <code>0.24s power3.out</code>）；<strong>错峰严格均匀 <code>0.11s × 4</code></strong> 这条纪律；编号块在该枚落定<strong>同一帧</strong> punch（<code>scale 1.12→1</code>、4 帧、<code>power2.out</code>、<strong>无回弹</strong>）这个&quot;落地确认&quot;；四枚都到位后<strong>整组容器</strong>上浮 <code>4px</code>（<code>0.20s</code>）的收束（&quot;这是一组&quot;）；四条<strong>等重无高亮</strong>（强调色只落在编号块）；用 1px hairline 而非投影立层级；<code>hold 1.8s</code> 给截图留时间。</li><li>不属于本卡的：demo 那四句具体步骤文案与 01~04 的编号写法、<code>#2fb344</code> 这个强调色（取参考图③绿系）、22px 字号与 600 字重、横条 66px 高 / 486px 宽 / <code>gap 14px</code> 的具体尺寸、编号块 64px 见方与 <code>12px 0 0 12px</code> 的圆角、<code>#e0e0e0</code> 边框色、列表落在右侧、左列的数字人占位、白底舞台。</li><li>迁移接口：内容入口是 <code>.step-bar</code> 的增删（时序自动按 <code>i × barStagger</code> 派生）；尺寸基准 <code>barShift 40px</code> / <code>settleLift 4px</code> 按舞台宽等比（960 ⇒ 1920 时翻倍）；颜色一个 token（编号块底色 = accent）+ 一个 hairline；时长缩放规则 —— <code>barStagger</code> 与 punch 的 4 帧是<strong>手感常量，换尺寸换语速都不要动</strong>，条数超过 5 时才把 <code>barStagger</code> 减到 0.08s，<code>hold</code> 按&quot;每条 0.45s&quot;重算；竖屏把横条改成占屏宽 88%、条数收到 3~4 条、<code>barShift</code> 改成屏宽的 8%。</li><li>底色要求：<strong>白底即可</strong>。深底也成立，换值：横条底改 <code>#272729</code>、边框改 <code>rgba(255,255,255,0.14)</code>、文字改 <code>#f5f5f7</code>，编号块的强调色不动（实色块在深底上照样立得住）。唯一约束是底不能有强纹理或渐变：四枚横条靠&quot;等宽等高 + 1px 细边&quot;读作一组，底上的花纹会让细边断续，四条就散成四个独立卡片。</li></ul>","step-timeline-vertical":"<h3>意图</h3><p>&quot;三步&quot;有两种完全不同的说法。一种是<strong>清单</strong>：三件事都要做，先做哪件都行；另一种是<strong>时间轴</strong>： 第二步依赖第一步的结果，顺序错了就不成立。这两种在静帧上长得几乎一样（都是三行带编号的字）， 观众只能靠<strong>动效</strong>来区分——而这张卡就是&quot;时间轴&quot;那一种。</p><p>区分的手段只有一个：<strong>一条线在推进，节点是被线点亮的</strong>。观众看到线走到第二个位置、 第二个点才亮，脑子里自动装上&quot;第一步完成之后才有第二步&quot;这个因果。反过来——线画完再统一弹三个点—— 读作&quot;这里有一条线和三个点&quot;，因果关系一秒消失，那就退回清单了。</p><p>命门两条：① <strong>节点必须跟着线的推进出现</strong>，&quot;线到哪、亮哪&quot;是本卡全部的语义所在； ② <strong>空心环是第三拍，在三组全部到位之后</strong>。它答的是另一个问题——不是&quot;有几步&quot;而是&quot;你在第几步&quot;， 两个问题分开问才都听得清。</p><p>顺带一条纪律：右侧的 kicker（&quot;第一步/第二步&quot;）是 dim 实色 <code>#8a8a8a</code>，静置态不叠透明度 （design-language §1 红线）——它是层级更低的标签，不是&quot;没读到的字&quot;。</p><h3>动效核心</h3><ul><li><strong>层级</strong>：白底 → 竖线（最底，<code>#d2d2d7</code> hairline 档）→ 三个圆节点 → 右侧三组文字 → 人物层（右列）</li><li><strong>① 竖线</strong>：<code>scaleY 0 → 1</code>，<code>transform-origin: 50% 0%</code>（origin top），<code>0.6s power1.inOut</code>。</li></ul><p>  <code>inOut</code> 是刻意的——两头缓、中段近匀速，读作&quot;时间在走&quot;而不是&quot;一根线被甩下来&quot;。   <strong>但 inOut 的强度直接决定节点的间隔</strong>（中段越快，三个点越挤）：<code>power2.inOut @0.4s</code> 实测   三个节点只差 0.18s <strong>总共</strong>（读作同时亮，本卡语义作废）；<code>power1.inOut @0.6s</code> 得到   <strong>每 0.178s 一个</strong>（0.52 / 0.70 / 0.88s），才读得出&quot;线到哪、亮哪&quot;。   要更强的 inOut 就必须同步加长 <code>lineDur</code> —— 两者是一对，不能单独调</p><ul><li><strong>② 节点与文字跟着线走（本卡的实现关键）</strong>：节点 i 的触发时刻不是拍脑袋的 delay，而是</li></ul><p>  <strong>解线的缓动函数反函数</strong>求出来的：   - 节点在线上的位置比例 <code>frac = nodeY / lineHeight</code>   - 用二分法（40 次迭代）在 <code>ease</code> 上解 <code>ease(t) = frac</code>，得到线走到该位置的归一化时间 <code>t</code>   - 触发时刻 = <code>lead + lineDur × t</code>   换句话说<strong>换节点位置、换线长、换缓动都不用重算 delay</strong>，&quot;线到哪、亮哪&quot;永远成立</p><ul><li><strong>节点弹出</strong>：<code>scale 0 → 1</code>，<code>0.18s back.out(1.6)</code>——极轻回弹，它是&quot;打上一个点&quot;</li><li><strong>右侧文字</strong>：<code>opacity 0 → 1</code> + <code>x −8 → 0</code>，<code>0.26s power3.out</code>，<strong>滞后节点 2 帧（0.067s @30fps）</strong>。</li></ul><p>  点先亮、字后跟：观众的视线落在点上，字是被点带出来的</p><ul><li><strong>③ 空心环升级（三组全部到位 + 0.10s 呼吸后）</strong>，三条属性同帧同 <code>0.22s power3.out</code>：</li></ul><p>  - <code>border-width 0 → 3px</code>（描边色 = 强调色 <code>#e0452c</code>）   - <code>background: #1d1d1f → #ffffff</code>（实心点变空心环——<strong>中间必须真的空</strong>）   - <code>scale 1 → 1.25</code></p><ul><li><strong>④ hold 2.0s</strong>：三步的文字要读完</li><li><strong>几何基准</strong>：线长 264px，三个节点在 22 / 132 / 242px（首尾各留 22px 让线有&quot;头和尾&quot;，</li></ul><p>  节点不压在线的端点上）</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>lineDur</code></td><td>0.6s</td><td>线画出总时长，本卡的节奏总旋钮（节点触发时刻全部由它派生）；&gt;1.0s 观众等着线走完，口播已经讲到第二步了；&lt;0.4s 三个节点被挤到 0.12s 内依次亮（读作同时，&quot;推进&quot;看不见）</td></tr><tr><td><code>lineEase</code></td><td><code>power1.inOut</code></td><td><strong>线的性格，同时是节点间隔的控制器</strong>（见上）；<code>power2.inOut</code> 以上必须把 <code>lineDur</code> 加到 0.8s+ 才够撑开三个点；<code>none</code> 匀速读作进度条（机械感，但节点间隔最均匀，也能用）；<code>power3.out</code> 起手极快 = 线被甩下来（推进感丢掉，且三点全挤在开头）；<code>back</code> 系列一律不能用（线不会回弹）</td></tr><tr><td><code>nodePop</code></td><td>0.18s</td><td>节点弹出耗时；&gt;0.3s 点还在长、线已经走过去了（因果倒置），&lt;0.1s 读作硬现（少了&quot;打点&quot;的确认感）</td></tr><tr><td><code>nodeEase</code></td><td><code>back.out(1.6)</code></td><td>节点唯一允许回弹的地方；回弹强度 &gt;2.5 在 14px 的点上读作抖动，改 <code>power3.out</code> 也成立（更冷静）</td></tr><tr><td><code>textLag</code></td><td>0.067s（2 帧）</td><td><strong>命门</strong>：文字滞后节点的量；0 点与字同时出（读作&quot;一组东西一起淡入&quot;，视线没有落点），&gt;0.2s 两者断开、读作四个动效</td></tr><tr><td><code>textShift</code></td><td>8px</td><td>文字左移进入的位移；0 只剩淡入（可用但更平），&gt;20px 读作文字横向飞入（抢过节点的&quot;打点&quot;）</td></tr><tr><td><code>ringDelay</code></td><td>0.10s</td><td>三组到位 → 空心环升级 的呼吸；0 读作&quot;第一个节点比较特殊&quot;而不是&quot;当前在第一步&quot;，&gt;0.4s 两拍断开</td></tr><tr><td><code>ringScale</code></td><td>1.25</td><td>空心环放大倍数；&lt;1.1 看不出&quot;升级&quot;，&gt;1.5 环大过文字行高，读作一个圆形贴纸落在线上</td></tr><tr><td><code>ringWidth</code></td><td>3px</td><td>环的描边宽（节点直径 14px ⇒ 21%）；&lt;2px 在 540h 上看不见空心，&gt;5px 环心糊掉（又变回实心点）</td></tr><tr><td>节点数</td><td>3~4 个</td><td>3 是最舒服的（&quot;三步走&quot;）；&gt;5 个线要拉长、行高压缩，节点与文字开始互相挤，该换 <code>numbered-step-stack</code></td></tr><tr><td><code>hold</code></td><td>2.0s</td><td>收尾停留；按总字数给（三组 × 两行 ≈ 每组 0.6s）</td></tr></table><h3>已知坑</h3><ul><li>线画完再统一弹三个点——&quot;时间轴&quot;这层语义<strong>当场消失</strong>，退化成&quot;一条线和三个点&quot;（清单）。</li></ul><p>  这是本卡唯一的致命错法。</p><ul><li>节点的 delay 手写死成 <code>0.1 / 0.25 / 0.4</code>——换线长或换缓动后线和点就错开了，</li></ul><p>  慢放下能看见&quot;点比线先亮&quot;（因果倒置，比不同步更假）。必须由线的缓动反解。</p><ul><li>文字与节点同帧出——视线没有落点，一组&quot;点 + 两行字&quot;读作一个整块淡入，</li></ul><p>  &quot;点先亮、字后跟&quot;这半帧的层级关系是本卡的质感来源。</p><ul><li>空心环用 <code>outline</code> 或 <code>box-shadow</code> 做——两者都不改变元素盒子，<code>scale 1.25</code> 时环会跟着糊；</li></ul><p>  必须是 <code>border-width</code> 从 0 长出来（配合 <code>box-sizing: border-box</code> 让外径不变）。</p><ul><li>环升级了但背景还是深色——&quot;空心&quot;必须真的空（背景换成底色），不然只是&quot;点变粗了&quot;。</li><li>三个节点都升级成空心环——&quot;当前&quot;是唯一性给的，三个都升级读作&quot;三个都在进行中&quot;。</li><li>kicker（&quot;第一步&quot;）叠 <code>opacity: 0.6</code> 来压层级——<code>#8a8a8a</code> 在白底只有 4.29:1 余量，</li></ul><p>  叠透明度后掉出可读区（design-language §1 红线）；它本来就是 dim 实色，要更淡就换更深的底。</p><ul><li>线用 <code>height</code> 动画而不是 <code>scaleY</code>——每帧触发重排，慢放下能看见线的末端在抖。</li><li>缓动选了强 <code>inOut</code>（<code>power2/3.inOut</code>）却没加长 <code>lineDur</code>——中段被压缩后三个节点几乎同帧亮，</li></ul><p>  &quot;跟着线推进&quot;实测就没了（<code>power2.inOut @0.4s</code>：三点前后只差 0.18s）。   强 inOut 与 <code>lineDur</code> 必须一起调。</p><ul><li>重播只重置 <code>scale</code> 不重置 <code>borderWidth</code> / <code>backgroundColor</code>——上一轮的空心环留在第一个节点上，</li></ul><p>  第二遍播放时它开场就是环，&quot;升级&quot;这一拍全丢。</p><h3>复用指引</h3><ul><li>HTML/GSAP：demos/step-timeline-vertical/index.html。<strong>换内容改 <code>.tl-kicker</code> / <code>.tl-title</code> 的文案</strong>；</li></ul><p>  改节点位置只改 HTML 里的 <code>data-at=&quot;22|132|242&quot;</code>（像素，相对 <code>.tl-wrap</code> 顶部）——   节点触发时刻与文字落位都是运行时按它算的，<strong>不用改任何 delay</strong>。   加/减节点：复制一组 <code>.tl-node</code> + <code>.tl-group</code>、给新的 <code>data-at</code>，然后把 <code>.tl-wrap</code> 的 <code>height</code>   改成&quot;末节点 + 22px&quot;即可。节奏只调 <code>CONFIG.lineDur</code>（其余全部派生）——   <strong>加节点时要按比例加长 <code>lineDur</code></strong>（经验值：每个节点至少占 0.18s，四节点 ⇒ 0.75s）。   那段 <code>timeAtProgress()</code>（二分解缓动反函数）是通用的——任何&quot;跟随某条动画进度触发子事件&quot;的   demo 都可以直接抄走。</p><ul><li>Remotion 移植：线用 <code>interpolate(frame, [0, lineFrames], [0, 1], {easing: Easing.inOut(Easing.ease)})</code></li></ul><p>  驱动 <code>scaleY</code>（<code>Easing.inOut(Easing.quad)</code> 对应 GSAP 的 <code>power2.inOut</code>，用它要把 <code>lineFrames</code> 加到 24+）。节点触发帧<strong>在渲染前算好一张表</strong>：对每个 <code>frac</code> 做同样的二分反解得到 <code>t</code>，   <code>nodeFrame = Math.round(lineFrames * t)</code>，然后 <code>&lt;Sequence from={nodeFrame}&gt;</code>。   节点弹出用 <code>spring({damping: 12, stiffness: 180})</code>；空心环那一拍三个 <code>interpolate</code>   （<code>borderWidth</code> / <code>scale</code> / 用 <code>interpolateColors</code> 换背景），全部 <code>extrapolateRight: &quot;clamp&quot;</code>。</p><ul><li>剪辑软件对应物：剪映/CapCut——线用一个细长矩形贴纸 + &quot;缩放（纵向）&quot;关键帧，</li></ul><p>  锚点要先拖到顶端（剪映默认中心锚点会让线<strong>从中间往两头长</strong>，那是完全不同的读法）；   三个圆点各一层缩放关键帧，时间点按线的进度手对（剪映没有缓动反解，   <strong>实用做法是把线改成匀速/线性</strong>，这样节点时间就是等分的）；空心环做不出 border 补间，   用&quot;实心点淡出 + 空心环贴纸弹入&quot;两层硬切代替。   AE——线用 Shape Layer 的 <code>Trim Paths → End</code> 从 0% 到 100%（比 Scale 干净）；   节点触发时刻在 Graph Editor 上看 <code>End</code> 的曲线读数直接对，或者给节点的 Scale 加个   表达式跟着 <code>End</code> 的值：<code>s = thisComp.layer(&quot;line&quot;).content(&quot;Trim Paths 1&quot;).end; s &gt; 33 ? 100 : 0</code>   （改成 <code>linear()</code> 就有补间）。</p><ul><li>与本库同类卡的分工：<strong>本卡 = 时间轴推进</strong>（有线、有因果、可标当前）；</li></ul><p>  <code>numbered-step-stack</code> = 清单堆叠（无线、四条并列、只答&quot;要做哪几件&quot;）；   <code>chapter-progress-list</code> = 章节坐标（答&quot;讲到哪了&quot;，是转场不是内容）；   <code>line-chart-story-draw</code> = 数据线（线是数值不是顺序）；<code>map-route-pin</code> = 地理路径。   一句话选卡：<strong>顺序不能颠倒 → 本卡；顺序无关 → numbered-step-stack。</strong></p><h3>动效范围</h3><ul><li>属于本卡的：竖线 <code>scaleY 0→1 origin top</code> 走 <code>0.6s power1.inOut</code> 这条&quot;时间在走&quot;的曲线（<strong>缓动强度与 <code>lineDur</code> 是一对</strong>——inOut 越强中段越快、节点越挤，实测每个节点间隔不能低于 0.15s）；<strong>节点触发时刻由线的缓动反解得出</strong>（&quot;线到哪、亮哪&quot;）这条实现纪律；节点 <code>scale 0→1 back.out(1.6)</code> 的&quot;打点&quot;手感；文字<strong>滞后节点 2 帧</strong>（<code>0.067s</code>）+ <code>x −8 → 0</code> 的跟随关系；三组全部到位 + <code>0.10s</code> 呼吸后才做的第三拍升级（<code>border-width 0→3px</code> + 背景换底色 + <code>scale 1→1.25</code> 三属性同帧）；空心环的<strong>唯一性</strong>；kicker 用 dim 实色、静置态零透明度。</li><li>不属于本卡的：demo 那三句具体步骤文案与「第一步/第二步/第三步」这个 kicker 写法、<code>#e0452c</code> 这个强调色、25px/14px 字号与 600 字重、线的 <code>#d2d2d7</code> 色与 2px 宽、节点 14px 直径、<code>left: 132px</code> 这个落位与 460px 的组宽、右列的数字人占位、白底舞台。</li><li>迁移接口：几何入口只有 <code>.tl-wrap</code> 的 <code>height</code> 与每个节点的 <code>data-at</code>（像素，相对组顶）——两者按舞台高等比缩放（960×540 ⇒ 1920×1080 时全部翻倍，含 <code>ringWidth</code>/节点直径/<code>textShift</code>）；节奏入口只有 <code>CONFIG.lineDur</code>，节点与文字的时刻全部派生（<code>textLag</code> 与 <code>nodePop</code> 是<strong>手感常量，换尺寸不要动</strong>）；颜色两个 token —— <code>accent</code>（空心环）与 hairline（线）；<code>hold</code> 按文字总量给（每组约 0.6s）；竖屏直接沿用（本卡是纵向布局，天生适合竖屏，只需把组宽收到屏宽 80% 并把节点数收到 3）。</li><li>底色要求：<strong>白底即可</strong>。深底也成立，换值：线用 <code>rgba(255,255,255,0.14)</code>、节点实心用 <code>#f5f5f7</code>、kicker 用 <code>#a1a1a6</code>、空心环的&quot;空&quot;要换成深底色（<code>#1d1d1f</code>）而不是白——否则环心是一块白斑，比实心点还重。唯一约束是底不能有横向纹理或网格线：竖线只有 2px 宽，底上任何横线穿过它都会让&quot;线走到哪&quot;读不清。</li></ul>","ui-prop-theater":"<h3>意图</h3><p>口播讲流程和进度时，观众要的是&quot;到哪一步了&quot;的实感。真实的 loading 条匀速爬，看起来是程序在忙， 和讲述完全脱钩；截图硬切又丢掉&quot;它在往前走&quot;的因果。界面道具剧场把 UI 当<strong>演员</strong>： 进度条不匀速填充而是在语音的重音点上分段<strong>跳</strong>一截，状态文案跟着跳那一下换，清单跟着念到的项打勾。 观众听到&quot;先下载&quot;看到进度跳到 17%，听到&quot;再解压&quot;看到勾落下——语音和界面互为字幕。 命门：<strong>状态变化必须锚在语音节拍上</strong>（匀速自动播 = 观众读作真在 loading，注意力立刻从讲述转到&quot;还剩多久&quot;）、 <strong>跳进必须留静止段</strong>（段间画面完全不动才显得&quot;这一跳是被那个词触发的&quot;）、 <strong>一拍只推一件事</strong>（进度跳 + 换文案 + 打勾可以同拍，但必须是同一个语义事件的三个面，不是三件事挤一起）。</p><h3>动效核心</h3><ul><li><strong>节拍表驱动（本卡的骨架）</strong>：所有状态变化写成一张 <code>beats</code> 表——</li></ul><p>  <code>{ at, pct, status, tick, done }</code>，<code>at</code> 就是该口播词的时间戳。段与段之间没有任何补间，画面静止。   demo 的四段值取 17 → 43 → 71 → 96 → 100（<strong>不等距</strong>：真实安装的段落长短不一，等距分段一眼是假数据）</p><ul><li><strong>进度条分段跳进</strong>：填充 <code>width</code> 从上一段值跳到本段值，单段 0.30s <code>power2.out</code>（起跳快、收尾软）；</li></ul><p>  百分比读数与填充<strong>共用同一个代理值</strong>（<code>prog.p</code> 的 <code>onUpdate</code> 同时写 width 和文本）——   两者分开各跑一条 tween 必然错开，&quot;数字和条不同步&quot;是最刺眼的破绽</p><ul><li><strong>状态文案换字（三段式，0.32s）</strong>：旧文案 <code>y -6px</code> + 淡出 0.12s → 换文本 → 新文案从 <code>y +6px</code> 淡入 0.20s，</li></ul><p>  都用 <code>power2.out</code>。换字必须与该拍的跳进<strong>同帧起</strong>（晚半拍就读作两件事）。收尾拍文案转强调色</p><ul><li><strong>清单逐项打勾（0.2s 画出）</strong>：勾用 SVG path + <code>stroke-dashoffset</code> 从 0 画出（<strong>不是淡入、不是缩放弹出</strong>——</li></ul><p>  画出才有&quot;被逐笔勾掉&quot;的手写因果），同帧 checkbox 描边转强调色、标签文字由灰转黑</p><ul><li><strong>打勾比跳进晚 0.16s</strong>：先看见进度跳，再看见勾落下——因果顺序（进度推进 → 那一步完成），反了就成了&quot;勾完才开始跑&quot;</li><li><strong>行微亮再落定（0.16s + 0.5s）</strong>：勾落下同帧行底色淡入 <code>#f0f0f2</code>，0.18s 后回落到 <code>#f7f7f8</code> 的&quot;已完成&quot;底色。</li></ul><p>  微亮是<strong>瞬时反馈</strong>，落定底色是<strong>持久状态</strong>——只做其中一个，要么完成项看不出来、要么整个清单一直在闪</p><ul><li><strong>收尾拍</strong>：进度停 100% 的同一拍，完成勾 <code>scale 0.4→1</code> + 淡入 0.26s <code>back.out(2.2)</code>，</li></ul><p>  勾线再延 0.08s 画出（先有圈、再有勾）。完成勾占<strong>固定宽度</strong>（<code>flex: 0 0 24px</code>）——   否则弹出瞬间会把状态文案推挤位移</p><ul><li><strong>滑杆变体（同一节拍表语言）</strong>：手柄 <code>x</code> 拖到目标位 0.5s <code>power2.out</code>，联动数字/图形在</li></ul><p>  <code>onUpdate</code> 里<strong>实时</strong>刷新（同一个代理值），不是拖完才跳数——拖动过程中数字不动的滑杆一眼是贴图</p><ul><li><strong>层级</strong>：底 UI（卡片/轨道/未勾 checkbox）&lt; 状态层（填充、行底色、已勾描边）&lt; 弹出层（完成勾）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>beats[].at</code></td><td>0.55 / 1.5 / 2.35 / 3.6 / 4.55</td><td>每拍锚定的语音时间戳，本卡的全部节奏都在这一列；改成等间距立刻退化成&quot;自动播的假 loading&quot;</td></tr><tr><td><code>beats[].pct</code></td><td>17 / 43 / 71 / 96 / 100</td><td>分段值刻意不等距；段数 &lt;3 看不出&quot;分段&quot;（读作一次填满），&gt;6 观众数不过来、退化成匀速</td></tr><tr><td><code>jump</code></td><td>0.30s</td><td>单段跳进耗时；&lt;0.15s 读作数值瞬变（丢掉&quot;往前推了一截&quot;），&gt;0.6s 段与段黏在一起又变匀速</td></tr><tr><td><code>swapOut</code> / <code>swapIn</code></td><td>0.12s / 0.20s</td><td>状态文案出/入；入比出长才有&quot;新状态落定&quot;感，两者相等读作生硬替换</td></tr><tr><td><code>swapLift</code></td><td>6px</td><td>换字位移；&gt;12px 文字在行内乱窜抢戏，0 则读作直接替换文本（少了&quot;翻页&quot;的因果）</td></tr><tr><td><code>tickDelay</code></td><td>0.16s</td><td>勾比跳进晚多少；0 则两件事挤成一件、看不清先后，&gt;0.4s 勾像迟到的补充说明</td></tr><tr><td><code>tickDraw</code></td><td>0.20s</td><td>勾画出时长；&gt;0.4s 慢得像在演示书法，&lt;0.1s 读作直接出现（手写因果消失）</td></tr><tr><td><code>rowGlow</code> / <code>rowSettle</code></td><td>0.16s / 0.5s</td><td>行微亮淡入 / 回落到已完成底色；微亮 &gt;0.3s 变成&quot;这行在闪&quot;，回落 &lt;0.2s 看不出曾经亮过</td></tr><tr><td><code>donePop</code></td><td>0.26s <code>back.out(2.2)</code></td><td>完成勾弹出；这是全片唯一允许过冲的动作（收尾奖励），回弹强度 &gt;3 显廉价</td></tr><tr><td>滑杆 <code>dragDur</code></td><td>0.5s</td><td>手柄行程耗时；&lt;0.25s 看不清&quot;被拖过去&quot;（读作换图），&gt;0.9s 观众等不动</td></tr></table><h3>已知坑</h3><ul><li>进度条匀速从 0 爬到 100%——观众读作&quot;真在 loading&quot;，开始等进度而不是听讲；本卡的全部价值就在&quot;分段跳 + 段间静止&quot;。</li><li>分段值等距（25/50/75/100）——一眼是假数据；真实流程的段落长短不齐。</li><li>进度条填充和百分比数字各跑一条 tween——必然错开，&quot;92% 配一条满格的条&quot;一眼假；必须共用一个代理值。</li><li>状态文案换字晚于跳进——读作两件独立的事；文案换与那一跳必须同帧起。</li><li>勾用淡入或缩放弹出——读作&quot;图标出现了&quot;，不是&quot;被勾掉了&quot;；必须 <code>stroke-dashoffset</code> 画出。</li><li>勾先落、进度后跳——因果反了（还没干完就打勾）；勾必须比跳进晚 0.1~0.2s。</li><li>清单只打勾不改行状态（或只改底色不打勾）——完成项与待办项权重相同，一屏看不出进行到哪。</li><li>行微亮一直亮着不回落——整个清单在闪，观众不知道此刻推进到哪一行。</li><li>完成勾没有固定宽度——弹出瞬间把状态文案推得位移，收尾拍最该稳的一帧在抖。</li><li>滑杆拖完才刷新数字——观众读作&quot;贴了张图然后换了个数&quot;；联动必须在拖动的每一帧发生。</li><li>一拍同时推三件不相关的事（进度跳 + 换标题 + 弹卡片）——观众不知道该看哪；一拍一个语义事件。</li><li>给 UI 加拟真质感（渐变/内阴影/玻璃/投影堆叠）——道具变成主角，抢掉讲述；线框灰阶足够。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/ui-prop-theater/index.html。<strong>换内容只改 <code>CONFIG.beats</code></strong>（每行一拍：<code>at</code> 时间戳 + <code>pct</code> 目标值 + <code>status</code> 文案 + <code>tick</code> 行号 + <code>done</code> 收尾），清单条目改 <code>#stage</code> 里的 <code>.step</code> 结构（勾的 SVG path 保留）；换强调色改 <code>CONFIG.accent</code> 与 <code>.bar-fill</code> 的 <code>background</code>；节奏参数全在 <code>CONFIG</code>（<code>jump</code> / <code>swapOut</code> / <code>swapIn</code> / <code>tickDelay</code> / <code>tickDraw</code> / <code>rowGlow</code> / <code>rowSettle</code> / <code>donePop</code>）。<strong>注意 <code>fromTo</code> 必须带 <code>immediateRender: false</code></strong>——否则建时间线那一刻就把起手文案打成 <code>opacity: 0</code>，第一拍前画面是空的（本 demo 踩过）。</li><li>Remotion 移植：节拍表原样搬成 <code>BEATS</code> 数组，<code>at</code> 换算成帧号；进度用<strong>分段查表</strong>而不是一条 interpolate——<code>const seg = BEATS.filter(b =&gt; frame &gt;= b.at*fps); const pct = interpolate(frame, [cur.at*fps, (cur.at+jump)*fps], [prev.pct, cur.pct], {easing: Easing.out(Easing.quad), extrapolate*: 'clamp'})</code>，段间自然静止；百分比文本读同一个 <code>pct</code> 变量（这就是&quot;共用代理值&quot;在帧驱动下的等价写法）；勾用 <code>strokeDashoffset: interpolate(frame, [tk*fps, (tk+0.2)*fps], [L, 0])</code>（<code>L</code> 用 <code>path.getTotalLength()</code> 或预量好的常量）；文案换字用两个 <code>&lt;span&gt;</code> 各自 interpolate opacity/translateY，切换点在 <code>at+swapOut</code>；完成勾用 <code>spring({frame: frame - done*fps, fps, config: {damping: 12}})</code>；行底色用 <code>interpolateColors(frame, [glowIn, glowOut], ['#f0f0f2', '#f7f7f8'])</code>。</li><li>剪辑软件对应物：剪映/CapCut——进度条用一个色块 + &quot;线性擦除&quot;或蒙版位置关键帧，<strong>在每个语音节拍点打两个关键帧（跳的起止）、其余段落不打</strong>（这就是分段跳进），状态文案用文本层在节拍点硬切+两端小幅淡入淡出，勾用&quot;笔刷描边/线条生长&quot;贴纸或勾的 PNG 配蒙版擦除；AE——进度用 Rectangle 的 Scale/Trim Paths 关键帧且<strong>关键帧成对贴在节拍点</strong>（中间保持段，别让 AE 自动补成匀速），勾用 Trim Paths 的 End 0→100% + Easy Ease，行底色用 Solid 的 Opacity 两段关键帧，完成勾 Scale 关键帧配 Overshoot 表达式；任何软件里的&quot;进度条预设/loading 动画预设&quot;一律不用（全是匀速，且自带光泽扫光）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：节拍表这套时序纪律（每个状态变化锚在一个口播词的时间戳上、段与段之间画面完全静止、一拍只推一个语义事件）；进度条分段跳进（0.3s <code>power2.out</code>、分段值不等距、填充与百分比读数共用同一代理值实时同步）；状态文案的三段式换字（上移淡出 0.12s → 换文本 → 下方浮入 0.20s，与跳进同帧起）；清单逐项打勾（<code>stroke-dashoffset</code> 画出 0.2s + checkbox 描边转强调色 + 标签转黑 + 行微亮 0.16s 后回落到已完成底色 0.5s）；&quot;打勾比跳进晚 0.16s&quot;这条因果顺序；收尾拍的完成勾弹出（<code>scale 0.4→1</code> + <code>back.out</code>，勾线延 0.08s 画出，占固定宽度不推挤）；滑杆变体（手柄 0.5s 拖动 + 联动数字/图形在每一帧实时刷新）；三层层级（底 UI &lt; 状态层 &lt; 弹出层）。</li><li>不属于本卡的：demo 里那个&quot;Studio 安装程序&quot;假 UI 的结构与排版（卡片边框、图标、版本号、条目文案与右侧计量全是演示语境）、灰阶线框这套取值（<code>#ececef</code> 轨道 / <code>#d2d2d7</code> 未勾描边 / <code>#f7f7f8</code> 已完成底色都是占位）、<code>#d8383a</code> 这个具体强调色、进度条 10px 的高度与圆角、示例台词与字幕、角标主持人（数字人）、&quot;进度条 + 清单&quot;这个具体道具组合（换成任务队列/评分条/容量环/开关矩阵同样成立）。</li><li>迁移接口：<code>beats</code> 表是唯一的迁移入口——把 <code>at</code> 全量换成实际语音的词级时间戳，<code>pct</code> 换成真实流程的段落值（保持不等距）；强调色换成目标 UI 自己的 primary token（<code>CONFIG.accent</code> + 填充色 + 勾描边三处同改）；尺寸按画幅等比缩放（进度条高度约画幅短边 1.5~2%，勾 18~24px @960）；语速变化时整表时间戳重排，<strong>各动作时长（<code>jump</code>/<code>tickDraw</code>/<code>swapIn</code>）保持不变</strong>——这些是手感常量，跟着语速缩放会让快语速下的动作糊成一团；深色 UI 上把行微亮由&quot;加深&quot;改为&quot;提亮&quot;、未勾描边提亮、已完成底色改为略亮于卡片底。</li><li>底色要求：白底即可（浅色 UI 是最常见情形，灰阶轨道与白底天然分层）。深色 UI 截图同样成立，唯一硬要求是<strong>进度填充与轨道、已勾与未勾两组对比都要保住</strong>——轨道由 <code>#ececef</code> 改为比卡片底略亮的深灰，行微亮/落定底色的明度关系整组翻转。</li></ul>","chat-message-flow":"<h3>意图</h3><p>聊天截图是口播里出现频率最高的证据素材，但截图只能被&quot;拍上台&quot;（media-pop-in），它永远是<strong>过去式</strong>的。 本卡把同一份记录变成<strong>现在进行时</strong>：观众看着我方在输入框里把话打出来、看着对方那三个点跳了一秒半才回， &quot;这场对话正在发生&quot;的临场感比&quot;这是一张截图&quot;强一个量级——而且<strong>每条消息的出现时刻天然对齐你的讲述</strong>， 你念到哪一句，那一句正好上屏。 命门：<strong>两条链路各有自己的前戏</strong>（我方经过输入框，对方经过输入气泡；缺了前戏就退化成&quot;气泡依次淡入&quot;）、 <strong>时刻表由文本长度自动生成</strong>（手数帧的表换一次文案就全废，也必然出现&quot;两个字的消息打了两秒&quot;的破绽）、 <strong>灰阶中性皮</strong>（一旦做成微信绿/iMessage 蓝，观众开始读平台品牌、并且你要为仿真背锅）。</p><h3>动效核心</h3><ul><li><strong>时刻表自动生成（本卡的骨架）</strong>：<code>buildSchedule()</code> 一遍算完每条消息的所有时刻点，运行时只查表。</li></ul><p>  我方 <code>typeDur = clamp(字数 × 0.12s, 0.6, 2.6)</code>；对方 <code>thinkDur = clamp(字数 × 0.115s, 1.1, 2.3)</code>。   中文按<strong>字符数</strong>算，0.12s/字 ≈ 3~4 帧/字 @30fps（原版 2.2 帧/字对中文偏快，读作机器代打）</p><ul><li><strong>我方链路（输入框 → 上屏）</strong>：输入框逐字揭示（<code>slice(0, floor(p × len))</code>，<strong>逐字符不分块</strong>——</li></ul><p>  手在打字）→ 打完停 <code>sendGap 0.33s</code>（&quot;手指抬起再按发送&quot;的那一下）→ 发送与上屏<strong>同帧</strong></p><ul><li><strong>发送键两段反馈</strong>：有字即从灰底转墨底（激活）；发送那一瞬 <code>scale 1 → 0.84 → 1</code>，</li></ul><p>  时间窗 ±0.115s 内线性升降（<code>1 − 0.16 × pulse</code>）。按压是&quot;我按下去了&quot;的物理证据</p><ul><li><strong>输入框光标</strong>：打字中<strong>实心不闪</strong>，打完（进入 <code>sendGap</code>）才开始 2Hz 闪 ——</li></ul><p>  &quot;停手了，正要发出去&quot;。全程闪或全程不闪都会丢掉这半拍的语义</p><ul><li><strong>对方链路（输入气泡 → 上屏）</strong>：三点气泡淡入 0.27s（<code>y 10 → 0</code>）→ 一直跳 → 消息上屏前 0.2s 淡出。</li></ul><p>  两者时间窗不重叠，所以永远不会看见&quot;三点和消息叠着&quot;</p><ul><li><strong>三点跳动</strong>：正弦上下跳，<code>w = (sin(2π(t × 1.1 − i/6)) + 1) / 2</code>，<code>y = −5px × w</code>、<code>opacity = 0.45 + 0.55w</code>。</li></ul><p>  <strong>相位差 = 周期/6</strong>（= 周期/(点数 × 2)）——波从左往右推，三点齐跳读作&quot;三个点在呼吸&quot;不是&quot;有人在打字&quot;</p><ul><li><strong>气泡上屏弹入 0.47s</strong>：<code>y 12 → 0</code>（<code>power3.out</code>）+ <code>scale 0.94 → 1</code> + 淡入（<code>power2.out</code>），</li></ul><p>  <code>transform-origin</code> 在下沿（我方右下、对方左下）——从自己那一侧的下方浮起来</p><ul><li><strong>行占位比弹入早 0.07s</strong>：消息行 <code>display</code> 硬切占位（把上面的消息整体顶上去）→ 气泡才落下来。</li></ul><p>  先顶后落，反了就是&quot;气泡落定后画面又抖一下&quot;</p><ul><li><strong>反应表情 0.47s</strong>：消息落定后再 <code>reactDelay 0.27s</code> 贴出，<code>scale 0 → 1</code> 带 <code>back.out(1.9)</code> 回弹</li></ul><p>  （全卡唯一允许过冲的动作），前 35% 淡入。白环 2.5px 让它读作&quot;叠在气泡上&quot;而不是气泡自带的图标</p><ul><li><strong>布局纪律</strong>：消息区 <code>justify-content: flex-end</code>（底部对齐），</li></ul><p>  输入气泡<strong>绝对定位</strong>盖在消息气泡上（不进流）——换成消息时零重排；   气泡靠 <code>opacity</code> 隐藏而不是 <code>display</code>（<strong>在流内占位</strong>，布局只跳 <code>presenceStart</code> 那一次）</p><ul><li><strong>层级</strong>：面板底 → 消息流（气泡）→ 输入气泡（绝对定位覆盖层）→ 反应表情（带白环，最上）→ 输入框</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>charDur</code></td><td>0.12s/字</td><td>我方打字速度，中文 3~4 帧/字；&lt;0.08s 读作机器代打（人手打不了那么快），&gt;0.2s 观众等不动、开始读输入框而不是听你讲</td></tr><tr><td><code>typeMin</code> / <code>typeMax</code></td><td>0.6s / 2.6s</td><td>打字时长的 clamp；短消息 &lt;0.5s 一闪而过（没看见&quot;在打&quot;），长消息 &gt;3s 整段节奏被一条消息吃掉</td></tr><tr><td><code>sendGap</code></td><td>0.33s</td><td>打完到发送的停顿，这一拍就是&quot;手指抬起再按下&quot;；=0 则打完即发、读作自动脚本，&gt;0.6s 观众以为它卡住</td></tr><tr><td><code>thinkPerChar</code></td><td>0.115s/字</td><td>对方&quot;正在输入&quot;时长 = 回复字数 × 它；长回复自动想得久（这是&quot;时刻表自动生成&quot;最值钱的一处），设成常数则每条回复都想一样久、一眼是假</td></tr><tr><td><code>thinkMin</code> / <code>thinkMax</code></td><td>1.1s / 2.3s</td><td>输入气泡时长 clamp；&lt;0.8s 三点还没跳完一个周期（读作闪了一下），&gt;2.8s 观众开始等对方而不是听你</td></tr><tr><td><code>reveal</code></td><td>0.47s</td><td>气泡上屏弹入；&lt;0.25s 读作硬切出现，&gt;0.7s 气泡&quot;飘&quot;上来、丢掉消息的爽脆感</td></tr><tr><td><code>msgGap</code></td><td>0.60s</td><td>消息间隔；&lt;0.35s 两条黏成一条，&gt;1.0s 对话读作&quot;两段独立的话&quot;</td></tr><tr><td><code>reactDelay</code> / <code>reactDur</code></td><td>0.27s / 0.47s</td><td>反应表情比消息落定晚多少 / 弹出时长；delay=0 则读作气泡自带的图标（不是&quot;有人点了个赞&quot;），&gt;0.6s 像迟到的补充</td></tr><tr><td><code>reactPop</code></td><td>1.9（<code>back.out</code>）</td><td>反应回弹强度；这是全卡唯一允许过冲的动作，&gt;3 显廉价、=0 就只是缩放出现</td></tr><tr><td><code>dotAmp</code> / <code>dotCps</code></td><td>5px / 1.1 周期/s</td><td>三点跳幅与频率；幅度 &gt;8px 三点在气泡里乱窜，频率 &gt;1.6 读作焦虑抖动、&lt;0.7 像在呼吸不像在打字</td></tr><tr><td>相位差</td><td>周期/6</td><td>= 周期/(点数×2)，&quot;波从左往右推&quot;的唯一来源；=0（三点齐跳）立刻退化成呼吸灯</td></tr><tr><td><code>pushLead</code></td><td>0.07s</td><td>行占位比气泡弹入早多少；=0 则顶上去和落下来同帧发生、读作&quot;整屏抖一下&quot;</td></tr><tr><td>消息条数</td><td>2~4</td><td>一段自演的容量；&gt;5 条观众开始读聊天记录、离开你的讲述（要展示长记录改用 evidence-scroll-tour）</td></tr></table><h3>已知坑</h3><ul><li>所有气泡直接依次淡入（砍掉输入框与输入气泡两段前戏）——退化成&quot;列表加载动画&quot;，&quot;对话正在发生&quot;的全部价值消失。</li><li>手数帧写死时刻表——换一次文案全废，且必然出现&quot;两个字的消息打了两秒&quot;这种破绽；时刻表必须由字数算。</li><li>对方&quot;正在输入&quot;用固定时长——每条回复都想一样久，一眼是循环播放的贴图；时长必须跟回复长度挂钩。</li><li>我方消息不经过输入框直接弹出——观众读作&quot;对方发的第二条&quot;，分不清谁在说；我方消息的身份靠输入框建立。</li><li>输入框逐字<strong>分块</strong>揭示（4 字一簇）——那是机器 stdout 的手感（见 terminal-typing-log），人打字是一个一个的。</li><li>输入框光标全程闪或全程不闪——丢掉&quot;打字中实心 / 停手才闪&quot;这半拍；停手那一下的闪就是&quot;正要发出去&quot;。</li><li>三点齐跳（相位差 = 0）——读作&quot;三个点在呼吸&quot;，不是&quot;有人在打字&quot;；相位差必须是周期/6。</li><li>输入气泡和消息气泡时间窗重叠——某几帧能同时看见两个气泡，一眼是 bug；淡出必须在上屏前完成。</li><li>输入气泡<strong>进流</strong>（跟消息气泡抢布局）——换成消息那一帧整段重排跳一下；它必须绝对定位盖在上面。</li><li>气泡用 <code>display: none</code> 隐藏——出现时把上面的消息猛地顶一下，与弹入叠成&quot;抖两下&quot;；用 <code>opacity</code> 在流内占位，只在 <code>presenceStart</code> 跳一次。</li><li>反应表情与消息同帧出现——读作气泡自带的图标；晚 0.27s 才是&quot;有人点了个赞&quot;。</li><li>反应表情没有白环（直接贴在气泡上）——和气泡糊成一块，看不出是叠加的反应。</li><li>反应表情被容器裁掉半个——它探出气泡下沿 13px，消息区下留白必须 ≥ 这个量（本 demo 踩过）。</li><li>仿微信绿 / iMessage 蓝 / 带尖角小三角——观众开始读平台品牌（&quot;这是微信截图吗？&quot;），且你要为仿真背锅；灰阶中性气泡（墨底/浅灰底 + 单侧小圆角）已经足够表达&quot;谁在说&quot;。</li><li>一段塞 6 条以上消息——观众切换到&quot;读聊天记录&quot;模式，你的讲述变成背景音；长记录用 evidence-scroll-tour。</li><li>给气泡加渐变/投影/头像照片——聊天面板变成主角；线框灰阶 + 首字头像圆足够。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/chat-message-flow/index.html。<strong>换内容只改 <code>CONFIG.messages</code></strong>——</li></ul><p>  每条 <code>{ from: &quot;me&quot; | &quot;them&quot;, text, react? }</code>，时刻表自动重算（这是本卡设计的全部意义，不要手动补时间）。   节奏参数全在 <code>CONFIG</code>（<code>charDur</code> / <code>sendGap</code> / <code>reveal</code> / <code>msgGap</code> / <code>thinkPerChar</code> / <code>reactDelay</code> / <code>dotAmp</code> / <code>dotCps</code>）；   联系人名与头像首字改 <code>.head</code> 里的文案和 <code>rows</code> 构建处的 <code>av.textContent</code>；   英文文案把 <code>charDur</code> 减半到 0.06s 左右（英文按字符数算，一个词≈5 字符）。   面板尺寸变了要保证消息区下留白 ≥ 反应表情探出量（13px）。</p><ul><li>Remotion 移植：<code>buildSchedule()</code> 是纯函数，原样搬进去、把秒 × <code>fps</code> 变帧号即可（原版 <code>chatFlowSchedule</code> 就是这个结构，</li></ul><p>  并且它导出的 <code>duration</code> 可以直接喂给 <code>calculateMetadata</code>——<strong>帧数由内容算出来</strong>，不用手填 <code>durationInFrames</code>）。   气泡弹入用 <code>spring({frame: frame - revealAt, fps, config: {damping: 18, stiffness: 120}})</code> 驱动 <code>translateY/scale/opacity</code>，   或直接三条 <code>interpolate</code> + <code>Easing.out(Easing.cubic)</code>；   三点用 <code>const w = (Math.sin(Math.PI*2*((frame/fps)*1.1 - i/6)) + 1)/2</code>（<strong>不要用 <code>Math.random</code></strong>，多趟渲染会闪）；   反应表情 <code>spring({config: {damping: 11, stiffness: 220, mass: 0.6}})</code>；   输入框文本 <code>text.slice(0, Math.floor(progress * text.length))</code>；   行占位在帧驱动下用条件渲染 <code>frame &gt;= presenceStart &amp;&amp; &lt;Row/&gt;</code>，气泡本身靠 opacity 占位。</p><ul><li>剪辑软件对应物：剪映/CapCut——每条消息一个气泡贴图/文本框，入场用&quot;向上弹入 + 缩放&quot;组合（把时长压到 0.4~0.5s），</li></ul><p>  输入框那段用一个文本层套&quot;打字机&quot;入场（速度调到 3~4 帧/字），三点用一个三点 PNG 配&quot;上下浮动&quot;循环预设（<strong>必须能设相位/延迟</strong>，否则三点齐跳）或干脆做三个点各自延迟 0.05s 的浮动；   发送键按压用两个 Scale 关键帧（1 → 0.84 → 1，共 0.23s）；反应表情用&quot;弹性放大&quot;入场且<strong>贴在消息入场后 0.27s</strong>。   AE——整段用一个 Slider 当时钟，气泡 Position/Scale/Opacity 三条曲线配 Easy Ease，三点用 <code>-5*(Math.sin(time*2*Math.PI*1.1 - index/6*2*Math.PI)+1)/2</code> 的 Position 表达式（<code>index</code> 用图层序号），   输入框文字用 <code>text.sourceText.substring(0, Math.floor(t))</code> 配 Slider；反应表情用 Scale 关键帧 + Overshoot 表达式。   任何软件的&quot;聊天动画模板&quot;要先检查两件事：有没有输入框前戏、三点是不是齐跳——市面模板九成两条都不合格。</p><h3>动效范围</h3><ul><li>属于本卡的：时刻表由文本长度自动生成这套机制（我方 <code>clamp(字数 × charDur)</code>、对方 <code>clamp(字数 × thinkPerChar)</code>，换文案不重数帧）；我方链路的三拍（输入框逐字符揭示 → <code>sendGap</code> 停顿 → 发送与上屏同帧）；发送键的两段反馈（有字转激活 + 发送瞬间 <code>scale −16%</code> 的 ±0.115s 时间窗按压）；输入框光标&quot;打字中实心不闪 / 停手才 2Hz 闪&quot;这半拍语义；对方链路的两拍（三点气泡淡入 0.27s + 跳动 + 上屏前 0.2s 淡出，时间窗不重叠）；三点正弦跳动与&quot;相位差 = 周期/(点数×2)&quot;这条纪律；气泡上屏弹入（<code>y 12→0</code> + <code>scale .94→1</code> + 淡入 0.47s，<code>transform-origin</code> 在自己那一侧下沿）；行占位比弹入早 0.07s 的先顶后落顺序；反应表情晚 0.27s 贴出 + <code>back.out(1.9)</code> 回弹 + 白环；布局纪律（消息区底部对齐、输入气泡绝对定位不进流、气泡靠 opacity 在流内占位）；&quot;一段 2~4 条&quot;这个容量上限。</li><li>不属于本卡的：demo 那三条讨论筛选器的具体文案、&quot;林工 · 设计评审&quot;这个联系人与首字头像、<code>👍</code> 这个具体表情、灰阶皮的全部取值（<code>#1d1d1f</code> 墨底气泡 / <code>#f0f0f2</code> 浅灰气泡 / <code>#fafafa</code> 输入框底 / 16px 圆角 + 单侧 6px 小圆角）、460×448 这个面板尺寸与 16px 字号、<code>+</code> 与箭头两个图标、&quot;在线&quot;状态行、角标主持人（数字人）、&quot;聊天面板&quot;这个载体（同一套时序可以套在评论区、客服工单、AI 对话流上）。</li><li>迁移接口：<code>CONFIG.messages</code> 是唯一的迁移入口——把消息换成真实记录的节选（保留&quot;我问 → 对方想 → 对方答&quot;的往复结构，2~4 条），反应表情只给最关键的那一条；语速变化时改 <code>msgGap</code> 与 <code>sendGap</code>（<strong><code>charDur</code> / <code>thinkPerChar</code> / <code>reveal</code> / <code>dotCps</code> 保持不变</strong>——这四个是手感常量，跟着语速缩放会让快语速下的打字变成机器代打）；换语言改 <code>charDur</code>（中文 0.12s/字、英文约 0.06s/字符）；尺寸按画幅等比缩放，消息区下留白必须 ≥ 反应表情探出量；竖屏面板可占满画幅宽度、消息区更高（能多显示一条历史消息，但自演条数仍不超过 4）；换成目标产品皮时只改两个气泡底色与文字色 + 圆角，<strong>时刻表与所有时长一律不动</strong>。</li><li>底色要求：白底即可（中性聊天面板天生浅色，墨底气泡与浅灰气泡在白底上对比充足）。深色皮同样成立，唯一硬要求是<strong>我方与对方两个气泡的明度差要保住</strong>（深底上把我方改为亮底深字、对方改为略亮于面板的深灰），反应表情的白环随之改为面板底色的同色环——它的作用是&quot;和气泡隔开&quot;，不是&quot;白&quot;。</li></ul>","cursor-actor-demo":"<h3>意图</h3><p>口播讲&quot;这个工具怎么用&quot;时，真实录屏的光标只有 12px、轨迹又直又抖，观众在手机上根本看不见操作 落在哪；纯截图切换又丢掉了&quot;是我在操作&quot;的因果感。光标演员把鼠标当成一个<strong>放大的演员</strong>： 它走到哪、停多久、点什么，都是导演过的，观众的视线被它带着走，而元素的即时响应替口播完成了 &quot;你看，点完就变了&quot;这句话。命门：<strong>光标要够大</strong>（放大到真实尺寸 2~3 倍，缩略图尺寸下仍认得出是箭头）、 <strong>每个动作必须有响应</strong>（点了没反应等于演砸，观众读作静态图配了个假光标）、 <strong>一动作一口播词</strong>（光标动作是语音的节拍器，密了像演示录屏、疏了像卡顿）。</p><h3>动效核心</h3><ul><li><strong>光标</strong>：深墨实心 + 白描边 + 柔投影的箭头（SVG，30×45px @960 舞台 ≈ 真实尺寸 2.5 倍），</li></ul><p>  <code>transform-origin: 0% 0%</code> 锚在箭头尖——按压微缩时尖端不移位。   造型走<strong>圆角贝塞尔轮廓</strong>（尖端锐、腰身直、肩与尾跟倒角 0.4~0.9），不是尖锐折线多边形；   实现用<strong>同一条 path 描两遍</strong>：先 <code>stroke-width: 2.05</code> 的白色描边层（<code>stroke-linejoin/linecap: round</code>）、   再压深墨 <code>#1d1d1f</code> 实心层，得到粗细均匀的白轮廓（比给单层 path 加 stroke 更干净，不会在锐角处爆尖）；   外加 <code>filter: drop-shadow(0 2px 5px rgba(0,0,0,.28))</code> 让光标浮在 UI 之上。   <code>overflow: visible</code> 必须开——白描边与投影要能溢出 viewBox</p><ul><li><strong>移动</strong>：x / y 分开插值、用不同缓动（x <code>power2.inOut</code> + y <code>sine.inOut</code>），</li></ul><p>  合成出来的轨迹天然是弧线；单段 0.3~0.6s（跨区域 0.5~0.6s，相邻目标 0.3~0.4s）。   <strong>绝不做直线匀速平移</strong>——那是图层在被推，不是手在动</p><ul><li><strong>悬停</strong>：到位后停 0.2s 才点（&quot;要点这里&quot;要给观众看见）；同时目标出 hover 态——</li></ul><p>  行底色 <code>#f0f0f0</code> 淡入 0.16s / 边框加深，<code>power2.out</code></p><ul><li><strong>按压</strong>：光标 <code>scale 1→0.9→1</code>，各 0.09s；同帧目标元素 <code>scale 1→0.94→1</code>（回弹段稍长 1.6×）</li><li><strong>按压涟漪</strong>：从箭头尖为圆心弹出一圈圆环，<code>scale 0.3→1.6</code> + <code>opacity 1→0</code>，0.35s</li></ul><p>  （扩散 <code>power2.out</code> / 淡出 <code>power2.in</code>）——比按压本身长，按完还在扩，&quot;点击&quot;这个动作才有确认感。   圆环用与光标同一套 <strong>深芯 + 白边</strong>语言（<code>1.7px</code> 深环 + 内外各一道 <code>1.5px</code> 白 <code>box-shadow</code>）：   涟漪常常正好扩过刚变深的开关轨道，纯深色环压上去会糊成一团。   层级夹在 UI 与光标之间（<code>z-index</code> 29，光标 30）；圆心用负偏移（<code>left/top: -15px</code>，即 -半径）把   元素中心对到 x/y 坐标，这样涟漪与光标可以共用同一组落点坐标</p><ul><li><strong>状态切换在&quot;按下&quot;那一刻就发生</strong>（按压中点 ≈ 0.55×press 起算），不等抬手——</li></ul><p>  等抬手会有一帧&quot;点了没反应&quot;的延迟感</p><ul><li><strong>三种响应语言</strong>（按目标类型选一种，别混）：</li></ul><p>  ① 开关：滑块 x 滑到轨另一端 0.28s <code>power2.out</code> + 轨道底色转深 + 滑块转白   ② 按钮：底色/边框变深 + 按压微缩   ③ 缩略图落位：从<strong>光标位置</strong>为原点 <code>scale 0.4→1</code> + 淡入 0.34s <code>power3.out</code>（<code>transform-origin</code> 对齐落点内的光标位置）</p><ul><li><strong>拖拽</strong>：按住后被拖元素与光标共用同一条移动曲线（同起点同时长），拖速比空移慢</li></ul><p>  （0.62s vs 0.52s——拖着东西走的手会更稳）；松手时拖影 0.12s 淡出、目标位 pop-in 同帧接上</p><ul><li><strong>离开即熄</strong>：光标移开后 hover 高亮 0.2s 退回（响应只在光标停留期成立，不然满屏都是亮的行）</li><li><strong>层级（三层，硬约束）</strong>：底 UI &lt; 响应高亮层（hover 底色，压在底 UI 之上、文字之下）&lt; 光标（最顶）。</li></ul><p>  光标被任何元素盖住一次，&quot;演员&quot;的身份立刻破产</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>光标尺寸</td><td>30×45px @960 宽（真实的 2.5 倍）</td><td>&lt;20px 手机上看不见操作落点，&gt;50px 箭头吃掉半个控件、盖住要被读的状态变化</td></tr><tr><td><code>moveLong</code> / <code>moveShort</code></td><td>0.52s / 0.34s</td><td>跨区域 / 相邻目标的移动耗时；&lt;0.2s 读作瞬移（丢掉&quot;手在移动&quot;的因果），&gt;0.8s 口播已经说完下一句了</td></tr><tr><td><code>moveDrag</code></td><td>0.62s</td><td>拖拽移动耗时，必须 &gt; 空移；等于空移则&quot;拖着重物&quot;的手感消失</td></tr><tr><td><code>hoverHold</code></td><td>0.22s</td><td>到位到点击之间的微停顿；0 则读作程序自动点击，&gt;0.5s 观众以为光标卡住了</td></tr><tr><td><code>press</code></td><td>0.09s</td><td>按压下压时长（抬手同值）；&gt;0.2s 像慢动作按键，0 则完全没有&quot;点下去&quot;的实感</td></tr><tr><td><code>pressScale</code></td><td>0.9</td><td>光标按压微缩倍数；&lt;0.8 像箭头被吸进屏幕，1.0 则点击瞬间无反馈</td></tr><tr><td><code>ripple</code></td><td>0.35s</td><td>按压涟漪扩散耗时；&lt;0.2s 一闪而过读不到&quot;确认&quot;，&gt;0.6s 涟漪还没散下一个动作已经开始了</td></tr><tr><td><code>rippleFrom</code> / <code>rippleTo</code></td><td>0.3 / 1.6</td><td>涟漪起止倍数（基准直径 30px = 光标宽）；<code>rippleTo</code> &gt;2 圆环比控件还大、抢戏，&lt;1.2 扩不出去像个静止的点</td></tr><tr><td><code>hlIn</code></td><td>0.16s</td><td>hover 高亮淡入；&gt;0.3s 高亮追不上光标（人到了色还没到）</td></tr><tr><td><code>toggleSlide</code></td><td>0.28s</td><td>开关滑块行程；&lt;0.15s 看不清滑块滑过去（读作直接换图），&gt;0.5s 开关变成主角抢戏</td></tr><tr><td><code>popIn</code> / <code>popFrom</code></td><td>0.34s / 0.4</td><td>缩略图落位弹入；<code>popFrom</code> &gt;0.7 弹入幅度不够、看不出&quot;从光标处长出来&quot;，&lt;0.2 像从一个点炸开</td></tr><tr><td>动作间隔</td><td>≈1s/动作</td><td>一动作一口播词；&lt;0.6s 观众来不及看清响应，&gt;1.5s 画面在等语音、节奏塌</td></tr></table><h3>已知坑</h3><ul><li>光标用真实系统尺寸——手机上一片糊，观众根本不知道点了哪里；本卡的第一条就是&quot;放大&quot;。</li><li>直线匀速平移到目标——读作图层被程序推着走。必须 x/y 分缓动出弧线 + 两端加减速。</li><li>光标一路加抖动噪声模拟手抖——不做（库内定版禁 line boil / 定格抖动）；&quot;像手&quot;靠弧线与加减速，不靠噪声。</li><li>点了目标没有任何响应，或响应延迟到抬手之后——一眼假；观众读作&quot;截图上贴了个假光标&quot;。</li><li>hover 高亮一直亮着不退——满屏发亮的行，观众不知道光标此刻在哪。</li><li>光标被弹出的卡片/对话框盖住——层级破产，演员被道具挡在后面。</li><li>按压时光标缩放锚点在中心——箭头尖会跟着位移，&quot;尖端咬住目标&quot;的准确感丢了；必须锚 <code>0% 0%</code>。</li><li>光标画成尖锐折线多边形 + 细描边（系统箭头的直接摹写）——放大 2.5 倍后每个折角都在扎人，</li></ul><p>  一眼&quot;截图里抠出来的系统控件&quot;；轮廓要走圆角贝塞尔、描边要粗到 2px 上下，放大了才立得住。</p><ul><li>光标不加投影——箭头与 UI 贴在同一个平面上，&quot;演员站在界面前面&quot;的层次没有了；</li></ul><p>  但投影别overdo（<code>blur</code> &gt;8px、<code>y</code> &gt;4px 就开始像贴纸浮起来）。</p><ul><li>涟漪只有一个深色圆环——扩过开关刚变深的轨道时直接糊掉（涟漪与它撞色的概率极高，</li></ul><p>  因为它总是在刚被点亮的控件上扩）；深环两侧各夹一道白就永远读得出。</p><ul><li>涟漪的 SVG/元素忘了纳入重播复位段——重播第一帧残留着上一轮扩到最大的圆环。</li><li>一次动作里同时上三种响应（变色+滑动+pop-in 全来）——观众不知道该看哪个变化，一个目标一种响应语言。</li><li>动作排得比语音密（0.3s 点一下）——退化成加速录屏，节奏与讲述脱钩；光标是节拍器，节拍由词决定。</li><li>拖拽时被拖元素与光标不同步（各自一条曲线）——两个东西各走各的，&quot;抓住了&quot;的因果感断掉。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/cursor-actor-demo/index.html。换 UI 只改 <code>#stage</code> 内的灰阶线框结构（本卡的动作序列按选择器取目标：<code>.pref-row</code> 行 / <code>.tg</code> 开关 / <code>.thumb.pick</code> 缩略图 / <code>.slot</code> 落点）；目标点用运行时 <code>P(el, fx, fy)</code> 反算舞台坐标（换布局不用改任何数字，<code>fx/fy</code> 是元素内相对落点）；节奏全在顶部 <code>CONFIG</code>（<code>moveLong</code> / <code>moveShort</code> / <code>moveDrag</code> / <code>hoverHold</code> / <code>press</code> / <code>pressScale</code> / <code>ripple</code> / <code>rippleFrom</code> / <code>rippleTo</code> / <code>hlIn</code> / <code>toggleSlide</code> / <code>popIn</code> / <code>popFrom</code> / <code>startDelay</code>）；<code>moveTo()</code> / <code>press()</code> 两个函数 + <code>CONFIG</code> 就是可摘走的动效本体（<code>press(at, p)</code> 的第二参是本次按压的落点，涟漪靠它把圆心贴到箭头尖）。光标形状换成手型/文本光标只改 <code>.ui-cursor</code> 里那两条同形 path（描边层与实心层要同步改，保持 <code>transform-origin</code> 锚在热点）。</li><li>Remotion 移植：光标位置 <code>x: interpolate(frame, [t0, t1]*fps, [x0, x1], {easing: Easing.inOut(Easing.quad), extrapolate*: 'clamp'})</code>、<code>y</code> 同区间换 <code>Easing.inOut(Easing.sin)</code>——两轴不同 easing 就是弧线；按压 <code>scale</code> 用 <code>[tp, tp+3, tp+6] → [1, 0.9, 1]</code>，涟漪同起点另开一组 <code>scale: [tp, tp+11] → [0.3, 1.6]</code> + <code>opacity: [tp, tp+11] → [1, 0]</code>（<code>Easing.out(Easing.quad)</code> / <code>Easing.in(Easing.quad)</code>），圆环用 <code>borderRadius: '50%'</code> 的 div 并把 <code>left/top</code> 设为 -半径；开关滑块 <code>translateX: interpolate(frame, [tOn, tOn+8], [0, 20], {easing: Easing.out(Easing.quad)})</code>，轨道色用 <code>interpolateColors</code>；pop-in <code>scale: interpolate(frame, [tUp, tUp+10], [0.4, 1], {easing: Easing.out(Easing.cubic)})</code> + <code>transformOrigin</code> 写成落点内光标的百分比坐标；拖拽阶段让被拖元素与光标读同一组 interpolate（只差一个常量偏移）。整段动作序列建议做成 <code>ACTIONS</code> 数组（<code>{target, at, kind}</code>）在组件里 map，帧号由词级时间戳换算。</li><li>剪辑软件对应物：剪映/CapCut——导入一张放大的光标 PNG（去底）单独一轨，打&quot;位置&quot;关键帧并把两端设&quot;缓入/缓出&quot;，UI 响应用同一截图的两个版本（关/开）在按下帧硬切 + 开关滑块单独一层做位移关键帧；AE——光标层 Position 关键帧 + 空间插值改&quot;贝塞尔&quot;手动拉出弧线（关键：别用线性），Scale 关键帧做按压，开关滑块 Position + Easy Ease，缩略图 pop-in 用 Scale 关键帧并把锚点拖到光标位置；录屏软件的&quot;放大光标/点击高亮&quot;内置功能一律不用（尺寸与节奏都不受控，且自带涟漪特效）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：光标的移动语言（x/y 分缓动合成弧线、两端加减速、跨区域 0.5~0.6s / 相邻 0.3~0.4s、拖拽段更慢）；到位后 0.2s 悬停微停顿；按压（光标 scale 1→0.9→1、锚点在箭头尖 + 目标 scale 1→0.94→1 + 从箭头尖扩散的涟漪 scale 0.3→1.6 / opacity 1→0 共 0.35s）；&quot;状态切换发生在按下那一刻、不等抬手&quot;这条时序纪律；三种响应语言（开关滑块滑动 + 轨道转深 / 按钮变色 / 缩略图以光标为原点 scale 0.4→1 弹入）及&quot;一个目标只用一种&quot;的纪律；hover 高亮的淡入淡出与&quot;离开即熄&quot;；拖拽时被拖元素与光标共用同一条曲线；三层层级（底 UI &lt; 响应高亮 &lt; 光标，光标永远最顶）；&quot;一动作一口播词、约 1s/动作&quot;的节奏契约。</li><li>不属于本卡的：demo 里那个&quot;生成设置&quot;假 UI 的结构与排版（开关行/对话框/素材库全是演示语境）、灰阶线框这套配色（<code>#f0f0f0</code> hover 底、<code>#1d1d1f</code> 开关轨、<code>#c8c8cd</code> 线稿色都是占位取值）、示例台词与字幕切换、角标主持人（数字人）、缩略图里的 SVG 线稿内容、深墨箭头这个具体光标形状与配色（手型/文本光标同样成立，只要热点锚点跟着换；填充色是占位取值，深底翻白即可）。</li><li>迁移接口：光标尺寸按画幅等比缩放（以&quot;缩略图尺寸下仍认得出箭头&quot;为准，约画幅短边 6~8%）；动作序列 = <code>(目标元素, 落点 fx/fy, 响应类型)</code> 的列表，目标点运行时反算，换任何 UI 截图都不用改坐标；时长全量对齐语音——把每个动作的 <code>at</code> 换成该口播词的词级时间戳（<code>hoverHold</code> 之后就是词的重音点）；响应色换成目标 UI 自己的 hover/active token（深色 IDE 截图把 hover 底色改为提亮、开关轨改为高亮色，光标描边由黑改白保持与底的对比）；pop-in 的 <code>transform-origin</code> 必须跟着落点内光标的实际位置改，不能写死。</li><li>底色要求：白底即可（demo 的浅色 UI 是最常见情形）。深色 UI 截图同样成立，唯一硬要求是<strong>光标与底的对比必须保住</strong>——本卡的&quot;深墨实心 + 白描边&quot;在浅底与深底上都成立（白描边就是深底上的保命层），深底只需把 <code>drop-shadow</code> 调淡、必要时把实心层翻成白色并改用深色描边层；涟漪同理（深芯白边两色互换）。hover 高亮由&quot;加深&quot;改为&quot;提亮&quot;。</li></ul>","evidence-scroll-tour":"<h3>意图</h3><p>口播念长文档证据时，逐段截图切页会打断&quot;这是同一份文件&quot;的连续感——把整页拉成一条长卷慢慢滚过去， 观众亲眼看到上下文完整、重点是从原文里&quot;路过&quot;时停下来看的，可信度远高于跳切。命门： <strong>页面是唯一动元素</strong>（标注预先画好随页走，不现场画——现场画会分走视线，滚动的&quot;巡览感&quot;就没了）、 <strong>匀速+关键处减速停留</strong>（滚速对齐讲述节奏：匀速段是铺垫语速，停留段是&quot;你看这一条&quot;）、 <strong>停留必须防死</strong>（停 1~2s 里目标标注做连续呼吸，不是随机抖，也不是整帧冻结）。</p><h3>动效核心</h3><ul><li>长页（2.5~4 屏高的文档/README/搜索结果截图）放进固定视口（可带极简窗口框示意&quot;这是一份文件&quot;），页面 <code>y</code> 是全卡唯一持续运动的属性</li><li>起滚：<code>power2.in</code> 缓入约 0.5s 接上匀速（避免第 0 帧突然满速像 seek）</li><li>匀速段：<code>ease: none</code>，速度约 10% 页高/s（960×540 demo 里 130px/s；折算任何尺寸都以&quot;观众能扫读小标题&quot;为准）</li><li>预置标注：红框/下划线/色块直接画在页面元素上（<code>position:relative</code> 包裹 + 绝对定位框），随页滚动，无自身入场动画</li><li>减速停留：距停点提前 ~90px（约 1s）用 <code>power2.out</code> 减速，让目标条目停在<strong>视口垂直中线</strong>附近；停 1~2s 对齐台词&quot;关键就在这条&quot;</li><li>停留防死：目标红框 scale 1→1.03→1 一次完整呼吸（<code>sine.inOut</code>、yoyo，时长≈停留时长），连续缓动不抖动</li><li>再启动：<code>power2.in</code> 约 0.6s 加速回匀速，滚完剩余页面后自然停在页尾</li><li>变体①（2.5D 斜置）：视口外层加 <code>perspective</code> + <code>rotateX 30~45°</code>，页面像铺在桌上被镜头掠过，滚动逻辑不变</li><li>变体②（光标伴随）：叠一枚光标素材在停留时移向目标条目，指向与台词同步；光标只在停留段出现</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>scrollSpeed</code></td><td>130px/s（≈10% 页高/s）</td><td>快了像在跳过证据、观众读不到小标题；&lt;70px/s 铺垫段拖节奏，观众先于讲述读完</td></tr><tr><td><code>stopHold</code></td><td>1.5s</td><td>停留时长对齐这句台词；&lt;0.8s 观众没来得及聚焦，&gt;2.5s 该切下一卡了</td></tr><tr><td><code>stopAlign</code></td><td>0.5（视口中线）</td><td>目标条目停的位置；&gt;0.7 沉在底部像没停到，&lt;0.3 顶着窗框压抑</td></tr><tr><td><code>decelDist</code></td><td>90px</td><td>减速提前量；太短像急刹（程序 seek 感），太长观众提前知道要停、悬念没了</td></tr><tr><td><code>accelDist</code></td><td>45px</td><td>起滚/再启动的加速距离；0 会瞬间满速，读作跳变</td></tr><tr><td><code>breathScale</code></td><td>1.03</td><td>停留期红框呼吸幅度；&gt;1.06 像警报闪烁，1.0 整帧冻结画面死</td></tr></table><h3>已知坑</h3><ul><li>停留时现场画红框/划线——那是 scribble-annotation 卡的事；本卡标注必须预置随页走，现场画会夺走&quot;页面是唯一动元素&quot;的巡览感。</li><li>匀速直接急停、停完瞬间满速——速度阶跃读作程序 seek，不是&quot;人拖着页面看到重点停下来&quot;。</li><li>停留 1~2s 整帧完全静止——画面死掉，观众以为卡顿；防死靠标注连续呼吸，不靠随机抖。</li><li>滚速忽快忽慢或加手抖噪声——观众正在扫读，速度噪声直接造成晕动感。</li><li>页面不足 2 屏高——没有&quot;长卷巡览&quot;的信息量感，直接整页展示（media-pop-in）更诚实。</li><li>关键条目停在视口边缘——观众不知道该看哪一行，停留白停。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/evidence-scroll-tour/index.html。换证据改 <code>.doc-page</code> 内文（红框停点是 <code>#stop-box</code>，任意换到别的句子上，停点位置运行时自动测量）；换标注色改 <code>.mark-box</code> 的 <code>border-color</code>；节奏全在顶部 <code>CONFIG</code>（<code>scrollSpeed</code> / <code>stopHold</code> / <code>stopAlign</code> / <code>decelDist</code> / <code>accelDist</code> / <code>breathScale</code>）。多个停点把&quot;减速→呼吸→加速&quot;三段照抄串联即可。</li><li>Remotion 移植：把&quot;位移-时间&quot;曲线拆成分段 <code>interpolate(frame, [t0,t1,t2,t3,t4,t5]*fps, [0, -accelDist, -(stopY-decelDist), -stopY, -stopY, -(stopY+accelDist), -total])</code>，各段 easing 依次 <code>Easing.in(Easing.quad)</code> / linear / <code>Easing.out(Easing.quad)</code> / 常值（hold）/ <code>Easing.in(Easing.quad)</code> / linear；段时长按 <code>距离/scrollSpeed</code>（加减速段 <code>2*dist/v</code>）；呼吸用 hold 区间内的 <code>Math.sin</code> 单周期映射 scale。</li><li>剪辑软件对应物：剪映——长截图导入后打&quot;位置&quot;关键帧，匀速段两点线性、停点前后各加一个关键帧并对减速点右键&quot;缓出&quot;/启动点&quot;缓入&quot;；AE——Position 关键帧 + 停点两侧 Easy Ease（速度图里把停点速度拉到 0），红框呼吸用 scale 表达式 <code>1+0.03*Math.sin(...)</code>; CapCut 同剪映 keyframe 做法。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：长页 <code>y</code> 轴匀速上滚（≈10% 页高/s、ease none）及其&quot;缓入起滚→匀速→提前减速（power2.out）→停 1~2s→加速再启动（power2.in）→滚完&quot;的完整速度曲线；停留期目标标注一次连续呼吸（scale 1→1.03→1、sine.inOut）；&quot;标注预置随页滚动、不现场画&quot;的原则。一条速度曲线 + 一个防死呼吸是本卡的全部。</li><li>不属于本卡的：页面内容与排版（demo 的假协议文档、灰阶占位条）、窗口框样式、字幕文案与切换、角标主持人；红框的绘制入场动画（现场画属 scribble-annotation）；2.5D 斜置姿态与光标素材本身（变体只定义接口，素材另配）。</li><li>迁移接口：<code>scrollSpeed</code> 对齐讲述语速（换尺寸按页高比例折算）；停点=任意页内元素（运行时测 offset，内容随便换）；多停点串联&quot;减速→呼吸→加速&quot;三段；标注色是单一 semantic 色 token（深色截图换高对比色）；2.5D 变体只需在视口外层加 perspective/rotateX，速度曲线原样复用。</li><li>底色要求：白底即可（长页本身通常是浅色文档；深色终端/IDE 截图同样成立，仅需换标注色保证对比）。</li></ul>","media-pop-in":"<h3>意图</h3><p>证据素材需要入场仪式感——&quot;啪啪啪&quot;拍上桌的密度让观众相信&quot;证据确凿&quot;，规规矩矩的轮播只是配图。 命门：<strong>要歪要叠</strong>（随机 ±5~10° 旋转 + 后来者压前者一角，工整排版=PPT）、 <strong>回弹收尾</strong>（back.out 过冲到 1.02 再落回 1，直线放大没有&quot;拍&quot;的手感）、 <strong>错峰要密</strong>（100~150ms 一张，拉开到 0.5s 以上就丢了&quot;甩&quot;的气势）。</p><h3>动效核心</h3><ul><li>每张素材：白描边 6~10px + 投影（白底上 <code>0 12px 26px rgba(0,0,0,.16)</code> 即可分层，深底用更重的一层）+ 圆角 4px</li><li>入场：scale 0.8→1（<code>back.out(1.7)</code> 自带过冲到 ~1.02）0.25~0.35s；opacity 0→1 在前半程完成；rotation 从&quot;目标角度再歪 6°&quot;收到目标角度（旋转跟着收正，比固定角度更有落位感）</li><li>transform-origin 设 50% 60%（略低于中心，像被手按下去）</li><li>多张 stagger 100~150ms，位置手工错开、后来者层级更高压住前者一角</li><li>全部落位后整组极轻呼吸（scale ±0.8%，2~3s 周期，可选）防止画面死掉</li><li>退场：整组或逐张 0.15s scale→0.9 + opacity→0，比入场快（入场比出场用力是通则）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>单张时长</td><td>0.3s</td><td>&gt;0.4s 拖节奏像幻灯片；&lt;0.2s 密到看不清是什么素材</td></tr><tr><td>回弹力度 back.out</td><td>1.7</td><td>调大到 3 是综艺感&quot;哐哐&quot;砸；1.2 以下几乎无过冲，变普通淡入放大</td></tr><tr><td>起始缩放</td><td>0.8</td><td>更小（0.5）冲击感强但像从远处飞来；0.9 以上行程太短看不出弹</td></tr><tr><td>旋转错落</td><td>±5~10°</td><td>全部同角度=模板感；超过 15° 素材内容读不清</td></tr><tr><td>张间错峰</td><td>150ms</td><td>密度感的命：&gt;300ms 变逐张展示，&lt;80ms 观众数不清张数</td></tr><tr><td>白边宽度</td><td>8px</td><td>白边是&quot;实体照片&quot;的暗示；没有白边就只是浮着的截图</td></tr></table><h3>已知坑</h3><ul><li>不旋转不堆叠——排得整整齐齐就是 PPT SmartArt，&quot;甩证据&quot;的现场感全无。</li><li>每张都弹到正中央再轮播——密度感消失，观众也记不住前一张；要同屏堆叠共存。</li><li>入场超过 0.4s——口播语速下一句话能说 3 个词，素材还没落地。</li><li>素材之间零重叠——各占一块像九宫格；压角 10%~20% 才像随手拍上去的一沓。</li><li>投影太小或没有——素材贴死在背景上，&quot;拍上来&quot;的空间层次消失。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/media-pop-in/index.html。三张假截图是纯 CSS（<code>.shot-browser/.shot-chat/.shot-pay</code>），整块换成 <code>&lt;img&gt;</code> 即可用真素材；每张的落位角度在 <code>data-rot</code>，节奏在 <code>CONFIG.stagger/popDur</code>。</li><li>Remotion 移植：每张一个 <code>spring({frame: frame - i*4, config: {damping: 12, stiffness: 200}})</code> 驱动 scale，opacity 用同 spring 的前半段 clamp；旋转 interpolate 从 rot-6 到 rot。</li><li>（实测变体）分屏压上：不在人物旁边堆素材，而是人物缩入下方圆角卡、B-roll 落入上半区，两件事错峰 3~5 帧完成——整版一次换装，比逐张拍上来更干净，适合只有一条素材要看的时刻。人物缩位这一半已独立成卡（见 references/cards/host-shrink-to-chip.md）。见 TheAIScaler（Apm_oCzPEQs）。</li><li>（实测变体）模糊甩入：把 scale 弹跳通道换成&quot;位移 + 方向运动模糊 + 0.2s 急停&quot;，气质更凌厉，已独立成卡（见 references/cards/motion-blur-slam-in.md）；同一段素材两者二选一，不叠用。</li><li>剪辑软件对应物：剪映&quot;入场动画→弹入/甩入&quot;逐张错帧摆放；AE 是 scale + rotation 关键帧套 Overshoot 表达式；CapCut &quot;Bounce In&quot;。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：单张素材 scale 0.8→1 带 back.out(1.7) 过冲落位（0.25~0.35s）、opacity 在前半程完成；rotation 从&quot;落位角度再多歪 6°&quot;收正到落位角度（旋转跟着收正才有&quot;拍&quot;的手感）；transform-origin 50% 60%（略低于中心，像被手按下去）；多张 stagger 100~150ms 的密度感与&quot;后来者压前者一角&quot;的层级堆叠；白边 + 投影这层&quot;实体素材&quot;语义（离开背景一层才叫&quot;拍上来&quot;）；全部落位后整组 ±0.8% 极轻呼吸；退场比入场快（0.15s scale→0.9 + 淡出）。</li><li>不属于本卡的：三张假截图的内容与灰条排版、素材的具体位置与落位角度值、字幕文案、主持人占位。</li><li>迁移接口：换真素材把 <code>.shot-*</code> 内部整块替换成 <code>&lt;img&gt;</code>，保留 <code>.shot</code> 的白边 + 投影与 <code>data-rot</code>；<code>popDur</code> / <code>stagger</code> 按&quot;甩证据&quot;的语速缩放（stagger 别超 300ms 否则丢密度）；<code>overshoot</code> 调拍击力度、<code>fromScale</code> 调行程、<code>preTilt</code> 调收正幅度；白边宽度与投影强度随输出尺寸等比缩放。</li><li>底色要求：白底即可，但<strong>素材的白边与投影必须保留</strong>——白底上靠这一层投影把素材与舞台分开；若目标是纯白极简风，把投影调弱到 8%~10% 黑即可，不要归零。</li><
