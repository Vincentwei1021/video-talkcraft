trong>至少留 12~16px。按行盒直觉给 14px 会让块压进主标题末字 7px（用户 2026-08-25 审片反馈）；&gt;60px 两行脱开，副题读作独立的第二个元素</td></tr><tr><td><code>slabDur</code></td><td>0.28s</td><td>块冲入时长，能量旋钮；&lt;0.2s 块像瞬移（没有&quot;冲&quot;的过程），&gt;0.4s power4 的猛劲被摊平，读作普通滑入</td></tr><tr><td>块的缓动</td><td><code>power4.out</code></td><td><strong>全卡唯一的 power4</strong>；换成 power2 立刻读作&quot;滑进来&quot;（速度线就没有存在理由了）</td></tr><tr><td><code>lineLens</code></td><td>[42, 30, 22] px</td><td>三道线长度，<strong>必须不等</strong>；等长读作印刷符号 ≡，长度差 &lt;5px 等于等长；最长那道 &gt;0.8 字宽会长出画面左边</td></tr><tr><td><code>lineStagger</code></td><td>0.067s（2 帧）</td><td>线间错峰；0 三道线一起张开（读作一个整块图形），&gt;0.15s 读作三个独立动效依次出现</td></tr><tr><td><code>lineOpen</code></td><td>0.09s</td><td>单道线张开时长；&gt;0.2s 线&quot;画出来&quot;的过程被看清，残影变成了手绘线（那是 B 组的语言）</td></tr><tr><td><code>hold</code></td><td>1.5s</td><td>收尾定格；本卡节奏快，hold 给到 2s 以上会让&quot;快&quot;这个语义在等待里稀释</td></tr></table><h3>已知坑</h3><ul><li>速度线留在屏上（不淡出或淡出 &gt;0.5s）——它从运动残影变成装饰性三道杠，本卡最贵的那 0.4s 白做了。</li><li>字与块硬绑一起进场（省掉 <code>lagPx</code>）——整体读作一张 PNG 在平移，块和字之间没有惯性差，慢放下一眼是模板。</li><li>块忘了 <code>overflow: hidden</code>——字的反向补偿变成&quot;字从块外面挪进来&quot;，起手那一帧字露在块左边，构图直接错。</li><li><strong><code>slabFrom</code> 给得不够远（起始帧能看到块的一截）——2026-08-25 用户审片实测的错法</strong>。</li></ul><p>  原来的 −180 只够块走 180px，起始帧块的右侧大半还在画内，读作&quot;块本来就在那儿滑了一下&quot;，   &quot;从画外冲进来&quot;这个前提就没了。起点按判据算：块右缘距舞台左缘 ÷ cos(斜切角)，再留一点余量。</p><ul><li><strong>副题块压住主标题</strong>——块斜切后右上角是最高点，正好顶在主标题末字下方。</li></ul><p>  两行间距按 <code>margin-top</code> 直觉给（14px 那档）时块会压进主标题字面 7px。   净空要按<strong>字面底</strong>（不是行盒底）算，留 12~16px。</p><ul><li>三道速度线等长——读作印刷符号 ≡ 或&quot;信号强度图标&quot;，不是拖尾。</li><li>速度线用 <code>power2.out</code> 淡出（而不是 <code>power2.in</code>）——淡出的前半段很慢，线在屏上&quot;赖着&quot;，读作刻意的装饰淡出而不是被抹掉。</li><li>三道线各自单独 rotate（不挂在块的斜切容器下）——一定与块不平行（浮点误差 + 各自的 origin 不同），且改斜切角要改四处。</li><li>块用 <code>power2.out</code> 冲入——刹车感没了，速度线失去存在理由（没有&quot;太快&quot;这件事哪来的残影）。</li><li>线的 <code>transform-origin</code> 取左端（<code>0% 50%</code>）——线会从块的左缘往<strong>左端点</strong>长，读作&quot;线在往右缩&quot;，方向完全反了。</li><li>块内字的 <code>x</code> 与块的 <code>x</code> 写在同一个元素上（两个值相加）——做不出追赶：单个 transform 只有一个位置，追赶需要两级坐标叠加。</li><li>速度线用强调色之外的颜色（比如灰）——它是块的残影，必须与块同色；灰线读作&quot;另一个元素&quot;，且在白底上几乎看不见。</li><li>主标题也加冲入（想&quot;整体统一&quot;）——一屏两个方向性入场，观众不知道该看哪个，而且主标题一动，副题块的&quot;冲&quot;就不再是唯一的运动。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/speed-slab-title/index.html。<strong>换文案改两处 HTML 文本</strong>（<code>#ssL1</code> 主标题 4~7 字、</li></ul><p>  <code>#ssSlabT</code> 副题 4~7 字）——块宽由字自动撑出，三道线的落位按块高度实测，都不用改常量；   <strong>但块宽一变 <code>CONFIG.slabFrom</code> 要重算</strong>（判据见参数表：块右缘距舞台左缘 ÷ cos(3°) + 余量）。   换强调色改两处：<code>.ss-slab</code> 的 <code>background</code> 与 <code>.ss-line</code> 的 <code>background</code>（必须同色）。   换字号改 <code>.ss-l1</code> 与 <code>.ss-slab-t</code> 的 <code>font-size</code>（两处同值），同时按比例改 <code>CONFIG.lagPx</code>（约 0.53 字宽）   与 <code>CONFIG.lineLens</code>（约 0.55/0.39/0.29 字宽）。   能量只调 <code>slabDur</code>；<code>lineFade</code> 与 <code>lagPx</code> 是命门常量，换尺寸换语速都不要动。</p><ul><li>Remotion 移植：<strong>关键是两级 transform 不能塌成一个</strong>——外层 div 吃块的 <code>x</code>，内层 span 吃字的 <code>x</code>。</li></ul><p>  30fps 换算：<code>lead 12f</code>、<code>l1Dur 5f</code>、<code>gap 2.4f≈2f</code>、<code>slabDur 8.4f≈8f</code>、<code>lagDur 10f</code>、   <code>lineStagger 2f</code>、<code>lineOpen 2.7f≈3f</code>、<code>lineFade 6f</code>。   块 <code>translateX: interpolate(f, [26,34], [-580,0], {easing: Easing.out(Easing.poly(4)), ...clamp})</code>   （<code>-580</code> 按同一判据重算：块右缘距画面左缘 ÷ cos(斜切角)；Remotion 里画外起点写死成常量即可）   —— <code>Easing.poly(4)</code> 就是 power4；字用 <code>Easing.out(Easing.cubic)</code> 跑 <code>[26,36]</code>。   三道线各自两段：<code>scaleX: interpolate(f, [34+2i, 37+2i], [0,1], {...clamp})</code> 与   <code>opacity: interpolate(f, [37+2i, 43+2i], [1,0], {easing: Easing.in(Easing.quad), ...clamp})</code>   （<strong><code>extrapolateRight: 'clamp'</code> 不能省</strong>——否则 hold 期算出负 opacity，Chrome 里线会闪回来一帧）。   块的 <code>overflow: hidden</code> 在 Remotion 里同样必需，且要写在吃 <code>x</code> 的那一层上（不是它的父层）。</p><ul><li>剪辑软件对应物：剪映/CapCut——块与字必须是<strong>两个层</strong>（块用色块贴纸、字用文本层），</li></ul><p>  两层都打&quot;位置&quot;关键帧，字的起点比块多偏左 40px、结束帧比块晚 2 帧；块层套&quot;蒙版-矩形&quot;贴合块边缘做裁切   （剪映的贴纸没有 overflow，裁切只能靠蒙版）。三道速度线用三个细长色块贴纸，   各打&quot;缩放&quot;X 通道 0 → 100 + &quot;不透明度&quot; 100 → 0，起点各错 2 帧。   <strong>剪映的&quot;速度线&quot;特效不要用</strong>——它是全屏径向线，是漫画爆点不是块的残影。   AE——块层 <code>Position</code> 两键配 <code>Easy Ease Out</code> 且手柄拉到 90%（模拟 power4）；   字层作为块层的子级（parent），自己再打一组 <code>Position</code> 关键帧，两级叠加天然成立；   三道线用 <code>Scale</code> X 通道 + <code>Opacity</code>，三层用 <code>Sequence Layers</code>（间隔 2 帧）自动错峰。</p><ul><li>与本库同类卡的分工：<code>slab-punch-title</code> = 块<strong>原地从中心撑开</strong> + 字砸（语义是重量/结论）；</li></ul><p>  <code>motion-blur-slam-in</code> = 素材带动态模糊砸入（对象是素材卡不是标题，且用模糊而不是残影线）；   <code>alt-block-lines</code> = 两块各自从左展开刷出字（对句关系，无速度语义）；   <code>whip-pan-transition</code> = 整屏甩镜（转场，不是标题）；   <strong>本卡 = 唯一用&quot;残影线&quot;表达速度的标题卡</strong>，语义锚在&quot;快&quot;这个词上，用在不需要&quot;快&quot;的句子上就是空转。</p><h3>动效范围</h3><ul><li>属于本卡的：速度线是<strong>冲入的残影</strong>这个定义（张开后 0.2s 内必须淡尽，<code>power2.in</code> 抹掉而非 <code>out</code> 淡出）；三道线<strong>长度不等</strong>（0.55/0.39/0.29 字宽）+ 错峰 2 帧 + <code>transform-origin: 100% 50%</code> 从块左缘往左长这组形状纪律；块内字 <code>lagPx 40px</code> 反向补偿 + <code>lagDur</code> 比块长 20% 的&quot;追赶感&quot;；块的 <code>power4.out</code>（全卡唯一 power4）这条刹车曲线；<strong>块的起点必须完全在画面外</strong>（判据：<code>|slabFrom| &gt; 块右缘距画面左缘 ÷ cos(斜切角)</code>，起始帧不许露出块的任何一部分——用户 2026-08-25 定版）；<strong>副题块不许压到主标题字面</strong>（块斜切后右上角是最高点，离主标题<strong>字面底</strong> 12~16px 净空，按字面而非行盒算——用户 2026-08-25 定版）；块用 <code>overflow: hidden</code> 裁切字、字与块<strong>两级 transform</strong> 这条实现纪律；速度线挂在块的静态斜切容器下（共享斜切、天然平行）；三道线按块高度运行时生成（不写死落位）；主标题&quot;硬现且不参与任何方向性运动&quot;这个分工。</li><li>不属于本卡的：demo 那两句「效率不是更快 / 而是不做错事」的具体文案、76px 字号与 700 字重、<code>#7A5AF8</code> 这个紫（同色系任取，参考图只是一个样本）、-3° 这个具体斜切角、<code>padding: 10/20/12</code> 这组像素、块的 4px 圆角、线的 7px 粗与 4px 圆头、右侧主持人（数字人）占位、以及&quot;标题落在左侧白区、左边距 84px&quot;这个落位。<code>slabFrom -580</code> 与 <code>.ss-row</code> 的 <code>margin-top: 36px</code> 这两个<strong>具体数值</strong>也不属于本卡（它们是按本 demo 的块宽与字号算出来的）——属于本卡的是那两条<strong>判据</strong>（完全出画 / 净空 12~16px）。</li><li>迁移接口：内容入口是两段纯文本（各 4~7 字），块宽自动贴合；能量只调 <code>slabDur</code>（0.2~0.4s）；<code>lineFade 0.2s</code> 与 <code>lagPx ≈0.53 字宽</code> 是命门常量，只随字号等比缩放、不随语速调；换字号时 <code>font-size</code>（两处同值）、<code>lagPx</code>、<code>lineLens</code>、<code>.ss-slab</code> 的 padding 按同一比例缩放；换强调色改 <code>.ss-slab</code> 与 <code>.ss-line</code> 两处 <code>background</code>（必须同色）；<code>slabFrom</code> <strong>不是手感参数，是算出来的</strong>——按 <code>块右缘距画面左缘 ÷ cos(斜切角)</code> 再留 15~20px 余量，换文案/换字号/换落位都要重算（块宽变了阈值就变了）；两行净空（<code>.ss-row</code> 的 <code>margin-top</code>）按主标题<strong>字面底</strong>到块<strong>右上角</strong>留 12~16px 重算，换字号要跟着调。竖屏字号收到 52~60px，<code>slabFrom</code> 按新的块右缘位置重算（竖屏块窄、阈值小得多）。</li><li>底色要求：白底即可。深底也成立（主标题反白、块与线保持强调色），但深底上残影线的可见度更低——<code>lineFade</code> 要放宽到 0.26s 才看得到&quot;正在消失&quot;这个过程。<strong>渐变底与实拍花底不行</strong>：速度线只有 7px 宽 0.2s 寿命，底上任何高频细节都会把它吃掉。</li></ul>","tracking-in":"<h3>意图</h3><p>本库缺一档<strong>标题的入场</strong>——注意不是字幕。字幕的动作要短、要跟语速、要能连着上； 标题的动作可以长、可以只做一次、可以让整屏为它停下来。<code>chapter-title-card</code> 是&quot;卡&quot;（带色块压屏、有转场性质）， <code>quote-card</code> 是&quot;多行金句 + 底板&quot;，两张都自带一整套画面结构。这张卡只有<strong>一行字</strong>， 落在现有画面上，靠一个动作把整屏的注意力吸过去。</p><p>它的机制是唯一的：<strong>字距（tracking）</strong>。字从彼此隔得极远（0.5em ≈ 半个字宽的间隙）收拢到正常， 观众感知到的是&quot;散落的东西正在归位&quot;，而这个归位是横向的、对称的、从两端往中间的—— 和本库任何一张字幕卡的运动方向都不重合。</p><p>命门两条：① <strong>字距与模糊必须由同一条 spring 驱动</strong>。字距在收、模糊在解，两件事共用一条曲线， 才会读作&quot;一个动作&quot;——散开的字聚拢成一块、同时聚焦成一块。分成两条缓动（哪怕参数很接近）， 慢放下能看出字先咬到位再单独解糊，那就是两个动作了； ② <strong>spring 是零回弹的长缓收</strong>（damping 18 / stiffness 90，ζ=0.949）。 它的形状是&quot;起手 0.3s 走掉 80%，剩下 0.5s 极慢地咬最后那 20%&quot;—— 最后那段极慢的咬合是这张卡全部的&quot;贵气&quot;来源。换成 <code>power2.out</code> 之类会明显更平； 换成弹性缓动（有回弹的 spring / <code>back.out</code>）字距会过冲到负值再弹回来，一眼廉价。</p><p>第三点值得注意：<strong>淡入不跟 spring</strong>（源码就是分开的两个 interpolate）。 opacity 走独立的 0.5s 线性——所以字在还只有一半透明度的时候，字距已经收掉 90% 了。 这个错位让&quot;聚拢&quot;这个动作在字完全显形之前就已经进行了大半，观众看到的是<strong>结果的最后一段</strong>，不是全过程。</p><h3>动效核心</h3><ul><li><strong>一条 spring 驱动两件事</strong>（源码 <code>spring({config: {damping: 18, stiffness: 90}})</code>，mass 默认 1）：</li></ul><p>  - <code>letter-spacing: 0.5em → −0.03em</code>（终态是<strong>略收紧</strong>，不是 0）   - <code>filter: blur(9px) → 0</code>   - 两者共用 spring 的输出 <code>t</code>，<code>interpolate(t, [0,1], [起, 终])</code> —— <strong>一个动作</strong></p><ul><li><strong>spring 的形状</strong>：ζ = <code>18 / (2√90)</code> = 0.949（欠阻尼），ω₀ = 9.487，ω₁ = 3.0。</li></ul><p>  <code>x(t) = 1 − e^(−9t)·[3·sin(3t) + cos(3t)]</code>。   x(0.3) = 0.800、x(0.5) = 0.966、x(1.0) = 1.00007 —— 过冲峰值只有 <strong>8.1e-5</strong>（t≈1.05s），肉眼是<strong>零回弹</strong>。   实际走完约 <strong>1.0s</strong>（GSAP 里当自定义 ease 用：入参 0~1 的进度 × 1.0s 再喂进解析解）</p><ul><li><strong>淡入独立</strong>：<code>opacity 0 → 1</code>，<strong>0.5s 线性</strong>，与 spring 无关（源码是第二个 <code>interpolate(frame,[0,15])</code>）。</li></ul><p>  它比 spring 短一半 —— 字显形时字距已经收掉九成</p><ul><li><strong><code>letter-spacing</code> 必须用 em 单位</strong>：0.5em 是&quot;半个字宽的间隙&quot;，换字号自动等比。</li></ul><p>  交给 GSAP 直接 tween 会被换算成 px，换字号后就不再等比 —— demo 里走代理对象 + <code>onUpdate</code> 手写样式</p><ul><li><strong>模糊量恒为字号的 1/8</strong>（源码 12px @96px 字号；本库 72px ⇒ 9px）。比例常量，换字号必须等比改</li><li><strong><code>white-space: nowrap</code> 是硬要求</strong>：0.5em 字距时整行比终态宽约 50%，</li></ul><p>  不锁 nowrap 会在起手那一刻换行、收拢过程中再跳回一行</p><ul><li><strong>整行是一个元素</strong>（不切字）：本卡的动画对象是&quot;一行字&quot;，字距是行的属性。</li></ul><p>  切成单字再各自位移是另一条路（会失去 CSS 字距的对称性，且中文标点的位置会错）</p><ul><li><strong>零位移零缩放</strong>：本卡不动 <code>transform</code>。所有的&quot;运动感&quot;都来自字距与模糊</li><li><strong>层级</strong>：舞台白底（源码显式 <code>background: white</code>——字距收拢靠&quot;空&quot;才读得出来）→ 整行（唯一被动画的元素）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>startTracking</code></td><td>0.5em</td><td>起始字距，本卡的能量旋钮；&lt;0.25em 收拢幅度读不出来（退化成&quot;有点糊的淡入&quot;），&gt;0.9em 起手时字散得认不出是一句话，且整行宽度接近画幅（中文尤其，字宽整齐、散开后是一排孤立方块）</td></tr><tr><td><code>endTracking</code></td><td>−0.03em</td><td>终态字距，<strong>略收紧不是 0</strong>；0 收尾少了那一下&quot;咬紧&quot;，正值（放松）会让整行读作没收完</td></tr><tr><td>spring 配置</td><td>damping 18 / stiffness 90</td><td><strong>本卡第二命门，零回弹的长缓收</strong>；damping 调小（&lt;14）出现可见回弹、字距过冲到负值再弹回，一眼廉价；stiffness 调大（&gt;140）整个动作变短变硬、贵气消失</td></tr><tr><td><code>springDur</code></td><td>1.0s</td><td>spring 走完的实际时长（由 damping/stiffness 决定，不是独立参数——改配置就要重算）；本卡的&quot;长&quot;是刻意的，短于 0.7s 就不再是标题动作</td></tr><tr><td><code>startBlur</code></td><td>字号的 1/8（72px ⇒ 9px）</td><td>起始模糊量，<strong>比例常量</strong>；0（不解糊）读作纯字距动画（机械，缺&quot;聚焦成一块&quot;那层），&gt;字号 1/5 起手是一团雾、观众不知道要看什么</td></tr><tr><td><code>fadeDur</code></td><td>0.5s</td><td>淡入时长 = spring 的一半，<strong>这个错位是设计的一部分</strong>；= <code>springDur</code> 则观众看到全过程（散开的字从头到尾都看得清，&quot;归位&quot;的惊喜感变成&quot;等它排好&quot;）；&lt;0.3s 字几乎瞬间显形、又变成看全过程</td></tr><tr><td>字数</td><td>4~8 字</td><td>本卡的硬约束；≤3 字散开后是几个孤立的字、读不出&quot;一句话&quot;；≥10 字在 0.5em 字距下整行宽度超出画幅（中文按字号 × 字数 × 1.5 估算起手宽度）</td></tr><tr><td><code>lead</code></td><td>0.3s</td><td>起手静置等口播开口</td></tr><tr><td><code>hold</code></td><td>1.3s</td><td>收尾定格——咬到位的大标题是本卡的落点；本卡是标题，定格可以给到 2s 以上</td></tr><tr><td>位移 / 缩放</td><td><strong>0（不设）</strong></td><td>本卡的硬约束：运动感全部来自字距与模糊，加位移就与 <code>per-character-rise</code> 撞车</td></tr></table><h3>已知坑</h3><ul><li>字距与模糊分成两条缓动——哪怕参数很接近，慢放下也能看出字先咬到位再单独解糊，&quot;一个动作&quot;变成两个；必须共用一条 spring。</li><li>换成有回弹的缓动（低 damping 的 spring / <code>back.out</code> / <code>elastic</code>）——字距过冲到负值（字互相压）再弹回来，一眼廉价，且中文字挤在一起那一帧非常难看。</li><li><code>letter-spacing</code> 用 px 单位（或交给 GSAP 自动 tween，它会换算成 px）——换字号后收拢幅度不再等比，大字号下&quot;没散开&quot;、小字号下&quot;散得离谱&quot;；必须走 em + <code>onUpdate</code> 手写样式。</li><li>终态字距写 0——收尾少了那一下&quot;咬紧&quot;的力道；源码是 −0.03em，这 0.03 是有用的。</li><li>整行不锁 <code>white-space: nowrap</code>——0.5em 字距时整行比终态宽 50%，起手那一刻会换行，收拢过程中再跳回一行（慢放下是明显的 bug）。</li><li>淡入跟着 spring 走满 1.0s——观众看到散开的字从头到尾都很清楚，&quot;归位&quot;的惊喜变成&quot;等它排好队&quot;；淡入必须比 spring 短一半。</li><li><code>startBlur</code> 写成绝对像素值跟着复用——换字号后大字糊不够、小字糊没了；必须按字号 1/8 等比。</li><li>用于多行文本——每行各自收拢，行与行的宽度变化不同步，整块读作在呼吸；本卡是<strong>单行</strong>标题动作（多行要点用 <code>line-by-line-slide</code>）。</li><li>用作常规字幕（连续几句都上这个）——1.0s 的动作跟不上语速，且每句都&quot;归位一次&quot;，整片显得慢；本卡一片里用 1~2 次。</li><li>字数超过 8（中文）——起手时整行宽度超出画幅，被 <code>overflow: hidden</code> 切掉两端，观众看到的是&quot;两截字在往中间挤&quot;。</li><li>底上有细密纹理——字在收拢的前半程是&quot;半透明的糊块&quot;，底上的细节透过来混在一起，读不出那是字。</li><li>起手那一帧整行的视觉中心比终态偏左约 <code>startTracking / 2</code>（CSS 的字距会在最后一个字后面也加一份，居中时把可见字形整体推向左）——<strong>源码同样存在</strong>，属于忠实搬运的一部分；真要消掉就给整行加 <code>margin-right: −&lt;当前字距&gt;</code>（跟着 <code>onUpdate</code> 一起改），但会与源码的观感有细微差别。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/tracking-in/index.html。<strong>换内容只改 <code>#tiTitle</code> 的文案</strong>（4~8 字，写在 HTML 里，</li></ul><p>  本卡不切字所以没有内容数组）。能量只调 <code>startTracking</code>；换字号改 <code>.ti-title</code> 的 <code>font-size</code>，   同时把 <code>CONFIG.startBlur</code> 改成新字号的 1/8（<code>startTracking</code> 是 em、自动等比，不用改）。   <code>remotionSpring(damping, stiffness, mass)</code> 这个函数返回 Remotion <code>spring()</code> 的解析解，   <strong>可以直接抄到任何要复刻 Remotion spring 手感的 demo 里</strong>（它同时带临界/过阻尼分支，改参数不会算错）；   改了 spring 配置就要重算 <code>springDur</code>（跑 <code>SPRING(t)</code> 找 x(t) 稳定到 1 的时刻）。   整行的落位改 <code>.ti-frame</code> 的 flex 对齐（demo 是整屏居中，因为本卡就是&quot;整屏让位&quot;的语义）。</p><ul><li>Remotion 移植：源码 <code>registry/remocn/tracking-in/index.tsx</code> 就是最简形态，原样抄即可：</li></ul><p>  一个 <code>spring({frame, fps, config: {damping: 18, stiffness: 90}})</code> 喂两个 <code>interpolate</code>   （字距 <code>[0,1] → [0.5, -0.03]</code> 输出 em 字符串、模糊 <code>[0,1] → [12, 0]</code>），   opacity 另走 <code>interpolate(frame, [0, 15], [0, 1], {extrapolate: &quot;clamp&quot;})</code>。   <strong>帧↔秒换算（源码 30fps）</strong>：opacity 的 <code>[0, 15]</code> ⇒ 0.5s；spring 没有显式帧数，   由 damping/stiffness 决定实际时长（本配置 ≈ 30 帧 = 1.0s），<code>durationInFrames 90</code> ⇒ 3.0s（含定格）。   <code>speed</code> 那个 prop 是源码给的时间缩放（<code>frame × speed</code>），本库用 <code>lead</code> + <code>hold</code> 表达节奏，不搬。   尺寸换算：源码 <code>fontSize 96</code> @1280 画幅，本库 960 舞台 ×0.75 ⇒ 72，<code>startBlur 12 ⇒ 9</code>；   <code>startTracking</code> 是 em，跨尺寸不用换算。</p><ul><li>剪辑软件对应物：剪映/CapCut——<strong>字距不是可打关键帧的属性</strong>（剪映的&quot;字间距&quot;是静态滑杆），</li></ul><p>  所以做不出本卡；能做的最近替代是把标题拆成单字文本层各自做横向位移（成本高，且失去 CSS 字距的对称性）。   想要现成的就换 <code>soft-blur-in</code>（解糊淡入，剪映能做）。   AE——<code>Source Text</code> 的 <code>Tracking</code> <strong>是可以打关键帧的</strong>（Animator 或图层的 Tracking 属性），   两个关键帧（起 50 → 终 −3，AE 的 Tracking 单位是 1/1000 em，所以 0.5em = 500、−0.03em = −30）+   <code>Fast Box Blur</code>（9 → 0）+ <code>Opacity</code>（0 → 100，只 15 帧）；   <strong>Tracking 与 Blur 的两条曲线必须完全一致</strong>（在 Graph Editor 里复制粘贴曲线，别各自 Easy Ease）；   要精确复刻 spring 的形状就用表达式：把上面那条 <code>x(t) = 1 − e^(−9t)(3sin3t + cos3t)</code> 写进   Tracking 与 Blurriness 的表达式里（同一个 <code>t = time - inPoint</code>），比手拉曲线准。</p><ul><li>与本库同类卡的分工：<code>chapter-title-card</code> = 章节卡（色块压屏 + 编号，带转场性质，是画面结构的切换）；</li></ul><p>  <code>quote-card</code> = 多行金句大字卡（底板 + 人物让位 + 整卡退场）；   <code>behind-text-title</code> = 标题穿在人物身后（层级把戏，人照常出镜）；   <code>soft-blur-in</code> / <code>per-character-rise</code> = 单句<strong>字幕</strong>入场（能跟语速、能连着上）；   <strong>本卡 = 单行大标题的一次性入场</strong>（不带底板、不切画面、不跟语速，靠字距归位吸走整屏注意力）。   本卡与 <code>chapter-title-card</code> 的分界是<strong>要不要切画面</strong>：要色块压屏的章节切分用后者，   只要一行字立在当前画面上用本卡。本卡一片里用 1~2 次（开场 + 落版），用多了&quot;贵气&quot;就贱了。</p><h3>动效范围</h3><ul><li>属于本卡的：<code>letter-spacing 0.5em → −0.03em</code> 与 <code>blur → 0</code> 由<strong>同一条 spring</strong> 驱动这个机制（一个动作而不是两个）；spring 配置 damping 18 / stiffness 90（ζ=0.949，过冲 8e-5，<strong>零回弹的长缓收</strong>：0.3s 走掉 80%、剩 0.5s 咬合）；起始模糊量恒为<strong>字号的 1/8</strong>；终态字距 −0.03em（略收紧而非归零）这一下咬紧；淡入<strong>独立于 spring</strong> 且只有它一半时长（0.5s 线性）这个错位；<code>letter-spacing</code> 必须走 em 单位这条实现纪律；整行作为<strong>单个元素</strong>（不切字）与 <code>nowrap</code>；<strong>零位移零缩放</strong>这条硬约束；&quot;字数 4~8&quot;这个上限。</li><li>不属于本卡的：demo 那句「认知决定上限」的具体文案、72px 字号与 700 字重、<code>#171717</code> 这个墨色、无衬线字族的选择、白底舞台（源码显式白底，但深底把字色反白同样成立）、以及&quot;整屏居中、不放主持人&quot;这个落位——demo 不放主持人是因为本卡的语义就是&quot;整屏让位给一句标题&quot;，应用侧要让人物留在画面里也成立（标题落在人物上方或下方的留白区，只要那一带足够空）。</li><li>迁移接口：标题文案直接写在 HTML 里（4~8 字）；能量只调 <code>startTracking</code>（em，跨尺寸不用改）；<code>startBlur</code> 按字号 1/8 等比缩放；<strong>spring 配置、<code>endTracking</code>、<code>fadeDur</code> 与 <code>springDur</code> 的比例是手感常量，换尺寸换语速都不要动</strong>（改了 spring 配置必须重算 <code>springDur</code>）；<code>hold</code> 可以给到 2s 以上（本卡是标题不是字幕）；竖屏用 4~6 字并把字号收到 46~56px（起手宽度 ≈ 字号 × 字数 × 1.5，必须小于可用宽度的 90%，否则两端被切）。</li><li>底色要求：白底最佳（源码显式白底——<strong>字距收拢靠&quot;空&quot;才读得出来</strong>：字周围要有足够的空白，观众才能看见&quot;间隙在变小&quot;这件事）。深底把字色反白同样成立。硬约束两条：① 底不能有细密纹理或高频细节（收拢前半程字是半透明糊块，细节透过来就读不出字）；② 底不能有横向条纹或横向渐变（字距收拢是横向运动，带方向的横向底纹会与它产生视差错觉）。渐变底可以，实拍花底不行（本卡不自带背板，也不适合加描边——描边会把 0.5em 的间隙填得更满、削弱&quot;散开&quot;的读感）。</li></ul>","typewriter-reveal":"<h3>意图</h3><p>给叙事一个&quot;档案调取中&quot;的仪式感——观众看到逐字敲出的地点日期，会自动进入&quot;接下来是背景资料&quot;的收听模式。 命门：<strong>速度要抖</strong>（每字符 30~80ms 且 ±20ms 随机，匀速立刻变 CSS 教程）、 <strong>光标必须在</strong>（方块光标是&quot;打字机&quot;的身份证，没有它只是延迟出字）、 <strong>两行要错峰</strong>（副信息晚 0.4s 再敲，同时敲两行就没有&quot;逐条录入&quot;的档案感）。</p><h3>动效核心</h3><ul><li>文本容器用等宽字体（Menlo/Consolas；中文字符天然等宽，混排数字必须等宽），行尾跟一个 <code>█</code> 方块光标（宽 0.62em、高 1.05em 的实心块）</li><li>逐字符出现：第 n 个字符在 <code>Σ(charMs ± jitterMs)</code> 时刻整字显示（不是淡入），30~80ms/字符</li><li>句尾：光标以 500ms 周期方波闪烁（半周期亮/半周期灭，不是渐隐）2~3 次</li><li>第二行副信息延迟 0.4s 开始敲，光标从第一行&quot;移交&quot;到第二行（第一行光标消失）</li><li>敲完后光标常驻闪烁</li><li>层级：底 → 出镜人物/素材（照片/B-roll）→ 打字戳（最上，落在人物对侧的留白区，占角落不占中央）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>字符间隔 charMs</td><td>55ms</td><td>调小到 30ms 像高速电传，紧张感强；调大过 100ms 观众开始等，像 loading</td></tr><tr><td>随机抖动 jitterMs</td><td>±20ms</td><td>0 = 匀速一眼假；抖太大（±40ms+）像网卡</td></tr><tr><td>光标闪烁周期</td><td>500ms</td><td>行业默认；调快像故障，调慢像死机</td></tr><tr><td>句尾闪烁次数</td><td>3</td><td>少于 2 次副行接得太急；多于 4 次拖节奏</td></tr><tr><td>副行延迟</td><td>0.4s</td><td>调大更有&quot;调档案&quot;的停顿感；为 0 时两行齐出，档案感消失</td></tr><tr><td>主行字号</td><td>40px（960 宽舞台）</td><td>太大像标题卡抢戏；这是&quot;戳&quot;，应该占角落不占中央</td></tr></table><h3>已知坑</h3><ul><li>匀速出字——真打字有节奏波动，匀速的规整感一眼是 <code>setInterval</code> 教程代码。</li><li>没有方块光标——只剩&quot;文字慢慢出现&quot;，读作加载慢而不是打字机。</li><li>非等宽字体混排数字——字符宽度不一，光标随出字左右跳动，档案感全毁。</li><li>光标用透明度渐隐渐显——打字机光标是方波（亮/灭硬切），正弦呼吸感是网页登录框。</li><li>把戳放在画面正中——它是标注不是标题，居中就抢了素材的戏。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/typewriter-reveal/index.html。demo 带口播语境：主持人（数字人）占左侧 40% 出镜，档案戳排在右侧白区下方——戳是标注，不压人物、不占中央。改 <code>CONFIG.line1/line2</code> 换文案，<code>charMs/jitterMs</code> 调手感；<code>.host-wrap</code> 与 <code>.host-placeholder</code> 只是演示语境（真人出镜位），应用侧换成实拍/数字人图层即可；<code>.stamp</code> 的 <code>left/bottom</code> 就是落位接口（人在左则戳在右，反之对调）；&quot;档案感&quot;（深底/做旧/纸纹）属于风格层，自己按片子调性加。</li><li>Remotion 移植：按帧取 substring——<code>text.slice(0, charAt(frame))</code>，其中 charAt 用预生成的随机时刻表（useMemo 固定 seed）；光标 <code>opacity = Math.floor(frame / (fps*0.25)) % 2</code>。</li><li>（实测变体）乱码 decode：命令/术语先在一枚胶囊里以乱码高速滚动，再<strong>逐位从左到右锁定</strong>为真字符——身份从&quot;打字机&quot;换成&quot;解码中&quot;，适合抛出命令行、模型名、密钥类字符串；方块光标可省，锁定的进度本身就是光标。见 TheAIScaler（u8OWXXTcu3Q）。</li><li>（实测变体）终端窗口实时打字（Y17upxADWXs / HidOB0Ll7W8）：把打字戳放进一个终端窗口壳里，敲完回车后输出行整块出现（不逐字）——&quot;输入逐字、输出整块&quot;是终端的真实节奏，输出也逐字反而假。</li><li>剪辑软件对应物：剪映&quot;文字动画→输入法/打字机&quot;；AE 用 Text Animator + Opacity 100% 阶梯；CapCut &quot;Typewriter&quot; 预设——注意都要手动补方块光标层。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：逐字符整字显示（不淡入），第 n 字符出现在 <code>Σ(charMs ± jitterMs)</code> 时刻——<strong>间隔带随机抖动</strong>是本卡的核心手感；句尾方块光标 500ms 周期方波闪烁（亮/灭硬切，非渐隐）2~3 次；光标从主行&quot;移交&quot;副行（主行光标 display:none、副行同帧点亮）；副信息行延迟 0.4s 再敲的错峰时序；敲完光标常驻闪烁。等宽字体是本卡的必要条件（非等宽会让光标随出字左右跳动）。</li><li>不属于本卡的：演示里的口播语境（左侧数字人出镜位 <code>.host-wrap</code>/<code>.host-placeholder</code>——由 demo-shell 统一注入，见 references/host-footage.md）、示例文案（北京 · 2008…）、字号 36px/18px 与戳的具体落位（右侧白区下方）、&quot;档案感&quot;的一切风格化——深底、做旧、纸纹、暗角、字投影都属于风格层，本卡不提供也不要求。</li><li>迁移接口：<code>charMs</code>/<code>jitterMs</code> 定打字速度与抖动量，<code>blinkPeriod</code>/<code>blinkTimes</code> 定光标节律，<code>line2Delay</code> 定两行错峰，<code>startDelay</code> 对齐语音入点；换风格改 <code>.stamp</code> 的 color 与光标 background（光标色必须跟字色同色，否则不像同一台打字机）；换尺寸时字号与光标的 0.62em×1.05em 保持 em 相对值即可自动跟随。</li><li>底色要求：白底即可（逐字符显示与方块光标不依赖底色对比，只需字色与底色可读）。原 demo 的深色档案底已移除——那是风格不是动效。</li></ul>"};

  f.src = DEMO_BASE + heroSlug + "/index.html?embed=1&controls=1";
  f.allowFullscreen = true;
  f.setAttribute("allow", "fullscreen; autoplay");
  poster.replaceWith(f);
}
["pointerdown", "keydown"].forEach((ev) =>
  window.addEventListener(ev, () => {
    if (!activated) { activated = true; mountHeroIframe(); }
  }, { capture: true }));

/* 从配方卡正文里抠「动效范围」段（h3 标题到下一个 h3），主推区展示 */
function scopeOf(slug) {
  const m = (BODIES[slug] || "").match(/<h3>动效范围<\/h3>([\s\S]*?)(?=<h3>|$)/);
  return m ? m[1] : "";
}

function match(c) {
  if (cat !== "全部" && c.category !== cat) return false;
  if (q && !(c.slug + c.zhName + c.title + c.usage + c.category + (CAT_EN[c.category] || "")).toLowerCase().includes(q.toLowerCase())) return false;
  return true;
}

/* demo 自动播放：滚入挂预览（本地=活 demo iframe；Pages=release 里的 mp4），滚出卸载。
   预览不循环：播完停在开头（mp4 靠 ended 回卷；活 demo 由 demo-shell 播完回卷暂停）。 */
const PAGES = false;
function makePreview(slug) {
  if (PAGES) {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.autoplay = true; v.preload = "auto";
    v.src = "media/" + slug + ".mp4";
    v.addEventListener("ended", () => { v.currentTime = 0; });
    v.play && v.play().catch(() => {});
    return v;
  }
  const f = document.createElement("iframe");
  f.loading = "lazy"; f.src = DEMO_BASE + slug + "/index.html?embed=1";
  return f;
}
const io = new IntersectionObserver((ens) => {
  ens.forEach((en) => {
    const pv = en.target, slug = pv.dataset.slug;
    if (en.isIntersecting) {
      if (!pv.querySelector("iframe,video")) {
        pv.prepend(makePreview(slug));
        const img = pv.querySelector("img"); if (img) img.remove();
      }
    } else {
      const f = pv.querySelector("iframe,video");
      if (f) { f.remove(); const c = CARDS.find((x) => x.slug === slug);
        if (c && c.thumb) pv.insertAdjacentHTML("afterbegin", '<img src="' + c.thumb + '">'); }
    }
  });
}, { rootMargin: "100px 0px", threshold: 0.01 });

function syncSel() {
  $("selbar").classList.toggle("show", picked.size > 0);
  $("selcount").textContent = T().selA + picked.size + T().selB;
  $("selnames").textContent = [...picked].join(", ");
  document.querySelectorAll(".tile").forEach((t) => t.classList.toggle("picked", picked.has(t.dataset.slug)));
  const hc = document.querySelector(".hero-act input");
  if (hc) hc.checked = picked.has(heroSlug);
}
async function copyPicked(btn) {
  const text = [...picked].join(", ");
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  btn.textContent = T().copied;
  setTimeout(() => { btn.textContent = T().copy; }, 1200);
}
function togglePick(slug, on) { on ? picked.add(slug) : picked.delete(slug); syncSel(); }
function openCard(slug) { $("dlgTitle").textContent = slug; $("dlgBody").innerHTML = BODIES[slug]; dlg.showModal(); }

function renderTabs() {
  const t = $("cats"); t.innerHTML = "";
  ["全部", ...CATS].forEach((c) => {
    const el = document.createElement("span");
    el.className = "tab" + (cat === c ? " on" : ""); el.textContent = catLabel(c);
    el.onclick = () => { cat = c; render(); }; t.appendChild(el);
  });
}

function renderHero(list) {
  const h = $("hero");
  if (!list.length) { h.innerHTML = ""; return; }
  if (!list.some((c) => c.slug === heroSlug)) heroSlug = list[0].slug;
  const idx = list.findIndex((x) => x.slug === heroSlug);
  const c = list[idx];
  const scope = scopeOf(c.slug);
  // controls=1：播放/暂停、进度条、全屏都叠在视频画面内（demo-shell HUD）
  const player = activated
    ? '<iframe src="' + DEMO_BASE + c.slug + '/index.html?embed=1&controls=1" allowfullscreen allow="fullscreen; autoplay"></iframe>'
    : '<div class="hero-poster">' + (c.thumb ? '<img src="' + c.thumb + '">' : "") +
      '<div class="pp"><span class="ppbtn">▶</span><span class="pph">' + T().clickPlay + '</span></div></div>';
  h.innerHTML =
    '<div class="hero-player">' + player +
      '<button class="nav prev" onclick="stepHero(-1)" title="' + T().prevT + '">‹</button>' +
      '<button class="nav next" onclick="stepHero(1)" title="' + T().nextT + '">›</button>' +
      '<span class="pos">' + (idx + 1) + ' / ' + list.length + '</span>' +
    '</div>' +
    '<div class="hero-info">' +
      '<h2>' + nameOf(c) + '<code>' + (LANG === "en" ? c.zhName : c.slug) + '</code></h2>' +
      '<div class="hero-meta">' +
        (c.isNew ? '<span class="hchip newchip">' + T().newChip + '</span>' : "") +
        (c.priority === "P0" ? '<span class="hchip p0">' + T().p0 + '</span>' : '<span class="hchip">' + c.priority + '</span>') +
        '<span class="hchip">' + catLabel(c.category) + '</span>' +
        (c.energy ? '<span class="hchip">' + T().energy + (LANG === "en" ? (EN_ENERGY[c.energy] || c.energy) : c.energy) + '</span>' : "") +
      '</div>' +
      '<div class="hero-one">' + c.title + '</div>' +
      (c.usage ? '<div class="hero-usage"><b>' + T().usage + '</b>' + c.usage + '</div>' : "") +
      (scope ? '<div class="hero-scope"><b>动效范围</b>' + scope + '</div>' : "") +
      '<div class="hero-act">' +
        '<button class="btn primary" onclick="openCard(\'' + c.slug + '\')">' + T().card + '</button>' +
        '<a class="btn" href="' + GITHUB + '/blob/main/demos/' + c.slug + '/index.html" target="_blank" rel="noopener">' + T().source + '</a>' +
        '<label class="btn"><input type="checkbox" ' + (picked.has(c.slug) ? "checked" : "") +
          ' onchange="togglePick(\'' + c.slug + '\', this.checked)">' + T().pick + '</label>' +
      '</div>' +
      '<div class="hero-hint"><kbd>←</kbd> <kbd>→</kbd>' + T().hintA + '<kbd>' + (LANG === "en" ? "Space" : "空格") + '</kbd>' + T().hintB + '</div>' +
    '</div>';
}

/* 胶片条：当前筛选下全部卡的缩略图横列，滚入视野即自动播放（播完停回开头），当前卡高亮 */
function renderStrip(list) {
  const s = $("strip");
  s.innerHTML = list.map((c, i) =>
    '<div class="chip-card' + (c.slug === heroSlug ? " on" : "") + '" data-slug="' + c.slug + '" onclick="setHero(\'' + c.slug + '\')">' +
      (c.thumb ? '<img src="' + c.thumb + '">' : "") +
      (c.isNew ? '<span class="newbadge">NEW</span>' : "") +
      '<span class="idx">' + (i + 1) + '</span>' +
      '<span class="nm">' + nameOf(c) + '</span></div>').join("");
  s.querySelectorAll(".chip-card").forEach((el) => io.observe(el));
  const cur = s.querySelector(".chip-card.on");
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}

function setHero(slug) {
  heroSlug = slug; render();
  const r = $("hero").getBoundingClientRect();
  if (r.top < 0 || r.bottom > window.innerHeight) window.scrollTo({ top: 0, behavior: "smooth" });
}
function stepHero(d) {
  const list = CARDS.filter(match);
  if (!list.length) return;
  const i = list.findIndex((x) => x.slug === heroSlug);
  heroSlug = list[(i + d + list.length) % list.length].slug;
  render();
}
document.addEventListener("keydown", (e) => {
  if (dlg.open || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") { e.preventDefault(); stepHero(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); stepHero(1); }
  else if (e.key === " ") { e.preventDefault(); togglePick(heroSlug, !picked.has(heroSlug)); }
});

function renderSections(list) {
  const box = $("sections"); box.innerHTML = "";
  if (!list.length) { box.innerHTML = '<div class="empty">' + T().empty + '</div>'; return; }
  const cats = cat === "全部" ? CATS.filter((cc) => list.some((c) => c.category === cc)) : [cat];
  cats.forEach((cc) => {
    const items = list.filter((c) => c.category === cc);
    if (!items.length) return;
    const sec = document.createElement("div"); sec.className = "section";
    sec.innerHTML = '<div class="sec-head"><h3>' + catLabel(cc) + '</h3><div class="rule"></div>' +
      '<span class="all" data-cat="' + cc + '">' + T().viewAll + '</span></div>';
    const grid = document.createElement("div"); grid.className = "sec-grid";
    items.forEach((c) => {
      const el = document.createElement("div");
      el.className = "tile" + (picked.has(c.slug) ? " picked" : ""); el.dataset.slug = c.slug;
      el.innerHTML =
        '<div class="prev" data-slug="' + c.slug + '">' +
          (c.thumb ? '<img src="' + c.thumb + '">' : "") +
          (c.isNew ? '<span class="newbadge">NEW</span>' : "") +
          '<span class="nm">' + nameOf(c) + '</span></div>' +
        '<div class="bar"><code>' + c.slug + '</code>' +
          (c.priority === "P0" ? '<span class="tag p0">P0</span>' : "") +
          '<span class="sp"></span>' +
          '<label><input type="checkbox" ' + (picked.has(c.slug) ? "checked" : "") + '>' + T().pick + '</label>' +
          '<button data-card>' + T().card + '</button></div>';
      el.querySelector(".prev").addEventListener("click", () => setHero(c.slug));
      el.querySelector("input").addEventListener("change", (e) => togglePick(c.slug, e.target.checked));
      el.querySelector("[data-card]").addEventListener("click", () => openCard(c.slug));
      io.observe(el.querySelector(".prev"));
      grid.appendChild(el);
    });
    sec.appendChild(grid);
    const all = sec.querySelector(".all");
    if (all) all.onclick = (e) => { cat = e.target.dataset.cat; render(); window.scrollTo({ top: 0 }); };
    box.appendChild(sec);
  });
}

function render() {
  io.disconnect();
  renderTabs();
  const list = CARDS.filter(match);
  renderHero(list);
  renderStrip(list);
  renderSections(list);
  syncSel();
}

$("q").addEventListener("input", (e) => { q = e.target.value.trim(); render(); });
$("copySel").addEventListener("click", (e) => copyPicked(e.target));
$("clearSel").addEventListener("click", () => { picked.clear(); syncSel();
  document.querySelectorAll('.tile input, .hero-act input').forEach((cb) => { cb.checked = false; }); });

applyTheme();
applyI18n();
render();
</script>
</body>
</html>
