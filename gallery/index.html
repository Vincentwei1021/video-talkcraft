ng>要划一段文档里的话 → highlighter-sweep；要砸一个词 → keyword-pop-highlight；     要立整段引文 → quote-bracket-pull；要&quot;铺垫两句然后落到这一句&quot; → 本卡。</strong></p><h3>动效范围</h3><ul><li>属于本卡的：<strong>末行&quot;先平淡、后升级&quot;的两拍结构</strong>（中间 <code>plainHold 0.34s</code> 的空白是本卡的本体）；三行 <code>opacity</code> + <code>y +8→0</code> 的 <code>0.12s</code> 错峰淡入（第一拍里末行与前两行完全同款）；高亮框 <code>scaleX 0→1</code> 从<strong>文字中心</strong>铺开（<code>0.24s power3.out</code>）、在字<strong>下层</strong>用 <code>multiply</code>、不规则圆角模拟笔触、文字保持黑字这条荧光笔语义；<strong>框到位后</strong>文字才 punch（<code>1.05→1</code>，5 帧）这个先后因果；punch 落定即收、后面 <code>hold 2.2s</code> 不再有任何动作这条纪律。</li><li>不属于本卡的：demo 那三行具体金句与「是因为你正在走出舒适区」这个末行、33px 字号与 600 字重、<code>#1d1d1f</code> 墨色、<code>#FFE949</code> 之外的配色、金句落在左侧（右列让给人物）、右列的数字人占位、白底舞台。</li><li>迁移接口：内容入口是 <code>.qh-line</code> 的三行文案（末行包在 <code>.qh-last-txt</code> 里）；能量只调 <code>plainHold</code>（两拍之间的空白）与 <code>hold</code>（余味），<code>lineStagger</code> / <code>punchDur</code> 是<strong>手感常量，换尺寸换语速都不要动</strong>；尺寸基准 —— 框的 <code>left/right/top/bottom</code> 外扩量（12/14/4/4px）按字号等比、<code>lineRise 8px</code> 按舞台高等比；颜色两个 token —— marker（<code>#FFE949</code> @0.62）与 ink；竖屏把行数保持 3 行但字号降到 28px（框跟着等比）。</li><li>底色要求：<strong>白底即可</strong>。深底也成立，换两处：文字反白到 <code>#f5f5f7</code>，且荧光笔的 <code>mix-blend-mode</code> 必须从 <code>multiply</code> 换成 <code>screen</code>（深底上 multiply 会把黄块乘成黑，高亮框直接消失）——注意深底 + <code>screen</code> 后黄框会显著更亮，<code>opacity</code> 要从 0.62 收到 0.45 左右，否则框比字亮、读作&quot;字被光糊住&quot;。唯一约束是底不能有花纹落在末行区域：荧光笔靠&quot;半透明黄 × 白底 = 黄&quot;成立，底上有花纹时黄块会把花纹一起乘暗，读作污渍。</li></ul>","strike-and-replace":"<h3>意图</h3><p>本库的强调类全是&quot;<strong>加强</strong>&quot;——<code>keyword-pop-highlight</code> 砸重音、<code>highlighter-sweep</code> 涂高亮、 <code>magnifier-detail</code> 放大细节、<code>focus-dim-spotlight</code> 压暗聚焦、<code>callout-line-label</code> 引线标注、 <code>scribble-annotation</code> 手绘圈注。它们能让一个词变重，但<strong>没有一张能表达&quot;否定&quot;</strong>。</p><p>而口播里&quot;不是 A，而是 B&quot;是极高频的句式：旧观念 → 新观念、旧价格 → 新价格、 上一代参数 → 这一代参数、传言 → 事实。这时候单纯把新值高亮出来是不够的—— 观众需要看到<strong>旧的那个被否掉</strong>。这张卡的价值就在于：<strong>划穿的动作本身就是论证</strong>。 一条线从左划到右，你连&quot;这个说法已经过时了&quot;这句话都不用说完，观众已经接受了。</p><p>命门三条：① <strong>新值必须出现在旧值的位置上</strong>（两者绝对定位同位叠放）—— 换行另起或旁边并列都会读作&quot;这里有两个数据&quot;，替换感全部来自&quot;占了同一个位置&quot;； ② <strong>语义色只上那条线</strong>，文字保持墨色——给新值也上色的话，观众的注意力被&quot;新值好看&quot;抢走， &quot;旧值被划掉&quot;这一拍反而轻了（本库&quot;一个画面一个语义色&quot;的通例在这张卡上尤其致命）； ③ <strong>容器宽度必须先被撑住</strong>——把 <code>from</code> / <code>to</code> 里更长的那一串排进一个 <code>visibility: hidden</code> 的 &quot;隐形尺子&quot;占位，换值时句子其余部分零位移。这条是从同族的 <code>value-swap</code> 抄来的，也是变体 b 的全部内容。</p><h3>动效核心</h3><p>三段结构（按总时长比例切，<code>CONFIG.total</code> 是唯一的时长旋钮）：</p><table><tr><th>阶段</th><th>进度</th><th>动作</th></tr><tr><td>划线</td><td>0 → 40%</td><td>横线 <code>scaleX 0→1</code>（<code>transform-origin: left</code>，<code>power1.inOut</code>）</td></tr><tr><td>交换</td><td>40% → 60%</td><td>旧值 <code>opacity 1→0</code>（<code>power1.out</code>）；新值 <code>opacity 0→1</code> + <code>y +8→0</code>（<code>power2.out</code>），<strong>同位</strong></td></tr><tr><td>hold</td><td>60% → 100%</td><td>划线与新值同屏定格，让观众把&quot;旧 → 新&quot;这条论证读完</td></tr></table><ul><li><strong>划线用 <code>scaleX</code> 不用 <code>width</code></strong>：<code>transform-origin: left center</code> + <code>scaleX 0→1</code>。</li></ul><p>  动 <code>width</code> 是每帧重排（本库反例清单第一条），在 <code>inline-block</code> 的槽里还会带着整句抖</p><ul><li><strong>线的规格</strong>：高 = 字号 × 8%（32px 字号 → 3px，随字号等比），圆角 2px，语义色（红 <code>#e0452c</code> / 橙）。</li></ul><p>  它是 <code>.word.from</code> 的<strong>子节点</strong> —— 旧值淡出时线跟着一起走，不会留一条线压在新值上</p><ul><li><strong>划线缓动 <code>power1.inOut</code></strong>：匀速读作进度条，加速再收笔才像&quot;手划过去&quot;。</li></ul><p>  但<strong>不要回弹</strong>（<code>back</code> / <code>elastic</code>）——这是纠错不是花字，回弹会把严肃的否定读成综艺整活</p><ul><li><strong>同位叠放</strong>：旧值与新值都 <code>position: absolute</code> 在同一个 <code>.slot</code> 里，</li></ul><p>  CSS <code>left: 50%</code> 配 GSAP <code>xPercent: -50</code> —— 两者都以槽中线为锚。   于是<strong>短的那个值在预留宽度里居中</strong>：尺子撑出来的余量分到两边，读作排版留白；   左对齐会在尾部留一个刺眼的空洞（观众读成&quot;这里少打了一个字&quot;）</p><ul><li><strong>隐形尺子（变体 b 的核心）</strong>：<code>&lt;span class=&quot;ruler&quot;&gt;</code> 里排 <code>from</code>/<code>to</code> 中更长的那一串、<code>visibility: hidden</code>。</li></ul><p>  它撑出槽的宽度，两个值都绝对定位不占流 ⇒ <strong>换值零位移</strong>。   demo 句尾那句「，一年翻了八倍」就是证人：撑宽没做对，它会在替换那一帧横跳</p><ul><li><strong>新值升起 8px（≈ 字号 20%）</strong>：方向朝上——&quot;新的顶上来&quot;。朝下（从上方落）读作&quot;又来一条&quot;，因果反了</li><li><strong><code>keepStrike</code></strong>：默认 <code>true</code>（划线留在屏上，论证的证据还在）；</li></ul><p>  设 <code>false</code> 则划线随旧值一起淡出，读作&quot;改完了、痕迹擦掉&quot;——用在不想强调否定、只想换值的场合</p><ul><li><strong>层级</strong>：舞台白底 → 句子（一行，<code>nowrap</code>）→ 替换槽（<code>inline-block</code>、宽度由尺子定）→ {尺子 / 旧值+线 / 新值}</li></ul><p><strong>变体 b · value-swap（原位换值）</strong>：同一套骨架，去掉划线那一段，<code>from/to</code> 换成 <code>values[]</code> 多值序列， 每个换值点做一次&quot;旧值上浮淡出 + 新值下方升入&quot;（12px、<code>Easing.inOut(cubic)</code>、约 0.33s）。 适合数字连续跳变（报价三档、参数逐代、进度分阶段），<strong>没有否定语义</strong>——只有&quot;这个位置的值变了&quot;。 两个变体的共同纪律就是隐形尺子：值再怎么换，容器宽度一次定死，布局绝不位移。</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>total</code></td><td>4.0s</td><td>唯一的时长旋钮（三段按比例切）；&lt;2.5s 划线太快、&quot;否定&quot;没有过程感，&gt;6s 观众等着它划完</td></tr><tr><td><code>strikeEnd</code></td><td>40%</td><td>划线占总时长的比例；&lt;25% 划线一闪而过、读作下划线闪现，&gt;55% 交换被挤到尾部、hold 不够读</td></tr><tr><td>交换段</td><td>40%→60%（20%）</td><td>这 20% 就是&quot;替换&quot;那一拍；&lt;10% 读作硬切换字，&gt;35% 两个值长时间半透明叠在一起、糊成一团</td></tr><tr><td>线高</td><td>字号 × 8%</td><td>3px @32px 字号；&lt;5% 在 1080p 缩放后会断续，&gt;12% 变成一条色条、把字盖住（那是高亮不是划掉）</td></tr><tr><td>线的圆角</td><td>2px</td><td>方头读作代码里的下划线，圆头才像笔划过；&gt;4px 短值上会看到线变成胶囊</td></tr><tr><td><code>toRise</code></td><td>8px（≈ 字号 20%）</td><td>新值升起距离；0 读作原地淡入（替换感减半），&gt;20px 读作&quot;从下面飞进来&quot;、抢戏</td></tr><tr><td>划线缓动</td><td><code>power1.inOut</code></td><td>匀速读作进度条；<strong>禁 <code>back</code>/<code>elastic</code></strong>（纠错不是花字，回弹读作综艺整活）</td></tr><tr><td>新值缓动</td><td><code>power2.out</code></td><td>顶上来后收住；<code>back.out</code> 会让新值弹一下，与&quot;严肃更正&quot;的气质冲突</td></tr><tr><td><code>lead</code></td><td>0.35s</td><td>起手静置等口播念到这个值；0 则线已经划完观众还没看清旧值是什么</td></tr><tr><td><code>keepStrike</code></td><td><code>true</code></td><td>划线是否留在屏上；<code>true</code> = 证据还在（默认，否定更重），<code>false</code> = 改完擦掉痕迹</td></tr><tr><td>语义色</td><td>红 <code>#e0452c</code> / 橙</td><td><strong>只上那条线</strong>；上到文字上就会抢掉&quot;划掉&quot;这一拍</td></tr></table><h3>已知坑</h3><ul><li>新值另起一行或排在旧值旁边——读作&quot;这里有两个数据&quot;，替换感消失；两者必须绝对定位在同一个位置上叠放。</li><li>容器宽度没被隐形尺子撑住——替换那一帧句子其余部分横跳，一眼是 bug；<code>from</code>/<code>to</code> 里更长的那一串必须先占位。</li><li>短值在预留宽度里左对齐——尾部留一个刺眼的空洞，观众读成&quot;这里少打了一个字&quot;；两个值都以槽中线为锚。</li><li>划线动 <code>width</code> 而不是 <code>scaleX</code>——每帧重排，<code>inline-block</code> 的槽里会带着整句抖（本库反例清单第一条）。</li><li>划线的 <code>transform-origin</code> 用默认中心——线从中间往两头长，读作&quot;删除线正在被插入&quot;而不是&quot;手划过去&quot;。</li><li>划线是槽的兄弟节点而不是旧值的子节点——旧值淡出后线还留在屏上，压在新值身上（新值看起来也被划掉了）。</li><li>语义色同时上到新值/旧值上——注意力被&quot;新值好看&quot;抢走，&quot;旧值被否掉&quot;这一拍反而轻了；一段只给一个语义色，且只给线。</li><li>划线加回弹缓动——严肃的更正读成综艺整活，气质全毁。</li><li>新值从上方落下——因果反了（读作&quot;又来一条&quot;而不是&quot;新的顶上来&quot;）；必须从下方顶上来。</li><li>划完立刻换值（没有交换段）——硬切换字，观众来不及看清&quot;是这个值被划掉了&quot;。</li><li>一句话里替换两个以上的值——两条划线互相打架，观众不知道该看哪个否定；一句只否一个。</li><li>hold 太短（&lt;1s）——论证的落点是&quot;划线 + 新值同屏&quot;这个画面，没时间读就等于没论证。</li><li>句子设成可折行（没有 <code>nowrap</code>）——替换槽后面的字被挤到第二行，&quot;零位移&quot;这条纪律看不出来（demo 踩过：句子太长导致证人跑到下一行）。</li><li>用在&quot;新增/强调&quot;的语境——本卡的动作语义是<strong>否定</strong>，用来强调一个正确的值会让观众以为它被划掉了。</li><li><strong>叠在上一话题的满画面上</strong>（2026-08-28 v4 用户实判）——&quot;但这次不是X&quot;类枢轴句是<strong>下一镜的开题动作</strong>，</li></ul><p>  本卡要上清过场的舞台；把它挤在旧镜（比如一屏统计数字）的角落里，划线会与旧内容相撞、   转折的戏剧性也没了。切镜点提前到枢轴句起点（cinematography.md §4.5 第 2 条）。</p><h3>复用指引</h3><ul><li>HTML/GSAP：demos/strike-and-replace/index.html。<strong>换内容只改 <code>CONFIG.from</code> / <code>CONFIG.to</code></strong> 与句子模板里</li></ul><p>  替换槽前后的文字（<code>.sr-line</code> 里那句）；隐形尺子会自动取更长的那个值，不需要手改宽度。   节奏只改 <code>CONFIG.total</code>（三段按比例自动切）。语义色改 <code>.strike</code> 的 <code>background</code>，   线高改 <code>.strike</code> 的 <code>height</code>（保持 = 字号 × 8%）。要变体 b（原位换值、不否定）就删掉划线那一段 tween、   把 <code>from/to</code> 扩成数组逐个换值——骨架（槽 + 尺子 + 同位叠放）完全复用。</p><ul><li>Remotion 移植：原版两份源码都极短，直接对着抄——</li></ul><p>  <code>registry/remocn/strikethrough-replace/index.tsx</code> 是本卡主体（三段用 <code>durationInFrames × 0.4/0.6</code> 切，   <code>linePct</code> 那处把 <code>width: ${linePct}%</code> 改成 <code>scaleX</code> 再套 <code>transform-origin: left</code>），   <code>registry/remocn/value-swap/index.tsx</code> 是变体 b（<code>sizer = values.reduce((a,b)=&gt; b.length&gt;a.length ? b : a)</code>   就是隐形尺子，<code>at</code> 收多个换值帧号，<code>opacity = pIn × (1 − pOut)</code> 让相邻两值交叉淡化）。   线宽用 <code>Math.max(2, Math.round(fontSize * 0.08))</code>；新值 <code>y = interpolate(frame,[fadeStart,fadeEnd],[8,0])</code>。</p><ul><li>剪辑软件对应物：剪映/CapCut——旧值与新值各一个文本层<strong>对齐到同一个位置</strong>（关键：不要用&quot;上下排列&quot;的模板），</li></ul><p>  划线用一个 3px 色条层做&quot;缩放&quot;或&quot;擦除&quot;入场（<code>transform-origin</code> 靠左，剪映里把锚点拖到左端），   旧值在划完那一帧起 0.2s 不透明度 100→0、新值同帧起位置 +8px→0 配不透明度 0→100。   AE——线用 Shape Layer 的 <code>Scale X</code> 键（Anchor Point 拖到左端）或 <code>Trim Paths</code> 的 <code>End 0→100%</code>（更干净），   两个文本层同 Position、透明度对开；隐形尺子在 AE 里的等价做法是<strong>用最长值先排好版再改文字</strong>   （或给两层套同一个固定宽度的 Null 父级）。</p><ul><li>与本库强调类的分工：<code>keyword-pop-highlight</code>（砸重音）/ <code>highlighter-sweep</code>（涂高亮）/</li></ul><p>  <code>type-contrast-emphasis</code>（字形落差）/ <code>magnifier-detail</code>（放大）/ <code>focus-dim-spotlight</code>（压暗）/   <code>callout-line-label</code>（引线）/ <code>scribble-annotation</code>（手绘圈注）全是<strong>加强</strong>；   <strong>本卡是唯一的&quot;否定&quot;</strong>。它与前述任何一张都不在同一句里混用——   同一句里既有&quot;被划掉的旧值&quot;又有&quot;被砸出来的重音&quot;，观众不知道这句到底是肯定还是否定。   同族的 <code>number-counter</code> 是&quot;数字在涨&quot;（过程），本卡变体 b 是&quot;值被换了&quot;（结果），两者语义不同。</p><h3>动效范围</h3><ul><li>属于本卡的：三段时间结构（划线 0→40% / 交换 40~60% / hold 60~100%，按总时长比例切）；划线用 <code>scaleX</code> + <code>transform-origin: left</code>（拒绝动 <code>width</code>）与线高 = 字号 8% / 圆角 2px 的规格；旧值淡出与新值从下方 8px 顶上来在<strong>同一位置绝对定位叠放</strong>这条机制（替换感的全部来源）；划线作为旧值子节点、随旧值一起淡出这条实现纪律；隐形尺子撑宽容器以保证换值零位移（变体 b 的核心，两个变体共用）；短值在预留宽度里居中（两值都以槽中线为锚）；&quot;语义色只上那条线、文字保持墨色&quot;这条取舍；划线缓动 <code>power1.inOut</code> 且禁回弹。</li><li>不属于本卡的：demo 那句「上下文窗口是 128K → 1M，一年翻了八倍」的具体文案与数值、32px 字号与 700 字重、<code>#e0452c</code> 这个具体红（橙同样成立）、<code>#1d1d1f</code> 墨色、白底舞台、左侧主持人（数字人）占位、以及&quot;替换槽在句中&quot;这个位置（句首句尾同样成立）。</li><li>迁移接口：<code>CONFIG.from</code> / <code>CONFIG.to</code> 是唯一的内容入口（尺子自动取更长者）；<code>total</code> 是唯一的时长旋钮；<code>toRise</code> 与线高按字号等比缩放（20% / 8%），换画幅时这两条比例保持不变；<code>keepStrike</code> 切换&quot;证据留屏 / 改完擦掉&quot;；语义色换成品牌的警示色即可，但<strong>只能上到线上</strong>；竖屏把句子拆短（替换槽后面必须还留至少 3~4 个字当&quot;零位移&quot;的证人，且整句必须单行 <code>nowrap</code>）；多值连续跳变换用变体 b（去掉划线段，<code>values[]</code> + 多个换值点）。</li><li>底色要求：白底/浅底最佳（墨色文字 + 语义色线靠对比成立）。深底把文字换成浅色、线换成更亮的警示色（红在深底上要提亮一档，否则与深底糊在一起），其余参数不变；<strong>底不能有横向纹理</strong>——划线是一条横向生长的线，带横向纹理的底会让线的端点位置读不准。</li></ul>","lower-third-nameplate":"<h3>意图</h3><p>观众需要在人物开口的头两秒内知道&quot;这是谁、凭什么听他说&quot;——人名条是成本最低的信任背书。 命门：<strong>三段接力</strong>（色条 → 姓名 → 头衔，任意两段同时出层次就塌）、 <strong>出场反向收回</strong>（文字先收、色条后收；直接淡出像素材播完了，收回去才是&quot;完整的一次亮相&quot;）、 <strong>对比度</strong>（色条要饱和、字要加投影，压在任何实拍背景上都读得出）。</p><h3>动效核心</h3><ul><li>结构：姓名（大字 42px/960 舞台）→ 横向色条（高 7px 饱和色）→ 头衔（小字 19px 灰白），左下角安全区内（左 56px、下 64px）</li><li>入场：色条 scaleX 0→1（origin left）0.3s <code>power4.out</code> → 姓名 <code>clip-path: inset(0 100% 0 0)</code>→<code>inset(0 0 0 0)</code> 从左揭示 0.25s（在色条走完 70% 时起步，接力不等待）→ 头衔同法延迟 0.15s</li><li>hold：2~5s，完全静止即可（元素小，不需要防呆滞漂移）</li><li>出场反向：头衔先收 → 姓名 +0.08s → 色条最后 scaleX→0（<code>power4.in</code>）；总 0.5s 内</li><li>变体 b（公司/品牌展示牌）：深色半透明圆角底整体 scale 0.9→1 淡入，圆 logo <code>back.out(2)</code> 弹入 0.25s，名称 + 副行从右侧 18px 处 stagger 0.1s 滑入；适合放右上角</li><li>层级：实拍画面 → 人名条（最上），千万别被字幕压住</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>色条时长</td><td>0.3s</td><td>快了（0.15s）像故障闪现；慢了后面两段等不起</td></tr><tr><td>姓名揭示时长</td><td>0.25s</td><td>clip 揭示要干脆；&gt;0.4s 像窗帘拉开</td></tr><tr><td>头衔延迟</td><td>0.15s</td><td>层次感的最小单元；0 = 层次塌，&gt;0.3s 像卡了</td></tr><tr><td>hold 时长</td><td>3~5s</td><td>按&quot;观众读完姓名+头衔两遍&quot;计；超 8s 变成台标</td></tr><tr><td>接力起步点</td><td>色条走完 70% 处</td><td>等色条 100% 才出字会有可感知的空拍；50% 之前出字像抢跑</td></tr><tr><td>色条颜色</td><td>品牌色/高饱和红</td><td>低饱和融进实拍背景；色条是视线锚点必须跳出来</td></tr></table><h3>已知坑</h3><ul><li>姓名和头衔同时出——信息一次全到，层次塌掉，观众反而两个都没读进去。</li><li>出场直接整体淡出——像素材放完了自然消失；反向收回（后出的先收）才是&quot;动效有始有终&quot;。</li><li>色条用 width 动画而不是 scaleX——width 回流卡顿且文字跟着换行；transform 才顺滑。</li><li>文字没有 clip 揭示直接淡入——和色条的&quot;横向语言&quot;不统一，模板感立现。</li><li>压在画面正下方字幕区——和字幕打架；人名条的家在左下但要高于字幕安全区。</li><li>头衔写两行以上——读不完；一行 12 字内，多余身份删掉。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/lower-third-nameplate/index.html。改 <code>.name/.title</code> 文案、<code>.bar</code> 换品牌色；节奏都在 <code>CONFIG</code>（barDur/nameDur/titleLag/hold）；变体 b 在 <code>.plate</code>，改 logo 字和公司名即可。</li><li>Remotion 移植：三段用 <code>&lt;Sequence from={...}&gt;</code> 串接；clip 揭示 <code>clipPath: inset(0 ${interpolate(frame,[0,8],[100,0])}% 0 0)</code>；出场用总时长减帧数做反向 interpolate。</li><li>剪辑软件对应物：剪映&quot;文字模板→字幕条/人名条&quot;分类；AE 是 Videohive &quot;lower thirds&quot; 品类（2.6 万商品直接套）；FCPX 内置 Lower Thirds 生成器；CapCut &quot;Name tag&quot; 贴纸。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：色条 <code>scaleX 0→1</code>（origin left，0.3s，<code>power4.out</code>）→ 姓名 <code>clip-path inset(0 100%→0)</code> 从左揭示（0.25s，在色条走完 70% 时起步，接力不等待）→ 头衔同法再延迟 0.15s 的三段接力；出场<strong>反向收回</strong>（头衔先收 → 姓名 +0.08s → 色条最后 <code>scaleX→0</code>，<code>power4.in</code>，总 0.5s 内）；文字与色条统一的&quot;横向语言&quot;（都从左侧展开，不用淡入）；变体 b 的整体 scale 0.9→1 + 圆 logo <code>back.out(2)</code> 弹入 + 名称/副行 18px 处 stagger 0.1s 滑入。hold 期完全静止即可（元素小，不需要防呆滞漂移）。</li><li>不属于本卡的：色条颜色、姓名/头衔文案与字号、变体 b 的圆角与边框、实拍画面（demo 用灰阶主持人占位）、左下 56/64px 的具体安全区数值（按画幅重算）。原 demo 上的文字投影也不属于本卡——那是为压在实拍背景上加的可读性补丁，白底上不需要。</li><li>迁移接口：<strong>色条颜色 = 复用者的品牌色接口</strong>——改 <code>.lt .bar</code> 的 <code>background</code>（demo 收敛为墨色 #1d1d1f；实拍场景建议换高饱和品牌色，低饱和会融进背景，色条是视线锚点必须跳出来），变体 b 的 <code>.plate .logo</code> 同理；节奏在 <code>CONFIG</code>（<code>barDur</code>/<code>nameDur</code>/<code>titleLag</code>/<code>hold</code>/<code>outDur</code>/<code>plateAt</code>）；换尺寸时字号与色条高度（7px @960 舞台）同比缩放；压在实拍上时给文字补投影或垫半透明底，这属于迁移时自加的可读性层。</li><li>底色要求：白底即可。实拍落地时底色是任意视频画面，因此<strong>对比度要自证</strong>——色条与文字必须在目标背景上读得出（这是迁移方的责任，不是本卡的动效内容）。</li></ul>","behind-text-title":"<h3>意图</h3><p>标题直接叠在人物上面读作&quot;字幕&quot;，从人身后升起、被身体遮挡穿出，观众读到的是<strong>空间</strong>—— 一行字瞬间有了片头的仪式感。命门三条： 1. <strong>必须有遮挡</strong>：标题与人物重叠面积 ≥25%（demo 里人物头顶吃进标题下缘），零重叠就是普通标题。 2. <strong>hold 期间反向漂移</strong>：标题与人物各往相反方向极缓移动，视差才成立；同向漂移层次感当场消失。 3. <strong>字要够大且有立体质感</strong>：字号占屏高 40%+（demo 235px），小字被遮一角只会像排版事故；字面用 3D 挤出艺术字（渐变字面 + 灰阶递进 text-shadow 侧面 + 落地投影），平面黑字压不住这个构图。</p><h3>动效核心</h3><ul><li>三层 z-index：背景（z0）→ 大字标题层（z1）→ 前景人物剪影（z2，实拍中来自抠像）；</li></ul><p>  另加小字副标（z1，标题上方）与字幕区（z3）</p><ul><li>标题入场（0.4s 起）：opacity 0→1 + y 40px→0 + letter-spacing 0.2em→0.05em 收拢，0.55s <code>power3.out</code>——</li></ul><p>  升起与收字距同步，像&quot;从人背后聚拢成形&quot;</p><ul><li>副标小字：晚 0.35s，opacity 0→1 + y 10px→0，0.4s <code>power2.out</code></li><li>hold（入场完成即开始）：标题 x 0→+4px、人物 x 0→-4px，<code>sine.inOut</code> + yoyo 无限往复，</li></ul><p>  半周期 4s（整周期 8s）——快了穿帮，慢到 8s 才像&quot;镜头在呼吸&quot;</p><ul><li>遮挡由层级天然完成，不用 mask；人物剪影高度决定吃进标题多少</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>titleIn</code></td><td>0.55s</td><td>&lt;0.4s 像弹出失去庄重感；&gt;0.8s 拖沓，观众等字</td></tr><tr><td><code>riseFrom</code></td><td>40px</td><td>越大&quot;从身后钻出&quot;越明显；&gt;80px 会从人物中段穿身而过穿帮</td></tr><tr><td><code>trackFrom</code> → <code>trackTo</code></td><td>0.2em → 0.05em</td><td>收拢量越大越有&quot;聚焦成形&quot;感；不收字距入场读作平移</td></tr><tr><td><code>driftPx</code></td><td>4px</td><td>&gt;8px 像素材没固定住在漂；0 则 hold 期间死板如截图</td></tr><tr><td><code>driftPeriod</code></td><td>8s</td><td>&lt;4s 读作晃动穿帮；越长越像呼吸镜头</td></tr><tr><td><code>subDelay</code></td><td>0.35s</td><td>与主标同帧出=层次塌掉；&gt;0.6s 观众以为没有副标</td></tr><tr><td><code>.bt-title</code> font-size</td><td>150px</td><td>屏高 25% 起步；再小遮挡读不出&quot;在身后&quot;</td></tr><tr><td><code>.bt-host</code> height</td><td>372px</td><td>控制遮挡面积：头顶须吃进标题下缘 ≥25%，矮了就是普通标题</td></tr></table><h3>已知坑</h3><ul><li>文字与人物零重叠——没有遮挡就没有&quot;身后&quot;，一眼只是普通大标题。</li><li>漂移同向或幅度相同方向相同——视差的本质是层间相对运动，同向等于整体平移。</li><li>hold 期间完全静止——像卡帧/贴图，伪 3D 骗术全靠那 ±4px 维持。</li><li>字号太小或标题放得太高躲开人物——遮挡消失，效果退化为片头字幕。</li><li>漂移周期太短——观众看出&quot;元素在动&quot;而不是&quot;镜头在呼吸&quot;，立刻廉价。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/behind-text-title/index.html。换文案改 <code>.bt-title</code>（主标）与 <code>.bt-sub</code>（副标）内文本；</li></ul><p>  换色改 <code>.bt-title</code> 的 <code>color:#e9e6dc</code>、<code>.bt-sub</code> 的 <code>color:#9a97a8</code>、<code>.bt-bg</code> 的渐变；   时序手感全部在顶部 <code>CONFIG</code>（titleIn / riseFrom / trackFrom / trackTo / driftPx / driftPeriod / subDelay）；   遮挡量调 <code>.bt-host</code> 的 width/height。核心动画即 <code>DemoShell.register</code> 内那一段，连 CONFIG 一起复制可直接摘走。</p><ul><li>Remotion 移植：三个绝对定位层按 z-index 叠放（人物层用抠像视频 <code>&lt;OffthreadVideo&gt;</code> 或带 alpha 的序列帧）；</li></ul><p>  升起用 <code>interpolate(frame, [t0, t0+0.55*fps], [40, 0], {easing: Easing.out(Easing.cubic)})</code> 同步驱动 y、   opacity 与 letterSpacing（0.2em→0.05em）；hold 漂移用 <code>Math.sin((frame/fps) * 2*Math.PI / 8) * 4</code>，   标题取正、人物层取负，帧驱动天然 seek 安全。</p><ul><li>剪辑软件对应物：剪映/CapCut 用&quot;智能抠像&quot;复制一层人物置顶、文字轨夹在原片与抠像层之间（教程常叫</li></ul><p>  &quot;text behind person / 人物遮挡文字&quot;）；AE 里 Roto Brush 抠前景置顶，标题层 Position 打关键帧 +   <code>loopOut(&quot;pingpong&quot;)</code> 做反向漂移；FCPX 用 Keyer + 三层堆叠同理。</p><h3>动效范围</h3><ul><li>属于本卡的：3D 挤出艺术字质感（渐变字面 + 灰阶递进阴影侧面——立体靠灰阶层次，颜色是迁移接口）；三层 z 序（背景 → 大字标题 → 前景人物）以及由层级天然完成的遮挡（不用 mask）；标题入场 opacity 0→1 + y 40px→0 + <code>letter-spacing 0.2em→0.05em</code> 三者同步（0.55s、<code>power3.out</code>，&quot;从人背后聚拢成形&quot;）；副标晚 0.35s 的 opacity + y 10px→0；hold 期标题 +4px / 人物 −4px 的<strong>反向</strong>极缓漂移（<code>sine.inOut</code> + yoyo 无限，半周期 4s）；标题与人物重叠面积 ≥25% 这条几何约束。</li><li>不属于本卡的：背景（demo 已去掉渐变与暗角，纯白）、标题/副标文案与字体、人物剪影的画法（demo 用 host-placeholder 的灰阶版，实拍来自抠像）、字幕、150px 与 372px 这两个绝对值（按画幅折算）。</li><li>迁移接口：字色改 <code>.bt-title</code> 的 <code>color</code>（默认墨色 #1d1d1f）与 <code>.bt-sub</code> 的辅助灰 #8a8a8a；时序在 <code>CONFIG</code>（<code>titleIn</code>/<code>riseFrom</code>/<code>trackFrom</code>/<code>trackTo</code>/<code>driftPx</code>/<code>driftPeriod</code>/<code>subDelay</code>）；换尺寸时字号按<strong>屏高 25% 起步</strong>折算、<code>riseFrom</code> 与 <code>driftPx</code> 同比缩放（<code>driftPeriod</code> 不缩放，它是呼吸感的绝对时间）；遮挡量调 <code>.bt-host</code> 的 width/height 或换成真实抠像层，务必让头顶吃进标题下缘 ≥25%。</li><li>底色要求：白底即可，前提是<strong>标题、人物、底三者明度要分得开</strong>——本卡的效果全靠&quot;字被人挡住&quot;这个层次读出来。白底上人物剪影用浅灰（#e3e3e6/#ececef）、字用墨色即成立；实拍落地时人物层是抠像素材，标题色需与人物主色拉开对比，否则遮挡边界看不出来，效果退化成普通标题。</li></ul>","chevron-lower-third":"<h3>意图</h3><p>观众需要在人物开口的头两秒知道&quot;这是谁、凭什么听他说&quot;——人名条是成本最低的信任背书。 这个需求本库已有 <code>lower-third-nameplate</code> 在解决，所以本卡的存在必须靠<strong>区别</strong>站住：</p><p><strong><code>lower-third-nameplate</code> = 色条 → 姓名 → 头衔的三段接力</strong>（一根横色条先展开， 文字被 clip 从左揭示；克制、新闻感、&quot;横向语言&quot;统一）。 <strong>本卡 = chip 展开 + chevron 收尾</strong>：职称不是一行灰字，而是坐在<strong>实心 chip</strong> 上 （身份被&quot;发牌&quot;出来，像一枚标签）；收尾多了三枚 chevron 依次点亮， 读作&quot;这条子还在往右延伸&quot;——一个<strong>没有停下来的</strong>收尾。 所以本卡比那张多一档动态感：那张是&quot;贴上去一块名牌&quot;，本卡是&quot;发出一枚标签、并且还在走&quot;。 选卡标准很直接：正式访谈/纪录片用那张，节目感/网感的片子用这张。</p><p>命门三条： ① <strong>chip 内的字滞后 chip 2 帧（0.067s）</strong>。字跟着 chip 一起被刷出来读作一整块 PNG； chip 先成形、字后落，才有&quot;发牌&quot;的两拍。 ② <strong>chevron 是收尾不是装饰</strong>。它必须在 chip 落定<strong>之后</strong>依次点亮，且错峰要密 （0.07s）——三枚读作<strong>一道扫过</strong>，不是三个小箭头各自出现。 ③ <strong>hold 要给 2.0s</strong>。人名条的本职是让人读完姓名 + 头衔，读不完等于没打； 其他动效 1.5s 够，这张不够。</p><h3>动效核心</h3><ul><li><strong>结构</strong>（@960×540 舞台）：左下安全区内（左 72 / 下 96），第一行 44px/700 墨字姓名；</li></ul><p>  第二行是 flex 行：实心 chip（高 40，<code>border-radius: 12</code> 小件圆角档，   内 21px/600 白字）+ 12px 间隙 + 三枚 15×26 的 chevron（4.5px 描边 <code>round</code> 端头）。   整条包在一个 <code>transform-origin: left center</code> 的 <code>.clt</code> 里（退场时整条一起收回）</p><ul><li><strong>① 姓名推出</strong>：<code>x -26→0</code> + <code>opacity 0→1</code>，<code>0.26s power3.out</code></li><li><strong>② chip 展开</strong>：chip 背景是独立层 <code>.clt-chip-bg</code>（<code>transform-origin: left center</code>，</li></ul><p>  <code>scaleX 0→1</code>，<code>0.22s power3.out</code>），起步 = 姓名起步 + <code>0.1s</code>（错峰，不等姓名走完）；   chip 内字 <code>opacity 0→1</code>（<code>0.14s</code>），滞后 chip <code>0.067s</code>（≈2 帧 @30fps）。   <strong>字不参与 scaleX</strong>（否则被横向拉扁），chip 容器加 <code>overflow: hidden</code> 兜底</p><ul><li><strong>③ chevron 扫过</strong>：<code>opacity 0→1</code> + <code>x +5→0</code>，各 <code>0.14s power2.out</code>，错峰 <code>0.07s</code>；</li></ul><p>  起步 = chip 落定。错峰密到读作一道扫过而不是三个元素</p><ul><li><strong>④ hold 2.0s</strong>：全部静置（元素小，不需要防呆滞漂移）</li><li><strong>⑤ 退场</strong>：整条 <code>.clt</code> 一起 <code>scaleX 1→0</code> + <code>opacity 1→0</code>，<code>0.2s power2.in</code></li></ul><p>  （比入场的 0.26s 快——出场永远比入场轻，design-language §4）</p><ul><li><strong>层级</strong>：人物画面 → 人名条（最上，且必须高于字幕安全区）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>namePush</code></td><td>-26px</td><td>姓名推出位移；0 = 纯淡入（少了&quot;推上来&quot;的方向），&lt;-60px 读作从画外飞入，抢了 chip 的戏</td></tr><tr><td><code>nameDur</code></td><td>0.26s</td><td>姓名推出时长；&lt;0.15s 读作硬现，&gt;0.45s 后面两段等不起（整条入场超过 1s 就拖）</td></tr><tr><td><code>chipGap</code></td><td>0.1s</td><td>chip 相对姓名起步的错峰；0 = 两行一起进（层次塌），&gt;0.3s 读作两个独立动效（&quot;名字来了…哦还有个标签&quot;）</td></tr><tr><td><code>chipDur</code></td><td>0.22s</td><td>chip 展开；&lt;0.12s 读作色块硬现，&gt;0.4s 观众看着 chip 慢慢长，节奏散</td></tr><tr><td><code>chipTxtLag</code></td><td>0.067s（2 帧 @30fps）</td><td><strong>本卡第一命门</strong>；0 = 字跟着 chip 一起被刷出来（整块 PNG 感），&gt;0.2s 读作 chip 空着等字</td></tr><tr><td><code>chevStagger</code></td><td>0.07s</td><td><strong>本卡第二命门</strong>；&lt;0.04s 三枚几乎同时（读作一个整体图形），&gt;0.15s 读作三个小箭头各自出现（装饰化）</td></tr><tr><td><code>chevDur</code></td><td>0.14s</td><td>单枚 chevron 点亮；比 chip 快（它是轻件），拉长会让收尾比主体还重</td></tr><tr><td><code>chevSlide</code></td><td>5px</td><td>chevron 点亮时的 x 位移；0 = 纯淡入（可用，&quot;延伸感&quot;弱一点），&gt;12px 读作三个小箭头在飞</td></tr><tr><td>chevron 枚数</td><td>3</td><td>2 枚&quot;延伸感&quot;不够（读作两个点），≥4 枚在小尺寸下糊成一片；3 是&quot;还在走&quot;的最小可读数量</td></tr><tr><td><code>hold</code></td><td>2.0s</td><td><strong>本卡第三命门</strong>；&lt;1.5s 观众读不完姓名 + 头衔（等于没打），&gt;8s 变成常驻台标（那是另一件事）</td></tr><tr><td><code>outDur</code></td><td>0.2s</td><td>退场时长；<strong>必须短于 <code>nameDur</code></strong>（出场比入场轻）；&gt;0.4s 读作&quot;舍不得走&quot;</td></tr><tr><td>头衔字数</td><td>≤12 字一行</td><td>超过一行读不完；多余身份直接删（&quot;供应链咨询顾问 · 12 年&quot;已是上限）</td></tr><tr><td>落位</td><td>左 72 / 下 96</td><td>必须在 action-safe 内且<strong>高于字幕安全区</strong>；下缘小于 64px 会和字幕打架</td></tr></table><h3>已知坑</h3><ul><li>chip 内的字跟着 chip 一起 <code>scaleX</code>——字被横向拉扁，慢放下非常明显；字必须是 chip 背景层之上的独立层。</li><li>chip 内字不滞后（与 chip 同时淡入）——整条读作一张预先做好的 PNG 贴上来，&quot;发牌&quot;的两拍消失。</li><li>chevron 在 chip 落定前就点亮——收尾语义变成&quot;和主体一起进场的装饰&quot;，&quot;条子还在延伸&quot;这层意思全丢。</li><li>chevron 错峰拉到 0.15s 以上——三枚变成三个独立小箭头依次出现，读作装饰而不是一道扫过。</li><li>chevron 加到四枚以上——在实际投放尺寸（手机竖屏）上糊成一片色，还挤占了头衔的横向空间。</li><li>退场直接整体淡出——像素材播完了自然消失；反向收回才是&quot;完整的一次亮相&quot;（这条与 <code>lower-third-nameplate</code> 共享）。</li><li>退场做得比入场慢——违反 design-language §4（出场永远比入场轻），读作&quot;舍不得走&quot;。</li><li>hold 只给 1.2~1.5s（照抄别的卡）——人名条的本职是让人读完，读不完等于没打；这张卡必须给 2.0s。</li><li>chip 用 <code>width</code> 动画而不是 <code>scaleX</code>——width 变化触发回流，chip 内的字会跟着换行/跳动。</li><li>姓名和 chip 用两个不同的强调色——同屏第二个&quot;看这里&quot;色（design-language §1 红线）；chip 与 chevron 共用唯一强调色，姓名走墨色。</li><li>压在画面正下方字幕区——和字幕打架；人名条的家在左下但必须高于字幕安全区。</li><li>头衔写两行——读不完，而且 chip 变成一个方块（chip 的语义是&quot;一枚标签&quot;，标签是扁的）。</li><li>忘了给 <code>.clt</code> 设 <code>transform-origin: left center</code>——退场时整条从中心收，读作&quot;被吸走&quot;而不是&quot;收回左边&quot;。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/chevron-lower-third/index.html。换文案改 <code>.clt-name</code> 与</li></ul><p>  <code>.clt-chip span</code>（头衔 ≤12 字），chip 宽度自动跟着文字走（<code>padding: 0 18px</code>）；   改强调色只动 <code>:root --acc</code>（chip + chevron 共用，姓名保持墨色）；   节奏全在 <code>CONFIG</code>（<code>namePush</code>/<code>nameDur</code>/<code>chipGap</code>/<code>chipDur</code>/<code>chipTxtLag</code>/   <code>chevStagger</code>/<code>hold</code>/<code>outDur</code>）；落位改 <code>.clt</code> 的 <code>left</code>/<code>bottom</code>。   实拍落地时给姓名与 chip 补一层投影或半透明底板——那是<strong>迁移方自加的可读性层</strong>，不属于本卡。</p><ul><li>Remotion 移植：整条包一个 <code>&lt;div style={{transformOrigin: &quot;left center&quot;, transform: </code>scaleX(${out})<code>}}&gt;</code>；</li></ul><p>  姓名 <code>x = interpolate(f, [0, 8], [-26, 0], {easing: Easing.out(Easing.cubic), extrapolateRight: &quot;clamp&quot;})</code>；   chip 背景 <code>scaleX</code> 用 <code>f - 3</code> 局部时钟、chip 内字用 <code>f - 3 - 2</code>；   chevron 三枚用 <code>f - 10 - i*2</code>；退场用 <code>interpolate(f, [outFrame, outFrame+6], [1, 0])</code>。   帧换算 @30fps：<code>nameDur 0.26s ⇒ 8f</code>、<code>chipGap 0.1s ⇒ 3f</code>、<code>chipTxtLag 0.067s ⇒ 2f</code>、   <code>chipDur 0.22s ⇒ 7f</code>、<code>chevStagger 0.07s ⇒ 2f</code>、<code>hold 2.0s ⇒ 60f</code>、<code>outDur 0.2s ⇒ 6f</code>。</p><ul><li>剪辑软件对应物：剪映/CapCut——&quot;文字模板 → 字幕条/人名条&quot;分类里有大量带 chip 的款，</li></ul><p>  但<strong>内置款的 chip 与字基本是一起进场的</strong>（丢掉本卡第一命门）；要做对就自己搭：   文字层 + 色块层，色块用&quot;向右展开&quot;入场、文字用&quot;渐显&quot;并把入场时间往后拖 2 帧；   chevron 用三个 <code>&gt;</code> 文字层或箭头贴纸，入场时间各差 2 帧。   AE——Shape Layer 做 chip（Scale X 0→100%，锚点移到左边缘）+ 文字层单独 Opacity 关键帧   晚 2 帧；三枚 chevron 各自 Position + Opacity，用 <code>Sequence Layers</code>（Overlap 关掉）   自动排 2 帧错峰；整条用一个 Null 父级做退场 Scale X。FCPX 内置 Lower Thirds 生成器   改不出 chip 滞后，建议自搭。</p><ul><li>与本库同类卡的分工：<strong><code>lower-third-nameplate</code> = 色条 → 姓名 → 头衔三段接力</strong></li></ul><p>  （克制、新闻/纪录片感、横向语言统一、头衔是灰字）；   <strong>本卡 = 姓名推出 → chip 展开 → chevron 收尾</strong>（节目感/网感、头衔是一枚实心标签、   收尾&quot;还在延伸&quot;）。两张不要在同一片子里混用——人名条是全片一致的模板件，   换款会让观众以为换了节目。<code>host-shrink-to-chip</code> = 人物本身缩成角标（构图变化，不是标注）；   <code>subscribe-cta</code> = 行动号召（常驻件）。</p><h3>动效范围</h3><ul><li>属于本卡的：姓名 <code>x -26→0 + opacity</code>（0.26s <code>power3.out</code>）推出；chip 背景 <code>scaleX 0→1</code>（origin left，0.22s）错峰 <code>0.1s</code> 跟上、<strong>chip 内字滞后 2 帧（0.067s）淡入且不参与 scaleX</strong>（本卡第一命门）；三枚 chevron 在 chip 落定<strong>之后</strong> <code>opacity 0→1 + x+5→0</code>、错峰 <code>0.07s</code> 密到读作一道扫过（收尾语义：&quot;条子还在延伸&quot;）；hold <strong>2.0s</strong>（人名条专属的长 hold）；退场整条 <code>scaleX→0 + opacity</code>（0.2s <code>power2.in</code>，<strong>必须快于入场</strong>）且 <code>transform-origin: left center</code>；&quot;chip（实心标签）+ chevron（延伸）&quot;这个与三段接力式人名条相区别的组合关系。</li><li>不属于本卡的：demo 那个「陈知远 / 供应链咨询顾问 · 12 年」的具体人名头衔、44px 与 21px 的字号、蓝色 <code>#0066cc</code> 这个具体取值、chip 高 40 与圆角 12 的绝对数值、chevron 的具体形状（<code>&gt;</code> 折线可换三角/箭头）、左 72 / 下 96 的具体安全区数值（按画幅重算）、人物画面（demo 用数字人占位）、实拍落地时补的投影或半透明底板（那是可读性层，迁移方自加）。</li><li>迁移接口：强调色一个变量 <code>--acc</code>（chip + chevron 共用，姓名走墨色，同屏不允许第二个）；字号与 chip 高度按画幅等比（44px/40px @540 舞台高 ⇒ ×2 @1080）；落位按目标画幅的 action-safe 重算，且必须<strong>高于字幕安全区</strong>（横屏字幕 bottom 100px ⇒ 人名条 bottom ≥ 170px；竖屏字幕 bottom 350px ⇒ 人名条要么更高要么改到上方）；节奏在 <code>CONFIG</code>，<code>chipTxtLag</code>（2 帧）与 <code>chevStagger</code>（0.07s）是<strong>手感常量</strong>，换尺寸换语速都不要动；<code>hold</code> 按&quot;姓名 + 头衔读两遍&quot;给（实拍建议 3~5s，demo 压到 2.0s）；<code>outDur</code> 必须短于 <code>nameDur</code>。</li><li>底色要求：白底即可。实拍落地时底色是任意视频画面，因此<strong>对比度要自证</strong>——chip 与姓名必须在目标背景上读得出（浅色背景上墨字姓名成立；深色/花色背景上要给姓名补描边或垫半透明底板）。这是迁移方的责任，不是本卡的动效内容。</li></ul>","danmu-bubble-praise":"<h3>意图</h3><p>口播里&quot;大家都在说&quot;这句话最容易空——嘴上说有共识，画面上没有任何人在说。 弹幕气泡把这句话变成可见的<strong>多人在场</strong>：四条别人的短评从画面两侧漂过，观众读到的不是 &quot;主播贴了四个标签&quot;，而是&quot;这条内容底下真的有人在聊&quot;。</p><p>它和本库的 <code>chat-message-flow</code> 分工不同：那张是<strong>一段对话</strong>（有先后、有回应、气泡沿一条轴堆积， 是叙事载体）；这张没有对话关系，四条评论互不相关、各自从各自的边进出，是<strong>氛围层</strong>—— 它不承担信息，只承担&quot;人多&quot;这个感觉，所以它可以叠在任何一句口播上而不抢内容。</p><p>命门两条：① <strong>必须交叠进出</strong>。全进全出（四枚一起出现、一起消失）读作&quot;一组标签&quot;， 那是版式不是弹幕；只有当第 3 枚进场时第 1 枚正在走，观众才补出&quot;屏幕外还有更多评论正在滚&quot; 这个画面之外的量。② <strong>只有一枚带强调色</strong>，其余走灰阶实色。四枚都彩色 = 花屏， 而且&quot;哪条评论最重要&quot;这个唯一的语义抓手就没了。</p><h3>动效核心</h3><ul><li><strong>单枚的三拍是固定模板</strong>（四枚完全同构，只有起点时间与落位不同）：</li></ul><p>  - 进：<code>x ±26 → 0</code> + <code>scale 0.88 → 1</code> + <code>opacity 0 → 1</code>，<code>0.30s power3.out</code>。     横向方向 = <strong>朝画面中心</strong>（左侧的枚从 −26 推入、右侧的枚从 +26 推入），弹幕从最近的边进   - 停：<code>0.75s</code> 完全静置（不漂、不呼吸——微动会把它从&quot;别人的评论&quot;变成&quot;会动的贴纸&quot;）   - 走：<code>y 0 → −18px</code> + <code>opacity → 0</code>，<code>0.40s power1.in</code>。<strong>出场只动 opacity 与 y，scale 不再动</strong>     （出场永远比入场轻，design-language §4）；上移是&quot;往上滚出去&quot;这个弹幕方向的最小表达</p><ul><li><strong>错峰 0.55s 与停留 0.75s 是一对</strong>：单枚全程 = <code>0.30 + 0.75 + 0.40 = 1.45s</code>，</li></ul><p>  是错峰的 2.6 倍 ⇒ 任一时刻屏上有 2~3 枚、且总有一枚在进或在走。   交叠量的判据：<code>inDur + hold ≤ 2 × stagger</code>（本卡 1.05 ≤ 1.10，刚好卡在临界，密度最高）</p><ul><li><strong>落位分布</strong>：左右各两枚，四枚的 <code>top</code> 全不相同（92 / 158 / 296 / 372），</li></ul><p>  纵向间距不等（66 / 138 / 76）。等间距会读作一列列表；左右交替（左·右·左·右）让视线来回摆</p><ul><li><strong>静态倾斜 ±1.2~1.8°</strong>（<code>-1.5 / +1.5 / +1.2 / -1.8</code>）：贴歪感是<strong>形状属性</strong>，</li></ul><p>  落定后全程不抖（design-language §4 禁 stop-motion 定格抖动）</p><ul><li><strong>气泡形制</strong>：<code>border-radius: 999px</code> 纯圆角胶囊。<strong>无尾巴三角</strong></li></ul><p>  （用户 2026-08-25 定版删除——弹幕是飘过的浮层，尾巴是&quot;谁在说&quot;的对话框语义，   会把它拉回 <code>chat-message-flow</code> 那张卡的语言）；无投影、无描边——   它不是&quot;落在底上的实物&quot;，是浮层。<code>side-l/side-r</code> 只决定<strong>进场方向</strong>，不再决定尾巴朝向</p><ul><li><strong>色阶四级（唯一强调色 + 三级灰阶实色）</strong>：强调枚 <code>#e0452c</code> 底 / 白字；</li></ul><p>  其余三枚 <code>#e8e8ec</code>·<code>#f2f2f4</code>·<code>#e8e8ec</code> 底配 <code>#1d1d1f</code>·<code>#6e6e73</code>·<code>#545458</code> 字——   <strong>靠底色与字色的明度分层，不叠 opacity</strong>（design-language §1 红线）</p><ul><li><strong>层级</strong>：人物全景（z1） → 气泡（z3）。气泡永远压在人物上（评论是叠在画面上的浮层）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>stagger</code></td><td>0.55s</td><td><strong>枚与枚的进场错峰，本卡第一命门</strong>；与 <code>hold</code> 一起决定交叠量。&gt;0.9s 每枚孤立出现、读作四个独立动效；&lt;0.35s 四枚糊成一波，观众一条也读不完</td></tr><tr><td><code>hold</code></td><td>0.75s</td><td>单枚在屏停留；判据 <code>inDur + hold ≤ 2 × stagger</code>。放到 1.4s 以上四枚会同时在屏 = 一组标签（本卡就死了）；&lt;0.5s 观众读不完一条短评</td></tr><tr><td><code>inDur</code></td><td>0.30s</td><td>单枚进场耗时；&gt;0.45s 每枚都像在&quot;郑重登场&quot;，弹幕要的是随手飘进来</td></tr><tr><td><code>outDur</code></td><td>0.40s</td><td>单枚淡出耗时；比 <code>inDur</code> 长是对的（进要有落点、走要不被注意），但 &gt;0.6s 会有四枚长期半透明挂着</td></tr><tr><td><code>inX</code></td><td>26px</td><td>进场横向位移；0 变成原地淡入（丢掉&quot;从边缘外飘进来&quot;的方向），&gt;50px 读作被甩进来</td></tr><tr><td><code>outY</code></td><td>−18px</td><td>飘走上移量；0 变成纯淡出（少了弹幕往上滚的方向感），&gt;40px 读作气球升空</td></tr><tr><td><code>inScale</code></td><td>0.88</td><td>进场起始缩放；&lt;0.7 读作 pop 弹出（是另一种语言，气泡该是飘的）；1 则少一点纵深</td></tr><tr><td><code>tilt</code></td><td>±1.2~1.8°</td><td>各枚静态倾斜；0 读作系统 UI 组件（干净但少了手作感），&gt;4° 读作贴纸墙</td></tr><tr><td>枚数</td><td>4</td><td>3 枚交叠不足（总有一段只剩一枚在屏），6 枚以上单屏读不完——要更多就延长总时长而不是加密错峰</td></tr><tr><td>强调枚数</td><td>1</td><td><strong>恒为 1</strong>，本卡第二命门。2 枚起就没有&quot;哪条最重要&quot;，四枚彩色是花屏</td></tr></table><h3>已知坑</h3><ul><li>四枚一起进、一起出——读作&quot;一组标签&quot;（一个版式），弹幕这层语义直接消失；必须交叠。</li><li>每枚停 2s 以上求&quot;看清&quot;——四枚同时在屏，等于把弹幕做成了四行字幕，画面被占满还是没有&quot;在滚&quot;的感觉。</li><li>四枚都上彩色（每枚一个色）——花屏，且视线没有落点；灰阶三级 + 强调一枚才有层级。</li><li>灰阶枚用 <code>opacity: 0.5</code> 压淡——白底上 dim 件叠透明度必掉出可读区（design-language §1 实测红线）；要更淡就换更浅的底色实色，不动字的透明度。</li><li>落位纵向等间距——四枚读作一列纵向列表，与&quot;从两侧随机飘过&quot;的弹幕感相反；间距要不等。</li><li>落定后给气泡加漂浮/呼吸微动——它立刻从&quot;别人的评论&quot;变成&quot;会动的装饰贴纸&quot;，也违反 §4 定版偏好。</li><li>出场也做 scale（缩回去）——出场比入场重了，观众的眼睛会被&quot;消失&quot;这件事拽走一次。</li><li>气泡加投影或描边——它是浮层不是证据素材；投影只给截图/照片（design-language §3）。</li><li><strong>气泡加尾巴三角——2026-08-25 用户定版删除</strong>。尾巴是对话框语义（&quot;这句话是某个人在说&quot;），</li></ul><p>  弹幕是匿名飘过的氛围层；加了尾巴四枚就读作四个人围着主播说话，也和   <code>chat-message-flow</code> 撞语言。纯胶囊就够了。</p><ul><li>气泡压住人物脸——弹幕可以压身体，压脸就成遮挡；落位先避开人物头部矩形。</li><li>用 <code>Math.random()</code> 生成落位或错峰——重播两次不一样，卡库要求可复现（用固定数组）。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/danmu-bubble-praise/index.html。换文案改四个 <code>.db-b</code> 的文本（每条 4~8 字，</li></ul><p>  <code>white-space: nowrap</code> 是硬要求）；换落位改 <code>#b1~#b4</code> 的 <code>left/top</code>，同时把 <code>side-l/side-r</code>   改成&quot;离哪边近就从哪边进&quot;（这个 class 只决定进场方向）。   能量只调 <code>stagger</code> 与 <code>hold</code> 这一对，改完用判据 <code>inDur + hold ≤ 2 × stagger</code> 复核。   换强调色只改 <code>#b2</code> 的 <code>--fill</code>/<code>--ink</code> 两个变量，其余三枚永远灰阶。</p><ul><li>Remotion 移植要点：单枚 = 一个 <code>&lt;Bubble&gt;</code> 组件，props 传 <code>enterFrame / side / tone</code>。</li></ul><p>  每枚三段 <code>interpolate</code> 用同一个局部时钟 <code>local = frame - enterFrame</code>：   <code>opacity</code> 走 <code>[0, 9, 9+23, 9+23+12] → [0,1,1,0]</code>（30fps：进 9 帧、停 23 帧、走 12 帧），   <code>translateX</code> 只在前 9 帧 <code>[±26 → 0]</code>（<code>Easing.out(Easing.cubic)</code>），   <code>translateY</code> 只在最后 12 帧 <code>[0 → −18]</code>（<code>Easing.in(Easing.quad)</code>），   <code>scale</code> 同前 9 帧 <code>[0.88 → 1]</code>。<code>extrapolateLeft/Right: &quot;clamp&quot;</code> 不能省。   四枚的 <code>enterFrame</code> = <code>12 + i * 17</code>（0.4s + i×0.55s @30fps）。倾斜写死在样式里不进 interpolate。</p><ul><li>剪辑软件对应物：剪映/CapCut——四个文本贴纸各自套&quot;入场：向左/向右滑动 0.3s&quot; +</li></ul><p>  &quot;出场：向上滑动 0.4s&quot;，然后<strong>手动把四条轨错开 0.55s</strong> 拖成阶梯（错峰是唯一要手动做的事，   剪映没有 stagger 概念）；气泡底用&quot;文字背景&quot;开圆角拉满。   AE——一个 <code>Bubble</code> 预合成做完三拍，复制四份用 <code>Sequence Layers</code>（Overlap 勾上，   Duration 设 0.9s）自动错开，或直接给四层的 In 点手动 +17 帧；倾斜在图层 Rotation 上写死。</p><ul><li>与本库同类卡的分工：<code>chat-message-flow</code> = <strong>一段对话</strong>（有先后有回应、沿轴堆积、承担信息）；</li></ul><p>  <code>subscribe-cta</code> = 一次性的行动号召（单枚、要停住让人读完）；   <strong>本卡 = 氛围层的多人在场</strong>（互不相关、进出交叠、不承担信息）。   本卡可以叠在任何一句口播上，也因此它不能承担任何具体信息——真要观众记住某条评论，   用 <code>quote-card</code> 单独立一屏。</p><h3>动效范围</h3><ul><li>属于本卡的：单枚&quot;进 0.3s / 停 0.75s / 走 0.4s&quot;这个三拍模板；<code>stagger 0.55s</code> 与 <code>hold 0.75s</code> 这一对（以及 <code>inDur + hold ≤ 2×stagger</code> 这条交叠判据）；进场朝画面中心 <code>x ±26 → 0</code> + <code>scale 0.88→1</code>、出场只走 <code>y −18</code> + <code>opacity</code>（出场不动 scale）这条纪律；四枚纵向落位不等距 + 左右交替这个分布规则；落定后完全静置（不漂不呼吸）；静态倾斜 ±1.2~1.8° 作为形状属性；&quot;四枚里恒有且仅有一枚强调色，其余靠底色/字色明度三级分层而非透明度&quot;这条配色纪律。</li><li>不属于本卡的：demo 那四句具体评论文案（说得太对了 / 干货满满 👍 / 收藏了 / 已经在用了）、<code>#e0452c</code> 这个具体强调色（参考图同色系任一个都成立）、21px 字号与 600 字重、<code>border-radius: 999px</code> 胶囊这个具体气泡形制（换成方角小卡、圆角矩形 chip 都不影响动效；<strong>但尾巴三角不许加回来</strong>——那是对话框语义，见已知坑）、四枚的具体 <code>left/top</code> 数值、白底舞台、以及铺满舞台的数字人主持人占位。</li><li>迁移接口：内容入口 = 四个 <code>.db-b</code> 的文本 + <code>side-l/side-r</code>；落位入口 = 各枚 <code>left/top</code>；配色入口 = 各枚的 <code>--fill</code>/<code>--ink</code> 两个 CSS 变量（强调枚只有一枚）；能量入口 = <code>stagger</code> + <code>hold</code> 这一对（改完复核判据）；总时长 = <code>startDelay + (n−1)×stagger + inDur + hold + outDur + tailHold</code>，加枚数请延长总时长而不是加密错峰。竖屏：落位改成&quot;上下各两枚&quot;（竖屏两侧宽度不够放 6~8 字的气泡），<code>inX</code> 换成 <code>inY ±26</code>，其余时序不动。</li><li>底色要求：白底即可。唯一约束是<strong>底不能与气泡的灰阶三级撞明度</strong>——灰阶枚靠底色明度分层，深底上必须整套反相（气泡底改深灰三级、字反白），不能只把字反白。</li></ul>","host-shrink-to-chip":"<h3>意图</h3><p>图形上台最常见的两种错法都在丢东西：<strong>切走人</strong>（画面只剩图，说话的人凭空消失，口播变成配音 PPT） 或<strong>图形叠在人身上</strong>（谁都不是主角，观众两边看不清）。缩位让台给出第三条路——人主动缩到角标， 把舞台正中让给图形，但表情、口型、手势全程在线，观众始终知道&quot;是这个人在给我讲&quot;。命门三条： 1. <strong>角标里的人必须还在动</strong>：缩完不许换成静态头像/定格帧，那是&quot;人走了留了张证件照&quot;，比切走更假。 2. <strong>让位与接位必须错峰</strong>：人先动、图形晚 0.15s 进——同帧进出两个主角在画面里打架，读作&quot;卡了一下&quot;。 3. <strong>角标期位置死锁</strong>：chip 不许漂、不许呼吸、不许换位置。让台的意义是&quot;我不抢戏了&quot;，角标一动就前功尽弃。</p><h3>动效核心</h3><ul><li>层级：图形主角（z2）→ 人物裁切窗（z3）→ chip 描边（z4）→ 字幕（z5）</li><li><strong>工程结构</strong>：裁切窗（<code>clip-path</code>，几何锁在舞台坐标系）+ 内层人物层（<code>transform: scale/x/y</code>）。</li></ul><p>  两层由<strong>同一个进度 t</strong>（0 = 全屏主角，1 = 角标 chip）驱动，<code>onUpdate</code> 里一起写——   拆成两条 tween 会因缓动不同步让人脸半路出框</p><ul><li>缩位（t 0→1）：<code>clip-path: inset(...)</code> 从 <code>inset(0)</code> 插值到 chip 的四边内缩 + <code>round r</code>（圆角同步长到 r</li></ul><p>  才能得到真圆），同时人物层 <code>scale 1→0.72</code> + 位移，<code>transform-origin</code> 设在<strong>取景锚点</strong>（50% / 32.4% 屏高，   略低于头部中心，取景才带上肩）；位移 = chip 圆心 − 锚点，缩放绕锚点做所以位移就是两点之差</p><ul><li>时长 0.42s（0.35~0.5），<code>power2.inOut</code>——起收都要缓；这是&quot;让&quot;不是&quot;弹&quot;</li><li>chip 直径 = 屏宽 18%，<strong>落位必须在左下或右下角</strong>（2026-08-27 用户定版：chip 圆心在画面下 1/3 带内、</li></ul><p>  下缘贴 action-safe 96px；v3 实测圆心放到 66% 高度被判&quot;太靠上&quot;）；内缩量取屏宽 4.2% / 屏高 6.3%；   描边 1px #e0e0e0 在缩位 55% 处 0.2s 淡入</p><ul><li>图形主角：晚于缩位起点 0.15s，从<strong>对侧</strong>（人物 chip 在左 → 图形从右）滑入 90px + 淡入，0.45s <code>power3.out</code></li><li>角标期：位置全程锁定，画面里唯一在动的是 chip 里的人（口播）</li><li>回归（可选，应用侧决定）：需要人物回归时图形先退（<code>power2.in</code> 比入场快），人物晚 0.12s 起、</li></ul><p>  t 1→0 同缓动反向放大；顺序反过来（人先放大）会把还没退场的图形压住。demo 不演回归，让台默认单程</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>shrink</code></td><td>0.42s</td><td>0.35~0.5 的&quot;让&quot;；&lt;0.3s 像被踢出画面，&gt;0.6s 观众等得心慌、图形迟到</td></tr><tr><td><code>chipRatio</code></td><td>0.18</td><td>chip 直径 / 屏宽。&lt;0.12 脸小到读不出表情，等于放了个图标；&gt;0.26 让台不彻底，还在抢图形的位置</td></tr><tr><td><code>chipScale</code></td><td>0.72</td><td>角标期人物层缩放，决定 chip 里的取景。调大变大头特写（脸溢出圆边），调小变全身缩略（脸太小）</td></tr><tr><td><code>anchorY</code></td><td>0.324</td><td>取景锚点高度 / 屏高。调小取景上移只剩头，调大会把脸推出 chip 上缘——换素材第一个要重调的值</td></tr><tr><td><code>gfxLag</code></td><td>0.15s</td><td>图形相对缩位起点的错峰。0 = 两个主角同帧打架读作卡顿；&gt;0.4s 中间出现&quot;空台&quot;一拍</td></tr><tr><td><code>hold</code></td><td>2.0s（demo）</td><td>实拍 = 讲完这张图的真实时长，可任意延长；&lt;1.5s 观众还没看完图人就回来了，缩位白做</td></tr><tr><td><code>gfxOut</code> / <code>restoreLag</code></td><td>0.28s / 0.12s</td><td>图形先退、人后放大的顺序是本卡的收尾语法；<code>restoreLag</code> 归零 = 人把图形挤出去，读作抢戏</td></tr><tr><td><code>restore</code></td><td>0.42s</td><td>与 <code>shrink</code> 对称即可；刻意做慢（0.6s）有&quot;重新接管&quot;的郑重感</td></tr></table><h3>已知坑</h3><ul><li><strong>角标里换成静态头像/定格帧</strong>——人不动等于人已经走了，比直接切走更假（口型停了但声音还在）。</li><li><strong>切走人物再淡入一个 chip</strong>——中间断了一帧连续性，观众读作&quot;两个镜头&quot;，缩位的&quot;同一个人&quot;语义全丢。</li><li><strong>人物与图形同帧进出</strong>——两个主角在同一时间抢注意力，观感是&quot;卡了一下&quot;，不是交接。</li><li><strong>角标期让 chip 漂移/呼吸/换位置</strong>——让台的语义是&quot;我不抢戏&quot;，角标一动观众视线立刻被拽回去。</li><li><strong>只缩不裁（只做 scale）</strong>——人物层直接缩小成&quot;一个悬在角上的小人&quot;，没有 chip 边界就不是&quot;头像章&quot;。</li><li><strong>裁切窗与人物层分成两条 tween</strong>——缓动不同步，缩位中途脸会挤出圆窗边缘，一眼是 bug。</li><li><strong>（若做回归）回归时人先放大</strong>——还没退场的图形被压在人后面，读作抢戏而非接管。</li><li><strong>chip 放在字幕区或图形要用的那一侧</strong>——让位让到别人身上，等于没让。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/host-shrink-to-chip/index.html。核心是 <code>setHost(t)</code> 这一个函数 + 顶部 <code>CONFIG</code>，</li></ul><p>  连 <code>lerp</code> 一起复制即可摘走；换素材只需重调 <code>anchorY</code> / <code>chipScale</code> 让脸在 chip 里居中。   chip 左下↔右下换边改 <code>chipInsetX</code>（并把图形 <code>gfxSlide</code> 取反保持对侧入场）；成片落位只许下角；   想要&quot;底部圆角卡&quot;变体：<code>chipRatio</code> 换成宽度比 1/3、<code>round r</code> 改成固定 12px 圆角、锚点相应下移。   图形卡（<code>.gfx</code>）整块可替换成任意内容。</p><ul><li>Remotion 移植：`const t = interpolate(frame, [d, d+shrinkF], [0, 1], {easing: Easing.inOut(Easing.quad),</li></ul><p>  extrapolateLeft: 'clamp', extrapolateRight: 'clamp'})<code>，同一个 </code>t<code> 同时算外层 </code>clipPath<code> 字符串与内层   </code>transform<code>（</code>scale(lerp(1, chipScale, t)) translate(...)<code>）——帧驱动天然同步、seek 安全；   人物层用 </code>&lt;OffthreadVideo&gt;<code> 抠像素材，</code>muted={false}<code> 保持角标期口播继续；   （若应用侧要做回归）第二个 </code>interpolate<code> 从 </code>outAt+restoreLag` 反向到 0。</p><ul><li><strong>分割抠人变体（B-roll 镜头专用，2026-08-27 用户定版）</strong>：让台的对象是一段 B-roll 视频而不是图形卡时，</li></ul><p>  角标可以不做圆窗——用 segmentation（绿幕走 <code>colorkey</code>，实拍走 RVM/SAM 系人像分割）取 alpha，   <strong>保留人物真实外形</strong>直接贴在 B-roll 的左下或右下角，读作&quot;人站在素材前面讲&quot;。   与本卡圆窗路的分工：素材抠不干净、或只要&quot;是这个人在讲&quot;这一个信息 → 圆窗（边界自己吃掉毛边）；   人物有手势要看、要发布会式临场感 → 分割贴角。两路的缩位时序、错峰 0.15s、位置死锁、   &quot;角标里的人必须还在动&quot;这四条纪律完全共用；选型与方位见 <code>references/host-footage.md</code>   「人物素材与 B-roll 同屏」。注意分割路没有 <code>clip-path</code> 兜底，人物被画框切到时<strong>把人整体往画面里挪</strong>   或收窄 B-roll，不许等比缩小人物。</p><ul><li>剪辑软件对应物：剪映/CapCut——人物轨加&quot;蒙版→圆形&quot;，蒙版大小/位置与素材的缩放/位置<strong>同段关键帧</strong></li></ul><p>  （必须同时打，否则脸出框），缓动选&quot;缓入缓出&quot;；AE——人物层套 Mask 或 Shape Layer 做 Alpha Matte，   Mask Path + Scale + Position 三条属性同帧关键帧 + Easy Ease，或直接父级化到一个 Null 上只 K 一层；   FCPX——&quot;变形/裁剪&quot;里的圆形遮罩 + Transform 关键帧。</p><h3>动效范围</h3><ul><li>属于本卡的：人物层从全屏到角标 chip 的<strong>缩位</strong>——裁切窗 <code>clip-path</code> 四边内缩 + 圆角同步长到 r，与内层 <code>scale 1→0.72</code> + 位移由<strong>同一进度 t 驱动</strong>（0.35~0.5s、<code>power2.inOut</code>、<code>transform-origin</code> 落在取景锚点）；图形主角晚 0.15s 从<strong>对侧</strong>滑入接位的错峰关系；角标期&quot;位置死锁、人继续口播&quot;这条硬约束。让台默认单程；回归属于应用侧的下一个节拍（要做时遵守&quot;图形先退→人再放大&quot;顺序）。</li><li>不属于本卡的：图形卡的内容/排版/灰阶线框画法（柱子自己的生长动效属于 chart-grow 卡）、字幕文案、chip 描边的颜色粗细、主持人素材本身（demo 由 demo-shell 注入数字人，属演示语境）、chip 落在左下还是右下这个具体选边</li></ul><p>（但&quot;必须是下角&quot;属于硬约束，不是可迁移项）。</p><ul><li>迁移接口：几何全部是<strong>比例</strong>——<code>chipRatio</code>（直径/屏宽）、<code>chipInsetX/Y</code>（边距/屏宽·屏高）、<code>anchorX/Y</code>（取景锚点/屏宽·屏高），换画幅换尺寸不用改代码；换人物素材调 <code>anchorY</code> + <code>chipScale</code> 对齐取景；<code>hold</code> 按口播真实时长设；chip 方位改 <code>chipInsetX/Y</code> 后必须把 <code>gfxSlide</code> 取反保持&quot;对侧入场&quot;；底部圆角卡变体把 <code>round r</code> 换成固定圆角并改宽高比。</li><li>底色要求：白底即可，但<strong>chip 必须有可见边界</strong>——白底 + 浅色服装时那根 1px #e0e0e0 描边是唯一的边界线，去掉就读不出&quot;头像章&quot;（深底上改为浅色描边或干脆靠明度差，可省描边）。</li></ul>","subscribe-cta":"<h3>意图</h3><p>不是&quot;提醒关注&quot;，是&quot;示范关注&quot;——光标替观众把整个动作做一遍，降低行动门槛。 命门：<strong>光标必须走过去</strong>（瞬移点击就没有&quot;跟着做&quot;的引导意义）、<strong>点击要有反馈链</strong> （下压→状态翻转→确认动效，三个反馈缺一环就假）、<strong>式样要认平台</strong>（B站说&quot;三连&quot;却演一个订阅按钮， 观众对不上自己屏幕上的东西）、<strong>用完即走</strong>（overlay 停留超过 8s 变牛皮癣）。</p><h3>动效核心</h3><p>三种平台式样<strong>共用同一套三段机制</strong>，只换交互动作与确认动效： ① 控件弹入 → ② 光标弧线移入做交互 → ③ 状态翻转 + 确认动效。</p><p><strong>共有机制（三式一致）</strong></p><ul><li>控件入场：scale 0→1.06→1，0.35s（0.65 段 <code>power3.out</code> + 0.35 段 <code>power2.out</code>）</li><li>光标移入：从屏外（x:1010）弧线移到控件，0.8s——x 用 <code>power2.inOut</code>、y 用 <code>sine.inOut</code>，异速叠出弧线；</li></ul><p>  transform-origin 锚在箭头尖（0% 0%），按压微缩不让尖端移位</p><ul><li>交互帧：光标 scale→0.9 一拍（0.09s）+ 控件下压至 0.94（0.08s <code>power2.in</code>）</li><li>状态翻转就在<strong>按下那一刻</strong>发生（不等抬手），随后 <code>back.out(3)</code> 回弹 0.2s</li><li>光标顺势朝右下滑出并淡出 0.45s</li><li>段落切换：淡出淡入各 0.3s，中间 0.15s 留白</li></ul><p><strong>式样 A · YouTube 订阅（订阅 + 铃铛）</strong></p><ul><li>红底白字圆角矩形&quot;订阅&quot; → 点击变灰白&quot;已订阅&quot;</li><li>铃铛：点击后 0.15s 淡入，<code>transform-origin: 50% 8%</code>（顶部悬点），rotation 按</li></ul><p>  16→−12→8→−5→2→0 衰减序列摆 0.8s；同时一圈涟漪 scale 0.6→1.9 + opacity 0.7→0</p><p><strong>式样 B · B站一键三连（长按点亮）</strong></p><ul><li>三枚灰阶线框圆图标（拇指/圆币/五角星）以 0.12s 间隔依次弹入</li><li>光标移到&quot;点赞&quot;<strong>按住不放</strong>：进度环（r=45、<code>stroke-dasharray</code> 282.7）0.55s <code>ease:&quot;none&quot;</code> 走满一圈</li></ul><p>  ——三连的门槛感在这里，点一下就亮就不叫&quot;三连&quot;</p><ul><li>环走满后<strong>从左到右依次点亮</strong>，间隔 0.2s：底盘转高亮色 + 线框 stroke 转白（各 0.16s）</li></ul><p>  + scale 1→1.22→1 弹跳（0.14s <code>power3.out</code> + 0.26s <code>back.out(2.4)</code>）+ 一圈涟漪 scale 0.85→1.75</p><p><strong>式样 C · 通用关注（小红书 / 抖音 / X）</strong></p><ul><li>黑底白字胶囊&quot;关注&quot; → 点击变灰白&quot;已关注&quot;，文案左侧腾出对勾位</li><li>确认动效：对勾按笔序划入——<code>stroke-dasharray</code> 27 / dashoffset 27→0，0.36s <code>power2.out</code></li><li>同时一圈胶囊形涟漪（inset −8、border-radius 999）scale 0.9→1.28 + opacity 0.6→0</li></ul><p><strong>收场</strong>：每段做完 hold 0.5s 让观众读结果，随后整段 opacity→0（0.4s）。 <strong>音效位</strong>：点击帧标注&quot;啵&quot;、铃铛首摆&quot;叮&quot;、三连每次点亮各一声&quot;叮&quot;（逐次升调）、对勾划入&quot;嗒&quot;（demo 无声，成片补）。</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>光标移入</td><td>0.8s</td><td>&lt;0.4s 接近瞬移，引导感消失；&gt;1.2s 观众开始等它</td></tr><tr><td>点击下压</td><td>0.94</td><td>&gt;0.97 看不出按了；&lt;0.9 控件像被捏爆</td></tr><tr><td>铃铛首摆角</td><td>16°</td><td>&gt;25° 像报警器；&lt;8° 摇了等于没摇</td></tr><tr><td>铃铛摆次</td><td>4~5 次衰减</td><td>匀速摆是钟摆一眼假；2 次以内停得太急像卡住</td></tr><tr><td>三连长按环</td><td>0.55s</td><td>&lt;0.3s 门槛感消失，退化成&quot;点一下&quot;；&gt;0.9s 观众以为卡住了</td></tr><tr><td>三连点亮间隔</td><td>0.2s</td><td>&lt;0.1s 三个像同时亮，读不出&quot;连&quot;；&gt;0.35s 三段各自为政，不成一串</td></tr><tr><td>点亮弹跳峰值</td><td>1.22</td><td>&lt;1.1 点亮像换色不像被点中；&gt;1.35 图标从队列里跳出来</td></tr><tr><td>对勾划入</td><td>0.36s</td><td>直接显形=贴图；&gt;0.6s 观众等它画完</td></tr><tr><td>单式样在场</td><td>3~5s</td><td>&gt;8s 变牛皮癣挡内容；&lt;2.5s 观众还没反应过来就没了</td></tr><tr><td>出现次数</td><td>1 次/条</td><td>多次出现=乞讨感，转化率反降</td></tr></table><h3>已知坑</h3><ul><li>铃铛匀速摇摆——没有阻尼的是节拍器不是铃铛，必须逐摆衰减。</li><li>光标瞬移到按钮上——观众没看到&quot;移动→点击&quot;的过程，示范意义为零。</li><li>点击后控件不变状态——没有&quot;已订阅/已关注&quot;的结果反馈，这次点击像没发生。</li><li>三连做成&quot;点一下三个一起亮&quot;——B站三连的手感命门是<strong>长按</strong>+<strong>依次</strong>，同时亮就成了普通点赞。</li><li>三连不给长按进度环——观众不知道要按多久，示范就少了最关键的那条信息。</li><li>对勾用现成 ✓ 字符淡入——确认动效要有&quot;划&quot;的笔序，淡入的对勾是贴图。</li><li>平台式样和平台不对版（对 B 站观众演订阅按钮）——观众在自己屏幕上找不到你演的那个东西。</li><li>overlay 常驻画面——挡内容又降级成背景噪音，用完即走才有效。</li><li><code>fromTo</code> 忘了 <code>immediateRender: false</code>——涟漪环建表时就把 from 态刷上去，控件&quot;还没被点&quot;时红环已经挂在外圈（实测三连三个环全部提前显形）。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/subscribe-cta/index.html。三段各是一个独立函数（<code>segYouTube</code> / <code>segTriple</code> / <code>segFollow</code>），</li></ul><p>  落地时<strong>只留你要的那一段</strong>——把 <code>[segYouTube, segTriple, segFollow]</code> 数组裁成一个即可，共用的   <code>moveTo/down/up/cursorOut/P</code> 四个辅助函数不用改。换文案改 <code>.sub-btn</code> / <code>.ftxt</code> 与 <code>.call(...)</code> 里的&quot;已订阅/已关注&quot;；   换配色改 <code>CONFIG.accent</code>。</p><ul><li>Remotion 移植：每段一个 Sequence；铃铛用 <code>16*Math.exp(-t*4)*Math.cos(t*14)</code> 衰减余弦替代关键帧序列；</li></ul><p>  长按环用 <code>interpolate(frame, [holdStart, holdEnd], [282.7, 0])</code> 驱动 strokeDashoffset；   三连点亮用 <code>frame &gt;= lightFrame + i*stepFrames</code> 逐个条件切样式；对勾同样是 dashoffset 插值。</p><ul><li>剪辑软件对应物：LottieFiles 搜 &quot;subscribe button bell&quot; / &quot;like coin favorite&quot;，有大量现成 JSON 可直接挂；</li></ul><p>  剪映&quot;贴纸→订阅按钮/一键三连&quot;动图；AE 用 Bounce/Overshoot 表达式 + 铃铛父子链摆动 + Trim Paths 画对勾。</p><ul><li>（实测变体）评论引导：不做按钮+光标+确认三件套，而是把 CTA 关键词（如 comment 的触发词）以蓝色/荧光高亮<strong>常驻</strong>在人物胸前，小字词流继续滚、大字关键词锚定不动——引导目标从&quot;点按钮&quot;换成&quot;记住这个词去评论&quot;，全程零光标、也不占收尾时段。见 TheAIScaler（u8OWXXTcu3Q / a2iG5GkM8KE）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<strong>三种平台式样共有的三段严格串行因果链</strong>——控件 scale 0→1.06→1 弹入（0.35s）→ 光标从屏外<strong>弧线</strong>移入（0.8s，x 用 <code>power2.inOut</code>、y 用 <code>sine.inOut</code> 异速叠出弧线，锚点在箭头尖）→ 交互帧的反馈链（光标 scale→0.9 + 控件下压至 0.94 一拍 0.08s <code>power2.in</code> + <strong>在按下那一刻</strong>换状态 + <code>back.out(3)</code> 回弹 + 光标顺势滑出淡出）。三式各自的确认动效也属于本卡：铃铛 <code>transform-origin: 50% 8%</code>、按 16→−12→8→−5→2→0 <strong>衰减</strong>序列摆 0.8s + 一圈涟漪 scale 0.6→1.9；三连的<strong>长按进度环</strong> 0.55s <code>ease:&quot;none&quot;</code> 走满一圈 + <strong>从左到右 0.2s 间隔依次点亮</strong>（底盘换色 0.16s + scale 1→1.22→1 <code>back.out(2.4)</code> 弹跳 + 逐个涟漪 0.85→1.75）；关注的对勾 <code>stroke-dasharray</code> 划入 0.36s <code>power2.out</code> + 胶囊形涟漪 0.9→1.28。段落淡出淡入 0.3s / 段间留白 0.15s / 用完即走也属于本卡。</li><li>不属于本卡的：主持人占位（数字人）、平台名小字标签的文案与措辞、控件圆角与字号、三个图标的具体图形（拇指/圆币/星星只是&quot;三个可点亮目标&quot;的中性画法）、涟漪与铃铛的颜色、光标 SVG 的具体形状、为压实拍加的白底盘/白描边（属于对比度落地，见底色要求）。</li><li>迁移接口：<strong>平台式样切换 = 只保留对应那一个段落函数</strong>（<code>segYouTube</code> / <code>segTriple</code> / <code>segFollow</code>），三者共用 <code>moveTo/down/up/cursorOut/P</code>，删掉另两个不影响其余代码；demo 把三段串起来只是为了一次看全三种机制。所有时序在 <code>CONFIG</code>：共有段用 <code>btnIn</code>/<code>cursorMove</code>/<code>clickDip</code>，A 段用 <code>bellSwings</code> 数组/<code>bellTime</code>，B 段用 <code>triStagger</code>/<code>holdPress</code>/<code>triStep</code>/<code>triPop</code>，C 段用 <code>checkDraw</code>，段落切换用 <code>segFade</code>/<code>segGap</code>/<code>segHold</code>。换尺寸时改 <code>CONFIG.START</code>（光标起点，按舞台宽重算），落点由 <code>P(el, fx, fy)</code> 从元素实际位置反算，换布局不用改坐标数字。文案改 <code>.sub-btn</code> / <code>.ftxt</code> 与 <code>.call(...)</code> 里的翻转文案；<code>triStep</code> 与三连图标数量解耦（forEach 按 index 排期，加减图标自动顺延）。</li><li>底色要求：白底即可。<strong><code>CONFIG.accent</code> = #e62117 是&quot;这是那个按钮/已被点亮&quot;的语义色，本卡保留</strong>——它承担&quot;这是那个控件&quot;与&quot;这一下生效了&quot;的识别功能，换平台改成对应平台的按钮色（B 站粉、抖音红等），但不要灰阶化；未点亮态、已完成态、铃铛、涟漪一律走灰阶/墨色。落地时 overlay 压在实拍画面上，控件需自带足够对比：红底白字与白底盘天然成立；<strong>黑胶囊要加白描边（<code>box-shadow: 0 0 0 3px #fff</code>）、深色铃铛要坐白色圆底盘、图标名走白底小胶囊</strong>——实测不加这三样时它们会直接糊进人物的深色衣服。灰阶的&quot;已订阅/已关注&quot;态在深色背景上要提亮一档。</li></ul>","x-follow-card":"<h3>意图</h3><p>口播说&quot;这个人做的东西你该看看&quot;，观众心里的问题是&quot;他是谁、凭什么&quot;。 一张资料卡把这两个问题一次答完：头像、名字、认证、一句 bio、地点/站点/加入时间、<strong>关注者数</strong>。 本卡的价值不在&quot;贴一张卡&quot;，在于<strong>卡自己演一遍被关注的过程</strong>——光标走过去点下&quot;关注&quot;， 按钮翻成&quot;已关注&quot;，粉丝数当场 +1。这一下把静态资料变成社会证明：不是你在夸他，是&quot;有人正在关注他&quot;。</p><p>命门三条。<strong>第一条是壳与内容分两拍</strong>：卡整体先 spring 弹入到位，十层内容<strong>再</strong>逐层落。 十层同时全亮 = 一张图淡入，那就只是贴图；壳先到位、内容后落，观众的眼睛才有机会按阅读顺序扫过去。 <strong>第二条是光标必须走过去</strong>（与 [subscribe-cta](subscribe-cta.md) 共享的纪律）：瞬移点击读作&quot;状态自己变了&quot;， 不是&quot;有人关注了他&quot;。<strong>第三条是点击那一刻三件事同帧</strong>：按钮两态交叉 + 涟漪 + 粉丝数 +1。 前两件是&quot;这一下按到了&quot;，第三件才是社会证明的落点——少了计数变化，这次点击只影响了一个按钮，没影响任何事实。</p><p><strong>产品皮 = 内容本身（2026-08-25 用户定版）</strong>：本卡涉及真实产品界面，所以<strong>完全还原 X 的样式</strong>， 不做中性化——深色卡 <code>#16181c</code>、品牌蓝 <code>#1d9bf0</code> 的封面渐变/认证印章/关注按钮/tab 指示条、 右上那枚 X 标，全部照抄源码的 <code>THEMES.dark</code> + <code>accentColor</code>。理由：观众要一眼认出&quot;这是 X 上的某个人&quot;， 灰阶化之后那张卡谁都不是，&quot;社会证明&quot;这层意思也就断了——<strong>平台身份是这张卡的信息量之一</strong>。 可编辑的是<strong>内容</strong>（名字/handle/bio/地点/站点/计数/示例帖文案），外观不动。 头像仍走灰阶占位圆——那是 X 自己的默认头像样式（没有真头像素材时它就长这样）。</p><h3>动效核心</h3><ul><li><strong>卡整体弹入 0.62s</strong>：<code>y 46→0</code> + <code>scale 0.9→1</code>，<code>back.out(1.35)</code> 的微过冲（源码 <code>spring(damping 12 / stiffness 120 / mass 0.8)</code>，ζ≈0.6 的欠阻尼）。</li></ul><p>  <strong>淡入是独立的时间窗</strong>（0.05→0.35s）——位移先动、透明度后跟，remocn 全系入场的写法</p><ul><li><code>transform-origin: 50% 0%</code>（卡顶）：弹入时卡从上边缘&quot;垂下来&quot;，绕中心缩放会让整卡上下同时长大，那是弹窗不是卡片落位</li><li><strong>十层错峰 blur-in</strong>：每层 <code>blur 8px → 0</code> + <code>opacity 0 → 1</code> + <code>y 8 → 0</code>，单层 0.24s、层距 0.07s（源码九组各差 2 帧 ≈ 0.067s）。</li></ul><p>  三个属性一起动才是&quot;blur-in&quot;：只做淡入是普通 stagger，加上 blur 才有&quot;从虚焦里对上焦&quot;的落位感</p><ul><li><strong>层序按阅读顺序</strong>：封面 → 头像 → 名字 → @handle → bio → meta 行 → 计数 → tabs → 示例帖 → <strong>按钮行最后</strong>。</li></ul><p>  待交互的目标最后落位，光标才有东西可点（源码把按钮排在第 7 组，本卡挪到最后一组）</p><ul><li><strong>静置到 1.55s</strong>：内容 1.21s 铺完，之后有 0.34s 什么都不发生——这是给口播介绍这个人的余量。卡就位了但还没有人动它</li><li><strong>光标弧线移入 0.95s</strong>（源码 32 帧 ≈ 1.07s）：x 用 <code>power2.inOut</code>、y 用 <code>sine.inOut</code> <strong>异速叠出弧线</strong>；</li></ul><p>  从舞台右下外侧（1000, 470）进场；<code>transform-origin: 0% 0%</code> 锚在箭头尖，按压微缩不让尖端移位</p><ul><li><strong>落点必须在按钮的&quot;终态&quot;位置上量</strong>（2026-08-25 修的 bug：光标没点到关注上）。两条纪律：</li></ul><p>  ① 量之前先 <code>gsap.set(card, {clearProps: &quot;transform&quot;})</code>——若在铺了重播初始态（<code>y:46 / scale:0.9</code>）之后量，   量到的是卡还在半空、还缩着 0.9 时的按钮位置；等光标 2.5s 后走到那儿，卡早已落到 <code>y:0 / scale:1</code>，   按钮上移了约 46px ⇒ 点击帧光标压在按钮下方的空处。   ② 减掉<strong>箭头尖在 SVG 里的偏移</strong>（尖在 <code>viewBox 14×21</code> 的 <code>(1,1)</code>，渲染 30×45 ⇒ 偏移 <code>(2.1, 2.1)</code>）——   <code>x/y</code> 设的是元素左上角，不减就等于用&quot;光标包围盒左上角&quot;去对准按钮心，视觉上尖会偏在按钮右下。   验收方式是<strong>截点击那一帧</strong>（<code>node scripts/shot-at.mjs x-follow-card 2.58</code>），肉眼确认尖压在按钮上</p><ul><li><strong>点击帧的反馈链</strong>（同帧起，缺一环就假）：光标 <code>scale → 0.9</code> 一拍（0.09s）+ 按钮下压至 0.9（0.08s <code>power2.in</code>）+ 两态交叉 + 涟漪 + 计数滚动，随后按钮 <code>back.out(3)</code> 回弹 0.22s</li><li><strong>两态交叉不是换文案</strong>：同一个 116×40 盒子里叠两层（源码 <code>BUTTON_LAYOUT.horizontal</code> 的 <code>w/h</code>）——&quot;关注&quot;层 <code>opacity 1→0</code> + <code>scale 1→0.92</code>（缩着退），&quot;已关注&quot;层 <code>opacity 0→1</code> + <code>scale 0.86→1</code> 带 <code>back.out(1.7)</code>（涨着进）。</li></ul><p>  直接改 <code>textContent</code> 读作&quot;字变了&quot;，交叉才读作&quot;按钮换了状态&quot;</p><ul><li><strong>粉丝数 +1 用纸带上推</strong>：窗口 <code>overflow: hidden</code> 只露一行高（20px），里面一条上下两格的纸带 <code>y 0 → −20px</code>（<code>power3.out</code> 0.42s）——旧值出上沿、新值从下沿进。</li></ul><p>  <strong>动的是纸带不是窗口</strong>（动窗口会把整行文字一起挪）。数字直接换值读作&quot;数据刷新了&quot;，滚动才读作&quot;这个数涨了&quot;</p><ul><li><strong>胶囊形涟漪</strong>：<code>inset −6</code>、<code>border-radius 999</code>，<code>scale 0.92 → 1.3</code> + <code>opacity 0.55 → 0</code>，0.5s <code>power2.out</code>。</li></ul><p>  <code>fromTo</code> 必须写 <code>immediateRender: false</code>——默认建表时就把 from 态刷上去，涟漪会在&quot;还没被点&quot;时提前挂在按钮外圈</p><ul><li><strong>光标用完即走</strong>：顺势朝右下滑出并淡出 0.45s。常驻的光标会一直吸引注意力</li><li>层级：白底舞台 → 卡（深色卡 + 阴影浮起）→ 按钮行（绝对定位，贴封面下沿、与头像同一条基线）→ 光标（z-index 20）</li><li>卡按源码的 600px 参考宽度 1:1 写死，再由 <code>.scaler</code> 整体 <code>scale(0.885)</code> 装进 960×540 舞台——</li></ul><p>  等价于源码的 <code>stageScale = min(w/refW, h/refH)</code>。<strong>好处是所有样式值可以照抄源码不用换算</strong>（改画幅只改这一个缩放数）</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>cardIn</code></td><td>0.62s</td><td>卡弹入。&lt;0.35s 读作硬弹出（没有&quot;落位&quot;的重量）；&gt;0.9s 观众等它进场</td></tr><tr><td><code>back.out</code> 过冲</td><td>1.35</td><td>弹入的微过冲。=0 只是缩放出现（卡没有重量）；&gt;2.2 显廉价，卡像蹦上来的</td></tr><tr><td><code>layerStagger</code></td><td>0.07s</td><td>十层错峰间隔。=0 退化成&quot;一张图淡入&quot;（本卡最容易改坏的一处）；&gt;0.14s 铺完要 1.4s，观众开始逐条读而不听你讲</td></tr><tr><td><code>layerBlur</code></td><td>8px</td><td>入场模糊起点。&lt;4px 看不出&quot;对上焦&quot;；&gt;16px 每层进场都糊一下，十层连起来像画面在抖</td></tr><tr><td><code>layerDur</code></td><td>0.24s</td><td>单层 blur-in 时长。&lt;0.15s 读作硬闪；&gt;0.4s 与下一层重叠过多，错峰感糊掉</td></tr><tr><td><code>cursorStart</code></td><td>1.55s</td><td>光标起手（= 内容铺完 + 0.34s）。这 0.34s 是给口播介绍这个人的；&lt;0.1s 内容还没落完就有人来点，&gt;1.2s 卡在那儿干等</td></tr><tr><td><code>cursorMove</code></td><td>0.95s</td><td>光标弧线移入。&lt;0.4s 接近瞬移，&quot;有人在点&quot;的证据消失；&gt;1.4s 观众开始等它</td></tr><tr><td><code>clickDip</code></td><td>0.9</td><td>点击下压。&gt;0.96 看不出按了；&lt;0.85 按钮像被捏爆</td></tr><tr><td><code>flipDur</code></td><td>0.34s</td><td>两态交叉。&lt;0.18s 读作硬切图标；&gt;0.6s 按钮在那儿慢慢化，观众盯着它不听你讲</td></tr><tr><td><code>rollDur</code></td><td>0.42s</td><td>粉丝数纸带上推。&lt;0.2s 读作数字闪了一下；&gt;0.7s 一个数字滚这么久，注意力全跑过去</td></tr><tr><td>计数增幅</td><td>可读的一档</td><td>12.4万 → 12.5万。<strong>必须肉眼可读出变化</strong>——<code>128,431 → 128,432</code> 那一位观众看不见，等于没滚</td></tr><tr><td>bio 长度</td><td>20~32 字</td><td>单卡两行以内；&gt;40 字观众切换到&quot;读卡&quot;模式，你的讲述变成背景音</td></tr><tr><td>出现次数</td><td>1 次/条</td><td>同一张卡出现两次 = 观众第二次直接跳过；换人才换卡</td></tr><tr><td>在场时长</td><td>3~5s</td><td>&gt;8s 变牛皮癣挡内容；&lt;2.5s 观众还没读完名字就没了</td></tr></table><h3>已知坑</h3><ul><li><strong>十层同时全亮</strong>——退化成&quot;一张图淡入&quot;，本卡最贵的那拍（内容逐层落位）就废了。壳先到位、内容再逐层落是两拍。</li><li><strong>blur-in 只做淡入不做 blur</strong>——那是普通 stagger，&quot;从虚焦里对上焦&quot;的落位感没了。三个属性（blur / opacity / y）要一起动。</li><li><strong>在铺了重播初始态之后才量按钮位置</strong>（2026-08-25 实修的 bug）——量到的是卡还在半空、还缩着 0.9 时的坐标，</li></ul><p>  光标走到那儿时卡早落位了，按钮上移约 46px ⇒ 点击帧光标压在按钮下方的空处，&quot;有人点了关注&quot;当场垮掉。   量之前先 <code>clearProps</code> 卡的 transform，在终态量。</p><ul><li><strong>光标坐标没减箭头尖偏移</strong>——<code>x/y</code> 设的是元素左上角，直接对准按钮心会让尖偏在按钮右下角外。减掉 <code>TIP</code>。</li><li><strong>只跑 verify 的 t0/t1 两张截图就算验收过了</strong>——那两帧大概率都不在点击时刻上，光标没点到按钮这类 bug 一路漏过去。</li></ul><p>  交互卡必须<strong>截点击那一帧</strong>单独看。</p><ul><li><strong>按钮行排在层序中间</strong>——待交互的目标先落位、后面还有内容在动，光标点下去的时候画面还没安定。按钮行放最后一组。</li><li><strong>光标瞬移到按钮上</strong>——读作&quot;状态自己变了&quot;，不是&quot;有人关注了他&quot;。社会证明的说服力归零。</li><li><strong>两态用改 <code>textContent</code> 实现</strong>——读作&quot;字变了&quot;不是&quot;按钮换了状态&quot;；两层叠着交叉、退的缩、进的涨。</li><li><strong>点击后粉丝数不变</strong>——这次点击只影响了一个按钮、没影响任何事实，社会证明的落点丢了。计数必须跟着 +1。</li><li><strong>粉丝数直接换值</strong>——读作&quot;数据刷新了&quot;；纸带滚动才读作&quot;这个数涨了&quot;。</li><li><strong>滚动窗动的是窗口而不是纸带</strong>——整行文字（含&quot;关注者&quot;三个字）会跟着一起挪。窗口固定、纸带在里面推。</li><li><strong>计数增幅小到看不见</strong>（<code>128,431 → 128,432</code>）——滚了等于没滚。增幅要落在肉眼可读的那一位上。</li><li><strong><code>fromTo</code> 忘了 <code>immediateRender: false</code></strong>——涟漪环建表时就把 from 态刷上去，按钮&quot;还没被点&quot;时环已经挂在外圈（本库实测过的老坑）。</li><li><strong>卡的 <code>transform-origin</code> 用默认 center</strong>——弹入时整卡上下同时长大，读作弹窗不是卡片落位；锚在卡顶（<code>50% 0%</code>）。</li><li><strong>把 X 的皮灰阶化</strong>（2026-08-25 用户定版否掉的做法）——黑底白字胶囊 + 中性八角星徽标看着&quot;像个社交卡&quot;但<strong>不是任何平台</strong>，</li></ul><p>  观众读不出这是哪儿的账号，社会证明的出处就没了。这类卡产品皮 = 内容本身，照抄 <code>#1d9bf0</code> 与深色卡取值。</p><ul><li><strong>真人头像</strong>——头像是唯一保持灰阶占位的一层（没有素材，且 X 默认头像本身就是灰剪影）；换成真人照要自己解决肖像授权。</li><li><strong>光标常驻不走</strong>——一直吸引注意力，观众看光标不看卡。点完即走。</li><li><strong>同一张卡出现两次</strong>——第二次观众直接跳过。换人才换卡。</li><li>bio 写 lorem 或英文占位——&quot;这是个真人&quot;的说服力归零；写真实感中文。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/x-follow-card/index.html</code>。<strong>换人只改 HTML 里那几处文本</strong>（<code>.name</code> / <code>.badge</code>（要不要认证）/ <code>.handle</code> / <code>.bio</code> / <code>.meta</code> 三条 / <code>.stats</code> 的两个数字 / <code>.post</code> 那条示例帖）——</li></ul><p>  时序全在 <code>CONFIG</code>，与内容解耦，改文案不用碰任何时刻。粉丝数改 <code>.roll .strip</code> 里上下两个 <code>&lt;i&gt;</code>（上=旧值、下=新值，<strong>窗口高 20px 与 <code>rollDur</code> 那条 tween 的 <code>−20px</code> 要同步</strong>）。   节奏在 <code>CONFIG.cardIn</code> / <code>layerStagger</code> / <code>layerDur</code> / <code>cursorStart</code> / <code>cursorMove</code> / <code>flipDur</code> / <code>rollDur</code>；层序改 <code>layers</code> 数组（按阅读顺序，按钮行留在最后）；光标起点 <code>CONFIG.START</code>（换尺寸时按舞台宽重算，落点由 <code>P(el, fx, fy)</code> 从元素实际位置反算，换布局不用改坐标数字）。   核心可摘走：<code>CONFIG</code> + <code>DemoShell.register</code> 回调里的四段（①卡弹入 ②十层错峰 ③光标弧线 ④点击帧同帧五件事）。</p><ul><li><strong>不要关注交互、只要卡入场</strong>（常见裁剪）：删掉 ③④⑤ 三段与 <code>.cursor</code> / <code>.rip</code> / <code>.f-on</code> 三个元素，①② 两段独立成立——这就是一张&quot;资料卡弹入&quot;的纯道具卡，时长压到 1.4s。</li><li>Remotion 移植（这就是源头）：<code>registry/remocn/x-follow-card/index.tsx</code>（868 行）+ <code>registry/remocn/SOCIAL_FOLLOW_STYLEGUIDE.md</code>（<code>*-follow-card</code> 家族的作者契约：九层固定顺序、时间预算表、控件命名契约、主题 token）。</li></ul><p>  源码导出四个可直接抄的纯函数——<code>cardBounceIn(frame, fps)</code> 出 <code>{translateY, scale}</code>（<code>spring damping 12 / stiffness 120 / mass 0.8</code>）、   <code>blurInSchedule()</code> 出九组 <code>{group, start, end}</code> 帧窗、<code>blurInAt(step, frame)</code> 出 <code>{blur, opacity, translateY}</code>、<code>followStateAt(frame, speed)</code> 出布尔关注态；   光标路径用 <code>buildFollowWaypoints({buttonCenter, orientation})</code> + <code>useCursorPath</code>（<code>registry/remocn/use-cursor-path</code>），按压缩放取 <code>cursorStyle.pressScale</code>。   秒 ↔ 帧换算（30fps）：<code>CLICK_FRAME 110</code> = <strong>3.67s</strong>（本卡收到 2.58s——源码留了 75 帧光标待机，口播里那 2.5s 太贵）、   九层窗 <code>[20,26]…[36,42]</code> = 0.67→1.40s（本卡拆成十层、0.34→1.21s）、bounce-in 0→25 帧 = 0.83s（本卡 0.62s）、<code>durationInFrames 165</code> = 5.5s（本卡 4.08s）。   源码<strong>没有粉丝数变化</strong>（<code>SamplePost</code> 的互动数是硬编码静态值）——计数 +1 是本卡补的一拍，也是本卡认为社会证明的真正落点；移植时按 <code>sendFrame</code> 那套写法接在 <code>CLICK_FRAME</code> 之后即可（用 <code>interpolate</code> 驱动纸带 <code>translateY</code>，<strong>不要用 <code>Math.random</code></strong>，多趟渲染会闪）。   源码还有 <code>orientation: &quot;horizontal&quot; | &quot;vertical&quot;</code> 两套布局（竖屏走 720×1280、卡宽 660、按钮在 542,336），竖屏落地可直接抄那组数字。   <strong><code>speed</code> 必须 <code>min: 1</code></strong>（styleguide 第 2 节的硬约束）：<code>speed &lt; 1</code> 时 <code>frame × speed</code> 可能永远到不了 <code>CLICK_FRAME</code>，按钮卡在&quot;关注&quot;态永不翻转。</p><ul><li>剪辑软件对应物：剪映/CapCut——卡做成一张静态图，整体套&quot;放大弹入&quot;入场（时长 0.6s、带回弹）；十层错峰只能把卡<strong>切成十张图层</strong>分别给 0.07s 递进的入场（工作量大但效果对得上），偷懒版是切三段（封面/资料/按钮）；两态翻转是两个按钮图层交叉（&quot;关注&quot;层 Opacity 100→0 + Scale 100→92，&quot;已关注&quot;层 Opacity 0→100 + Scale 86→100 带弹性，关键帧<strong>必须与点击帧对齐</strong>）；粉丝数滚动用一个蒙版矩形 + 两行数字的文本层往上移。</li></ul><p>  AE——<code>cardBounceIn</code> 用 <code>spring</code> 表达式或 Overshoot 预设；十层用 Sequence Layers + Gaussian Blur 的 Blurriness 关键帧（8→0）；光标弧线用一条 Path 绑 Position（比手打两条关键帧准）；纸带滚动用 Source Text 不变、Position 打两个关键帧（Easy Ease Out）。   任何软件的&quot;社交卡模板&quot;要先检查两件事：各层是不是同时全亮、粉丝数有没有跟着变——市面模板九成两条都不合格。</p><ul><li>音效：卡弹入一记 <code>pop</code>（<code>vol</code> 0.6、<code>rate</code> 0.94，降调 = 有重量）；十层起头一记 <code>paper</code>（<code>vol</code> 0.26、<code>rate</code> 1.12）铺底，<strong>不要逐层给声</strong>（十记会糊成噪音）；点击帧一记 <code>click</code>（<code>vol</code> 0.6）；粉丝数滚动两记升调 <code>tick</code>（0.34/1.10 与 0.36/1.22——升调读作&quot;涨了&quot;）。hold 段无声。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<strong>壳与内容分两拍</strong>这条结构纪律（卡整体 spring 弹入到位 → 十层再逐层落）、卡弹入的&quot;位移先动 + 淡入独立窗&quot;错位与 <code>transform-origin</code> 锚在卡顶、<strong>十层错峰 blur-in</strong>（blur 8→0 + opacity + y 三属性同动，层距 0.07s）与<strong>层序按阅读顺序且按钮行最后</strong>这条取舍、内容铺完后 0.34s 的静置（给口播的余量）、光标从屏外<strong>弧线</strong>移入（x <code>power2.inOut</code> / y <code>sine.inOut</code> 异速叠出弧线，锚点在箭头尖）、<strong>落点在按钮终态位置上量且减掉箭头尖偏移</strong>这条纪律（连同&quot;交互卡必须截点击那一帧验收&quot;这条验收方式）、点击帧<strong>同帧五件事</strong>的反馈链（光标缩一拍 + 按钮下压 0.9 + 两态交叉 + 涟漪 + 计数滚动，随后 <code>back.out(3)</code> 回弹）、<strong>两态交叉的方向</strong>（退的缩 <code>1→0.92</code>、进的涨 <code>0.86→1</code> 带 <code>back.out(1.7)</code>）、<strong>粉丝数纸带上推 +1</strong>（窗口固定、纸带在里面推，<code>power3.out</code> 0.42s）这一拍及&quot;增幅必须肉眼可读&quot;这条验收、胶囊形涟漪 <code>0.92→1.3</code> 与 <code>immediateRender: false</code>、光标用完即走（0.45s 滑出淡出）。</li><li>不属于本卡的：demo 那个人（&quot;陈叙白 / @chenxubai / 杭州 / xubai.design / 2019 年 3 月加入&quot;）与那句 bio、12.4万→12.5万这组具体数字、示例帖那句文案与三个互动数、灰阶头像剪影的画法、四个 tab 的文案（帖子/回复/媒体/喜欢）、光标 SVG 的具体形状。</li></ul><p>  <strong>注意与其他卡不同：X 的皮（深色卡取值、品牌蓝、认证印章、X 标、600px 卡宽 + 24px 圆角这组源码几何）属于&quot;内容本身&quot;而不是&quot;可换的风格&quot;</strong>——见下面的底色要求。同一套时序当然可以套在别的&quot;资料卡 + 一个可点的主操作 + 一个跟着变的计数&quot;道具上（商品卡加购物车、课程卡报名、仓库卡 star 都成立），但那时它就不叫 x-follow-card 了，皮要换成那个产品的皮。</p><ul><li>迁移接口：HTML 里那几处文本是唯一的内容入口（时序与内容解耦，改文案不碰任何时刻）；粉丝数改纸带上下两个 <code>&lt;i&gt;</code>（<strong>窗口高与那条 tween 的位移量必须一致</strong>）；<code>cursorStart</code> 按口播语速给（他介绍完这个人你才让光标进场）；<code>layerStagger</code> 按&quot;十层铺完的总时长&quot;给（层距 × 9 + <code>layerDur</code> ≤ 1.3s 是安全线，再长口播就要等）；换尺寸只改 <code>.scaler</code> 那一个 <code>scale()</code>（卡内所有值是源码原值，不参与换算）；换主操作时只改按钮两层的文案与 <code>flipDur</code>（交叉方向不动）；换计数语义时保证增幅落在肉眼可读的那一位；竖屏按源码的 vertical 布局走（卡宽 660、按钮在 542,336、光标从下方进场）；<strong>不要关注交互只要卡入场</strong>时删掉后三段即可（见复用指引）。</li><li>底色要求：<strong>产品皮 = 内容本身，2026-08-25 用户定版：完全还原产品样式</strong>。本卡涉及真实产品界面（X 资料卡），</li></ul><p>  所以卡本体是 X 的深色皮（卡底 <code>#16181c</code> / 描边 <code>#2f3336</code> / 主文 <code>#e7e9ea</code> / 次文 <code>#71767b</code> / 品牌蓝 <code>#1d9bf0</code>），   <strong>不受&quot;白舞台中性化&quot;约束</strong>——把它灰阶化会让卡&quot;不是任何平台&quot;，社会证明的出处随之消失。   舞台本身仍是白底，深色只占那张卡；卡靠自身底色 + 阴影与背景分离，所以 overlay 压在实拍画面上同样成立   （深色卡叠在实拍上比浅色卡更稳，不需要额外描边补丁）。浅色皮也在源码里（<code>THEMES.light</code>：卡底 <code>#ffffff</code> /   描边 <code>#e6e9eb</code> / 主文 <code>#0f1419</code>），需要浅色 X 时整套换过去即可，<strong>唯一要跟着翻的是&quot;已关注&quot;态</strong>——   浅皮下它是白底 + 灰描边 + 黑字，深皮下不能照抄那个白底（会比卡还亮、抢走全部注意力），要用卡底色 + 亮描边。</p><ul><li>与相邻卡的分工：<strong>vs [subscribe-cta](subscribe-cta.md)（多平台关注 CTA）</strong>——那张是<strong>语法合集</strong>：三种平台式样（YouTube 订阅+铃铛 / B站三连长按 / 通用关注胶囊）串演，落地时只留一段，目标是&quot;<strong>示范观众去点</strong>&quot;，用在<strong>收尾的价值兑现点</strong>，overlay 只有控件没有卡。本卡是<strong>单卡精做的社交证明道具</strong>：一张完整资料卡（十层内容）+ 一次关注交互 + 计数变化，目标是&quot;<strong>证明这个人值得看</strong>&quot;，用在<strong>介绍嘉宾/账号的时刻</strong>。两张共享&quot;控件弹入 → 光标弧线移入 → 点击反馈链 → 状态翻转&quot;这套机制（本卡的 <code>P()</code>/弧线移动/<code>clickDip</code>/<code>immediateRender:false</code> 都与那张同源），差别是<strong>卡还是控件</strong>、<strong>证明还是号召</strong>、<strong>中段还是收尾</strong>。同一条视频里两张可以都出现（介绍嘉宾用本张，收尾要关注用那张），但不要挨着放。<strong>vs [lower-third-nameplate](lower-third-nameplate.md)</strong>——那张是&quot;这个人是谁&quot;的最小信息（名字 + 头衔，压在画面下三分之一，2~3s 用完即走），本卡是&quot;这个人凭什么&quot;的完整档案 + 一次交互；口播自己出镜报身份用那张，介绍<strong>别人</strong>并要观众记住这个账号用本张。<strong>vs [media-pop-in](media-pop-in.md)</strong>——那张是任意素材弹入的通用道具（无内容结构、无交互），本卡是有固定十层结构 + 交互编排的专用道具。</li></ul>","bar-chart-growth":"<h3>意图</h3><p>柱状图有两种读法：<strong>逐项对比</strong>（这几年谁高谁低）和<strong>整体形状</strong>（这条线在往上走）。 本库已有的 <code>chart-grow</code> 做的是前者——5 根柱、错峰 0.13s、每根柱顶带数值、最高柱换色高亮， 观众被引导着<strong>一根一根读</strong>，那是&quot;念数据&quot;的语感。</p><p>这张卡做的是后者。区别在三处，缺一处就变回 <code>chart-grow</code>：</p><ul><li><strong>柱多（7 根）、错峰密（0.06s）</strong>——0.06s × 6 = 0.36s，整组在 0.64s 内长完，</li></ul><p>  肉眼读作<strong>一次连续的抬升</strong>（像一道波扫过去），不是七个先后事件。</p><ul><li><strong>柱顶不带数值</strong>——单根柱的值不重要，重要的是这一排的<strong>斜率</strong>。柱顶挂七个数字</li></ul><p>  就把观众拉回&quot;逐项读&quot;，形状语义直接消失。</p><ul><li><strong>结论收在一个 chip 上</strong>——「增长 42%」这一句才是要被复述的东西，它替代了七个数值。</li></ul><p>命门两条： ① <strong>柱子只用 <code>scaleY</code></strong>。改 <code>height</code> 每帧触发重排，7 根柱 × 60fps 下会掉帧； 更要紧的是 <code>scaleY</code> 配 <code>transform-origin: 50% 100%</code> 才有&quot;从地里长出来&quot;的语义， 改 height 是&quot;柱子被拉长&quot;（顶部在动，底部也在重算）。 ② <strong>最高柱要留顶部余量给 chip</strong>。chip 的 <code>bottom</code> 由<strong>最高柱的实际像素高度</strong>算出 （<code>maxH + chipGap</code>），不是写死的 CSS 值——换一组数据后 chip 自动跟着抬，永远压不到柱顶。 写死了就必然有一天压上去。</p><h3>动效核心</h3><ul><li><strong>层级</strong>（自下而上）：白舞台 → 标题（34px/600 黑）→ 柱组容器（`display:flex; align-items:flex-end;</li></ul><p>  justify-content:space-between<code>，高度 = 量程）→ 基线（2px 灰，</code>transform-origin: 0% 50%<code>）→   x 轴月份标签（灰 13px）→ 结论 chip（绝对定位，</code>right: 0<code>，</code>bottom` 由 JS 算）。   主持人占位在右侧 32%，图表块左对齐在 96px。</p><ul><li><strong>① 标题</strong>：<code>opacity 0→1</code>，0.2s <code>power2.out</code>，<code>t = 0.30</code>。</li><li><strong>② 基线</strong>：<code>t = 0.42</code> 起，<code>scaleX 0→1</code>（<code>origin left</code>），0.24s <code>power2.out</code>。</li></ul><p>  <strong>先有地面柱子才能&quot;长出来&quot;</strong>——没有基线的柱子读作&quot;七个矩形淡入&quot;。</p><ul><li><strong>③ 七根柱</strong>：<code>t = 0.62 + i × 0.06</code>，每根 <code>scaleY 0→1</code>，0.28s <code>power3.out</code>，</li></ul><p>  <code>transform-origin: 50% 100%</code>。柱高在 <code>register</code> 里按 <code>dataset.v / maxVal × 容器高</code> 换算成   <strong>像素 height 写进 style</strong>（这一步是布局，不是动画），动画只动 <code>scaleY</code>。</p><ul><li><strong>④ 结论 chip</strong>：<code>lastTop = 0.62 + 6×0.06 + 0.28 = 1.26</code>，</li></ul><p>  <code>opacity 0→1</code> + <code>scale 0.8→1</code>，0.2s <code>back.out(1.4)</code>，<code>transform-origin: 100% 50%</code>   （从右端展开——chip 右对齐，从自己的锚点长出来）。   <code>back</code> 的回弹量刻意压到 1.4（不是漫画感的 2.2）：这是&quot;结论落章&quot;不是&quot;弹跳&quot;。</p><ul><li><strong>⑤ hold 1.8s</strong>：整图静置。</li><li><strong>量程固定</strong>：<code>maxVal = 100</code> 全程不变。中途改量程（比如按当前最大值动态归一）</li></ul><p>  柱子之间的对比就是骗人的。</p><ul><li><strong>唯一语义色 <code>#e8720c</code>（橙）</strong>：只上在柱体和 chip 上。标题黑、基线 hairline、月份灰。</li></ul><p>  <strong>七根柱同色</strong>——<code>chart-grow</code> 那种&quot;最高柱换色&quot;在这里是错的：换色 = 指认一项，   和&quot;看整体形状&quot;的意图相反。</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>barStagger</code></td><td>0.06s</td><td><strong>本卡第一命门</strong>；&gt;0.1s 读作&quot;七个动效&quot;（回到 <code>chart-grow</code> 的逐项语感），0 则整排同时起立、读作一块阶梯形色块被推上来（没有方向）</td></tr><tr><td>柱数</td><td>7</td><td>5 根以下&quot;形状&quot;不成立（该用 <code>chart-grow</code> 做逐项对比），&gt;10 根柱宽被压到 20px 以下、读作条形码</td></tr><tr><td><code>barGrow</code></td><td>0.28s</td><td>单柱升起时长；&lt;0.18s 柱子&quot;闪&quot;出来（看不见生长），&gt;0.45s 单柱的动作盖过整组的错峰节奏</td></tr><tr><td><code>barEase</code></td><td><code>power3.out</code></td><td>起步猛尾段缓，柱顶有&quot;顶到位&quot;的手感；<code>power1.out</code> 太软读作充气，<code>back.out</code> 柱顶过冲一下读作弹簧（数据不该弹）</td></tr><tr><td><code>baseDur</code></td><td>0.24s</td><td>基线画出；0（基线一开始就在）也成立但少了&quot;先立地面&quot;这一拍，&gt;0.4s 观众在等一条灰线画完</td></tr><tr><td><code>chipGap</code></td><td>18px</td><td>chip 底边距最高柱顶的留白；&lt;10px 视觉上贴到柱顶（读作柱子的标签而不是结论），&gt;40px chip 飘在空中和图脱开</td></tr><tr><td><code>chipPop</code></td><td>0.2s</td><td>结论落定；&gt;0.35s 结论来得软，抵不住前面七柱的动势</td></tr><tr><td><code>back.out(1.4)</code></td><td>1.4</td><td>chip 的回弹量；&gt;2 读作漫画弹跳（数据卡不该有的语言），1.0（= 无回弹）则少了&quot;落章&quot;的确认感</td></tr><tr><td><code>maxVal</code></td><td>100</td><td>量程，<strong>全程固定</strong>；改成&quot;按当前最大值动态归一&quot;柱间对比立刻失真</td></tr><tr><td><code>hold</code></td><td>1.8s</td><td>收尾定格；chip 那句话要读完，&lt;1.2s 观众只看到图没看到结论</td></tr></table><h3>已知坑</h3><ul><li>柱子动 <code>height</code> 而不是 <code>scaleY</code>——每帧重排，7 根柱在 60fps 下掉帧；且顶部与底部同时重算，</li></ul><p>  读作&quot;矩形被拉长&quot;不是&quot;从地里长出来&quot;。</p><ul><li>chip 的 <code>bottom</code> 写成固定 CSS 值——换一组数据后最高柱抬高，chip 直接压在柱顶上（本卡最常见的翻车）。</li></ul><p>  必须由最高柱的实际像素高度算出。</p><ul><li>错峰放大到 0.13s 还叫它&quot;柱状增长&quot;——那已经是 <code>chart-grow</code> 的逐项列举语感，整体形状读不出来了。</li><li>柱顶挂七个数值——观众被拉回&quot;一根一根读&quot;，形状语义消失；本卡的数值只有 chip 上那一个。</li><li>最高柱换成另一个色高亮——&quot;指认某一项&quot;和&quot;看整体趋势&quot;是相反的意图，换色就散架。</li><li>chip 在柱子还在长的时候就弹出——结论比数据先到，读作数是往结论上凑的。</li><li>忘了基线直接长柱——七个矩形在白底上淡入，没有&quot;地面&quot;就没有量级参照，读作装饰色块。</li><li>柱间距用 <code>justify-content: space-around</code> 且不给 x 标签同宽——柱和月份标签对不齐，</li></ul><p>  慢放一眼看出（demo 里柱与标签都固定 44px 宽 + <code>space-between</code>，天然对齐）。</p><ul><li>语义色上到标题上——<code>design-language.md</code> §1 红线：positive/negative 与图表色只进图表本体，</li></ul><p>  标题一律 ink 黑。</p><ul><li>hold 期给柱子加呼吸/微抖——数据是结论，抖起来读作&quot;还在算&quot;（§4 禁的定格抖动之外，</li></ul><p>  连续微动在这里也不合语义）。</p><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/bar-chart-growth/index.html</code>。<strong>换数据只改 HTML 里七个 <code>.bar</code> 的 <code>data-v</code></strong></li></ul><p>  （0~<code>maxVal</code>），柱高、chip 落位都是运行时按容器高度算的；换文案改 <code>.title</code> / <code>.grow-chip</code> /   <code>.xlabels</code>。柱数增减：HTML 里加减 <code>.bar</code> 与对应 <code>.xlabels span</code>（两边数量必须一致，   <code>space-between</code> 才对齐），<code>barStagger</code> 按&quot;整组 ≤0.4s&quot;反算（10 根柱 ⇒ 0.045s）。   做下滑趋势：<code>data-v</code> 递减 + <code>CONFIG</code> 里颜色换 <code>#d70015</code>、chip 文案改「下滑 38%」，   时序一个字不用改（本卡的动效对方向无感）。</p><ul><li>Remotion 移植：柱子逐帧算 <code>scaleY</code>，不建时间线：</li></ul><p>  <code>const p = interpolate(t, [0.62 + i*0.06, 0.62 + i*0.06 + 0.28], [0, 1],   {easing: Easing.out(Easing.cubic), extrapolateLeft:'clamp', extrapolateRight:'clamp'})</code>，   样式 <code>transform: scaleY(${p})</code> + <code>transformOrigin: '50% 100%'</code>。   <code>clamp</code> 不能省——不 clamp 的话 <code>t</code> 在起点前会算出负 <code>scaleY</code>，柱子会往地面下方翻出来。   chip 的 <code>bottom</code> 在组件里用 <code>Math.max(...values) / maxVal * chartH + chipGap</code> 算（和 demo 同式子）。   基线用 <code>scaleX</code> + <code>transformOrigin: 'left center'</code>。</p><ul><li>剪辑软件对应物：剪映/CapCut——七个矩形形状层，各打&quot;缩放 Y&quot; 两键（0→100%），</li></ul><p>  <strong>锚点必须拖到矩形底边</strong>（剪映默认中心锚点，从中间往两边长 = 完全另一个动效），   入点按 0.06s（约 2 帧 @30fps）逐层往后推；chip 一层做&quot;缩放弹入&quot;。   七层 × 2 帧的手工排列在剪映里很枯燥，但<strong>错峰值不能为了省事拉大</strong>，那是本卡的命门。   AE——一个 Shape Layer 里七个 Rectangle，或用 <code>Scale</code> 属性 + <code>Anchor Point</code> 移到底边；   更省事的做法是七个层套一个 <code>Sequence Layers</code>（Keyframe Assistant）设 0.06s 偏移；   chip 用 <code>Scale</code> 两键 + <code>Easy Ease</code> 再把手柄拉出一点过冲（≈ <code>back.out(1.4)</code>）。</p><ul><li>与本库同类卡的分工：<code>chart-grow</code> = 5 柱逐项对比（错峰 0.13s、柱顶带值、最高柱高亮换色，</li></ul><p>  &quot;念数据&quot;）；<code>line-chart-story-draw</code> = 一条线讲一个故事（分段推演 + 标注 + 对比虚线）；   <code>metric-with-sparkline</code> = 一个数 + 它的趋势；<code>number-slab-pop</code> = 只报一个结论数字；   <strong>本卡 = 一段连续区间的整体形状</strong>（多柱、密错峰、无柱顶数值、结论收在一个 chip 上）。</p><h3>动效范围</h3><ul><li>属于本卡的：<code>barStagger 0.06s</code> 这个&quot;密到读作一次连续动作&quot;的错峰量级；柱子只走 <code>scaleY</code> + <code>transform-origin: 50% 100%</code>（拒绝动 height）这条实现纪律；「基线先画出、柱子后升起」这个顺序；七柱<strong>同色无柱顶数值</strong>这个&quot;看形状不看单项&quot;的减法；结论 chip 押在最后一根到顶那一帧弹出、<code>back.out(1.4)</code> 的压抑回弹量；chip 落位由<strong>最高柱实际高度</strong>算出（<code>maxH + chipGap</code>）这个自适应要求；量程全程固定；hold 期完全静置。</li><li>不属于本卡的：「数据说话 / 增长 42% / 1月~7月」这套具体文案与那组递增数据、<code>#e8720c</code> 这个橙（换 accent 蓝或 negative 红都成立）、44px 柱宽与 6px 圆角、240px 的量程高度、chip 的 12px 圆角与 22px 字号、右侧主持人（数字人）占位、以及&quot;图表左对齐在 96px、贴底 96px&quot;这个落位。</li><li>迁移接口：HTML 里的 <code>data-v</code> 是唯一的内容入口；柱数变了要按&quot;整组升起 ≤0.4s&quot;反算 <code>barStagger</code>（<code>0.4 / (n-1)</code>）；柱宽按可用宽度 ÷ (柱数 × 1.9) 取（留出约等宽的间隙）；<code>chipGap</code> 按柱宽的 40% 缩放；量程高度按舞台高的 45% 取；换方向（下滑）只改数据与颜色，时序不动；竖屏把柱数减到 5 并把柱宽提到 56px（横向空间少，7 柱在竖屏里会压到 26px 以下）。</li><li>底色要求：白底即可。深底成立（柱色换 <code>#ff9f0a</code> 一类的深底橙、基线换 <code>rgba(255,255,255,0.14)</code>、标题反白），唯一约束是<strong>底不能有横向网格线</strong>——柱子在长的过程中会与网格线反复交叠，读作&quot;柱子在闪&quot;。要网格就把它压到 3% 以下的对比度，或干脆不要（本卡靠基线给量级参照，不需要网格）。</li></ul>","chart-grow":"<h3>意图</h3><p>让数字&quot;长&quot;出来而不是贴出来——生长的先后顺序就是口播的列举顺序，观众的眼睛跟着话走。 命门：<strong>轴先柱后</strong>（没有坐标系柱子就没有量级）、<strong>逐根错峰</strong>（同时长出=没有&quot;逐项列举&quot;的语感）、 <strong>y 轴满量程全程固定</strong>（中途缩放，柱子间的对比就是骗人）。</p><h3>动效核心</h3><ul><li>第一拍：轴线 + 网格线 + 图题 opacity 0→1，0.3s power2.out</li><li>柱子：每根 scaleY 0→1（transform-origin 底部）0.5s power3.out，柱间 stagger 100~150ms</li><li>柱顶数字：在该柱长到约 70% 进度时 scale 0.4→1 + opacity 弹出（back.out(2)），和柱到顶几乎同帧</li><li>层级色：普通柱灰调（白底 demo 用 #d2d2d7），关键柱（最高/结论柱）用语义高亮色（demo #d8383a）且数字更大——重要的是&quot;一根有色其余灰&quot;的关系，色值随风格换</li><li>收尾：关键柱到顶瞬间整图 scale 1→1.03→1 轻 punch 一拍（0.08s 上 + 0.22s back.out 回）</li><li>折线变体：path stroke-dashoffset 描画 1~1.5s，数据点沿途 scale pop，末端数值计数</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>单柱生长</td><td>0.5s</td><td>&gt;0.8s 观众等得着急；&lt;0.3s 五根柱挤成一团动</td></tr><tr><td>柱间错峰</td><td>130ms</td><td>&gt;250ms 拖成逐个介绍；&lt;80ms 读作同时长出</td></tr><tr><td>数字弹出时机</td><td>柱进度 70%</td><td>柱到顶后才出像贴上去的；柱刚起就出剧透终值</td></tr><tr><td>关键柱颜色</td><td>一根高亮其余灰</td><td>根根有色=没有结论；灰柱是给红柱当背景板的</td></tr><tr><td>punch 幅度</td><td>1.03</td><td>&gt;1.06 图表在跳舞；不 punch 结论柱就没有&quot;落锤&quot;感</td></tr><tr><td>y 轴满量程</td><td>固定（demo 100）</td><td>跟着最大值动态缩放，柱高对比全部失真</td></tr></table><h3>已知坑</h3><ul><li>所有柱同时长出——没有&quot;第一年、第二年……&quot;的语感，信息密度归零。</li><li>y 轴中途改刻度——85 的柱子看起来只比 45 高一点，数据欺诈既视感。</li><li>标签和柱不同步——柱停了数字才慢悠悠出现，像两个人做的动画。</li><li>柱子用 height 动画而不是 scaleY——布局回流卡顿，低端机掉帧。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/chart-grow/index.html，改 <code>.bar-col</code> 的 <code>data-v</code> 与年份文字即可换数据（高度自动按 <code>CONFIG.maxVal</code> 计算）；关键柱挪 <code>hot</code> class；节奏在 <code>CONFIG</code>。</li><li>Remotion 移植：每柱 <code>spring({frame: frame - i*4, config:{damping:14}})</code> 驱动 scaleY；数字标签 delay = i*4 + Math.round(growDur*0.7)；punch 用 interpolate 三键帧 [1, 1.03, 1]。</li><li>（实测变体）分组错峰：多指标分组时不是逐柱 stagger，而是<strong>逐组</strong>从左到右出现（组间约 0.5s），组内多柱同时生长——错峰层级从&quot;根&quot;提到&quot;组&quot;，对齐口播的&quot;第一个季度……第二个季度……&quot;；全组长完后一个大数字结论压顶弹出收尾。见 TheAIScaler（Apm_oCzPEQs）。</li><li>剪辑软件对应物：剪映&quot;图表&quot;贴纸只有成品样式，精细版要 AE（矩形层 scale 关键帧 + 锚点置底）或 PR MOGRT；Excel 录屏是反面教材。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：坐标轴 + 网格 + 图题 opacity 0→1（0.3s、power2.out）打头的&quot;先立坐标系&quot;一拍；每根柱 scaleY 0→1（0.5s、power3.out、transform-origin 底部）、柱间 stagger 100~150ms 的逐项列举节奏；柱顶数字在该柱约 72% 进度时 scale 0.4→1 + 淡入弹出（0.25s、back.out(2)）；y 轴满量程全程固定这条约束；关键柱到顶瞬间整图 scale 1→1.03→1 轻 punch（0.08s 上 + 0.22s back.out(3) 回）；&quot;一根高亮、其余灰&quot;的层级色关系（哪根被高亮属于本卡，具体色值不属于）。</li><li>不属于本卡的：具体数据与年份文案、柱宽/圆角/间距、网格线密度、字幕行与图题文字、高亮色的具体色值。</li><li>迁移接口：数据改 <code>.bar-col</code> 的 <code>data-v</code>，高亮柱挪 <code>hot</code> class；<code>maxVal</code> 定满量程（必须固定）；<code>barGrow</code> / <code>barStagger</code> 按列举语速整体缩放；<code>labelPopAt</code> 调数字与柱到顶的同步；<code>punchScale</code> 调结论落锤力度；配色只需两个 token——常规柱灰阶 + 关键柱语义色（柱顶数字与字幕强调词跟着关键柱色走）。</li><li>底色要求：白底即可（轴 #c8c8cc、网格 #ececef、常规柱 #d2d2d7）。深底把这三层反相为深灰阶、关键柱色保持高饱和即可，时序不变。</li></ul>","line-chart-story-draw":"<h3>意图</h3><p>口播做假设推演时，一次性画完的折线等于剧透——观众看见终点就不再听推理过程。分段生长把 &quot;一条线&quot;拆成&quot;一句话一段&quot;：历史段先在场立住事实基准，讲到假设才让线从拐点往右长， 对比虚线从同一拐点岔出，两种未来的分歧被眼睛直接量出来。命门： <strong>历史段不生长</strong>（它是既成事实，跟着一起长就变成&quot;数据也是我编的&quot;）、 <strong>逐段严格由语音触发</strong>（段间必须留停顿，连着长完就退化成一次性描线动画）、 <strong>对比线必须共用同一个拐点</strong>（换起点画第二条线，&quot;同一起点两种未来&quot;的论证当场失效）。</p><h3>动效核心</h3><ul><li>历史段：灰阶折线（demo #a8a8ad、2.6px）第一帧就在场，全程不动；<code>bandTop/bandBottom</code> 之间一条&quot;今天&quot;竖虚线把历史/推演分开</li><li>拐点：白芯圆点 scale 0→1（0.22s <code>back.out(2.4)</code>）+ 一圈同色描边涟漪 scale 0.5→3.2、opacity 0.9→0（0.5s <code>power2.out</code>）——&quot;就是这里&quot;的落点</li><li>拐点标注：文字标签 scale 0.7→1 + y 6→0 弹出（0.25s <code>back.out(2)</code>），弧线箭头同帧 scale 0.55→1 从箭尖 origin 张开，指向拐点；标注落定后再停 0.35s 才开始生长</li><li>分段生长：每段一条独立 SVG path，<code>stroke-dasharray = 整段长</code>、<code>stroke-dashoffset</code> 从整长→0，单段 0.4~0.8s <code>power2.out</code>（起笔快收笔缓 = 手在画），<strong>段之间留 0.3~0.4s 停顿等语音</strong></li><li>段末标签：该段 dashoffset 归零那一帧，<code>▲5%</code> 标签 + 弧线箭头一起弹出（0.25s <code>back.out(2)</code>），箭头指回段末点</li><li>端点数值标签：一个 chip 贴着线端（+12, −30 px 偏移）跟随移动，数字由 <code>getPointAtLength().y</code> 反算实时刷新（<code>tabular-nums</code> 防跳字）</li><li>对比虚线：从同一拐点、以更大斜率的第二条 path，虚线笔画不能直接动 dashoffset → 套一层 16px 实心 stroke 的 <code>&lt;mask&gt;</code>，动 mask 的 dashoffset 揭开（0.7s <code>power2.out</code>），端点落一个深色空心点 + <code>涨幅×2</code> 标签</li><li>区间罩显：竖向半透明色带（demo <code>rgba(216,56,58,.07)</code>）+ 底部灰色区间名，两条错峰 0.3s 各 0.3s <code>power2.out</code> 淡入，画在折线<strong>下方</strong>图层</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>hold0</code></td><td>0.6s</td><td>历史线静置几拍等语音念到&quot;假设&quot;；0 则观众还没看清事实就开始推演</td></tr><tr><td><code>segments[].dur</code></td><td>0.6s</td><td>单段生长时长；&lt;0.4s 读作闪现（没有&quot;正在推演&quot;），&gt;0.8s 观众等得着急</td></tr><tr><td><code>segGap</code></td><td>0.35s</td><td>段间停顿——<strong>本卡的命门参数</strong>；&lt;0.15s 几段连成一条一次性描线，分段叙事归零</td></tr><tr><td><code>annotPop</code></td><td>0.25s</td><td>标签+箭头弹出时长；&gt;0.4s 拖沓，&lt;0.15s 没有&quot;叮&quot;的落定感</td></tr><tr><td><code>annotHold</code></td><td>0.35s</td><td>标注落定到开始生长的停顿；0 则标注和线抢同一帧，观众不知道先看哪</td></tr><tr><td><code>altGap</code></td><td>0.4s</td><td>实线讲完 → 虚线岔出的停顿；两条线不留缝就变成&quot;同时两条&quot;，不是&quot;另一种可能&quot;</td></tr><tr><td><code>alt.dur</code></td><td>0.7s</td><td>对比线略慢于主线，读作&quot;再算一遍&quot;；比主线快会抢走结论</td></tr><tr><td><code>bandStagger</code></td><td>0.3s</td><td>色带错峰；同时淡入 = 一块大色底，&quot;逐个罩住哪几段&quot;的语义消失</td></tr><tr><td><code>growEase</code></td><td>power2.out</td><td>生长缓动；<code>none</code> 匀速立刻变成程序绘图，<code>back</code> 会让线头过冲出格</td></tr><tr><td><code>chipDx/chipDy</code></td><td>12 / −30</td><td>端点数值 chip 相对线端的偏移；贴太近压线，离太远读不出&quot;这是线端的值&quot;</td></tr><tr><td><code>scale</code></td><td>yBase/vBase/yStep/vStep</td><td>y 像素→数值的线性映射，换数据只改这四个数（满量程必须固定）</td></tr></table><h3>已知坑</h3><ul><li>历史段跟着一起生长——事实和假设一样是&quot;现场画出来&quot;的，数据可信度当场归零。</li><li>几段连着长完（<code>segGap</code> 太小或干脆一条 path 一次描完）——这就退化成 chart-grow 的折线变体，本卡的&quot;分段叙事&quot;完全没做出来。</li><li>对比虚线换了起点——&quot;同一起点、两种未来&quot;的论证前提破了，观众读作两组无关数据。</li><li>虚线直接动 <code>stroke-dashoffset</code> 生长——dasharray 已被虚线占用，效果是虚线在原地流动（像跑马灯），必须用 mask 揭示。</li><li>端点数值 chip 用非等宽数字——数字位数变化时 chip 宽度抖，读作画面在颤（<code>font-variant-numeric: tabular-nums</code> 解决）。</li><li>区间色带画在折线上层或饱和度太高——线被罩糊，罩显反而遮掉了要看的证据。</li><li>标签先于线段出现——结论比推演先到，逐段推理的悬念全废。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/line-chart-story-draw/index.html。换数据只改 <code>CONFIG</code>：<code>history</code> 换历史点位、<code>pivot</code> 换拐点、<code>segments[].pts/dur/label</code> 换推演段与段末标签、<code>alt</code> 换对比线与端点标签、<code>annot</code> 换拐点标注（<code>arc</code> 三点定弧线箭头）、<code>bands</code> 换罩显区间、<code>scale</code> 定 y→数值映射；节奏全在 <code>hold0/segGap/annotHold/altGap/bandStagger</code>。核心动画即 <code>DemoShell.register</code> 回调整段（<code>growSeg</code> / <code>popLabel</code> 两个小函数），复制 CONFIG + 回调可直接摘走。</li><li>Remotion 移植：每段一个 <code>&lt;Sequence from={段起始帧}&gt;</code>，<code>strokeDashoffset={interpolate(frame, [0, dur*fps], [L, 0], {easing: Easing.out(Easing.quad), extrapolateRight:'clamp'})}</code>（<code>L</code> 用 <code>useLayoutEffect</code> 里 <code>getTotalLength()</code> 量或预先算好写死）；段末标签用 <code>spring({frame: frame - (段起 + dur*fps), config:{damping:10}})</code> 驱动 scale；端点 chip 位置用同一 <code>interpolate</code> 的进度调 <code>getPointAtLength</code>（把点位预采样成数组避免每帧测量）；对比虚线保留 mask 结构，动 mask path 的 dashoffset；色带用 opacity interpolate + <code>i*bandStagger*fps</code> 延迟。<strong>帧驱动下段间停顿要写成显式空帧</strong>，别指望时间线自然拉开。</li><li>剪辑软件对应物：AE——形状图层折线 + &quot;修剪路径&quot;(Trim Paths) End 关键帧，每段一个图层错开入点（虚线段用 Trim Paths 配合&quot;描边&quot;效果的虚线开关，或同样做遮罩层揭示）；剪映——折线只能用&quot;线条生长&quot;贴纸拼段，分段叙事需要把每段做成独立素材依次入场；CapCut 搜 line chart / graph animation 模板，但内置的多是一次性描完，分段得自己切。</li></ul><h3>动效范围</h3><ul><li>属于本卡的（与 chart-grow 划界：那张卡是柱状图从零一次性亮相、回答&quot;这几个数各是多少&quot;，本卡是<strong>折线的分段叙事</strong>——图已在场、事实段不动，只有&quot;假设&quot;被逐段推出来，回答&quot;如果这样、接下来会怎样&quot;）：历史段第一帧即在场、全程不生长这条约束；拐点圆点 scale 0→1 pop（0.22s、back.out(2.4)）+ 同色涟漪 scale 0.5→3.2 淡出（0.5s、power2.out）；每段折线 <code>stroke-dashoffset</code> 从整长→0 从拐点向右生长（0.4~0.8s、power2.out）、<strong>段与段之间留 0.3~0.4s 停顿由语音逐段触发</strong>的分段时序；段完成同帧标签 scale 0.7→1 + y 6→0 与弧线箭头 scale 0.55→1 一起弹出（0.25s、back.out(2)）；端点数值 chip 贴线端跟随移动、数值随线端高度实时刷新；对比虚线从<strong>同一拐点</strong>以不同斜率生长（mask 揭示，0.7s，略慢于主线）+ 端点点亮与标签；竖向区间色带逐个错峰淡入（0.3s、错峰 0.3s、图层在折线之下）。</li><li>不属于本卡的：坐标轴/网格/刻度与&quot;今天&quot;分界虚线的样式、具体数据与年份文案、标签的边框圆角字号、字幕行、主播小窗与数字人占位、灰阶+红这一套具体色值。相邻卡的分工也不在本卡内：只在静态画面上指一处用 callout-line-label（点→线→字三拍是独立动作，本卡的拐点标注只服务于线的生长节奏）；要单独强调一个终值叠 number-counter（本卡端点 chip 的数值是线端位置的副产品，跟着线走才变，不是独立计数动画）。</li><li>迁移接口：数据全在 <code>CONFIG</code> 的 <code>history/pivot/segments/alt</code> 点位表 + <code>scale</code> 的 y→数值映射（满量程必须固定，中途缩放对比即失真）；配色只需三个 token——历史灰 <
