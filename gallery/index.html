<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-talkcraft · 口播动效库</title>
<script>try{var __t=localStorage.getItem("vtc-theme");if(__t)document.documentElement.dataset.theme=__t;}catch(e){}</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0b0b0e; --panel:#131317; --line:#232329; --line2:#1a1a20; --txt:#ececf1; --txt2:#c9c9d4;
    --dim:#8a8a96; --acc:#7A5AF8; --acc2:#9a82ff; --bar:#050507ee; --tabsbg:#0b0b0eee;
    --input:#17171d; --input-line:#26262e; --chip:#1b1b22; --chip-txt:#b9b9c6;
    --btn:#1b1b22; --btn-line:#2a2a33; --btn-txt:#cfcfd8; --hint:#5c5c68;
    --scope-bg:#15151a; --scope-line:#202028; --scope-txt:#a9a9b6; --scope-b:#cfcfda;
    --tag:#1e1e26; --tag-txt:#9d9dab; --rule:#1c1c22; --dlg:#131317; --dlg-line:#2e2e38; --dlg-txt:#dcdce4;
    --code:#20202a; --th:#1c1c24; --td-line:#2c2c36; --sel:#17171d; --sel-line:#33333f;
    --p0-bg:#7a5af833; --p0-txt:#c9baff; --scroll:#26262e; --hover-line:#3d3d4a;
    --shadow:rgba(0,0,0,.55); }
  html[data-theme="light"] { --bg:#f5f5f8; --panel:#ffffff; --line:#e3e3ea; --line2:#e7e7ee;
    --txt:#1c1c22; --txt2:#3a3a46; --dim:#6d6d7a; --acc:#7A5AF8; --acc2:#6a48f0;
    --bar:#ffffffee; --tabsbg:#f5f5f8ee; --input:#ffffff; --input-line:#d9d9e3;
    --chip:#ececf2; --chip-txt:#4a4a58; --btn:#ffffff; --btn-line:#d9d9e3; --btn-txt:#3a3a46;
    --hint:#9a9aa8; --scope-bg:#efeff4; --scope-line:#e3e3ea; --scope-txt:#55555f; --scope-b:#2a2a33;
    --tag:#ececf2; --tag-txt:#6d6d7a; --rule:#e7e7ee; --dlg:#ffffff; --dlg-line:#dddde6; --dlg-txt:#2a2a33;
    --code:#f0f0f4; --th:#f2f2f6; --td-line:#e3e3ea; --sel:#ffffff; --sel-line:#d9d9e3;
    --p0-bg:#7a5af81f; --p0-txt:#6a48f0; --scroll:#d5d5de; --hover-line:#c9c9d6;
    --shadow:rgba(20,20,40,.18); }
  body { background:var(--bg); color:var(--txt); font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }

  /* ── 顶栏 ── */
  .topbar { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
    padding:12px 32px; background:var(--bar); backdrop-filter:blur(12px); border-bottom:1px solid var(--line2); }
  .topbar h1 { font-size:20px; letter-spacing:1px; font-weight:800; white-space:nowrap; }
  .topbar h1 .sub { color:var(--dim); font-size:14px; font-weight:600; letter-spacing:0; }
  .tb-spacer { flex:1; }
  .tbtn { font-size:13px; padding:7px 14px; border-radius:9px; border:1px solid var(--btn-line);
    background:var(--btn); color:var(--btn-txt); cursor:pointer; text-decoration:none;
    white-space:nowrap; font-family:inherit; line-height:1.4; }
  .tbtn:hover { border-color:var(--acc); color:var(--acc2); }
  .follow { position:relative; }
  .follow .menu { display:none; position:absolute; right:0; top:100%; padding-top:8px; z-index:60; }
  .follow:hover .menu { display:block; }
  .follow .menu-in { background:var(--panel); border:1px solid var(--btn-line); border-radius:10px;
    overflow:hidden; box-shadow:0 8px 28px var(--shadow); min-width:130px; }
  .follow .menu a { display:block; padding:9px 16px; font-size:13px; color:var(--txt);
    text-decoration:none; white-space:nowrap; }
  .follow .menu a:hover { background:var(--acc); color:#fff; }

  /* ── 分类 tab + 搜索框（原 78/78 计数位） ── */
  .tabs { display:flex; align-items:center; gap:16px; padding:0 32px; border-bottom:1px solid var(--line2);
    background:var(--tabsbg); position:sticky; top:55px; z-index:39; backdrop-filter:blur(12px); }
  .cats { display:flex; align-items:center; gap:30px; overflow-x:auto; }
  .tab { padding:14px 2px 12px; font-size:15px; color:var(--dim); cursor:pointer; user-select:none;
    border-bottom:2.5px solid transparent; white-space:nowrap; }
  .tab.on { color:var(--txt); border-color:var(--acc); font-weight:600; }
  .tabs .spacer { flex:1; }
  .search { width:min(300px,30vw); margin:7px 0; }
  .search input { width:100%; background:var(--input); border:1px solid var(--input-line); color:var(--txt);
    border-radius:999px; padding:7px 16px; font-size:13px; outline:none; font-family:inherit; }
  .search input:focus { border-color:var(--acc); }

  /* ── 主推大预览（播放器 + 胶片条） ── */
  .hero { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr); gap:22px;
    padding:24px 32px 8px; align-items:start; }
  .hero-player { position:relative; background:#0e0e12; border:1px solid var(--line);
    border-radius:16px; overflow:hidden; aspect-ratio:16/9; width:100%; min-width:0; }
  .hero-player iframe { width:100%; height:100%; border:0; display:block; }
  /* 首次进页的点击播放层：浏览器自动播放策略下，声音必须由一次用户手势解锁 */
  .hero-poster { position:absolute; inset:0; cursor:pointer; background:#0e0e12; }
  .hero-poster img { width:100%; height:100%; object-fit:cover; display:block; filter:brightness(.72); }
  .hero-poster .pp { position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; }
  .hero-poster .ppbtn { width:74px; height:74px; border-radius:50%; background:rgba(5,5,8,.62);
    border:2px solid #ffffffcc; color:#fff; font-size:26px; display:flex; align-items:center;
    justify-content:center; padding-left:6px; }
  .hero-poster:hover .ppbtn { background:var(--acc); border-color:var(--acc); }
  .hero-poster .pph { font-size:13px; color:#fff; background:rgba(5,5,8,.62); padding:5px 14px; border-radius:999px; }
  .hero-player .nav { position:absolute; top:50%; transform:translateY(-50%); width:42px; height:68px;
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff;
    background:rgba(5,5,8,.55); border:0; cursor:pointer; z-index:5; border-radius:12px;
    opacity:0; transition:opacity .15s; }
  .hero-player:hover .nav { opacity:1; }
  .hero-player .nav:hover { background:rgba(122,90,248,.75); }
  .hero-player .nav.prev { left:12px; }
  .hero-player .nav.next { right:12px; }
  .hero-player .pos { position:absolute; right:14px; top:12px; font-size:12.5px; color:#fff;
    background:rgba(5,5,8,.62); padding:4px 12px; border-radius:999px; z-index:5;
    font-family:Menlo,monospace; letter-spacing:1px; }
  .hero-info { display:flex; flex-direction:column; gap:14px; padding:10px 2px; min-width:0; }
  .hero-info h2 { font-size:30px; font-weight:800; }
  .hero-info h2 code { font-size:13px; color:var(--dim); font-weight:400; margin-left:10px; }
  .hero-meta { display:flex; gap:8px; flex-wrap:wrap; }
  .hchip { font-size:12px; color:var(--chip-txt); background:var(--chip); border-radius:999px; padding:4px 12px; }
  .hchip.p0 { background:var(--p0-bg); color:var(--p0-txt); }
  .hero-one { font-size:14px; line-height:1.75; color:var(--txt2); }
  .hero-usage { font-size:13px; line-height:1.7; color:var(--dim); }
  .hero-usage b { color:var(--acc2); font-weight:600; }
  .hero-scope { font-size:12.5px; line-height:1.7; color:var(--scope-txt); background:var(--scope-bg);
    border:1px solid var(--scope-line); border-radius:10px; padding:10px 14px; max-height:132px; overflow:auto; }
  .hero-scope b { color:var(--scope-b); }
  .hero-act { display:flex; gap:10px; margin-top:auto; }
  .hero-act .btn { font-size:14px; padding:10px 20px; border-radius:10px; border:1px solid var(--btn-line);
    background:var(--btn); color:var(--txt); cursor:pointer; text-decoration:none; text-align:center; font-family:inherit; }
  .hero-act .btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .hero-act .btn:hover { filter:brightness(1.08); }
  .hero-act label.btn { display:flex; align-items:center; gap:8px; }
  .hero-act input { accent-color:var(--acc); width:15px; height:15px; }
  .hero-hint { font-size:12px; color:var(--hint); }
  .hero-hint kbd { background:var(--btn); border:1px solid var(--btn-line); border-radius:5px;
    padding:1px 7px; font-family:Menlo,monospace; font-size:11px; color:var(--tag-txt); }

  /* ── 胶片条：当前筛选下的全部卡，横向滚动浏览 ── */
  .strip-wrap { padding:14px 32px 6px; }
  .strip { display:flex; gap:10px; overflow-x:auto; padding:4px 2px 10px; scroll-behavior:smooth; }
  .strip::-webkit-scrollbar { height:8px; }
  .strip::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:4px; }
  .strip::-webkit-scrollbar-track { background:transparent; }
  .chip-card { position:relative; flex:0 0 168px; aspect-ratio:16/9; border-radius:10px; overflow:hidden;
    border:2px solid var(--line); cursor:pointer; background:#0e0e12; }
  .chip-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .chip-card .nm { position:absolute; left:6px; bottom:6px; right:6px; font-size:11px; font-weight:700; color:#fff;
    background:rgba(5,5,8,.72); border-radius:5px; padding:2px 7px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .chip-card:hover { border-color:var(--hover-line); }
  .chip-card.on { border-color:var(--acc); box-shadow:0 0 14px #7a5af866; }
  .chip-card .idx { position:absolute; right:5px; top:5px; font-size:10px; color:#c9baff;
    background:rgba(5,5,8,.72); border-radius:4px; padding:1px 6px; font-family:Menlo,monospace; }
  .chip-card iframe { width:100%; height:100%; border:0; display:block; pointer-events:none; }
  .chip-card video, .tile .prev video { width:100%; height:100%; object-fit:cover; display:block;
    pointer-events:none; background:#0e0e12; }

  /* NEW 徽标：本批新增卡 */
  .newbadge { position:absolute; left:6px; top:6px; z-index:3; font-size:10px; font-weight:800;
    letter-spacing:1px; color:#0b0b0e; background:#7dffb2; border-radius:5px; padding:2px 7px;
    pointer-events:none; }
  .hchip.newchip { background:#7dffb233; color:#2f9e63; font-weight:700; }
  html:not([data-theme="light"]) .hchip.newchip { color:#7dffb2; }

  /* ── 分区卡墙 ── */
  .section { padding:26px 32px 4px; }
  .sec-head { display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .sec-head h3 { font-size:17px; font-weight:700; white-space:nowrap; }
  .sec-head .rule { flex:1; height:1px; background:var(--rule); }
  .sec-head .all { font-size:13px; color:var(--dim); cursor:pointer; white-space:nowrap; }
  .sec-head .all:hover { color:var(--acc2); }
  .sec-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .tile.picked { border-color:var(--acc); box-shadow:0 0 0 1px #7a5af855; }
  .tile .prev { position:relative; aspect-ratio:16/9; background:#0e0e12; cursor:pointer; }
  .tile .prev img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .prev iframe { width:100%; height:100%; border:0; display:block; pointer-events:none; }
  .tile .prev .nm { position:absolute; left:10px; bottom:10px; font-size:14px; font-weight:800; color:#fff;
    background:rgba(5,5,8,.74); border-radius:7px; padding:4px 12px; letter-spacing:.5px; pointer-events:none; }
  .tile .bar { display:flex; align-items:center; gap:8px; padding:9px 12px; font-size:12px; color:var(--dim); }
  .tile .bar code { font-size:11.5px; }
  .tile .bar .tag { font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--tag); color:var(--tag-txt); }
  .tile .bar .tag.p0 { background:var(--p0-bg); color:var(--p0-txt); }
  .tile .bar .sp { flex:1; }
  .tile .bar label { display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none; }
  .tile .bar input { accent-color:var(--acc); }
  .tile .bar button { font-size:12px; border:1px solid var(--btn-line); background:var(--btn); color:var(--btn-txt);
    border-radius:7px; padding:4px 12px; cursor:pointer; font-family:inherit; }
  .tile .bar button:hover { border-color:var(--acc); color:var(--acc2); }
  .empty { color:var(--dim); text-align:center; padding:80px 0; }

  /* ── 配方卡弹窗 / 选择浮条 ── */
  dialog { margin:auto; width:min(780px,92vw); max-height:86vh; background:var(--dlg); color:var(--dlg-txt);
    border:1px solid var(--dlg-line); border-radius:16px; padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.65); }
  .dlg-head { display:flex; justify-content:space-between; align-items:center; padding:16px 22px;
    border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--dlg); }
  .dlg-head button { border:1px solid var(--btn-line); background:var(--btn); color:var(--btn-txt); border-radius:8px;
    padding:6px 16px; cursor:pointer; font-family:inherit; }
  .dlg-body { padding:10px 22px 26px; overflow:auto; font-size:14px; line-height:1.7; }
  .dlg-body h3 { margin:18px 0 6px; font-size:15px; color:var(--txt); }
  .dlg-body table { border-collapse:collapse; margin:8px 0; width:100%; font-size:13px; }
  .dlg-body th,.dlg-body td { border:1px solid var(--td-line); padding:6px 10px; text-align:left; }
  .dlg-body th { background:var(--th); }
  .dlg-body ul { padding-left:20px; margin:6px 0; }
  .dlg-body code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:12px; }
  .dlg-body p { margin:6px 0; }
  #selbar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); display:none; align-items:center;
    gap:12px; background:var(--sel); border:1px solid var(--sel-line); border-radius:14px; padding:10px 16px;
    box-shadow:0 10px 40px var(--shadow); z-index:50; }
  #selbar.show { display:flex; }
  #selbar .names { max-width:52vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:12px; color:var(--p0-txt); font-family:Menlo,monospace; }
  #selbar button { font-size:13px; padding:7px 14px; border-radius:8px; border:1px solid var(--btn-line);
    background:var(--btn); color:var(--txt); cursor:pointer; font-family:inherit; }
  #selbar button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
</style>
</head>
<body>
<div class="topbar">
  <h1>video-talkcraft <span class="sub" id="h1sub">· 口播动效库</span></h1>
  <span class="tb-spacer"></span>
  <div class="follow">
    <button class="tbtn" id="followBtn">关注作者 ▾</button>
    <div class="menu"><div class="menu-in">
      <a id="fDouyin" href="https://www.douyin.com/user/MS4wLjABAAAAK1pkjBxilk2Oi_9h_vFyD-lTAu9CTlvhmOtkosDvvxg" target="_blank" rel="noopener">抖音</a>
      <a id="fXhs" href="https://xhslink.cn/m/At9iP2d5C1V" target="_blank" rel="noopener">小红书</a>
      <a id="fX" href="https://x.com/VincentWei93" target="_blank" rel="noopener">X</a>
    </div></div>
  </div>
  <a class="tbtn" id="starBtn" href="https://github.com/Vincentwei1021/video-talkcraft" target="_blank" rel="noopener">★ Star</a>
  <button class="tbtn" id="themeBtn" title="切换深/浅色">🌙</button>
  <button class="tbtn" id="langBtn" title="Switch language">EN</button>
</div>
<div class="tabs">
  <div class="cats" id="cats"></div>
  <span class="spacer"></span>
  <div class="search"><input id="q" placeholder="搜索动效名称或关键词"></div>
</div>
<div class="hero" id="hero"></div>
<div class="strip-wrap"><div class="strip" id="strip"></div></div>
<div id="sections"></div>
<dialog id="dlg">
  <div class="dlg-head"><strong id="dlgTitle"></strong><button id="dlgClose" onclick="dlg.close()">关闭</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>
<div id="selbar">
  <span id="selcount" style="font-size:13px"></span>
  <span class="names" id="selnames"></span>
  <button class="primary" id="copySel">复制名字</button>
  <button id="clearSel">清空</button>
</div>
<script src="../demos/_lib/sfx-samples.js"></script>
<script src="../demos/_lib/sfx.js"></script>
<script>
/* 声音代播：file:// 下 hero iframe 是 opaque origin，拿不到 autoplay 委托，
   iframe 里的 sfx 引擎会把 cue 经 postMessage 转发到这里，用父页的
   AudioContext 播（用户点卡片/切换就是父页手势，一次解锁全程有效）。 */
window.addEventListener("message", (e) => {
  const m = e.data && e.data.__sfx;
  if (m && window.SFX) window.SFX.play(m.name, m.opts);
});

const BODIES = {"focus-dim-spotlight":"<h3>意图</h3><p>表格/清单/多卡版面上同时有十几个数字，口播念到第三行时观众还在第一行——聚焦压暗把 &quot;视觉权重&quot;整块搬到目标上：目标不动、不放大、不加色，<strong>只是周围全暗下去</strong>，观众 无从选择只能看那一行。它和荧光笔的分工是尺度：荧光笔在<strong>一行文字内</strong>画重点（笔触、 色块、行级），本卡在<strong>版面尺度</strong>上切焦点（一整行 / 一张卡 / 一个区域，靠明度差而非涂色）。 命门：<strong>目标本身零改动</strong>（一压暗就想给目标加放大加换色，三件套一起上就成了 PPT 强调预设， 本卡的力量全在&quot;其余变暗&quot;这一个动作上）、<strong>焦点是滑过去的不是切过去的</strong>（0.2s 位移让 观众眼睛跟得上&quot;从上一行到这一行&quot;，硬切等于每次重新找目标）、<strong>讲完必须整体恢复</strong> （暗着不收观众会以为画面就是这么暗的，聚焦感只在&quot;暗-亮&quot;的对照里成立）。</p><h3>动效核心</h3><ul><li>结构：一个<strong>聚光窗口</strong>元素浮在内容之上，用超大 spread 的 <code>box-shadow: 0 0 0 9999px rgba(0,0,0,dimTo)</code></li></ul><p>  把窗口以外的整屏压暗（容器 <code>overflow:hidden</code> 裁掉溢出）；移动/缩放这个窗口 = 焦点跳转，   非目标区暗度自动跟着换。目标本身<strong>不改任何属性</strong></p><ul><li>目标矩形运行时测量（<code>getBoundingClientRect</code> 除以外壳缩放系数换回设计坐标）：换目标只换选择器，不改坐标</li><li>通道①<strong>压暗</strong>：非目标区 <code>dimTo</code> 0.35~0.45（白底）暗度蒙层 0.3s <code>power2.out</code> 缓入</li><li>通道②<strong>模糊</strong>：整页 <code>filter: blur(8px)</code>，仅目标区清晰（目标层不带 filter 或用 backdrop 反遮罩）；</li></ul><p>  焦点切换时清晰区/模糊区互换 0.2s——比压暗更&quot;景深&quot;，代价是文字模糊态不可读、单目标场景才用</p><ul><li>通道③<strong>描边</strong>：目标被圆角发光框圈住——<code>opacity 0→1</code> + <code>scale 0.95→1</code> 撑开，0.3s <code>power3.out</code>，</li></ul><p>  外挂一层 <code>box-shadow</code> 辉光单独做 <code>sine.inOut</code> yoyo 微脉动（半周期 1.6s，防死、不是闪烁）；其余仍压暗</p><ul><li>三通道<strong>任选/可叠</strong>：①是底座，③叠在①上（demo 主演）；②与①是替代关系（同时上会糊成一团）</li><li>焦点跳转：窗口与描边框<strong>同一条 tween</strong> 同步位移+改尺寸，0.2s <code>power2.out</code>，可连续 N 次</li><li>尺度可变：同一个窗口从&quot;一行&quot;形变到&quot;整张卡&quot;只是改 width/height（0.45s <code>power2.out</code>）——</li></ul><p>  焦点从局部放大到版面，用来收束&quot;四行放在一起看&quot;的结论句</p><ul><li>收尾：蒙层 <code>opacity → 0</code> 0.4s <code>power2.out</code> 整体恢复；描边先于蒙层 0.25s 退场</li><li>字幕/花字层在蒙层<strong>之上</strong>（<code>z-index</code> 高于聚光窗口）——字幕是叙述层，不参与被压暗</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>dimTo</code></td><td>0.40（白底）/ 0.20~0.25（深底）</td><td>非目标区暗度；&lt;0.25 在白底上几乎看不出压暗、强调失效，&gt;0.55 上下文变成一整块黑、观众想回看读不到</td></tr><tr><td><code>dimIn</code></td><td>0.30s</td><td>蒙层缓入；&lt;0.15s 读作切黑闪一下（像掉帧），&gt;0.5s 焦点来得比语音晚、跟不上台词</td></tr><tr><td><code>jump</code></td><td>0.20s</td><td>焦点跳到下一目标；0（硬切）观众每次要重新找目标，&gt;0.4s 焦点在半路时台词已经念完了</td></tr><tr><td><code>hold</code></td><td>1.0~1.5s</td><td>每目标停留，对齐这一行的台词；&lt;0.7s 只够扫一眼读不到数字，&gt;2.5s 该切下一卡了</td></tr><tr><td><code>ringFrom</code></td><td>0.95</td><td>描边撑开的起始倍数；1.0 读作贴上去的静态框，&lt;0.85 变成弹框入场、抢戏</td></tr><tr><td><code>glowHalf</code></td><td>1.6s</td><td>辉光脉动半周期；&lt;0.8s 读作报警闪烁，脉动幅度为 0 则长停留时画面死</td></tr><tr><td><code>blurPx</code>（通道②）</td><td>8px</td><td>非目标区模糊半径；&lt;5px 读作没对上焦的失误，&gt;14px 上下文彻底消失、失去&quot;同一张表&quot;的连续感</td></tr><tr><td><code>restore</code></td><td>0.40s</td><td>整体恢复；不恢复观众会把压暗当成画面底色，聚焦感事后归零</td></tr></table><h3>已知坑</h3><ul><li>压暗的同时给目标加放大 / 换色 / 加投影——三件套一起上就是剪映&quot;强调&quot;预设，本卡的克制感尽失；<strong>目标零改动</strong>是本体纪律。</li><li>焦点硬切（<code>jump = 0</code>）——每次跳转观众都要重新在版面里找目标，等于每行都从头聚焦一次。</li><li>蒙层压得太黑（&gt;0.55）——上下文被&quot;删掉&quot;，观众失去对照能力，反而想回看却读不到（同 highlighter-sweep 的 <code>dimTo</code> 坑）。</li><li>讲完不恢复——暗态成了新的常态，下一次聚焦没有对照、读不出&quot;这里亮了&quot;。</li><li>字幕/花字被一起压暗——叙述层跟着变灰，观众以为是渲染错误；字幕必须在蒙层之上。</li><li>通道②模糊用在<strong>多目标连续跳转</strong>上——每次跳转整页 blur 重算，观众眼睛在&quot;糊-清&quot;之间反复重新对焦，几次就晕；连续跳转用①+③。</li><li>发光描边用纯色硬框无辉光、或辉光做成闪烁——前者读作表单 focus 状态（浏览器 outline 感），后者读作报警；要的是连续呼吸的&quot;点亮&quot;。</li><li>描边框贴着目标边缘零留白——框压在文字/卡片边线上读作选中态；左右内缩到内容盒、上下外扩 3px 左右。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/focus-dim-spotlight/index.html。换目标改 <code>.trow.data</code> 选择器（矩形运行时测量，坐标不用改）；换聚焦几何改 <code>focusInsetX</code> / <code>focusPadY</code>；节奏全在顶部 <code>CONFIG</code>（<code>dimIn</code> / <code>jump</code> / <code>hold</code> / <code>restore</code>）；焦点色一个 CSS 变量 <code>--focus</code>；暗度 <code>dimTo</code> 直接写进 <code>.spot</code> 的 <code>box-shadow</code> spread 色值。核心可摘走部分 = <code>CONFIG</code> + <code>DemoShell.register</code> 回调体（含 <code>rectIn</code> / <code>focusBox</code> 两个测量函数）。通道②改成给内容容器上 <code>filter: blur()</code> 并把目标行提到未模糊的同位克隆层。</li><li>Remotion 移植：聚光窗口用一个绝对定位 div，<code>boxShadow: \\</code>0 0 0 9999px rgba(0,0,0,${interpolate(frame,[d,d+dimInF],[0,dimTo])})\\`<code>（外层 </code>overflow:'hidden'<code>）；焦点跳转把 </code>left/top/width/height<code> 各自 </code>interpolate(frame, [t,t+jumpF], [from, to], {easing: Easing.out(Easing.quad)})<code>，目标矩形在构建时静态算好（Remotion 无外壳缩放，直接写设计坐标）；描边 </code>scale: interpolate(..., [0.95,1], {easing: Easing.out(Easing.cubic)})<code>；辉光脉动 </code>opacity: 0.35 + 0.65*(0.5+0.5*Math.sin(frame/fps*Math.PI/glowHalf))<code>；通道②用 </code>filter: \\<code>blur(${interpolate(...)}px)\\</code>` 作用在内容 Sequence 上。</li><li>剪辑软件对应物：剪映——新建黑色色块铺满画面、不透明度 40%，加&quot;蒙版→矩形&quot;并<strong>反转蒙版</strong>，蒙版位置/大小打关键帧即焦点跳转；发光框用&quot;边框&quot;贴纸或矩形描边素材 + 发光滤镜；AE——黑色 Solid + Mask（Mode 设 Subtract）、Mask Path 关键帧移动，或 Set Matte；发光框用 Shape Layer 描边 + Glow 效果，Opacity 表达式做呼吸；通道②用 Gaussian Blur + 反转蒙版的调整图层；CapCut——同剪映的 inverted mask keyframe 做法。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：聚光窗口以外整屏压暗至 <code>dimTo</code>（0.3s 缓入 <code>power2.out</code>）；焦点在目标间<strong>同步位移+改尺寸</strong>跳转（0.2s <code>power2.out</code>，可连续 N 次）；目标发光描边亮起（<code>opacity 0→1</code> + <code>scale 0.95→1</code>、0.3s <code>power3.out</code>）与辉光 <code>sine.inOut</code> 微脉动（半周期 1.6s）；焦点从&quot;行&quot;形变到&quot;整卡&quot;的尺度切换（0.45s）；讲完整体恢复（0.4s，描边先于蒙层退场）；三通道（压暗 / 模糊 / 描边）的组合纪律（①是底座、③叠①、②替代①）；<strong>目标本身零改动</strong>与字幕层不被压暗这两条硬约束。</li><li>不属于本卡的：demo 里的灰阶数据表卡（排版、字号、假数据）、角标主持人（数字人是演示语境素材）、示例台词与字幕切换、右上角&quot;通道①/③&quot;注记、<code>--focus: #ffb020</code> 这个具体焦点色、卡片圆角与边框样式。</li><li>迁移接口：<code>dimTo</code> <strong>随底色明度取值</strong>（白底 0.4 / 深底 0.2~0.25，深底压暗过头会糊成一片黑）；焦点色一个 token <code>--focus</code>（深底换高明度色）；目标 = 任意 DOM 元素/坐标矩形（运行时测量，换内容不改代码）；<code>jump</code>/<code>hold</code> 对齐词级语音时刻；换尺寸时描边线宽与圆角、<code>focusInsetX</code>/<code>focusPadY</code> 按画幅等比缩放，<code>9999px</code> spread 无需改（只要容器裁剪）；通道②只需把 <code>blurPx</code> 换到内容容器的 <code>filter</code> 上，时序原样复用。</li><li>底色要求：白底即可（压暗蒙层在浅底对比最强，是本卡最自然的场景）。深底截图/终端画面同样成立，但 <code>dimTo</code> 必须减半、焦点色换高明度值，否则暗区与暗底并成一块、焦点无处可寻。</li></ul>","hand-drawn-ellipse":"<h3>意图</h3><p>&quot;圈起来&quot;是所有强调手势里最像<strong>人</strong>的一个——它有明确的笔顺、有起点终点、必然画不圆。 本库的 <code>scribble-annotation</code> 已经有圈，但它的语境是<strong>标注素材</strong>（圈截图里的价格、圈按钮）， 一次画三笔，圈只是其中一种笔；这张卡把圈单独拆出来，语境换成<strong>圈口播里的一个短语</strong>， 并且加了一件 scribble-annotation 没有的事：<strong>圈完之后被圈的短语自己动一下</strong>。</p><p>那一拍 punch 是本卡的核心信息。圈本身只是&quot;我指这里&quot;，punch 是&quot;而且它很重要&quot;—— 两个信息分两拍给，观众的注意力先被圈引到位置上，再被 punch 确认强度。 同时给（圈和 punch 一起）就乱了：读作&quot;字被圈撞了一下&quot;，动因反了。</p><p>命门两条：① <strong>必须过头交叉</strong>（画到 1.08 圈、每绕一圈半径外扩 5.5%，尾巴落在起笔外侧）。 闭合成完美椭圆一眼是矢量图形——手画的圈闭不上，这是常识级的真实性判据； ② <strong>圈画完才 punch</strong>（中间留 0.06s 呼吸）。同时发生就少了那个先后关系。</p><h3>动效核心</h3><ul><li><strong>圈层 = 盖在文字上的全屏 SVG</strong>（<code>viewBox=&quot;0 0 960 540&quot;</code>、<code>pointer-events:none</code>），</li></ul><p>  <code>fill:none</code> + <code>stroke-linecap/linejoin: round</code></p><ul><li><strong>坐标绑定被圈元素，不写死</strong>：目标 DOM 打 <code>data-ink=&quot;key&quot;</code>，运行时用 canvas <code>measureText</code></li></ul><p>  量它的<strong>墨迹盒</strong>（<code>actualBoundingBoxAscent/Descent</code> + baseline，不是行盒——行盒上下带   line-height 留白，照行盒画圈会整体偏高一截）。圈心 = 墨迹中心，半径 = 半宽/半高 + pad</p><ul><li><strong>歪椭圆的四个不完美</strong>（手作感全在这里，一个都不能少）：</li></ul><p>  - <code>turns: 1.08</code> —— 画 1.08 圈，尾巴过头 8%（命门①）   - <code>grow: 0.055</code> —— 每绕一圈半径外扩 5.5%，让尾巴落在起笔<strong>外侧</strong>而不是压住它   - <code>tilt: -3.5°</code> —— 整体静态倾斜（不是动效，是形状属性）   - <code>wobble: 3.4</code> —— 半径带确定性正弦起伏 ±3.4%     （<code>0.62·sin(3.7a+seed) + 0.38·sin(9.1a+seed·2.3)</code>，<strong>不用 <code>Math.random</code></strong>）</p><ul><li><strong>长短轴比 ≈3.4:1</strong>（由文字盒决定：<code>padX: 26</code> / <code>padY: 15</code>）。<strong>横向 pad 必须比直觉大一档</strong>——</li></ul><p>  椭圆在字高处腰已经收窄，padX &lt;16 时圈的左右腰会切进首末字</p><ul><li><strong>逆时针一笔</strong>（<code>dir: -1</code>、<code>startAngle: -145°</code> ≈ 左上角起笔）：右手画圈的自然方向</li><li><strong>单条 path、恒定线宽 3.2px</strong>（<code>stroke-linecap: round</code>）：<strong>不模拟笔压</strong>——</li></ul><p>  多层叠描/粗细渐变那套（起笔粗收笔细）实测线宽忽粗忽细，比匀速线还难看。   手作感全部交给<strong>形状层</strong>（1.08 圈过头交叉 + 逐圈外扩 + 静态倾斜 + 半径起伏），   笔宽不参与表演</p><ul><li><strong>时序</strong>：<code>dashoffset</code> 全长→0，0.5s <code>power2.out</code>（起笔快收笔缓；匀速一眼假）</li></ul><p>  → 呼吸 0.06s → 短语 <code>scale 1.06 → 1</code>，0.22s <code>power3.out</code>（<code>transform-origin: 50% 55%</code>）</p><ul><li><strong>被圈短语必须是独立的 <code>inline-block</code></strong>：punch 只能作用在它自己身上，不能带动整行重排</li><li><strong>画完保持干净静置</strong>：本库定版<strong>不做 line boil / 定格抖动</strong>（design-language.md §4）</li><li><strong>层级</strong>：白舞台 → 文字（两行，上行 dim 实色）→ 圈 SVG 层 → 主持人占位（右 30%）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>turns</code></td><td>1.08</td><td><strong>本卡第一命门</strong>；=1.0 圈精确闭合，一眼是矢量椭圆工具画的；&gt;1.3 绕两圈读作&quot;划掉/否定&quot;（语义相反）；1.05~1.15 是&quot;手画的一圈&quot;的甜点</td></tr><tr><td><code>grow</code></td><td>0.055</td><td>每圈半径外扩比；=0 尾巴压在起笔上（看不出过头，反而像画粗了）；&gt;0.12 尾巴甩得太远读作两个不同心的圈</td></tr><tr><td><code>punchGap</code></td><td>0.06s</td><td><strong>本卡第二命门</strong>；=0 圈与 punch 同时发生，读作&quot;字被圈撞了一下&quot;；&gt;0.25s 两件事脱钩，punch 读作独立的第二次强调</td></tr><tr><td><code>punchScale</code></td><td>1.06</td><td>punch 幅度；&lt;1.03 看不出来（那不如不做）；&gt;1.12 读作弹跳，本卡是&quot;重音确认&quot;不是&quot;弹出&quot;</td></tr><tr><td><code>padX</code> / <code>padY</code></td><td>26 / 15</td><td>圈的松紧；<strong>padX &lt;16 圈的左右腰会切进首末字</strong>（椭圆在字高处已收窄）；padX &gt;40 圈太松读作&quot;框住一片区域&quot;不是&quot;圈这几个字&quot;</td></tr><tr><td><code>tilt</code></td><td>−3.5°</td><td>静态倾角（形状属性，全程不变）；=0 太正读作图形；&gt;8° 读作贴歪了</td></tr><tr><td><code>wobble</code></td><td>3.4（半径 ±3.4%）</td><td>起伏量；=0 是完美椭圆；&gt;7 圈的轮廓开始起波浪，读作抖手不是画圈</td></tr><tr><td><code>startAngle</code> / <code>dir</code></td><td>−145° / −1</td><td>起笔角度与方向；起笔放在正右（0°）或正下（90°）读作机器起点；左上角逆时针是右手最自然的画圈起手</td></tr><tr><td><code>draw</code></td><td>0.5s</td><td>画圈耗时；&lt;0.3s 看不出笔顺方向（圈&quot;闪&quot;出来）；&gt;0.8s 观众在等一个圈画完</td></tr><tr><td><code>ease</code></td><td>power2.out</td><td>起笔快收笔缓；<code>none</code>（匀速）一眼读作 loading 圈；<code>power2.inOut</code> 也可（更&quot;慢慢收笔&quot;）</td></tr><tr><td><code>width</code></td><td>3.2px（3~3.5）</td><td>圈的恒定线宽（全程一个值，<strong>不做粗细变化</strong>）；&lt;2.5px 读作 UI 描边（没有笔的墨量），&gt;4.5px 粗圈会咬到字</td></tr><tr><td><code>hold</code></td><td>1.8s</td><td>收尾定格，被圈的短语是本卡的落点，按字数给（每字约 0.3s）</td></tr></table><h3>已知坑</h3><ul><li>圈精确闭合——最致命的一条。闭合的椭圆一眼是矢量图形，&quot;有人画了这个圈&quot;这件事直接消失。</li></ul><p>  必须过头 5%~15% 且尾巴落在起笔外侧（靠 <code>grow</code>）。</p><ul><li>圈和 punch 同时发生——先后关系是本卡的第二个信息。同时给读作&quot;字被圈撞了一下&quot;，动因反了。</li><li>用 <code>&lt;ellipse&gt;</code> 元素 + <code>stroke-dasharray</code> 描画——那是完美椭圆，<code>turns</code>/<code>wobble</code>/<code>grow</code></li></ul><p>  三件事一件都做不出来。必须用采样点算出来的 path。</p><ul><li><code>padX</code> 照 <code>padY</code> 抄同一个值——椭圆在字高处腰已收窄，等 pad 时圈的左右腰一定切进首末字。</li></ul><p>  横向 pad 要比纵向大 60%~80%。</p><ul><li>照行盒（<code>getBoundingClientRect()</code>）算圈心——27px 字的行盒比字形高十几 px，圈会整体偏上，</li></ul><p>  下沿从字中间穿过去。必须用 canvas <code>measureText</code> 的墨迹盒。</p><ul><li>被圈短语没有单独包 <code>inline-block</code> 就 punch——scale 会带动整行（甚至触发重排），</li></ul><p>  圈和字瞬间错位。</p><ul><li><strong>模拟笔压（起笔粗收笔细）——2026-08-25 用户定版删除</strong>。不管用多层 dasharray 叠描</li></ul><p>  还是 <code>stroke-width</code> tween，落到静帧上都是<strong>线宽忽粗忽细</strong>，读作&quot;画歪了/描边没对齐&quot;，   比恒定线宽的匀圈还难看。本卡的手作感只做在<strong>形状</strong>上（过头交叉 + 逐圈外扩 + 倾斜 + 半径起伏），   笔宽全程恒定 3.2px。</p><ul><li>匀速描画——读作 loading 圈，不是人手。（描画的快慢曲线要保留，只是<strong>线宽</strong>不许变。）</li><li>画完加 line boil / 定格抖动——本库定版禁项（design-language.md §4）。</li><li>行距按正常正文给（1.9 以下）——圈的上下沿外扩 <code>padY</code>，行距太密圈会咬到上一行的字。</li></ul><p>  用这张卡的那一行需要 2.3+ 的行距。</p><ul><li>圈一整句——圈的语义是&quot;就这几个字&quot;。圈住一整行读作&quot;框选一段区域&quot;，</li></ul><p>  那是 <code>outline-box-title</code>（机器画的框）的语言，两种别混。</p><h3>复用指引</h3><ul><li>HTML/GSAP：demos/hand-drawn-ellipse/index.html。<strong>换圈的对象不用改坐标</strong>：给目标元素加</li></ul><p>  <code>data-ink=&quot;key&quot;</code>（几何全部从 DOM 量出来，改文案/改字号圈自动跟着走）。   松紧调 <code>padX/padY</code>，形状调 <code>turns/grow/tilt/wobble/seed</code>，节奏调 <code>draw/punchGap/punchDur</code>，   线宽改 <code>width</code>（恒定值），换色改 <code>color</code>。核心逻辑 = <code>CONFIG</code> + <code>inkBoxOf()</code> +   <code>ellipsePath()</code> + <code>smooth()</code> + <code>inkStroke()</code>，可整段摘走；<code>inkStroke()</code> 与   <code>scribble-annotation</code> 的 <code>drawStroke()</code> 等价（都是单条 path 恒定线宽的 dasharray 描画）。</p><ul><li>Remotion 移植：<code>d</code> 用同一套 <code>ellipsePath()</code> 在组件外预生成（纯函数、无随机 → 帧间完全一致）。</li></ul><p>  描画用 <code>@remotion/paths</code> 的 <code>getLength()</code> 拿 <code>L</code>，单条 path：   <code>strokeWidth = 3.2</code>（常量）、<code>strokeDasharray = L</code>、<code>strokeDashoffset = L·(1 − p)</code>，   <code>p = interpolate(frame, [s, s+drawF], [0,1], {easing: Easing.out(Easing.quad), extrapolateLeft:&quot;clamp&quot;, extrapolateRight:&quot;clamp&quot;})</code>。   punch 用第二段 <code>interpolate(frame, [s+drawF+gapF, s+drawF+gapF+punchF], [1.06, 1], {easing: Easing.out(Easing.cubic)})</code> 驱动 <code>scale</code>。</p><ul><li>剪辑软件对应物：AE = 钢笔画一个<strong>故意不闭合、尾巴过头</strong>的椭圆路径（形状图层）+</li></ul><p>  <code>修剪路径</code>(Trim Paths) 的 End 0→100%（0.5s，<code>Easy Ease Out</code>）；描边宽度固定 3.2px   （<strong>不要</strong>做锥形描边/多层叠描去模拟笔压）；   punch 在文字层的 <code>缩放</code> 打 1.06→1 两键，起点比描画结束晚 2 帧。   剪映/CapCut 没有描画通道：用&quot;贴纸 → 手绘圈/涂鸦圈&quot;里<strong>尾巴过头</strong>的那款（选静置无抖动帧）   摆到短语上，入场用&quot;放大&quot;（缩放 0.9→1，0.4s）近似，再给文字层加一个&quot;缩放&quot;关键帧做 punch。   <strong>不要用&quot;圆形蒙版 + 描边&quot;</strong>——那一定是完美椭圆。</p><ul><li>与本库同类卡的分工：<code>scribble-annotation</code> = 圈/线/箭头三笔串行标注<strong>素材里的位置</strong></li></ul><p>  （语境是&quot;跟你一起看这张图&quot;）；   <code>outline-box-title</code> = 机器画的圆角框（匀速 inOut、精确闭合，是&quot;框选&quot;不是&quot;手绘&quot;）；   <strong>本卡 = 单个短语的一笔手绘圈 + 圈完 punch</strong>（唯一带&quot;圈完确认&quot;两拍的强调卡）。   与 <code>outline-box-title</code> 是刻意的一对反例：<strong>同一个&quot;围起来&quot;的动作，手画 vs 机器画是两种语言</strong>，   一屏里只能用一种。手画的判据是<strong>形状不完美</strong>（过头交叉、歪、起伏），不是线宽变化。</p><h3>动效范围</h3><ul><li>属于本卡的：<strong>过头交叉</strong>这件事（<code>turns 1.08</code> + <code>grow 0.055</code> 让尾巴落在起笔外侧）——它是本卡真实性的全部来源；<strong>圈画完才 punch</strong> 的两拍时序（<code>punchGap 0.06s</code> 这个呼吸不能为 0）；<code>dashoffset</code> 全长→0、0.5s <code>power2.out</code> 的描画（起笔快收笔缓，匀速即失效）；<strong>单条 path + 恒定线宽 3.2px</strong>（<code>linecap round</code>）这条实现纪律——手作感只做在形状上，<strong>不许模拟笔压</strong>（粗细变化实测忽粗忽细，用户 2026-08-25 定版删除）；圈心绑定目标<strong>墨迹盒</strong>中心、半径 = 半宽/半高 + pad 且 <strong>padX 必须比 padY 大一档</strong>这条落位纪律；歪椭圆的四个不完美（1.08 圈 / 逐圈外扩 / 静态倾斜 −3.5° / 半径正弦起伏）与<strong>不用 <code>Math.random</code></strong> 的确定性要求；punch 幅度 1.06 与 <code>transform-origin: 50% 55%</code>（重心略偏下，落定时字不往上飘）；被圈短语独立 <code>inline-block</code> 这条实现纪律；画完保持干净静置——不做 line boil / 定格抖动；圈 SVG 层盖在文字之上、<code>pointer-events:none</code> 的层级关系。</li><li>不属于本卡的：demo 那两句「要求可以再高一点，但对自己 / 更松弛一点」的具体文案、28px 字号与 400/600 两档字重、上行用 dim 实色这个排版选择、橙 <code>#e8720c</code> 这个取值（参考图③同色系，换任何一个 accent 都成立）、白底舞台、右侧 30% 的主持人（数字人）占位、&quot;两行字落在左侧白区&quot;这个落位、2.4 的行距（那是为了给圈让地方的<strong>排版前提</strong>，不是动效）。</li><li>迁移接口：<code>color</code> 是唯一的颜色入口（同屏只能有它一个&quot;看这里&quot;色）；<code>padX/padY</code> 与 <code>width</code> 按画幅<strong>同比缩放</strong>（960 宽的值 ×2 用于 1080p），<code>wobble/grow/turns/tilt</code> 是<strong>比例/角度常量，换尺寸不要动</strong>；节奏 <code>draw/punchGap/punchDur/startDelay/hold</code> 与画幅无关，只跟语速走；换圈的对象只改 <code>data-ink</code>；目标不是 DOM（视频/图片素材上的字）时把 <code>inkBoxOf()</code> 换成手填 <code>{x, y, w, h, cx, cy}</code>，<code>ellipsePath()</code> 不用动。短语长度超过 8 字时把 <code>padX</code> 收到 18~20（长盒子的长短轴比已经够扁，不需要再加横向余量）。</li><li>底色要求：白底即可（马克笔橙压在白底上是本卡的原生语境）。深底上把 <code>color</code> 换成高亮度色（<code>#ff9f45</code> 级），并把 <code>width</code> 从 3.2 加到 3.8——深底吃掉细线的视觉重量，3.2px 的圈在深底上偏轻。</li></ul>","highlighter-sweep":"<h3>意图</h3><p>口播念一段引用时，观众不知道该看哪一行——荧光笔扫过 + 其余压暗，等于替观众划重点， 把&quot;听到的那句&quot;和&quot;看到的那句&quot;锁在一起。命门：<strong>色块不许盖字</strong>（multiply 或半透明，盖住字 等于涂掉证据）、<strong>扫速对齐朗读</strong>（0.4~0.8s，跟着语音走才像&quot;现场划&quot;而不是特效）、 <strong>必须压暗其余文字</strong>（只加高亮不减环境，强调失效一半）。</p><h3>动效核心</h3><ul><li>引用截图卡片先在屏（浅纸色 #f7f4ea 卡片 + 微倾斜 -0.4° + 深投影），全程 8s 线性极缓推近到 1.025 倍防呆滞</li><li>关键句包一层 <code>position:relative</code> 的 span，内部绝对定位色块：#FFE949、opacity 0.6、<code>mix-blend-mode:multiply</code></li><li>色块四角用不规则 border-radius（<code>12px 5px 10px 4px / 7px 12px 5px 10px</code>）模拟笔触，左右各溢出 6~8px</li><li>扫过：色块 <code>scaleX 0→1</code>，<code>transform-origin: left center</code>，0.6s，<code>power2.inOut</code>（起收笔略缓，匀速像 loading）</li><li>同帧：其余段落 opacity 1→0.55，0.45s，<code>power2.out</code></li><li>扫完：关键句整句 scale 1→1.03 + y -2px，0.3s，<code>power2.out</code>，origin 左侧——强调落定</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>startDelay</code></td><td>0.7s</td><td>卡片静置一拍等语音念到关键句；0 则像自动播放的 PPT，&gt;1.5s 观众开始自己乱读</td></tr><tr><td><code>sweep</code></td><td>0.6s</td><td>0.4~0.8 匹配朗读语速；&lt;0.3s 像渲染 bug，&gt;1s 观众读完了笔还没划完</td></tr><tr><td><code>dimTo</code></td><td>0.55</td><td>其余段落压暗到的透明度；&gt;0.7 强调不出来，&lt;0.4 像上下文被删掉、观众想去读反而读不到</td></tr><tr><td><code>liftScale</code></td><td>1.03</td><td>扫完的浮起倍数；&gt;1.08 会破行宽挤排版，1.0 则收尾没有&quot;落定&quot;感</td></tr><tr><td><code>kenburns</code></td><td>1.025</td><td>8s 推近终点倍数；&gt;1.06 明显在动会抢戏，1.0 静止长镜头显呆</td></tr></table><h3>已知坑</h3><ul><li>色块不透明或叠在文字上层不做 multiply——字被涂掉，一眼假（真荧光笔是透的）。</li><li>匀速或 &lt;0.3s 扫完——读作程序绘制/渲染故障，不是人手在划。</li><li>只加高亮不压暗其余文字——画面里所有行权重相同，等于没划重点。</li><li>色块四角规整直角——读作表格选中/文本选区，不是笔触；必须不规则圆角 + 左右微溢出。</li><li>高亮的不是完整语义句（半句/跨两行断开）——观众读不出&quot;这一句&quot;的完整性。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/highlighter-sweep/index.html。换文案改 <code>.quote-line</code> 各行文本，关键句放进 <code>.hl-wrap</code> 内（<code>.hl-block</code> 保留在最前）；换色改 <code>.hl-block</code> 的 <code>background: #FFE949</code> 与 <code>opacity: 0.6</code>（深色截图上可改 <code>mix-blend-mode</code> 为 <code>screen</code> 并换深色荧光）；节奏全在顶部 <code>CONFIG</code>（<code>startDelay</code> / <code>sweep</code> / <code>dimTo</code> / <code>liftScale</code> / <code>kenburns</code>）。</li><li>Remotion 移植：色块 <code>transform: scaleX(${interpolate(frame, [d, d+sweepF], [0, 1], {easing: Easing.inOut(Easing.quad), extrapolateRight: 'clamp'})})</code> + <code>transformOrigin: 'left center'</code>，容器 div 保留 <code>mixBlendMode: 'multiply'</code>；压暗用同起点的 opacity interpolate；Ken Burns 用 <code>interpolate(frame, [0, durationInFrames], [1, 1.025])</code> 线性；浮起接在 <code>d+sweepF</code> 帧之后 spring 或 quad-out。</li><li>剪辑软件对应物：剪映——黄色色块素材设混合模式&quot;正片叠底&quot;+ 蒙版&quot;线性&quot;关键帧从左扫到右（或贴纸搜&quot;荧光笔&quot;），其余区域盖半透明黑色块压暗；AE——黄色 Solid 设 Multiply 混合 + Linear Wipe 效果（或 scaleX 关键帧、锚点在左），配 Easy Ease；CapCut——&quot;highlight pen&quot; 贴纸或同样的 mask wipe 做法。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：荧光色块从关键句左端 scaleX 0→1 扫过（0.4~0.8s、power2.inOut、origin left、multiply 混合不盖字、不规则圆角笔触）；同帧其余文字压暗至 0.4~0.7 透明度（0.45s）；扫完整句 scale 1.03 + y −2px 浮起落定（0.3s）。三个动作与一个时序是本卡的全部。</li><li>不属于本卡的：引用卡片的排版/边框/字体字号、示例文案、演示里曾有的 Ken Burns 缓推（那属于镜头层，由全局系统提供）。</li><li>迁移接口：荧光色换 <code>background</code>（深底改 <code>mix-blend-mode: screen</code> + 高亮色）；扫速 <code>sweep</code> 对齐朗读时长；压暗程度 <code>dimTo</code> 随底色明度调；目标行的选择器与色块几何（left/right 内缩）按实际文字盒调整。</li><li>底色要求：白底即可（multiply 在浅底天然成立；深底需换 screen 混合并复核字的可读性）。</li></ul>","scribble-annotation":"<h3>意图</h3><p>口播提到素材里某个细节时，观众的视线需要被&quot;现场的一只手&quot;牵到那儿—— 印刷式高亮是排版，手绘线是动作，让人感到作者正在跟你一起看这张图。 命门：<strong>真实笔顺</strong>（一笔从起点画到终点，起收有快慢，匀速就是 loading 条）、</p><p><strong>线要粗且圆头</strong>（4px 以下没有马克笔的&quot;墨量感&quot;）。</p><h3>动效核心</h3><ul><li>标注层 = 盖在假截图上的全屏 SVG（<code>viewBox=&quot;0 0 960 540&quot;</code>，<code>pointer-events:none</code>），每笔一条 path，<code>fill:none</code>、<code>stroke-linecap/linejoin: round</code>、线宽 6px</li><li><strong>坐标绑定被标注元素，不写死</strong>（命门）：被标注的 DOM 打 <code>data-ink=&quot;xx&quot;</code>，运行时量它的盒子换算进 viewBox 再算 path——圈心 = 目标中心、下划线 y = 目标 baseline + 4px、箭尖 = 目标边缘外 8px。文字类目标要量<strong>墨迹盒</strong>（canvas <code>measureText</code> 的 <code>actualBoundingBoxAscent/Descent</code> + baseline），不是行盒：行盒上下带字体留白，照行盒画圈会整体偏高、下划线会飘出去 15px+</li><li>描画：<code>stroke-dasharray</code> = path 全长，<code>stroke-dashoffset</code> 从全长 tween 到 0——圈 0.55s <code>power2.inOut</code>、下划线 0.4s <code>power2.out</code>、箭头先杆（0.35s <code>power2.inOut</code>）后头（0.15s <code>power2.out</code>）两笔</li><li>画完保持静置。本库定版：<strong>不做 line boil / 定格抖动</strong>（用户偏好，见 design-language.md §4 运动 token 附注）。 笔感全部由 path 形状（手绘歪斜的圈、带弧度的线）与描画节奏承担</li><li>三个标注串行，间隔 0.55s（对应口播逐条点名），起播前截图先静置 0.5s</li><li>圈不是椭圆工具：path 绕目标画约 1.6 圈、起笔终笔交叉重叠；颜色红 #ff4d4d / 黄 #ffd23e，压在浅色截图上</li><li>重播语义：每次运行先 <code>layer.innerHTML = &quot;&quot;</code> 清掉上次墨迹再重建</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>strokeW</code></td><td>6</td><td>&lt;4 没有笔感、读作印刷细线；&gt;10 墨太肥会盖住被标注的字</td></tr><tr><td><code>gapBetween</code></td><td>0.55s</td><td>对齐口播逐条点名的呼吸；&lt;0.3s 三笔糊成一次动作；&gt;1s 观众在等</td></tr><tr><td><code>marks[].dur</code></td><td>圈 0.55 / 线 0.4 / 箭杆 0.35</td><td>&gt;0.8s 单笔像进度条；&lt;0.25s 看不出笔顺方向</td></tr><tr><td><code>headDur</code></td><td>0.15</td><td>箭头头是收笔快扫，拉长到 0.3s 以上箭头会&quot;迟到&quot;</td></tr><tr><td><code>marks[].ease</code></td><td>power2.inOut / power2.out</td><td>换成 none（匀速）一眼假；inOut 给圈&quot;起笔快收笔缓&quot;的手劲</td></tr><tr><td>圈 <code>padX/padY</code></td><td>17 / 17</td><td>椭圆外切一个扁长字块时横向 pad 要比直觉大一档（腰部在字高处已收窄）；padX 小于 12 圈的左右腰会切进首末字</td></tr><tr><td>圈 <code>turns</code> / <code>grow</code></td><td>1.6 / 0.05</td><td>turns &lt;1.5 是几何椭圆不是手画；grow=0 第二圈盖住第一圈、看不出绕了两圈</td></tr><tr><td>线 <code>baselineGap</code></td><td>4px</td><td>2~6 才像压着字；&gt;10 线飘在字与下一行之间、指向变模糊</td></tr><tr><td>线 <code>overhang</code></td><td>9px</td><td>两端略超出才像手划；=0 线短于文字读作&quot;没划完&quot;</td></tr><tr><td>箭 <code>tipGap</code></td><td>8px</td><td>5~10 是&quot;咬住不压住&quot;；=0 尖端戳进目标、&gt;20 指向变含糊</td></tr></table><h3>已知坑</h3><ul><li>匀速描画——没有起收快慢的线读作加载动画，不是人手。</li><li>线太细（&lt;4px）——没有马克笔墨量，读作 UI 描边。</li><li>圈画得太圆——正椭圆是几何工具画的，必须歪、必须绕 1.5 圈以上且首尾交叉才像手。</li><li><strong>标注没对准目标（最致命）</strong>——path 坐标手填死值，改一次文案/字号就偏出去：圈套错了词、下划线飘在行间、箭头指向空白。观众会先看&quot;这线怎么没对上&quot;，动效再好也白做。坐标一律从被标注元素量出来算。</li><li>拿行盒当文字位置——<code>getBoundingClientRect()</code> 含 line-height 留白（17px 字的行盒可比字形高 10px+），圈会整体偏上、下划线离字太远。要用字形墨迹盒 + baseline。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/scribble-annotation/index.html。<strong>换标注对象不用改坐标</strong>：给目标元素加 <code>data-ink=&quot;xx&quot;</code>，在 <code>CONFIG.marks</code> 里写 <code>{kind:&quot;circle&quot;|&quot;underline&quot;|&quot;arrow&quot;, target:&quot;xx&quot;}</code> 即可，位置自动跟着 DOM 走；微调用 <code>padX/padY</code>（圈松紧）、<code>baselineGap/overhang</code>（线贴合）、<code>side/tipGap/fromDX/fromDY/bow</code>（箭头从哪来、指哪条边）。换色改 <code>marks[].color</code>，节奏改 <code>dur</code>/<code>gapBetween</code>。手抖用确定性函数（<code>sin</code> 组合 + <code>seed</code>）不用 <code>Math.random()</code>——重播形状一致，也便于逐帧渲染。核心逻辑 = <code>CONFIG</code> + <code>boxOf/inkBoxOf</code> + <code>circlePath/underlinePath/arrowPaths</code> + <code>smooth()</code> + <code>drawStroke()</code>，可整体摘走。</li><li>Remotion 移植：用 <code>@remotion/paths</code> 的 <code>evolvePath(progress, d)</code> 拿 <code>strokeDasharray/strokeDashoffset</code>，progress = <code>interpolate(frame, [start, start+durInFrames], [0,1], {easing: Easing.inOut(Easing.quad)})</code>；三笔的 start 帧按 gapBetween 换算错开。</li><li>（实测变体）序号点名：要一次点名 5 项时不逐笔画，而是 5 根手绘箭头呈扇形<strong>整组淡入</strong>，数字 1-5 再在各箭头尾部逐个弹入（0.2s 间隔）——描画通道让给数字弹入通道，避免 5 笔描画吃掉 3 秒。见 TheAIScaler（Apm_oCzPEQs）。</li><li>（实测变体）红笔斜划否定（a2iG5GkM8KE）：一笔粗红斜线快速划过要否定的词/选项，是&quot;划掉&quot;不是&quot;圈出&quot;，语义相反、笔速更快（0.2s 级）。</li><li>（实测变体）荧光涂抹划除替换（i2fFSAZb5HM）：荧光笔粗涂抹盖住旧词，同帧新词在涂抹上方压入——把&quot;改口/纠正&quot;做成可见动作；涂抹保持静置，仍不做 line boil。</li><li>剪辑软件对应物：AE = 形状图层&quot;修剪路径&quot;(Trim Paths) 关键帧描画；剪映/CapCut 没有描画通道，用&quot;贴纸→手绘/涂鸦&quot;类圈注贴纸摆到目标上（选无抖动帧的静置款），或用&quot;画笔&quot;素材包替代。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<strong>标注几何与被标注目标的绑定关系</strong>（圈心=目标墨迹中心且半径外扩、下划线=baseline 下 2~6px 且两端略超出、箭尖=目标边缘外 5~10px）——&quot;标得准&quot;是本卡的语义，不是实现细节；每笔 <code>stroke-dasharray</code> = path 全长、<code>stroke-dashoffset</code> 全长→0 的描画（圈 0.55s power2.inOut、下划线 0.4s power2.out、箭头杆 0.35s power2.inOut + 头 0.15s power2.out）；<strong>起收有快慢</strong>的缓动纪律（匀速即读作 loading 条）；箭头先杆后头的两笔笔顺；三笔串行、间隔 0.55s 对齐口播逐条点名；起播前素材静置 0.5s；画完保持干净静置——<strong>不做 line boil / 定格抖动</strong>（本库定版禁项）；手作感由 path 形状本身承担（圈绕 1.6 圈、歪斜、首尾交叉，线带弧度）。标注层盖在素材之上、<code>pointer-events:none</code> 的层级关系也属于本卡。</li><li>不属于本卡的：假商品页截图占位（文案、价格、按钮、线框）、标哪几个元素（那是素材侧的事）、标注色 #ff4d4d / #ffd23e 的具体取值、截图的倾斜与投影（已移除，属于风格）。</li><li>迁移接口：<code>strokeW</code> 按画幅缩放（960 宽用 6px，1080p 上翻倍），<code>gapBetween</code>/<code>marks[].dur</code>/<code>headDur</code> 定节奏；换标注对象改 <code>data-ink</code> + <code>marks[].target</code>（坐标自动跟随，不需要重算 path）；<code>padX/padY</code>、<code>baselineGap</code>、<code>overhang</code>、<code>tipGap</code> 这几个像素量与 <code>strokeW</code> 同比缩放；换色改 <code>marks[].color</code>（浅底用红/黄，深底换亮色系）。目标不是 DOM（视频/图片素材）时，把 <code>boxOf()</code> 换成手填目标矩形，下游几何函数不用改。</li><li>底色要求：白底即可（马克笔色压在浅底上是本卡的原生语境）。深底上需把标注色换成高亮度色系，否则粗线糊进背景。</li></ul>","callout-line-label":"<h3>意图</h3><p>口播说&quot;真正值钱的是这两处&quot;时，观众的眼睛需要被牵到画面的具体位置——callout 把&quot;用手指&quot;翻译成三拍因果：点亮起（在哪）→ 线生长（往哪看）→ 标签揭示（是什么）。 命门：<strong>三拍必须严格串行</strong>（同时出现就没有引导视线的因果感）；<strong>折线拐点只用 45° 或水平</strong>（工程制图的秩序感，斜率随意像草图）；<strong>标签永远最后出现</strong>（答案不能比手指先到）。</p><h3>动效核心</h3><ul><li>圆点：SVG circle 落在目标上，scale 0→1，0.2s <code>back.out(2.2)</code>；同时一圈同色描边涟漪 scale 0.4→3.2、opacity 0.9→0，0.5s <code>power2.out</code></li><li>折线：SVG path（1~2 个拐点，全部 45° 或水平），<code>stroke-dasharray</code> = 总长，<code>stroke-dashoffset</code> 从总长→0 描画 0.4s <code>power2.out</code>；<strong>起点排在圆点 pop 结束之后</strong>（t0 + dotIn）</li><li>标签：HTML div 贴在线端，<code>clip-path: inset()</code> 从线端方向展开 0.25s <code>power3.out</code>（线从右来就 <code>inset(0 0 0 100%)</code> 起步），内部文字 opacity 再滞后 0.1s 淡入 0.2s</li><li>多标注：第二个 callout 整体延迟 0.8s，逐条对齐口播列举的节奏</li><li>退场：反向收回——标签先收（power2.in）、线回吸、点熄灭，三段按 out 比例分配（0.4/0.4/0.3），第二个标注再错 0.15s</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>dotR</code></td><td>7</td><td>圆点半径 px；&gt;10 像按钮，&lt;5 在视频压缩后看不见</td></tr><tr><td><code>dotIn</code></td><td>0.2s</td><td>圆点 pop 时长；&gt;0.35s 拖沓，&lt;0.1s 没有&quot;叮&quot;的落点感</td></tr><tr><td><code>lineDraw</code></td><td>0.4s</td><td>折线描画时长；&gt;0.6s 观众等得着急，&lt;0.25s 线&quot;闪现&quot;没有生长引导感</td></tr><tr><td><code>labelIn</code></td><td>0.25s</td><td>标签遮罩展开时长（文字固定再滞后 0.1s）；&gt;0.4s 读作幕布拉开，太慢</td></tr><tr><td><code>hold</code></td><td>1.6s</td><td>全部就位后的停留；对齐口播讲完该卖点的时长，讲得长就调大</td></tr><tr><td><code>out</code></td><td>0.5s</td><td>反向收回总时长（标签/线/点按 0.4/0.4/0.3 比例分配）；&gt;0.8s 退场喧宾夺主</td></tr><tr><td><code>stagger</code></td><td>0.8s</td><td>第二个标注的延迟；&lt;0.5s 两个标注抢视线，必须错峰逐条出现</td></tr><tr><td><code>color</code></td><td>#d8383a</td><td>点、涟漪、线同色的标注色（白底 demo 用红，深底可换高亮黄）；换品牌色时保持与底图高对比</td></tr><tr><td><code>callouts[]</code></td><td>target/points/label</td><td>target=圆点坐标；points=拐点+终点（只放 45°/水平位置）；label 的 x/y 贴线端、<code>from</code> 定展开方向（&quot;right&quot;=从右往左收拢的线）</td></tr></table><h3>已知坑</h3><ul><li>点、线、标签三段同时开始——没有&quot;点→线→字&quot;的因果链，眼睛不知道先看哪，一眼假。</li><li>折线斜率随手拉——拐点必须落在 45° 或水平网格上，否则像草稿涂鸦而不是标注。</li><li>标签先于线出现（最常见错序）——答案比手指先到，引出线沦为装饰。</li><li>标签压在目标本体上或线太短——标注必须把文字引到空白区，盖住本体等于白标。</li><li>用 opacity 渐显代替 clip-path 展开——标签失去&quot;从线端长出来&quot;的方向感，和线脱节。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/callout-line-label/index.html。换文案/换位置只改 <code>CONFIG.callouts</code>：<code>label.html</code> 换标签文字（<code>&lt;b&gt;</code>主句+<code>&lt;small&gt;</code>补充）、<code>target</code>/<code>points</code>/<code>label.x/y</code> 换坐标、<code>label.from</code> 换展开方向；<code>CONFIG.color</code> 换主题色；假手机是 <code>.phone</code> 一段纯 CSS，替换成自己的截图元素即可。入场基准延迟 0.6s 写死在 register 内的 <code>t0 = 0.6 + i * CONFIG.stagger</code>。核心动画即 <code>DemoShell.register</code> 回调整段，复制 CONFIG + 回调可直接摘走。</li><li>Remotion 移植：三拍用 <code>&lt;Sequence&gt;</code> 串接，<code>from</code> 按 <code>dotIn/lineDraw/labelIn × fps</code> 换算帧；折线描画用 <code>interpolate(frame, [0, lineDraw*fps], [len, 0])</code> 驱动 <code>strokeDashoffset</code>（<code>getTotalLength()</code> 需在 <code>useEffect</code>/<code>useLayoutEffect</code> 里量或预先算好写死）；圆点用 <code>spring({frame, config:{damping:10}})</code> 出 back.out 的过冲；标签用 <code>clipPath: inset(0 ${interpolate(...)}% 0 0)</code> 插值，文字 opacity 延迟 3 帧。</li><li>剪辑软件对应物：AE 里即 &quot;Call-Out Titles&quot; 类模板，自建 = 形状图层折线加&quot;修剪路径&quot;（Trim Paths）+ 文本层矩形蒙版位移揭示；剪映用贴纸搜&quot;标注/指示线&quot;或线条生长素材叠字幕入场&quot;擦除&quot;；CapCut 搜 callout/annotation 模板。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：圆点 scale 0→1 pop（0.2s、back.out(2.2)）+ 同色描边涟漪 scale 0.4→3.2 淡出（0.5s、power2.out）；折线 stroke-dashoffset 从总长→0 描画（0.4s、power2.out、拐点只走 45°/水平）；标签 clip-path inset 从线端方向展开（0.25s、power3.out）、内部文字再滞后 0.1s 淡入；三拍严格串行的时序（点→线→字，各段起点相接）；多标注整体错峰 0.8s；反向收回（标签 0.4 / 线 0.4 / 点 0.3 比例分段、power2.in）。</li><li>不属于本卡的：被标注的产品图占位（demo 里那部灰阶线框手机）、标签的排版/边框/字号、示例文案与坐标、字幕行。</li><li>迁移接口：<code>CONFIG.color</code> 一处换标注色（点/涟漪/线同色，需与底图高对比）；<code>CONFIG.callouts[]</code> 换 <code>target</code>（圆点坐标）/ <code>points</code>（拐点+终点，保持 45°/水平）/ <code>label.x,y</code> 与 <code>label.from</code>（展开方向）；时长四件套 <code>dotIn / lineDraw / labelIn / hold</code> 按语速整体乘同一系数缩放；<code>dotR</code>、<code>stroke-width</code> 随输出分辨率等比缩放。</li><li>底色要求：白底即可。标注色只需与底图有足够对比——深底把 <code>CONFIG.color</code> 换成高亮黄、标签底色改深色即可，动效时序不变。</li></ul>","converging-arrows":"<h3>意图</h3><p>箭头和圈的区别是<strong>方向</strong>。圈说&quot;就这几个字&quot;，箭头说&quot;从这里看过去，看那个字&quot;—— 它多了一个来向，所以能表达&quot;我把你的视线牵过来&quot;。两支从对角同时来的箭头再加一层意思： <strong>夹住</strong>。视线从两个方向被同时挤到中间那个词上，那是全库指向性最强的强调手段。</p><p>命门两条：① <strong>箭头先到、词后变</strong>。两支箭尖都到位的那一帧关键词才换成强调色。 反过来（词先动）读作&quot;这个词把箭头吸引过来了&quot;，主动方错了——本卡的语义是 <strong>口播者用箭头指给你</strong>，动因在箭头。 （<strong>关键词不做缩放</strong>，用户 2026-08-25 定版：箭头已经把视线送到位了， 字再放大缩小一下是第二个动效，抢箭头的戏；换色是状态确认，够了。） ② <strong>箭尖必须留白</strong>（离词 14~18px）。戳到字上就成了&quot;划掉/打叉&quot;，语义直接反向； 留白才是&quot;指向&quot;。这一条比看起来重要：戳字的箭头是最常见的廉价错法。</p><p>第三条不算命门但一样致命：<strong>两支错峰只有 0.06s</strong>（几乎同时）。错峰放大到 0.2s 以上， 读作&quot;两支箭依次飞来&quot;——那是两次强调，&quot;夹住&quot;的同时性没了。</p><h3>动效核心</h3><ul><li><strong>箭头层 = 盖在文字上的全屏 SVG</strong>（<code>viewBox=&quot;0 0 960 540&quot;</code>、<code>pointer-events:none</code>），</li></ul><p>  <code>fill:none</code> + <code>stroke-linecap/linejoin: round</code></p><ul><li><strong>坐标绑定关键词，不写死</strong>：目标 DOM 打 <code>data-arrow=&quot;key&quot;</code>，运行时量它的盒子，</li></ul><p>  箭尖落在<strong>盒子外的对角方向上</strong>、离盒子 <code>tipGap / √2</code>（命门②）。   改文案箭头自动跟着走，永远不会戳字也不会指空</p><ul><li><strong>两支箭头的差异</strong>（对称但不对等 —— 全等的两支读作镜像图形）：</li></ul><p>  | | 右上支 | 左下支 |   |---|---|---|   | 起点 | +0 | +0.06s（几乎同时） |   | 指向角 | 关键词右上角 | 关键词左下角 |   | 起笔点位移 | (+176, −132) | (−124, +104) — 更短 |   | 杆弧度 <code>bow</code> | +24（向外凸） | −20（<strong>反向</strong>凸） |   | 箭须长/张角 | 21px / 27° | 18px / 25° |</p><ul><li><strong>杆的弧度是手作感的主来源</strong>：起笔点 → 箭尖的弦，两个控制点（0.3 / 0.68 处）沿弦的</li></ul><p>  <strong>法向</strong>偏 <code>bow</code>。直线杆读作 UI 引线（Figma 的连接线），不是手画的箭头</p><ul><li><strong>起笔粗收笔细</strong>：杆的同一条 <code>d</code> 叠三层 stroke（4.8 / 3.8 / 2.8px），每层</li></ul><p>  <code>stroke-dasharray = [全长×frac, 全长]</code>（frac = 0.16 / 0.46 / 1），三层 <code>dashoffset</code>   由<strong>同一个弧长进度</strong>驱动（lockstep）—— 笔尖只有一个。   箭须用单一线宽（它在收笔端，不需要粗细变化）</p><ul><li><strong>先杆后头的两笔笔顺</strong>：杆 <code>dashoffset</code> 全长→0，0.26s <code>power3.out</code>；</li></ul><p>  杆到位那一刻箭须接上，0.11s <code>power2.out</code>。<strong>两根须长度略不等</strong>（21 / 18.5px，   张角 27° / −32°）—— 等长对称的箭头是矢量图标</p><ul><li><strong>命门①的落点</strong>：<code>allTipsAt = max(两支的 杆+头 结束时刻)</code> —— 两支都到位才换色。</li></ul><p>  关键词 <code>color</code> 由墨黑切成强调色（0.1s 线性，不做渐变——换色是状态切换不是过渡）。   <strong>不做 scale</strong>（用户定版）：关键词全程零位移零缩放，只有颜色一个通道在变</p><ul><li><strong>关键词起手必须是平淡的黑字</strong>：换色的力量是相对前半拍的落差，一上来就是强调色就没有落差</li><li><strong>排版是本卡的前提</strong>：箭头要从对角<strong>空白处</strong>画进来，所以上一行要故意写短、</li></ul><p>  给右上方留出跑道。这不是动效，是用这张卡时必须让出的版面</p><ul><li><strong>画完保持干净静置</strong>：不做 line boil / 定格抖动（design-language.md §4）</li><li><strong>层级</strong>：白舞台 → 文字（两行，上行 dim 实色）→ 箭头 SVG 层 → 主持人占位（右 28%）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>tipGap</code></td><td>16px（14~18）</td><td><strong>本卡第二命门</strong>；=0 箭尖戳进字里读作&quot;划掉/打叉&quot;（语义反向）；&gt;26px 指向变含糊，读作&quot;箭头指的是这一带&quot;</td></tr><tr><td><code>arrows[1].at</code></td><td>0.06s</td><td><strong>同时性</strong>；=0 也成立（更&quot;夹&quot;）；&gt;0.2s 读作两支箭依次飞来（两次强调，夹住感没了）</td></tr><tr><td><code>colorDur</code></td><td>0.1s</td><td>关键词换色时长；本质是硬切（<code>ease: none</code> 的 0.1s 只为躲过 1 帧的突变），&gt;0.3s 变成颜色过渡，读作&quot;字慢慢想起来自己是重点&quot;</td></tr><tr><td><code>bow</code>（+24 / −20）</td><td>两支反向</td><td>杆的弧度；=0 是直线（UI 引线，一眼假）；两支同向读作两支平行箭头（不是夹击）；\\</td><td>bow\\</td><td>&gt;45 杆弯成钩子</td></tr><tr><td><code>shaft</code></td><td>0.26s</td><td>画杆耗时；&lt;0.15s 箭头&quot;闪&quot;出来看不出方向；&gt;0.45s 单支像进度条</td></tr><tr><td><code>headDur</code></td><td>0.11s</td><td>箭须耗时（收笔快扫）；&gt;0.25s 箭头会&quot;迟到&quot;（杆到了半天才长出头）</td></tr><tr><td><code>fromDX/DY</code></td><td>(176,−132) / (−124,104)</td><td>起笔点相对箭尖的位移 = 箭头长度与来向；两支等长读作镜像图形；杆长 &lt;90px 读作小箭头图标不是&quot;从远处指过来&quot;</td></tr><tr><td><code>headLen</code> / <code>headSpread</code></td><td>21 / 27°（两须略不等）</td><td>箭须长度与张角；张角 &lt;18° 读作细尖（针不是箭），&gt;40° 读作 V 形；两须完全等长对称一眼是矢量图标</td></tr><tr><td><code>tiers</code>（4.8/3.8/2.8）</td><td>frac 0.16/0.46/1</td><td>最细那层是杆的&quot;本宽&quot;；&lt;2px 读作 UI 描边，&gt;6px 粗杆压住周围的字</td></tr><tr><td><code>startDelay</code></td><td>0.42s</td><td>等口播念到&quot;记住&quot;；&lt;0.2s 箭头比声音早</td></tr><tr><td><code>hold</code></td><td>1.6s</td><td>收尾定格，箭头保留在屏上让观众看清&quot;夹住的是这几个字&quot;</td></tr></table><h3>已知坑</h3><ul><li>词先动、箭头后到——本卡最致命的一条。动因反了，读作&quot;这个词把箭头吸过来了&quot;，</li></ul><p>  而本卡的语义是口播者用箭头把你的视线牵过去。</p><ul><li><strong><code>gap</code> 是箭尖到目标中心的留白，不是到目标边缘</strong>（2026-08-28 实战踩坑）：</li></ul><p>  目标是一整行宽词（几百 px）时照抄 demo 的 gap 16，两支共线箭杆会整段插进字里、   读作一条删除线。宽目标要按&quot;沿箭头方向出词框的距离 + 8px 呼吸&quot;算 gap   （词框半高 / |dirY 归一分量|），或干脆把目标点挪到词框外缘。</p><ul><li>给关键词加 punch 缩放（<code>scale 1.18→1</code> 那一档）——<strong>2026-08-25 用户定版删除</strong>。</li></ul><p>  箭头已经把视线送到位，字再&quot;炸&quot;一下是同一拍上的第二个动效，两个都在抢注意力；   换色本身就是确认，缩放多余。</p><ul><li>箭尖戳到字上——语义从&quot;指向&quot;翻成&quot;划掉/打叉&quot;。最常见的廉价错法。</li><li>两支错峰给到 0.2s 以上——读作两支箭依次飞来（两次强调），&quot;夹住&quot;的同时性没了。</li><li>杆画成直线——一眼是 Figma 连接线 / UI 引线。手画的箭头杆一定有弧度，而且两支弧向相反。</li><li>两支箭头做成完全镜像（等长、同弧度、同箭须）——对称但不对等才是手画的；</li></ul><p>  完全镜像读作一个矢量图形的两半。</p><ul><li>箭须两根等长且严格对称——矢量图标的特征。真实的箭头两根须一长一短、张角略不等。</li><li>用 <code>&lt;marker&gt;</code> / <code>&lt;polygon&gt;</code> 做箭头头部——那是几何三角形（矢量图标），</li></ul><p>  而且没法参与&quot;先杆后头&quot;的笔顺描画。箭须必须是两笔 path。</p><ul><li>箭须角度自己填死值——杆有弧度，末端切线方向不是&quot;起点→箭尖&quot;的方向；</li></ul><p>  须必须按<strong>杆末端切线</strong>（<code>c2 → tip</code>）算，否则箭头会朝歪。</p><ul><li>用 <code>stroke-width</code> tween 做&quot;起笔粗收笔细&quot;——那是整条杆一起变粗；笔压是沿线分布的。</li><li>三层 stroke 各跑自己的 tween——三个笔尖互相超车。必须共用一个弧长进度。</li><li>排版不留跑道就上这张卡——箭头会从别的字上穿过去，读作&quot;箭头划掉了上一行&quot;。</li></ul><p>  用这张卡必须把对角两片区域腾空（demo 里上一行故意写短就是为了这个）。</p><ul><li>关键词一上来就是强调色——&quot;炸&quot;是相对前半拍的落差，没有平淡的前半拍就没有落差。</li><li>同屏有两个以上候选词——双箭头只能夹一个目标。要点名多项请换 <code>scribble-annotation</code></li></ul><p>  的扇形多箭头变体（整组淡入 + 数字逐个弹入）。</p><ul><li>画完加 line boil / 定格抖动——本库定版禁项（design-language.md §4）。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/converging-arrows/index.html。<strong>换关键词不用改坐标</strong>：</li></ul><p>  给目标元素加 <code>data-arrow=&quot;key&quot;</code>（箭尖从它的盒子算，改文案自动跟随）。   换来向改 <code>arrows[].corner</code>（<code>topRight</code>/<code>bottomLeft</code>/<code>topLeft</code>/<code>bottomRight</code> 四选二）   + <code>fromDX/DY</code>；弧度调 <code>bow</code>（两支必须反向）；节奏调 <code>shaft</code>/<code>headDur</code>/<code>arrows[1].at</code>；   换色改 <code>color</code>（同时是箭头色与关键词换色的目标色 —— 同屏只有一个&quot;看这里&quot;色）。   核心逻辑 = <code>CONFIG</code> + <code>boxOf()</code> + <code>arrowPaths()</code> + <code>inkStroke()</code> + <code>register</code> 内那段时间线，可整段摘走。   <strong>单支版</strong>：<code>arrows</code> 只留一支即可（语义从&quot;夹住&quot;降级成&quot;指向&quot;，能量降一档，也很好用）。</p><ul><li>Remotion 移植：<code>d</code> 用同一套 <code>arrowPaths()</code> 在组件外预生成（纯函数、无随机 → 帧间一致）。</li></ul><p>  描画三层手算：第 k 层 <code>strokeDasharray = [L·frac_k, L]</code>、   <code>strokeDashoffset = max(0, L·frac_k − p·L)</code>，   <code>p = interpolate(frame, [s, s+shaftF], [0,1], {easing: Easing.out(Easing.cubic), extrapolateLeft:&quot;clamp&quot;, extrapolateRight:&quot;clamp&quot;})</code>；   箭须是第二段（<code>[s+shaftF, s+shaftF+headF]</code>）。   关键词只有一个通道：<code>color</code> 用 <code>frame &gt;= tipsF ? accent : ink</code> 直接切   （不 interpolate 颜色，也<strong>不给 scale</strong>）。</p><ul><li>剪辑软件对应物：AE = 两个形状图层，各用钢笔画<strong>带弧度的杆</strong>（两个手柄拉出反向弧）+</li></ul><p>  <code>修剪路径</code>(Trim Paths) End 0→100%（0.26s）；箭须另做一个两段折线路径的形状图层，   入点比杆晚 8 帧、Trim 0→100% 3 帧；笔压复制杆三层、各层描边宽度不同 +   <code>虚线</code> Dash 设成路径长度的 16%/46%/100% 并给 <code>偏移</code> 打关键帧；   关键词只在箭尖到位那一帧把 <code>填充颜色</code> 硬切成强调色（<strong>不打缩放关键帧</strong>）。   剪映/CapCut 没有描画通道：用&quot;贴纸 → 手绘箭头&quot;选<strong>带弧度</strong>的两款（一支正一支反，   选静置无抖动帧），入场用&quot;向右擦除/向左擦除&quot;近似描画方向，两支起点差 2 帧；   关键词换色靠在箭尖到位那一帧切一个同位置的彩色文本层（不做入场缩放）。</p><ul><li>与本库同类卡的分工：<code>scribble-annotation</code> = 圈/线/箭头三笔串行标注<strong>素材里的位置</strong></li></ul><p>  （语境是&quot;跟你一起看这张图&quot;，箭头只是其中一笔）；<code>callout-line-label</code> = 引线 + 标签   （语义是&quot;给这个东西起个名&quot;，有文字标签）；<code>hand-drawn-ellipse</code> = 手绘圈   （&quot;就这几个字&quot;，无方向）；   <strong>本卡 = 两支箭头从对角夹住一个词 + 词后换色</strong>（全库指向性最强的强调卡；   它与 <code>hand-drawn-ellipse</code> 的分工就是&quot;有方向 vs 无方向&quot;，一屏只能用一种）。</p><h3>动效范围</h3><ul><li>属于本卡的：<strong>箭头先到、词后变</strong>的因果时序（<code>allTipsAt</code> = 两支的杆+头都结束，才换色；两支中较慢的那支决定换色时刻）；<strong>箭尖留白 14~18px</strong> 这条落位纪律（戳字即语义反向）；<strong>两支错峰仅 0.06s</strong> 的同时性（&quot;夹住&quot;的全部来源）；两支箭头<strong>对称但不对等</strong>（长度不等、弧向相反、箭须长短与张角略不等）这条形状要求；杆的弧度靠控制点沿弦法向偏 <code>bow</code> 实现（直线杆即 UI 引线）；<strong>先杆后头</strong>的两笔笔顺，箭须按<strong>杆末端切线</strong>算（保证永远朝目标）；<code>dashoffset</code> 全长→0 的描画（杆 0.26s <code>power3.out</code>、须 0.11s <code>power2.out</code>，起收有快慢）；<strong>多层 stroke 共用一个弧长笔尖</strong>实现的&quot;起笔粗收笔细&quot;（杆三层 4.8/3.8/2.8px、frac 0.16/0.46/1；须单一线宽）；箭尖绑定关键词盒子的对角方向这条坐标纪律；箭尖到位那一帧关键词 <code>color</code> <strong>硬切</strong>成强调色（不做颜色渐变），且关键词<strong>只换色、不缩放不位移</strong>（用户 2026-08-25 定版删掉 punch）；关键词起手必须是平淡黑字（落差的前半拍）；箭头 hold 期保留在屏上（不淡出——它是&quot;指向&quot;的凭证）；画完保持干净静置——不做 line boil / 定格抖动；箭头 SVG 层盖在文字之上、<code>pointer-events:none</code> 的层级关系。</li><li>不属于本卡的：demo 那两句「今天只要你 / 记住这 3 点就够了」的具体文案、32/40px 两级字号与 400/600 字重、上行用 dim 实色这个排版选择、橙 <code>#e8720c</code> 这个取值（参考图②同色系，换任何一个 accent 都成立）、白底舞台、右侧 28% 的主持人（数字人）占位、正好两支箭头（单支版语义降级为&quot;指向&quot;，同样成立）。<strong>但&quot;对角两片区域必须腾空&quot;是用本卡的前提条件</strong>——它不是动效本体，却是动效成立的版面约束，复用时必须一起搬。</li><li>迁移接口：<code>color</code> 是唯一的颜色入口（箭头色 = 关键词换色目标色）；<code>tipGap</code>、<code>fromDX/DY</code>、<code>headLen</code>、<code>tiers</code> 的三个线宽按画幅<strong>同比缩放</strong>（960 宽的值 ×2 用于 1080p），<code>bow</code> 按 <code>fromDX/DY</code> 同比缩放（弧度是相对弦长的），<code>headSpread</code> 是角度常量不缩放；节奏 <code>shaft</code>/<code>headDur</code>/<code>arrows[1].at</code>/<code>startDelay</code>/<code>hold</code> 与画幅无关，只跟语速走；换来向改 <code>corner</code> + <code>fromDX/DY</code>（四个角任选两个对角；同侧两支读作平行箭头，不成立）；关键词换位置只改 <code>data-arrow</code>；目标不是 DOM（视频/图片素材上的字）时把 <code>boxOf()</code> 换成手填矩形，<code>arrowPaths()</code> 不用动。竖屏改用 <code>topRight</code> + <code>bottomLeft</code> 且把 <code>fromDY</code> 加大、<code>fromDX</code> 收小（竖屏的空白在上下方向上）。</li><li>底色要求：白底即可（马克笔橙压在白底上是本卡的原生语境）。深底上把 <code>color</code> 换成高亮度色（<code>#ff9f45</code> 级），并把最细那层 <code>tiers[2].w</code> 从 2.8 加到 3.6——深底吃掉细线的视觉重量，2.8px 的收笔端在深底上会断。<strong>底不能有高频细节</strong>——箭头是细线元素，实拍花底上会看不清指向（要么先压一层半透明底板，要么加白色描边层 outline）。</li></ul>","corner-bracket-frame":"<h3>意图</h3><p>口播里最常见的失败是&quot;每句话都一样重&quot;——观众听了 30 秒不知道哪句是论点。 本卡解决的是<strong>给一句话划定边界</strong>：角框一出，观众立刻知道&quot;框里这句是这一段的题目&quot;。</p><p>它和四角取景框是<strong>两种语言</strong>：四个角是&quot;取景/监视器&quot;语义（在看什么）， 两个对角角框是&quot;框选/引述&quot;语义（这一块是重点）。本库的其他强调卡都是给 <strong>词</strong>加信号（<code>keyword-pop-highlight</code> 砸重音、<code>highlighter-sweep</code> 扫荧光笔、 <code>ink-underline</code> 划墨线），本卡是唯一给<strong>整块</strong>划边界的。</p><p>命门三条： ① <strong>两个 L 必须同帧同曲线进入</strong>。对角对称是这个构图的全部骨架，错峰 0.05s 就能看出 &quot;一个先到一个后到&quot;，读作两个独立元素飘进来，取景关系立刻散架。 ② <strong>只画两个角，且两臂等长</strong>。三个角、四个角、两臂不等长——三种都会让它从&quot;框选&quot; 掉回&quot;装饰边角&quot;。 ③ <strong>框先立住、字后进框</strong>。框与字同时淡入读作一张 PNG；框先到 0.22s 再放字， 才是&quot;我先划范围，然后把话放进来&quot;。</p><h3>动效核心</h3><ul><li><strong>结构</strong>：一个不可见的方框（470×200 @960×540 舞台）定位在左侧留白区，</li></ul><p>  只在左上 / 右下两个角各放一个 54×54 的 L（<code>border-left + border-top</code> / <code>border-right + border-bottom</code>，   4px 描边，唯一强调色）；标题两行落在框内左侧 34px 处</p><ul><li><strong>① 角框进入</strong>：<code>opacity 0→1</code> + 沿外侧对角方向平移。左上角框起点 <code>(x:-20, y:-20)</code>、</li></ul><p>  右下角框起点 <code>(x:+20, y:+20)</code>——<strong>两者共用一条 tween</strong>（<code>gsap.to([tl, br], ...)</code>），   从代码层面保证同帧；<code>0.3s power3.out</code></p><ul><li><strong>② 标题两行</strong>：<code>opacity 0→1</code> + <code>y +6→0</code>，各 <code>0.3s power2.out</code>，错峰 <code>0.1s</code>；</li></ul><p>  起步点 = 角框起步 + <code>0.22s</code>（角框走完约 73% 时，框的形状已经读得出）</p><ul><li><strong>③ hold 1.7s</strong>：画完全部静置。不做 line boil / 定格抖动（design-language §4）</li><li><strong>标题下不加下划线/弧线</strong>（用户 2026-08-25 定版）：角框已经把边界划完了，</li></ul><p>  再加一道横线是第二个&quot;分隔&quot;信号，两个信号打架；本卡只有&quot;框&quot;这一个动作</p><ul><li><strong>层级</strong>：白底 → 主持人（右侧列，演示语境）→ 角框与标题（同层）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>brTravel</code></td><td>20px</td><td>角框沿对角方向的进入位移；0 = 只淡入（少了&quot;从画外收进来&quot;的取景感），&gt;40px 读作角框飞进来，抢了标题的戏</td></tr><tr><td><code>brIn</code></td><td>0.3s</td><td>角框进入时长；&lt;0.18s 读作硬现（框的&quot;收拢&quot;过程看不到），&gt;0.5s 观众等着框停下来，口播已经念完了</td></tr><tr><td>臂长</td><td>54px（≈ 框短边 27%）</td><td><strong>必须两臂相等</strong>；短于框短边 15% 读作装饰小角，长于 40% 就快连成整框（那是 <code>outline-box-title</code> 的语言）</td></tr><tr><td>描边宽</td><td>4px @540 舞台高</td><td>细于 2.5px 在压缩后掉边；粗于 6px 角框比标题还重，主次颠倒</td></tr><tr><td><code>linesAt</code></td><td>0.22s</td><td><strong>框先立住的时长，本卡第三命门</strong>；0 = 框与字同时进（读作一张 PNG），&gt;0.5s 空拍太长像卡了</td></tr><tr><td><code>lineStagger</code></td><td>0.1s</td><td>两行错峰；0 = 两行一起淡入（可用但更平），&gt;0.25s 读作两个独立动效</td></tr><tr><td><code>lineRise</code></td><td>6px</td><td>标题上浮量；0 少了一点重量，&gt;16px 方向感盖过&quot;进框&quot;</td></tr><tr><td><code>hold</code></td><td>1.7s</td><td>收尾停留，按两行字数给（每字约 0.13s，读完再留半拍）</td></tr></table><h3>已知坑</h3><ul><li>两个角框错峰进入——一眼看出是两个独立元素飘进来，对角对称这个骨架直接消失。</li><li>画四个角当&quot;取景框&quot;——语义变了（&quot;在看什么&quot;而不是&quot;这块是重点&quot;），而且四个角在白底上非常吵。</li><li>两臂长度不等（一臂长一臂短）——读作画歪了的装饰，不是取景符号；L 的两臂等长是它成为&quot;符号&quot;的前提。</li><li>框与标题同时淡入——整组读作一张预先做好的 PNG 贴上来，&quot;我先划范围&quot;这层意思全丢。</li><li>角框加圆角——L 的直角是它的语义（对齐、精确、机器画的）；圆角一上就成了手绘括号。</li><li>角框和标题用两种颜色——同屏第二个&quot;看这里&quot;色（design-language §1 红线），角框必须是唯一强调色。</li><li><strong>在标题下加一道下划线/弧线——2026-08-25 用户定版删除</strong>。角框已经把这块内容的边界划完了，</li></ul><p>  底下再来一横是第二个&quot;分隔&quot;信号；两个信号同屏，&quot;框选&quot;这层语义被摊薄，   而且弧线的手绘感与 L 角框的机器精确感直接打架。要下划线请换 <code>ink-underline</code>（那是另一张卡）。</p><ul><li>hold 期给角框加漂移/呼吸——角框是精确的取景符号，动起来就成了&quot;没对准&quot;。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/corner-bracket-frame/index.html。换文案改 <code>.cb-line.l1 / .l2</code> 的文字，</li></ul><p>  框的尺寸改 <code>.cb-frame</code> 的 <code>width/height</code>（框要比文字块四周各留 30px 上下气口）；   改强调色只动 <code>:root --acc</code> 一个变量（角框专用）；节奏全在 <code>CONFIG</code>   （<code>brTravel</code>/<code>brIn</code>/<code>linesAt</code>/<code>lineStagger</code>/<code>hold</code>）。</p><ul><li>Remotion 移植：两段用一个 <code>Sequence</code> 内的两组 <code>interpolate</code> 即可，不需要时间线。</li></ul><p>  角框：<code>x = interpolate(f, [0, 9], [∓20, 0], {easing: Easing.out(Easing.cubic), extrapolateRight:&quot;clamp&quot;})</code>，   两个角框传<strong>同一个 f 区间</strong>（同帧的保证）；标题两行 <code>f - i*3</code> 做局部时钟。   帧换算 @30fps：<code>brIn 0.3s ⇒ 9f</code>、<code>linesAt 0.22s ⇒ 7f</code>、<code>lineStagger 0.1s ⇒ 3f</code>。</p><ul><li>剪辑软件对应物：剪映/CapCut——没有现成&quot;对角角框&quot;，做法是两个&quot;边框&quot;贴纸各自打</li></ul><p>  位置 + 不透明度两个关键帧，<strong>两个贴纸的关键帧必须放在同一帧</strong>（剪映里对齐靠吸附，   务必检查）。   AE——两个 Shape Layer 各画一个 L（Rectangle 描边 + Trim Paths 留 25%，或直接两条 Stroke），   一个 Null 父级带两个角框同时做 Position（这是保证&quot;同帧&quot;最稳的做法）。</p><ul><li>与本库同类卡的分工：<code>outline-box-title</code> = 完整闭合的描边框（框选一个短语，机器画一圈）；</li></ul><p>  <code>focus-dim-spotlight</code> = 压暗周围来强调（减法）；<code>highlighter-sweep</code> / <code>ink-underline</code> /   <code>scribble-annotation</code> = 给词加手绘信号；<code>callout-line-label</code> = 引线指到画面里的某个位置；   <strong>本卡 = 给一块内容划定边界</strong>（对角两个角，取景/引述语义，能量最低的一档&quot;框住&quot;）。</p><h3>动效范围</h3><ul><li>属于本卡的：两个 L 角框<strong>共用一条 tween</strong>、沿各自外侧对角方向 20px 平移 + 淡入进入（0.3s <code>power3.out</code>）这条&quot;同帧同曲线&quot;纪律；只画<strong>对角两个</strong>角且两臂等长这条形状纪律；框先立住 0.22s 再放字这个先后关系；标题两行 <code>opacity + y+6→0</code> 错峰 0.1s；<strong>标题下不加任何下划线/弧线</strong>（用户 2026-08-25 定版：角框已是唯一的边界信号）；hold 期全部静置（不加漂移、不做 line boil）。</li><li>不属于本卡的：demo 那句「一条思路 / 讲清楚一件事」的具体文案、52px/700 的字号字重、青色 <code>#0aa3a3</code> 这个具体取值（唯一强调色的<strong>位置</strong>属于本卡，色值不属于）、470×200 的框尺寸与 54px 臂长的绝对像素、右侧主持人（数字人）占位、标题落在左侧留白区这个构图（居中、右侧、竖屏上半屏都成立）。</li><li>迁移接口：强调色一个变量 <code>--acc</code>（角框专用，同屏不允许第二个）；框尺寸按文字块四周各留 30px 气口重算，臂长取框短边的 25~30%、描边宽取舞台高的 0.7%；节奏在 <code>CONFIG</code>，能量档只调 <code>brIn</code> 与 <code>brTravel</code>（两者要一起动：位移大就该慢一点）；<code>linesAt</code> 是<strong>手感常量</strong>（框先立住的那 0.22s），换尺寸换语速都不要动；<code>hold</code> 按标题字数给（每字约 0.13s）。竖屏把框放在上三分之一、宽度取画幅 80%，臂长按新的框短边重算。</li><li>底色要求：白底即可。深底同样成立（角框换成深底模式的强调色 <code>#2997ff</code> 系，标题反白）。唯一约束是<strong>底不能有高频细节</strong>——L 角框只有两条 4px 的线，压在花底上会被吃掉，那种场合要么加粗到 6px 要么先垫一层浅底板。</li></ul>","ink-underline":"<h3>意图</h3><p>本库已有两种&quot;给字加记号&quot;：<code>highlighter-sweep</code> 是<strong>荧光笔色块</strong>（一个 multiply 的矩形扫过整句， 强调的是&quot;这一整句&quot;，靠面积压住视线）；<code>scribble-annotation</code> 是<strong>圈注箭头</strong>（绕着目标画圈、拉线， 强调的是&quot;画面上的这个东西&quot;，作用对象是素材而不是文字）。</p><p>这张卡补的是第三种：<strong>一条有笔压的线，作用在句子里的一个词上</strong>。 它比荧光笔轻——不占面积、不改字的底色，所以能在一句话里连着划两个词而画面不脏； 它比圈注准——线的两端就是词的两端，观众读到的是&quot;就这两个字&quot;，不是&quot;这一块区域&quot;。 口播里最常用的语境是<strong>对比式论述</strong>：先给错的说法划一条，再给对的说法划一条， 两条线的存在本身就把&quot;不是这个、是那个&quot;讲完了。</p><p>命门三条： ① <strong>变宽靠路径不靠描边</strong>——<code>stroke-width</code> 是常数，画不出笔压。必须沿脊线逐点求法线、 按 taper 向两侧撑出半宽，左岸正走 + 右岸倒走闭合成一个<strong>填充路径</strong>（<code>fill</code>，<code>stroke:none</code>）。 这是源码 <code>brush.tsx</code> 的 <code>brushRibbon</code> 的全部内容，也是这张卡与&quot;一条 6px 圆头线&quot;的全部差别； ② <strong>截断脊线而不是 dashoffset</strong>——描画的实现是&quot;每帧按 progress 截短脊线再重算缎带&quot;。 关键是 taper 的 t 仍按<strong>整条脊线</strong>算（不是按已画部分归一化）， 于是笔尖此刻的宽度就是它落定后的宽度，读作&quot;笔走过去&quot;； 若按已画部分归一化，每一帧的收笔端都是最细的，看上去像一条会变粗的橡皮筋。 用 <code>stroke-dasharray</code> 描一个填充路径更是错的——那会沿着缎带的<strong>轮廓</strong>跑一圈； ③ <strong>画完静置</strong>——源码是&quot;5 个定格姿态 + 每格重新哈希抖动&quot;（<code>steppedRamp</code> 3 帧一格 + <code>hashRange</code>）， 正撞本库&quot;不做沸腾/定格抖动&quot;的定版偏好。本卡改成连续缓动的一次生长， 手作感全部交给形状（脊线的弧度 + taper 的收细 + 边缘颗粒），落定后不再有任何变化。</p><h3>动效核心</h3><ul><li><strong>脊线（spine）</strong>：一条三次贝塞尔，40 点采样。两个控制点上下<strong>反向</strong>偏 <code>wobble</code> px</li></ul><p>  （30% 处 <code>+w</code>、70% 处 <code>−w</code>、终点 <code>+0.6w</code>）——一个极浅的 S 弯，这是&quot;手画的线&quot;与&quot;CSS border-bottom&quot;的分界。   <code>wobble</code> 只有 ±1px 上下，大了立刻读作波浪线（那是拼写错误的记号）。两条线的 <code>wobble</code> 取<strong>反号</strong>，   避免两条线并置时弯法一致、读作程序批量生成</p><ul><li><strong>缎带（ribbon）</strong>：沿脊线逐点求法线（前后邻点连线的垂线），半宽</li></ul><p>  <code>half(t) = thickness/2 × (pressure + (release − pressure) × t)</code>。   <code>pressure 1 → release 0.15</code>：起笔压满纸、收笔提到 15% —— 笔离纸的那一下。   左岸 <code>spine[i] + normal × half</code>、右岸 <code>spine[i] − normal × half</code>，右岸倒序接在左岸后面闭合成 <code>Z</code></p><ul><li><strong>两岸各自平滑</strong>（Catmull-Rom → 三次贝塞尔）：直接 <code>L</code> 连采样点会在缎带边缘看出 40 段折线</li><li><strong>生长</strong>：<code>progress 0→1</code>，<code>power1.out</code>，0.4~0.5s。每帧 <code>drawn = round(progress × 39) + 1</code> 截断脊线重算路径。</li></ul><p>  <strong>直写 <code>setAttribute(&quot;d&quot;, …)</code> 而非 <code>gsap.set</code></strong>——后者被排到下一 tick，描画比音效晚一帧</p><ul><li><strong>边缘颗粒</strong>：<code>feTurbulence(fractalNoise, baseFrequency 0.7, numOctaves 3)</code> + <code>feDisplacementMap</code>，</li></ul><p>  位移量 <code>thickness × 0.5 × grain</code>。<strong>seed 固定、不随时间变</strong>——毛边是形状的一部分，不是沸腾。   <code>grain 0.5</code> 是本库取值（源码 1.0）：1.0 在 10px 的线上会把收笔那一端咬断成几点墨</p><ul><li><strong>墨的透水度 <code>opacity 0.85</code></strong>：1.0 读作矢量色块，&lt;0.7 读作没蘸够墨</li><li><strong>坐标不写死</strong>：每条线绑定 <code>data-ink=&quot;…&quot;</code> 目标，运行时用 canvas <code>measureText</code> 的</li></ul><p>  <code>fontBoundingBoxAscent</code> 求真实 <strong>baseline</strong>（行盒下沿有字体留白，照行盒画线会飘在下面一截），   线心落在 <code>baseline + baselineGap</code>。改文案/改字号，线自动跟着走</p><ul><li><strong>层级</strong>：文字层 → 墨迹 SVG 层（<code>pointer-events:none</code>，盖在字上但因为线在 baseline 下方不压字）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>dur</code></td><td>0.4~0.5s</td><td>单条描画时长，按词长给（4 字 0.5s / 2 字 0.4s）；&lt;0.25s 读作一条线突然出现，&gt;0.8s 观众读完了笔还在走</td></tr><tr><td><code>thickness</code></td><td>10px</td><td>起笔处的线宽（收笔处是它的 15%）；&lt;6px 笔压的收细看不出来（变宽变成噪声），&gt;16px 读作荧光笔色块、抢字</td></tr><tr><td><code>pressure</code> / <code>release</code></td><td>1 / 0.15</td><td>起笔压 / 收笔压。两者相等 = 等宽线（笔感全无）；<code>release</code> &gt;0.5 收笔不够细、读作马克笔；反过来 <code>pressure</code> 小 <code>release</code> 大 = 起细收粗，那是&quot;提笔顿收&quot;的另一种笔法，也成立</td></tr><tr><td><code>wobble</code></td><td>±1px</td><td>脊线弯量；0 = 直尺画的线，&gt;3px 读作波浪线（拼写错误记号）。两条线取反号</td></tr><tr><td><code>baselineGap</code></td><td>6px</td><td>线心离 baseline 的距离；&lt;3px 压住字的下缘（撞到&quot;了/丁&quot;的竖钩），&gt;12px 线飘在句子外面</td></tr><tr><td><code>overhang</code></td><td>8~9px</td><td>两端各超出文字多少；0 = 线与字严格等长、读作表格边框，&gt;20px 读作划掉了旁边的字</td></tr><tr><td><code>grain</code></td><td>0.5</td><td>边缘颗粒；0 = 矢量光边（干净但少一层纸感），≥1 会把收笔的细端咬断成几点墨</td></tr><tr><td><code>inkOpacity</code></td><td>0.85</td><td>墨的透水度；1.0 读作矢量色块，&lt;0.7 读作没蘸够墨</td></tr><tr><td><code>gapBetween</code></td><td>0.75s</td><td>两条线之间的间隔，对齐口播逐个点名；&lt;0.3s 两条线像同时出现、对比感消失</td></tr><tr><td><code>samples</code></td><td>40</td><td>脊线采样点数；&lt;20 缎带边缘看出折线，&gt;80 白算</td></tr></table><h3>已知坑</h3><ul><li>用 <code>stroke-width</code> 画线然后指望有笔压——描边宽度是常数，怎么调都是等宽线；变宽必须是填充路径的两条边算出来的。</li><li>用 <code>stroke-dasharray/dashoffset</code> 描这个填充路径——dash 会沿着缎带的<strong>轮廓</strong>跑一圈（先描上边再描下边），看上去像一根线在绕圈，不是笔在走。</li><li>taper 的 t 按&quot;已画部分&quot;归一化——每一帧的笔尖都是最细的，落定后又变粗，读作一条会膨胀的橡皮筋。t 必须按整条脊线算。</li><li>照行盒（<code>getBoundingClientRect</code>）算 baseline——中文字体行盒下沿有一截留白，线会飘在句子外面；必须用 <code>measureText</code> 的 <code>fontBoundingBoxAscent</code>。</li><li>画完加沸腾/定格抖动（源码原版就是 5 个定格姿态 + 逐格重新哈希）——撞本库定版偏好，且在 1080p 上读作渲染不稳定。</li><li><code>grain</code> 照搬源码的 1.0——在 10px 的线上位移量 5px，收笔那一端（宽度只有 1.5px）会被咬断成几点墨，读作墨迹干了。</li><li>一句话里划 3 个以上的词——同屏重音只能有一个，第三条线出现时观众已经不知道该看哪；上限 2 条。</li><li>线宽给 16px 以上——读作荧光笔，那是 <code>highlighter-sweep</code> 的地盘，且色块会压住字的下缘。</li><li>两条线的 <code>wobble</code> 同号同量——并置时弯法完全一致，读作程序批量生成（手画不会连续画出两条一样的弧）。</li><li>在 <code>onUpdate</code> 里用 <code>gsap.set</code> 改 <code>d</code>——被排到下一 tick，描画比 scratch 音效晚一帧。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/ink-underline/index.html。核心是三个函数——<code>spineOf()</code>（脊线）、</li></ul><p>  <code>ribbon(spine, o, progress)</code>（变宽缎带，<strong>这个函数可以整段抄走</strong>，它与本卡的其他部分无耦合）、   <code>baselineOf()</code>（量真实 baseline）。加一条线就在 <code>CONFIG.marks</code> 里加一项并给目标元素打 <code>data-ink</code>。</p><ul><li>Remotion 移植：源码在 <code>registry/remocn/ink-underline/index.tsx</code>，缎带生成器在</li></ul><p>  <code>registry/remocn/brush/index.tsx</code>（<code>brushRibbon</code> / <code>brushHalfWidth</code> / <code>sampleCubic</code> / <code>BrushGrain</code> 可直接用）。   秒↔帧（30fps）：描画 0.5s = 15 帧、静置 0.55s = 16.5 帧、间隔 0.75s = 22.5 帧。   <strong>要改的一处</strong>：源码用 <code>steppedRamp(frame, delay, delay + durationSteps × step, {step: 3})</code>   做 5 个定格姿态（3 帧一格），换成连续的   <code>interpolate(frame, [d, d + 15], [0, 1], {easing: Easing.out(Easing.quad), extrapolateRight: 'clamp'})</code>   即符合本库&quot;不做定格&quot;纪律；同时把 <code>hashRange</code> 的逐格重掷去掉（wobble 取一个常量）。   <code>grain</code> 传 0.5 而不是默认 1。</p><ul><li>剪辑软件对应物：AE——用 Shape Layer 的 Stroke + <strong>Taper</strong>（AE 2020+ 内置起收笔收细，</li></ul><p>  正是本卡的 taper）+ Trim Paths 的 End 关键帧做生长，Roughen Edges 给颗粒；   剪映/CapCut——没有真正的变宽笔触，退而用&quot;手写字/笔刷&quot;贴纸的描出动画（形状固定、只能选预设），   或者预先在 AE/Figma 里把缎带导成序列帧再当素材用。</p><ul><li>与本类其余卡的分工：<strong>本卡</strong> = 作用在句子里的<strong>一个词</strong>上的有笔压的线（不占面积，一句可两条）；</li></ul><p>  <strong>highlighter-sweep</strong> = 荧光色块扫过<strong>整句</strong>（靠面积压视线，必须配其余文字压暗）；   <strong>scribble-annotation</strong> = 圈/箭头作用在<strong>素材上的元素</strong>（圈住价格、指向按钮）。   一句话里三者不叠加。</p><h3>动效范围</h3><ul><li>属于本卡的：变宽缎带的生成机制（脊线 → 逐点法线 → taper 半宽 → 左岸正走右岸倒走闭合成填充路径）；<code>pressure 1 → release 0.15</code> 的起笔压满收笔提细；截断脊线做生长且 <strong>taper 的 t 按整条脊线算</strong>这条纪律；脊线两控制点上下反偏 ±1px 的浅 S 弯、两条线取反号；静态 <code>feTurbulence + feDisplacementMap</code> 边缘颗粒（seed 固定不随时间变）；<code>opacity 0.85</code> 的墨透水度；线心落在真实 baseline + 6px；描画 <code>power1.out</code> 0.4~0.5s、条间隔 0.75s 的节拍；画完静置不抖这条取舍；<code>onUpdate</code> 里直写 <code>setAttribute</code> 以免晚一帧。</li><li>不属于本卡的：demo 的两行示例台词与&quot;成本上涨/渠道结构&quot;这组对比文案、字号 30px 与行高 1.95、墨色 <code>#6f7f35</code>（换成任何深色都成立，它只需与底色有对比）、被划词只加字重不加颜色这个排版选择、主持人占位（演示语境素材）、右侧 70% 布局。</li><li>迁移接口：<code>CONFIG.marks</code> 的每一项 = 一条线，<code>target</code> 指向 <code>data-ink</code> 元素；<code>color</code> 换墨色（深底改浅色墨，其余参数不变）；<code>thickness</code> 按字号等比给（30px 字号用 10px 线 ≈ 字号的 1/3，1080p 上 60px 字号给 20px）；<code>dur</code> 按词长给；<code>baselineGap</code> / <code>overhang</code> 是<strong>手感常量</strong>，随字号等比缩；<code>grain</code> 随 <code>thickness</code> 反向调（线越细颗粒要越小，否则咬断收笔端）。</li><li>底色要求：白底/浅底最佳（墨是深色，靠对比成立）。深底把 <code>color</code> 换成浅色墨即可，<code>inkOpacity</code> 可提到 0.9（浅色墨在深底上透太多会显灰）。</li></ul>","magnifier-detail":"<h3>意图</h3><p>截图信息密度高，口播念到某个数字时观众在画面里找不到——放大镜一次解决两个问题： <strong>在哪</strong>（原位细描边框 + 连接线指回出处）和<strong>是什么</strong>（1.5~2 倍看清内容）。 命门：<strong>对得上位</strong>（放大内容必须和原图逐像素对应，错位一眼假）、 <strong>弹到空白区</strong>（镜子盖住目标本体等于自己遮自己）、<strong>本体压暗</strong>（不压暗则镜内镜外抢视线，放大失去意义）。</p><h3>动效核心</h3><ul><li>结构：底层假截图；放大镜 = 圆形容器（<code>overflow:hidden</code>，白描边 4px + 大投影）内放同一截图的克隆副本，</li></ul><p>  副本 <code>scale = zoom</code>，偏移量 <code>x = magSize/2 − zoom·px</code>、<code>y = magSize/2 − zoom·py</code>（px/py 为目标点在截图内坐标），使目标点正好落在镜心</p><ul><li>入场：放大镜从目标点原位起跳，scale 0.3→1 + 位移到旁边空白区落位，0.3s <code>power3.out</code>；</li></ul><p>  同帧底图 <code>brightness</code> 1→<code>dimTo</code>（0.3s，白底截图取 0.8、深底取 0.6），目标处指示色细描边框 0.2s 淡入</p><ul><li>连接线：入场将完时（popIn − 0.05s）SVG line 用 <code>stroke-dasharray</code> 从目标点向镜心描出 0.25s <code>power2.out</code>——先有镜再有线，线是&quot;指回出处&quot;，顺序反了就没有因果感</li><li>hold：镜内副本 x 方向 ±(panPx×zoom) 正弦 yoyo 平移（1.4s 半周期），模拟视线扫视，画面不呆</li><li>起手留白：截图先静置 0.45s 再弹镜，观众先知道&quot;这是张什么图&quot;再看局部</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>zoom</code></td><td>1.8</td><td>1.5~2 之间；&gt;2 内容发糊像马赛克，&lt;1.4 放大感不足不如加粗</td></tr><tr><td><code>magSize</code></td><td>210px</td><td>放大镜直径；太小看不清，太大盖版面（勿超舞台高 1/3）</td></tr><tr><td><code>magX</code> / <code>magY</code></td><td>745 / 190</td><td>落位中心，必须是截图旁空白区；离目标越远连接线越重要</td></tr><tr><td><code>popIn</code></td><td>0.3s</td><td>&gt;0.45s 拖节奏像 PPT 飞入；&lt;0.2s 看不出&quot;从原位弹出&quot;的轨迹</td></tr><tr><td><code>dimTo</code></td><td>0.8（白底截图）/ 0.6（深底截图）</td><td>底图压暗亮度，随底图明度取值：白底截图压到 0.6 会变成一整块灰，取 0.75~0.85 刚好&quot;退让不失读&quot;；1.0 完全不压=强调失效</td></tr><tr><td><code>startDelay</code></td><td>0.45s</td><td>截图先看清一拍；0 会让观众没看懂整图就被拽进局部</td></tr><tr><td><code>panPx</code></td><td>7px</td><td>hold 期间扫视幅度；&gt;15 像镜头在漂，0 则 hold 期读作静止贴图</td></tr></table><h3>已知坑</h3><ul><li>放大内容和原图对不上位——副本偏移没按 <code>magSize/2 − zoom·目标坐标</code> 校准（或截图被外壳缩放后用了屏幕坐标），观众一对照就穿帮。</li><li>放大镜落在目标本体上——自己遮住出处，读者不知道放大的是哪。</li><li>没有连接线/描边框——镜子孤零零浮着，读者在原图里找不到出处，等于白放大。</li><li>底图不压暗——镜内镜外两份同样亮的内容抢视线，&quot;看这里&quot;的指向性归零。</li><li>hold 期间完全静止——放大镜读作贴上去的静态圆图，不像&quot;正在看&quot;。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/magnifier-detail/index.html。换截图内容改 <code>.shot .body</code> 里各行文案；换放大目标只需把 <code>id=&quot;magTarget&quot;</code> 挂到任意元素上（目标坐标运行时自动反推，副本对位与连接线端点跟着变）；换落位/倍数/压暗程度改 <code>CONFIG</code> 的 <code>magX/magY</code>、<code>zoom</code>、<code>dimTo</code>；换强调色改 <code>.target-box</code> 边框色与 <code>#lline</code> 的 <code>stroke</code>（现为 #ffd23e），放大镜描边色在 <code>#magnifier</code> 的 <code>border</code>；口播字幕在 <code>.caption-zone</code> 内。核心可摘走：复制 <code>CONFIG</code> + <code>DemoShell.register</code> 回调体即可。</li><li>Remotion 移植：同一截图渲染两个 <code>&lt;Img&gt;</code>，上层包在 <code>borderRadius:'50%'; overflow:'hidden'</code> 的圆形容器里，内层 <code>transform: scale(zoom) translate(...)</code> 按同一公式对位；入场用 <code>spring({frame, config:{damping:200}})</code> 驱动 scale 0.3→1，位置用 <code>interpolate(frame, [t0,t1], [targetX, magX])</code>；压暗 <code>filter: brightness(interpolate(...))</code>；连接线 SVG <code>&lt;line&gt;</code> 用 <code>strokeDasharray = \\</code>${interpolate(frame,...,[0,len])} ${len}\\`<code>；hold 扫视 </code>Math.sin(frame/fps * 2π/2.8) * panPx * zoom`。</li><li>剪辑软件对应物：剪映——画中画复制同素材 + &quot;蒙版→圆形&quot; + 缩放放大，或素材库搜&quot;放大镜&quot;贴纸；AE——复制图层加椭圆蒙版 + Scale 关键帧，或直接用内置 Magnify（放大）效果 + 描边圆形固态层；CapCut——&quot;Magnifier&quot; 贴纸 / PIP + circle mask 同法。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：放大镜从目标点<strong>原位起跳</strong>——<code>scale 0.3→1</code> + 位移到旁边空白区落位（0.3s、power3.out）；同帧底图 <code>brightness 1→dimTo</code> 压暗（0.3s）与目标处细描边框 0.2s 淡入；连接线在入场将完时（popIn − 0.05s）从目标点向镜心用 <code>stroke-dasharray</code> 描出（0.25s、power2.out）——<strong>先有镜再有线</strong>的因果顺序；hold 期间镜内副本 x 方向 ±(panPx×zoom) 正弦 yoyo 扫视（1.4s 半周期），画面不呆；起手截图静置 0.45s。对位公式（<code>x = magSize/2 − zoom·px</code>）是本卡的技术本体，必须一起带走。</li><li>不属于本卡的：假评测截图占位（窗口条、行文案、数据）、示例口播字幕、放大镜落位坐标 <code>magX/magY</code>（随版面变）、指示色 #ff4d4d 与镜圈色的具体取值、镜子的投影质感（已移除，属于风格）。</li><li>迁移接口：<code>zoom</code> 定放大倍数（1.5~2），<code>magSize</code> 定镜径（勿超舞台高 1/3），<code>magX/magY</code> 定落位（必须是目标旁的空白区），<code>popIn</code> 定弹出快慢，<code>dimTo</code> <strong>随底图明度取值</strong>（白底 0.8 / 深底 0.6），<code>panPx</code> 定 hold 扫视幅度；换目标只需把 <code>id=&quot;magTarget&quot;</code> 挂到任意元素上，坐标运行时反推、副本对位与连接线端点自动跟随；换尺寸时 magSize 与镜圈线宽按画幅等比缩放。</li><li>底色要求：白底即可（镜圈用深灰细描边即可从白底分离，不依赖投影）。唯一与底色联动的是 <code>dimTo</code>——白底截图压暗过深会变成一整块灰，见参数表取值。</li></ul>","quote-hold-arrow":"<h3>意图</h3><p>金句卡通常犯一个错：<strong>一上屏就高亮</strong>。三行字里第三行自带黄框飞进来——观众看到的是 &quot;一张已经排好的图&quot;，读作设计，不读作叙事。而口播的真实节奏从来不是这样：主播先说两句铺垫， 说到第三句时<strong>语气才变</strong>，那一瞬间观众才知道&quot;哦，前面都是为了这句&quot;。</p><p>这张卡把那个&quot;语气变了&quot;的瞬间做成了动效：<strong>末行先以普通样式落地、平淡地停一拍，然后才升级</strong>。 观众的体验是两段的——先读到一段平铺的话，再看到其中一行被点亮。这个&quot;后知后觉&quot;的结构 就是本卡的全部价值：它复现了<strong>口播里重点浮现的时间顺序</strong>，而不是把结论直接贴出来。</p><p>两个动作各有分工，别混：<strong>框</strong>说&quot;是这一行&quot;（范围）；<strong>punch</strong> 说&quot;就是现在&quot;（时间点）。 框先到、字后应，顺序不能改。</p><p><strong>2026-08-26 用户定版：去掉了原来第三拍从框右缘伸出的箭头。</strong> 理由：金句的落点是&quot;这一句被点亮、然后停住&quot;——箭头把视线从句子引向画外， 反而削掉了那 2.2s 停留的余味；它还要在末行右侧占掉 104px 版面，而那正是人物站的位置。 要&quot;往下一步去&quot;的指向，用独立的转场卡去做，不要塞进金句里。</p><p>命门两条：① <strong>末行必须两拍</strong>（平淡 → 升级），中间那 0.34s 是本卡唯一不可省的空白； ② <strong>框在文字下层、文字保持黑字</strong>——这是荧光笔语义（在纸上划过），不是反白 chip（把字放进色块里）。 后者是 <code>alt-block-lines</code> / <code>slab-punch-title</code> 的语言，读法完全不同。</p><h3>动效核心</h3><ul><li><strong>层级</strong>：白底 → 人物层（右列）→ 三行金句（左侧，垂直居中）→ 末行：高亮框（<code>z-index: 0</code>）</li></ul><p>  在<strong>文字下层</strong>（<code>z-index: 1</code>）</p><ul><li><strong>① 三行淡入（第一拍：全部平淡）</strong>：<code>opacity 0 → 1</code> + <code>y +8 → 0</code>，每行 <code>0.28s power2.out</code>，</li></ul><p>  错峰 <code>0.12s</code>。<strong>此刻末行与前两行一模一样</strong>——没有框、没有色、没有重音</p><ul><li><strong>② 平淡停留 <code>0.34s</code>（本卡的命门空白）</strong>：什么都不发生。这一拍让观众把三行当成一段话读完</li><li><strong>③ 末行升级</strong>：</li></ul><p>  - 高亮框 <code>scaleX 0 → 1</code>，<code>transform-origin: 50% center</code>（<strong>从文字中心向两侧铺开</strong>），     <code>0.24s power3.out</code>。<code>#FFE949</code> @ <code>opacity 0.62</code> + <code>mix-blend-mode: multiply</code>     （design-language §1 的 marker token），不规则圆角 <code>11px 5px 9px 4px / 6px 11px 5px 9px</code> 模拟笔触   - <strong>框到位后</strong>文字 <code>scale 1.05 → 1</code> punch，<code>0.17s</code>（5 帧 @30fps）<code>power2.out</code>，     <code>transform-origin: 50% 50%</code>。框先到、字后应——反了读作&quot;字被框追上&quot;</p><ul><li><strong>④ hold 2.2s</strong>：金句要停——punch 落定就是本卡的落点，后面不再有任何动作</li><li><strong>总时长账</strong>：<code>0.4 + (0.12×2 + 0.28) + 0.34 + 0.24 + 0.17 + 2.2</code> ≈ 3.9s</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>plainHold</code></td><td>0.34s</td><td><strong>第一命门</strong>：末行&quot;平淡&quot;停留时长；0 时框跟着字一起来，两拍并成一拍——&quot;重点在这一句&quot;的推进感直接消失（就变成一张排好的图）；&gt;0.8s 观众以为动效结束了，升级读作第二个动效</td></tr><tr><td><code>lineStagger</code></td><td>0.12s</td><td>三行错峰；&gt;0.2s 读作逐句砸（抢过升级那一拍），&lt;0.06s 整块淡入（可用，但少了阅读顺序）</td></tr><tr><td><code>hlDur</code></td><td>0.24s</td><td>高亮框铺开耗时；跟朗读语速走，&lt;0.15s 像 bug 闪一下，&gt;0.45s 框还在长、口播已经念完这句了</td></tr><tr><td>框 <code>transform-origin</code></td><td><code>50% center</code>（中心）</td><td><strong>本卡与 <code>highlighter-sweep</code> 的分界</strong>；改成 <code>left center</code> 就变成&quot;从左划过&quot;（阅读式划线，跟着朗读走）；中心铺开读作&quot;这一整行被框住&quot;（结论式，一次成型）</td></tr><tr><td><code>punchScale</code></td><td>1.05</td><td>文字 punch 起始倍数；&lt;1.03 看不出重音，&gt;1.12 读作字要跳出框（框与字脱钩）</td></tr><tr><td><code>punchDur</code></td><td>0.17s（5 帧）</td><td>punch 时长；&gt;0.3s 读作整行在缩放（不是重音是动画），必须短</td></tr><tr><td>punch 时机</td><td>框<strong>到位后</strong></td><td><strong>不许与框同时</strong>；同时发生读作&quot;字被框追上&quot;，框先到、字后应才是&quot;框住了，所以这句重&quot;</td></tr><tr><td><code>hold</code></td><td>2.2s</td><td>收尾停留；金句的余味全在这段静止里，&lt;1.5s 观众刚读完就切</td></tr></table><h3>已知坑</h3><ul><li><strong>多行是&quot;块级外壳 + 内层 inline-block&quot;两层结构</strong>（2026-08-27 实战补）：高亮框要贴文字宽，</li></ul><p>  所以内层必须 <code>inline-block</code>；但几行 inline-block 会<strong>横向流成一行</strong>（实测三行金句塌成一行）。   每行外面再包一层块级 div。</p><ul><li>末行一上屏就带框——<strong>本卡最致命的错法</strong>。两拍并成一拍后，观众读到的是一张排好的图，</li></ul><p>  &quot;重点在这一句&quot;这个叙事完全消失（这时你其实该用 <code>keyword-pop-highlight</code> 或直接静态排版）。</p><ul><li>框铺开与文字 punch 同帧——读作&quot;字被框追上&quot;。框先到位、字才应答，</li></ul><p>  这半拍的先后是&quot;因为被框住了所以这句重&quot;的因果。</p><ul><li>框做成实色反白 chip（黄底白字/黄底黑字盖住原字）——那是<strong>色块语言</strong></li></ul><p>  （<code>alt-block-lines</code> / <code>slab-punch-title</code>），读作&quot;这行字坐在一个块上&quot;；   荧光笔语言是&quot;字还在纸上，纸被划了一道&quot;，两者的叙事完全不同。</p><ul><li>框不用 <code>multiply</code>（或盖在字上层）——黄块把黑字压成灰，&quot;划重点&quot;变成&quot;涂掉&quot;。</li><li>框用规则圆角/直角——读作文本选区或背景色，不是笔触。</li><li><code>transform-origin</code> 忘了改成中心（用了默认或 <code>left</code>）——那是 <code>highlighter-sweep</code> 的</li></ul><p>  &quot;跟着朗读划过&quot;，本卡要的是&quot;一次框住这一整行&quot;的结论感。</p><ul><li>前两行也加了高亮/重音——三行都重就没有重点，本卡的结构是&quot;两行铺垫 + 一行结论&quot;。</li><li>在 punch 之后再补任何动作（箭头、下划线、图标）——那 2.2s 停留就是本卡的落点，加东西等于把余味填满。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/quote-hold-arrow/index.html。<strong>换内容改 <code>.qh-line</code> 三行文案</strong></li></ul><p>  （末行的字放在 <code>.qh-last-txt</code> 里，框会自动跟着宽度走）。   节奏只调 <code>plainHold</code>（两拍之间的空白，本卡的能量旋钮）与 <code>hold</code>（余味）。   想把框改成&quot;跟着朗读划过&quot;：   <code>.qh-hl</code> 的 <code>transform-origin</code> 改 <code>left center</code> —— 但那就变成 <code>highlighter-sweep</code> 了，   别在同一条视频里两种混用。</p><ul><li>Remotion 移植：三行各一个 <code>&lt;Sequence from={Math.round(i*0.12*fps)}&gt;</code>。</li></ul><p>  升级那一拍单独一个 <code>Sequence from={upFrame}</code>（<code>upFrame = 三行结束帧 + Math.round(0.34*fps)</code>）：   框 <code>interpolate(f, [0, 7], [0, 1], {easing: Easing.out(Easing.cubic), extrapolateRight: &quot;clamp&quot;})</code>   驱动 <code>scaleX</code> + <code>transformOrigin: &quot;50% center&quot;</code>；punch 从第 7 帧起   <code>interpolate(f, [7, 12], [1.05, 1], {easing: Easing.out(Easing.quad), extrapolateLeft: &quot;clamp&quot;, extrapolateRight: &quot;clamp&quot;})</code>   （<strong>两头 clamp 都不能省</strong>——不 clamp 时 <code>f &lt; 7</code> 会算出 &gt;1.05 的 scale，末行开场就是放大的）。   <code>mixBlendMode: &quot;multiply&quot;</code> 在 Remotion 渲染里正常工作。</p><ul><li>剪辑软件对应物：剪映/CapCut——三行文本层各打&quot;位置 + 不透明度&quot;关键帧，逐层拖 4 帧；</li></ul><p>  末行<strong>要在第一拍之后</strong>再加一个黄色矩形贴纸，打&quot;缩放（横向）&quot;关键帧   且<strong>锚点保持在中心</strong>（剪映默认就是中心，这次刚好对）+ 混合模式设&quot;正片叠底&quot;；   punch 用末行文本层的&quot;缩放&quot;两键（105% → 100%，5 帧，缓出）。   AE——末行文本层 + 一个 Shape Layer 矩形（<code>Scale</code> x 从 0 到 100，锚点在中心）+ 混合模式 <code>Multiply</code>；   两个动作用 <code>plainHold</code> 的帧数在时间轴上手动隔开（这是本卡唯一需要盯着的对齐）。</p><ul><li>与本库同类卡的分工：</li></ul><p>  - <code>highlighter-sweep</code> = <strong>只做荧光笔那一下</strong>，从左划过（跟着朗读走），用在长文/文档上划重点，     没有&quot;两拍升级&quot;的结构。   - <code>keyword-pop-highlight</code> = 一句里砸<strong>一个词</strong>（词级重音）；本卡强调的是<strong>一整行</strong>。   - <code>quote-card</code> = 让位仪式（底板 + 整屏接管 + 逐句砸）；<code>quote-bracket-pull</code> = 排版式引用     （双引号夹出引文区，整段等重）；<strong>本卡 = 三行里只有末行升级</strong>（有铺垫、有转折）。   - 一句话选卡：<stro
