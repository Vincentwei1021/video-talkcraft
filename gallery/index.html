interpolate(frame, [0, wipeIn*fps], [-100, 0], {easing: Easing.inOut(Easing.quart)})</code> 驱动 <code>translateX%</code>；编号 scale/opacity 与章节名 <code>clipPath</code> 的 inset 百分比同样用 interpolate（<code>Easing.out(Easing.cubic)</code>）；hold 漂移是一条贯穿的线性 interpolate；出场放同一 Sequence 尾部用 <code>Easing.in(Easing.quart)</code>。</li><li>（实测变体）暗色纹理版：黑底 + 星座粒子 + 同心环做底，eyebrow 英文小字先出、主标衬线大字随后、副字再延迟 0.4s——三层错峰的骨架不变，只把&quot;品牌色块&quot;换成有纹理的暗场，适合叙事更重的长片开幕。见小Lin说·韩股崩盘。</li><li>（实测变体）荧光菱形徽章版：不用满屏色块压入，而是一枚菱形渐变徽章带章节数字从小弹大立在画面中，截图卡随后升入接管画面——章节卡与素材入场合成一拍，比&quot;盖屏再揭开&quot;省 0.5s，适合竖屏快节奏。见 TheAIScaler（Apm_oCzPEQs）。</li><li>剪辑软件对应物：剪映&quot;文字模板→片头/章节&quot;类 + &quot;向右擦除&quot;转场叠色块；AE 里是纯色层 Position 关键帧（Easy Ease 拉重入场）+ 文字层 Scale 关键帧 + 轨道遮罩（Track Matte）做章节名揭示；CapCut 搜 &quot;chapter title&quot; 模板。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：全屏色块 <code>xPercent -100→0</code> 压入盖屏（0.3s、<code>power4.inOut</code>）；编号 opacity 0→1 + scale 1.3→1 落位（0.4s、<code>power3.out</code>，在色块盖屏之后）；章节名 <code>clip-path inset(0 100%→0)</code> 侧向遮罩揭示（0.35s，比编号晚 0.18s）；小字再晚 0.1s 的 opacity + x −14→0；hold 期整组 x 0→10px 线性漂移防卡帧；色块<strong>同方向</strong>继续 <code>xPercent 0→100</code> 扫出（0.3s、<code>power4.in</code>）。这五段的先后与那条单向进出的运动语言就是本卡全部。</li><li>不属于本卡的：色块的颜色、编号的衬线字体与 216px 字号、章节名/小字的具体文案与字距、底下口播画面（主持人占位 + 字幕）、demo 连演两张卡与 <code>gapBetween</code> 间隔（仅示范节奏，实际由口播内容决定）。</li><li>迁移接口：<strong>色块颜色 = 复用者的品牌色接口</strong>——改 <code>.chapter-card.c1</code> / <code>.c2</code> 的 <code>background</code>（demo 收敛成中性灰阶两档 #1d1d1f / #55565a，换成品牌深色即可），色块上的文字色随之取反（当前 #ffffff）；节奏全在顶部 <code>CONFIG</code>（<code>wipeIn</code>/<code>numIn</code>/<code>nameIn</code>/<code>subDelay</code>/<code>hold</code>/<code>driftPx</code>/<code>wipeOut</code>）；编号字号按屏高 40% 折算，换尺寸时同比缩放；加章节 = 复制一段 <code>.chapter-card</code> DOM + 多调一次 <code>chapterBeat</code>。扫入扫出方向要保持同向，改方向须同时改两处。</li><li>底色要求：白底即可（色块自带满屏遮盖，底色只在色块进出的前后两拍露出）。色块本身必须与底色有足够明度差，白底配深色块、深底配亮色块。</li></ul>","color-slam-beat-card":"<h3>意图</h3><p>短口播每句都想是重音，但补间转场（扫屏、压入）本身要花 0.3~0.6s，一分钟里放五次就只剩转场在演。 纯色硬切把转场成本压到 0 帧：<strong>底色的跳变本身就是节拍器</strong>——观众不是&quot;看到画面被换掉&quot;， 而是&quot;感到被打了一拍&quot;。命门：<strong>零补间</strong>（一帧到位，任何淡入/擦除/缩放都会把节拍摊成动画表演）、 <strong>一片一色</strong>（一张卡一个高饱和纯色，出现第二个色或渐变，跳变的&quot;打击感&quot;立刻散掉）、 <strong>跳变之后才轮到元素动</strong>（硬切是节拍，卡上元素错峰入场是节拍之后的余韵，两者不能同帧抢戏）。</p><h3>动效核心</h3><ul><li>满屏纯色层 <code>.slam-card</code>（<code>position:absolute; inset:0</code>）：<code>tl.set()</code> 一帧 <code>autoAlpha 0→1</code> + 写入 <code>background</code>，<strong>零 duration</strong>——这是整张卡唯一的&quot;转场&quot;</li><li>大字 <code>.slam-title</code>（62~72px、800 字重、左栏竖向居中）：硬切同帧就已在位，但颜色是<strong>同色系淡色</strong>（tint，如底 <code>#1B3CF5</code> 配 <code>#8A9BFF</code>）；切后 0.18s 起 <code>color → #fff</code>，0.22s，<code>power2.out</code>——像相纸显影，不是淡入</li><li>小字戳 <code>.slam-sub</code>（字距 5px 的编号/副题）：比大字变实再晚 0.12s，<code>autoAlpha 0→1</code>，0.24s</li><li>素材卡 <code>.slam-shot</code>（白底 + 圆角 + 深投影，投影是&quot;实体被拍上来&quot;的语义）：与大字错峰 <strong>0.2~0.5s</strong> 后入场，<code>y +56px → 0</code> + <code>blur(10px) → 0</code> + <code>autoAlpha 0→1</code>，0.42s，<code>power3.out</code>——升入与模糊飞入同一条 tween</li><li>停留期（1.5~5s，由口播念完这句的时长决定）：元素<strong>不再做任何动作</strong>，只有整组 <code>y 0 → -8px</code> 线性漂移贯穿，纯粹防&quot;视频卡帧&quot;读法</li><li>切出二选一：① <strong>硬切</strong>（<code>tl.set(autoAlpha 0)</code>，零帧回口播——默认，节奏最硬）；② <strong>色块整体上移让位</strong>（<code>yPercent 0 → -100</code>，0.34s，<code>power3.out</code>，整块带元素一起走，底下口播从下方露出）</li><li>连续多卡时每张换一个高饱和底色，色相拉开（demo 演蓝 → 红），&quot;一片一色&quot;是纪律不是配色</li><li>与邻卡的分工：<code>shape-wipe-transition</code> 是色块扫过屏（0.6s 补间），<code>chapter-title-card</code> 是色块压入 + 编号章名分层（2.5s 仪式）；本卡<strong>零补间</strong>，节奏感全部来自跳变</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>切入过渡</td><td>0 帧</td><td>这是本卡的命；给它 0.1s 淡入就退化成普通标题卡，节拍变成动画</td></tr><tr><td><code>developAt</code></td><td>0.18s</td><td>硬切后多久大字开始变实；0 = 没有显影这一拍，大字读作静态贴图；&gt;0.4s 观众已经开始读淡色字了</td></tr><tr><td><code>developDur</code></td><td>0.22s</td><td>显影耗时；&gt;0.5s 读作&quot;加载中&quot;，&lt;0.1s 看不出显影、等于直接换色</td></tr><tr><td><code>subDelay</code></td><td>0.12s</td><td>小字戳与大字的错峰；0 则两层同出，层次塌掉</td></tr><tr><td><code>shotDelay</code></td><td>0.45s</td><td>大字 → 素材卡的错峰，0.2~0.5s；0 = 一坨糊上来，&gt;0.7s 卡上出现空档、观众以为没了</td></tr><tr><td><code>shotRise</code></td><td>56px</td><td>升入行程；&gt;120px 读作从画外飞进来抢戏，0 则只有模糊变化、没有&quot;升&quot;的方向</td></tr><tr><td><code>shotBlur</code></td><td>10px</td><td>模糊飞入起始值；0 = 只升不飞少了速度感，&gt;20px 前几帧糊成一团脏</td></tr><tr><td><code>hold</code></td><td>1.5~5s</td><td>停留 = 这句口播的长度；&lt;1.2s 大字读不完就跳走，&gt;5s 高饱和底色开始灼眼、观众想快进</td></tr><tr><td><code>driftPx</code></td><td>8px</td><td>停留期漂移量；0 读作视频卡帧，&gt;20px 读作运镜失误</td></tr><tr><td><code>liftOut</code></td><td>0.34s</td><td>上移让位耗时（仅 lift 出场）；&gt;0.5s 拖节奏，&lt;0.2s 不如直接硬切</td></tr><tr><td>底色饱和度</td><td>高饱和纯色</td><td>低饱和/灰调 = 跳变力度不足，读作换了张 PPT；渐变或双色 = &quot;一片一色&quot;破功，打击感散掉</td></tr></table><h3>已知坑</h3><ul><li>给硬切加了淡入/擦除/缩放——0.2s 的补间就把&quot;打了一拍&quot;摊成&quot;播了个动画&quot;，本卡唯一的机制当场失效。</li><li>底色用渐变、双色拼接或低饱和莫兰迪——跳变幅度不够，观众读作&quot;换了张幻灯片&quot;，不是节拍。</li><li>大字与素材卡同帧入场——两个动作抢同一拍，画面糊成一坨，错峰 0.2~0.5s 才有层次。</li><li>大字做淡入（opacity 0→1）而不是同色系淡色变实——淡入是&quot;字飞进来&quot;，显影是&quot;字一直在、只是浮出来&quot;，后者才不与硬切抢那一拍。</li><li>停留期完全静止——高饱和满屏纯色一旦一帧不动，观众第一反应是&quot;视频卡了&quot;，极缓漂移是最低成本的&quot;活着&quot;证明。</li><li>停留超过 5s——高饱和满屏色灼眼，节拍卡变成了罚站卡。</li><li>素材卡没有投影、直接贴在纯色底上——读作矢量插画的一部分，失去&quot;把证据拍上来&quot;的实体感。</li><li>连着三张卡用同一个底色——跳变了但色没变，等于只切了内容；每张换色（且各自一片一色）才是节拍器。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/color-slam-beat-card/index.html。核心函数 <code>slamBeat(tl, el, spec, at, exit)</code> 可整段摘走，<code>exit</code> 传 <code>&quot;cut&quot;</code>（硬切回）或 <code>&quot;lift&quot;</code>（色块上移让位）。换色改 <code>CONFIG.cards</code>（每项 <code>{bg, tint}</code>，tint = bg 的同色系淡色）；换文案改 <code>.slam-title</code> / <code>.slam-sub</code> 内文本；加卡 = 复制一段 <code>.slam-card</code> DOM + <code>CONFIG.cards</code> 多一项 + 多调一次 <code>slamBeat</code>；节奏全在顶部 <code>CONFIG</code>。</li><li>Remotion 移植：切入用<strong>帧判断而非 interpolate</strong>——<code>frame &gt;= cutFrame &amp;&amp; frame &lt; outFrame</code> 决定纯色层是否渲染（任何 interpolate 都会引入补间，破坏零帧硬切）；显影用 <code>interpolateColors(frame, [d, d+devF], [tint, '#fff'])</code>；素材卡 <code>interpolate(frame, [s, s+riseF], [56, 0], {easing: Easing.out(Easing.cubic), extrapolateRight:'clamp'})</code> 驱动 <code>translateY</code>，同区间另一条 interpolate 驱动 <code>filter: blur(Npx)</code>；停留漂移一条贯穿的线性 interpolate；lift 出场 <code>interpolate(frame, [o, o+liftF], [0, -100])</code> 驱动 <code>translateY%</code>。每张卡一个 <code>&lt;Sequence&gt;</code>，硬切 = 两个 Sequence 首尾相接、无 transition。</li><li>剪辑软件对应物：剪映/CapCut——纯色素材直接铺在主轨上，<strong>转场处不放任何转场</strong>（这就是全部），大字用关键帧只改文字颜色、素材卡用&quot;位置 + 模糊&quot;两条关键帧；AE——纯色层（Solid）按时间切入切出、层间不加效果，文字层用 Fill 颜色关键帧做显影，素材层 Position + Fast Box Blur 关键帧配 Easy Ease；上移让位 = 把纯色层与其子层预合成后打 Position 关键帧。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：<strong>满屏纯色层一帧硬切进出（零 duration、零擦除、零缩放）这个机制本身</strong>；大字从同色系淡色 <code>color → 实色</code> 的&quot;显影&quot;（切后 0.18s 起、0.22s、<code>power2.out</code>）；小字戳晚 0.12s 的 <code>autoAlpha</code> 跟进；素材卡与大字错峰 0.2~0.5s 后的 <code>y +56→0</code> + <code>blur 10→0</code> 同 tween 升入（0.42s、<code>power3.out</code>）；停留期元素静置 + 整组 <code>y 0→-8px</code> 线性漂移防卡帧；切出的两种收法（硬切 / <code>yPercent 0→-100</code> 整体上移让位 0.34s <code>power3.out</code>）；以及&quot;一张卡一个高饱和纯色、连续多卡换色&quot;这条纪律。</li><li>不属于本卡的：底下口播场景（数字人占位 + 字幕文案）、素材卡里的假截图/假图表内容、大字与小字的具体文案与字号字距、demo 连演两张卡与 <code>gapBetween</code> 间隔（仅示范节奏，实际由口播落点决定）、左字右卡的这套构图（元素落位可自由改，错峰时序才是本体）。</li><li>迁移接口：<strong>底色 = 复用者的品牌色接口，但有语义约束</strong>——改 <code>CONFIG.cards</code> 的 <code>bg</code>（每项另配一个同色系淡色 <code>tint</code> 作显影起点），必须是<strong>高饱和纯色、一片一色</strong>，多卡之间色相拉开；卡上文字色随底色明度取反（当前 <code>#fff</code> / <code>rgba(255,255,255,.78)</code>）。时序全在顶部 <code>CONFIG</code>，其中 <code>hold</code> 按每句口播实际时长逐卡改（1.5~5s），<code>developAt</code>/<code>shotDelay</code> 的错峰关系跟着总时长等比缩放即可；换尺寸时只需重算 <code>shotRise</code>（约屏高 10%）与字号，硬切与错峰时序与画幅无关；竖屏改成上字下卡时把素材卡的升入方向保持&quot;由下往上&quot;不要反。</li><li>底色要求：<strong>需要高饱和纯色底（动效语义必需，中性化契约的例外）</strong>——本卡的机制就是&quot;底色跳变当节拍器&quot;，白底或低饱和底根本没有可跳的变化，跳变幅度即动效强度。demo 的口播场景仍是白底（中性），只有节拍卡这一层用高饱和色，且该色是唯一的品牌色接口。</li></ul>","overexpose-flip-transition":"<h3>意图</h3><p>[[push-through-transition]] 是无重音的基准式，读作&quot;我穿过去了&quot;；过曝翻页在同一条 scale 轴上<strong>加一层曝光重音</strong>， 读作&quot;这一页翻完了&quot;。它比推穿更重，因为闪光是听觉重音的视觉对位——通常压在一句话的句末重音或音乐落点上。</p><p>做对的命门：① <strong>重音包络必须以切点为锚</strong>——切前升、切后落，不对称；把它写成一个居中的对称 tween， 峰值会被回落段截断，白底上 3% 的压暗等于没有重音（实测踩过）；② <strong>过曝不是白闪</strong>——峰值 0.42~0.55， 要能隐约看见内容；冲到 1.0 就变成另一张卡（纯白闪转场）；③ <strong>重音层极性随底色换</strong>——白底上白色叠加会被 完全吞掉，必须改成压暗一拍。这是六式里唯一与底色耦合的一式。</p><h3>动效核心</h3><p>时间结构（<code>cut = at + 0.55 − 0.10</code>，参数全在 <code>CONFIG.blow</code>）：</p><table><tr><th>阶段</th><th>时刻</th><th>出场镜头</th><th>重音层</th><th>入场镜头</th></tr><tr><td>推进证据物</td><td><code>at</code> → <code>at+0.55</code></td><td><code>scale 1.0→1.50</code> + <code>blur 0→4px</code>，<code>power2.in</code></td><td>—</td><td>停在 <code>scale 1.30</code> + <code>blur 6px</code></td></tr><tr><td>重音升段</td><td><code>cut−0.26</code> → <code>cut</code></td><td>继续推</td><td><code>opacity 0→peak</code>，<code>power2.in</code></td><td>—</td></tr><tr><td>切点</td><td><code>cut</code></td><td>开始 0.40s 淡出</td><td>峰值</td><td>开始 0.40s 淡入</td></tr><tr><td>重音落段</td><td><code>cut</code> → <code>cut+0.42</code></td><td>—</td><td><code>opacity peak→0</code>，<code>power2.out</code></td><td>沉降中</td></tr><tr><td>沉降</td><td><code>cut</code> → <code>cut+0.55</code></td><td>—</td><td>—</td><td><code>scale 1.30→1.03</code> + <code>blur→0</code>，<code>power2.out</code></td></tr></table><ul><li><strong>推到 1.5x 而不是 1.35x</strong>：这是&quot;推进证据物直到它占满画面&quot;的量——出场镜头的主体被推到出画，</li></ul><p>  观众的注意力被交到一个纯亮/纯暗的场，再从那里被拉进新镜头。失焦反而比推穿轻（4px 而非 7px），   因为亮心要看得清；糊过头会读作单纯的溶解。</p><ul><li><strong>不对称包络的实现</strong>：两条独立 tween，一条从 <code>cut − rise</code> 到 <code>cut</code> 升到峰值，一条从 <code>cut</code> 起回落。</li></ul><p>  写成一条 <code>yoyo</code> 或居中 keyframes 都会让峰值达不到设定值。</p><ul><li><strong>入场从 1.30 起步</strong>：比推穿的 1.16 更高，因为亮心散去时观众正在&quot;被拉出来&quot;，路程要更长才读得出拉出感。</li><li><strong><code>.flash</code> 是径向而不是均匀铺满</strong>：<code>radial-gradient(ellipse at 50% 46%, …)</code> 让重音有中心，</li></ul><p>  46% 是视觉重心（略高于几何中心）；均匀铺满读作调亮度而不是过曝。</p><p>Remotion 对应写法（<code>template/motion-systems/transitions.tsx</code>）：</p><ul><li>出场 shot：<code>{ tail: 12, path: [{t:0, scale:1.06}, ...blowoutOut(tEnd)] }</code>——<code>blowoutOut</code> 就是 <code>pushThroughOut(to:1.5, blur:4, dur:0.9)</code></li><li>入场 shot：<code>{ lead: 12, path: [...settleIn(leadSec, {from:1.3}), {t:9, scale:1.0}] }</code></li><li>叠加层（出场侧放，<code>at</code> = 叙事末尾秒；或入场侧放、<code>at</code> 取负落在 lead 里）：<code>&lt;Overexpose at={tEnd} peak={0.55} riseF={10} fallF={10} color=&quot;255, 250, 240&quot; /&gt;</code></li><li><code>Overexpose</code> 的 <code>riseF/fallF</code> 是帧数，内部就是上面那条不对称包络（<code>df&lt;=0</code> 走 <code>Easing.in</code>、<code>df&gt;0</code> 走 <code>Easing.out</code>）。</li><li>工程若已装 <code>env.tsx</code>，优先把闪光写进 <code>TRANSITION_FLASHES</code> 表统一管理，别在场景里散落。</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>出场推到多大 <code>outScale</code></td><td>1.50</td><td>&lt;1.35 与推穿无区别、重音显得无理由；&gt;1.7 主体早已出画，剩下几帧是空推</td></tr><tr><td>重音峰值 <code>peak</code></td><td>深底 0.42~0.55 / 白底 0.10</td><td>到 1.0 就是纯白闪转场（另一张卡）；深底 &lt;0.3 或白底 &lt;0.06 读作&quot;闪了一下但没意义&quot;</td></tr><tr><td>升段 <code>rise</code></td><td>0.26s（≈8 帧）</td><td>&lt;0.15s 读作爆闪/故障；&gt;0.4s 观众提前知道要换场，惊喜没了</td></tr><tr><td>落段 <code>fall</code></td><td>0.42s（≈13 帧）</td><td>必须比升段长（升快落慢才像曝光恢复）；等长读作机械闪烁</td></tr><tr><td>交叠帧数 <code>overlap</code></td><td>0.40s ≈ 12 帧</td><td>比推穿略短：重音已经盖住了边界，交叠可以更省</td></tr><tr><td>入场起手景别 <code>inScale</code></td><td>1.30</td><td>=1.16 读作推穿+闪光；&gt;1.45 拉出路程过长，落位拖沓</td></tr><tr><td>出场失焦 <code>outBlur</code></td><td>4px</td><td>比推穿的 7px 轻——亮心要看得清；&gt;8px 读作溶解</td></tr></table><h3>已知坑</h3><ul><li>重音包络居中写（对称 tween 或 <code>yoyo:true</code>）：升段被落段截断，峰值远达不到设定值，白底上等于没做。</li><li>白底工程照抄白色过曝层：叠加层被底色完全吞掉，转场重音消失。白底必须换成压暗一拍。</li><li>峰值冲到 1.0：变成纯白闪转场——那是另一种语法（零内容帧），不该混在本卡里。</li><li>闪光和切点错位：闪光峰值在切点后才到，观众先看到新画面再看到闪光，读作 bug。</li><li>只加闪光不加推进：静止画面上闪一下 = 相机闪光灯，没有动量交接，退化成硬切 + 特效。</li><li>一片里过曝翻页用了七八次：曝光重音会通胀，最后每次都不重要。2~4 次为上限。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/overexpose-flip-transition/index.html</code>。摘 <code>blowout(出场镜头, 入场镜头, 起始秒) → 结束秒</code></li></ul><p>  一个函数 + <code>CONFIG.blow</code> 一组参数 + <code>.flash</code> 那段 CSS；<code>hold()</code> 一起摘（转场两端要有慢推）。   <strong>白底工程直接用</strong>；深底工程把 <code>.flash</code> 的 <code>radial-gradient</code> 底色换成白色、<code>peak</code> 提到 0.42~0.55，包络和时序都不动。</p><ul><li>Remotion：<code>blowoutOut</code> + <code>settleIn(…, {from:1.3})</code> + <code>&lt;Overexpose&gt;</code>；有 <code>env.tsx</code> 时闪光进 <code>TRANSITION_FLASHES</code> 表。</li><li>家族关系：去掉重音层 = [[push-through-transition]]；把重音换成&quot;零内容的纯白帧&quot; = 白闪转场（另一语法）；</li></ul><p>  重音 + 硬切 + 零交叠 = [[black-slam-transition]]。同一边界只用一式。</p><ul><li>帧级压缩版（实测，小Lin说·韩股崩盘）：<strong>白闪 + 运动模糊斜扫</strong>——一层白色叠加冲到高位，同帧画面沿斜向拖模糊，</li></ul><p>  白闪落下时已换场，全程 0.1~0.2s。注意本卡&quot;重音层随底色换极性&quot;的定版约束同样适用。</p><ul><li>剪辑软件对应物：剪映&quot;闪白/曝光转场&quot;；AE 是 Exposure 关键帧 + 两侧 camera Z 位移；</li></ul><p>  达芬奇用 Flash 转场但要手动把包络改成不对称。</p><h3>动效范围</h3><ul><li>属于本卡的：出场 <code>scale 1.0→1.50</code> + <code>blur 0→4px</code> 的 <code>power2.in</code> 推进；入场 <code>scale 1.30→1.03</code> + <code>blur 6→0</code> 的</li></ul><p>  <code>power2.out</code> 拉出；<strong>重音层的不对称包络</strong>（切前 0.26s <code>power2.in</code> 升到峰值、切后 0.42s <code>power2.out</code> 回落，锚点是切点而非中点）；   交叠 0.40s（≈12 帧）交叉淡化与相机曲线分离；重音层为径向（中心 50% 46%）而非均匀铺满；   hold 期相机永不静止的慢推。</p><ul><li>不属于本卡的：两个镜头里的文字与配色（白/浅灰 tile + 灰字式名是&quot;认式子的标签&quot;，不是台词字幕）、</li></ul><p>  左上说明角标、<strong>重音是亮还是暗</strong>（随底色定，见迁移接口）、<code>.shot</code> 的 <code>inset:-14%</code> 具体数值。</p><ul><li>迁移接口：时序全在 <code>CONFIG.blow</code>（<code>out</code>/<code>overlap</code>/<code>settle</code>/<code>cutLead</code> + <code>peak</code>/<code>rise</code>/<code>fall</code>）；</li></ul><p>  <strong>重音层极性随底色切换</strong>——<code>peak</code> 是峰值强度，<code>.flash</code> 的底色决定压暗还是过曝：白底用暗压 6~10%（demo 值 0.10），   深底换回白色径向过曝 0.42~0.55（过曝要能隐约看见内容，到 1.0 就是另一张卡）；换尺寸不用改（只有 scale 轴 + 全屏叠加层）；   <code>blur</code> 按输出分辨率线性缩放。</p><ul><li>底色要求：白底可跑，<strong>但重音层必须换极性</strong>。实测教训：白色过曝叠加层在白底上会被完全吞掉，转场重音消失——</li></ul><p>  所以 demo 改成了全场压暗一拍（峰值 0.10 实测可见）。深色工程反过来用白色过曝。这是六式里唯一与底色耦合的一式。</p>","particle-weld-transition":"<h3>意图</h3><p>其余五式的动量都在<strong>相机</strong>上，粒子溶接的动量在<strong>物质</strong>上：观众读到的不是&quot;镜头动了&quot;， 而是&quot;同一批粒子跨过了边界&quot;。这叫物质连续性——它比相机连续性更强，因为它宣称的是 &quot;上一镜的东西变成了下一镜的东西&quot;，所以只能用在语义上真的成立的地方。</p><p>做对的命门：① <strong>两组粒子必须同 seed</strong>——出场散开的那批和入场聚拢的那批，尺寸、落点、错峰全部一致， 换了 seed 就是两批不同的粒子，物质连续性当场失效（观众说不出为什么，但&quot;不对&quot;）； ② <strong>同方向</strong>——出场向上飘散，入场也必须&quot;从下方继续向上&quot;，不能反过来往下落（那读作两次独立的粒子特效）； ③ <strong>粒子层在镜头之上</strong>——它跨过切点、盖住边界，这是本式不需要闪光也能藏住换场的原因； ④ <strong>主体在粒子聚拢的末段才成形</strong>（滞后 0.30s）——粒子先到、主体后成，顺序反了就成了&quot;主体出现 + 一堆装饰粒子&quot;。</p><h3>动效核心</h3><p>时间结构（<code>cut = at + 0.60 − 0.12</code>，参数全在 <code>CONFIG.weld</code>）：</p><table><tr><th>阶段</th><th>时刻</th><th>出场镜头</th><th>粒子层</th><th>入场镜头</th></tr><tr><td>碎解</td><td><code>at</code> → <code>at+0.48</code></td><td>主体 <code>opacity→0</code> + <code>y −14px</code> + <code>scale 1.03</code> + <code>blur 3px</code>，<code>power2.in</code></td><td>出场组错峰亮起（各自 <code>delay = r*0.26s</code>），<code>y → −rise*(0.55~1.15)</code> + <code>x ±sway</code>，<code>power2.out</code></td><td>停在 <code>scale 1.02</code></td></tr><tr><td>粒子消隐</td><td><code>at+delay+0.33</code> 起</td><td>—</td><td>出场组 0.30s 淡出</td><td>—</td></tr><tr><td>切点</td><td><code>cut = at+0.48</code></td><td>0.50s 淡出 <code>power1.inOut</code></td><td>入场组在 <code>cut−0.06 + r*0.20</code> 就位（落在 lead 里）</td><td>0.50s 淡入 + <code>scale →1.0</code></td></tr><tr><td>聚拢</td><td><code>cut</code> → <code>cut+0.70</code></td><td>—</td><td>入场组 <code>y: +rise*(0.5~1.0) → 0</code>、<code>x: ±sway → 0</code>，<code>power2.out</code>；末段 0.24s 淡出</td><td>主体先 <code>set</code> 到 <code>opacity 0</code> + <code>scale 0.94</code> + <code>y 16px</code></td></tr><tr><td>主体成形</td><td><code>cut+0.40</code> → <code>cut+0.82</code></td><td>—</td><td>已在消隐</td><td>主体 <code>opacity→1</code> + <code>scale→1</code> + <code>y→0</code>，0.42s <code>power2.out</code></td></tr></table><ul><li><strong>确定性伪随机（不用 <code>Math.random</code>）</strong>：<code>rnd(s) = fract(sin(s*127.1 + 311.7) * 43758.5453)</code>，</li></ul><p>  两组粒子调用 <code>makeParticles()</code> 时用同一个 <code>seed*1000 + i*7 + k</code> 键空间，于是逐颗对应。   Remotion 侧同一个 <code>rand(seed)</code> 实现（<code>transitions.tsx</code> 里的 <code>rand</code>），保证渲染确定性——   用 <code>Math.random</code> 会让每帧重算、渲染出闪烁的噪点。</p><ul><li><strong>粒子的生成包围盒 = 主体包围盒</strong>：demo 里 <code>HOME = {x:480, y:268, w:340, h:74}</code>（舞台 960×540 的字块）。</li></ul><p>  实战里应该取真实主体（图表/卡片/大字）的包围盒——粒子从主体所在的区域里长出来，才读作&quot;它碎了&quot;。   从全屏随机撒点会读作下雪。</p><ul><li><strong>错峰是碎解感的来源</strong>：每颗 <code>delay = r(3) * 0.26s</code>。全部同时起飞读作一次爆炸；</li></ul><p>  错峰超过 0.4s 则最后几颗还没起飞第一批已经消隐，读作零散。</p><ul><li><strong>两侧粒子的方向都是&quot;向上&quot;</strong>：出场组从主体位置往上走（<code>y</code> 负向），</li></ul><p>  入场组从主体位置<strong>下方</strong>（<code>y</code> 正的初值）往上走回 0。所以跨过切点看到的是一条不间断的上升流。   把入场组写成&quot;从上往下落回主体&quot;是最常见的错误——那是两次独立的粒子动画。</p><ul><li><strong>主体成形滞后</strong>：<code>cut + gather − 0.30</code>，即粒子快聚齐时主体才开始现形，0.42s <code>power2.out</code> 长成。</li></ul><p>  这 0.30s 的重叠让&quot;粒子变成了主体&quot;这件事被看见。</p><ul><li><strong>镜头层的相机动作很轻</strong>（入场 <code>1.02 → 1.0</code>）：本式的注意力在粒子上，相机抢戏会打散物质连续性。</li></ul><p>Remotion 对应写法（<code>template/motion-systems/transitions.tsx</code>）：</p><ul><li>出场 shot：主体用 <code>&lt;Shatter at={tEnd-0.6} dur={0.6}&gt;</code> 包起来（轻升 + 模糊 + 淡出的&quot;壳&quot;），同位置放一次 <code>&lt;ParticleDrift at={tEnd-0.6} seed={7} count={36} box={主体包围盒} rise={180} /&gt;</code></li><li>入场 shot：同一个 seed 再放一次，<code>at</code> 取负（落在 lead 里）：<code>&lt;ParticleDrift at={-0.5} seed={7} count={36} box={新主体包围盒} rise={180} /&gt;</code></li><li><code>seed</code> 必须两侧一致，<code>count</code> / <code>rise</code> 也建议一致；<code>box</code> 换成各自主体的包围盒即可——<strong>位置可以变，&quot;是同一批&quot;由 seed 保证</strong>。</li><li>像素淡化仍交给 <code>&lt;ShotFade&gt;</code>，粒子层不参与镜头淡化（它在镜头之上跨过切点）。</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>seed</code></td><td>7（两组<strong>必须相同</strong>）</td><td>不同 seed = 两批粒子，物质连续性立刻失效；具体值无所谓，一致最重要</td></tr><tr><td>粒子数 <code>count</code></td><td>18（demo）/ 36（Remotion 默认）</td><td>&lt;10 读作几个小方块在飞；&gt;60 在白底上读作噪点/脏</td></tr><tr><td>上升位移 <code>rise</code></td><td>200px @540 舞台高</td><td>&lt;100px 粒子还在主体附近就消隐，读不出&quot;离开&quot;；&gt;350px 出画后再回来，聚拢显得突然</td></tr><tr><td>横向漂移 <code>sway</code></td><td>46px</td><td>0 读作机械上升；&gt;90px 粒子散得太开，聚拢时像被吸进去（可用于刻意的&quot;漩涡&quot;效果）</td></tr><tr><td>出场碎解 <code>out</code></td><td>0.60s</td><td>&lt;0.4s 主体&quot;啪&quot;地消失，碎解没发生；&gt;0.9s 观众等粒子飘完</td></tr><tr><td>入场聚拢 <code>gather</code></td><td>0.70s</td><td>比碎解略长（散容易、聚要看清）；&lt;0.45s 读作粒子被吸走；&gt;1.1s 拖沓</td></tr><tr><td>交叠帧数 <code>overlap</code></td><td>0.50s ≈ 15 帧</td><td>偏长——粒子层要有时间跨过边界；&lt;0.35s 换场那一下会露出来</td></tr><tr><td>主体成形滞后</td><td><code>gather − 0.30s</code></td><td>0（同时）读作&quot;主体出现 + 装饰粒子&quot;；&gt;0.5s 粒子已散尽主体才来，因果断裂</td></tr><tr><td>每颗错峰 <code>delay</code></td><td><code>r * 0.26s</code></td><td>0 读作一次爆炸；&gt;0.4s 首尾脱节</td></tr><tr><td>粒子尺寸</td><td>5~12px @960 舞台宽</td><td>太小读作噪点；太大读作方块碎片（也可以是刻意风格）</td></tr></table><h3>已知坑</h3><ul><li>两组粒子用了不同 seed（或干脆用 <code>Math.random</code>）：不是&quot;同一批粒子&quot;，物质连续性失效；</li></ul><p>  <code>Math.random</code> 还会让 Remotion 每帧重算，渲染出闪烁。</p><ul><li>入场粒子从上往下落回主体：方向反了，读作两次独立的粒子特效而不是一次溶接。</li><li>粒子从全屏随机撒点：读作下雪/星空，不是&quot;主体碎了&quot;。生成盒必须是主体包围盒。</li><li>粒子层放在镜头层下面：换场边界露出来，本式就白做了（它正是靠粒子跨过切点盖住边界）。</li><li>主体与粒子同时出现：因果颠倒，读作&quot;新主体带了一堆装饰粒子&quot;。主体必须滞后。</li><li>粒子全部同时起飞/同时落定：读作爆炸 + 吸入，不是碎解 + 溶接。错峰是必需的。</li><li>出场主体只淡出没有&quot;轻升 + 失焦&quot;：壳没有碎解的过程，粒子像凭空生出来的。</li><li>相机同时做大幅推拉：抢走注意力，物质连续性被相机运动掩盖。本式相机要轻。</li><li>用在语义不成立的边界（两镜内容毫无关系）：观众读到&quot;这两个东西是同一个&quot;，然后发现不是，比硬切更困惑。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/particle-weld-transition/index.html</code>。摘 <code>particleWeld(出场镜头, 入场镜头, 起始秒) → 结束秒</code></li></ul><p>  + <code>CONFIG.weld</code> + <code>rnd()</code> + <code>makeParticles()</code> + <code>#weld</code> 那段 CSS。   <strong><code>HOME</code> 要改成你的主体包围盒</strong>（demo 是舞台 960×540 里的字块 <code>{x:480,y:268,w:340,h:74}</code>）；   出/入两组都调 <code>makeParticles()</code>，函数内的 seed 键空间保证两组逐颗对应，不要给它们不同的 seed。<code>hold()</code> 一起摘。</p><ul><li>Remotion：<code>&lt;Shatter&gt;</code> 包出场主体 + 两侧 <code>&lt;ParticleDrift seed={同一个值}&gt;</code>（入场侧 <code>at</code> 取负落在 lead 里）；</li></ul><p>  <code>box</code> 换成各自主体的包围盒。<code>rand(seed)</code> 已在 <code>transitions.tsx</code> 里，别引入 <code>Math.random</code>。</p><ul><li>家族关系：本式是六式里唯一动量不在相机上的一式，因此<strong>它可以和很轻的相机运动共存</strong>，</li></ul><p>  但不要和 [[whip-pan-transition]] / [[black-slam-transition]] 这类强相机式在同一边界叠用。   想要&quot;物质感&quot;但语义上两镜无关时，改用 [[push-through-transition]] 更诚实。</p><ul><li>剪辑软件对应物：AE 是 CC Particle World / Particular 两次发射（同 seed）+ Turbulent Displace，</li></ul><p>  或 Trapcode Form 的双向 morph；剪映/CapCut 的&quot;粒子/星光转场&quot;是预制版但两侧不同 seed，   只能读作装饰——本卡的关键正是把两侧绑成同一批。</p><h3>动效范围</h3><ul><li>属于本卡的：出场侧主体的碎解壳（<code>opacity→0</code> + <code>y −14px</code> + <code>scale 1.03</code> + <code>blur 3px</code>，<code>power2.in</code>）；</li></ul><p>  出场组粒子从<strong>主体包围盒</strong>内错峰（<code>r*0.26s</code>）亮起、<code>power2.out</code> 向上飘散（<code>rise*(0.55~1.15)</code> + <code>x ±sway</code>）、   各自 0.30s 淡出；入场组粒子<strong>同 seed 逐颗对应</strong>、在切点前后就位、从主体位置<strong>下方继续向上</strong>收拢回 0（<code>power2.out</code> 0.70s）；   粒子层 <code>z-index</code> 高于镜头层（跨过切点盖住边界，本式不需要闪光的原因）；   主体成形滞后到粒子聚齐前 0.30s（0.42s <code>power2.out</code> 长成）；交叠 0.50s（≈15 帧）交叉淡化；   确定性伪随机（<code>fract(sin(s*127.1+311.7)*43758.5453)</code>，禁用 <code>Math.random</code>）；hold 期相机永不静止的慢推。</p><ul><li>不属于本卡的：两个镜头里的文字与配色（白/浅灰 tile + 灰字式名是&quot;认式子的标签&quot;，不是台词字幕）、</li></ul><p>  左上说明角标、<strong>粒子是方块还是圆点/发光</strong>（demo 用 2px 圆角深色方块，Remotion 默认是发光圆点）、   粒子颜色、<code>HOME</code> 包围盒的具体数值（应取真实主体）、<code>.shot</code> 的 <code>inset:-14%</code> 具体数值。</p><ul><li>迁移接口：时序全在 <code>CONFIG.weld</code>（<code>out</code>/<code>overlap</code>/<code>gather</code>/<code>cutLead</code>）；</li></ul><p>  <strong>两组粒子必须同 <code>seed</code></strong>（换了就不是&quot;同一批粒子&quot;，物质连续性立刻失效——这是本卡最硬的约束）；   换尺寸时 <code>rise</code> 按屏高比例缩放、<code>sway</code> 与粒子尺寸按屏宽比例缩放；   <code>HOME</code>（Remotion 侧是 <code>box</code>）换成你的主体包围盒——<strong>位置可以两侧不同</strong>（新主体在别处也没关系），   &quot;是同一批&quot;由 seed 而不是位置保证；<code>count</code> 按底色调（白底上 &gt;60 颗会读作脏）。</p><ul><li>底色要求：白底即可（demo 粒子用深色 <code>#1d1d1f</code>）。深色工程把粒子换成亮色/发光即可，</li></ul><p>  时序与方向不动。本式不含闪光叠加层，因此没有 [[overexpose-flip-transition]] 那种极性反转问题。</p>","pullback-cool-transition":"<h3>意图</h3><p>其余五式都在往前推、往旁甩、往里撞，处理的是&quot;信息还在增加&quot;。后拉冷却是唯一往后走的一式： 它让观众<strong>退开一步</strong>——上一段的内容自己沉下去（不是被推走），新一段从远处慢慢拉近到工作景别。 用在情绪收束点，它给出一次合法的呼吸；用错在信息推进段，整片节奏会当场塌掉。</p><p>做对的命门：① <strong>相机收住，让内容自己退场</strong>——出场侧的动作不在相机上（<code>scale</code> 回到 1.0 就停）， 而在内容的亮度/焦点上；相机还在推的同时内容在沉暗，两个方向打架，读作&quot;没做完&quot;； ② <strong>入场是全片唯一 scale&lt;1 起步</strong>——这个稀缺性就是本式的识别标志，别的地方用了它就不特殊了； ③ <strong>节奏要真的慢</strong>——<code>settle</code> 0.90s 是六式里最长的，交叠 0.55s 也是最长的；照抄推穿的 0.6s 会读作&quot;后拉但很急&quot;， 自相矛盾。</p><h3>动效核心</h3><p>时间结构（<code>cut = at + 0.50 − 0.05</code>，参数全在 <code>CONFIG.pull</code>）：</p><table><tr><th>阶段</th><th>时刻</th><th>出场镜头</th><th>入场镜头</th></tr><tr><td>内容沉暗</td><td><code>at</code> → <code>at+0.50</code></td><td><strong>内容层</strong>（不是镜头层）<code>opacity 1→0.18</code> + <code>blur 0→2px</code>，<code>sine.in</code>；<strong>镜头层</strong> <code>scale →1.0</code> 收住，<code>sine.out</code></td><td>停在 <code>scale 0.90</code> + <code>blur 4px</code></td></tr><tr><td>切点</td><td><code>cut = at+0.45</code></td><td>0.55s 淡出，<code>sine.inOut</code></td><td>0.55s 淡入，<code>sine.inOut</code></td></tr><tr><td>后拉落定</td><td><code>cut</code> → <code>cut+0.90</code></td><td>—</td><td><code>scale 0.90→0.99</code> + <code>blur 4→0</code>，<code>power2.out</code></td></tr><tr><td>交班</td><td>—</td><td>—</td><td>hold 期慢推（从 0.99 继续 +0.03，<code>sine.inOut</code>）</td></tr></table><ul><li><strong>出场侧分两层写</strong>：内容层沉暗（demo 里是 <code>.big</code> 大字，实战里是整个主体面）、</li></ul><p>  镜头层把 scale 收回 1.0。这不是&quot;相机不动&quot;，而是&quot;相机停止发力&quot;——它从 hold 期的慢推里减速到静止，   是一次减速而不是一次停顿（和 [[black-slam-transition]] 的定格截然不同：那里是硬停，这里是软收）。</p><ul><li><strong>深底 vs 白底的沉暗语义</strong>：深色工程里是&quot;内容沉入近黑&quot;（亮度归零，环境吃掉主体）；</li></ul><p>  白底 demo 里等价物是&quot;褪灰失焦&quot;（<code>opacity 0.18</code> + 2px 模糊）。两者视觉不同、语义相同：内容主动退场。   这一层是<strong>场景内的事</strong>，不在相机 rig 上，所以两种底色的写法可以不同而不影响相机曲线。</p><ul><li><strong>全部用 <code>sine</code> 系缓动</strong>（<code>sine.in</code> / <code>sine.out</code> / <code>sine.inOut</code>）：正弦缓动没有 <code>power</code> 系的陡峭段，</li></ul><p>  读作&quot;呼吸&quot;而不是&quot;动作&quot;。只有最后的后拉用 <code>power2.out</code>（要有落定感，不能一直飘）。</p><ul><li><strong>落点 0.99 不是 1.0</strong>：留 0.01 给 hold 期继续推——本式最慢，但依然不许静止（相机永不静止是全库铁律）。</li><li><strong>交叠 0.55s（≈16 帧）是全六式最长</strong>：因为两侧都很轻（一个在沉暗、一个在缓慢放大），</li></ul><p>  交叠短了会看到&quot;旧的还没沉完新的已经全亮&quot;的重影。</p><ul><li><strong>色温</strong>：实战里这一式常配色温转冷（<code>env.tsx</code> 的 <code>ACTS</code> 表在幕边界做 1.2s cross-fade）。</li></ul><p>  色温不属于本卡动效本体（见动效范围），但它是这一式最常见的同伴。</p><p>Remotion 对应写法（<code>template/motion-systems/transitions.tsx</code>）：</p><ul><li>出场 shot（相机侧只写&quot;收住&quot;：末键把 scale 停在 1.0，之后不再加键；沉暗在场景内做）：<code>{ tail: 16, path: [{t:0, scale:1.05}, {t:tEnd, scale:1.0}] }</code></li><li>入场 shot（全片唯一 scale&lt;1 起步）：<code>{ lead: 16, path: [...pullBackIn(leadSec), {t:9, scale:1.0}] }</code></li><li><code>pullBackIn(leadSec, {from:0.94, to:0.99, blur:4, settle:0.9})</code> 生成两个 CamKey，首键 <code>t</code> 取负（落在 lead 里）。</li><li>出场侧的内容沉暗用场景自己的 <code>interpolate</code>（亮度/滤镜），或直接走 <code>life.tsx</code> 的 <code>&lt;Live retireAt&gt;</code> 让位状态机——它本来就做&quot;缩 0.92 + 上移 + 亮度 −66% + 3px 模糊&quot;。</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>入场起手景别 <code>inScale</code></td><td>0.90</td><td>&gt;0.95 后拉量太小、读不出&quot;退一步&quot;；&lt;0.82 四周露底（镜头层必须铺过画幅），且落定路程过长</td></tr><tr><td>入场后拉时长 <code>settle</code></td><td>0.90s</td><td>全六式最长。&lt;0.6s 读作&quot;急着后拉&quot;，与冷却语义打架；&gt;1.4s 观众等不住</td></tr><tr><td>交叠帧数 <code>overlap</code></td><td>0.55s ≈ 16 帧</td><td>全六式最长。&lt;0.4s 出现新旧重影（两侧动作都很轻，遮不住边界）；&gt;0.7s 两场糊在一起</td></tr><tr><td>出场沉暗时长 <code>out</code></td><td>0.50s</td><td>&lt;0.3s 内容&quot;啪&quot;地暗掉读作断电；&gt;0.8s 观众盯着一个正在变暗的画面等待</td></tr><tr><td>沉暗深度 <code>outDim</code></td><td>0.18（白底）/ 近黑（深底）</td><td>&gt;0.4 沉得不够、读作&quot;轻微变淡&quot;；到 0 就成了纯色帧转场（另一语法）</td></tr><tr><td>出场失焦 <code>outBlur</code></td><td>2px</td><td>比推穿轻得多——本式不靠速度模糊，靠焦点撤离；&gt;5px 读作被推走</td></tr><tr><td>切点提前量 <code>cutLead</code></td><td>0.05s</td><td>全六式最小：交接靠&quot;暗&quot;而不是靠&quot;快&quot;，不需要提前吃掉加速段</td></tr><tr><td>后拉落点 <code>inSettle</code></td><td>0.99</td><td>落到 1.0 再静止 = 撞墙；留 0.01 给 hold 继续推</td></tr></table><h3>已知坑</h3><ul><li>出场侧相机还在推、内容同时在沉暗：两个方向打架，读作&quot;这一镜没做完&quot;。相机必须先收住。</li><li>照抄推穿的 0.6s settle：变成&quot;急促的后拉&quot;，与冷却语义自相矛盾。本式的慢是它的内容。</li><li>入场 scale&lt;1 在片子别处也用了：稀缺性一失效，本式就只是&quot;淡入 + 轻微放大&quot;。</li><li>交叠给短了（&lt;0.4s）：两侧动作都轻，遮不住边界，出现新旧画面重影。</li><li>用 <code>power3</code>/<code>back</code> 系缓动：陡峭段让&quot;呼吸&quot;变成&quot;动作&quot;，冷却感消失。sine 系是本式的语法。</li><li>沉暗写在镜头层（把整镜 <code>opacity</code> 拉到 0.18 再淡出）：那只是双重淡出，看不出&quot;内容主动退场&quot;。</li></ul><p>  沉暗必须作用在内容层，镜头层的淡出交给交叠包络。</p><ul><li>镜头层没铺过画幅：<code>scale 0.90</code> 起手时四周直接漏底色。demo 用 <code>.shot { inset:-14% }</code> 兜住。</li><li>用在信息推进段：整片节奏塌一次，观众以为要结束了。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/pullback-cool-transition/index.html</code>。摘 <code>pullBack(出场镜头, 入场镜头, 起始秒) → 结束秒</code></li></ul><p>  一个函数 + <code>CONFIG.pull</code> 一组参数。<strong>注意函数内部取了 <code>out.querySelector(&quot;.big&quot;)</code></strong>——   沉暗作用在内容层而不是镜头层，迁移时把这个选择器换成你的主体面容器。<code>hold()</code> 一起摘。</p><ul><li>Remotion：<code>pullBackIn(leadSec)</code> spread 进入场 shot 的 <code>path</code>（首键 <code>t</code> 取负）；</li></ul><p>  出场侧相机只写&quot;收住&quot;（末键 <code>scale: 1.0</code> 后不再加键），内容沉暗在场景内做或直接用 <code>life.tsx</code> 的 <code>&lt;Live retireAt&gt;</code>。   色温转冷在 <code>env.tsx</code> 的 <code>ACTS</code> 表配。</p><ul><li>家族关系：它是 [[push-through-transition]] 的反向式（那个 scale&gt;1 沉降，这个 scale&lt;1 拉近），</li></ul><p>  两者的入场起手方向相反，所以<strong>同一片里两式可以互补使用</strong>：推进段用推穿、收束段用后拉冷却。   与 [[black-slam-transition]] 的区别：那里相机硬停一拍（信号），这里相机软收（呼吸）。</p><ul><li>剪辑软件对应物：剪映&quot;运镜转场→拉远&quot;类 + 前一镜的&quot;亮度/模糊&quot;关键帧；</li></ul><p>  AE 是后镜 camera Z 从远处推近 + Easy Ease，前镜用 Exposure/Camera Lens Blur 关键帧；   达芬奇里常与一次 rack focus + 色温 offset 同帧做。</p><h3>动效范围</h3><ul><li>属于本卡的：出场侧<strong>相机收住</strong>（从 hold 的慢推 <code>sine.out</code> 减速到 <code>scale 1.0</code> 静止，不推不拉）</li></ul><p>  + <strong>内容层</strong>沉暗失焦（<code>opacity 1→0.18</code> + <code>blur 0→2px</code>，<code>sine.in</code>，作用在主体面而非镜头层）；   入场侧<strong>全片唯一 scale&lt;1 起步的后拉</strong>（0.90→0.99 + <code>blur 4→0</code>，<code>power2.out</code>，<code>settle</code> 0.90s 是全六式最长）；   交叠 0.55s（≈16 帧，全六式最长）的 <code>sine.inOut</code> 交叉淡化；切点提前量最小（0.05s，交接靠&quot;暗&quot;不靠&quot;快&quot;）；   全程 sine 系缓动的呼吸质感；落点留 0.01 给 hold 期慢推（相机永不静止）。</p><ul><li>不属于本卡的：两个镜头里的文字与配色（白/浅灰 tile + 灰字式名是&quot;认式子的标签&quot;，不是台词字幕）、</li></ul><p>  左上说明角标、<strong>沉暗的具体视觉</strong>（深底=沉入近黑 / 白底=褪灰失焦，语义相同视觉不同）、   <strong>色温转冷</strong>（常见同伴，但它在 <code>env.tsx</code> 的 <code>ACTS</code> 表里，属于环境层不属于本卡）、<code>.shot</code> 的 <code>inset:-14%</code> 具体数值。</p><ul><li>迁移接口：时序全在 <code>CONFIG.pull</code>（<code>out</code>/<code>overlap</code>/<code>settle</code>/<code>cutLead</code> + <code>outDim</code>/<code>inScale</code>/<code>inSettle</code>）；</li></ul><p>  换尺寸不用改（只有 scale 轴）；<code>outBlur</code>/<code>inBlur</code> 按输出分辨率线性缩放；   沉暗深度按底色改（白底 <code>outDim: 0.18</code>，深底改成亮度趋零）——<strong>沉暗必须挂在内容层</strong>，   换工程时把 <code>out.querySelector(&quot;.big&quot;)</code> 换成你的主体面容器；<code>inScale</code> 是本式的识别标志，   别在片子别处再用 scale&lt;1 起步。</p><ul><li>底色要求：白底即可。沉暗的实现随底色变（白底褪灰、深底沉黑），但这是<strong>场景内的内容动作</strong>，</li></ul><p>  不是叠加层，所以不像 [[overexpose-flip-transition]] 那样存在极性反转问题。相机曲线与底色完全无关。</p>","push-through-transition":"<h3>意图</h3><p>硬切翻页是 PPT 感四病根之一：Sequence 边界内容整体瞬换，观众被&quot;扔&quot;进新场景。 推穿是运动承接家族里的<strong>基准式</strong>——出场镜头把相机加速推出去，入场镜头以同一方向的余势接住再刹住， 观众读到的不是&quot;换了一张图&quot;，而是&quot;我穿过去了&quot;。它没有闪光、没有位移、没有粒子，只有一条 scale 轴， 所以最安全、最可反复使用，也是判断&quot;这一版转场到底有没有动量&quot;的对照组。</p><p>做对的命门：① <strong>两侧同向</strong>——出场推近（scale 变大）、入场必须从更大的 scale 往回沉降， 方向断裂（出场推近 + 入场从 0.9 拉出）比硬切更糟；② <strong>淡化只管像素</strong>——透明度包络和相机曲线彻底分开写， 运动全在相机上；③ <strong>入场不要沉回 1.0 就撒手</strong>——落点停在 1.03，紧接着的 hold 从这里继续慢推，进场即自带运动。</p><h3>动效核心</h3><p>时间结构（<code>at</code> = 出场镜头开始交出画面的那一刻，全在 <code>CONFIG.push</code> 里）：</p><table><tr><th>阶段</th><th>时刻</th><th>出场镜头</th><th>入场镜头</th></tr><tr><td>加速推</td><td><code>at</code> → <code>at+0.55</code></td><td><code>scale 1.0→1.35</code> + <code>blur 0→7px</code>，<code>power2.in</code></td><td>静默，停在 <code>scale 1.16</code> + <code>blur 7px</code></td></tr><tr><td>切点</td><td><code>cut = at + 0.55 − 0.10</code></td><td>开始 0.45s 淡出 <code>power1.inOut</code></td><td>开始 0.45s 淡入 <code>power1.inOut</code></td></tr><tr><td>沉降</td><td><code>cut</code> → <code>cut+0.60</code></td><td>—</td><td><code>scale 1.16→1.03</code> + <code>blur 7→0</code>，<code>power2.out</code></td></tr><tr><td>交班</td><td><code>cut+0.60</code> 之后</td><td>—</td><td>hold 期慢推（<code>sine.inOut</code>，从 1.03 继续 +0.04）</td></tr></table><ul><li><strong>切点提前 0.10s（<code>cutLead</code>）</strong>：交叠期在出场推到顶之前就开始，出场镜头最快的一段和入场镜头的沉降重合，</li></ul><p>  这段重合就是&quot;承接&quot;本身。若把切点放在出场推完之后，中间会出现一帧两边都不在动的空档，动量断掉。</p><ul><li><strong>加速用 <code>power2.in</code>、沉降用 <code>power2.out</code></strong>：出场是&quot;越来越快地离开&quot;，入场是&quot;越来越慢地落定&quot;，</li></ul><p>  两段缓动首尾相接读作一次连续的加速—减速，这是 match-on-action 的时间形状。</p><ul><li><strong>失焦是速度的证据</strong>：<code>blur</code> 与 scale 同曲线升降；只推不糊会像 Keynote 的 Magic Move，糊了才有镜头感。</li><li><strong>镜头层要超出画幅</strong>：demo 里 <code>.shot { inset: -14% }</code>（对称 inset ⇒ 画面中心不变），</li></ul><p>  推近/沉降时不漏白边；Remotion 里等价于场景自己用 <code>AbsoluteFill</code> 铺满，相机变换加在外层 rig 上。</p><p>Remotion 对应写法（<code>template/motion-systems/transitions.tsx</code>，生成器直接 spread 进 <code>shots.ts</code> 的 <code>path</code>）：</p><ul><li>出场 shot（叙事末尾 tEnd 秒起加速推）：<code>{ tail: 14, path: [{t:0, scale:1.06}, ...pushThroughOut(tEnd)] }</code></li><li>入场 shot（lead 内从模糊高位起步，settle 秒沉降到工作景别）：<code>{ lead: 14, path: [...settleIn(leadSec), {t:9, scale:1.0}] }</code></li><li><code>pushThroughOut(tEnd, {from:1.06, to:1.2, blur:7, dur:0.5})</code> 生成两个 CamKey；<code>settleIn(leadSec, {from:1.14, to:1.04, blur:6, settle:0.5})</code> 的第一个键 <code>t</code> 取负（落在 lead 里）。</li><li>像素淡化交给 <code>&lt;ShotFade lead tail narrationFrames&gt;</code>，不要把位移写进去。</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>交叠帧数 <code>overlap</code></td><td>0.45s ≈ 14 帧</td><td>&lt;10 帧读作硬切；&gt;20 帧两场糊在一起，谁都看不清</td></tr><tr><td>出场加速时长 <code>out</code></td><td>0.55s</td><td>&lt;0.3s 从静止直接甩=没有预备拍，观众跟不上；&gt;0.8s 读作&quot;慢慢放大&quot;而不是推穿</td></tr><tr><td>出场推到多大 <code>outScale</code></td><td>1.35</td><td>1.15 以下动量不够、读作轻微缩放；&gt;1.6 是过曝翻页的量级，该换那一式</td></tr><tr><td>切点提前量 <code>cutLead</code></td><td>0.10s</td><td>0 = 出场推完才切，中间一帧静止把动量掐断；&gt;0.2s 交叠吃掉加速段，推的感觉没建立起来</td></tr><tr><td>入场起手景别 <code>inScale</code></td><td>1.16</td><td>=1.0 就没有反向沉降（等于淡入）；&gt;1.3 沉降路程太长，落位拖沓</td></tr><tr><td>失焦峰值 <code>outBlur/inBlur</code></td><td>7px</td><td>0 读作 PPT 缩放；&gt;12px 交叠期糊成一团，观众丢失空间连续性</td></tr><tr><td>入场落点</td><td>1.03（不是 1.0）</td><td>落到 1.0 再静止 = 撞墙；留 0.03 给 hold 继续推，进场即自带运动</td></tr></table><h3>已知坑</h3><ul><li>两侧曲线各写各的忘了对方向：出场推近、入场从 0.9 拉出——方向断裂，比硬切更刺眼。</li><li>把运动写进 <code>ShotFade</code>：透明度和位移耦合，改一处坏两处，且没法单独调交叠帧数。</li><li>只推不糊：<code>blur</code> 全程 0，读作 Keynote Magic Move，没有镜头速度。</li><li>入场沉降到 1.0 后彻底静止：撞墙感，紧接的 hold 必须接着推/漂。</li><li>镜头层没铺过画幅：推近时四周漏底色（白底上是白边，一眼穿帮）。</li><li>lead 补偿漏算：入场侧相机片段的 <code>t</code> 忘了取负，沉降从叙事第 0 帧才开始，交叠期入场镜头是静止的。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/push-through-transition/index.html</code>。核心是 <code>pushThrough(出场镜头, 入场镜头, 起始秒) → 转场结束秒</code></li></ul><p>  一个函数 + <code>CONFIG.push</code> 一组参数，整段可直接摘走；<code>hold()</code> 是镜头停留期的慢推，也一起摘（没有它转场两端会撞墙）。</p><ul><li>Remotion：<code>transitions.tsx</code> 的 <code>pushThroughOut</code> / <code>settleIn</code> spread 进 <code>shots.ts</code>：</li></ul><p>  <code>path: [...settleIn(0.47), {t:9, scale:1.0}, ...pushThroughOut(18.4)]</code>；组装范例见 <code>MainVideo-example.tsx</code>。</p><ul><li>与家族其他式的关系：推穿是基准式，<strong>加重音层</strong>就是 [[overexpose-flip-transition]]（推到 1.5x + 闪光），</li></ul><p>  <strong>换成横轴</strong>就是 [[whip-pan-transition]]，<strong>反向</strong>就是 [[pullback-cool-transition]]。同一个边界只用一式。</p><ul><li>帧级压缩版（实测，真实竖屏口播）：<strong>crash-zoom 甩镜</strong>（Apm_oCzPEQs）= 出场 2~3 帧内相机猛推到 1.4x 以上并叠拖影，</li></ul><p>  入场接住余势后拉刹住——推穿的暴力版，总时长压到 0.1~0.2s，用在最强反转句上，一片一次。</p><ul><li>剪辑软件对应物：剪映&quot;运镜转场→推近&quot;类；AE 是手 K 两侧 camera null 的 Z 位移 + Camera Lens Blur——本卡把手 K 固化成了参数。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：相邻镜头交叠 0.45s（≈14 帧）、两侧同时在动的时间结构；出场侧 <code>scale 1.0→1.35</code> + <code>blur 0→7px</code> 的</li></ul><p>  <code>power2.in</code> 加速推；入场侧从 <code>scale 1.16</code> + <code>blur 7px</code> 反向沉降到 1.03 的 <code>power2.out</code>；   切点提前 0.10s 让加速段与沉降段重合；透明度包络（0.45s <code>power1.inOut</code> 交叉淡化）与相机曲线分离；   入场落点留 0.03 余量交给 hold 期的慢推（<code>sine.inOut</code>，相机永不静止）。</p><ul><li>不属于本卡的：两个镜头里的文字与配色（demo 用白/浅灰 tile + 灰字式名只为区分&quot;换了一镜&quot;并标出正在演哪一式，是标注不是台词字幕）、</li></ul><p>  左上说明角标、<code>.shot</code> 的 <code>inset:-14%</code> 具体数值（按最大 scale 折算即可）。</p><ul><li>迁移接口：时序全在 <code>CONFIG.push</code>（<code>out</code> 出场 / <code>overlap</code> 交叠 / <code>settle</code> 入场 / <code>cutLead</code> 切点提前量）；</li></ul><p>  换尺寸不用改（本式只有 scale 轴，与画幅无关）；改动量强度只动 <code>outScale</code> + <code>inScale</code> 这一对，   <strong>且必须同时同向</strong>（出场变大、入场从更大处沉降）；<code>blur</code> 按输出分辨率线性缩放（1080p 用 7px，4K 用 14px）。</p><ul><li>底色要求：白底即可。本式不含叠加层，相机曲线与底色完全无关。</li></ul>","shape-wipe-transition":"<h3>意图</h3><p>口播里硬切换话题会让观众&quot;没跟上&quot;，色块扫屏给出一个 0.6s 的强节奏信号：上一章翻篇了。 命门：<strong>多层错峰</strong>（单层就是拉幕布，2~3 层错峰才有&quot;刷&quot;的层次）、 <strong>换内容藏在遮挡帧里</strong>（观众永远看不到切换的那一瞬间，只看到扫过之后世界变了）、 <strong>快进快出</strong>（power4.inOut 中段极快，慢了就从转场变成了动画表演）。</p><h3>动效核心</h3><ul><li>3 层色块（同色系浅→中→深，后扫的层叠在上面），矩形带 <code>skewX(-12°)</code> 斜切</li><li><strong>色块要宽</strong>：每层约 2.6 倍屏宽——power4 高速段里 70ms 的时间错峰会拉开约 2 个屏宽的空间间距，色块只有一屏宽必在中段露缝</li><li>每层 <code>xPercent -75 → 75</code>（按 2.6 倍屏宽折算，两端出画留斜切余量），单层 0.45s <code>power4.inOut</code>，层间 delay 60~80ms</li><li>途中拉伸：色块在过屏中段 <code>scaleX 1 → 1.22 → 1</code>（速度感），可拆成 power4.in + power4.out 两段在中点同步拉伸峰值</li><li><strong>换内容回调</strong>：在第二层运动中点（= 该层完全盖住全屏的那一帧）用 <code>tl.call()</code> 把场景 A 直接 <code>set</code> 成场景 B，瞬时切换，无过渡</li><li>视觉读法：领先边是浅色→中色两道细条，深色主体压后；扫走后新场景直接露出</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>单层扫屏时长</td><td>0.45s</td><td>&gt;0.7s 读作幕布慢慢拉过、节奏塌掉；&lt;0.3s 只剩一下闪烁，看不出方向</td></tr><tr><td>层间错峰</td><td>60~80ms</td><td>&gt;120ms 层间露出缝隙、半张旧画面穿帮；&lt;40ms 三层糊成一层，等于白做</td></tr><tr><td>斜切角度</td><td>-12°</td><td>0° 读作 PPT&quot;推入&quot;切换；&gt;20° 色块变成尖刀，四角容易遮不满穿帮</td></tr><tr><td>途中拉伸倍数</td><td>1.22</td><td>1.0 匀速平推没有速度感；&gt;1.4 色块明显变形，读作果冻/故障</td></tr><tr><td>换内容时机</td><td>第二层过中线帧</td><td>提前＝旧场景还露着就消失（闪黑穿帮）；押后＝新场景在色块缝里提前露脸</td></tr><tr><td>层数</td><td>3</td><td>2 层勉强成立；1 层＝拉幕布；&gt;4 层读作彩带广告，喧宾夺主</td></tr><tr><td>色块宽度</td><td>2.6 倍屏宽</td><td>窄于 2.4 倍屏宽高速段层间露缝、新旧内容闪现；过宽只是浪费，无副作用</td></tr></table><h3>已知坑</h3><ul><li>单层色块扫过——就是拉了一块幕布，毫无包装感，一眼廉价。</li><li>层间错峰拉到 120ms 以上——层与层之间露缝，观众瞄到缝里旧画面，穿帮。</li><li>内容切换没卡在全遮挡帧内——切换瞬间被看见，转场的&quot;魔术&quot;当场拆穿。</li><li>三层用三个不同色系——读作彩虹广告条而不是一次转场；必须同色系深中浅。</li><li>用 linear/power1 匀速扫——没有加速度就没有&quot;刷&quot;感，读作屏保。</li><li>色块只做一屏宽——power4 中段速度是均速的 4 倍，60~80ms 错峰在空间上被放大成约 2 屏宽的缝，新场景从缝里闪出来，一眼穿帮。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/shape-wipe-transition/index.html。改 <code>CONFIG.colors</code> 换色系（浅→中→深三个值），改 <code>CONFIG.wipeDur / layerDelay / skew / stretch</code> 调手感；场景 A/B 的内容替换 <code>.scene-a</code> / <code>.scene-b</code> 内部即可，换内容回调不用动。</li><li>Remotion 移植：每层 <code>interpolate(frame, [start, start+half, start+dur], [-75, 0, 75])</code> 配 easing 拆两段（前半 Easing.in(Easing.quart)、后半 Easing.out(Easing.quart)）；换内容用同帧判断 <code>frame &gt;= swapFrame ? &lt;SceneB/&gt; : &lt;SceneA/&gt;</code> 切 Sequence，swapFrame = 第二层的中点帧。</li><li>剪辑软件对应物：剪映&quot;转场→MG 动画/划像&quot;类；CapCut &quot;shape wipe / MG transition&quot;；AE 用 3 个固态层位置关键帧 + 各错开 2 帧 + Easy Ease 100%，中间帧上做剪辑点。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：三层色块各自 <code>xPercent -75→75</code> 过屏（单层 0.45s，<code>power4.in</code> + <code>power4.out</code> 拆两段 = 整体 <code>power4.inOut</code>）；层间 60~80ms 错峰（三层的先后关系与深色层压最上的叠序）；过屏中段 <code>scaleX 1→1.22→1</code> 拉伸峰值同步到中点；<code>skewX(-12°)</code> 斜切；色块宽 2.6 倍屏宽（错峰在 power4 高速段会被放大成约 2 屏宽的空间间距，窄了必露缝）；<strong>换内容回调卡在第二层完全盖屏的那一帧</strong>做瞬时切换。</li><li>不属于本卡的：色块的颜色、场景 A/B 的全部内容（主持人占位、假图表、柱子长出动画、字幕文案）、章节角标。柱状图逐根长出与字幕跟进只是&quot;转场之后世界变了&quot;的证据，换场景时整段替换，回调不用动。</li><li>迁移接口：<strong>色块颜色 = 复用者的品牌色接口</strong>——改 <code>CONFIG.colors</code> 一个数组三个值，必须是<strong>同色系浅→中→深</strong>（demo 用中性墨色三档 #d8d8dc / #8a8a8e / #1d1d1f；三个不同色系读作彩虹广告条）；手感在 <code>CONFIG.wipeDur / layerDelay / skew / stretch</code>；换尺寸时色块宽度按&quot;≥2.4 倍屏宽&quot;重算，<code>xPercent</code> 的 ±75 是按 2.6 倍宽折算出来的，改宽度要同步改它；换方向把 <code>xPercent</code> 与 <code>skew</code> 一起取反。</li><li>底色要求：白底即可（转场期间色块满屏遮盖，底色不参与）。唯一约束是最深那层要能盖住新旧两个场景——色块与场景底色明度差不足时会在中段透出内容。</li></ul>","whip-pan-transition":"<h3>意图</h3><p>推穿处理的是&quot;深入&quot;，横甩处理的是&quot;旁移&quot;：两个镜头在叙事上是并列关系（不是递进）， 用横向的一次挥摄把观众的视线从 A 甩到 B——空间上像转头，语义上像&quot;另一边呢？&quot;。 它是六式里能量最高、也最容易做错的一式，因为方向是可读的：<strong>方向断裂比硬切更刺眼</strong>。</p><p>做对的命门：① <strong>两侧同向</strong>——出场向左甩（x 走负），入场必须从右侧（x 正）滑回 0； 两侧都写&quot;从左边进来&quot;就是两次相反的挥摄拼在一起，观众会晕；② <strong>必须刹车</strong>——0.35s 的 <code>power3.out</code> 把速度吃掉，不刹直接停 = 撞墙；③ <strong>二段回稳只收旋转，不收 scale</strong>——scale 交给紧接着的 hold 继续推， 否则回稳结束那一刻画面彻底静止，又撞一次墙。</p><h3>动效核心</h3><p>时间结构（<code>cut = at + 0.42 − 0.06</code>，参数全在 <code>CONFIG.whip</code>；<code>dir = left</code> 时 <code>dist</code> 取负）：</p><table><tr><th>阶段</th><th>时刻</th><th>出场镜头</th><th>入场镜头</th></tr><tr><td>甩出</td><td><code>at</code> → <code>at+0.42</code></td><td><code>x 0→−560</code> + <code>rotate 0→−1.4°</code> + <code>blur 0→8px</code>，<code>power3.in</code></td><td>停在 <code>x +560</code>、<code>rotate +1.4°</code>、<code>scale 1.06</code>、<code>blur 8px</code></td></tr><tr><td>切点</td><td><code>cut = at+0.36</code></td><td>0.30s 淡出（无 ease，甩镜期糊到看不清）</td><td>0.12s 快速淡入</td></tr><tr><td>刹住</td><td><code>cut</code> → <code>cut+0.35</code></td><td>—</td><td><code>x →0</code> + <code>blur→0</code> + <code>rotate→+0.42°</code> + <code>scale→1.02</code>，<code>power3.out</code></td></tr><tr><td>二段回稳</td><td><code>cut+0.35</code> → <code>+0.85</code></td><td>—</td><td><code>rotate →0</code>，<code>sine.out</code>（<strong>只收旋转</strong>）</td></tr><tr><td>交班</td><td>—</td><td>—</td><td>hold 期慢推（从 1.02 继续 +0.04，<code>sine.inOut</code>）</td></tr></table><ul><li><strong><code>cutLead</code> 只有 0.06s</strong>：切点几乎就压在甩到最快的那一刻——这一帧两边都糊成一片，</li></ul><p>  是天然的遮挡帧，交叠可以做到全六式里最短（0.30s）。切点太早会露出还没糊的旧画面。</p><ul><li><strong><code>power3.in</code> → <code>power3.out</code> 的速度接力</strong>：出场是三次方加速离场，入场是三次方减速入场，</li></ul><p>  拼起来是一条完整的挥摄速度曲线。用 <code>power1</code>/<code>linear</code> 就没有&quot;甩&quot;，读作平移幻灯片。</p><ul><li><strong>微旋 1.4° 是手持感的来源</strong>：出场旋 −1.4°、入场从 +1.4° 收到 +0.42° 再回 0。</li></ul><p>  纯 x 位移读作机械推轨；旋转量超过 3° 就变成翻滚特效。注意旋转方向也要跟着 <code>dir</code> 一起翻。</p><ul><li><strong>入场起手 <code>scale 1.06</code></strong>：甩进来的画面略大一点，刹住时收到 1.02，等于横轴运动里搭了一丝纵深，</li></ul><p>  让&quot;刹住&quot;这件事有两条轴同时减速，更像真镜头。</p><ul><li><strong>位移量 560px @ 960 舞台宽 ≈ 0.58 屏宽</strong>：换尺寸按屏宽比例折算，不要照抄像素值。</li></ul><p>Remotion 对应写法（<code>template/motion-systems/transitions.tsx</code>）：</p><ul><li>出场 shot（<code>dir</code> 必须与入场一致）：<code>{ tail: 9, path: [{t:0, scale:1.02}, ...whipOut(tEnd, {dir:'left'})] }</code></li><li>入场 shot：<code>{ lead: 9, path: [...whipIn(leadSec, {dir:'left'}), {t:9, scale:1.0}] }</code></li><li><code>whipIn</code> 内部已经把方向取反（<code>x: -sign(dir) * dist</code> 起步），所以<strong>两侧传同一个 <code>dir</code></strong> 就是同向；传相反的 <code>dir</code> 才是方向断裂。</li><li>它生成三个 CamKey：起手（画外 + blur + rot + scale 1.1）、<code>brake</code> 刹住（x=0、blur=0、rot 残留 30%）、<code>brake+0.65</code> 回稳（rot=0、scale=1.0）。</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>甩出时长 <code>out</code></td><td>0.42s</td><td>&lt;0.25s 只剩一帧糊、读不出方向；&gt;0.6s 读作&quot;平移&quot;而不是&quot;甩&quot;</td></tr><tr><td>位移量 <code>dist</code></td><td>560px @960 宽（0.58 屏宽）</td><td>&lt;0.35 屏宽读作抖了一下；&gt;1 屏宽出场镜头早已出画，末段是空甩</td></tr><tr><td>方向模糊 <code>blur</code></td><td>8px</td><td>0 读作幻灯片推入；&gt;14px 交叠期完全糊掉，空间连续性丢失</td></tr><tr><td>微旋 <code>rot</code></td><td>1.4°</td><td>0 读作机械推轨；&gt;3° 读作翻滚/故障特效</td></tr><tr><td>刹车时长 <code>brake</code></td><td>0.35s</td><td>不刹（直接 set x=0）= 撞墙；&gt;0.6s 读作滑冰、失去挥摄的果断</td></tr><tr><td>二段回稳 <code>recover</code></td><td>0.50s</td><td>省掉它 = 画面歪着不回正；&gt;1s 像晕车</td></tr><tr><td>交叠帧数 <code>overlap</code></td><td>0.30s ≈ 9 帧</td><td>全六式最短——甩镜糊帧本身就是遮挡；&gt;0.5s 两个糊画面叠在一起像脏</td></tr><tr><td>切点提前量 <code>cutLead</code></td><td>0.06s</td><td>更大 → 露出还没糊的旧画面；0 → 切点落在减速已经开始之后，甩感被削</td></tr></table><h3>已知坑</h3><ul><li>两侧方向写反（出场向左甩、入场也从左侧进）：方向断裂，观众明确感到&quot;错了&quot;，比硬切更糟。</li><li>忘了旋转也要跟方向翻：位移同向、旋转反向，画面像被拧了一下。</li><li>不刹车直接 <code>set x:0</code>：撞墙，甩镜的全部果断感在最后一帧被浪费。</li><li>二段回稳把 scale 也收到 1.0：回稳结束即静止，撞第二次墙——scale 必须交给 hold 继续。</li><li>用 <code>linear</code>/<code>power1</code>：没有加速度就没有&quot;甩&quot;，读作 PPT 的&quot;推入&quot;切换。</li><li>镜头层没铺过画幅：甩出瞬间画面边缘漏底色（白底上是白边）。demo 用 <code>.shot { inset:-14% }</code> 兜住。</li><li>一片里左甩右甩随机混用：方向应服务叙事（时间轴向右、回溯向左），随机换向读作乱。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：<code>demos/whip-pan-transition/index.html</code>。摘 <code>whipPan(出场镜头, 入场镜头, 起始秒) → 结束秒</code></li></ul><p>  一个函数 + <code>CONFIG.whip</code> 一组参数即可；换方向把 <code>dist</code> 与 <code>rot</code> 的正负<strong>两侧一起</strong>取反，   以及初始 <code>gsap.set(S[1], {x: +dist})</code> 也要跟着翻。<code>hold()</code> 一起摘。</p><ul><li>Remotion：<code>whipOut(tEnd,{dir})</code> + <code>whipIn(leadSec,{dir})</code>，两侧传同一个 <code>dir</code>；</li></ul><p>  <code>path: [...whipIn(0.30,{dir:'left'}), {t:9, scale:1.0}]</code>，组装范例见 <code>MainVideo-example.tsx</code>。</p><ul><li>家族关系：把横轴换成 scale 轴 = [[push-through-transition]]；加曝光重音 = [[overexpose-flip-transition]]；</li></ul><p>  想要&quot;整体换台&quot;而不是&quot;空间旁移&quot;时用下面的径向爆糊变体。同一边界只用一式。</p><ul><li>帧级压缩版（实测，真实竖屏口播）：</li></ul><p>  - <strong>径向爆糊 whip</strong>（Y17upxADWXs）：出场帧的径向模糊由中心炸开到满屏，入场侧从模糊高位收敛——     横甩的<strong>无方向版</strong>，适合&quot;话题整体换台&quot;而非空间位移，0.1~0.2s 完成。   - <strong>速度线擦除</strong>（小Lin说·韩股崩盘）：一组同向速度线（细长条）扫过屏面完成换场，方向感由线条承担，     相机只做轻微同向漂——最轻量，不吃相机预算。   两者与本卡同一条纪律：<strong>两侧同向</strong>、一个边界只用一式；帧级式样太短，方向断裂比标准版更刺眼。</p><ul><li>剪辑软件对应物：剪映&quot;运镜转场→左右甩动&quot;；CapCut &quot;whip pan&quot;；</li></ul><p>  AE 是两侧 camera 的 X 位移 + Directional Blur + 轻微 Z Rotation——本卡把手 K 固化成了参数。</p><h3>动效范围</h3><ul><li>属于本卡的：出场 <code>x 0→±dist</code> + <code>rotate 0→∓1.4°</code> + <code>blur 0→8px</code> 的 <code>power3.in</code> 甩出；</li></ul><p>  入场从对侧 <code>x ∓dist</code>、<code>rotate ±1.4°</code>、<code>scale 1.06</code>、<code>blur 8px</code> 起手，<code>power3.out</code> 在 <code>brake</code> 0.35s 内   滑回 <code>x=0</code> / <code>blur=0</code> / <code>rot</code> 残留 30% / <code>scale 1.02</code>；<strong>二段回稳只收旋转</strong>（<code>sine.out</code> 0.50s，scale 留给 hold）；   交叠 0.30s（全六式最短，因为甩镜糊帧本身是遮挡）+ 入场 0.12s 快速淡入；   两侧方向严格同向（位移与旋转都要同向）；hold 期相机永不静止的慢推。</p><ul><li>不属于本卡的：两个镜头里的文字与配色（白/浅灰 tile + 灰字式名是&quot;认式子的标签&quot;，不是台词字幕）、</li></ul><p>  左上说明角标、<code>dist</code> 的具体像素值（按舞台宽折算）、<code>.shot</code> 的 <code>inset:-14%</code> 具体数值。</p><ul><li>迁移接口：时序全在 <code>CONFIG.whip</code>（<code>out</code>/<code>overlap</code>/<code>brake</code>/<code>recover</code>/<code>cutLead</code>）；</li></ul><p>  <strong>换尺寸时 <code>dist</code> 按屏宽比例缩放</strong>（demo 是 0.58 屏宽），<code>blur</code> 按输出分辨率线性缩放；   <strong>改方向必须两侧一起改</strong>——<code>dist</code>、<code>rot</code>、入场初始 <code>x</code> 三处同时取反（方向断裂比硬切更糟）。</p><ul><li>底色要求：白底即可。本式不含叠加层，相机曲线与底色无关；唯一要求是镜头层铺过画幅（<code>inset</code> 负值）以免甩出时漏底。</li></ul>","caret-wipe-transition":"<h3>意图</h3><p>本库的运动承接六式全是<strong>相机动量交接</strong>（推穿/翻页/横摇/砸黑/拉出/焊接）—— 边界处发生的是&quot;镜头在动&quot;，边界线本身没有含义；<code>shape-wipe-transition</code> 的色块扫屏也一样， 色块是一块<strong>不透明的遮挡物</strong>，它的职责就是&quot;让你看不见换场那一帧&quot;。</p><p>这张卡是本库第一个<strong>边界本身有语义</strong>的转场：那条竖线不是遮挡物，是一个文本光标。 于是同一次擦除同时说了两件事——光标<strong>走过的地方&quot;刚被打出来&quot;</strong>（新内容从下方沉降、从模糊解糊）， <strong>没走到的地方&quot;正被退格吃掉&quot;</strong>（旧内容往上浮、逐渐失焦）。 讲&quot;我把这段重写了&quot;&quot;这个版本换成了那个版本&quot;&quot;AI 把它改成了这样&quot;时， 它比任何色块或相机运动都贴题：编辑器的隐喻自己把因果讲完了。</p><p>命门三条：① <strong>互补裁切</strong>——新旧两层的 <code>clipPath</code> 必须严格互补（<code>inset(0 (100−x)% 0 0)</code> 对 <code>inset(0 0 0 x%)</code>），两边共用同一个进度量 x，差半个百分点就会在边界露一条底色缝； ② <strong>两侧微反差是灵魂</strong>——新场景 <code>y +3→0</code> / <code>blur 2→0</code>，旧场景 <code>y 0→−6</code> / <code>blur 0→4</code>。 去掉它就退化成一次普通的硬边 wipe（那已经是 shape-wipe 的地盘了）， &quot;打出来 / 被吃掉&quot;这层语义全部来自这两组极小的反向运动； ③ <strong>白底不加发光</strong>——原版给光标加了 <code>box-shadow: 0 0 18px</code> 的光晕（它是深底 + 荧光绿的设计语言）， 搬到本库白底舞台上只会在边界糊出一团脏边，改成实色细条。</p><h3>动效核心</h3><ul><li><strong>一个进度量驱动三件事</strong>：<code>p.x</code> 从 0 走到 100（<code>cubic-bezier(0.65,0,0.35,1)</code>，1.33s）。</li></ul><p>  每帧 <code>onUpdate</code> 里写三处：新场景 <code>clipPath: inset(0 (100−x)% 0 0)</code>、   旧场景 <code>clipPath: inset(0 0 0 x%)</code>、光标 <code>translateX(x% × 画幅宽)</code></p><ul><li><strong>裁切必须互补</strong>：新场景只露 <code>[0, x]</code> 带，旧场景只留 <code>[x, 100]</code> 带，两带首尾相接。</li></ul><p>  两层同尺寸、同位铺满，所以任何 x 都不会露出底色</p><ul><li><strong>两侧微反差（各自一条曲线，与裁切曲线分开）</strong>：</li></ul><p>  - 新场景：<code>y +3 → 0</code>（同 EASE，走满 1.33s）+ <code>blur 2 → 0</code>（<code>power1.out</code>，只走 80%——落定那一刻已经是清的）   - 旧场景：<code>y 0 → −6</code>（<code>ease:none</code> 匀速上浮）+ <code>blur 0 → 4</code>（<code>power1.in</code>，<strong>起手延后 10%</strong>，让&quot;被吃掉&quot;发生在光标真的开始走之后）   - 位移量刻意做小（3 / 6px）：这是&quot;内容在被编辑&quot;，不是相机在推</p><ul><li><strong>光标条</strong>：3px 宽、屏高 50%、<code>translateX(-50%)</code> 骑在边界上、实色 <code>#1d1d1f</code>、圆角 = 宽度。</li></ul><p>  <strong>两端各 8% 进度内淡入淡出</strong>——不这么做，第一帧和最后一帧会看到光标&quot;突现/突灭&quot;</p><ul><li><strong>缓动 <code>cubic-bezier(0.65,0,0.35,1)</code></strong>：中段快、末尾减速，像敲下最后一列后手指停住。</li></ul><p>  匀速扫读作&quot;刷新条&quot;，<code>power4.out</code> 那种起手猛冲读作甩镜（那是 whip-pan 的地盘）</p><ul><li><strong>两层的 inset 纪律</strong>：<code>inset: -10px 0</code> —— 上下各溢出 10px 给 ±6px 的竖向微反差留余量（不留会在上下缘漏一线白），</li></ul><p>  <strong>左右必须严格等于画幅</strong>：<code>clipPath</code> 的 <code>inset(%)</code> 按元素自身宽度算，横向多溢出一点，   裁切边界就与按画幅算的光标位置错开几个 px（一眼看到光标&quot;压在缝旁边&quot;而不是&quot;骑在缝上&quot;）</p><ul><li><strong><code>onUpdate</code> 里直接写 <code>style</code>，不用 <code>gsap.set</code></strong>：<code>gsap.set</code> 会被排到下一个 tick，</li></ul><p>  光标与裁切边界差一帧，看上去像&quot;光标追不上擦除线&quot;（本 demo 踩过，probe 出来实测差 1 帧 ≈ 30px）</p><ul><li><strong>层级</strong>：舞台白底 → 旧场景（被裁到右带）→ 新场景（被裁到左带）→ 光标条（不裁切、最上层）</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>wipe</code></td><td>1.33s（≈40 帧 @30fps）</td><td>扫完全屏；&lt;0.7s 读作硬边闪切、两侧微反差全看不见，&gt;2.0s 观众等着它走完、节奏塌</td></tr><tr><td>缓动</td><td><code>cubic-bezier(0.65,0,0.35,1)</code></td><td>末尾减速是&quot;敲下最后一列&quot;；匀速读作刷新进度条，起手猛冲（<code>power4.out</code>）读作甩镜</td></tr><tr><td><code>caretW</code></td><td>3px</td><td>光标宽；1px 在 1080p 缩放后会闪，&gt;6px 变成一根柱子、读回色块 wipe</td></tr><tr><td><code>caretH</code></td><td>0.5（屏高 50%）</td><td>光标高；&lt;0.35 太小、抓不住视线，=1.0（贯穿全屏）读作分屏线而不是光标</td></tr><tr><td><code>caretFade</code></td><td>0.08（两端各 8% 进度）</td><td>防边帧突现；0 = 第一/末帧看到光标凭空出现与消失，&gt;0.2 光标大半程都在半透明</td></tr><tr><td><code>inY</code> / <code>inBlur</code></td><td>+3px / 2px</td><td>新场景沉降解糊（&quot;刚被打出来&quot;）；两者都为 0 就退化成普通硬边 wipe，&gt;8px / &gt;5px 读作相机在推（那是推穿的地盘）</td></tr><tr><td><code>outY</code> / <code>outBlur</code></td><td>−6px / 4px</td><td>旧场景上浮失焦（&quot;正被退格吃掉&quot;）；比新场景的量<strong>故意大一倍</strong>——被吃掉的一侧要更&quot;松&quot;，两侧等量会读作对称转场、没有主次</td></tr><tr><td>旧场景失焦起手延后</td><td>10% 进度</td><td>让&quot;被吃掉&quot;发生在光标真的开始走之后；0 = 光标还没动画面已经在糊，读作播放器卡了</td></tr><tr><td>新场景解糊终点</td><td>80% 进度</td><td>落定那一刻必须已经清；=100% 则最后一帧还在解糊，收尾&quot;软&quot;了</td></tr><tr><td><code>dir</code></td><td><code>right</code></td><td>从左往右打（默认，符合&quot;正在写&quot;）；<code>left</code> = 反向退格，适合&quot;撤销/回到上一版&quot;的语境</td></tr></table><h3>已知坑</h3><ul><li>两层裁切不互补（各写各的百分比、或用了不同的进度量）——边界处露出一条舞台底色缝，1080p 下是一根白线，一眼是 bug。</li><li>两层 <code>inset</code> 横向也溢出（比如 <code>inset: -10px</code> 全向）——<code>clipPath</code> 的 <code>inset(%)</code> 按元素自身宽度算，裁切边界与按画幅算的光标位置错开几 px，光标压在缝旁边。</li><li>在 <code>onUpdate</code> 里用 <code>gsap.set</code> 改裁切/光标——被排到下一个 tick，光标与边界差一帧（≈30px），读作&quot;光标追不上擦除线&quot;；直接写 <code>element.style</code>。</li><li>省掉两侧微反差——退化成硬边色块 wipe，&quot;打出来/被吃掉&quot;的语义消失，那就该直接用 <code>shape-wipe-transition</code>（它更快更省）。</li><li>两侧反差做成等量（都 ±5px）——读作对称的对开幕布，没有主次；被吃掉的一侧位移必须明显更大。</li><li>给光标加发光（<code>box-shadow</code> / <code>filter: drop-shadow</code>）——原版是深底荧光绿的设计语言，白底上糊成一团脏边（design-defaults 也禁 glow）。</li><li>光标不做两端淡入淡出——转场的第一帧和最后一帧看到它凭空出现/消失，边帧突现是最廉价的破绽。</li><li>位移量按相机的量级给（±20px 以上）——本卡是&quot;内容在被编辑&quot;，不是镜头在动；量大了就与运动承接六式抢地盘且两者规则冲突。</li><li>用在真人出镜镜头之间——光标隐喻与人像无关，观众读不出任何因果，只剩一根莫名其妙的竖线扫过脸。</li><li>一片里反复用（≥3 次）——它的语义太具体（编辑器），第三次出现时观众开始觉得&quot;这个片子只会这一招&quot;；同一片限 1~2 次，且都用在真的与文本/代码有关的边界上。</li><li>两个场景的示意大字都居中——擦除边界会停在任意横向位置，中段时两行字在边界处叠成乱码；demo 里让新场景标签靠左（最早露出的带）、旧场景标签靠右（最后被吃掉的带）。</li><li>场景内容是纯色块（没有满幅纹理）——中段之后未到之处是一片空白，看不出&quot;这仍是旧场景&quot;；两侧都要有铺满画幅的可辨识内容。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/caret-wipe-transition/index.html。核心是 <code>caretWipe(out, inn, at)</code> 这个函数——</li></ul><p>  把两个铺满画幅的场景层传进去就能用，返回擦除结束的时刻（便于接着排 hold）。   换方向改 <code>CONFIG.dir</code>；<code>clipOld</code> / <code>clipNew</code> 两个函数已经把方向分支写好了。   <code>cubicBezier()</code> 是通用的缓动解算器（GSAP core 不带 <code>CustomEase</code>），可以直接抄走。</p><ul><li>Remotion 移植：原版就是 <code>@remotion/transitions</code> 的一个 <code>TransitionPresentation</code></li></ul><p>  （<code>registry/remocn/caret-wipe/index.tsx</code>），<code>presentationProgress</code> 直接就是本卡的 <code>p.x/100</code>：   <code>entering</code> 分支给新场景（<code>clipPath</code> + <code>translate</code> + <code>blur</code>），<code>!entering</code> 分支给旧场景，   光标只画在 <code>entering</code> 分支里（否则会出现两根）。   接进本库 <code>template/motion-systems/transitions.tsx</code> 的话，它与六式<strong>不同族</strong>——   六式是 CamKey 生成器（改相机 path），这张卡不动相机，是一对互补的 <code>clipPath</code> 包在 Sequence 外层；   所以不要塞进 <code>pushThroughOut/settleIn</code> 那套接口，单独作为一个 presentation 用。</p><ul><li>剪辑软件对应物：剪映/CapCut——&quot;线性擦除/线性划像&quot;转场 + 手动给两侧各加一组位移与模糊关键帧</li></ul><p>  （预设本身只有裁切、没有微反差，微反差必须手加，这是本卡的全部差别）；光标另起一个 3px 的色块层做位移关键帧。   AE——<code>Linear Wipe</code>（Feather 0）作裁切，光标用 Shape Layer 的 Position 跟同一条 <code>cubic-bezier</code>（Graph Editor 里手拉），   两侧的 <code>Fast Box Blur</code> + Position 各一组键；<strong>别用 CC Light Wipe / Card Wipe</strong> 那类带发光和碎块的。</p><ul><li>与本库转场类的分工：<strong>六式</strong>（push-through / overexpose-flip / whip-pan / black-slam / pullback-cool / particle-weld）</li></ul><p>  = 相机动量交接，边界是&quot;镜头在动&quot;，任何内容都能用；<strong>shape-wipe</strong> = 无相机系统时的轻量遮挡；   <strong>本卡</strong> = 边界本身有语义（编辑器隐喻），只在内容真的与文本/代码/文档/生成结果有关时用。   一个边界只用一式——本卡与六式<strong>不叠加</strong>（相机在推的同时又有一根光标扫过，两套空间逻辑打架）。</p><h3>动效范围</h3><ul><li>属于本卡的：一个进度量同时驱动&quot;新旧两层互补 <code>clipPath</code> + 光标位置&quot;这条机制；两侧微反差（新场景 y +3→0 / blur 2→0 沉降解糊，旧场景 y 0→−6 / blur 0→4 上浮失焦，且被吃掉一侧的位移量约为新场景的两倍）；旧场景失焦起手延后 10% 进度、新场景解糊在 80% 进度前收完这两条时间纪律；<code>cubic-bezier(0.65,0,0.35,1)</code> 的末尾减速；3px 实色细条 + 屏高 50% + 骑在边界上 + 两端各 8% 进度淡入淡出的光标规格；&quot;白底不加发光&quot;这条取舍；两层左右严格等于画幅、只上下溢出的 inset 纪律；<code>onUpdate</code> 里直写 style 以避免光标与边界差一帧。</li><li>不属于本卡的：demo 两个场景的横线纸/点阵纹理与「刚被打出来」「被退格吃掉」这两个认式标签、灰阶取值（<code>#ffffff</code> / <code>#f1f1f4</code> / <code>#8a8a8a</code>）、光标的 <code>#1d1d1f</code>、hold A 0.8s 与 hold B 0.9s 这个排片（应用侧由叙事长度决定）、以及&quot;两个场景是静态 tile&quot;这件事（真实应用里两侧都是完整镜头）。</li><li>迁移接口：<code>caretWipe(out, inn, at)</code> 是唯一的调用入口——传两个铺满画幅的场景层与起始时刻；<code>wipe</code> 定快慢（唯一常改的参数）；<code>dir</code> 定&quot;正在写&quot;（right）还是&quot;撤销回上一版&quot;（left）；<code>inY/inBlur/outY/outBlur</code> 是<strong>手感常量，换画幅不要按比例放大</strong>（它们是&quot;内容被编辑&quot;的量级，不是相机的量级）；<code>caretW</code> 按分辨率取整（1080p 用 3px，4K 用 5~6px，避免半像素闪烁）；竖屏把 <code>caretH</code> 提到 0.6~0.7（竖幅里 50% 的光标显得太短）。</li><li>底色要求：白底/浅底最佳（光标是深色实条，靠对比成立）。深底场景把光标换成浅色实条即可，其余参数不变；<strong>两个场景的底色不必相同</strong>（demo 就是白 + 浅灰），但两侧都必须有铺满画幅的可辨识内容——纯色块会让中段之后的未到之处读作空白。</li></ul>","chapter-progress-list":"<h3>意图</h3><p>长口播最大的流失点不是内容不好，是<strong>观众不知道自己在哪</strong>。听到第 7 分钟还在讲第二部分， 但他以为已经讲完一半了——于是走了。本库已有 <code>chapter-title-card</code>（一张幕标题卡砸出来）， 它解决的是&quot;新的一幕开始了&quot;，但它<strong>不给坐标</strong>：观众看不到前面有几段、后面还有几段。</p><p>这张卡补的正是坐标：<strong>把整份目录摆出来，然后指一下&quot;你在这&quot;</strong>。观众一眼拿到三条信息—— 全片有四段、当前是第二段、还剩两段。这三条信息合起来才叫&quot;进度&quot;，少一条就退化成标题卡。</p><p>命门三条：① <strong>高亮只有一条</strong>。两条高亮就没有&quot;当前&quot;这个概念，读作&quot;这两段比较重要&quot;； ② <strong>未激活行靠 dim 实色区分，绝不叠透明度</strong>（design-language §1 红线）。深底上 <code>#a1a1a6</code> 对 <code>#1d1d1f</code> 已经是安全对比，再叠 0.5 opacity 直接掉出可读区——它们是&quot;还没讲/已经讲完&quot;，不是&quot;看不清&quot;； ③ <strong>四条全部站定之后才高亮</strong>。滑入过程中就把第二条染红，读作&quot;第二条飞得比别人快&quot;， &quot;站定—点名&quot;这两拍才是&quot;指一下你在这&quot;。</p><h3>动效核心</h3><ul><li><strong>层级</strong>：暗场底（<code>#1d1d1f</code>）→ 人物层（左列）→ 章节列表（右侧，垂直居中）→ 四角角框（最上层）</li><li><strong>① 列表入场</strong>：四条 <code>x +24 → 0</code> + <code>opacity 0 → 1</code>，每条 <code>0.24s power3.out</code>，<strong>错峰 0.10s</strong>。</li></ul><p>  表头（CHAPTER）提前 0.06s 单独淡入 0.22s——它是标签不是列表项，不参与错峰序列</p><ul><li><strong>② 高亮（全部到位 + 0.06s 呼吸后）</strong>，三条属性同帧同 0.20s：</li></ul><p>  - 编号与标题 <code>color: #a1a1a6 → #e0452c</code>（<code>power2.out</code>）   - 左侧圆点 <code>scale 0 → 1</code>（<code>back.out(2)</code>——唯一允许回弹的件，它是&quot;落点&quot;）   - 整行 <code>x 0 → +6px</code>（<code>power3.out</code>）：在列表里&quot;站出一步&quot;</p><ul><li><strong>③ 四角角框</strong>：与高亮<strong>同帧</strong>起，<code>x/y</code> 从各自外侧 ±10px 收到 0 + <code>opacity 0 → 1</code>，<code>0.30s power2.out</code>。</li></ul><p>  比高亮慢（0.30 vs 0.20）、比高亮淡——它是<strong>衬</strong>，抢了就散</p><ul><li><strong>④ hold 2.0s</strong>：四条章节 + 一个当前位置，观众要读三遍才拿到&quot;进度&quot;这个信息</li><li><strong>未激活态是终态</strong>：<code>#a1a1a6</code> 实色。<code>opacity</code> 只出现在入场那 0.24s 里，落定后回到 1，</li></ul><p>  静置态没有任何一件叠着透明度</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>rowStagger</code></td><td>0.10s</td><td>行错峰，本卡的&quot;一串感&quot;旋钮；&gt;0.2s 读作四个独立动效（观众会去数），&lt;0.05s 读作整块淡入（丢掉&quot;逐条列出&quot;的语义）</td></tr><tr><td><code>rowIn</code></td><td>0.24s</td><td>单行滑入耗时；&gt;0.4s 四条加起来 1.6s，转场变拖沓；&lt;0.15s 看不出行与行的先后</td></tr><tr><td><code>rowShift</code></td><td>24px</td><td>从右侧进入的位移；0 只剩淡入（少了&quot;从边上推进来&quot;的方向），&gt;60px 读作横向飞入（抢过高亮那一拍）</td></tr><tr><td><code>hlDelay</code></td><td>0.06s</td><td><strong>命门</strong>：全部站定 → 高亮 之间的呼吸；0 会读作&quot;最后一行特殊&quot;，&gt;0.3s 两拍断开、观众以为动效已经结束了</td></tr><tr><td><code>hlAdvance</code></td><td>6px</td><td>当前行额外前进量；0 少了&quot;站出一步&quot;的身体感，&gt;16px 读作这一行被拽出列表（对齐关系破掉）</td></tr><tr><td><code>cornerInset</code></td><td>10px</td><td>角框向内收的距离；0 只剩淡入（没有&quot;合拢封场&quot;），&gt;24px 读作四个角在飞（衬的位移超过主体位移就抢戏）</td></tr><tr><td><code>cornerDur</code></td><td>0.30s</td><td>角框耗时，<strong>必须大于 <code>hlDur</code> 0.20s</strong>——衬比主体慢是层级纪律</td></tr><tr><td>章节条数</td><td>3~5 条</td><td>2 条撑不起&quot;进度&quot;（用 <code>chapter-title-card</code>），&gt;6 条读作菜单不是章节表，且行高压缩后 dim 行糊成一片</td></tr><tr><td><code>hold</code></td><td>2.0s</td><td>收尾停留；&lt;1.2s 观众只读到高亮那一行，&quot;还剩几段&quot;这条信息没拿到</td></tr></table><h3>已知坑</h3><ul><li>未激活行叠 <code>opacity: 0.45</code> 来&quot;压下去&quot;——深底上 <code>#a1a1a6</code> 叠透明度后对比度掉到 2:1 出头，</li></ul><p>  观众读不出那几行写了什么，&quot;全片有四段&quot;这条信息直接失效（design-language §1 红线）。</p><ul><li>两条以上高亮——&quot;当前&quot;这个概念是唯一性给的，高亮两条读作&quot;这两段重要&quot;，进度语义归零。</li><li>高亮在滑入过程中就发生——读作&quot;第二条跑得比别人快&quot;，而不是&quot;点名第二条&quot;。</li><li>圆点用 <code>elastic</code> 或 <code>back.out(4)</code> 弹——它是一个直径 10px 的点，大回弹在这个尺寸上只会读作抖动。</li><li>角框做成四条完整边框——那是&quot;取景框/画框&quot;，是另一种语言；电影角框只画四个角的 L。</li><li>角框比高亮更快更亮——衬抢主体，一屏两个重音，转场读作花屏。</li><li>在白底上做这张卡——章节转场的语义是&quot;幕间暗场&quot;，白底上四条列表读作&quot;页面上的目录&quot;，</li></ul><p>  少了&quot;这里是一个切口&quot;的转场性质（本卡是全库唯一为此破白底默认的列表卡，理由见「动效范围」）。</p><ul><li>深底照抄浅底的 <code>#8a8a8a</code> 做 dim——深底模式的 ink-muted 是 <code>#a1a1a6</code>，<code>#8a8a8a</code> 在 <code>#1d1d1f</code> 上</li></ul><p>  只有 3:1 出头，未激活行直接沉进底里。</p><ul><li>重播只重置 transform 不重置 <code>color</code>——高亮是&quot;改属性&quot;，上一轮的红会留在第二行，</li></ul><p>  第二遍播放时它一开场就是红的，&quot;站定—点名&quot;两拍全丢。</p><h3>复用指引</h3><ul><li>HTML/GSAP：demos/chapter-progress-list/index.html。<strong>换内容改 <code>.ch-row</code> 的文案</strong>，</li></ul><p>  当前章节把 <code>current</code> 类挪到对应行（圆点 <code>&lt;span class=&quot;ch-dot&quot;&gt;</code> 跟着挪）。节奏全在 <code>CONFIG</code>：   <code>rowStagger</code> 调&quot;一串感&quot;、<code>hlDelay</code> 调两拍之间的呼吸、<code>hold</code> 按条数给（每条约 0.5s）。   换强调色只改 <code>CONFIG.accent</code> 与 <code>.ch-dot</code> 的 <code>background</code> 两处。   角框的臂长在 <code>.cine-corner</code> 的 <code>width/height</code>（42px @540h ≈ 7.8%，换尺寸等比）。</p><ul><li>Remotion 移植：一个 <code>&lt;Sequence&gt;</code> 装列表，第 i 行 <code>from={Math.round(i*0.10*fps)}</code>，</li></ul><p>  行内 <code>interpolate</code> 驱动 <code>translateX</code> 与 <code>opacity</code>（<code>Easing.out(Easing.cubic)</code>）。   高亮那一拍单独一个 <code>Sequence from={hlFrame}</code>，用 <code>interpolateColors(frame, [hlFrame, hlFrame+6], [dim, accent])</code>   换色（<strong>别用 CSS transition</strong>，帧驱动下不可复现）；圆点用 <code>spring({damping: 12, stiffness: 200})</code>。   角框四个用同一个 <code>interpolate</code> 出 <code>inset</code> 值，各自乘 ±1 定方向。</p><ul><li>剪辑软件对应物：剪映/CapCut——四条文本层 + 关键帧&quot;位置 + 不透明度&quot;，逐层往后拖 3 帧（0.1s）；</li></ul><p>  高亮那一行<strong>要复制成两层</strong>（灰的一层、红的一层）在高亮点硬切，剪映做不出文字颜色的补间；   圆点用一个圆形贴纸 + 缩放关键帧。AE——列表做成一个预合成，   <code>Animate → Position + Opacity</code> + <code>Range Selector</code> 的 <code>Offset</code> 走 −100%→0%（<code>Ease High</code> 拉满），   高亮行单独一层加 <code>Fill</code> 效果对 Color 打两个关键帧；角框四层 <code>Position</code> 关键帧 + 父级绑到一个 Null。</p><ul><li>与本库同类卡的分工：<code>chapter-title-card</code> = 一张幕标题砸出来（有转场性质、不给坐标）；</li></ul><p>  <strong>本卡 = 给坐标的章节转场</strong>（目录 + &quot;你在这&quot;）；<code>numbered-step-stack</code> = 清单堆叠（讲操作步骤，   四条是并列的动作，没有&quot;当前&quot;的概念）；<code>step-timeline-vertical</code> = 时间轴推进（有先后依赖）。   三张列表卡的分工是：本卡答&quot;讲到哪了&quot;、<code>numbered-step-stack</code> 答&quot;要做哪几件&quot;、   <code>step-timeline-vertical</code> 答&quot;按什么顺序做&quot;。</p><h3>动效范围</h3><ul><li>属于本卡的：四行 <code>x +24 → 0</code> + <code>opacity</code> 的错峰滑入（<code>0.10s</code> 错峰 / 每行 <code>0.24s power3.out</code>）这条时序；<strong>未激活行用 dim 实色、静置态零透明度</strong>这条纪律；&quot;全部站定 + 0.06s 呼吸 → 才高亮&quot;这两拍的先后；高亮的三属性同帧组合（换色 + 圆点 <code>back.out(2)</code> 弹出 + 该行 <code>x +6px</code>）；<strong>高亮唯一性</strong>（只有一条）；四角角框与高亮同帧、但更慢更淡（<code>0.30s</code> vs <code>0.20s</code>）这条主/衬层级；<code>hold 2.0s</code> 让&quot;还剩几段&quot;这条信息被读到。</li><li>不属于本卡的：demo 里那四条具体章节名与「CHAPTER」这个表头字样、<code>#e0452c</code> 这个强调色（取参考图①暖色系，换任意 accent 都成立）、23px/15px 的字号与 600 字重、列表落在右侧、左列的数字人占位、角框 42px 的臂长与 2px 描边宽、行高与 <code>gap</code>。</li><li>迁移接口：颜色三个 token —— <code>CONFIG.accent</code>（强调色）、<code>CONFIG.dim</code>（未激活行实色，浅底用 <code>#7a7a7a</code>、深底用 <code>#a1a1a6</code>）、底色；尺寸基准 <code>rowShift 24px</code> 与 <code>cornerInset 10px</code> 都按舞台宽等比（960 ⇒ 1920 时翻倍）；时长缩放规则 —— <code>rowStagger</code> 是<strong>手感常量不要动</strong>，<code>hold</code> 按章节条数给（每条约 0.5s）；竖屏把列表改成整屏居中、条数收到 3~4 条（竖屏行宽够但屏高被 UI 吃掉）。</li><li>底色要求：<strong>需要深底 <code>#1d1d1f</code>（本卡是本组唯一的例外）</strong>。理由：本卡的语义不是&quot;页面上的一份目录&quot;而是<strong>一次章节转场</strong>，而转场在视频里的读法是&quot;幕间暗场&quot;——画面暗下来、目录浮出来、指一下当前位置、再回到内容。白底上做同样的动效，观众只会读作&quot;屏幕上多了个列表&quot;，缺的正是&quot;这里是一个切口&quot;这层意思（design-language §4 明写&quot;底色交替就是章节感&quot;，浅底 ↔ 深底的切换本身就是分隔符）。深底同时是列表可读性的前提：四条 dim 行在暗场上是&quot;还没亮起的灯&quot;，在白底上则是&quot;没印清的字&quot;。深底模式下配套换值：<code>ink</code> 用 <code>#f5f5f7</code>、<code>ink-muted</code> 用 <code>#a1a1a6</code>、角框用 <code>#d2d2d7</code> 实色（<strong>不加 blur/glow</strong>——发光是另一套语言）。</li></ul>","long-take-world":"<h3>意图</h3><p>多镜头是&quot;剪辑思维&quot;，长镜头是&quot;空间思维&quot;：观众始终知道自己在哪、从哪来、往哪去， 信息之间的关系被空间布局直接表达（下一步在右边、原因在下面、回顾就是往回走）。 做对的命门：① 相机永不瞬移（速度上限内的连续曲线）；② 内容在相机<strong>快到时</strong>开始成形，不是到站后才播动画；③ 到站后相机仍有微漂，让位规则照常执行。</p><h3>动效核心</h3><p><code>WorldRig</code> 持一条站点表 <code>stops: {t, x, y, zoom, rot}[]</code>（t = 字级时间戳锚点）， 逐字段稀疏关键帧 + inOutSine 插值出相机状态，叠双不可通约正弦微漂（±5px）和重音脉冲。 <code>WorldPlane depth</code> 做视差（背景 0.5 跟一半）；<code>WorldItem x y</code> 把内容钉在世界坐标。 揭示挂 <code>useArrive(x, y, radius)</code>：相机距离 &lt; radius 时返回 0→1，内容的 opacity/位移/描画进度挂它， 实现&quot;镜头一转过去东西正在长出来&quot;。讲完的区域可挂 <code>1-arrive</code> 做离场退焦。</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>运镜速度</td><td>≤1.5 屏宽/秒</td><td>更快就该改用 whip 转场；&lt;0.3 屏/秒观众以为没动</td></tr><tr><td>站点 zoom</td><td>0.9~1.15</td><td>移动中微拉远再推近（呼吸）；全程等 zoom 像平移扫描</td></tr><tr><td>arrive radius</td><td>900px（约半屏）</td><td>大=提前很久开始成形（从容）；小=擦到跟前才出（紧张）</td></tr><tr><td>drift 微漂</td><td>±5px</td><td>到站防静止的底线，关掉必挂 motion_check</td></tr><tr><td>世界布局</td><td>站点间距 1.2~2 屏</td><td>太近互相穿帮（上一站还在画面里），太远运镜时间全是空旷</td></tr></table><h3>已知坑</h3><ul><li>站点布成一条水平直线=传送带 PPT；布局要用二维（右→下→斜上），路径带折返和 zoom 变化。</li><li>相邻站点内容在运镜途中同框穿帮：布局时按 zoom 算可视范围，途中露出的半成品要么提前成形要么退焦。</li><li>长镜头不豁免七层：世界画布只是把 L1 从&quot;每镜一条曲线&quot;换成&quot;一条大曲线&quot;，idle/让位/环境照旧。</li><li>与多镜头混用时时间基要分清：WorldRig 的 t 与场景内动画锚点用同一时间源（绝对秒，经 time.ts 换算）。</li><li>（实战）世界网格自己铺盖满全站点的超大 div；GridField 等 AbsoluteFill 屏幕件放进 WorldPlane 的 0×0 容器会塌为零。</li><li>（实战）WorldItem 锚点=盒中心只对普通内容成立；绝对定位子元素铺开的站点，视觉中心会漂离锚点（实测 460px），内容要自证以 (0,0) 为视觉中心。</li><li>（实战）运镜途中 ≥0.5s 的全空舞台=评审必挑；给途中路线放前景视差符号垫场（到站构图外、只在途中入画，按视锥验算位置）。</li></ul><h3>复用指引</h3><ul><li>Remotion：<code>longtake.tsx</code>，站点表写在 shots.ts 旁做表驱动；组合范式见文件头注释。</li><li>SHOTBOOK 写法：先画世界布局草图（各站点世界坐标 + 相机路线箭头），层矩阵按&quot;站&quot;分节。</li><li>状态：已实战验证（2026-08-19，作者内部工程 V3 幕：23.1s 三站，运镜 1.08 屏/s，无途中穿帮，三重验收全过；该工程为过程资产不随库分发）。可复制实现即上面的 <code>longtake.tsx</code>。</li><li>剪辑软件对应物：AE 大合成 + camera 关键帧（Prezi/Motion 的 spatial narrative）。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：一台相机在世界坐标上连续运镜（站点表稀疏关键帧 + <code>sine.inOut</code> 插值，速度 ≤1.5 屏宽/s，永不瞬移）；相机 = 世界层的反向 transform（<code>scale(zoom) translate(-x,-y)</code>）这一机制；<strong>接近度揭示</strong> <code>useArrive</code>——内容在相机赶到前约 0.4 屏就开始成形（opacity/位移/scale 挂距离衰减，不是到站后才播动画）；到站后双不可通约正弦微漂 ±5px（任何&quot;到站&quot;时刻都不完全静止）；站点的二维布局（右→下→斜上，带折返与 zoom 变化）。</li><li>不属于本卡的：站点卡片的边框圆角与字号、示例文案、途经点圆点的样式、字幕、站点的具体坐标数值。世界网格是个边界情况——它不是装饰纹理而是<strong>让相机位移可被看见</strong>的参照物（没有它，白底上的连续运镜看起来像静止），所以保留，但线色可任意换。</li><li>迁移接口：站点表 <code>CONFIG.stops</code>（<code>x</code>/<code>y</code>/<code>zoom</code>/<code>hold</code>）+ <code>travel</code> 站间时长 + <code>arriveLead</code> 接近半径 + <code>drift</code> 微漂幅度；换尺寸时站点坐标与 <code>arriveLead</code> 按舞台宽同比缩放（间距保持 1.2~2 屏）；网格 <code>background-size</code> 与线色改 <code>#worldgrid</code>。<strong>强调色接口</strong>：demo 把原先的 #0066cc 收敛为墨色，途经点 <code>.waypoint</code> 的描边是唯一预留的一处强调位，复用时整组换品牌色即可（站点标题的 <code>em</code> 同理）。</li><li>底色要求：白底即可。唯一实质要求是底上得有<strong>可辨认的空间参照</strong>（网格/地图/纹理任选），否则相机在纯色空场里运镜观众读不出&quot;在移动&quot;——这是空间连续性的载体，不是风格装饰。</li></ul>","impact-open-title":"<h3>意图</h3><p>开场钩子的困难不在&quot;怎么砸得响&quot;，在<strong>怎么让一屏里只有一个重音</strong>。 参考图这个构图有四类元素（大标题 / 末词强调色 / 四角框 / 点阵网格 / 副题）， 新手做法是让它们各自入场、各有一个动作——结果观众的眼睛在 0.5 秒里被拽了五次， &quot;冲击&quot;变成&quot;混乱&quot;。这张卡的全部设计都在做<strong>分层降权</strong>：</p><ul><li>标题：<code>power4.out</code> 0.2s，最猛最快 → <strong>唯一的砸</strong></li><li>角框：与标题<strong>同帧起</strong>，但 <code>power2.out</code> 0.3s（慢 1.5 倍、缓动低两阶）→ 同时发生但不争</li><li>点阵：角框落定后才起，<code>0.4s</code> 最慢，且 <code>opacity</code> 只到 <strong>0.5</strong> → 最轻</li><li>副题：最后一拍，灰字小号上浮 8px → 补充信息</li></ul><p>命门两条：① <strong>一屏里&quot;砸&quot;只有一次</strong>。角框和点阵是衬，必须比标题更慢更淡； 给角框也来一次 <code>back.out</code> 弹入，观众会读作&quot;四个角在抢主标题的位&quot;，构图散架。 ② <strong>角框与标题同帧起、不同时停</strong>。错峰让角框晚起会读作&quot;标题出来了，然后有人给它加了个框&quot;（两件事）； 同帧起 + 更慢的曲线才是&quot;框和字是一个版式，只是框更沉&quot;（一件事）。</p><h3>动效核心</h3><ul><li><strong>五个元素、四拍，权重严格递减</strong>：</li></ul><p>  - 拍① <code>t=0.40</code> 整句：<code>scale 1.08 → 1</code> + <code>opacity 0 → 1</code>，<code>0.20s</code> <strong><code>power4.out</code></strong>，     作用在<strong>整行</strong>上（不是逐字），<code>transform-origin: 0% 50%</code>（护住左基线）   - 拍①b <code>t=0.40</code>（<strong>同帧</strong>）四角 L 框：各自 <code>x/y ±12 → 0</code>（对角单位向量 × 12）+ <code>opacity 0 → 1</code>，     <code>0.30s power2.out</code> —— 同帧起、慢 1.5 倍、缓动低两阶   - 拍② <code>t=0.70</code>（整句落定 + 3 帧）末词：<code>color #1d1d1f → #e8720c</code> 与 <code>scale 1.15 → 1</code> 同轨，     <code>0.167s power3.out</code>（punch 5 帧），<code>transform-origin: 0% 50%</code>（1.15 倍只往右长，不压前一个字）   - 拍③ <code>t=0.80</code>（角框落定 + 0.1s）点阵：<code>opacity 0 → 0.5</code>，<code>0.40s power1.out</code> —— 全卡最慢最淡   - 拍④ <code>t=0.96</code> 副题：<code>opacity 0 → 1</code> + <code>y 8 → 0</code>，<code>0.28s power2.out</code></p><ul><li><strong>换色与 punch 必须同轨（同起同停）</strong>：分开写会看到&quot;字先变橙、然后才放大&quot;或反之，</li></ul><p>  两个动作读作两拍，末词就有了两次强调</p><ul><li><strong>末词的 3 帧延后是关键值</strong>：0 帧则整句砸出时末词已经是橙的（观众读作&quot;这句话本来就有个橙词&quot;，</li></ul><p>  没有&quot;重点在这里&quot;的推进）；&gt;8 帧则读作两个独立动效（一句话砸出，然后一个词变色）</p><ul><li><strong>四角 L 框各自只画两条边</strong>：<code>border: 4px solid</code> + 对应两边 <code>border: 0</code> 成 L。</li></ul><p>  臂长必须相等（46×46）——不等长读作随手放的装饰而不是取景框</p><ul><li><strong>角框 <code>z-index: 5</code></strong>：它框的是<strong>整个画面</strong>，必须压在人物之上；压在人物下面读作&quot;墙上贴的胶带&quot;</li><li><strong>点阵网格用单个元素 + <code>radial-gradient</code> 圆点阵</strong>（<code>background-size: 24px 24px</code>，5×4 = 116×92px），</li></ul><p>  不是 20 个 div。它只被 <code>opacity</code> 驱动，没有任何位移——衬的最低成本实现</p><ul><li><strong>点阵的 <code>opacity</code> 上限 0.5 是硬约束</strong>：&gt;0.6 它开始与标题争视觉重量；</li></ul><p>  白底上 0.5 的橙点阵读作&quot;很轻的纹理&quot;，正好</p><ul><li><strong>副题是灰 <code>#8a8a8a</code> 小号 25px</strong>：它不参与强调，是&quot;补充说明&quot;这一档信息</li><li><strong>层级</strong>：舞台白底 → 点阵（左上偏右，标题上方空区）→ 主持人（右侧）→ 四角 L 框（z:5，压过人物）</li></ul><p>  → 整句标题 → 副题</p><ul><li><strong>强调色只上在末词与衬件上</strong>：<code>#e8720c</code>（参考图橙系）用于末词、角框、点阵三处——</li></ul><p>  它们是同一个&quot;强调系统&quot;的三个强度档（实色字 / 4px 描边 / 0.5 点阵），不是三个颜色</p><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td><code>slamDur</code></td><td>0.20s（<code>power4.out</code>）</td><td>整句砸出时长，<strong>全卡唯一的猛</strong>；&gt;0.35s power4 的劲被摊平读作普通淡入，&lt;0.14s 砸得看不见过程（读作硬切）</td></tr><tr><td><code>slamScale</code></td><td>1.08</td><td>整句起始倍数；&lt;1.04 砸不出来，&gt;1.15 整句起手会超出安全区，且大字缩放会让字重看起来变了</td></tr><tr><td><code>cornerDur</code></td><td>0.30s（= 标题的 1.5 倍）</td><td><strong>本卡第一命门</strong>：角框必须比标题慢；= <code>slamDur</code> 则角框与标题同强度，一屏两个砸；&gt;0.5s 角框在标题落定后还在爬，读作加载慢</td></tr><tr><td>角框缓动</td><td><code>power2.out</code></td><td>比标题低两阶（power4 → power2）；给角框 <code>back.out</code> 立刻抢主标题的位</td></tr><tr><td><code>cornerIn</code></td><td>12px</td><td>角框从外侧收进来的距离；0 只剩淡入（可用但少了&quot;取景框合上&quot;的语义），&gt;24px 角框起手在画外，读作四个东西飞进来</td></tr><tr><td><code>wordDelay</code></td><td>0.10s（3 帧）</td><td><strong>本卡第二命门</strong>：末词延后量；0 则整句自带橙词（没有&quot;重点在这里&quot;的推进），&gt;0.27s 读作两个独立动效</td></tr><tr><td><code>wordScale</code></td><td>1.15</td><td>末词 punch 起始倍数；&lt;1.08 punch 读不出，&gt;1.3 末词起手会撞到前一个字（<code>origin: 0% 50%</code> 只能护住左侧）</td></tr><tr><td><code>dotsOpacity</code></td><td>0.50</td><td><strong>点阵的重量上限</strong>；&gt;0.6 点阵与标题争视觉重量（一屏两个焦点），&lt;0.3 点阵等于不存在（可以直接删掉那层）</td></tr><tr><td><code>dotsDur</code></td><td>0.40s</td><td>点阵淡入时长，全卡最慢的一条；&lt;0.2s 点阵&quot;出现&quot;了（有了入场感就不是衬）</td></tr><tr><td><code>dotsGap</code></td><td>0.10s</td><td>角框落定 → 点阵起淡；0 则点阵与角框同拍（衬件挤在一起），&gt;0.4s 观众已经开始读副题了</td></tr><tr><td><code>hold</code></td><td>1.6s</td><td>收尾定格——完整的开场版式就是落点；开场钩子后面接口播，hold 不必超过 2s</td></tr></table><h3>已知坑</h3><ul><li>角框也来一次弹入（<code>back.out</code> / 更大的位移）——一屏两个砸，观众不知道该看哪个，&quot;冲击&quot;读作&quot;混乱&quot;。</li><li><strong>点阵进了相机缩放层就会&quot;抖&quot;</strong>（2026-08-28 实战踩坑）：demo 里镜头不动看不出来，</li></ul><p>  成片里叠上 CameraRig 慢推，1.4px 点距 18px 的点阵亚像素爬行，整块读作画面抖动。   成片参数取点径 ≥2.5px / 间距 ≥32px 并调淡（工程铁律「细密纹理禁入相机缩放层」）。</p><ul><li>角框错峰晚起（而不是与标题同帧起 + 更慢）——读作&quot;标题出来了，然后有人给它加了个框&quot;，一个版式被拆成两件事。</li><li>点阵 <code>opacity</code> 拉到 1（或用实色圆点 div）——它从衬变成第二个焦点，白底上的橙点阵在 1.0 时比灰副题还重，构图上下颠倒。</li><li>点阵给位移/逐点错峰（&quot;让它也动一下&quot;）——衬件一有入场动作就不再是衬；这层的正确状态是&quot;它一直在那，只是刚刚才看清&quot;。</li><li>末词换色与 punch 分成两拍写——看到&quot;字先变橙、然后才放大&quot;，一个词被强调了两次，比不强调更乱。</li><li>末词 <code>transform-origin</code> 取中心——1.15 倍会往左长，压到前一个字上（&quot;住重&quot;叠在一起）；取 <code>0% 50%</code> 只往右长。</li><li>四角 L 框臂长不等（或四个角的 border 宽度不一致）——读作随手放的装饰，取景框语义消失。</li><li>角框压在人物下面（忘了 <code>z-index</code>）——它框的是整个画面，被人物挡住一角读作&quot;墙上的胶带&quot;。</li><li>逐字砸整句（每个字自己 scale）——那是 <code>per-character-rise</code> 的语言；本卡的&quot;一次砸&quot;必须作用在整行的一个 transform 上，逐字会让&quot;一次&quot;变成 N 次。</li><li>副题用黑字或加粗——它立刻升到与标题同档，一屏三级文字层级塌成两级（design-language §2：一屏 ≤3 级）。</li><li>角框/点阵用与末词不同的颜色（比如角框橙、点阵灰）——违反唯一强调色红线；它们是同一强调系统的三个强度档，颜色必须同一个。</li><li>全片用超过两次——开场钩子的力量来自稀缺，第三次出现观众就把它当栏目包装了（design-language §2：hero 字阶全片 1~2 次）。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/impact-open-title/index.html。<strong>换文案改两处 HTML</strong>：</li></ul><p>  <code>#ioLine</code> 的前半句（3~5 字）+ <code>#ioLast</code> 里的末词（<strong>必须是 2~3 字的独立 span</strong>，它是唯一换色的元素），   以及 <code>#ioSub</code> 的副题（10~18 字）。   换强调色改三处 <code>#e8720c</code>：<code>.io-c</code> 的 <code>border</code>、<code>.io-dots</code> 的 <code>radial-gradient</code>、<code>CONFIG.accent</code>（必须同色）。   换字号改 <code>.io-line</code> 的 <code>font-size</code>，<code>.io-sub</code> 保持约 1/3；角框尺寸 <code>.io-c</code> 的 width/height 按舞台高的 8.5% 给。   点阵位置改 <code>.io-dots</code> 的 <code>left/top</code>（要落在标题上方的空区，不能与标题或人物重叠）。   能量只调 <code>slamDur</code>；<code>cornerDur</code> 必须保持 <code>slamDur</code> 的 1.5 倍、<code>dotsOpacity</code> 必须 ≤0.5。</p><ul><li>Remotion 移植：五个元素五个独立的 <code>interpolate</code> 组，共用一个 <code>frame</code> 时钟。</li></ul><p>  30fps 换算：<code>lead 12f</code>、<code>slamDur 6f</code>、<code>cornerDur 9f</code>、<code>wordDelay 3f</code>、<code>wordPunch 5f</code>、   <code>dotsGap 3f</code>、<code>dotsDur 12f</code>、<code>subDur 8f</code>。   整句 <code>scale: interpolate(f, [12,18], [1.08,1], {easing: Easing.out(Easing.poly(4)), ...clamp})</code>；   角框 <code>[12,21]</code> 配 <code>Easing.out(Easing.quad)</code>（<strong>同一个起点 12、不同的终点</strong>，这就是&quot;同帧起不同时停&quot;）；   末词换色用 <code>interpolateColors(f, [21,26], ['#1d1d1f', '#e8720c'])</code>（Remotion 内置，不用手插值）；   点阵 <code>opacity: interpolate(f, [24,36], [0,0.5], {...clamp})</code> —— <strong>上限写 0.5 不是 1</strong>。   四角的方向向量在 Remotion 里最省的写法是一个 <code>[[-1,-1],[1,-1],[-1,1],[1,1]].map()</code>。</p><ul><li>剪辑软件对应物：剪映/CapCut——主标题一个文本层（&quot;缩放&quot;108% → 100% + &quot;不透明度&quot; 0 → 100，0.2s），</li></ul><p>  末词<strong>必须拆成独立文本层</strong>叠在主标题上（剪映不能给一句话里的单词单独打关键帧），   该层延后 3 帧再打&quot;缩放&quot;115% → 100% + 换文字颜色（换色做不了补间，直接在起点帧切换颜色即可，   3 帧的位置观众读作同一瞬间）。四角用四个 L 形贴纸各打&quot;位置&quot;+&quot;不透明度&quot;关键帧，<strong>时长设成主标题的 1.5 倍</strong>。   点阵用一张 PNG 点阵图（或&quot;网格&quot;贴纸），只打&quot;不透明度&quot; 0 → 50。   <strong>剪映的&quot;冲击&quot;类入场预设不要用</strong>——它们自带模糊和抖动，会把&quot;一屏一次砸&quot;变成全屏震动。   AE——主标题 <code>Scale</code> + <code>Opacity</code> 配 <code>Easy Ease Out</code> 手柄拉到 90%（模拟 power4）；   四角做成一个预合成，<code>Scale</code>/<code>Position</code> 用同起点、更长的关键帧区间；   末词用 <code>Text Animator</code> 的 <code>Fill Color</code> + <code>Scale</code>，<code>Range Selector</code> 只框住末词，<code>Offset</code> 延后 3 帧；   点阵用 <code>Grid</code> 效果或 <code>CC Ball Action</code>，只给 <code>Opacity</code> 打 0 → 50。</p><ul><li>与本库同类卡的分工：<code>chapter-title-card</code> = 章节转场（有色块压屏 + 扫出，是<strong>转场</strong>不是开场）；</li></ul><p>  <code>behind-text-title</code> = 标题从人物身后升起（做空间层次，低能量，可长时间挂着）；   <code>color-slam-beat-card</code> = 整屏硬切纯色 + 大字（每句重音都能用，是节拍器）；   <code>slab-punch-title</code> = 两行&quot;铺垫 / 结论&quot;（重点装在色块里，语义是重量）；   <strong>本卡 = 视频最开头那 3 秒的钩子</strong>，特征是&quot;一次砸 + 一整套衬件同时立起&quot;，   它给的是&quot;这个片子接下来很紧凑&quot;这个承诺，全片只用 1~2 次。</p><h3>动效范围</h3><ul><li>属于本卡的：「一屏里砸只有一次」这条构图纪律，及其实现——权重严格递减的四层（标题 <code>power4.out</code> 0.2s / 角框 <code>power2.out</code> 0.3s / 点阵 <code>power1.out</code> 0.4s 且 <code>opacity ≤0.5</code> / 副题最后一拍）；角框与标题<strong>同帧起、不同时停</strong>（<code>cornerDur</code> = <code>slamDur</code> 的 1.5 倍、缓动低两阶）这个&quot;同一版式里更沉的那件&quot;的表达法；末词延后 <strong>3 帧</strong>、换色与 punch <strong>同轨同停</strong>、<code>transform-origin: 0% 50%</code> 防压字这组末词纪律；砸作用在<strong>整行的一个 transform</strong> 上（不是逐字）；四角 L 框臂长相等 + 对角方向向量 × 12px 向内收 + <code>z-index</code> 压过人物；点阵<strong>只被 opacity 驱动、无任何位移</strong>这条衬件底线；末词/角框/点阵三者共用同一强调色（同一系统的三个强度档）。</li><li>不属于本卡的：demo 那句「三秒抓住重点 / 接下来这三分钟，只讲清楚一件事」的具体文案、72px 与 25px 这两个字号、<code>#e8720c</code> 这个橙（同色系任取）、角框 46px 臂长与 4px 描边的具体值（比例是舞台高的 8.5% / 0.75%）、点阵 5×4 的格数与 24px 间距、点阵落在标题上方偏右这个具体位置、副题的灰 <code>#8a8a8a</code>、右侧主持人（数字人）占位、以及&quot;标题落在左侧、左边距 78px&quot;这个落位。</li><li>迁移接口：内容入口三段纯文本（前半句 3~5 字 / 末词 2~3 字必须是独立元素 / 副题 10~18 字）；能量只调 <code>slamDur</code>（0.14~0.35s），<code>cornerDur</code> 必须跟着保持 1.5 倍比例；<code>dotsOpacity ≤0.5</code> 与 <code>wordDelay 3 帧</code> 是命门常量，换尺寸换语速都不要动；换字号时主标题 <code>font-size</code>、副题（约 1/3）、角框尺寸（舞台高 8.5%）、<code>cornerIn</code>（角框臂长的 26%）按同一比例缩放；换强调色改三处（角框 border / 点阵 gradient / <code>CONFIG.accent</code>）且必须同色；竖屏把标题拆成两行（每行 4~5 字）、字号收到 60~68px，角框改成只留<strong>对角两个</strong>（竖屏四角框会把画面框得太满，对角两角是 <code>corner-bracket-frame</code> 那张卡的做法，在竖屏里更成立）。</li><li>底色要求：白底即可。深底也成立（标题反白、副题换 <code>#a1a1a6</code>、角框与点阵保持强调色），但深底上点阵的 0.5 上限要收到 0.35——深底上同样不透明度的暖色点更显眼。<strong>渐变底与实拍花底不行</strong>：四角 L 框是 4px 硬边线、点阵是 3px 圆点，底上任何高频细节都会让这两层读作噪点而不是版式。</li></ul>","keyword-pop-highlight":"<h3>意图</h3><p>口播的听觉重音需要一个视觉重音来配对——观众静音刷视频时也能抓到重点。 命门：<strong>快</strong>（弹出 ≤0.2s，慢了像 PPT 入场）、<strong>晚半拍</strong>（等语音念到该词才弹， 与整句字幕同时出现就没有&quot;砸出来&quot;的劲）、<strong>有反冲</strong>（过冲到 1.65 再回落， 线性放大读作缩放素材而不是强调）。</p><h3>动效核心</h3><ul><li>关键词单独包 span，<code>transform-origin</code> 设在词底部中心（50% 80%）</li><li>入场：scale 0→1.65 + rotate -8°→2°，0.18s，<code>power4.out</code></li><li>回落：scale 1.65→1.15 + rotate 归零，0.22s，<code>back.out(2.5)</code>——定格比正文略大</li><li>冲击帧：弹出瞬间整个画面 x 方向 ±7px 抖 3 个来回（0.04s/次），传导&quot;砸&quot;的力</li><li>色块底：暗红色块 skewX(-6°)，跟词一起弹；关键词用高饱和黄压在色块上，与正文字色拉开</li><li>关键词 span 左右留 ≥0.3em 外边距：1.15 倍定格 + skew 会横向溢出，边距不够色块压相邻字</li></ul><h3>参数表</h3><table><tr><th>参数</th><th>典型值</th><th>调节手感</th></tr><tr><td>最大倍数</td><td>1.65</td><td>&gt;1.9 读作搞笑/整活；&lt;1.3 强调感不足</td></tr><tr><td>弹出时长</td><td>0.18s</td><td>&gt;0.3s 读作 PPT 动画；&lt;0.1s 看不清运动方向</td></tr><tr><td>定格倍数</td><td>1.15</td><td>回到 1.0 强调消失；&gt;1.3 破坏整句排版</td></tr><tr><td>延迟</td><td>0.4~0.6s</td><td>必须对齐语音重音；提前出现剧透，滞后读作卡顿</td></tr><tr><td>震动幅度</td><td>7px</td><td>&gt;12px 读作故障；0 则&quot;砸&quot;感减半</td></tr><tr><td>词左右边距</td><td>0.36em</td><td>给定格放大 + skew 留溢出位；&lt;0.2em 色块会压住相邻字</td></tr></table><h3>用量上限（2026-08-27 用户定版）</h3><ul><li>本卡是<strong>唯一允许作用于底部跟读字幕的动效</strong>（底部字幕素排铁律见 design-language.md §5），</li></ul><p>  且同一个视频内<strong>最多出现 3 次</strong>，除非用户明确要求更多。超了不是多强调，是把强调稀释成噪音。</p><ul><li><code>template/motion-systems/Subtitles.tsx</code> 的 <code>keywords</code> prop 内建这个上限自检（超 3 个直接抛错，</li></ul><p>  用户明确要求时传 <code>allowExtraKeywordPops</code> 放行）。</p><h3>已知坑</h3><ul><li>与整句字幕同帧出现——没有时间差就没有强调，一眼假。</li><li>transform-origin 用默认中心——词往上下两头胀，挤压相邻文字；设在词底才像&quot;从字幕里长出来&quot;。</li><li>用透明度渐显代替 scale 弹出——读作打字机而不是重音。</li><li>一句里弹两个以上关键词——重音互相打架，等于没有重音。</li></ul><h3>复用指引</h3><ul><li>HTML/GSAP：demos/keyword-pop-highlight/index.html，改 <code>.caption</code> 内文案和 <code>CONFIG</code> 常量即可；色块颜色在 <code>.kw::before</code>。</li><li>Remotion 移植：用 <code>spring({frame, config:{damping:12, stiffness:200}})</code> 驱动 scale，震动用 <code>Math.sin(frame*3)*7*exp(-frame/4)</code> 衰减；关键词 delay 换算成帧数对齐音频波形峰值。</li><li>剪辑软件对应物：剪映&quot;文字模板→综艺感&quot;类；AE 里是 scale 关键帧 + Overshoot 表达式；CapCut &quot;text bounce&quot;。</li><li>（实测变体）强调的第三条通道是<strong>字体对比</strong>——缩放弹跳、换色之外，还可以把重音词换成衬线斜体大字、运动刻意做轻不过冲，走克制编辑气质而非综艺感。这条通道已独立成卡：见 references/cards/type-contrast-emphasis.md（TheAIScaler 8/10 shorts 的招牌机制）。分工：本卡=听觉重音要&quot;砸&quot;（弹跳+震动+色块），type-contrast-emphasis=重音要&quot;稳&quot;（字形落差+轻上滑）；<strong>两者不可在同一句里混用</strong>，回弹与气质对比同屏一眼假。</li></ul><h3>动效范围</h3><ul><li>属于本卡的：关键词 scale 0→1.65 + rotate −8°→2° 弹出（0.18s、power4.out、transform-origin 设在词底 50% 80%）；scale 1.65→1.15 + rotate 归零的过冲回落（0.22s、back.out(2.5)）；同帧整屏 x ±7px 抖 3 个来回的冲击帧（0.24s、匀速）；色块底与词同 transform 一起弹（skewX −6° 静态形变，不单独做动画）；关键词比整句字幕晚 0.4~0.6s 出现的时序关系。</li><li>不属于本卡的：主持人剪影与字幕区占位、示例台词、字号字重与字体、色块与关键词的具体颜色值（暗红/高饱和黄只是&quot;色块与字要拉开对比&quot;的一种取值）。</li><li>迁移接口：<code>popScale</code>/<code>restScale</code> 定强调量级，<code>popIn</code>/<code>settle</code> 定快慢，<code>delay</code> 对齐语音重音帧，<code>shakePx</code> 定冲击力；换配色改 <code>.kw</code> 的 color 与 <code>.kw::before</code> 的 background（只需保证两者与正文字色三方对比成立）；换尺寸时 padding/margin 用 em 跟字号等比缩放，词左右边距别低于 0.2em。</li><li>底色要求：白底即可（色块底自带不透明背景，动效不依赖舞台底色；深底上只需把正文字色与关键词色反过来配）。</li></ul>","slab-punch-title":"<h3>意图</h3><p>&quot;重点放大&quot;要解决的不是&quot;让字更大&quot;，而是<strong>让观众知道哪个词是结论</strong>。 直接把第二行写成大红字也能大，但它跟第一行是同一种东西（都是字），观众读到的是&quot;两行标题&quot;； 一旦第二行被装进一个<strong>块</strong>里，两行就变成了&quot;铺垫&quot;和&quot;结论&quot;两种物件——层级是靠介质差做出来的，不是靠字号差。</p><p>命门三条： ① <strong>块先到位、字后落</strong>。色块撑开的 0.22s 里第二行是空块，白字在块停住的那一帧才出现。 反过来（字先在、块从字下面长出来）读作&quot;字被块追上&quot;，块变成了给字上色的马克笔， 这张卡就退化成 <code>highlighter-sweep</code>（那是荧光笔语义，能量档低一级）。 ② <strong>块的 -2.5° 斜切是静态形状属性，不是动效</strong>。它写在 CSS 的 <code>transform: rotate()</code> 上， GSAP 全程不碰。做成&quot;落定后回正&quot;或&quot;落定后抖两下&quot;都是错的——手作感由形状本身给（design-language §4）， 不靠定格抖动。 ③ <strong>第一行是&quot;硬现&quot;不是&quot;淡入&quot;</strong>：<code>scale 1.04 → 1</code> + opacity 走 0.18s，<strong>无位移</strong>。 1.04 这个量小到读不出缩放，但它让&quot;出现&quot;这件事有了一点厚度；给它加 y 位移立刻变成入场动效， 第一行就不再是&quot;背景铺垫&quot;而是抢了第二行的戏。</p><h3>动效核心</h3><ul><li><strong>三拍串行，每拍只有一个主角</strong>（这是它读起来干净的原因）：</li></ul><p>  - 拍① <code>t=0.40</code> 第一行：<code>scale 1.04 → 1</code> + <code>opacity 0 → 1</code>，<code>0.18s power3.out</code>，<strong>无位移</strong>，     <code>transform-origin: 0% 50%</code>（左对齐是构图基线，4% 的缩放不许把左边缘挪走）   - 拍② <code>t=0.65</code>（第一行落定 + 0.07s 呼吸）色块：<code>scaleX 0 → 1</code>，<code>transform-origin: 50% 50%</code>，     <code>0.22s power3.out</code> —— <strong>从中心撑开</strong>，不是从左展开（从左展开是 <code>alt-block-lines</code> 的语言）   - 拍③ <code>t=0.87</code>（= 拍②结束的那一帧）白字：<code>opacity</code> <strong>硬切 0 → 1</strong>（0 帧，用 <code>tl.set</code>），     同帧 <code>scale 1.12 → 1</code> 走 <code>0.167s power3.out</code>（punch 5 帧 @30fps）</p><ul><li><strong>白字的 opacity 必须是硬切</strong>：给它 0.1s 的淡入，字就会在块里&quot;显影&quot;，</li></ul><p>  和块撑开那一拍连成一段渐变，&quot;块停 → 字砸&quot;这个断点就没了</p><ul><li><strong>DOM 三层，各管一件事</strong>（斜切与动画互不干扰的实现口径）：</li></ul><p>  外层 <code>.sp-l2</code> 只有静态 <code>rotate(-2.5deg)</code> → 中层 <code>.sp-slab</code> 只有 padding（决定&quot;块比字大一圈&quot;）   → 内层两个兄弟：<code>.sp-slab-bg</code>（绝对定位铺满，唯一被 <code>scaleX</code> 的元素）与 <code>.sp-l2-t</code>（相对定位压在
