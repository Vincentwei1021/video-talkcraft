<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>type-contrast-emphasis · 字体对比重音</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* 演示语境（不属于动效）：主持人占左侧一列，右侧纯白区排一句逐词追加的主字幕。
     字体对比靠"衬线/无衬线 + 字号落差"成立，深底或实拍花底上黑字不可读——
     demo 让字幕落在纯白区（应用侧同理：花底改白字 + 描边，见卡片"迁移接口"）。 */
  /* 47% ≈ 452px：数字人视频渲染宽 427.7px，容器要给足这个宽度人物才能整体站进画里，
     左右各留 ≥10px 呼吸边（人物不缩小、不截断，整体往中间挪，2026-08-25 定版） */
  .host-wrap {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 47%;
    overflow: hidden;
  }
  /* 字幕列让位给挪进来的人物（人物可见像素右缘约 x=391）：从 48%（461px）起，右边距收到 3% */
  .tc-captions {
    position: absolute;
    left: 48%;
    right: 3%;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    /* 尺寸基准：普通词字号 + 重音词放大倍数，换尺寸只改这两个数 */
    --tc-base: 32px;
    --tc-serif-scale: 1.6;   /* 通道① 字形：衬线斜体放大 1.5~2 倍 */
    --tc-color-scale: 1.5;   /* 通道② 色彩：换强调色，放大量级可略收 */
  }
  /* 命门：所有词共一条基线（align-items: baseline），大字从基线往上长，基线一动就散 */
  .tc-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: flex-start;
    gap: 10px 12px;
  }

  /* —— 动效本体 —— 普通词：无衬线中字，小字号，全程只做 0.1s 轻 pop */
  .tc-word {
    display: inline-block;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: var(--tc-base);
    font-weight: 600;                /* 中字：给重音词留出字重落差 */
    line-height: 1.3;
    color: #1d1d1f;
    transform-origin: 50% 100%;      /* 缩放锚在基线：轻 pop 不推基线 */
    opacity: 0;                      /* 整句预占位：DOM 先建好，追加时不回流 */
  }

  /* 通道① 字形通道：切衬线族 + 放大。中文没有真斜体，靠 skewX 显式倾斜（GSAP 里设） */
  .tc-word.emph-serif {
    font-family: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC",
                 Georgia, "Playfair Display", serif;
    font-size: calc(var(--tc-base) * var(--tc-serif-scale));
    font-weight: 600;
    margin-right: 4px;               /* 倾斜后右上角外探，多留一点位防压相邻字 */
  }

  /* 通道② 色彩通道：换全片唯一强调色 + 放大，字族不变。
     两个通道是"二选一"的替代关系，不叠在同一个词上 */
  .tc-word.emph-color {
    font-size: calc(var(--tc-base) * var(--tc-color-scale));
    font-weight: 800;
    color: #0066cc;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="host-wrap"><div class="host-placeholder"></div></div>
    <div class="tc-captions">
      <div class="tc-line" id="tcLine"></div>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // —— 可摘走的核心动画（复制 CONFIG + register 内部即可复用）——
    // 一句字幕逐词追加：普通词 0.1s 轻 pop（scale 0.95→1，无回弹）；
    // 重音词换字体气质（衬线斜体放大 / 换强调色放大）+ 从基线下方上滑回落 0.15s。
    // 强调量级全部来自"字体对比"，运动本身刻意做轻——不弹跳、不过冲。
    const CONFIG = {
      startDelay: 0.15,      // 开场留一拍等语音起
      wordIn: 0.10,          // 普通词轻 pop 时长 s：>0.2s 跟不上语速
      wordFromScale: 0.95,   // 普通词起始倍数：只做"落笔"的一下，不做弹跳
      accentIn: 0.15,        // 重音词入场时长 s：字大所以给多 50ms，仍要轻
      accentFromScale: 0.92, // 重音词起始倍数（配合上滑，读作"顶上来"）
      accentRise: 14,        // 重音词从基线下方多少 px 上滑回落（约字号的 30%）
      obliqueDeg: -7,        // 衬线词倾斜角：中文无真斜体，显式 skewX 6~10° 才各端一致
      mode: "append",        // "append" 追加式（已说的词保留）/ "relay" 接力式（前词硬切消失）
      // 分词 + 词级语音时刻（相对第一词，秒）——必须抄真实语速，匀速一眼假
      // emph: "serif" = 字形通道 / "color" = 色彩通道 / 不填 = 普通词
      words: [
        { w: "能留住人的", beat: 0.00 },
        { w: "不是",       beat: 0.72 },
        { w: "流量",       beat: 1.02, emph: "serif" },
        { w: "是",         beat: 1.36 },
        { w: "信任",       beat: 1.52, emph: "color" },
      ],
    };

    DemoShell.register(({ speed }) => {
      const line = document.getElementById("tcLine");
      line.innerHTML = "";                         // 重播：从头重建整句

      // 整句预占位：先把所有词建成 DOM（CSS 里 opacity:0 占住排版），
      // 之后逐词入场只改 transform/opacity，绝不触发回流
      const els = CONFIG.words.map((item) => {
        const el = document.createElement("span");
        el.className = "tc-word" + (item.emph ? " emph-" + item.emph : "");
        el.textContent = item.w;
        line.appendChild(el);
        return el;
      });

      const tl = gsap.timeline();
      tl.timeScale(speed);

      CONFIG.words.forEach((item, i) => {
        const t = CONFIG.startDelay + item.beat;   // 该词的语音时刻
        if (!item.emph) {
          // 普通词：极轻的 pop，无回弹——它的本分是把句子铺出来，不抢重音
          tl.fromTo(els[i],
            { opacity: 0, scale: CONFIG.wordFromScale },
            { opacity: 1, scale: 1, duration: CONFIG.wordIn,
              ease: "power2.out", immediateRender: true },
            t);
        } else {
          // 重音词：气质已由 CSS 换掉（衬线斜体放大 / 强调色放大），
          // 运动只做"从基线下方上滑回落 + 轻放大淡入"，power3.out 收得干净
          const skew = item.emph === "serif" ? CONFIG.obliqueDeg : 0;
          tl.fromTo(els[i],
            { opacity: 0, y: CONFIG.accentRise, scale: CONFIG.accentFromScale, skewX: skew },
            { opacity: 1, y: 0, scale: 1, skewX: skew, duration: CONFIG.accentIn,
              ease: "power3.out", immediateRender: true },
            t);
        }
        // 接力式：前词在本词语音帧硬切消失（无出场动画），屏上只留当前词
        if (CONFIG.mode === "relay" && i > 0) {
          tl.set(els[i - 1], { opacity: 0 }, t);
        }
      });
      // 追加式全句完成后保持定格——完成的对比排版本身就是这张卡的落点
    });
  </script>
</body>
</html>
