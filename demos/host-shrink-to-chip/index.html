<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>host-shrink-to-chip · 人物缩位让台</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 层级：图形主角（z2） → 人物裁切窗（z3） → chip 描边（z4） → 字幕（z5）——
     中性化：白底、灰阶线框图形卡，零装饰。本卡内容 = 人物层的"缩位/回归"时序 */

  /* 人物裁切窗：几何全程锁在舞台坐标系里（只动 clip-path，不动 transform） */
  .host-clip {
    position: absolute;
    inset: 0;
    z-index: 3;
  }
  /* 人物层：真正被缩放位移的那一层（demo-shell 会往 .host-placeholder 里注入数字人视频，
     视频是 absolute 定位的子元素，父层 transform 会带着它一起走）。
     背景改透明——否则全屏态的白底会把对侧入场的图形卡糊掉 */
  .host-clip .host-placeholder {
    background: transparent;
    will-change: transform;
  }

  /* chip 描边：白底上没有这根发丝线就读不出"头像章"的边界。几何由 JS 单点写入 */
  .chip-ring {
    position: absolute;
    z-index: 4;
    border: 1px solid #e0e0e0;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }

  /* —— 演示语境（不属于动效）：灰阶线框图表卡 —— */
  .gfx {
    position: absolute;
    z-index: 2;
    right: 48px;
    top: 92px;
    width: 590px;
    padding: 22px 26px 18px;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    color: #1d1d1f;
    opacity: 0;
  }
  .gfx .gfx-head {
    font-size: 13px;
    letter-spacing: 2px;
    color: #8a8a8a;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f0f0;
  }
  .gfx .gfx-big {
    font-size: 30px;
    font-weight: 700;
    margin: 14px 0 2px;
    letter-spacing: 1px;
  }
  .gfx .gfx-note { font-size: 13px; color: #8a8a8a; }
  .gfx svg { display: block; margin-top: 6px; }

</style>
</head>
<body>
  <div id="stage">
    <!-- 图形主角：口播讲到的那张图（内部静态——柱子自己的生长动效属于 chart-grow 卡） -->
    <div class="gfx">
      <div class="gfx-head">韩国综合股价指数 · 年末收盘</div>
      <div class="gfx-big">2,398 → 4,062</div>
      <div class="gfx-note">2020—2025，五年翻了将近一倍</div>
      <svg viewBox="0 0 538 178" width="538" height="178" aria-hidden="true">
        <line x1="0" y1="30" x2="538" y2="30" stroke="#f2f2f2"/>
        <line x1="0" y1="82" x2="538" y2="82" stroke="#f2f2f2"/>
        <line x1="0" y1="134" x2="538" y2="134" stroke="#f2f2f2"/>
        <line x1="0" y1="152" x2="538" y2="152" stroke="#d8d8d8"/>
        <g fill="#dcdcdc">
          <rect x="22"  y="96"  width="48" height="56"/>
          <rect x="106" y="78"  width="48" height="74"/>
          <rect x="190" y="106" width="48" height="46"/>
          <rect x="274" y="66"  width="48" height="86"/>
          <rect x="358" y="38"  width="48" height="114"/>
          <rect x="442" y="18"  width="48" height="134"/>
        </g>
        <g fill="#b0b0b0" font-size="11" text-anchor="middle"
           font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
          <text x="46"  y="170">2020</text>
          <text x="130" y="170">2021</text>
          <text x="214" y="170">2022</text>
          <text x="298" y="170">2023</text>
          <text x="382" y="170">2024</text>
          <text x="466" y="170">2025</text>
        </g>
      </svg>
    </div>

    <!-- 人物层：全屏 → 角标圆 chip → 回归全屏 -->
    <div class="host-clip" data-crop-ok>
      <div class="host-placeholder"></div>
    </div>
    <div class="chip-ring"></div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ——————————————————————————————————————————————————————————
    // 可摘走的核心动画：人物缩位让台（缩位 → 图形错峰入场 → 角标期，单程不回归）
    // 关键工程点：裁切窗（clip-path，锁在舞台坐标系）与人物层（transform）由同一个
    // 进度 t 驱动 —— 拆成两条 tween 会因缓动不同步让人脸半路出框。
    // ——————————————————————————————————————————————————————————
    const CONFIG = {
      startDelay: 0.8,     // 全屏口播先站一拍，等语音说到"我先把图摆出来"
      shrink: 0.42,        // 缩位耗时 s：0.35~0.5，power2.inOut（起收都要缓）
      chipRatio: 0.18,     // 圆 chip 直径 / 屏宽
      chipInsetX: 0.042,   // chip 左边距 / 屏宽
      chipInsetBottom: 0.089, // chip 下边距 / 屏高（下角定版：圆心必须落在画面下 1/3 带内）
      chipScale: 0.72,     // 角标期人物层缩放：脸约占 chip 直径 57%（头肩取景）
      anchorX: 0.5,        // 取景锚点（映射到 chip 圆心的那个源点）/ 屏宽
      anchorY: 0.324,      // 同上 / 屏高——略低于头部中心，取景才带上肩
      gfxLag: 0.15,        // 图形相对缩位起点的错峰延迟 s：同帧出场=两边打架
      gfxIn: 0.45,         // 图形入场耗时 s（power3.out）
      gfxSlide: 90,        // 图形从对侧滑入的位移 px
      hold: 2.0,           // 角标期停留 s（实拍 = 讲完这张图，可任意延长）
      ease: "power2.inOut",
    };

    const lerp = (a, b, t) => a + (b - a) * t;

    DemoShell.register(({ speed }) => {
      const stage = document.getElementById("stage");
      const clip = document.querySelector(".host-clip");
      const host = clip.querySelector(".host-placeholder");
      const ring = document.querySelector(".chip-ring");
      const gfx = document.querySelector(".gfx");

      // chip 几何：一份数据同时喂给裁切窗与描边，永不错位
      const SW = stage.offsetWidth, SH = stage.offsetHeight;
      const r = (SW * CONFIG.chipRatio) / 2;
      const cx = SW * CONFIG.chipInsetX + r;
      const cy = SH - SH * CONFIG.chipInsetBottom - r;
      const chipBox = { top: cy - r, right: SW - (cx + r), bottom: SH - (cy + r), left: cx - r };
      // 缩位位移：让"取景锚点"落到 chip 圆心（缩放绕锚点做，所以位移就是两点之差）
      const dx = cx - SW * CONFIG.anchorX;
      const dy = cy - SH * CONFIG.anchorY;

      Object.assign(ring.style, {
        left: chipBox.left + "px", top: chipBox.top + "px",
        width: r * 2 + "px", height: r * 2 + "px",
      });

      // t: 0 = 全屏主角，1 = 角标 chip。裁切与内容同一进度
      const setHost = (t) => {
        clip.style.clipPath = "inset(" +
          lerp(0, chipBox.top, t).toFixed(2) + "px " +
          lerp(0, chipBox.right, t).toFixed(2) + "px " +
          lerp(0, chipBox.bottom, t).toFixed(2) + "px " +
          lerp(0, chipBox.left, t).toFixed(2) + "px round " +
          lerp(0, r, t).toFixed(2) + "px)";
        gsap.set(host, {
          scale: lerp(1, CONFIG.chipScale, t),
          x: lerp(0, dx, t),
          y: lerp(0, dy, t),
          transformOrigin: (CONFIG.anchorX * 100) + "% " + (CONFIG.anchorY * 100) + "%",
        });
      };

      // 重播语义：全部复位
      const p = { t: 0 };
      setHost(0);
      gsap.set(ring, { opacity: 0 });
      gsap.set(gfx, { opacity: 0, x: CONFIG.gfxSlide });

      const tl = gsap.timeline();
      tl.timeScale(speed);

      // ① 缩位：全屏 → 角标圆 chip（人不消失，角标里继续口播——视频不许暂停/定格）
      tl.to(p, { t: 1, duration: CONFIG.shrink, ease: CONFIG.ease,
                 onUpdate: () => setHost(p.t) }, CONFIG.startDelay)
        .to(ring, { opacity: 1, duration: 0.2, ease: "power2.out" },
            CONFIG.startDelay + CONFIG.shrink * 0.55)
        // ② 图形主角从对侧错峰入场（晚 0.15s，让位在前、接位在后）
        .to(gfx, { opacity: 1, x: 0, duration: CONFIG.gfxIn, ease: "power3.out" },
            CONFIG.startDelay + CONFIG.gfxLag);

      // ③ 角标期：位置全程锁定，不漂不呼吸——只有人在动。
      // 让台是单程的：图形接管后一直讲到底，不放大回来（回归留给应用侧下一个节拍自行决定）
      tl.to({}, { duration: CONFIG.hold });
    });
  </script>
</body>
</html>
