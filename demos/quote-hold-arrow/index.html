<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>quote-hold-arrow · 金句停留</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* 演示语境（不属于动效）：右侧人物列
     width 448px 给 427.7px 宽的数字人留 ≥10px 呼吸边（人物不缩小、不截断、整体往中间挪，2026-08-25 定版） */
  .host-col { position: absolute; right: 10px; bottom: 0; width: 448px; height: 100%; }

  /* —— 动效本体 —— 三行金句，末行会"升级"成高亮句 */
  .qh-block {
    position: absolute;
    left: 84px;
    top: 50%;
    transform: translateY(-50%);
    width: 460px;          /* 右缘 544px：退到人物可视左缘（564px）之外，三行 nowrap 不受影响 */
  }
  .qh-line {
    font-size: 33px;
    font-weight: 600;
    line-height: 1.52;
    color: #1d1d1f;
    white-space: nowrap;
    opacity: 0;
  }
  /* 末行：文字保持黑字，高亮框在下层铺开（荧光笔语义，不是反白 chip） */
  .qh-last { position: relative; display: inline-block; }
  .qh-hl {
    position: absolute;
    left: -12px; right: -14px;
    top: 4px; bottom: 4px;
    background: #FFE949;
    opacity: 0.62;
    mix-blend-mode: multiply;          /* 命门：框不许盖字 */
    border-radius: 11px 5px 9px 4px / 6px 11px 5px 9px;   /* 不规则圆角 = 笔触 */
    transform: scaleX(0);
    transform-origin: 50% center;      /* 从文字中心铺开（不是从左划过） */
    z-index: 0;
  }
  .qh-last-txt { position: relative; z-index: 1; display: inline-block; }
</style>
</head>
<body>
  <div id="stage">
    <div class="host-col"><div class="host-placeholder"></div></div>

    <div class="qh-block">
      <div class="qh-line">你现在觉得难受</div>
      <div class="qh-line">不是因为你不行</div>
      <div class="qh-line">
        <span class="qh-last">
          <span class="qh-hl"></span><span class="qh-last-txt">是因为你正在走出舒适区</span>
        </span>
      </div>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // —— 动效本体（可整段摘走）：前两行平铺淡入 → 末行先平淡后升级（框铺开 + punch）——
    // 2026-08-26 用户定版：去掉了原来第三拍伸出的箭头。金句的落点是"这一句被点亮然后停住"，
    // 箭头会把视线从句子引开、还得在右侧多留 104px 版面（那正是人物要站的地方）。
    const CONFIG = {
      lead: 0.4,          // 起手静置 s
      lineDur: 0.28,      // 单行淡入耗时 s
      lineStagger: 0.12,  // 前两行错峰 s
      lineRise: 8,        // 行上浮位移 px
      plainHold: 0.34,    // **命门**：末行"平淡"停留 s，之后才升级。=0 就少了"重点在这一句"的推进
      hlDur: 0.24,        // 高亮框从中心铺开耗时 s
      punchScale: 1.05,   // 框到位后文字 punch 起始倍数（1.05→1）
      punchDur: 0.17,     // punch 5 帧 @30fps
      hold: 2.2,          // 收尾停留 s：金句要停（punch 完就进 hold，落点是"停住"不是"指出去"）
    };

    DemoShell.register(({ speed }) => {
      const lines = Array.from(document.querySelectorAll(".qh-line"));
      const hl = document.querySelector(".qh-hl");
      const txt = document.querySelector(".qh-last-txt");

      // 重播语义：全部复位
      gsap.set(lines, { opacity: 0, y: CONFIG.lineRise });
      gsap.set(hl, { scaleX: 0 });
      gsap.set(txt, { scale: 1 });

      const tl = gsap.timeline();
      tl.timeScale(speed);

      // ① 三行逐行淡入上浮——**末行此刻是普通样式**（框还没出，第一拍是"平淡"）
      tl.to(lines, {
        opacity: 1, y: 0,
        duration: CONFIG.lineDur, ease: "power2.out",
        stagger: CONFIG.lineStagger,
      }, CONFIG.lead);

      // ② 第二拍：末行升级——高亮框从文字中心 scaleX 铺开，框到位后文字 punch
      const upAt = CONFIG.lead + CONFIG.lineStagger * (lines.length - 1)
        + CONFIG.lineDur + CONFIG.plainHold;
      tl.to(hl, { scaleX: 1, duration: CONFIG.hlDur, ease: "power3.out" }, upAt)
        .fromTo(txt,
          { scale: CONFIG.punchScale },
          { scale: 1, duration: CONFIG.punchDur, ease: "power2.out", transformOrigin: "50% 50%" },
          upAt + CONFIG.hlDur)
        // ③ hold：金句停 2.2s——punch 落定就是本卡的落点
        .to({}, { duration: CONFIG.hold }, upAt + CONFIG.hlDur + CONFIG.punchDur);
    });
  </script>
</body>
</html>
