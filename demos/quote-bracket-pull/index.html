<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>quote-bracket-pull · 引号夹句</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* 演示语境（不属于动效）：角标主持人——本卡不盖底板，人物全程留在画面里 */
  .host-badge {
    position: absolute;
    left: 26px; bottom: 22px;
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 1px solid #e0e0e0;
    overflow: hidden;
    background: #fff;
  }

  /* —— 动效本体 —— 金句块 + 两枚大引号（符号，不是装饰） */
  .qb-block {
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    width: fit-content;   /* 贴合最长一行——引号才"夹"在句子边上，不是钉在版心角上 */
  }
  .qb-line {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.5;
    color: #1d1d1f;
    white-space: nowrap;
    opacity: 0;
  }
  /* 大引号：尺寸必须压过正文两倍以上才立得住（32px 正文 ⇒ 108px 引号） */
  .qb-mark {
    position: absolute;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 108px;
    font-weight: 700;
    line-height: 1;
    color: #1d1d1f;
    opacity: 0;
    user-select: none;
  }
  .qb-mark.open  { left: -42px;  top: -74px; }
  .qb-mark.close { right: -30px; bottom: -104px; }

  /* 关键短语的荧光笔下划线（marker 语义色，属于动效本体） */
  .qb-mark-wrap { position: relative; display: inline-block; }
  .qb-marker {
    position: absolute;
    left: -5px; right: -7px;
    bottom: 6px;
    height: 15px;
    background: #FFE949;
    opacity: 0.6;
    mix-blend-mode: multiply;            /* 命门：色块在字下层，不许盖字 */
    border-radius: 9px 4px 8px 3px / 5px 9px 4px 8px;   /* 不规则圆角 = 笔触，不是选区 */
    transform: scaleX(0);
    transform-origin: left center;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="qb-block">
      <span class="qb-mark open">&ldquo;</span>
      <div class="qb-line">真正拉开差距的</div>
      <div class="qb-line">从来不是谁更聪明</div>
      <div class="qb-line">而是谁愿意<span class="qb-mark-wrap"><span class="qb-marker"></span>主动去解决问题</span></div>
      <span class="qb-mark close">&rdquo;</span>
    </div>

    <div class="host-badge"><div class="host-placeholder"></div></div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // —— 动效本体（可整段摘走）：两枚引号同帧向内"夹" → 三行错峰淡入 → 荧光笔扫关键短语 ——
    const CONFIG = {
      lead: 0.35,        // 起手静置 s：等口播念到金句第一个字
      markDur: 0.32,     // 引号推入耗时 s
      markOpacity: 0.9,  // 引号落定不透明度：<0.8 读作水印，1.0 抢过正文（引号是符号不是标题）
      markDx: 30,        // 引号横向推入距离 px（左 -30 / 右 +30，反向对称）
      markDy: 14,        // 引号纵向推入距离 px（左 -14 / 右 +14）
      lineDur: 0.30,     // 单行淡入耗时 s
      lineStagger: 0.09, // 行错峰 s：比 quote-card 的 0.15 更密——本卡是"一句话"不是"逐句砸"
      lineRise: 6,       // 行上浮位移 px：只有一点重量，不抢引号的"夹"
      markerGap: 0.10,   // 末行到位 → 荧光笔起扫 的呼吸 s
      markerDur: 0.26,   // 荧光笔扫过耗时 s
      hold: 2.2,         // 收尾停留 s：金句要停
    };

    DemoShell.register(({ speed }) => {
      const open = document.querySelector(".qb-mark.open");
      const close = document.querySelector(".qb-mark.close");
      const lines = Array.from(document.querySelectorAll(".qb-line"));
      const marker = document.querySelector(".qb-marker");

      // 重播语义：全部复位
      gsap.set(open, { opacity: 0, x: -CONFIG.markDx, y: -CONFIG.markDy });
      gsap.set(close, { opacity: 0, x: CONFIG.markDx, y: CONFIG.markDy });
      gsap.set(lines, { opacity: 0, y: CONFIG.lineRise });
      gsap.set(marker, { scaleX: 0 });

      const tl = gsap.timeline();
      tl.timeScale(speed);

      // ① 两枚引号从画外向内推入——**同帧同曲线**，错峰一点就散架（"夹住"是一个动作）
      tl.to([open, close], {
        opacity: CONFIG.markOpacity, x: 0, y: 0,
        duration: CONFIG.markDur, ease: "power3.out",
      }, CONFIG.lead);

      // ② 三行金句错峰淡入上浮（在引号已经就位的框里长出来）
      const linesAt = CONFIG.lead + CONFIG.markDur * 0.5;   // 引号走过一半就起字，不空等
      tl.to(lines, {
        opacity: 1, y: 0,
        duration: CONFIG.lineDur, ease: "power2.out",
        stagger: CONFIG.lineStagger,
      }, linesAt);

      // ③ 末行到位后荧光笔扫过关键短语
      const markerAt = linesAt + CONFIG.lineStagger * (lines.length - 1) + CONFIG.lineDur + CONFIG.markerGap;
      tl.to(marker, { scaleX: 1, duration: CONFIG.markerDur, ease: "power2.inOut" }, markerAt)
        // ④ hold：金句停 2.2s
        .to({}, { duration: CONFIG.hold }, markerAt + CONFIG.markerDur);
    });
  </script>
</body>
</html>
