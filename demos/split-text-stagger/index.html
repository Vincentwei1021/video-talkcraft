<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>split-text-stagger · 逐字裂升</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 逐字裂升：标题每个字在自己的裁切盒里从下方 115% 升起、带 10% 过冲回落，字间错峰 2 帧；同时一条基线从左向右长到整行宽，
     长满与最后一个字落定同步——字像从一条线里长出来。与 per-character-rise（无裁切无基线）的区别就是这两样：裁切 + 基线。白底成立。 —— */

  /* 整行：居中；每字一个 overflow hidden 的裁切盒（高 = 行高），内层 span 做位移 */
  .sts-line { position: absolute; left: 50%; top: 240px; transform: translateX(-50%); display: flex; gap: 2px; font-size: 64px; font-weight: 700; color: #1d1d1f; letter-spacing: -1px; white-space: nowrap; }
  .sts-ch { display: inline-block; height: 78px; line-height: 78px; overflow: hidden; }
  .sts-ch span { display: inline-block; will-change: transform; }
  /* 基线：3px 墨色，宽 = 整行宽（脚本量），从左向右 scaleX 生长 */
  .sts-base { position: absolute; left: 50%; top: 322px; height: 3px; background: #1d1d1f; transform-origin: 0 50%; }
  /* 副标：落定后跟进 */
  .sts-sub { position: absolute; left: 50%; top: 344px; transform: translateX(-50%); font-size: 20px; color: #7a7a7a; white-space: nowrap; opacity: 0; }
</style>
</head>
<body>
  <div id="stage">
    <div class="sts-line"></div>
    <div class="sts-base"></div>
    <div class="sts-sub"></div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ——————————————————————————————————————————————————————————
    // 可摘走的核心动画：逐字裂升（每字在裁切盒内从 115% 升到 0 带 10% 过冲、错峰 2 帧；基线同步长满）
    // 命门：① 过冲 10%（6% 可测不可感）——正常速度要看得见回落那一下；② 裁切盒高 = 行高，字从基线下方"被裁着"升出来，
    //      这一裁就是与逐字上升卡的全部区别；③ 基线生长时长 = 字的总 stagger 时长，长满与末字落定同帧；④ 全员落定真静止 ≥30f。
    // ——————————————————————————————————————————————————————————
    const CONFIG = {
      startAt: 0.3,     // 第一个字起升 s
      stagger: 0.067,   // 字间错峰 s（2 帧）
      dur: 0.5,         // 每字行程 s（yPercent 115→0）
      over: 1.2,        // back.out 系数：约 10% 过冲（<1.0 可测不可感）
      subAt: 1.4,       // 副标淡入起点 s（0.4s）
      exitAt: 4.4,      // 整组同收起点 s
      exitDur: 0.4,     // 同收时长（power2.in）
    };
    // 文案（演示语境）
    const TEXT = "把复杂的事，讲简单";
    const SUB = "——口播脚本的第一原则";

    const $ = (s) => document.querySelector(s);
    const line = $(".sts-line"), base = $(".sts-base"), sub = $(".sts-sub");
    line.innerHTML = [...TEXT].map((c) => `<span class="sts-ch"><span>${c}</span></span>`).join("");
    sub.textContent = SUB;
    const inner = [...line.querySelectorAll(".sts-ch > span")];
    const W = line.offsetWidth;   // 基线宽 = 整行宽（静态几何，量一次）
    const growDur = CONFIG.dur + CONFIG.stagger * (inner.length - 1);   // 基线长满 = 末字落定

    DemoShell.register(({ speed }) => {
      const tl = gsap.timeline();
      tl.timeScale(speed);
      // 复位（重播语义）
      tl.set(inner, { yPercent: 115 }).set(base, { width: W, x: -W / 2, scaleX: 0, opacity: 1 }).set(sub, { opacity: 0 }).set(line, { opacity: 1 })
        // 每字裂升：裁切盒内 115%→0，带 10% 过冲，错峰 2 帧
        .to(inner, { yPercent: 0, duration: CONFIG.dur, stagger: CONFIG.stagger, ease: `back.out(${CONFIG.over})` }, CONFIG.startAt)
        // 基线同步长满
        .to(base, { scaleX: 1, duration: growDur, ease: "power2.out" }, CONFIG.startAt)
        // 副标跟进
        .to(sub, { opacity: 1, duration: 0.4 }, CONFIG.subAt)
        // 整组同收
        .to([line, base, sub], { opacity: 0, duration: CONFIG.exitDur, ease: "power2.in" }, CONFIG.exitAt);
    });
  </script>
</body>
</html>
