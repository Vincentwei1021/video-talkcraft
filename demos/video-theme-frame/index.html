<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>video-theme-frame · 单视频主题边框</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 单视频镜头：不裸贴、不装假播放器（无进度条 / 播放键 / 时间码），给视频一只有出处的"框"——demo 巡演八式，成片一镜一式 —— */
  .frame { position: absolute; opacity: 0; transform-origin: 50% 50%; }
  .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame svg path, .frame svg rect { stroke-dasharray: 1 1; stroke-dashoffset: 1; }   /* pathLength=1：dashoffset 1→0 = 一笔画完 */
  .bevel { position: absolute; background: #dcdcdc; border: 1px solid #222; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #888; box-sizing: border-box; }
  .holes span { position: absolute; top: 0; width: 18px; height: 26px; border-radius: 3px; background: #fff; }   /* 齿孔 = 舞台底色 */
  .mono { font-family: "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
  <div id="stage">
    <!-- I · 复古浏览器（Mac OS 9 铂金窗口）：条纹标题栏 + 三只方钮、斜面导航钮 + 白地址栏、状态条 + 右下拖拽纹 -->
    <div class="frame" data-kind="browser-retro" style="left:80px;top:38px;width:800px;height:464px;background:#dcdcdc;border:1px solid #000;box-sizing:border-box;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #7a7a7a,0 14px 40px rgba(0,0,0,.25);font-family:Charcoal,'Lucida Grande',Geneva,sans-serif">
      <div style="position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(180deg,#ececec 0 1px,#c9c9c9 1px 2px);border-bottom:1px solid #000">
        <div class="bevel" style="left:6px;top:4px;width:12px;height:12px"></div>
        <div class="bevel" style="right:24px;top:4px;width:12px;height:12px"></div>
        <div class="bevel" style="right:6px;top:4px;width:12px;height:12px"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000"><span style="background:#dcdcdc;padding:0 8px">Untitled</span></div>
      </div>
      <div style="position:absolute;left:0;right:0;top:23px;height:30px;border-bottom:1px solid #8a8a8a;display:flex;align-items:center;gap:6px;padding:0 8px;box-sizing:border-box">
        <span class="bevel" style="position:relative;display:inline-block;width:22px;height:18px"></span><span class="bevel" style="position:relative;display:inline-block;width:22px;height:18px"></span>
        <div style="flex:1;height:18px;background:#fff;border:1px solid #555;box-shadow:inset 1px 1px 0 #999;font-size:11px;line-height:16px;padding:0 6px;color:#777;box-sizing:border-box">http://</div>
      </div>
      <div style="position:absolute;left:8px;right:8px;top:62px;bottom:24px;background:#111;border:1px solid #555;box-shadow:inset 1px 1px 0 #333;overflow:hidden"><video src="../_lib/media/v-typing.webm" muted loop playsinline autoplay preload="auto"></video></div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:16px;border-top:1px solid #8a8a8a"><div style="position:absolute;right:3px;bottom:3px;width:11px;height:11px;background:repeating-linear-gradient(135deg,#777 0 1px,transparent 1px 3px)"></div></div>
    </div>

    <!-- J · 杂志相框：通栏细线 + 小号字距图注 + 衬线页码 + 短线；纸面留白当边框 -->
    <div class="frame" data-kind="magazine" style="left:120px;top:60px;width:720px;height:420px">
      <div class="cap" style="position:absolute;left:0;top:0;font-size:11px;letter-spacing:2.5px;color:#1d1d1f;opacity:0">FIG. 01 &nbsp;—&nbsp; SCREEN RECORDING</div>
      <div class="rule" style="position:absolute;left:0;right:0;top:20px;height:1px;background:#1d1d1f;transform:scaleX(0);transform-origin:left"></div>
      <div style="position:absolute;left:0;right:0;top:32px;height:360px;overflow:hidden;background:#111"><video src="../_lib/media/v-typing.webm" muted loop playsinline autoplay preload="auto"></video></div>
      <div class="cap" style="position:absolute;right:0;bottom:0;font-family:Georgia,'Songti SC',serif;font-size:12px;letter-spacing:1px;color:#1d1d1f;opacity:0">024</div>
      <div class="rule2" style="position:absolute;left:0;bottom:6px;width:36px;height:1px;background:#1d1d1f;transform:scaleX(0);transform-origin:left"></div>
    </div>

    <!-- K · 35mm 胶片：通幅深色胶片带 + 上下齿孔 + 琥珀色片号 -->
    <div class="frame" data-kind="film" style="left:0;top:36px;width:960px;height:468px;background:#141414">
      <div class="holes" style="position:absolute;left:0;right:0;top:10px;height:26px"></div>
      <div class="holes" style="position:absolute;left:0;right:0;top:432px;height:26px"></div>
      <div style="position:absolute;left:130px;top:54px;width:700px;height:352px;border-radius:3px;overflow:hidden;background:#111"><video src="../_lib/media/v-typing.webm" muted loop playsinline autoplay preload="auto"></video></div>
      <div class="mono" style="position:absolute;left:132px;top:412px;font-size:11px;letter-spacing:1px;color:#e0a030">24</div>
      <div class="mono" style="position:absolute;right:132px;top:412px;font-size:11px;letter-spacing:1px;color:#e0a030">KODAK 400</div>
    </div>

    <!-- L · 拍立得：白卡厚底边 + 固定倾斜 −1.5° + 软投影 -->
    <div class="frame" data-kind="polaroid" style="left:160px;top:14px;width:640px;height:512px;background:#fff;box-shadow:0 0 0 1px #e5e5ea,0 18px 50px rgba(0,0,0,.22)">
      <div style="position:absolute;left:24px;right:24px;top:24px;height:392px;overflow:hidden;background:#111"><video src="../_lib/media/v-typing.webm" muted loop playsinline autoplay preload="auto"></video></div>
    </div>

    <!-- M · 工程图纸：内外双线 + 四角十字 + 尺寸线 + 刻度 + 等宽小字（与 G5 线稿系统同一套墨线） -->
    <div class="frame" data-kind="blueprint" style="left:96px;top:54px;width:768px;height:432px">
      <div style="position:absolute;inset:0;overflow:hidden;background:#111;box-shadow:0 0 0 1px #1d1d1f"><video src="../_lib/media/v-typing.webm" muted loop playsinline autoplay preload="auto"></video></div>
      <svg style="position:absolute;left:-40px;top:-40px;width:848px;height:512px;overflow:visible;fill:none;stroke:#1d1d1f;stroke-width:1" viewBox="0 0 848 512">
        <rect class="outer" x="26" y="26" width="796" height="460" pathLength="1"/>
        <path class="cross" pathLength="1" d="M 26 14 V 38 M 14 26 H 38"/><path class="cross" pathLength="1" d="M 822 14 V 38 M 810 26 H 834"/>
        <path class="cross" pathLength="1" d="M 822 474 V 498 M 810 486 H 834"/><path class="cross" pathLength="1" d="M 26 474 V 498 M 14 486 H 38"/>
        <path class="dim" pathLength="1" d="M 40 10 H 808 M 40 6 V 14 M 808 6 V 14"/>
        <path class="ticks" pathLength="1" d="M 136 26 V 32 M 232 26 V 32 M 328 26 V 32 M 424 26 V 32 M 520 26 V 32 M 616 26 V 32 M 712 26 V 32"/>
        <text class="lbl" x="424" y="7" font-family="SF Mono,Menlo,monospace" font-size="9" text-anchor="middle" fill="#1d1d1f" stroke="none" opacity="0">768</text>
        <text class="lbl" x="26" y="508" font-family="SF Mono,Menlo,monospace" font-size="9" letter-spacing="1" fill="#1d1d1f" stroke="none" opacity="0">SCALE 1 : 1 · FIG A</text>
      </svg>
    </div>

    <!-- N · 笔记本设备框：深色屏框 + 摄像头点 + 机身底座带中央缺口 -->
    <div class="frame" data-kind="laptop" style="left:70px;top:34px;width:820px;height:476px">
      <div style="position:absolute;left:0;right:0;top:0;height:446px;background:#1c1c1e;border-radius:18px;box-shadow:0 0 0 1px #3a3a3c,0 16px 50px rgba(0,0,0,.28)">
        <div style="position:absolute;left:50%;top:9px;width:6px;height:6px;margin-left:-3px;border-radius:3px;background:#050505;box-shadow:inset 0 0 0 1px #2c2c2e"></div>
        <div style="position:absolute;left:16px;right:16px;top:22px;bottom:16px;border-radius:6px;overflow:hidden;background:#111"><video src="../_lib/media/v-typing.webm" muted loop playsinline autoplay preload="auto"></video></div>
      </div>
      <div style="position:absolute;left:-20px;right:-20px;bottom:8px;height:22px;background:linear-gradient(180deg,#3a3a3c,#2a2a2c);border-radius:0 0 14px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25)">
        <div style="position:absolute;left:50%;top:0;width:120px;height:8px;margin-left:-60px;background:#1c1c1e;border-radius:0 0 8px 8px"></div>
      </div>
    </div>

    <!-- O · 邮票齿边：白色厚边 + 四边半圆齿孔（孔 = 舞台底色，本式舞台改极浅灰） -->
    <div class="frame" data-kind="stamp" style="left:96px;top:44px;width:768px;height:452px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.14)">
      <div style="position:absolute;left:0;right:0;top:-6px;height:12px;background:radial-gradient(circle,#f0f0f2 5px,transparent 5.5px) 6px 0/24px 12px repeat-x"></div>
      <div style="position:absolute;left:0;right:0;bottom:-6px;height:12px;background:radial-gradient(circle,#f0f0f2 5px,transparent 5.5px) 6px 0/24px 12px repeat-x"></div>
      <div style="position:absolute;top:0;bottom:0;left:-6px;width:12px;background:radial-gradient(circle,#f0f0f2 5px,transparent 5.5px) 0 6px/12px 24px repeat-y"></div>
      <div style="position:absolute;top:0;bottom:0;right:-6px;width:12px;background:radial-gradient(circle,#f0f0f2 5px,transparent 5.5px) 0 6px/12px 24px repeat-y"></div>
      <div style="position:absolute;inset:22px;overflow:hidden;background:#111"><video src="../_lib/media/v-typing.webm" muted loop playsinline autoplay preload="auto"></video></div>
    </div>

    <!-- B · 双发丝线 + 四角短标 -->
    <div class="frame" data-kind="hairline" style="left:96px;top:54px;width:768px;height:432px">
      <div style="position:absolute;inset:0;border-radius:12px;overflow:hidden;background:#111;box-shadow:0 0 0 1px #d2d2d7"><video src="../_lib/media/v-typing.webm" muted loop playsinline autoplay preload="auto"></video></div>
      <div class="hair2" style="position:absolute;inset:-14px;border-radius:24px;box-shadow:0 0 0 1px #e3e3e8;opacity:0"></div>
      <svg style="position:absolute;left:-14px;top:-14px;width:796px;height:460px;overflow:visible;fill:none;stroke:#1d1d1f;stroke-width:2;stroke-linecap:round" viewBox="0 0 796 460">
        <path class="tk" pathLength="1" d="M 0 30 V 24 Q 0 0 24 0 H 30"/><path class="tk" pathLength="1" d="M 766 0 H 772 Q 796 0 796 24 V 30"/>
        <path class="tk" pathLength="1" d="M 796 430 V 436 Q 796 460 772 460 H 766"/><path class="tk" pathLength="1" d="M 30 460 H 24 Q 0 460 0 436 V 430"/>
      </svg>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // —— 可摘走的核心动画（复制 CONFIG + register 内部即可复用）——
    // 命门：① 框是"物"不是 UI——没有任何假控件 ② 动作只有四段：落位 → 装饰接力（≤1.35s 画完静置）→ 整框极缓推 → 退场，不弹不摆不呼吸
    //      ③ 视频画面零处理，活由整框极缓推负责 ④ 一片只用一式（demo 巡演八式只为展示）
    const CONFIG = {
      landIn: 0.45,   // 落位：opacity 0→1 + scale .96→1 + y 16→0（power3.out；拍立得 y 24→0）
      decorAt: 0.5,   // 装饰动作起点（相对本式起点）
      push: 1.03,     // 整框极缓推 1→1.03（linear，落位后起、退场前止）
      hold: 1.85,     // 每式退场起点（相对起点）；成片 = 口播句长
      exit: 0.35,     // 退场：opacity→0 + scale→.98（power2.in）
      per: 2.2,       // 巡演每式总长
      tourStart: 0.3,
    };
    const ORDER = ["browser-retro", "magazine", "film", "polaroid", "blueprint", "laptop", "stamp", "hairline"];
    const ENTER = { polaroid: { fromY: 24, rot: -1.5 } };
    // 胶片齿孔（一次生成）
    document.querySelectorAll('.frame[data-kind="film"] .holes').forEach((band) => { for (let i = 0; i < 20; i++) { const s = document.createElement("span"); s.style.left = (15 + i * 48) + "px"; band.appendChild(s); } });

    // 各式的装饰接力（at = 本式起点 + decorAt）
    const draw = (tl, targets, dur, ease, at) => tl.fromTo(targets, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease, immediateRender: false }, at);
    const DECOR = {
      magazine(tl, at, el) {
        tl.fromTo(el.querySelector(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, at)
          .fromTo(el.querySelectorAll(".cap"), { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, at + 0.15)
          .fromTo(el.querySelector(".rule2"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, at + 0.2);
      },
      blueprint(tl, at, el) {
        draw(tl, el.querySelector(".outer"), 0.6, "power2.inOut", at);                                   // 外线机器一笔画
        el.querySelectorAll(".cross").forEach((p, i) => draw(tl, p, 0.25, "power2.out", at + 0.45 + i * 0.06));   // 四角十字接力
        draw(tl, el.querySelector(".dim"), 0.4, "power2.inOut", at + 0.65);                             // 尺寸线
        draw(tl, el.querySelector(".ticks"), 0.3, "none", at + 0.85);                                   // 刻度
        tl.fromTo(el.querySelectorAll(".lbl"), { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, at + 1.05);
      },
      hairline(tl, at, el) {
        tl.fromTo(el.querySelector(".hair2"), { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, at);
        el.querySelectorAll(".tk").forEach((p, i) => draw(tl, p, 0.25, "power2.out", at + 0.15 + i * 0.06));
      },
    };

    DemoShell.register(({ speed }) => {
      // 重播：动画状态重建
      gsap.set(".frame", { opacity: 0, scale: 0.96, y: 16, rotation: 0 });
      gsap.set(".frame svg path, .frame svg rect", { strokeDashoffset: 1 });
      gsap.set(".frame .rule, .frame .rule2", { scaleX: 0 });
      gsap.set(".frame .cap, .frame .hair2, .frame .lbl", { opacity: 0 });
      gsap.set("#stage", { background: "#fff" });

      const tl = gsap.timeline();
      tl.timeScale(speed);
      ORDER.forEach((kind, k) => {
        const el = document.querySelector(`.frame[data-kind="${kind}"]`);
        const at = CONFIG.tourStart + k * CONFIG.per;
        const e = ENTER[kind] || {};
        tl.set("#stage", { background: kind === "stamp" ? "#f0f0f2" : "#fff" }, at)
          // 落位（八式同一节拍）
          .fromTo(el, { opacity: 0, scale: 0.96, y: e.fromY ?? 16, rotation: e.rot ?? 0 },
                  { opacity: 1, scale: 1, y: 0, rotation: e.rot ?? 0, duration: CONFIG.landIn, ease: "power3.out", immediateRender: false }, at)
          // 整框极缓推：落位后起、退场前止（linear，末速非零）
          .to(el, { scale: CONFIG.push, duration: CONFIG.hold - CONFIG.landIn, ease: "none" }, at + CONFIG.landIn)
          // 退场
          .to(el, { opacity: 0, scale: 0.98, duration: CONFIG.exit, ease: "power2.in" }, at + CONFIG.hold);
        if (DECOR[kind]) DECOR[kind](tl, at + CONFIG.decorAt, el);
      });
    });
  </script>
</body>
</html>
