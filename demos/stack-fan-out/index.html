<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>stack-fan-out · 卡堆扇形展开</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 卡堆扇形展开：口播"我收集了这几张 / 今年拍了五张候选"——五张卡先叠成一叠（微错位），
     0.7s 扇形展开（旋转 −24°…+24°、沿弧线平移），停一拍，再 0.6s 铺平成一行等距五格——"这一叠"变成"这五个"。
     图片专用（叠着和扇开时看不全，视频放进去没意义）；人物不在此镜。 —— */

  /* 素材占位（不属于动效）：灰调渐变 + 相框图标，成片里换成真图 */
  .ph { position: absolute; overflow: hidden; }
  .pic { position: absolute; inset: 0; }
  .pic.t1 { background: linear-gradient(160deg, #a4b0c6, #7d8aa3); }
  .pic.t2 { background: linear-gradient(160deg, #bfa5ae, #957c86); }
  .pic.t3 { background: linear-gradient(160deg, #9fb9ae, #789389); }
  .pic.t4 { background: linear-gradient(160deg, #c2b39a, #9c8f78); }
  .pic.t5 { background: linear-gradient(160deg, #a3a9b8, #7f8594); }
  .pic svg { position: absolute; left: 50%; top: 50%; width: 44px; height: 38px; transform: translate(-50%, -56%); opacity: .35; }

  /* 卡 = 白边卡（padding 8 + 圆角 12 + 唯一投影），五张同位叠放在舞台中心偏上（中心 480, 245），由 transform 扇开 / 铺平 */
  .card { position: absolute; left: 370px; top: 170px; width: 220px; height: 150px; background: #ffffff; padding: 8px; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.16); }
  .card .ph { inset: 8px; border-radius: 6px; }
  /* 演示语境：一行标题（不属于动效；title 档 28px@960） */
  .ttl { position: absolute; left: 0; right: 0; top: 60px; text-align: center; font-size: 28px; font-weight: 700; color: #1d1d1f; letter-spacing: 1px; }
</style>
</head>
<body>
  <div id="stage">
    <div class="ttl">今年拍了五张候选封面</div>
    <div class="card"><div class="ph"><div class="pic t1"></div></div></div>
    <div class="card"><div class="ph"><div class="pic t2"></div></div></div>
    <div class="card"><div class="ph"><div class="pic t3"></div></div></div>
    <div class="card"><div class="ph"><div class="pic t4"></div></div></div>
    <div class="card"><div class="ph"><div class="pic t5"></div></div></div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ——————————————————————————————————————————————————————————
    // 可摘走的核心动画：卡堆扇形展开
    // 命门：① 扇开是绕弧心的旋转 + 平移（弧心在卡堆下方 R），不是各卡原地转
    //      ② 扇开 / 铺平两段动作之间必须停 ≥0.6s（一段动作一个意思："一叠" → "五个"）
    //      ③ 铺平后每张旋转归零、等宽等距、整行居中
    // ——————————————————————————————————————————————————————————
    const CONFIG = {
      n: 5,               // 卡数（≤6）
      lead: 0.2,          // 起手：标题与卡堆开始淡入
      stackIn: 0.4,       // 卡堆淡入时长
      stackStagger: 0.05, // 卡堆淡入错峰（每张）
      stackOff: { x: 3, y: -2, rot: 1.2 },   // 叠放微错位（每张 × (i − 中位)），让"一叠"读得出来
      fanAt: 1.0,         // 扇开起点
      fanDur: 0.7,        // 扇开时长（power3.out）
      fanAngle: 24,       // 扇角：两端 ±24°
      R: 520,             // 弧心在卡堆下方 R px
      flatAt: 2.5,        // 铺平起点（扇开后停 0.8 ≥ 0.6）
      flatDur: 0.6,       // 铺平时长（power3.inOut）
      flatW: 150,         // 铺平后每张宽（220 → 150，scale .68）
      flatGap: 16,        // 铺平后间距；整行 5×150 + 4×16 = 814 居中（离边 73 ≥ 48）
      exitAt: 5.8,        // 退场起点（成片 = 讲完这五个）
      exit: 0.4,          // 一起退场（power2.in）
      exitStagger: 0.04,  // 退场错峰（卡 → 标题）
    };

    // 素材占位里的相框图标（不属于动效）
    const GLYPH = '<svg viewBox="0 0 48 40" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"><rect x="2" y="2" width="44" height="36" rx="4"/><circle cx="16" cy="14" r="4"/><path d="M4 34 L18 22 L27 30 L34 24 L44 34"/></svg>';
    document.querySelectorAll(".pic").forEach((el) => { el.innerHTML = GLYPH; });

    const cards = [...document.querySelectorAll(".card")];
    const ttl = document.querySelector(".ttl");

    DemoShell.register(({ speed }) => {
      const tl = gsap.timeline();
      tl.timeScale(speed);
      const C = CONFIG, mid = (C.n - 1) / 2, pitch = C.flatW + C.flatGap, cardW = 220;
      // 初始态：同位叠放 + 微错位
      cards.forEach((c, i) => tl.set(c, { x: (i - mid) * C.stackOff.x, y: (i - mid) * C.stackOff.y, rotation: (i - mid) * C.stackOff.rot, opacity: 0, scale: 1, transformOrigin: "50% 50%" }, 0));
      tl.set(ttl, { opacity: 0, y: 10 }, 0)
        .to(ttl, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, C.lead)
        .to(cards, { opacity: 1, duration: C.stackIn, stagger: C.stackStagger }, C.lead);
      // ① 扇开：绕弧心（卡堆下方 R）旋转 −fanAngle…+fanAngle，位置 = 弧上对应点
      cards.forEach((c, i) => {
        const deg = -C.fanAngle + i * (2 * C.fanAngle / (C.n - 1)), a = deg * Math.PI / 180;
        tl.to(c, { x: Math.sin(a) * C.R, y: (1 - Math.cos(a)) * C.R, rotation: deg, duration: C.fanDur, ease: "power3.out" }, C.fanAt);
      });
      // ② 铺平成一行：缩到 flatW 宽、间距 flatGap、旋转归零、整行居中
      cards.forEach((c, i) => tl.to(c, { x: (i - mid) * pitch, y: 0, rotation: 0, scale: C.flatW / cardW, duration: C.flatDur, ease: "power3.inOut" }, C.flatAt));
      // ③ 一起退场（卡 → 标题，错峰 0.04）
      tl.to([...cards, ttl], { opacity: 0, duration: C.exit, stagger: C.exitStagger, ease: "power2.in" }, C.exitAt);
    });
  </script>
</body>
</html>
