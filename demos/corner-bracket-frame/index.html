<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>corner-bracket-frame · 对角角框</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 口播语境：主持人在右，左侧一句"这集只讲一件事"的标题被两个对角 L 角框框住 ——
     中性化：白底、墨字；唯一语义色 = 青 #0aa3a3，只上在角框（动效本体）上 */
  :root { --acc: #0aa3a3; }

  .cb-host {                      /* 演示语境：主持人列（不属于本卡动效） */
    position: absolute;
    right: 0; top: 0; bottom: 0;
    /* 448px 给 427.7px 宽的数字人留 ≥10px 呼吸边（人物不缩小、不截断、整体往中间挪，2026-08-25 定版） */
    width: 448px;
  }

  /* 取景骨架：一个不可见的方框，只在左上 / 右下两个角画 L —— 对角对称是本构图的骨架
     人物列让到 448px 后，右下角框（含 20px 对角入场位移）会压到人物身上：
     整框左移 + 收窄，右缘退到 516px，入场瞬时最右 536px，距人物可视边 574px 仍留 38px */
  .cb-frame {
    position: absolute;
    left: 66px; top: 152px;
    width: 450px; height: 200px;
  }
  .cb-br {                        /* L 角框：两臂等长（命门），靠 border 画 */
    position: absolute;
    width: 54px; height: 54px;    /* = 臂长；两臂必须相等 */
    opacity: 0;
  }
  .cb-br.tl {
    left: 0; top: 0;
    border-left: 4px solid var(--acc);
    border-top: 4px solid var(--acc);
  }
  .cb-br.br {
    right: 0; bottom: 0;
    border-right: 4px solid var(--acc);
    border-bottom: 4px solid var(--acc);
  }

  .cb-line {
    position: absolute; left: 34px;
    font-size: 52px; font-weight: 700; line-height: 1;
    color: #1d1d1f;
    letter-spacing: 1px;
    white-space: nowrap;
    opacity: 0;
  }
  .cb-line.l1 { top: 30px; }
  .cb-line.l2 { top: 104px; }
</style>
</head>
<body>
  <div id="stage">
    <div class="cb-host"><div class="host-placeholder"></div></div>

    <div class="cb-frame">
      <div class="cb-br tl"></div>
      <div class="cb-br br"></div>
      <div class="cb-line l1">一条思路</div>
      <div class="cb-line l2">讲清楚一件事</div>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ─────────────────────────────────────────────────────────────────────
    // 可摘走的核心动画：对角角框（两个 L 同帧对角进入 → 标题两行错峰进框）
    //   ① 两个 L 角框各自沿"外侧对角方向"平移进入：左上从左上方来、右下从右下方来。
    //      **必须同帧同曲线** —— 对角对称是这个构图的骨架，错峰就散架。
    //   ② 标题两行错峰淡入上浮（框先立住，字后进框）。
    //   ③ hold：画完静置，不做 line boil / 定格抖动（design-language §4）。
    //   ※ 标题下的手绘弧线（"下划线"）已按用户 2026-08-25 定版删除。
    // ─────────────────────────────────────────────────────────────────────
    const CONFIG = {
      lead: 0.4,          // 起手静置 s：等口播念到
      brIn: 0.3,          // 角框进入时长 s
      brTravel: 20,       // 角框沿对角方向的进入位移 px（沿 45° 各分量都是这个值）
      lineDur: 0.3,       // 标题单行淡入时长 s
      lineRise: 6,        // 标题上浮 px
      lineStagger: 0.1,   // 两行错峰 s
      linesAt: 0.22,      // 标题起步相对角框起步的延迟 s（框先立住）
      hold: 1.7,          // 收尾停留 s：让观众读完两行
    };

    DemoShell.register(({ speed }) => {
      const tl = document.querySelector(".cb-br.tl");
      const br = document.querySelector(".cb-br.br");
      const l1 = document.querySelector(".cb-line.l1");
      const l2 = document.querySelector(".cb-line.l2");

      // 重播语义：全部复位
      const d = CONFIG.brTravel;
      gsap.set(tl, { opacity: 0, x: -d, y: -d });     // 左上角框来自左上方（画外侧）
      gsap.set(br, { opacity: 0, x: d, y: d });       // 右下角框来自右下方
      gsap.set([l1, l2], { opacity: 0, y: CONFIG.lineRise });

      const t = gsap.timeline();
      t.timeScale(speed);

      const t0 = CONFIG.lead;
      // ① 两个 L 同帧进入（同曲线同时长——对角对称）
      t.to([tl, br], { opacity: 1, x: 0, y: 0, duration: CONFIG.brIn, ease: "power3.out" }, t0);

      // ② 标题两行错峰淡入上浮
      const lineAt = t0 + CONFIG.linesAt;
      t.to(l1, { opacity: 1, y: 0, duration: CONFIG.lineDur, ease: "power2.out" }, lineAt)
       .to(l2, { opacity: 1, y: 0, duration: CONFIG.lineDur, ease: "power2.out" },
           lineAt + CONFIG.lineStagger);

      // ③ 收尾静置
      const settledAt = lineAt + CONFIG.lineStagger + CONFIG.lineDur;
      t.to({}, { duration: CONFIG.hold }, settledAt);
    });
  </script>
</body>
</html>
