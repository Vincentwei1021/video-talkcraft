<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>shape-wipe-transition · 色块扫屏转场</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 场景层：A 主持人讲概念 / B 数据图表 —— */
  .scene { position: absolute; inset: 0; }
  .scene-b { opacity: 0; visibility: hidden; }

  .chapter-tag {
    position: absolute;
    top: 26px; left: 30px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #8a8a8a;
    padding: 6px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
  }

  /* —— 场景 B：CSS 画的假数据图表（演示语境，白底灰阶线框）—— */
  .scene-b { background: #ffffff; }
  .chart-card {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: 560px;
    padding: 26px 34px 22px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
  }
  .chart-title { font-size: 21px; font-weight: 700; color: #1d1d1f; }
  .chart-src { margin-top: 14px; font-size: 12px; color: #8a8a8a; }
  .bars {
    margin-top: 18px;
    display: flex;
    align-items: flex-end;
    gap: 42px;
    height: 190px;
    padding: 0 14px;
    border-bottom: 1px solid #e0e0e0;
  }
  .bar { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 74px; }
  .bar i {
    display: block;
    width: 100%;
    height: var(--h);
    border-radius: 4px 4px 0 0;
    background: #c8c8cc;
    transform-origin: 50% 100%;
  }
  .bar b { font-size: 17px; color: #8a8a8a; }
  .bar.hot i { background: #1d1d1f; }
  .bar.hot b { color: #1d1d1f; }
  .bar-x {
    display: flex; gap: 42px; padding: 8px 14px 0;
    width: 560px; margin: 0 auto;
  }
  .bar-x span { width: 74px; text-align: center; font-size: 14px; color: #8a8a8a; }
  .x-row { position: absolute; left: 50%; top: 46%; transform: translate(-50%, calc(-50% + 148px)); }

  /* —— 扫屏色块：宽 2.6 倍屏宽——power4 高速段里 70ms 错峰会拉开约 2 屏宽的空间间距，
        块不够宽中段必露缝；动画只改 transform —— */
  .wipe-layer {
    position: absolute;
    top: -8%; height: 116%;
    left: -80%; width: 260%;
    visibility: hidden;      /* 初始位置全部交给 JS 的 gsap.set，避免 CSS transform 被解析成像素残留 */
    will-change: transform;
  }
</style>
</head>
<body>
  <div id="stage">
    <!-- 场景 A：主持人讲概念 -->
    <div class="scene scene-a">
      <div class="host-placeholder"></div>
      <div class="chapter-tag">01 · 讲概念</div>
    </div>

    <!-- 场景 B：数据图表占位（CSS 画的假图表） -->
    <div class="scene scene-b">
      <div class="chapter-tag">02 · 看数据</div>
      <div class="chart-card">
        <div class="chart-title">季度营收同比增速</div>
        <div class="bars">
          <div class="bar" style="--h:56px"><b>+12%</b><i></i></div>
          <div class="bar" style="--h:84px"><b>+18%</b><i></i></div>
          <div class="bar" style="--h:128px"><b>+34%</b><i></i></div>
          <div class="bar hot" style="--h:182px"><b>+61%</b><i></i></div>
        </div>
        <div class="bar-x"><span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span></div>
        <div class="chart-src">数据来源：公司 2024 年报</div>
      </div>
    </div>

    <!-- 扫屏色块（动效本体）：单一中性强调色的浅→中→深三档，后扫的层叠在上面 -->
    <div class="wipe-layer w1"></div>
    <div class="wipe-layer w2"></div>
    <div class="wipe-layer w3"></div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // —— 可摘走的核心动画（复制 CONFIG + register 内部即可复用）——
    const CONFIG = {
      // 三层必须同色系浅→中→深（后扫的深色层压在最上）。这里用中性墨色三档；
      // 复用时整组换成品牌色的浅/中/深即可——这就是本卡唯一的颜色接口
      colors: ["#d8d8dc", "#8a8a8e", "#1d1d1f"],
      wipeDur: 0.45,    // 单层扫屏耗时 s：>0.7 读作拉幕布，<0.3 只剩闪烁
      layerDelay: 0.07, // 层间错峰 60~80ms：>120ms 露缝穿帮
      skew: -12,        // 斜切角度：0 读作 PPT 推入
      stretch: 1.22,    // 过屏中段横向拉伸倍数（速度感）：>1.4 读作果冻
      holdA: 0.9,       // 场景 A 先停留多久再扫
    };

    // 让时间轴严格贴墙钟：无头截图/录屏时渲染卡顿也不会拖慢时序（实机可去掉）
    gsap.ticker.lagSmoothing(0);

    DemoShell.register(({ speed }) => {
      const sceneA = document.querySelector(".scene-a");
      const sceneB = document.querySelector(".scene-b");
      const layers = gsap.utils.toArray(".wipe-layer");
      const bars = gsap.utils.toArray(".scene-b .bar i");

      // —— 每次从头重建：复位两个场景与色块 ——
      layers.forEach((el, i) => (el.style.background = CONFIG.colors[i]));
      gsap.set(sceneA, { autoAlpha: 1 });
      gsap.set(sceneB, { autoAlpha: 0 });
      gsap.set(layers, { xPercent: -75, x: 0, skewX: CONFIG.skew, scaleX: 1, visibility: "visible" });
      gsap.set(bars, { scaleY: 0 });

      const tl = gsap.timeline();
      tl.timeScale(speed);

      // 场景 A：先停留一拍（口播讲概念），到 holdA 才开扫
      tl.addLabel("wipe", CONFIG.holdA);

      // 三层色块错峰扫屏：拆成 power4.in + power4.out 两段 = 整体 power4.inOut，
      // 中点（完全盖住全屏的那一帧）同步到拉伸峰值
      layers.forEach((el, i) => {
        tl.to(el, {
          keyframes: [
            { xPercent: 0,  scaleX: CONFIG.stretch, duration: CONFIG.wipeDur / 2, ease: "power4.in" },
            { xPercent: 75, scaleX: 1,              duration: CONFIG.wipeDur / 2, ease: "power4.out" },
          ],
        }, "wipe+=" + i * CONFIG.layerDelay);
      });

      // 换内容藏在遮挡帧里：第二层运动中点 = 它完全盖住全屏的那一帧
      tl.call(() => {
        gsap.set(sceneA, { autoAlpha: 0 });
        gsap.set(sceneB, { autoAlpha: 1 });
      }, [], "wipe+=" + (CONFIG.layerDelay + CONFIG.wipeDur / 2));

      // 场景 B：色块扫净后，柱状图逐根长出 + 字幕跟进
      const revealed = 2 * CONFIG.layerDelay + CONFIG.wipeDur;
      tl.to(bars, {
        scaleY: 1, duration: 0.4, ease: "power3.out", stagger: 0.06,
      }, "wipe+=" + revealed);
    });
  </script>
</body>
</html>
