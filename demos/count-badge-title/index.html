<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>count-badge-title · 数字重音标题</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 演示语境（不属于动效）：主持人占右侧一列，标题落在左侧白区 ——
     47% = 451px，给 427.7px 宽的数字人留 ≥10px 呼吸边（人物不缩小、不截断、整体往中间挪，2026-08-25 定版） */
  .cb-host { position: absolute; right: 0; top: 0; bottom: 0; width: 47%; overflow: hidden; }

  /* —— 动效本体 —— 两行标题；数字是主语，靠"字号 + 字重 + 强调色"三重压过其余字 —— */
  .cb-text {
    position: absolute;
    left: 84px;
    top: 150px;
    color: #1d1d1f;
  }
  .cb-l1 {
    display: flex;
    align-items: baseline;              /* 数字与"个方法"共基线——数字再大也不许把行推歪 */
    white-space: nowrap;
  }
  .cb-num {
    font-size: 138px;
    font-weight: 700;                   /* 700 = 砸字档，全片只给这一个重音（design-language §2） */
    line-height: 0.92;
    font-variant-numeric: tabular-nums; /* 数字不跳宽 */
    letter-spacing: -0.02em;
    transform-origin: 50% 72%;          /* 重心偏下：缩到位时数字不往上飘 */
    display: inline-block;
    will-change: transform;
  }
  .cb-rest {
    font-size: 62px;                    /* 与第二行同一字阶——一屏只留两级（数字 / 其余） */
    font-weight: 600;
    line-height: 1.1;
    margin-left: 14px;                  /* 数字右缘到"个方法"的间距——推出的起点 */
    display: inline-block;
    white-space: nowrap;
  }
  .cb-l2 {
    font-size: 62px;
    font-weight: 600;
    line-height: 1.2;
    margin-top: 10px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="cb-host"><div class="host-placeholder"></div></div>

    <div class="cb-text">
      <div class="cb-l1"><span class="cb-num">3</span><span class="cb-rest">个方法</span></div>
      <div class="cb-l2">解决问题</div>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ——————————————————————————————————————————————————————————
    // 可摘走的核心动画：数字重音标题（数字单独到 → 量词被带出 → 第二行跟上 → 数字补一拍）
    // 命门：三段严格分先后。数字必须**先到且单独到**——它是这句话的主语；
    // 三段同时淡入就没有"3 个"这个重音，读作一个普通两行标题。
    // ——————————————————————————————————————————————————————————
    const CONFIG = {
      accent: "#7A5AF8",  // 唯一强调色（参考图②同色系紫）；只上在数字上
      ink: "#1d1d1f",     // 数字入场时的墨色——换色发生在落定那一刻，不在飞行途中
      startDelay: 0.40,   // 起手静置：等口播念出"三"这个音
      numScale: 1.6,      // 数字入场起始缩放：1.4~1.8；>2 读作"糊到镜头上"，<1.25 看不出重音
      numIn: 0.30,        // 数字入场耗时 s（power3.out）
      hueDur: 0.14,       // 落定换色耗时 s：短，读作"到位了才亮"
      restLag: 0.02,      // "个方法"相对数字落定的滞后 s：接近 0 才读作被数字带出来
      restIn: 0.22,       // "个方法"揭示耗时 s（clip 从左 + x 追赶）
      restX: -8,          // "个方法"起始横向偏移 px（负 = 从数字那侧被拖出来）
      l2Lag: 0.10,        // 第二行相对"个方法"的错峰 s：本卡第二命门，>0.25 读作两个动效
      l2In: 0.28,         // 第二行淡入上浮耗时 s
      l2Rise: 6,          // 第二行上浮 px
      punchGap: 0.35,     // 第二行落定到数字补拍的间隔 s（对齐口播重音）
      punchScale: 1.06,   // 补拍幅度：1.04~1.08；再大就成第二次入场
      hold: 1.70,         // 收尾定格 s：两行读完
    };

    DemoShell.register(({ speed }) => {
      const num = document.querySelector(".cb-num");
      const rest = document.querySelector(".cb-rest");
      const l2 = document.querySelector(".cb-l2");

      // 重播语义：三段全部回到初态
      gsap.set(num, { scale: CONFIG.numScale, opacity: 0, color: CONFIG.ink });
      gsap.set(rest, { clipPath: "inset(0 100% 0 0)", x: CONFIG.restX, opacity: 1 });
      gsap.set(l2, { opacity: 0, y: CONFIG.l2Rise });

      const tLand = CONFIG.startDelay + CONFIG.numIn;
      const tRest = tLand + CONFIG.restLag;
      const tL2 = tRest + CONFIG.l2Lag;
      const tPunch = tL2 + CONFIG.l2In + CONFIG.punchGap;

      const tl = gsap.timeline();
      tl.timeScale(speed);

      // ① 数字单独入场：从 1.6 倍缩到位（只有 scale + opacity，不带位移——重音是"压下来"不是"飞进来"）
      tl.to(num, { scale: 1, opacity: 1, duration: CONFIG.numIn, ease: "power3.out" },
            CONFIG.startDelay)
        // ② 落定那一刻换强调色（提前 hueDur 的一半起，让"到位"与"变色"读作同一帧）
        .to(num, { color: CONFIG.accent, duration: CONFIG.hueDur, ease: "power1.out" },
            tLand - CONFIG.hueDur * 0.5)
        // ③ "个方法"从数字右缘被推出：clip 从左揭示 + x 追赶（两条同曲线同时长 = 一件事）
        .to(rest, { clipPath: "inset(0 0% 0 0)", x: 0,
                    duration: CONFIG.restIn, ease: "power3.out" }, tRest)
        // ④ 第二行错峰跟上（普通淡入上浮——它是补足语义的，不许抢重音）
        .to(l2, { opacity: 1, y: 0, duration: CONFIG.l2In, ease: "power3.out" }, tL2)
        // ⑤ 收尾数字补一拍（5 帧 punch，与口播重音对齐；幅度小到只有"顿一下"的量）
        .to(num, { scale: CONFIG.punchScale, duration: 0.04, ease: "power2.out" }, tPunch)
        .to(num, { scale: 1, duration: 0.13, ease: "power3.out" });

      tl.to({}, { duration: CONFIG.hold });
    });
  </script>
</body>
</html>
