<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>split-60-40-story · 60/40 主从分屏</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 60/40 主从分屏：左 60% 一条素材缓推做主（录屏 / 实拍 / 大图 / 口播本人），右 40% 标题 + 三枚要点 chip 按口播逐枚弹出，
     chip 底板三种淡色区分——"看着它干活，边听边记要点"。左格素材占位（灰调渐变 + 漂移亮带）是演示语境，不属于动效本体。 —— */

  /* 素材占位（不属于动效）：灰调渐变 + 相框图标（六档色，与 parallel-items-with-host 同一体系） */
  .ph { position: absolute; overflow: hidden; }
  .ph::before { content: ""; position: absolute; inset: 0; }
  .ph.t1::before { background: linear-gradient(160deg, #a4b0c6, #7d8aa3); }
  .ph.t2::before { background: linear-gradient(160deg, #bfa5ae, #957c86); }
  .ph.t3::before { background: linear-gradient(160deg, #9fb9ae, #789389); }
  .ph.t4::before { background: linear-gradient(160deg, #c2b39a, #9c8f78); }
  .ph.t5::before { background: linear-gradient(160deg, #a3a9b8, #7f8594); }
  .ph.t6::before { background: linear-gradient(160deg, #b8a9c4, #8f809d); }
  .ph svg { position: absolute; left: 50%; top: 50%; width: 56px; height: 48px; transform: translate(-50%, -56%); opacity: .35; }
  /* footage 占位 = .ph 底 + 三道斜向亮带匀速漂移（GSAP 匀速 tween 驱动，tsx 由 t 算同一相位），读作"一条在动的视频" */
  .ph .drift {
    position: absolute; top: 0; bottom: 0; left: -150%; width: 400%;
    background: repeating-linear-gradient(112deg,
      rgba(255,255,255,0) 0 70px, rgba(255,255,255,.16) 70px 150px,
      rgba(255,255,255,0) 150px 260px, rgba(255,255,255,.12) 260px 320px,
      rgba(255,255,255,0) 320px 420px, rgba(255,255,255,.18) 420px 540px,
      rgba(255,255,255,0) 540px 640px);
  }

  /* 左格 60%：素材在格内缓推（格子裁切，推出去的部分不越过中缝） */
  .pane { position: absolute; left: 0; top: 0; width: 576px; height: 540px; overflow: hidden; }
  .cam { position: absolute; inset: 0; will-change: transform; }   /* 相机层：左格唯一被 transform 的元素 */
  .cam .ph { inset: 0; }
  /* 中缝 3px 白 */
  .vline { position: absolute; left: 576px; top: 0; width: 3px; height: 540px; background: #ffffff; }

  /* 右格 40%：标题 30px 两行 + 三枚 chip（24px ≈ 48@1080p，条目档 ≥40）；标题与 chip 左边缘吸附同一栏线 x=620 */
  .ttl { position: absolute; left: 620px; top: 78px; font-size: 30px; font-weight: 700; color: #1d1d1f; line-height: 1.3; }
  .chip { position: absolute; left: 620px; padding: 10px 20px; border-radius: 14px; font-size: 24px; font-weight: 700; color: #1d1d1f; white-space: nowrap; }
</style>
</head>
<body>
  <div id="stage">
    <div class="pane"><div class="cam"><div class="ph t3"><div class="drift"></div></div></div></div>
    <div class="vline"></div>
    <div class="ttl">它一晚上<br>干了三件事</div>
    <div class="chip" style="top:216px;background:#E8F0FF">读完 40 份资料</div>
    <div class="chip" style="top:290px;background:#FFE9F0">写好三版初稿</div>
    <div class="chip" style="top:364px;background:#E6F7F2">跑测试 修 bug</div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ——————————————————————————————————————————————————————————
    // 可摘走的核心动画：60/40 主从分屏
    // 命门：① 左格缓推 duration = 镜头时长（速率恒定，末速非零）；② chip 按口播逐枚弹出（0.6s 一枚、back.out 过冲）；
    //      ③ 右栏左边缘吸附同一栏线、chip 同高同 padding、≤4 条；④ 字与画同起同收：素材、中缝、字全部在 end 收齐。
    // ——————————————————————————————————————————————————————————
    const CONFIG = {
      split: 576,         // 左格宽（60%）；右 40% 永远是文字
      seam: 3,            // 中缝 px（白）
      push: 1.06,         // 左格素材缓推终点：1→1.06，duration = 镜头时长（匀速）
      titleIn: 0.3,       // 标题入场 s（0.5s power3.out，y 12→0）
      chipAt: 1.0,        // 第一枚 chip 弹出 s
      gap: 0.6,           // chip 间隔（口播逐条的节奏；0.5~0.7）
      pop: 0.45,          // 单枚弹出时长（back.out(1.7)：scale .9→1、y 10→0）
      exit: 0.4,          // 退场时长（power2.in）
      stagger: 0.04,      // 文字组退场错峰（尾对齐：标题先走、最后一枚 chip 与素材同帧收完）
      end: 6.8,           // 镜头结束：素材、中缝、字全部在此收齐
      driftSpeed: 40,     // footage 占位的亮带漂移速度 px/s（仅演示占位）
    };

    // 素材占位里的相框图标（不属于动效）
    const GLYPH = '<svg viewBox="0 0 48 40" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"><rect x="2" y="2" width="44" height="36" rx="4"/><circle cx="16" cy="14" r="4"/><path d="M4 34 L18 22 L27 30 L34 24 L44 34"/></svg>';
    document.querySelectorAll(".ph").forEach((el) => { el.insertAdjacentHTML("beforeend", GLYPH); });

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];

    DemoShell.register(({ speed }) => {
      const cam = $(".cam"), pane = $(".pane"), line = $(".vline"), ttl = $(".ttl"), chips = $$(".chip"), drift = $(".drift");
      const tl = gsap.timeline();
      tl.timeScale(speed);
      const textOut0 = CONFIG.end - CONFIG.exit - chips.length * CONFIG.stagger;   // 尾对齐：最后一枚在 end 收完

      // 复位（重播语义）
      tl.set(cam, { scale: 1, transformOrigin: "50% 50%" }).set([pane, line], { opacity: 1 })
        .set(ttl, { opacity: 0, y: 12 }).set(chips, { opacity: 0 }).set(drift, { x: 0 })
        // 左格素材缓推，duration = 镜头；占位亮带匀速漂移（演示语境）
        .to(cam, { scale: CONFIG.push, duration: CONFIG.end, ease: "none" }, 0)
        .to(drift, { x: -CONFIG.driftSpeed * CONFIG.end, duration: CONFIG.end, ease: "none" }, 0)
        // 标题升入
        .to(ttl, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CONFIG.titleIn);
      // 三枚 chip 按口播逐枚弹出（back.out）
      chips.forEach((c, i) => tl.fromTo(c, { opacity: 0, scale: 0.9, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: CONFIG.pop, ease: "back.out(1.7)" }, CONFIG.chipAt + i * CONFIG.gap));
      // 字与画同收：标题 + chip 错峰 0.04 尾对齐到 end；素材 + 中缝 end−0.4 起同收
      tl.to([ttl, ...chips], { opacity: 0, duration: CONFIG.exit, stagger: CONFIG.stagger, ease: "power2.in" }, textOut0)
        .to([pane, line], { opacity: 0, duration: CONFIG.exit, ease: "power2.in" }, CONFIG.end - CONFIG.exit);
    });
  </script>
</body>
</html>
