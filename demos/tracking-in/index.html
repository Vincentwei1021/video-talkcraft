<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>tracking-in · 字距收拢</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* 演示语境（不属于动效）：这是一张"整屏让位给一句大标题"的卡（源码就是整幅白底 + 一行居中大字），
     所以 demo 不放主持人——口播语境是"讲者说到论点、画面整屏交给这行字"，靠留白成立。
     标题本身是本卡的动效对象（字幕花字类），所以这些字保留。 */
  .ti-frame {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;          /* 源码显式白底：字距收拢靠"空"才读得出来 */
  }
  /* 动效本体：整行大字，nowrap 是硬要求——字距 0.5em 时整句会比终态宽 50%，
     不锁 nowrap 会在起手那一刻换行，收拢过程中再跳回一行。 */
  .ti-title {
    font-size: 72px;              /* 源码 96px @1280 宽画幅 → 本库 960 舞台等比 ×0.75 */
    font-weight: 700;             /* 源码值：大标题气质靠重字重 */
    line-height: 1.2;
    color: #171717;               /* 源码墨色，不是纯黑 */
    white-space: nowrap;
    will-change: filter, opacity, letter-spacing;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="ti-frame">
      <span class="ti-title" id="tiTitle">认知决定上限</span>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // 可摘走的核心动画：字距收拢（remocn TrackingIn 忠实搬运，30fps → 秒）
    //   一条 spring 同时驱动两件事：letter-spacing 0.5em → −0.03em、blur 9px → 0；
    //   opacity 另走一条 0.5s 线性淡入（与 spring 无关，源码就是分开的）。
    //   spring 配置 damping 18 / stiffness 90 —— ζ=0.949 欠阻尼，但过冲峰值只有 8e-5（t≈1.05s），
    //   肉眼是"没有回弹的长缓收"：起手 0.3s 走掉 80% 的字距，剩下 0.5s 极慢地咬到位。
    //   命门：字距与模糊必须同一条 spring。分开成两条缓动，"散开的字聚焦成一块"就散了。
    // ─────────────────────────────────────────────────────────────────────────
    const CONFIG = {
      lead: 0.30,          // 起手静置：等口播开口（本库约定，源码从第 0 帧就开始）
      springDur: 1.00,     // spring 走完到 <1e-4 的时长 s（damping 18 / stiffness 90 @30fps）
      fadeDur: 0.50,       // 淡入时长 s（源码 interpolate(frame,[0,15]) ÷ 30），线性、不跟 spring
      startTracking: 0.5,  // 起始字距 em（源码值原样）
      endTracking: -0.03,  // 终态字距 em（源码值原样：略收紧，不是 0）
      startBlur: 9,        // 起始模糊 px（源码 12 @96px 字号；本库 72px ⇒ 9，比例恒为字号 1/8）
      hold: 1.30,          // 收尾定格：咬到位的大标题就是落点
    };

    // Remotion spring 的解析解（欠阻尼分支，from 0 → to 1，初速 0）：
    //   ζ = damping / (2√(stiffness·mass))，ω₀ = √(stiffness/mass)，ω₁ = ω₀√(1−ζ²)
    //   x(t) = 1 − e^(−ζω₀t)·[ (ζω₀/ω₁)·sin(ω₁t) + cos(ω₁t) ]
    // damping 18 / stiffness 90 / mass 1 ⇒ ζ=0.94868、ω₀=9.4868、ω₁=3.0、ζω₀=9.0
    // 直接当 GSAP 的自定义 ease 用（入参是 0~1 的进度，乘回 springDur 变秒）。
    function remotionSpring(damping, stiffness, mass) {
      const zeta = damping / (2 * Math.sqrt(stiffness * mass));
      const omega0 = Math.sqrt(stiffness / mass);
      if (zeta >= 1) {                                  // 临界/过阻尼分支（本卡不走，留着以便改参数）
        return (t) => 1 - (1 + omega0 * t) * Math.exp(-omega0 * t);
      }
      const omega1 = omega0 * Math.sqrt(1 - zeta * zeta);
      const decay = zeta * omega0;
      return (t) => 1 - Math.exp(-decay * t) * ((decay / omega1) * Math.sin(omega1 * t) + Math.cos(omega1 * t));
    }
    const SPRING = remotionSpring(18, 90, 1);
    const SPRING_EASE = (p) => SPRING(p * CONFIG.springDur);   // 进度 → 秒 → spring 位置

    DemoShell.register(({ speed }) => {
      const el = document.getElementById("tiTitle");

      const tl = gsap.timeline();
      tl.timeScale(speed);

      // 初态：最松的字距 + 最糊（先摆好，之后只有 to 在跑）
      gsap.set(el, {
        opacity: 0,
        letterSpacing: CONFIG.startTracking + "em",
        filter: `blur(${CONFIG.startBlur}px)`,
      });

      // 轨① 字距 + 模糊：同一条 spring 驱动。走代理对象 + onUpdate 写样式——
      // letter-spacing 的 em 单位交给 GSAP 会被换算成 px，换字号就不再等比。
      const s = { t: 0 };
      tl.to(s, {
        t: 1,
        duration: CONFIG.springDur,
        ease: SPRING_EASE,
        onUpdate: () => {
          const sp = CONFIG.startTracking + (CONFIG.endTracking - CONFIG.startTracking) * s.t;
          el.style.letterSpacing = sp.toFixed(4) + "em";
          el.style.filter = `blur(${(CONFIG.startBlur * (1 - s.t)).toFixed(3)}px)`;
        },
      }, CONFIG.lead);

      // 轨② 淡入：0.5s 线性，与 spring 无关（源码是两个独立 interpolate）
      tl.to(el, { opacity: 1, duration: CONFIG.fadeDur, ease: "none" }, CONFIG.lead);

      tl.to({}, { duration: CONFIG.hold });      // 收尾定格
    });
  </script>
</body>
</html>
