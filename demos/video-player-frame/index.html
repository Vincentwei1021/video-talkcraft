<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>video-player-frame · 单视频播放器框</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 单视频镜头：不裸贴视频，装进一只"播放器"——白边证据卡 + 底部播放条 + 标题 chip + 来源 pill —— */
  .player {
    position: absolute; left: 96px; top: 40px; width: 768px; height: 432px;   /* 16:9，下方留字幕带 */
    border-radius: 16px; background: #fff;
    box-shadow: 0 0 0 1px #e0e0e0, 0 12px 60px rgba(0,0,0,.22);               /* hairline + 唯一投影（证据卡造型） */
    opacity: 0; transform-origin: 50% 50%;
  }
  .screen {
    position: absolute; left: 8px; top: 8px; right: 8px; bottom: 8px;          /* 白边 8 */
    border-radius: 8px; overflow: hidden; background: #111;
  }
  .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .chip {
    position: absolute; left: 16px; top: 14px; padding: 6px 12px; border-radius: 8px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 1px; opacity: 0;
  }
  .pill {
    position: absolute; right: 16px; top: 16px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
    color: #fff; font-size: 11px; letter-spacing: 2px; opacity: 0;
  }
  /* 播放条 = 控件层：比框晚一拍滑上来，退场先于框收 */
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 56px;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.62)); opacity: 0;
  }
  .btn {
    position: absolute; left: 22px; bottom: 16px; width: 34px; height: 34px; border-radius: 17px;
    background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.7);
  }
  .btn .tri { position: absolute; left: 13px; top: 10px; width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 11px; border-color: transparent transparent transparent #fff; }
  .btn .p1, .btn .p2 { position: absolute; top: 10px; width: 4px; height: 14px; border-radius: 1px; background: #fff; display: none; }
  .btn .p1 { left: 11px; } .btn .p2 { left: 19px; }
  .btn.playing .tri { display: none; } .btn.playing .p1, .btn.playing .p2 { display: block; }
  .track { position: absolute; left: 92px; right: 132px; bottom: 31px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); }
  .fill  { position: absolute; left: 0; top: 0; height: 4px; width: 0%; border-radius: 2px; background: #fff; }
  .mark  { position: absolute; top: -3px; width: 2px; height: 10px; margin-left: -1px; background: rgba(255,255,255,.3); }
  .mark.lit { background: #fff; }
  .knob  { position: absolute; left: 0%; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .tc {
    position: absolute; right: 20px; bottom: 24px; color: #fff; font-size: 13px; letter-spacing: 1px; opacity: .92;
    font-family: "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="player">
      <div class="screen">
        <!-- 示意素材（demos/_lib/media，不属于本卡）：Mixkit 1811 打字 -->
        <video src="../_lib/media/v-typing.webm" muted loop playsinline preload="auto"></video>
        <div class="chip">录屏 · 案例 01</div>
        <div class="pill">SOURCE · MIXKIT</div>
        <div class="bar">
          <div class="btn"><span class="tri"></span><span class="p1"></span><span class="p2"></span></div>
          <div class="track">
            <div class="fill"></div>
            <span class="mark" style="left:35%"></span><span class="mark" style="left:72%"></span>
            <div class="knob"></div>
          </div>
          <div class="tc">00:00 / 00:12</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // —— 可摘走的核心动画（复制 CONFIG + register 内部即可复用）——
    // 命门：① 进度条走真实播放进度（与 video.play 同一时间源）② 播放键先按下、进度才起步
    //      ③ 播放条比框晚 0.15s 上、退场先 0.2s 收 ④ 视频画面不做滤镜/缩放动画，活由整框极缓推负责
    const CONFIG = {
      frameIn: 0.5,          // 框落位 s：opacity + scale .96→1 + y 16→0（power3.out）
      chromeDelay: 0.15,     // 播放条晚多少滑上来
      playAt: 0.5,           // 按下播放的时刻
      clipSec: 12,           // 时间码分母（这段视频有多长）
      markers: [0.35, 0.72], // 进度条章节刻度（比例），经过时点亮
      push: 1.03,            // 整框极缓推 1→1.03，时长 = 卡
      exitAt: 7.6,           // 退场起点：条先收 0.2s，框再收 0.35s
      exit: 0.35,
    };
    const fmt = (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

    DemoShell.register(({ speed }) => {
      const player = document.querySelector(".player");
      const video = player.querySelector("video");
      const bar = player.querySelector(".bar"), chip = player.querySelector(".chip"), pill = player.querySelector(".pill");
      const btn = player.querySelector(".btn"), fill = player.querySelector(".fill"), knob = player.querySelector(".knob"), tc = player.querySelector(".tc");
      const marks = player.querySelectorAll(".mark");

      // 重播：动画状态重建（视频回到 0 并暂停——播放由时间轴 .call 触发）
      gsap.set(player, { opacity: 0, scale: 0.96, y: 16 });
      gsap.set([bar, chip, pill], { opacity: 0, y: 12 });
      gsap.set([chip, pill], { y: -12 });
      gsap.set(fill, { width: "0%" }); gsap.set(knob, { left: "0%" });
      btn.classList.remove("playing"); marks.forEach((m) => m.classList.remove("lit"));
      tc.textContent = fmt(0) + " / " + fmt(CONFIG.clipSec);
      try { video.pause(); video.currentTime = 0; } catch (e) {}

      const tl = gsap.timeline();
      tl.timeScale(speed);

      // ① 框落位 + 整框极缓推（linear，末速非零）
      tl.to(player, { opacity: 1, scale: 1, y: 0, duration: CONFIG.frameIn, ease: "power3.out" }, 0)
        .to(player, { scale: CONFIG.push, duration: CONFIG.exitAt + 0.2 - CONFIG.frameIn, ease: "none" }, CONFIG.frameIn)
        // ② 播放条 / 标题 / 来源 晚一拍滑上
        .to([bar, chip, pill], { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, CONFIG.chromeDelay)
        // ③ 按下播放：键 punch，视频真的开始放
        .call(() => { btn.classList.add("playing"); video.play().catch(() => {}); }, null, CONFIG.playAt)
        .fromTo(btn, { scale: 1.15 }, { scale: 1, duration: 0.2, ease: "back.out(1.7)", immediateRender: false }, CONFIG.playAt)
        // ④ 进度 = 真实播放进度：与 playAt 同一时间源，linear 走到退场；时间码与刻度跟着 onUpdate
        .to({ p: 0 }, {
          p: (CONFIG.exitAt - CONFIG.playAt) / CONFIG.clipSec, duration: CONFIG.exitAt - CONFIG.playAt, ease: "none",
          onUpdate() {
            const p = this.targets()[0].p;
            fill.style.width = (p * 100).toFixed(2) + "%"; knob.style.left = (p * 100).toFixed(2) + "%";
            tc.textContent = fmt(p * CONFIG.clipSec) + " / " + fmt(CONFIG.clipSec);
            marks.forEach((m, i) => m.classList.toggle("lit", p >= CONFIG.markers[i]));
          },
        }, CONFIG.playAt)
        // ⑤ 退场：条先收，框再收（scale→.98 + 淡出）
        .to([bar, chip, pill], { opacity: 0, duration: 0.2, ease: "power2.in" }, CONFIG.exitAt)
        .to(player, { opacity: 0, scale: 0.98, duration: CONFIG.exit, ease: "power2.in" }, CONFIG.exitAt + 0.2)
        .call(() => { try { video.pause(); } catch (e) {} }, null, CONFIG.exitAt + 0.2 + CONFIG.exit);
    });
  </script>
</body>
</html>
