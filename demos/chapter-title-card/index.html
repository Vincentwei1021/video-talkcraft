<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>chapter-title-card · 章节标题卡</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 口播语境：主持人讲话 → 色块压入 → 章节卡 → 切回 —— */
  .chapter-card {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 34px;
    overflow: hidden;
    visibility: hidden;             /* 屏外待命：位置由 GSAP xPercent 控制 */
  }
  /* 压屏色块 = 动效本体。一章一套主题（底色 / 字色 / accent），demo 收敛成中性灰阶两档，
     复用时换成本片色板派生的四套章色，见卡片「章节主题层」 */
  .chapter-card.c1 { background: #1d1d1f; --ink: #ffffff; --accent: #9a9aa0; }
  .chapter-card.c2 { background: #55565a; --ink: #ffffff; --accent: #d1d1d6; }
  /* L6 主题纹样：与本章内容相关的线稿，右下 1/4、屏高 ≈45%、低不透明度；色块盖屏后立即描画，不参与三层错峰 */
  .chapter-motif {
    position: absolute;
    right: 3%;
    top: 60%;                        /* 上缘在文字组（编号 / 章节名 / 小字）之下，不相交 */
    width: 240px;                    /* ≈ 屏高 45%，右下 1/4，下缘允许出画 */
    height: 240px;
    fill: none;
    stroke: var(--ink);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.14;
  }
  .chapter-motif path { stroke-dasharray: 1; stroke-dashoffset: 1; }   /* pathLength=1：dashoffset 1→0 = 一笔画完 */
  .chapter-num {
    font-family: Georgia, "Songti SC", serif;   /* 超大编号：衬线更有章节感 */
    font-size: 216px;                            /* 约屏高 40% */
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    opacity: 0;
    position: relative;
  }
  .chapter-text { overflow: hidden; }            /* 章节名遮罩容器 */
  .chapter-name {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--ink);
    clip-path: inset(0 100% 0 0);                /* 从左向右揭示 */
  }
  .chapter-rule {                                /* 章节名下的 accent 短线：一章一色的"签名"，名字揭示完后长出 */
    width: 72px;
    height: 3px;
    margin-top: 12px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
  }
  .chapter-sub {
    margin-top: 12px;
    font-size: 15px;
    letter-spacing: 6px;
    color: var(--ink);
    opacity: 0;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="host-placeholder"></div>

    <div class="chapter-card c1">
      <!-- motif 01「泡沫是怎么吹起来的」：一颗上升的泡 + 上扬曲线（示例，复用时按本章内容换） -->
      <svg class="chapter-motif" viewBox="0 0 200 200">
        <path pathLength="1" d="M 20 170 C 60 160, 90 120, 120 70 S 165 30, 185 24"/>
        <path pathLength="1" d="M 130 60 a 34 34 0 1 0 0.1 0"/>
        <path pathLength="1" d="M 118 46 a 6 6 0 1 0 0.1 0"/>
      </svg>
      <div class="chapter-num">01</div>
      <div style="position:relative">
        <div class="chapter-text"><div class="chapter-name">泡沫是怎么吹起来的</div></div>
        <div class="chapter-rule"></div>
        <div class="chapter-sub">CHAPTER 01 · 2006—2008</div>
      </div>
    </div>
    <div class="chapter-card c2">
      <!-- motif 02「谁在最后一刻离场」：门框 + 出门箭头 -->
      <svg class="chapter-motif" viewBox="0 0 200 200">
        <path pathLength="1" d="M 40 30 H 130 V 180 H 40 Z"/>
        <path pathLength="1" d="M 92 105 H 178"/>
        <path pathLength="1" d="M 156 84 L 178 105 L 156 126"/>
      </svg>
      <div class="chapter-num">02</div>
      <div style="position:relative">
        <div class="chapter-text"><div class="chapter-name">谁在最后一刻离场</div></div>
        <div class="chapter-rule"></div>
        <div class="chapter-sub">CHAPTER 02 · 2008.09</div>
      </div>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // —— 可摘走的核心动画（复制 CONFIG + register 内部即可复用）——
    const CONFIG = {
      wipeIn: 0.3,      // 色块扫入盖屏 s（power4.inOut）
      numIn: 0.4,       // 编号落位 s（scale 1.3→1）
      nameIn: 0.35,     // 章节名遮罩揭示 s
      subDelay: 0.1,    // 小字比章节名再晚一拍
      hold: 1.2,        // 停留 s（带极缓漂移防呆滞）
      driftPx: 10,      // hold 期间整组横向漂移量 px
      wipeOut: 0.3,     // 色块继续向右扫出 s
      gapBetween: 0.7,  // 两张章节卡之间回到口播的间隔 s
      motifIn: 0.5,     // 主题 motif 描画 s（色块盖屏后 +0.05 起，各段接力）
      motifParallax: 0.6, // motif 漂移 = 文字组漂移 × 0.6（背景更慢 = 深度）
      ruleIn: 0.25,     // 章节名下 accent 短线 scaleX 0→1（名字揭示完后接上）
    };

    // 单张章节卡的完整节拍：压入 → motif 描画（背景）→ 编号 → 章节名 → accent 短线 → 小字 → 漂移 hold → 扫出
    function chapterBeat(tl, card, at) {
      const motifPaths = card.querySelectorAll(".chapter-motif path");
      const motif = card.querySelector(".chapter-motif");
      const num = card.querySelector(".chapter-num");
      const name = card.querySelector(".chapter-name");
      const rule = card.querySelector(".chapter-rule");
      const sub = card.querySelector(".chapter-sub");
      const group = name.parentNode.parentNode;
      const seg = CONFIG.motifIn / motifPaths.length;
      tl.fromTo(card, { xPercent: -100 }, { xPercent: 0, duration: CONFIG.wipeIn,
                ease: "power4.inOut", immediateRender: false }, at);
      // L6 主题纹样：色块盖屏后立即一笔一笔描出来（背景层，不参与下面三层的错峰）
      motifPaths.forEach((p, i) => {
        tl.fromTo(p, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: seg, ease: "power2.inOut",
                  immediateRender: false }, at + CONFIG.wipeIn + 0.05 + i * seg);
      });
      tl
        // 编号先落位——先立骨架再上名字，层次不塌
        .fromTo(num, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1,
                duration: CONFIG.numIn, ease: "power3.out", immediateRender: false }, at + CONFIG.wipeIn)
        // 章节名从编号旁遮罩揭示
        .fromTo(name, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)",
                duration: CONFIG.nameIn, ease: "power3.out", immediateRender: false }, at + CONFIG.wipeIn + 0.18)
        // accent 短线：名字揭示完后长出（一章一色的签名）
        .fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: CONFIG.ruleIn, ease: "power3.out",
                immediateRender: false }, at + CONFIG.wipeIn + 0.18 + CONFIG.nameIn)
        .fromTo(sub, { opacity: 0, x: -14 }, { opacity: 0.6, x: 0, duration: 0.3,
                immediateRender: false }, at + CONFIG.wipeIn + 0.18 + CONFIG.subDelay)
        // hold：整组极缓漂移，防"卡帧感"；motif 慢 0.6× 做视差
        .fromTo([num, group], { x: 0 }, { x: CONFIG.driftPx, duration: CONFIG.hold + 0.5, ease: "none",
                immediateRender: false }, at + CONFIG.wipeIn)
        .fromTo(motif, { x: 0 }, { x: CONFIG.driftPx * CONFIG.motifParallax, duration: CONFIG.hold + 0.5, ease: "none",
                immediateRender: false }, at + CONFIG.wipeIn)
        // 出场：色块继续同方向扫出，露出口播画面
        .to(card, { xPercent: 100, duration: CONFIG.wipeOut, ease: "power4.in" },
            at + CONFIG.wipeIn + CONFIG.numIn + CONFIG.nameIn + CONFIG.hold);
    }

    DemoShell.register(({ speed }) => {
      const cards = document.querySelectorAll(".chapter-card");
      // 重播：动画状态重建
      cards.forEach((card) => {
        gsap.set(card, { xPercent: -100, visibility: "visible" });
        gsap.set(card.querySelector(".chapter-motif"), { x: 0 });
        gsap.set(card.querySelectorAll(".chapter-motif path"), { strokeDashoffset: 1 });
        gsap.set(card.querySelector(".chapter-num"), { opacity: 0, scale: 1.3, x: 0 });
        gsap.set(card.querySelector(".chapter-name"), { clipPath: "inset(0 100% 0 0)" });
        gsap.set(card.querySelector(".chapter-rule"), { scaleX: 0 });
        gsap.set(card.querySelector(".chapter-sub"), { opacity: 0, x: 0 });
        gsap.set(card.querySelector(".chapter-text").parentNode, { x: 0 });
      });

      const tl = gsap.timeline();
      tl.timeScale(speed);

      const oneCard = CONFIG.wipeIn + CONFIG.numIn + CONFIG.nameIn + CONFIG.hold + CONFIG.wipeOut;
      chapterBeat(tl, cards[0], 0.5);                                  // 章节 01
      chapterBeat(tl, cards[1], 0.5 + oneCard + CONFIG.gapBetween);    // 章节 02
    });
  </script>
</body>
</html>
