<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>metric-with-sparkline · 数字带趋势</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 演示语境（不属于动效）：主持人占位在右，左侧指标区；白底零装饰 —— */
  /* 47% ≈ 452px：给 427.7px 宽的数字人留 ≥10px 呼吸（人物不缩小、不截断、整体往中间挪，2026-08-25 定版） */
  .host-wrap {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 47%;
    overflow: hidden;
  }
  .metric-block {
    position: absolute;
    left: 96px;
    top: 138px;
    width: 400px;      /* = .spark 宽：盒子右缘 496，不伸进数字人那一列 */
  }
  .metric-block .label {
    font-size: 16px;
    font-weight: 400;
    color: #8a8a8a;
    letter-spacing: 3px;
    opacity: 0;
  }

  /* —— 动效本体 —— 大数字 + 单位 + 涨跌箭头同一条基线 —— */
  .big-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 10px;
    white-space: nowrap;                 /* 数字/单位/箭头必须同行，换行会把箭头挤下去 */
    font-variant-numeric: tabular-nums;  /* 命门：滚动计数不跳宽 */
  }
  .big-row .num {
    font-size: 86px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #2fb344;                      /* 唯一语义色：positive（只进数字/图表/涨跌标注） */
  }
  .big-row .unit {
    font-size: 34px;
    font-weight: 600;
    line-height: 1;
    color: #2fb344;
    opacity: 0;                          /* 计数结束后才淡入 */
  }
  .big-row .arrow {
    width: 20px;
    height: 34px;
    margin-left: 4px;
    opacity: 0;                          /* 计数结束后才弹入 */
  }
  .big-row .arrow svg { display: block; width: 100%; height: 100%; }

  /* 小折线图：与计数同时开始画 */
  .spark {
    margin-top: 30px;
    width: 400px;
  }
  .spark svg { display: block; width: 400px; height: 96px; overflow: visible; }
  .spark .base { stroke: #e0e0e0; stroke-width: 1; }
  .spark .xlabels {
    display: flex;
    justify-content: space-between;
    width: 400px;
    margin-top: 8px;
    font-size: 13px;
    color: #8a8a8a;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="metric-block">
      <div class="label">本周剪辑效率</div>
      <div class="big-row">
        <span class="num">0</span>
        <span class="unit">%</span>
        <span class="arrow">
          <svg viewBox="0 0 20 34" aria-hidden="true">
            <path d="M10 2 L19 14 H13.2 V32 H6.8 V14 H1 Z" fill="#2fb344"/>
          </svg>
        </span>
      </div>
      <div class="spark">
        <svg viewBox="0 0 400 96">
          <line class="base" x1="0" y1="90" x2="400" y2="90"></line>
          <g id="spark-draw"></g>
        </svg>
        <div class="xlabels"><span>周一</span><span>周二</span><span>周三</span><span>周四</span></div>
      </div>
    </div>
    <div class="host-wrap"><div class="host-placeholder"></div></div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ===== 可摘走的核心动画：CONFIG + register 内部 =====
    // 语义：一个数字的"结论"要等它算完才成立 —— 滚动期间不许出现单位和箭头；
    //       折线与计数同一刻起跑（数字和曲线讲的是同一件事，不是两件事）。
    const CONFIG = {
      target: 67,          // 计数终值
      lead: 0.3,           // 起手静置 s：等口播念到"效率"
      labelIn: 0.16,       // 小标签淡入 s
      countAt: 0.5,        // 计数起点 s（= 折线起点，两者必须同值）
      countDur: 0.9,       // 计数时长 s：<0.5 读作硬切，>1.4 观众等结论
      countEase: "power2.out",
      lineDur: 0.6,        // 折线画出时长 s：必须 < countDur，曲线先到位、数字后落定
      lineEase: "power1.inOut",
      unitIn: 0.2,         // 单位淡入 s（计数结束那一刻）
      arrowRise: 12,       // 箭头从下弹入的位移 px
      arrowScale: 0.8,     // 箭头起始缩放
      arrowIn: 0.2,        // 箭头弹入 s
      dotPop: 0.18,        // 数据点弹出 s
      hold: 1.8,           // 收尾定格 s
      // 折线点位（SVG 局部坐标，viewBox 0 0 400 96；改这里就换数据）
      pts: [[24, 74], [141, 60], [258, 44], [376, 16]],
      color: "#2fb344",
    };

    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs) => {
      const el = document.createElementNS(NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    };
    // power1.inOut 的反函数：把"线画到第 i 个点"的长度比例换算成时间比例，
    // 数据点才真的是"随线的推进"弹出，而不是按均分时间假装同步。
    const invPower1InOut = (y) =>
      y < 0.5 ? Math.sqrt(y / 2) : 1 - Math.sqrt((1 - y) / 2);

    DemoShell.register(({ speed }) => {
      const label = document.querySelector(".metric-block .label");
      const numEl = document.querySelector(".big-row .num");
      const unitEl = document.querySelector(".big-row .unit");
      const arrowEl = document.querySelector(".big-row .arrow");
      const drawG = document.getElementById("spark-draw");

      // —— 重播语义：数值归零、折线层清空重建 ——
      drawG.textContent = "";
      numEl.textContent = "0";
      gsap.set(label, { opacity: 0 });
      gsap.set(unitEl, { opacity: 0 });
      gsap.set(arrowEl, { opacity: 0, y: CONFIG.arrowRise, scale: CONFIG.arrowScale,
                          transformOrigin: "50% 100%" });

      // 折线 path + 四个数据点（点在线之上）
      const d = CONFIG.pts.map((p, i) => (i ? "L" : "M") + p[0] + "," + p[1]).join(" ");
      const line = mk("path", {
        d, fill: "none", stroke: CONFIG.color, "stroke-width": 3,
        "stroke-linejoin": "round", "stroke-linecap": "round",
      });
      drawG.appendChild(line);
      const dots = CONFIG.pts.map((p) => {
        const c = mk("circle", { cx: p[0], cy: p[1], r: 5, fill: "#ffffff",
                                 stroke: CONFIG.color, "stroke-width": 3 });
        drawG.appendChild(c);
        return c;
      });

      const tl = gsap.timeline();
      tl.timeScale(speed);

      // ① 小标签先淡入
      tl.to(label, { opacity: 1, duration: CONFIG.labelIn, ease: "power2.out" }, CONFIG.lead);

      // ② 大数字滚动计数（tabular-nums 防跳宽）
      const counter = { v: 0 };
      tl.to(counter, {
        v: CONFIG.target, duration: CONFIG.countDur, ease: CONFIG.countEase,
        onUpdate: () => { numEl.textContent = Math.round(counter.v); },
      }, CONFIG.countAt);

      // ④ 折线 dashoffset 画出 —— 与计数同刻起跑
      const L = line.getTotalLength();
      const dashL = Math.ceil(L) + 2;   // 整数长度：避免 GSAP 取整后段首漏出一小截笔画
      gsap.set(line, { strokeDasharray: dashL, strokeDashoffset: dashL });
      tl.to(line, { strokeDashoffset: 0, duration: CONFIG.lineDur, ease: CONFIG.lineEase },
            CONFIG.countAt);

      // 数据点跟着线端推进依次弹出（时间由线长比例反推）
      let acc = 0;
      const cum = CONFIG.pts.map((p, i) => {
        if (i) {
          const q = CONFIG.pts[i - 1];
          acc += Math.hypot(p[0] - q[0], p[1] - q[1]);
        }
        return acc;
      });
      dots.forEach((dot, i) => {
        // svgOrigin：SVG 元素的缩放锚点必须用用户坐标给（CSS transformOrigin 在
        // Chromium 下对 <circle> 的百分比解析基准是整个 SVG 而不是元素自身）
        gsap.set(dot, { scale: 0, svgOrigin: `${CONFIG.pts[i][0]} ${CONFIG.pts[i][1]}` });
        const at = CONFIG.countAt + CONFIG.lineDur * invPower1InOut(cum[i] / acc);
        tl.to(dot, { scale: 1, duration: CONFIG.dotPop, ease: "back.out(2)" }, at);
      });

      // ③ 计数结束那一刻：单位淡入 + 上箭头从下弹入（结论成立的一拍）
      const landAt = CONFIG.countAt + CONFIG.countDur;
      tl.to(unitEl, { opacity: 1, duration: CONFIG.unitIn, ease: "power2.out" }, landAt);
      tl.to(arrowEl, { opacity: 1, y: 0, scale: 1, duration: CONFIG.arrowIn,
                       ease: "power3.out" }, landAt);

      // ⑤ 收尾 hold：让观众读完整块指标
      tl.to({}, { duration: CONFIG.hold }, landAt + CONFIG.arrowIn);
    });
  </script>
</body>
</html>
