<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>gallery-wall-dolly · 照片墙推轨</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 照片墙推轨：三张平级案例挂在 rotateY −12° 的 3D 墙上，相机全景 → 逐张推近停靠（移动 → 真静止 → 下一张）→ 拉回全景与字同收。
     运镜纪律：相机层 .cam 是唯一被 transform 的元素（transform-origin 0 0，camTo 反解把目标点搬到画心），
     每一站的缩放绕当前图发生；停靠段相机真静止，但当前图内部 1 → 1.03 微推防死；其余照片压暗 + 景深虚化。
     （2026-09-06 由 multi-still-tour 拆出；有先后关系的几站用 timeline-photo-strip） —— */

  /* 相机层：全卡唯一被 transform 的元素 */
  .cam { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; transform-style: preserve-3d; }

  /* 白边卡 + 唯一投影 */
  .photo { position: absolute; background: #ffffff; padding: 10px; border-radius: 12px; box-shadow: 0 12px 60px rgba(0,0,0,.22); width: 430px; height: 290px; top: 125px; }
  .photo .frame { position: absolute; inset: 10px; border-radius: 5px; overflow: hidden; }
  /* 示意素材（演示语境，不属于动效；成片经 srcs 注入真图） */
  .ph { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 50%; }
  .ph::before { content: ""; position: absolute; inset: 0; }
  .ph.t1::before { background: url(../_lib/media/p-1015.jpg) center/cover no-repeat; }
  .ph.t2::before { background: url(../_lib/media/p-1036.jpg) center/cover no-repeat; }
  .ph.t3::before { background: url(../_lib/media/p-1039.jpg) center/cover no-repeat; }

  /* 深灰径向幕底（3D 墙上的白边照片靠深底 + 地面反光才读出"挂在墙上"，白底上像浮着的纸片；见卡片"底色要求"） */
  .world { position: absolute; inset: 0; perspective: 1200px; perspective-origin: 50% 50%; overflow: hidden;
           background: radial-gradient(ellipse at 50% 40%, #26262e, #0f0f13 75%); }
  .wall { position: absolute; left: 0; top: 0; width: 1700px; height: 540px; transform-style: preserve-3d; transform: rotateY(-12deg); transform-origin: 850px 270px; }
  .floor { position: absolute; left: -400px; right: -400px; top: 430px; height: 300px; background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 60%); transform: rotateX(80deg); transform-origin: top; }
  .tag { position: absolute; left: 24px; bottom: 24px; background: rgba(255,255,255,.94); color: #1d1d1f; font-size: 20px; font-weight: 700; padding: 6px 14px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
</style>
</head>
<body>
  <div id="stage">
    <!-- 三张 430×290 挂在 −12° 的 3D 墙上（墙宽 1700，墙心 (850, 270)），中心 x 355 / 855 / 1355 -->
    <div class="world"><div class="cam">
      <div class="wall">
        <div class="floor"></div>
        <div class="photo" style="left:140px"><div class="frame"><div class="ph t1"></div></div><div class="tag">案例一 · 品牌官网</div></div>
        <div class="photo" style="left:640px"><div class="frame"><div class="ph t2"></div></div><div class="tag">案例二 · 电商小程序</div></div>
        <div class="photo" style="left:1140px"><div class="frame"><div class="ph t3"></div></div><div class="tag">案例三 · 数据看板</div></div>
      </div>
    </div></div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ——————————————————————————————————————————————————————————
    // 可摘走的核心动画：照片墙推轨
    // 运镜纪律：① 相机层是唯一被 transform 的元素，camTo(z, px, py) 反解到画心 ⇒ 每一站的缩放绕当前图发生
    //          ② 停靠段相机真静止（停靠类例外，不续走），但当前图内部 1 → 1.03 微推防死；其余图压暗 + 景深虚化
    //          ③ 巡完必拉回全景；全景停留结束与字同收
    // ——————————————————————————————————————————————————————————
    const CONFIG = {
      wallRy: -12,      // 墙的 rotateY（≤25° 才可读）
      wideZ: 0.61,      // 全景焦距（透视下近端更宽：.61 时三张投影两侧各留 53px；实验室 .72 会切掉第三张）
      wideAt: 942,      // 全景的相机目标 x（墙坐标）：三张投影包围盒居中解出，不是墙心 850
      stopZ: 1.15,      // 停靠焦距（放大 ≤1.2）
      move: 1.0,        // 站间移动（power2.inOut）
      hold: 0.9,        // 停靠（相机真静止）
      lead: 0.8,        // 起手全景停留
      pull: 1.2,        // 拉回全景
      dim: 0.5, blur: 3, // 停靠时其余照片：brightness .5 + blur 3px（0.5s，从移动中段起）
      push: 1.03,       // 停靠段当前照片内部微推（时长 hold + 0.3，从移动 70% 处起）
      exit: 0.4,        // 拉回后照片一起退场（错峰 0.04）
      end: 8.2,         // 总长（含退场）
      centers: [355, 855, 1355], pivot: 850,   // 三张照片中心 x（y 均 270）/ 墙的旋转轴 x
    };
    /* 时间表：0–0.8 全景（z .61） · 0.8 / 2.7 / 4.6 依次推到三张（移 1.0 + 停 0.9，压暗从移动 0.5s 起、微推从 0.7s 起）
       · 6.5–7.7 拉回全景（压暗 6.8 起 0.6s 复原）· 7.7–8.18 照片退场 · 8.2 结束 */

    // 把世界坐标 (px, py) 以焦距 z 搬到画心的相机变换（transform-origin 0 0）。相机层不是满铺素材、底是静态幕底，无"露边"问题，故不钳制。
    const camTo = (z, px, py) => ({ scale: z, x: 480 - z * px, y: 270 - z * py });
    // 墙绕 x=850 转了 −12°：照片中心投影到相机层的 x 是旋转后的坐标（否则每站偏心 11~14px）
    const wallX = (x) => CONFIG.pivot + (x - CONFIG.pivot) * Math.cos(CONFIG.wallRy * Math.PI / 180);

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];

    DemoShell.register(({ speed }) => {
      const C = CONFIG;
      const tl = gsap.timeline();
      tl.timeScale(speed);
      const cam = $(".cam"), photos = $$(".photo"), phs = photos.map((p) => p.querySelector(".ph"));   // 每张照片自己的 .ph（$ 是单参）
      const wide = camTo(C.wideZ, C.wideAt, 270);
      tl.set(cam, { ...wide }, 0).set(photos, { filter: "brightness(1) blur(0px)", opacity: 1 }, 0).set(phs, { scale: 1 }, 0);
      let t = C.lead;
      C.centers.forEach((cx, i) => {
        tl.to(cam, { ...camTo(C.stopZ, wallX(cx), 270), duration: C.move, ease: "power2.inOut" }, t);                  // 推到第 i 张（绕它缩放）
        photos.forEach((p, j) => tl.to(p, { filter: `brightness(${i === j ? 1 : C.dim}) blur(${i === j ? 0 : C.blur}px)`, duration: 0.5 }, t + C.move * 0.5));   // 其余：压暗 + 景深虚化
        tl.to(phs[i], { scale: C.push, duration: C.hold + 0.3, ease: "none" }, t + C.move * 0.7);                     // 停靠段内部微推防死
        t += C.move + C.hold;
      });
      tl.to(cam, { ...wide, duration: C.pull, ease: "power2.inOut" }, t);                                              // 拉回全景
      photos.forEach((p) => tl.to(p, { filter: "brightness(1) blur(0px)", duration: 0.6 }, t + 0.3));
      tl.to(photos, { opacity: 0, duration: C.exit, stagger: 0.04, ease: "power2.in" }, t + C.pull);                   // 字与画同收
      tl.set({}, {}, C.end);   // 钉住总长 8.2
    });
  </script>
</body>
</html>
