<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>timeline-photo-strip · 时间线照片带</title>
<link rel="stylesheet" href="../_lib/demo-shell.css">
<style>
  /* —— 时间线照片带：有先后的几站沿一条时间线上下交替，相机横移逐站停靠（移动 → 真静止 → 下一站）→ 拉开看全条、停一拍再与字同收。
     运镜纪律：相机层 .cam 是唯一被 transform 的元素（transform-origin 0 0，camTo 反解把目标点搬到画心）；
     停靠 z 1.05 让邻站明确出画（1.0 时邻站与画幅边齐平读作贴边）；停靠段当前站 1.03 点亮防死、其余 .7。
     （2026-09-06 由 multi-still-tour 拆出；平级的几个例子用 gallery-wall-dolly） —— */

  .cam { position: absolute; inset: 0; width: 1600px; transform-origin: 0 0; will-change: transform; }

  .photo { position: absolute; background: #ffffff; padding: 10px; border-radius: 12px; box-shadow: 0 12px 60px rgba(0,0,0,.22); width: 240px; height: 160px; transform-origin: 50% 50%; }
  .photo .frame { position: absolute; inset: 10px; border-radius: 5px; overflow: hidden; }
  /* 示意素材（演示语境，不属于动效；成片经 srcs 注入真图） */
  .ph { position: absolute; inset: 0; overflow: hidden; }
  .ph::before { content: ""; position: absolute; inset: 0; }
  .ph.t1::before { background: url(../_lib/media/p-0.jpg) center/cover no-repeat; }
  .ph.t2::before { background: url(../_lib/media/p-180.jpg) center/cover no-repeat; }
  .ph.t3::before { background: url(../_lib/media/p-60.jpg) center/cover no-repeat; }
  .ph.t4::before { background: url(../_lib/media/p-1059.jpg) center/cover no-repeat; }

  .tl-line { position: absolute; left: 60px; top: 300px; width: 1500px; height: 3px; background: #1d1d1f; border-radius: 2px; }
  .cap { position: absolute; font-size: 22px; font-weight: 700; color: #1d1d1f; white-space: nowrap; }   /* 22 → 停靠 23 / 拉开 13.6（≈27@1080，最小可读边） */
</style>
</head>
<body>
  <div id="stage">
    <!-- 四站站距 360，上下交替（上 top 90 / 下 top 330），时间线 y 300；日期 caption 靠线一侧 -->
    <div class="cam">
      <div class="tl-line"></div>
      <div class="photo" style="left:120px;top:90px"><div class="frame"><div class="ph t1"></div></div></div><div class="cap" style="left:126px;top:318px">2019 · 一台笔记本</div>
      <div class="photo" style="left:480px;top:330px"><div class="frame"><div class="ph t2"></div></div></div><div class="cap" style="left:486px;top:266px">2021 · 有了工位</div>
      <div class="photo" style="left:840px;top:90px"><div class="frame"><div class="ph t3"></div></div></div><div class="cap" style="left:846px;top:318px">2023 · 全套设备</div>
      <div class="photo" style="left:1200px;top:330px"><div class="frame"><div class="ph t4"></div></div></div><div class="cap" style="left:1206px;top:266px">2026 · 自己的工作室</div>
    </div>
  </div>

  <script src="../_lib/gsap.min.js"></script>
  <script src="../_lib/demo-shell.js"></script>
  <script>
    // ——————————————————————————————————————————————————————————
    // 可摘走的核心动画：时间线照片带
    // 运镜纪律：① 相机层是唯一被 transform 的元素，camTo(z, px, py) 反解到画心
    //          ② 停靠段相机真静止，当前站 1.03 点亮防死、其余 .7
    //          ③ 走完必拉开看全条；有意停留结束与字同收
    // ——————————————————————————————————————————————————————————
    const CONFIG = {
      stopZ: 1.05,      // 停靠焦距：邻站出画 24px（1.0 时邻站与画幅边齐平、邻站 caption 离边 6px，读作贴边）；上排照片离顶 49.5
      wideZ: 0.62,      // 拉开看全条的焦距
      move: 0.9,        // 站间横移（power2.inOut）
      hold: 1.0,        // 每站停留
      lead: 0.4,        // 起手：第一站先停一拍再点亮
      pull: 1.1,        // 拉开
      tailHold: 1.2,    // 拉开后看全条的有意停留
      dim: 0.7,         // 非当前站 brightness
      focus: 1.03,      // 当前站放大 1.03（0.4s，从移动中段起）
      exit: 0.4,        // 退场：caption + 时间线 → 照片，错峰 0.04
      end: 9.9,         // 总长（含退场）
      centers: [240, 600, 960, 1320], stripCenter: [780, 300],   // 四站中心 x / 全条中心
    };
    /* 时间表：0 第一站居中 · 0.4 点亮 · 1.4 / 3.3 / 5.2 横移到二三四站（移 0.9 + 停 1.0，点亮从移动 0.5s 起）
       · 7.1–8.2 拉开看全条（7.4 起 0.5s 全部复原）· 8.2–9.4 停 · 9.4–9.84 退场 · 9.9 结束 */

    const camTo = (z, px, py) => ({ scale: z, x: 480 - z * px, y: 270 - z * py });
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];

    DemoShell.register(({ speed }) => {
      const C = CONFIG;
      const tl = gsap.timeline();
      tl.timeScale(speed);
      const cam = $(".cam"), photos = $$(".photo"), caps = $$(".cap"), line = $(".tl-line");
      const wide = camTo(C.wideZ, C.stripCenter[0], C.stripCenter[1]);
      tl.set(cam, { ...camTo(C.stopZ, C.centers[0], 270) }, 0).set(photos, { filter: `brightness(${C.dim})`, scale: 1, opacity: 1 }, 0).set([...caps, line], { opacity: 1 }, 0);
      let t = C.lead;
      C.centers.forEach((cx, i) => {
        if (i) tl.to(cam, { ...camTo(C.stopZ, cx, 270), duration: C.move, ease: "power2.inOut" }, t);                 // 横移到第 i 站
        photos.forEach((p, j) => tl.to(p, { filter: `brightness(${i === j ? 1 : C.dim})`, scale: i === j ? C.focus : 1, duration: 0.4 }, t + (i ? C.move * 0.5 : 0)));   // 当前站亮 + 1.03
        t += (i ? C.move : 0) + C.hold;
      });
      tl.to(cam, { ...wide, duration: C.pull, ease: "power2.inOut" }, t);                                              // 拉开看全条
      photos.forEach((p) => tl.to(p, { filter: "brightness(1)", scale: 1, duration: 0.5 }, t + 0.3));
      const tOut = t + C.pull + C.tailHold;                                                                            // 有意停留结束
      tl.to([...caps, line], { opacity: 0, duration: C.exit, ease: "power2.in" }, tOut)                                // 字与画同收
        .to(photos, { opacity: 0, duration: C.exit, ease: "power2.in" }, tOut + 0.04);
      tl.set({}, {}, C.end);   // 钉住总长 9.9
    });
  </script>
</body>
</html>
